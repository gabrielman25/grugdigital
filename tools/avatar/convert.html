<!-- tools/avatar/convert.html: Kenney's FBX (source/characterMedium.fbx + source/idle|run|jump.fbx) → model/avatar.glb.
     Renames the joints to the classic avatar's names (spine_M_00_jnt, arm_R_wrist_jnt …) and keeps idle, run and jump.
     Serve tools/avatar/ over http (python3 -m http.server), open this page, then save the download as model/avatar.glb. -->
<body style="font:16px system-ui;padding:20px">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.149.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.149.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
const L = new FBXLoader(); const load = u => new Promise((a,b)=>L.load(u,a,undefined,b));
const MAP = { Hips:'spine_M_00_jnt', Spine:'spine_M_01_jnt', Chest:'spine_M_03_jnt', UpperChest:'spine_M_05_jnt', Neck:'head_M_neck_jnt', Head:'head_M_head_jnt', Head_end:'head_M_end_jnt' };
for (const [K,s] of [['Left','L'],['Right','R']]) Object.assign(MAP, {
  [K+'Shoulder']:`clavicle_${s}_00_jnt`, [K+'Arm']:`arm_${s}_shldr_jnt`, [K+'ForeArm']:`arm_${s}_elbow_jnt`, [K+'Hand']:`arm_${s}_wrist_jnt`,
  [K+'HandIndex1']:`pointer_${s}_01_jnt`, [K+'HandIndex2']:`pointer_${s}_02_jnt`, [K+'HandIndex3']:`pointer_${s}_03_jnt`, [K+'HandIndex3_end']:`pointer_${s}_04_jnt`,
  [K+'HandThumb1']:`thumb_${s}_01_jnt`, [K+'HandThumb2']:`thumb_${s}_02_jnt`, [K+'HandThumb2_end']:`thumb_${s}_03_jnt`,
  [K+'UpLeg']:`leg_${s}_upr_jnt`, [K+'Leg']:`leg_${s}_knee_jnt`, [K+'Foot']:`leg_${s}_foot_jnt`, [K+'Toes']:`leg_${s}_ball_jnt`, [K+'Toes_end']:`leg_${s}_toe_jnt` });
const m = await load('source/characterMedium.fbx');
m.traverse(o => { if (o.isBone && MAP[o.name]) o.name = MAP[o.name]; });
let mesh; m.traverse(o => { if (o.isSkinnedMesh) mesh = o; });
mesh.name = 'body';
const g = mesh.geometry; g.deleteAttribute('color');
mesh.material = new THREE.MeshStandardMaterial({ name: 'skin', roughness: 1 });
const clips = [];
for (const [file, want, name] of [['idle','Root|Idle','idle'],['run','Root|Run','run'],['jump','Root|Jump','jump']]) {
  const a = await load('source/' + file + '.fbx'); const c = a.animations.find(x => x.name === want);
  const tracks = [];
  for (const t of c.tracks) { const [bn, prop] = t.name.split('.'); if (!MAP[bn] || prop === 'scale') continue; if (prop === 'position' && bn !== 'Hips') continue; t.name = MAP[bn] + '.' + prop; tracks.push(t); }
  const clip = new THREE.AnimationClip(name, c.duration, tracks); clip.optimize(); clips.push(clip);
}
const ex = new GLTFExporter();
const glb = await new Promise((ok, no) => ex.parse(m, ok, no, { binary: true, animations: clips, onlyVisible: false }));
const u8 = new Uint8Array(glb); let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
const bones = []; m.traverse(o => { if (o.isBone) bones.push(o.name); });
window.OUT = { size: u8.length, clips: clips.map(c => [c.name, c.duration, c.tracks.length]), bones: bones.join(' ') };
// save it: a download link (model/avatar.glb)
const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([glb], { type: 'model/gltf-binary' })); a.download = 'avatar.glb'; a.textContent = 'Download avatar.glb (' + u8.length + ' bytes)'; document.body.appendChild(a);
</script>
