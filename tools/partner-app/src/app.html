<!-- Grug partner rewards app template (tools/partner-app/README.md). Double-brace tokens are filled from partners/<id>/config.json by build.py. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><script>/* old address → new home */(function(){var p=location.pathname;if(location.hostname==='gabrielman25.github.io'&&p.indexOf('/grugdigital/')===0)location.replace('https://grugdigital.pages.dev/'+p.slice(13)+location.search+location.hash);})();</script>
<meta name="robots" content="noindex">
<meta name="description" content="A concept demo rewards app made for {{name}} in {{place}}. For presentation only.">
<link rel="icon" href="logo.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>{{name}} · {{appTitle}} (concept demo)</title>
<!-- the site's custom cursor (a cursor the app sets itself still wins) -->
<script src="../../assets/cursors.js"></script>
<!-- the freeze on every branded page: a demonstration only, nothing is earned, bought or redeemed (assets/demo.js) -->
<script src="../../assets/demo.js"></script>
<style>
/* the partner's typefaces ("Bricolage" is the body face's name inside the app for every partner; "Display" is for headings and
   falls back to the body face when the partner has no second one) */
@font-face{font-family:"Bricolage";src:url(data:font/woff2;base64,__FONT__) format("woff2");font-weight:200 800;font-display:block}
@font-face{font-family:"Display";src:url(data:font/woff2;base64,__FONT_DISPLAY__) format("woff2");font-weight:200 800;font-display:block}
:root{
  --bg:#fff;--ink:#0d0d0d;--mut:#6b6f76;--card:#f4f4f2;--card2:#eceae6;--line:#e7e5e0;
  --gold:{{color.accent}};--gold-d:{{color.accentDark}};--gold-l:{{color.accentLight}};--slate:{{color.deep}};--slate-d:{{color.deepDark}};--cream:{{color.cream}};
  --green:#2f5e49;--red:#b8402f;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --display:"Display","Bricolage",system-ui,sans-serif;
}
h1,h2,h3,.tile b,.tier b,.win b,.hc-b b,.theme b{font-family:var(--display)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:{{color.deepDark}};overscroll-behavior:none}
body{font-family:"Bricolage",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit}
h1,h2,h3,p{margin:0}
svg.i{width:20px;height:20px;display:block;flex:none}
#app,.overlay{position:fixed;inset:0;width:100%;overflow:hidden}
#app{background:var(--bg);display:flex;flex-direction:column}
.overlay{display:none;z-index:30}
.overlay.on{display:block}

/* header: the partner top bar, shared with the Grug site (keep the .ptb block identical in assets/grug.css) */
.ptb{display:flex;align-items:center;gap:8px;height:calc(env(safe-area-inset-top,0px) + 64px);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;background:#fff;box-shadow:0 1px 0 rgba(13,13,13,.07);font-family:"RR Bricolage","Bricolage",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#0d0d0d;-webkit-font-smoothing:antialiased;box-sizing:border-box;border-radius:0;border:0}
.ptb-logo{position:relative;display:block;flex:none;height:44px;margin:0 0 0 -2px;padding:0;background:none;border:0;text-decoration:none;box-shadow:none}
.ptb-logo img{display:block;height:44px;width:auto;max-width:none;background:none;padding:0;border-radius:0;box-shadow:none}
.ptb-demo{position:absolute;right:-12px;bottom:-3px;font-size:9.5px;font-weight:750;letter-spacing:.1em;line-height:1;text-transform:uppercase;background:{{color.deep}};color:{{color.accent}};border:0;border-radius:6px;padding:3px 5px}
.ptb-sp{flex:1;min-width:0}
.ptb-wallet{display:flex;align-items:center;gap:6px;height:42px;padding:0 9px 0 7px;border:0;border-radius:21px;background:#0d0d0d;color:#fff;font-family:inherit;font-size:16px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;text-decoration:none;cursor:pointer;flex:none;box-shadow:none}
.ptb-coin{display:block;width:26px;height:26px;background:center/contain no-repeat;flex:none}
.ptb-plus{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:{{color.accent}};color:#201a08}
.ptb-plus svg{width:11px;height:11px;display:block}
.ptb-fs{display:grid;place-items:center;width:42px;height:42px;margin:0;padding:0;border:0;border-radius:50%;background:#f4f4f2;color:#0d0d0d;cursor:pointer;flex:none;box-shadow:none}
.ptb-fs svg{width:18px;height:18px;display:block}
.ptb-fs[aria-pressed=true]{background:#0d0d0d;color:#fff}
.ptb-av{display:block;width:42px;height:42px;min-height:0;margin:0;padding:0;border:0;border-radius:50%;background:{{color.cream}} center/cover no-repeat;box-shadow:inset 0 0 0 2px {{color.accent}};cursor:pointer;flex:none}
.ptb a:active,.ptb button:active{transform:scale(.95)}
#top{flex:none}
#wallet.bump{animation:bump .35s}
.ptb-coin{background-image:var(--coin)}
:root{--coin:url(coin.png)}
@keyframes bump{40%{transform:scale(1.14)}}
.c{display:inline-block;width:1.3em;height:1.3em;vertical-align:-.3em;background:var(--coin) center/contain no-repeat;flex:none}
.c.lg{width:26px;height:26px}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.av{border-radius:50%;background:var(--cream) center/cover no-repeat;flex:none;overflow:hidden}

/* views */
#views{flex:1;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:6px max(16px,calc((100% - 980px) / 2)) 28px;display:none;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.view::-webkit-scrollbar,.hs::-webkit-scrollbar{display:none}
.view.on{display:block;animation:vin .28s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(10px)}}
h1{font-size:28px;line-height:1.1;font-weight:750;letter-spacing:-.02em}
h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:26px 0 12px}
.sub{color:var(--mut);font-size:14.5px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--gold-d)}
.card{background:var(--card);border-radius:20px;padding:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 22px;border-radius:26px;background:var(--ink);color:#fff;font-weight:650;font-size:16px;width:100%;transition:transform .12s}
.btn:active,.tile:active,.pack:active,.opt:active,.theme:active{transform:scale(.97)}
.btn.gold{background:var(--gold);color:#1d1705}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{height:42px;font-size:14.5px;width:auto;padding:0 18px}
.btn[disabled]{background:var(--card2);color:#9a9a96}
.btn svg{width:18px;height:18px}
.gingham{height:10px;background-color:#fff;background-image:linear-gradient(90deg,rgba(13,13,13,.72) 50%,transparent 50%),linear-gradient(rgba(13,13,13,.72) 50%,transparent 50%);background-size:10px 10px}
.demo-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:8px;background:var(--card2);color:var(--mut)}
.itile{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff;background:var(--slate)}
.itile svg{width:22px;height:22px}
.itile.gold{background:var(--gold);color:#1d1705}

/* home */
.passhero{background:var(--slate);color:#fff;border-radius:24px;overflow:hidden;margin-top:14px}
.passhero .in{padding:18px}
.passhero .eyebrow{color:var(--gold)}
.passhero h3{font-size:22px;font-weight:700;margin:4px 0 12px;letter-spacing:-.01em}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.16);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--gold-d),var(--gold),var(--gold-l));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.passhero .row{display:flex;justify-content:space-between;font-size:13.5px;color:rgba(255,255,255,.75);margin-top:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tile{position:relative;border-radius:20px;padding:14px;min-height:158px;background:var(--card);text-align:left;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;transition:transform .12s}
.tile b{font-size:18px;font-weight:700;letter-spacing:-.01em;position:relative}
.tile span{font-size:13.5px;color:var(--mut);position:relative}
.tile .thumbs{position:absolute;top:12px;left:26px;display:flex}
.tile .thumbs img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2.5px solid var(--card);margin-left:-14px}
.daily{display:flex;align-items:center;gap:12px;margin-top:12px}
.daily .t{flex:1}
.daily b{display:block;font-size:16px}
.hs{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none;scroll-snap-type:x proximity}
/* on the Grug site: the games as floating FOSSIL32 cartridges (the same ones as the Grug home page), one looping row,
   the middle one big; tapping it opens the cartridge and its Play button (assets/fossil32/) */
.hc{position:relative;margin:0 calc(50% - 50vw);min-height:calc(min(290px,60vw) * .75 + 58px)}
.hc-row{--tw:min(290px,60vw);display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scrollbar-width:none;
  padding:0 calc(50vw - var(--tw) / 2) 6px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.hc-row::-webkit-scrollbar{display:none}
.hc-row.drag{scroll-snap-type:none;cursor:grabbing}
.hc-t{flex:none;width:var(--tw);scroll-snap-align:center;display:block;color:var(--ink);text-decoration:none;transform:scale(calc(1 - var(--d,1) * .2));opacity:calc(1 - var(--d,1) * .5);will-change:transform}
.hc-t:focus-visible{outline:none}
.hc-t:focus-visible .f32-stage{outline:3px solid var(--gold);outline-offset:-6px;border-radius:24px}
.hc-t .f32-stage{overflow:visible;background:none}
.hc-t .f32-flat{left:22%;width:56%;top:20%;height:50%}
.hc-t .f32-ribbon{right:auto;left:50%;top:auto;bottom:2px;transform:translateX(-50%);white-space:nowrap;font-family:"Bricolage",system-ui,sans-serif;font-weight:800;background:var(--gold);color:#1d1705;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.hc-b{text-align:center;padding:0 6px;margin-top:-2px;transition:opacity .2s}
.hc-b b{display:block;font-size:19px;font-weight:800;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-b span{font-size:13px;color:var(--mut)}
.hc-t:not(.on) .hc-b{opacity:.55}
.hc-cap{text-align:center;font-size:13px;color:var(--mut);margin:2px 0 4px}
/* the cartridge's game panel: the page behind goes soft, and the panel is centred and in the partner's lettering */
#app{transition:filter .8s ease}
html.f32-lock #app{filter:blur(9px) brightness(.6) saturate(1.1)}
.f32-ov{--display:"Bricolage",system-ui,sans-serif;--f32-accent:{{color.accent}}}
.f32-ov .f32-desc,.f32-ov .f32-chips span,.f32-ov .f32-feats li,.f32-ov .f32-stats,.f32-ov .f32-more{font-family:"Bricolage",system-ui,sans-serif}
.f32-ov .f32-panel{text-align:center}
.f32-ov .f32-chips,.f32-ov .f32-actions{justify-content:center}
.f32-ov .f32-feats{display:inline-grid;text-align:left}
.fav{flex:none;width:150px;text-align:left;scroll-snap-align:start}
.fav img{width:150px;height:150px;border-radius:18px;object-fit:cover;display:block;background:var(--card)}
.fav b{display:block;font-size:15px;margin-top:8px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav span{font-size:13.5px;color:var(--mut)}
.cta{display:flex;gap:14px;align-items:center;border-radius:20px;padding:16px;background:var(--cream);margin-top:12px;text-align:left;width:100%;text-decoration:none;color:inherit}
.cta.dark{background:var(--ink);color:#fff}
.cta .t{flex:1}
.cta b{display:block;font-size:16.5px;font-weight:700}
.cta span{font-size:13.5px;opacity:.72}
.cta>svg{width:20px;height:20px;flex:none}
.cta.grug{background:linear-gradient(120deg,#1f2b55,#3b2a6e);color:#fff;position:relative;overflow:hidden}
.cta.grug .gem{width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
.cta.grug .gem svg{width:26px;height:26px;color:#9fe7ff}
.cta.grug .new{position:absolute;top:10px;right:12px;font-size:10.5px;font-weight:800;letter-spacing:.1em;background:#9fe7ff;color:#13204a;border-radius:7px;padding:2px 6px}
.cta.grug.pop{animation:grugin .7s cubic-bezier(.2,1.3,.3,1)}
@keyframes grugin{from{opacity:0;transform:translateY(16px) scale(.94)}}
.foot{margin-top:22px;text-align:center;font-size:12px;color:#9a9a96;line-height:1.5}

/* menu */
.chips{position:sticky;top:-6px;z-index:5;background:#fff;margin:0 -16px;padding:8px 16px 10px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 16px;border-radius:20px;background:var(--card);font-size:14.5px;font-weight:600;white-space:nowrap;transition:background .2s,color .2s;display:flex;align-items:center;gap:6px}
.chip svg{width:16px;height:16px}
.chip.on{background:var(--ink);color:#fff}
.mi{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);text-align:left;width:100%;align-items:flex-start}
.mi .t{flex:1;min-width:0}
.mi b{display:block;font-size:16.5px;font-weight:650}
.mi .pr{font-size:14.5px;margin:2px 0 4px}
.mi .ds{font-size:13.5px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mi img{width:96px;height:96px;border-radius:16px;object-fit:cover;flex:none;background:var(--card)}
.mi .top{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-d);margin-bottom:2px}
.mi .top svg{width:12px;height:12px}
.mi.plain{padding:11px 0}
.mi.plain b{font-size:15.5px;font-weight:600}
.sauces{display:grid;grid-template-columns:1fr 1fr;column-gap:18px}
.sauces div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.sauces span{color:var(--mut)}

/* tabs */
#tabs{flex:none;display:flex;gap:2px;width:min(calc(100% - 24px),456px);margin:0 auto calc(var(--sab) + 8px);padding:5px;border-radius:30px;background:#efeeea;box-shadow:0 6px 22px rgba(0,0,0,.22)}
#tabs button{flex:1;height:50px;border-radius:25px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600;color:#55585e;transition:background .2s}
#tabs button svg{width:19px;height:19px}
#tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 5px rgba(0,0,0,.09)}

/* pass */
.track{position:relative;margin-top:18px;padding-left:44px}
.track:before{content:"";position:absolute;left:17px;top:18px;bottom:40px;width:4px;border-radius:2px;background:var(--card2)}
.track .fill{position:absolute;left:17px;top:18px;width:4px;border-radius:2px;background:linear-gradient(var(--gold),var(--gold-d));transition:height 1s cubic-bezier(.2,.8,.2,1)}
.tier{position:relative;background:var(--card);border-radius:20px;padding:14px 16px;margin-bottom:12px}
.tier .node{position:absolute;left:-44px;top:14px;width:38px;height:38px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:750;font-size:14px;color:#8b8b86;border:3px solid #fff}
.tier .node svg{width:16px;height:16px}
.tier.open .node{background:var(--gold);color:#1d1705}
.tier.open{background:var(--cream)}
.tier .vn{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--mut)}
.tier b{display:block;font-size:17.5px;font-weight:700;margin:1px 0}
.tier .rw{font-size:14.5px;color:#3d3f44}
.tier .btn{margin-top:12px}
.tier .done{margin-top:10px;font-size:13.5px;font-weight:650;color:var(--green);display:flex;align-items:center;gap:6px}
.tier .done svg{width:15px;height:15px}
.tier .lock{margin-top:8px;font-size:13.5px;color:var(--mut);display:flex;align-items:center;gap:6px}
.tier .lock svg{width:14px;height:14px}

/* store */
.storehero{background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--slate) 80%,#fff),var(--slate-d) 70%);border-radius:24px;color:#fff;text-align:center;padding:10px 16px 20px;margin-top:8px;overflow:hidden}
.storehero canvas{width:190px;height:190px;display:block;margin:0 auto;touch-action:none;cursor:grab}
.storehero .bal{font-size:40px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.storehero .sub{color:rgba(255,255,255,.7);margin-top:4px}
.check-note{display:flex;gap:12px;align-items:center;background:var(--cream);border-radius:18px;padding:14px;margin-top:12px;font-size:14.5px}
.pack{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border-radius:20px;padding:14px 14px 14px 16px;margin-bottom:10px;position:relative;transition:transform .12s}
.pack .stack{width:58px;height:58px;position:relative;flex:none}
.pack .stack i{position:absolute;width:34px;height:34px;background:var(--coin) center/contain no-repeat}
.pack .t{flex:1}
.pack b{display:block;font-size:19px;font-weight:750;font-variant-numeric:tabular-nums}
.pack span{font-size:13.5px;color:var(--mut)}
.pack .price{height:44px;padding:0 16px;border-radius:22px;background:var(--ink);color:#fff;font-weight:700;display:grid;place-items:center;font-size:15.5px}
.pack .flag{position:absolute;top:-7px;left:16px;background:var(--gold);color:#1d1705;font-size:11px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;border-radius:8px;padding:2px 8px}
.tabline{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.uses{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.uses .card{padding:14px;font-size:13.5px;color:var(--mut)}
.uses b{display:block;color:var(--ink);font-size:15.5px;margin:8px 0 2px}

/* sheet */
#sheetWrap{position:fixed;inset:0;z-index:60;display:none}
#sheetWrap.on{display:block}
#scrim{position:absolute;inset:0;background:rgba(10,14,15,.5);opacity:0;transition:opacity .25s}
#sheetWrap.show #scrim{opacity:1}
#sheet{position:absolute;left:50%;bottom:0;width:100%;max-width:480px;transform:translate(-50%,105%);background:#fff;border-radius:28px 28px 0 0;max-height:92%;overflow-y:auto;transition:transform .34s cubic-bezier(.2,.9,.25,1);padding:0 18px calc(var(--sab) + 18px);scrollbar-width:none}
#sheetWrap.show #sheet{transform:translate(-50%,0)}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--card2);margin:10px auto 14px}
#sheet .x{position:absolute;top:14px;right:14px;z-index:2;background:#fff}
#sheet .hero{margin:-29px -18px 16px;height:300px;background:var(--card) center/cover;border-radius:28px 28px 0 0}
#sheet h3{font-size:24px;font-weight:750;letter-spacing:-.02em}
#sheet p{color:#44474c;margin:8px 0 0;font-size:15.5px}
#sheet .btn{margin-top:14px}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:18px;padding:10px 12px 10px 16px;margin-top:14px}
.stepper .n{display:flex;align-items:center;gap:14px;font-weight:750;font-size:20px;font-variant-numeric:tabular-nums}
.stepper button{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center}
.stepper button svg{width:16px;height:16px}
.sending{text-align:center;padding:26px 0 8px}
.sending .ring{width:74px;height:74px;border-radius:50%;border:5px solid var(--card2);border-top-color:var(--gold);margin:0 auto 16px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.okmark{width:74px;height:74px;border-radius:50%;background:var(--green);color:#fff;margin:0 auto 16px;display:grid;place-items:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.okmark svg{width:34px;height:34px}
@keyframes pop{from{transform:scale(0)}}
.field{width:100%;height:54px;border-radius:16px;border:0;background:var(--card);padding:0 16px;font-size:18px;outline:none;margin-top:12px;user-select:text;-webkit-user-select:text}
.field:focus{box-shadow:inset 0 0 0 2px var(--ink)}
.rowbtns{display:flex;gap:10px}
/* app themes (config "themes"): bought with coins or won on the Season Pass; a theme recolours the dark panels and the accent */
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.theme{position:relative;display:flex;flex-direction:column;text-align:left;border-radius:20px;overflow:hidden;background:var(--card);transition:transform .12s}
.theme .sw{height:74px;display:flex;align-items:flex-end;gap:6px;padding:10px 12px}
.theme .sw i{width:22px;height:22px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.theme .in{padding:10px 12px 12px}
.theme b{display:block;font-size:16.5px;font-weight:700}
.theme span{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:4px}
.theme.on{box-shadow:inset 0 0 0 2.5px var(--ink)}
.theme .tag{font-style:normal;position:absolute;top:8px;right:8px;font-size:10.5px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;background:#fff;color:var(--ink);border-radius:8px;padding:2px 7px}
.mi .pr:empty{display:none}
.games{display:flex;flex-direction:column;gap:10px}
.prof{display:flex;align-items:center;gap:14px}
.prof .av{width:72px;height:72px;box-shadow:0 0 0 3px var(--gold)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 92px);transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:22px;font-size:14.5px;font-weight:600;opacity:0;transition:.25s;z-index:80;pointer-events:none;text-align:center;width:max-content;max-width:min(88vw,420px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:90;pointer-events:none}

/* onboarding */
#onb{background:radial-gradient(130% 80% at 50% 42%,{{color.deep}},{{color.deepDark}} 70%);color:#fff;z-index:70}
#onb .step{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;text-align:center;padding:calc(var(--sat) + 26px) max(26px,calc((100% - 460px) / 2)) calc(var(--sab) + 26px)}
#onb .step.on{display:flex}
#onb .step.on>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
#onb .step.on>*:nth-child(2){animation-delay:.08s}#onb .step.on>*:nth-child(3){animation-delay:.16s}#onb .step.on>*:nth-child(4){animation-delay:.24s}#onb .step.on>*:nth-child(5){animation-delay:.32s}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
#onb h1{font-size:34px;margin-top:8px}
#onb .sub{color:rgba(255,255,255,.72);font-size:16.5px;margin-top:10px;max-width:320px}
#onb .grow{flex:1}
#onb .plate{width:224px;height:224px;border-radius:50%;background:#fff;margin-top:8vh;display:grid;place-items:center;box-shadow:0 0 0 10px rgba(255,255,255,.08),0 30px 60px rgba(0,0,0,.4);animation:stamp .7s cubic-bezier(.3,1.5,.5,1) both !important}
#onb .plate i{width:212px;height:212px;border-radius:50%;background:url(__LOGOW__) center/contain no-repeat;background-origin:content-box;padding:26px;box-sizing:border-box}
@keyframes stamp{0%{transform:scale(2.2) rotate(-14deg);opacity:0}60%{opacity:1}}
#onb .dots{display:flex;gap:6px;margin-bottom:6px}
#onb .dots i{width:22px;height:5px;border-radius:3px;background:rgba(255,255,255,.2)}
#onb .dots i.on{background:var(--gold)}
#onb .me{display:flex;align-items:center;gap:14px;margin-top:22px;background:rgba(255,255,255,.07);border-radius:20px;padding:10px 16px 10px 10px;text-align:left;width:100%}
#onb .me .av{width:56px;height:56px;box-shadow:0 0 0 3px var(--gold)}
#onb .me b{display:block;font-size:16px}
#onb .me span{font-size:13px;color:rgba(255,255,255,.6)}
#onb .field{background:rgba(255,255,255,.1);color:#fff;text-align:center;margin-top:14px;font-size:20px;height:60px}
#onb .field::placeholder{color:rgba(255,255,255,.4)}
#onb .field:focus{box-shadow:inset 0 0 0 2px var(--gold)}
#onb .mintArea{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
#mintWrap{position:relative;width:min(78vw,330px);aspect-ratio:1;cursor:pointer;touch-action:manipulation}
#mint{position:absolute;inset:0;width:100%;height:100%}
#mintWrap .halo{position:absolute;inset:6%;border-radius:50%;pointer-events:none;box-shadow:0 0 0 0 color-mix(in srgb,var(--gold) 55%,transparent);animation:halo 1.6s ease-out infinite}
#mintWrap.done .halo{animation:none}
@keyframes halo{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--gold) 55%,transparent)}100%{box-shadow:0 0 0 34px transparent}}
#mintWrap .shine{position:absolute;inset:-30%;border-radius:50%;background:radial-gradient(circle,rgba(255,225,150,.35),rgba(255,225,150,0) 60%);pointer-events:none;opacity:.7}
#tapHint{display:flex;align-items:center;gap:8px;margin-top:18px;font-weight:700;font-size:17px;color:var(--gold-l);animation:pulse 1.4s infinite;height:26px}
#tapHint svg{width:22px;height:22px}
#strikes{display:flex;gap:8px;margin-top:12px}
#strikes i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.18);transition:.2s}
#strikes i.on{background:var(--gold);transform:scale(1.25)}
#mintCount{height:60px;margin-bottom:4px;color:#ffe6a6;font-size:54px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1;pointer-events:none;text-shadow:0 6px 24px rgba(0,0,0,.4)}
#mintCount.bump{animation:bump .35s}
#mintDone{opacity:0;pointer-events:none;transition:opacity .4s}
#mintDone.on{opacity:1;pointer-events:auto}
#onb .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:none !important}
#onb .flash.go{animation:fl .35s !important}
@keyframes fl{from{opacity:.75}to{opacity:0}}

/* quiz */
#quiz{background:#fff;z-index:40}
#quiz .qtop{display:flex;align-items:center;gap:12px;padding:calc(var(--sat) + 12px) 16px 6px}
#quiz .prog{flex:1;display:flex;gap:5px}
#quiz .prog i{flex:1;height:5px;border-radius:3px;background:var(--card2)}
#quiz .prog i.on{background:var(--ink)}
#qbody{position:absolute;top:calc(var(--sat) + 66px);left:0;right:0;bottom:0;padding:8px max(18px,calc((100% - 720px) / 2)) 150px;overflow-y:auto;scrollbar-width:none}
#qbody.sw>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
#qbody h1{font-size:30px;margin:6px 0 4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.opt{background:var(--card);border-radius:20px;padding:16px 14px;min-height:92px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;transition:transform .12s,background .15s}
.opt b{font-size:17px;font-weight:700;line-height:1.15}
.opt span{font-size:13px;color:var(--mut);margin-top:3px}
.opt.sel{background:var(--ink);color:#fff}.opt.sel span{color:rgba(255,255,255,.7)}
.opt.skip{grid-column:1/3;min-height:54px;justify-content:center;align-items:center;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
#short{position:absolute;left:50%;transform:translateX(-50%);width:min(calc(100% - 24px),560px);bottom:calc(var(--sab) + 12px);background:var(--slate-d);color:#fff;border-radius:24px;padding:12px 16px;display:flex;align-items:center;gap:12px;transition:transform .4s cubic-bezier(.2,.9,.25,1)}
#short.hide{transform:translate(-50%,160%)}
#short .n{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;min-width:44px;text-align:center;color:var(--gold)}
#short .n.tick{animation:bump .35s}
#short .t{flex:1;font-size:13.5px;line-height:1.25;color:rgba(255,255,255,.75)}
#short .t b{display:block;color:#fff;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
#short .th{display:flex}
#short .th img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2.5px solid var(--slate-d);margin-left:-14px;animation:pop .4s cubic-bezier(.2,1.5,.4,1) both}
.win{border-radius:24px;overflow:hidden;background:var(--card);margin-top:14px;animation:winin .7s cubic-bezier(.2,1.2,.3,1) both !important}
@keyframes winin{from{opacity:0;transform:scale(.8) rotate(-3deg)}}
.win img{width:100%;aspect-ratio:1.25;object-fit:cover;display:block}
.win .in{padding:16px}
.win b{font-size:24px;font-weight:750;letter-spacing:-.02em;display:block}
.win p{font-size:14.5px;color:#44474c;margin-top:6px}
.why{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.why i{font-style:normal;font-size:12.5px;font-weight:650;background:#fff;border-radius:10px;padding:4px 10px}
.runner{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:10px;margin-top:10px;width:100%;text-align:left}
.runner img{width:64px;height:64px;border-radius:14px;object-fit:cover}
.runner b{display:block;font-size:16px}.runner span{font-size:13.5px;color:var(--mut)}

.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0 4px}
.stats div{background:var(--card);border-radius:16px;padding:10px;text-align:center}
.stats b{display:block;font-size:22px;font-weight:750;font-variant-numeric:tabular-nums}
.stats small{font-size:11.5px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.earn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--cream);border-radius:18px;padding:12px;font-weight:750;font-size:20px;margin-top:10px}
.gnote{font-size:12.5px;color:var(--mut);text-align:center;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s !important;transition-duration:.01s !important}}
</style>
</head>
<body>

<div id="app">
  <!-- the partner top bar: the same markup and styles the Grug site uses in partner mode (.ptb), so it never changes between screens -->
  <header id="top" class="ptb">
    <a class="ptb-logo" id="logoBtn" href="#home" aria-label="{{name}} home"><img src="__LOGOW__" alt="{{name}}"><span class="ptb-demo" title="A concept demo: purchases, check-ins and rewards are simulated">Demo</span></a>
    <span class="ptb-sp"></span>
    <button class="ptb-wallet" id="wallet" aria-label="{{coin}}"><i class="ptb-coin"></i><span id="walletN">0</span><span class="ptb-plus"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path fill="currentColor" d="M8 1a1 1 0 0 1 1 1v5h5a1 1 0 1 1 0 2H9v5a1 1 0 1 1-2 0V9H2a1 1 0 0 1 0-2h5V2a1 1 0 0 1 1-1"/></svg></span></button>
    <button class="ptb-fs" id="fsBtn" aria-label="Full screen" aria-pressed="false" hidden><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path fill="currentColor" d="M5.293 9.293a1 1 0 1 1 1.414 1.414L4.414 13H5a1 1 0 1 1 0 2H2a1 1 0 0 1-1-1v-3a1 1 0 1 1 2 0v.586zM9.293 9.293a1 1 0 0 1 1.414 0L13 11.586V11a1 1 0 1 1 2 0v3a1 1 0 0 1-1 1h-3a1 1 0 1 1 0-2h.586l-2.293-2.293a1 1 0 0 1 0-1.414M5 1a1 1 0 0 1 0 2h-.586l2.293 2.293a1 1 0 1 1-1.414 1.414L3 4.414V5a1 1 0 0 1-2 0V2a1 1 0 0 1 1-1zM14 1a1 1 0 0 1 1 1v3a1 1 0 1 1-2 0v-.586l-2.293 2.293a1 1 0 1 1-1.414-1.414L11.586 3H11a1 1 0 1 1 0-2z"/></svg></button>
    <button class="ptb-av" id="profileBtn" aria-label="Your profile"></button>
  </header>
  <script>/* the avatar picture right away (the Grug site's own saved picture; see Avatar below) */(function(){try{var s=JSON.parse(localStorage.getItem("grug.sandy.snaps.v1")||"null"),u=s&&s.bust?s.bust:(/\/play\/{{id}}(\/|$)/.test(location.pathname)?"../../assets/sandy/bust.png":"");if(u)document.getElementById("profileBtn").style.backgroundImage='url("'+u+'")';var f=document.getElementById("fsBtn");if(document.fullscreenEnabled||document.webkitFullscreenEnabled)f.hidden=false;}catch(e){}})();</script>
  <main id="views">
    <section class="view" id="v-home"></section>
    <section class="view" id="v-menu"></section>
    <section class="view" id="v-play"></section>
    <section class="view" id="v-pass"></section>
    <section class="view" id="v-store"></section>
  </main>
  <nav id="tabs"></nav>
</div>

<div id="quiz" class="overlay">
  <div class="qtop"><div class="prog" id="qprog"></div><button class="iconbtn" id="qclose" aria-label="Close" data-ic="cross"></button></div>
  <div id="qbody"></div>
  <div id="short" class="hide"><div class="n" id="shortN">0</div><div class="t"><span>still in the running</span><b id="shortLead"></b></div><div class="th" id="shortTh"></div></div>
</div>

<div id="onb" class="overlay">
  <div class="flash" id="obFlash"></div>
  <div class="step" data-s="0">
    <div class="plate"><i></i></div>
    <div class="grow"></div>
    <div class="eyebrow" style="color:var(--gold)">{{welcomeEyebrow}}</div>
    <h1>{{copy.welcomeTitle}}</h1>
    <p class="sub">{{copy.welcomeSub}}</p>
    <button class="btn gold" style="margin-top:26px" data-next>Let's go</button>
  </div>
  <div class="step" data-s="1">
    <div class="dots"><i class="on"></i><i></i></div>
    <h1>{{copy.who}}</h1>
    <p class="sub">So we know what to call you.</p>
    <div class="me"><div class="av" data-avatar></div><div><b>Your player card</b><span>Your look from Grug carries over here</span></div></div>
    <input class="field" id="obName" maxlength="14" placeholder="First name or nickname" autocomplete="off">
    <div class="grow"></div>
    <button class="btn gold" data-next>Continue</button>
  </div>
  <div class="step" data-s="2">
    <div class="dots"><i class="on"></i><i class="on"></i></div>
    <h1 id="mintH">Strike your first coin.</h1>
    <p class="sub" id="mintP">Every {{short}} coin is struck by hand. Give it three good taps.</p>
    <div class="mintArea">
      <div id="mintCount"></div>
      <div id="mintWrap" role="button" aria-label="Tap the coin"><div class="shine"></div><div class="halo"></div><canvas id="mint"></canvas></div>
      <div id="tapHint"><span data-ic="click"></span><span id="tapHintT">Tap the coin</span></div>
      <div id="strikes"><i></i><i></i><i></i></div>
    </div>
    <button class="btn gold" id="mintDone">{{copy.mintGo}}</button>
  </div>
</div>

<div id="sheetWrap"><div id="scrim"></div><div id="sheet"></div></div>
<div id="toast"></div>
<canvas id="fx"></canvas>

<script>
"use strict";
const MENU=__MENU__;
const IMGS=__IMGS__;
const LOGO="__LOGO__";
const ICONS=__ICONS__;
let LOGO_IMG=null;
/* on the Grug site this app lives at play/<id>/; its Grug links open partner mode (the site in the partner's colours) in the same tab */
const IN_SITE=/\/play\/{{id}}(\/|$)/.test(location.pathname);
const LINKS={play:"{{appStore|js}}",grug:IN_SITE?"../../{{id}}/":"https://grugdigital.pages.dev/{{id}}/"};
const GRUG_TARGET=IN_SITE?"":' target="_blank" rel="noopener"';
/* on the site, the Play tab is the full game list in partner mode (every standalone game, the partner's own first, in its colours) */
const GAMES_URL="../../games/?partner={{id}}",AVATAR_URL="../../avatar/?partner={{id}}";
/* on the site, opening this app (however it was reached: a bookmark, a shared link, the site's own bar) puts the whole
   site in partner mode for this tab, and a game started from here comes back here when the guest leaves it
   (theme.js points the game's Back button at grug.partner.back) */
if(IN_SITE){try{const b=JSON.parse(sessionStorage.getItem("grug.brand.v1")||"null");if(!b||b.p!=="{{id}}")sessionStorage.setItem("grug.brand.v1",JSON.stringify({p:"{{id}}",at:Date.now()}));}catch(e){}
  /* a game started from the shelf: note the way back, and the Grug Digital card can show on Home from now on */
  addEventListener("fossil32:play",()=>{try{sessionStorage.setItem("grug.partner.back",location.pathname+"#home");}catch(e){}if(!S.grug){S.grug=true;save();}});}
const COIN="{{coin|js}}";
/* addresses from the venue's earlier app (QR codes, bookmarks, links from before): its game is a standalone game now,
   so "…/game" style links go there. partners/<id>/config.json "oldLinks": [kind, value, path from play/<id>/]:
   ["hash","game",…] matches #game and #<store>/game, ["query","game=takeatea",…] matches that query. */
function oldLink(){try{const q=location.search.slice(1).split("&"),h=location.hash;
  for(const [k,v,to] of {{oldLinks|json}})if((k==="hash"&&(h==="#"+v||h.slice(-v.length-1)==="/"+v))||(k==="query"&&q.includes(v))){location.replace(to);return true;}}catch(e){}return false;}
oldLink();addEventListener("hashchange",oldLink);
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t, rnd=(a,b)=>a+Math.random()*(b-a);
const fmt=n=>Math.round(n).toLocaleString("en-US");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
const today=()=>new Date().toDateString();
/* icons: @icons by Valentin Fossati (Voxybuns) & contributors, MIT */
const ic=(n,cls)=>`<svg class="i ${cls||""}" viewBox="0 0 16 16" fill="none" aria-hidden="true">${ICONS[n]||""}</svg>`;
function fillIcons(root){$$("[data-ic]",root||document).forEach(e=>{if(!e.firstChild)e.innerHTML=ic(e.dataset.ic);});}

/* ================= STATE ================= */
const KEY="{{storageKey|js}}";
const DEF={onboarded:false,name:"",coins:0,visits:0,claimed:{},lastDaily:"",lastTap:"",tab:[],theme:"classic",themes:["classic"],quizDay:"",sound:true,table:12,lastPick:"",grug:false,grugSeen:false};
let S=Object.assign({},DEF);
try{const j=JSON.parse(localStorage.getItem(KEY)||"null"); if(j) S=Object.assign({},DEF,j);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
/* FROZEN: this app is a demonstration for the business's owners (assets/demo.js). Until they sign off, nothing is earned,
   bought, spent or redeemed here: the balance and the visit count stay at zero, the welcome coins are skipped, and every
   way of getting or using coins answers with OFF. */
const FROZEN=!(window.GRUG_DEMO&&GRUG_DEMO.isLive("{{id}}"));
const OFF="Rewards are switched off. This is a demonstration only.";
if(FROZEN){Object.assign(S,{coins:0,visits:0,claimed:{},tab:[],theme:"classic",themes:["classic"],onboarded:true});
  document.documentElement.style.setProperty("--gd-lift","84px");
  if(window.GRUG_DEMO)GRUG_DEMO.install("{{name|js}}","{{id}}","{{copy.menuCredit|js}}");}

/* Wallet: the one place coins move through. When this app is wired to Grug Digital, Pearls plug in here
   (spend Pearls first, then coins) using the kit's rewards-app protocol. */
const Wallet={
  pearls:0, pearlName:"",
  add(n,from){if(FROZEN){toast(OFF);return;}S.coins+=n;save();UI.wallet(true);if(from)FX.fly(from,$("#wallet"),clamp(Math.round(n/25),4,16));SFX.coins(clamp(Math.round(n/40),2,8));},
  spend(n){if(FROZEN){toast(OFF);return false;}if(S.coins<n)return false;S.coins-=n;save();UI.wallet(true);return true;}
};

/* ================= SOUND ================= */
const SFX=(()=>{
  let ac=null;
  function ctx(){if(!S.sound)return null;if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(ac.state==="suspended")ac.resume();return ac;}
  function tone(f,t0,d,type,vol,f2){const a=ctx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,a.currentTime+t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+t0+d);g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(vol||.12,a.currentTime+t0+.008);g.gain.exponentialRampToValueAtTime(.0008,a.currentTime+t0+d);o.connect(g).connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+d+.02);}
  function noise(t0,d,vol,freq,q,att){const a=ctx();if(!a)return;const n=a.sampleRate*d|0,b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type="bandpass";f.frequency.value=freq||800;f.Q.value=q||.7;const g=a.createGain();g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(vol,a.currentTime+t0+d*(att||.25));g.gain.exponentialRampToValueAtTime(.0008,a.currentTime+t0+d);s.connect(f).connect(g).connect(a.destination);s.start(a.currentTime+t0);}
  const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}};
  return{
    tap(){tone(520,0,.06,"triangle",.06);},
    coin(i){tone(1320+((i||0)%4)*90,0,.09,"square",.035);tone(1980+((i||0)%4)*120,.05,.16,"square",.03);},
    coins(n){for(let i=0;i<n;i++)setTimeout(()=>this.coin(i),i*70+250);},

/* ================= FX LAYER (coin showers, confetti) ================= */
const FX=(()=>{
  const cv=$("#fx"),c=cv.getContext("2d");let P=[],run=false,last=0,W=0,H=0,dpr=1;
  function size(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;}
  addEventListener("resize",size);size();
  const center=el=>{if(!el)return[W/2,H/2];if(Array.isArray(el))return el;const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2];};
  function go(){if(!run){run=true;last=performance.now();requestAnimationFrame(tick);}}
  function tick(t){
    const dt=Math.min(.04,(t-last)/1000);last=t;
    c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
    for(const p of P){
      p.t+=dt;
      if(p.k==="fly"){
        if(p.t<p.d)continue;
        const u=clamp((p.t-p.d)/p.dur,0,1),e=u*u*(3-2*u);
        const x=lerp(lerp(p.x0,p.cx,e),lerp(p.cx,p.x1,e),e),y=lerp(lerp(p.y0,p.cy,e),lerp(p.cy,p.y1,e),e);
        Coin.sprite(c,p.f+p.t*22,x,y,lerp(34,22,e));
        if(u>=1){p.dead=true;p.done&&p.done();}
      }else if(p.k==="coin"){
        p.vy+=1500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
        if(p.y>p.floor&&p.vy>0&&p.b<2){p.vy*=-.45;p.vx*=.7;p.b++;p.y=p.floor;}
        const a=clamp((p.life-p.t)/.4,0,1);c.globalAlpha=a;Coin.sprite(c,p.f+p.t*p.sp,p.x,p.y,p.s);c.globalAlpha=1;
        if(p.t>p.life)p.dead=true;
      }else{
        p.vy+=900*dt;p.vx*=.985;p.x+=p.vx*dt;p.y+=p.vy*dt*.6;p.r+=p.vr*dt;
        c.save();c.translate(p.x,p.y);c.rotate(p.r);c.scale(1,Math.cos(p.t*9+p.f));c.globalAlpha=clamp((p.life-p.t)/.5,0,1);c.fillStyle=p.col;c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);c.restore();
        if(p.t>p.life)p.dead=true;

  }

    fly(from,to,n,done){const[a,b]=center(from),[x1,y1]=center(to);n=RM?Math.min(n,4):n;

    burst(at,n,opt){const[x,y]=center(at);opt=opt||{};n=RM?Math.min(n,8):n;
      for(let i=0;i<n;i++){const a=rnd(-Math.PI,0),v=rnd(280,opt.power||820);P.push({k:"coin",t:0,x,y,vx:Math.cos(a)*v*.9,vy:Math.sin(a)*v-200,f:rnd(0,20),sp:rnd(14,30),s:rnd(26,46),life:rnd(1.5,2.3),floor:H-rnd(10,90),b:0});}go();},
    confetti(at,n){const[x,y]=center(at);n=RM?10:(n||70);const cols=["{{color.accent}}","{{color.accentLight}}","#ffffff","{{color.deep}}","#b8402f","#2f5e49"];

  };

/* On the Grug site, the top of Home is the site's game shelf: the partner's own games, then every other standalone game, as floating
   FOSSIL32 cartridges (assets/fossil32/, the same as the Grug home page), in one looping row. Built once and moved back
   into Home each time it's drawn, so the 3D cartridges don't reload. Standalone (off the site): a card that opens the site. */
const Shelf=(()=>{
  const ROOT="../../";let el=null,row=null,N=0,loading=null,rq=0,settleT=0,drag=null,dragged=false;
  const kick=()=>{if(window.Fossil32&&Fossil32.kick)Fossil32.kick();};
  const add=(tag,attrs)=>new Promise((ok,no)=>{const n=document.createElement(tag);Object.assign(n,attrs);n.onload=ok;n.onerror=no;document.head.appendChild(n);});
  function load(){
    if(loading)return loading;
    loading=Promise.all([add("link",{rel:"stylesheet",href:ROOT+"assets/fossil32/fossil32.css"}).catch(()=>{}),add("script",{src:ROOT+"assets/games.js"})])
      .then(()=>{build();if(curTab==="home")UI.home();add("script",{type:"module",src:ROOT+"assets/fossil32/fossil32.js"}).catch(()=>{});});
    return loading;
  }
  // the partner's own game first, then every other standalone game (never one that lives inside another venue's app)
  const mine=g=>g.venue==="{{id}}"||g.id==="{{id}}";
  const list=()=>{const G=(window.GRUG_GAMES||[]).filter(g=>g.listed!==false&&g.status!=="legacy");
    return G.filter(mine).concat(G.filter(g=>!mine(g)&&!g.inApp));};
  const tile=g=>{const b=g.box||{},own=mine(g);
    return `<a class="hc-t f32-tile f32-cart" data-f32="${g.id}" data-f32-kind="cart" href="${ROOT}games/${g.id}/" aria-label="${esc(g.title)}" style="--hc-c:${b.shell||g.color||"{{color.accent}}"}">
      <div class="f32-stage">${own?'<span class="f32-ribbon">From {{short}}</span>':""}<img class="f32-flat" src="${ROOT}${b.art||g.thumb}" alt="" decoding="async"></div>
      <div class="hc-b"><b>${esc(g.title)}</b><span>${own?"{{label}}":g.original?"Grug Original":esc(g.partner)} · ${esc(g.kind)}</span></div></a>`;};
  function build(){
    const L=list();N=L.length;if(!N)return;
    el=document.createElement("div");el.className="hc";
    row=document.createElement("div");row.className="hc-row";row.setAttribute("data-noswipe","");el.appendChild(row);
    // an endless loop: the list three times over; once the row settles in the first or last copy it jumps (unseen)
    // to the same cartridge in the middle copy, so there's never an end to hit
    row.innerHTML=[0,1,2].map(()=>L.map(tile).join("")).join("");
    [...row.children].forEach((t,i)=>{if(i<N||i>=2*N){t.setAttribute("aria-hidden","true");t.tabIndex=-1;}});
    row.addEventListener("scroll",()=>{queue();kick();clearTimeout(settleT);settleT=setTimeout(recentre,140);},{passive:true});
    if("onscrollend" in row)row.addEventListener("scrollend",recentre);
    // a cartridge off to the side slides to the middle first; the middle one opens (FOSSIL32 handles that click)
    row.addEventListener("click",e=>{const t=e.target.closest(".hc-t");if(!t)return;
      if(dragged||!t.classList.contains("on")){e.preventDefault();e.stopPropagation();if(!dragged){centre(t);SFX.tap();}}},true);
    row.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse"||e.button)return;drag={x:e.clientX,left:row.scrollLeft};dragged=false;});
    addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x;if(Math.abs(dx)>6){dragged=true;row.classList.add("drag");}if(dragged)row.scrollLeft=drag.left-dx;});
    addEventListener("pointerup",()=>{if(!drag)return;drag=null;if(row.classList.contains("drag")){row.classList.remove("drag");const on=row.querySelector(".on");if(on)centre(on);}setTimeout(()=>{dragged=false;},0);});
    addEventListener("resize",()=>{if(el.isConnected)settle();});
  }
  const step=()=>{const t=row.children[0];return t?t.offsetWidth+12:1;};
  const centreLeft=t=>t.offsetLeft+t.offsetWidth/2-row.clientWidth/2;
  function centre(t,instant){row.scrollTo({left:centreLeft(t),behavior:instant?"instant":"smooth"});}
  function paint(){
    rq=0;if(!row||!row.isConnected)return;
    const r=row.getBoundingClientRect(),mid=r.left+r.width/2,s=step();let best=null,bd=1e9;
    [...row.children].forEach(t=>{const b=t.getBoundingClientRect(),dx=Math.abs(b.left+b.width/2-mid);t.style.setProperty("--d",Math.min(1,dx/s).toFixed(3));if(dx<bd){bd=dx;best=t;}});
    [...row.children].forEach(t=>t.classList.toggle("on",t===best));
  }
  const queue=()=>{if(!rq)rq=requestAnimationFrame(paint);};
  function recentre(){
    if(drag)return;const tiles=[...row.children],i=tiles.findIndex(t=>t.classList.contains("on"));if(i<0)return;
    if(i<N||i>=2*N){const j=N+(i%N),off=row.scrollLeft-centreLeft(tiles[i]);row.style.scrollSnapType="none";row.scrollLeft=centreLeft(tiles[j])+off;requestAnimationFrame(()=>{row.style.scrollSnapType="";paint();});}
  }
  let at=0;   // which cartridge was in the middle, kept while Home is redrawn
  function settle(){const tiles=[...row.children];centre(tiles[N+(at%N)],true);paint();}
  return{
    // the markup Home puts where the shelf goes
    html(){if(!IN_SITE)return null;if(!el){load();return `<div class="hc" aria-busy="true"></div>`;}
      const i=[...row.children].findIndex(t=>t.classList.contains("on"));if(i>=0)at=i%N;return `<div class="hc" id="shelfSlot"></div>`;},
    // after Home is drawn: swap the placeholder for the shelf (the same cartridges, still mounted)
    place(){const s=$("#shelfSlot");if(!s||!el)return;s.replaceWith(el);requestAnimationFrame(()=>{settle();kick();});}
  };
})();

    const t=e.target.closest("[data-tbl]");if(t){S.table=clamp(S.table+ +t.dataset.tbl,1,60);save();$("#tblN").textContent=S.table;SFX.tap();return;}
    if(e.target.closest("#buyGo")){
      $("#sheet").onclick=null;SFX.tap();Sheet.lock=true;
      $("#sheet").innerHTML=`<div class="grab"></div><div class="sending"><div class="ring"></div><h3>Sending to {{copy.staff}}</h3><p>Table ${S.table}</p></div>`;
      setTimeout(()=>{
        S.tab.push({coins:p.coins+p.bonus,price:p.price});save();
        $("#sheet").innerHTML=`<div class="grab"></div><div class="sending"><div class="okmark">${ic("checkmark")}</div><h3>It's on your {{copy.bill}}</h3><p>${fmt(p.coins+p.bonus)} ${COIN} added for {{copy.Spot|js}} ${S.table}.</p></div><button class="btn" data-close>Nice</button>`;
        Sheet.lock=false;SFX.win();FX.burst($(".okmark"),26,{power:700});Wallet.add(p.coins+p.bonus,$(".okmark"));
        if(curTab==="store")setTimeout(()=>UI.store(),900);
      },1300);
    }
  };
}
/* an app theme from the Coins tab: one you own is put on; one with a price is bought with coins first */
function themeSheet(id){
  const t=themeOf(id);if(!t||t.id!==id)return;SFX.tap();
  const redraw=()=>{if(curTab==="store"){const y=$("#v-store").scrollTop;UI.store();$("#v-store").scrollTop=y;}};
  if(S.themes.includes(id)){S.theme=id;save();applyTheme();redraw();toast(t.name+" theme on");return;}
  if(!t.price){const pass=PASS.find(x=>x.theme===id);toast(pass?"Unlocks on the Season Pass at "+esc(pass.name):"Not for sale");return;}
  const short=t.price-S.coins;
  Sheet.open(`<div class="eyebrow">App theme</div><h3>${esc(t.name)}</h3>
    <div class="theme" style="margin-top:14px;pointer-events:none"><div class="sw" style="height:96px;background:${t.deep}"><i style="background:${t.accent||"var(--gold)"}"></i><i style="background:${t.deepDark}"></i></div></div>
    ${t.line?`<p>${esc(t.line)}</p>`:""}
    <button class="btn gold" id="thGo" ${short>0?"disabled":""}><i class="c"></i>${short>0?`${fmt(short)} more coins needed`:`Use ${fmt(t.price)} ${COIN}`}</button>
    <button class="btn ghost" data-close style="margin-top:10px">Not now</button>`);
  $("#thGo").onclick=()=>{if(!Wallet.spend(t.price))return;S.themes.push(id);S.theme=id;save();applyTheme();Sheet.close();SFX.win();FX.confetti([innerWidth/2,innerHeight*.4],60);toast(t.name+" theme on");setTimeout(redraw,300);};
}
function checkinSheet(){
  if(FROZEN){toast(OFF);return;}
  SFX.tap();
  Sheet.open(`<div class="eyebrow">Check in</div><h3>Stamp this visit</h3><p>Ask {{copy.staff}} for today's 4-digit {{copy.spot}} code. One stamp per visit.</p>
    <input class="field" id="ciCode" inputmode="numeric" maxlength="4" placeholder="• • • •" style="text-align:center;letter-spacing:.4em;font-size:26px;font-weight:700">
    <button class="btn gold" id="ciGo">${ic("stamp")}Check in</button><p class="gnote">Demo: any four digits work, and you can check in as often as you like.</p>`);
  $("#ciGo").onclick=()=>{const v=$("#ciCode").value.replace(/\D/g,"");if(v.length<4){toast("Enter the 4-digit code");return;}doVisit();};

function doVisit(){
  if(FROZEN){Sheet.close();toast(OFF);return;}
  const before=PASS.filter(t=>S.visits>=t.v).length;S.visits++;save();const after=PASS.filter(t=>S.visits>=t.v);
  Sheet.close();SFX.stamp(2);UI.go("pass");
  if(after.length>before){const t=after[after.length-1];setTimeout(()=>{SFX.win();FX.confetti([innerWidth/2,innerHeight*.45],90);toast("Unlocked: "+t.name);const el=$(`[data-tier="${t.v}"]`);el&&el.scrollIntoView({behavior:"smooth",block:"center"});},500);}
  else toast("Visit stamped. See you next time.");
}
function claim(v,btn){
  if(FROZEN){toast(OFF);return;}
  const t=PASS.find(x=>x.v==v);if(!t||S.claimed[v]||S.visits<t.v)return;S.claimed[v]=1;
  // Season Pass rewards are all digital: coins and app themes (never free food, drinks or discounts)
  const got=[];
  if(t.theme&&!S.themes.includes(t.theme)){S.themes.push(t.theme);S.theme=t.theme;applyTheme();got.push(themeOf(t.theme).name+" theme on");}
  save();SFX.win();FX.confetti(btn,60);
  if(t.coins)Wallet.add(t.coins,btn);
  setTimeout(()=>{UI.pass();if(got.length)toast(got.join(" · "));},t.coins?700:200);
}
function applyTheme(){const t=themeOf(S.theme),st=document.documentElement.style;
  st.setProperty("--slate",t.deep);st.setProperty("--slate-d",t.deepDark);
  if(t.accent)st.setProperty("--gold",t.accent);else st.removeProperty("--gold");}
applyTheme();
function profileSheet(){

  const nth=THEMES.filter(t=>S.themes.includes(t.id));
  Sheet.open(`<div class="prof"><div class="av" data-avatar></div><div><div class="eyebrow">Player card</div><h3>${esc(S.name||"Guest")}</h3><span class="sub">{{copy.Spot|js}} ${S.table} · ${S.visits} visit${S.visits===1?"":"s"}</span></div></div>
    <div class="stats"><div><b>${fmt(S.visits)}</b><small>Visits</small></div><div><b>${fmt(S.coins)}</b><small>Coins</small></div><div><b>${fmt(Object.keys(S.claimed).length)}</b><small>Rewards</small></div></div>
    ${IN_SITE?`<a class="btn" href="${AVATAR_URL}" style="margin-top:14px;text-decoration:none">${ic("controller")}Edit my avatar</a>`:""}
    <button class="btn ghost" id="pSound" style="margin-top:10px">${ic(S.sound?"speaker":"speaker_mute")}<span>Sound: ${S.sound?"On":"Off"}</span></button>
    ${nth.length>1?`<button class="btn ghost" id="pTheme" style="margin-top:10px">App theme: ${esc(themeOf(S.theme).name)}</button>`:""}

    <div class="rowbtns"><button class="btn ghost" id="pVisit">+1 visit</button><button class="btn ghost" id="pCoins">+500 coins</button></div>
    <div class="rowbtns"><button class="btn ghost" id="pOnb">Replay intro</button><button class="btn ghost" id="pReset" style="color:var(--red)">Reset demo</button></div>`);
  $("#pSound").onclick=()=>{S.sound=!S.sound;save();$("#pSound").innerHTML=`${ic(S.sound?"speaker":"speaker_mute")}<span>Sound: ${S.sound?"On":"Off"}</span>`;SFX.tap();};
  if($("#pTheme"))$("#pTheme").onclick=()=>{const k=nth.findIndex(t=>t.id===S.theme),t=nth[(k+1)%nth.length];S.theme=t.id;save();applyTheme();$("#pTheme").textContent="App theme: "+t.name;};
  $("#pVisit").onclick=doVisit;
  $("#pCoins").onclick=e=>{Wallet.add(500,e.target);};
  $("#pOnb").onclick=()=>{Sheet.close();Onb.start(true);};
  $("#pReset").onclick=()=>{try{localStorage.removeItem(KEY);}catch(e){}location.reload();};

/* ================= QUIZ ================= */
/* The questions come from partners/<id>/quiz.json. Each answer is [id, label, note, test]; a test is {tag: value or
   [values]} on the dish's tags (made by make_data.py; a missing tag counts as 0), plus "price": [from, below) and
   "top": true/false (house favourites). The first question is "first"; after it, the question that splits what's left
   most evenly (plus its "w" nudge) goes next, until two or fewer dishes are left or six were asked. */
const Quiz=(()=>{
  const QZ=__QUIZ__,Q=QZ.questions;
  const pass=(i,c)=>{for(const k in c){const v=c[k];
    if(k==="price"){if(!(i.price>=v[0]&&i.price<v[1]))return false;continue;}
    if(k==="top"){if(!!i.top!==v)return false;continue;}
    const have=[].concat(i.t[k]==null?0:i.t[k]).map(String),want=[].concat(v).map(String);
    if(!want.some(x=>have.includes(x)))return false;}return true;};
  for(const k in Q)Q[k].o=Q[k].o.map(([id,label,note,c])=>[id,label,note,i=>pass(i,c)]);
  let pool=[],asked=[],why=[];
  const base=()=>ALL.filter(i=>i.t&&i.i!=null);
  const rank=p=>p.slice().sort((a,b)=>(b.top?2:0)+b._j-((a.top?2:0)+a._j));
  function nextQ(){
    if(!asked.length)return QZ.first;
    if(pool.length<=2||asked.length>=6)return null;
    let best=null,bs=0;
    for(const k in Q){if(asked.includes(k))continue;const cs=Q[k].o.map(o=>pool.filter(o[3]).length).filter(n=>n>0);if(cs.length<2)continue;
      const tot=cs.reduce((a,b)=>a+b,0);let ent=0;cs.forEach(n=>{const p=n/tot;ent-=p*Math.log(p);});
      ent+=Q[k].w||0;
      if(ent>bs){bs=ent;best=k;}}
    return best;
  }
  function prog(n,total){$("#qprog").innerHTML=Array.from({length:total},(_,i)=>`<i class="${i<n?"on":""}"></i>`).join("");}
  function shortlist(){
    const r=rank(pool),sh=$("#short");sh.classList.toggle("hide",!asked.length);
    const n=$("#shortN");n.textContent=pool.length;n.classList.remove("tick");void n.offsetWidth;n.classList.add("tick");
    $("#shortLead").textContent=r[0]?"Leading: "+r[0].n:"";
    $("#shortTh").innerHTML=r.slice(0,3).map((i,k)=>`<img src="${img(i)}" alt="" style="animation-delay:${k*.07}s">`).join("");
  }
  function ask(){
    const k=nextQ();if(!k)return reveal();
    const q=Q[k],body=$("#qbody");prog(asked.length+1,Math.max(asked.length+2,4));
    const opts=q.o.map(o=>({o,n:pool.filter(o[3]).length})).filter(x=>x.n>0);
    body.classList.remove("sw");void body.offsetWidth;body.classList.add("sw");
    body.innerHTML=`<div class="eyebrow">Question ${asked.length+1}</div><h1>${q.q}</h1><p class="sub">${q.s}</p>
      <div class="opts">${opts.map((x,i)=>`<button class="opt" data-o="${i}" style="animation:rise .45s ${.05*i+.1}s both"><b>${x.o[1]}</b><span>${x.o[2]||x.n+(x.n===1?" {{copy.dish|js}}":" {{copy.dishes|js}}")}</span></button>`).join("")}
      ${asked.length?`<button class="opt skip" data-o="-1"><b style="font-size:15px">No preference</b></button>`:""}</div>`;
    body.onclick=e=>{const b=e.target.closest(".opt");if(!b)return;body.onclick=null;SFX.tap();b.classList.add("sel");const i=+b.dataset.o;asked.push(k);
      if(i>=0){pool=pool.filter(opts[i].o[3]);why.push(opts[i].o[1]);}
      shortlist();setTimeout(ask,RM?50:420);};
    body.scrollTop=0;
  }
  function reveal(){
    const r=rank(pool),w=r[0],body=$("#qbody");prog(9,1);$("#short").classList.add("hide");
    const first=S.quizDay!==today();
    body.classList.remove("sw");void body.offsetWidth;body.classList.add("sw");
    body.innerHTML=`<div class="eyebrow">Our pick for you</div><h1>${S.name?esc(S.name)+", your":"Your"} pick: ${esc(w.n)}</h1>
      <div class="win"><img src="${img(w)}" alt=""><div class="in"><b>${esc(w.n)}${w.p?` <span style="font-weight:500;font-size:18px">${w.p}</span>`:""}</b><p>${esc(w.d||"")}</p><div class="why">${why.map(x=>`<i>${esc(x)}</i>`).join("")}${w.top&&!why.includes("{{copy.favLabel|js}}")?"<i>{{copy.favLabel}}</i>":""}</div></div></div>
      ${r.length>1?`<h2 style="margin-top:20px">Also worth a look</h2>`+r.slice(1,3).map(i=>`<button class="runner" data-item="${esc(i.n)}"><img src="${img(i)}" alt=""><div><b>${esc(i.n)}</b><span>${i.p?i.p+" · ":""}${esc(i.cat)}</span></div></button>`).join(""):""}
      ${first?`<div class="earn" id="qEarn"><i class="c lg"></i>+25 for finding your {{copy.plate}}</div>`:""}
      <button class="btn" data-pick="${esc(w.n)}" style="margin-top:14px" id="qPick">${ic("checkmark")}That's my pick</button>
      <button class="btn ghost" id="qAgain" style="margin-top:10px">${ic("arrows_clockwise")}Start over</button>`;
    body.scrollTop=0;SFX.win();setTimeout(()=>FX.confetti([innerWidth/2,innerHeight*.35],80),250);
    if(first){S.quizDay=today();save();setTimeout(()=>Wallet.add(25,$("#qEarn")),700);}
    $("#qAgain").onclick=start;$("#qPick").addEventListener("click",()=>setTimeout(close,50));
  }
  function start(){pool=base();pool.forEach(i=>i._j=Math.random());asked=[];why=[];$("#short").classList.add("hide");ask();}
  function close(){$("#quiz").classList.remove("on");if(curTab==="home")UI.home();}
  $("#qclose").onclick=()=>{SFX.tap();close();};
  return{open(){$("#quiz").classList.add("on");start();}};
})();

/* ================= ONBOARDING ================= */
const Onb=(()=>{
  const el=$("#onb");let step=0,hero=null,hits=0,busy=false,minted=false,count=0;
  const PAY=[100,150,250];
  function show(i){step=i;$$(".step",el).forEach(s=>s.classList.toggle("on",+s.dataset.s===i));Avatar.paint();
    if(i===2&&!hero){hero=Coin.attach($("#mint"),{noDrag:true,emb:1,idle:.55,vel:.55,tilt:.24,scale:.9,glEvery:2.6});hero.ang=-.35;hero.glT=.2;}}
  el.addEventListener("click",e=>{if(e.target.closest("[data-next]")){SFX.tap();if(step===1){S.name=$("#obName").value.trim().slice(0,14);$("#obName").blur();save();}show(step+1);}});
  function countTo(to){const from=count,t0=performance.now(),mc=$("#mintCount");count=to;mc.classList.remove("bump");void mc.offsetWidth;mc.classList.add("bump");
    const tick=t=>{const u=clamp((t-t0)/600,0,1);mc.textContent="+"+fmt(lerp(from,to,1-Math.pow(1-u,3)));if(u<1)requestAnimationFrame(tick);};requestAnimationFrame(tick);}
  function strike(){
    if(busy||minted||!hero)return;
    busy=true;hits++;SFX.stamp(hits);
    const f=$("#obFlash");f.classList.remove("go");void f.offsetWidth;f.classList.add("go");
    $$("#strikes i").forEach((d,i)=>d.classList.toggle("on",i<hits));
    hero.sq=1;hero.vel=7+hits*4;hero.sweep();
    $("#mint").animate([{transform:"translateY(0) scale(1)"},{transform:"translateY(10px) scale(.92)"},{transform:"translateY(-6px) scale(1.05)"},{transform:"none"}],{duration:380,easing:"cubic-bezier(.2,.8,.2,1)"});
    FX.burst($("#mintWrap"),RM?4:6+hits*5,{power:560+hits*80});SFX.coins(2+hits);
    countTo(PAY.slice(0,hits).reduce((a,b)=>a+b,0));
    $("#tapHintT").textContent=hits===1?"Again!":hits===2?"One more!":"";
    setTimeout(()=>{busy=false;if(hits>=3)mint();},420);
  }
  function mint(){
    minted=true;hero.idle=2.4;hero.vel=18;$("#mintWrap").classList.add("done");$("#tapHint").style.visibility="hidden";
    $("#mintH").textContent="Fresh from the mint.";$("#mintP").textContent="500 "+COIN+" to start. {{copy.mintLine|js}}";
    SFX.win();FX.burst($("#mintWrap"),RM?8:44);FX.confetti($("#mintWrap"),70);
    setTimeout(()=>$("#mintDone").classList.add("on"),700);
  }
  function finish(){
    if(!S.onboarded){S.onboarded=true;if(!FROZEN){S.coins+=500;if(S.visits<1)S.visits=1;}}
    save();el.classList.remove("on");UI.wallet(false);UI.go("home");
    setTimeout(()=>toast("First visit stamped. Your Season Pass has a reward waiting."),600);
  }
  $("#mintWrap").addEventListener("pointerdown",e=>{e.preventDefault();strike();});
  $("#mintDone").onclick=()=>{SFX.tap();finish();};
  return{start(){hits=0;busy=false;minted=false;count=0;if(hero){hero.idle=.55;}
    $$("#strikes i").forEach(d=>d.classList.remove("on"));$("#mintWrap").classList.remove("done");$("#tapHint").style.visibility="";$("#tapHintT").textContent="Tap the coin";
    $("#mintCount").textContent="";$("#mintDone").classList.remove("on");
    $("#mintH").textContent="Strike your first coin.";$("#mintP").textContent="Every {{short|js}} coin is struck by hand. Give it three good taps.";
    $("#obName").value=S.name||"";el.classList.add("on");show(0);}};
})();

/* ================= BOOT ================= */
/* an NFC tag or QR at the venue (play/<id>/?tap=…, the same links the earlier app printed) stamps today's visit, once a day */
const TAPPED=(()=>{try{const q=new URLSearchParams(location.search);if(!q.has("tap"))return false;q.delete("tap");
  const r=q.toString();history.replaceState(history.state,"",location.pathname+(r?"?"+r:"")+location.hash);
  if(FROZEN)return "off";if(S.lastTap===today())return "again";S.lastTap=today();S.visits++;save();return true;}catch(e){return false;}})();
(function boot(){
  if(TAPPED)setTimeout(()=>toast(TAPPED==="off"?OFF:TAPPED===true?"Visit stamped. Thanks for stopping by!":"Already stamped today. See you next visit."),S.onboarded?900:5200);
  fillIcons();UI.tabs();UI.menu();Avatar.paint();
  const im=new Image();
  im.onload=()=>{LOGO_IMG=im;Coin.init(im);UI.wallet(false);UI.go("home");
    /* #menu, #play, #pass, #store: the tab bar Grug shows in partner mode links straight to a tab */
    const tb=/^#(home|menu|play|pass|store)$/.exec(location.hash);if(tb)UI.go(tb[1]);if(!S.onboarded)Onb.start();
    addEventListener("hashchange",()=>{const tb=/^#(home|menu|play|pass|store)$/.exec(location.hash);if(tb)UI.go(tb[1]);});
    setTimeout(()=>Avatar.shoot(),S.onboarded?1500:4000);
  };
  im.onerror=()=>{UI.go("home");if(!S.onboarded)Onb.start();};
  im.src=LOGO;
})();
