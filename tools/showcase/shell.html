<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><script>/* old address → new home */(function(){var p=location.pathname;if(location.hostname==='gabrielman25.github.io'&&p.indexOf('/grugdigital/')===0)location.replace('https://grugdigital.pages.dev/'+p.slice(13)+location.search+location.hash);})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grug · Showcase</title>
<meta name="description" content="A demonstration walk-through of Grug: rewards apps, games and avatars made for Katy restaurants. Not endorsed by the businesses shown.">
<style>
/*@FONTS@*/
:root{
  --bg:#eef3e6;--surface:#f7f5ef;--line:#dcd8cb;--line2:#c9c4b4;--ink:#16210f;--ink2:#3b4434;--mut:#6a7163;
  --lime:#9be338;--lime-d:#5f9e17;--teal:#2dd4bf;--pink:#d16be8;--gold:#f59e0b;--danger:#c2410c;
  --r:22px;--r-s:14px;--font:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;--display:"Cal Sans","Outfit",system-ui,sans-serif;
  --top:64px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font);-webkit-text-size-adjust:100%}
body{min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.1}
p{margin:0}
.ic{width:1.15em;height:1.15em;fill:currentColor;flex:none;vertical-align:-.2em}
/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:var(--top);padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;flex:none;font:600 21px/1 var(--display);text-decoration:none;color:var(--ink)}
.brand svg{width:34px;height:34px}
.brand small{font:700 11px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;padding:5px 7px;border-radius:7px;background:var(--ink);color:var(--surface)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding:4px 0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{appearance:none;border:0;background:none;cursor:pointer;white-space:nowrap;font:600 15px/1 var(--font);color:var(--ink2);padding:10px 13px;border-radius:999px;display:flex;align-items:center;gap:7px}
.tabs button:hover{background:#ece8dc}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--surface)}
.reset{appearance:none;border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:9px 13px;font:600 14px/1 var(--font);cursor:pointer;display:flex;gap:6px;align-items:center;flex:none}
.reset:hover{background:#ece8dc}
/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;max-width:1280px;margin:0 auto;padding:26px 24px 60px}
.content{min-width:0;max-width:680px}
.stage{position:sticky;top:calc(var(--top) + 18px);align-self:start}
.devwrap{position:relative}
.device{width:390px;height:844px;border-radius:44px;background:var(--surface);border:10px solid var(--ink);overflow:hidden;transform-origin:top left;position:relative}
.device iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
.stage-bar{display:flex;align-items:center;gap:8px;margin-top:10px}
.addr{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font:500 13px/1.2 var(--font);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addr span{overflow:hidden;text-overflow:ellipsis}
.sbtn{appearance:none;border:1px solid var(--line2);background:var(--surface);border-radius:999px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;flex:none}
.sbtn:hover{background:#ece8dc}
.loading{position:absolute;inset:10px;border-radius:34px;display:grid;place-items:center;background:var(--surface);font:600 15px var(--font);color:var(--mut);z-index:2}
.loading[hidden]{display:none}
/* full-screen phone */
.stage.full{position:fixed;inset:0;z-index:50;background:var(--bg);padding:10px;display:flex;flex-direction:column;align-items:center}
.stage.full .devwrap{flex:1;width:100%;max-width:480px;height:auto!important}
.stage.full .device{width:100%!important;height:100%!important;transform:none!important;border-radius:28px;border-width:6px}
.stage.full .stage-bar{width:100%;max-width:480px}
/* ---------- content blocks ---------- */
.eyebrow{font:700 12px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--lime-d);margin-bottom:12px;display:flex;gap:7px;align-items:center}
.h1{font-size:clamp(34px,5vw,52px);margin-bottom:14px}
.h1 em{font-style:normal;color:var(--lime-d)}
.lead{font-size:18.5px;color:var(--ink2);max-width:58ch}
.h2{font-size:28px;margin:34px 0 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.stat{display:flex;flex-direction:column;gap:3px}
.stat b{font:600 30px/1 var(--display)}
.stat span{color:var(--mut);font-size:14.5px}
.btn{appearance:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:999px;padding:11px 16px;font:600 15px/1 var(--font);cursor:pointer;text-decoration:none}
.btn:hover{background:#ece8dc}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.primary:hover{background:#2b3a22}
.btn.lime{background:var(--lime);border-color:#86c92c;color:#13230a}
.btn.lime:hover{background:#8fd52f}
.btn.sm{padding:8px 12px;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mt{margin-top:18px}.mt2{margin-top:26px}
.note{font-size:14px;color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:#ece8dc;font:600 13px/1.2 var(--font);color:var(--ink2)}
/* steps */
.steps{counter-reset:s;display:grid;gap:10px}
.step{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start}
.step .n{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.step .n .ic{width:24px;height:24px}
.step h3{font-size:19px;margin:2px 0 4px}
.step p{color:var(--ink2)}
.step .btn{margin-top:10px}
/* restaurant cards */
.places{display:grid;gap:14px}
.place{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;padding:14px}
.place img.th{width:120px;height:120px;object-fit:cover;border-radius:16px;display:block;background:#e5e0d2}
.place h3{font-size:22px}
.place .sub{color:var(--mut);font-size:14.5px;margin:2px 0 8px}
.place[aria-current=true]{border:2px solid var(--ink)}
.facts{display:grid;gap:10px;margin-top:12px}
.facts h4{margin:0 0 6px;font:700 12px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.list{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.list li{display:flex;gap:10px;justify-content:space-between;font-size:15px;border-bottom:1px dashed var(--line);padding:4px 0;min-width:0}
.list li>span:first-child{min-width:0}
.list li span{color:var(--mut);font-size:13.5px}
.list li b{white-space:nowrap}
.cost{font:700 13px/1 var(--font);padding:5px 8px;border-radius:999px;background:#ece8dc;white-space:nowrap;align-self:center}
/* avatar */
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.look{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:6px 6px 8px;cursor:pointer;display:grid;gap:4px;justify-items:center;font:600 13px/1.2 var(--font)}
.look img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:12px;background:#ece8dc}
.look[aria-pressed=true]{border:2px solid var(--ink)}
.avbig{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:center}
.avbig img{width:200px;height:280px;object-fit:contain;background:#ece8dc;border-radius:18px}
/* pearls */
.packs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pk{text-align:center;padding:14px 8px}
.pk b{display:block;font:600 24px/1 var(--display)}
.pk span{font-size:13px;color:var(--mut)}
.pk .pearl{color:var(--pink)}.pk .pearl .ic{width:30px;height:30px}
.stats4{grid-template-columns:repeat(4,1fr)}
.pk .price{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:999px;background:var(--ink);color:var(--surface);font:700 14px/1 var(--font)}
.pearl{color:var(--pink)}
/* 3D avatar editor */
.v3d{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 30%,#fbfaf5 0%,#ece8dc 70%);touch-action:none}
.v3d canvas{width:100%;height:100%;display:block;cursor:grab}
.v3d canvas:active{cursor:grabbing}
.v3d .hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font:600 13px/1.3 var(--font);color:var(--mut);pointer-events:none}
.v3d .poses{position:absolute;left:10px;right:10px;top:12px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.v3d .poses button{appearance:none;border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:7px 11px;font:600 13px/1 var(--font);cursor:pointer}
.v3d .poses button[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.v3d .msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font:600 15px/1.4 var(--font);color:var(--ink2)}
.ed{display:grid;gap:16px}
.ed h4{margin:0 0 8px;font:700 12px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{appearance:none;border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:8px 12px;font:600 14px/1 var(--font);cursor:pointer;text-transform:capitalize}
.opt[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.sw{appearance:none;width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line2);cursor:pointer;padding:0}
.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--ink)}
.prt{appearance:none;width:48px;height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);padding:5px;cursor:pointer;display:grid;place-items:center;font:700 11px/1 var(--font);color:var(--mut)}
.prt img{width:100%;height:100%;object-fit:contain}
.prt[aria-pressed=true]{border:2px solid var(--ink)}
.edbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:calc(var(--top) + 8px);z-index:3;background:var(--bg);padding:8px 0}
/* owners */
.why{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.why .n{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#ece8dc}
.why h3{font-size:18px;margin-bottom:3px}
.why p{color:var(--ink2);font-size:15.5px}
/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:14px;font:600 15px/1.3 var(--font);max-width:calc(100vw - 32px);transition:.25s;pointer-events:none;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
/* boot */
.boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);font:600 17px var(--font);color:var(--ink2)}
.boot[hidden]{display:none}
.boot div{display:grid;gap:14px;justify-items:center;text-align:center;padding:24px}
.boot svg{width:64px;height:64px}
.boot.err{color:var(--danger)}
:focus-visible{outline:3px solid #2b7bd8;outline-offset:2px}
/* ---------- phone and tablet ---------- */
@media (max-width:960px){
  .wrap{grid-template-columns:minmax(0,1fr);padding:18px 16px 40px;gap:18px}
  .content{max-width:none}
  .stage{position:relative;top:0}
  .device{width:100%!important;height:min(78vh,760px)!important;transform:none!important;border-width:6px;border-radius:28px}
  .devwrap{height:auto!important}
  .brand small{display:none}
  .reset b{display:none}
  .place{grid-template-columns:64px minmax(0,1fr);gap:12px}
  .place img.th{width:64px;height:64px;border-radius:12px}
  .stats4{grid-template-columns:repeat(2,1fr)!important}
  .avbig{grid-template-columns:140px 1fr}
  .avbig img{width:140px;height:196px}
  .packs{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:960px){
  /* avatar tab on phones: the character stays pinned at the top while the options scroll under it */
  body.tab-avatar .stage{order:-1;position:sticky;top:var(--top);z-index:5;background:var(--bg);padding-bottom:6px;margin:0 -16px;padding-left:16px;padding-right:16px}
  body.tab-avatar .device{height:44vh!important}
  body.tab-avatar .stage-bar{display:none}
  body.tab-avatar .stage.full .stage-bar{display:flex}
  body.tab-avatar .edbar{position:static}
  body.tab-avatar .v3d .poses button{padding:6px 9px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="boot" id="boot" role="status"><div><span id="bootLogo"></span><span id="bootMsg">Unpacking the showcase…</span></div></div>
<header class="top">
  <a class="brand" href="#overview" id="brand"><span id="logo"></span>Grug <small>Showcase</small></a>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  <button class="reset" id="reset" type="button" title="Start the demo over"><span id="icReset"></span><b>Reset demo</b></button>
</header>
<main class="wrap">
  <section class="content" id="content" aria-live="polite"></section>
  <aside class="stage" id="stage" aria-label="Live preview">
    <div class="devwrap" id="devwrap"><div class="device" id="device"><div class="loading" id="loading" hidden>Loading…</div><div class="v3d" id="v3d" hidden></div></div></div>
    <div class="stage-bar">
      <button class="sbtn" id="back" type="button" aria-label="Back"></button>
      <div class="addr" id="addr"><span id="addrIc"></span><span id="addrTxt">grugdigital/</span></div>
      <button class="sbtn" id="full" type="button" aria-label="Full screen"></button>
    </div>
  </aside>
</main>
<div class="toast" id="toast" role="status"></div>
<script type="application/octet-stream" id="pack">@PACK@</script>
<script type="application/octet-stream" id="engine">@ENGINE@</script>
<script>
/*@LOADER@*/
const META = "@META@";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic = (n, cls) => '<svg class="ic' + (cls ? ' ' + cls : '') + '" viewBox="0 0 16 16" aria-hidden="true">' + (META.icons[n] || META.icons.question || '') + '</svg>';
const GAMES = META.games, FACTS = META.facts;
const SITE = 'grugdigital.pages.dev/';
let PACK = null;

/* ---------- unpack: one gzip block holding every page, script and picture ---------- */
const unpack = () => GL.unpack();
function storageOK(){ return true; }   // memory-only storage (see loader.js)

/* ---------- the phone: each page is written into a fresh frame so it keeps its own address, routing and storage ---------- */
let frame = null, cur = {key:'', search:'', hash:''}, hist = [];
const pageByPath = p => Object.entries(PACK.pages).find(([k, v]) => v.path === p);
const pageHTML = (key, search, hash) => GL.pageHTML(key, search, hash);
let showNext = false;
function loadPage(key, search, hash, opts){
  if(!PACK.pages[key]) return toast('That page isn’t in the showcase.');
  opts = opts || {}; if(showNext){ opts.show = true; showNext = false; }
  if(cur.key && !opts.noHist) hist.push(Object.assign({}, cur));
  cur = {key, search: search || '', hash: hash || ''};
  const f = document.createElement('iframe');
  f.title = 'Live preview of ' + (PACK.pages[key].path || 'home');
  f.allow = 'autoplay; fullscreen; gamepad; clipboard-write';
  const box = $('#device');
  if(frame) frame.remove();
  frame = f; box.appendChild(f);
  $('#loading').hidden = false;
  const d = f.contentDocument; d.open(); d.write(pageHTML(key, search, hash)); d.close();
  setTimeout(() => { $('#loading').hidden = true; }, 60);
  $('#addrTxt').textContent = SITE + PACK.pages[key].path + (search || '') + (hash || '');
  if(opts.show && innerWidth <= 960) $('#stage').scrollIntoView({block: 'start', behavior: 'smooth'});
  $('#back').disabled = !hist.length;
  return f;
}
function reloadPage(hash){ return loadPage(cur.key, '', hash == null ? cur.hash : hash, {noHist: true}); }
const win = () => frame && frame.contentWindow;

// links and code inside the pages land here
window.__GRUG_ASSETS = null;
window.__grugNav = (path, search, hash) => { setTimeout(() => grugNav(path, search, hash), 0); };   // deferred, see loader.js
function grugNav(path, search, hash){
  path = String(path || '').replace(/^\/+/, '').replace(/(^|\/)index\.html$/, '$1');
  if(/^avatar\/?$/.test(path)){ ED.mode = '3d'; setTab('avatar'); return; }
  const hit = pageByPath(path) || pageByPath(path + '/');
  if(hit) loadPage(hit[0], search, hash); else toast('That page isn’t in the showcase.');
};
window.__grugDemoBuy = (link, w) => {
  let packs = null; try{ packs = w.__grugPacks || null; }catch(e){}
  const p = packs && packs.find(x => link.indexOf(x.link) === 0);
  if(!p) return toast('Checkout is turned off in the showcase.');
  toast('Demo checkout: no money is taken. On the live site this opens Stripe.');
  setTimeout(() => loadPage('pearls', '?pack=' + encodeURIComponent(p.id) + '&cs=cs_demo_' + Math.random().toString(36).slice(2, 12), ''), 900);
};

/* ---------- demo helpers for the rewards apps ---------- */
const gameOf = id => GAMES.find(g => g.id === id);
function ensureApp(id){ const k = 'app-' + id; if(cur.key !== k) loadPage(k); return win(); }
function storeId(){ try{ return (win().__grugStore && win().__grugStore()) || ''; }catch(e){ return ''; } }
function demoTap(id){
  ensureApp(id);
  let q = ''; try{ q = (win().__grugTap && win().__grugTap()) || ''; }catch(e){}
  if(!q) return toast('This app checks in with a code on the counter instead of a tag.');
  loadPage('app-' + id, q, '', {noHist: true});
  toast('Tag tapped: the phone opened the app and collected today’s check-in.');
}
function demoPoints(id, n){
  ensureApp(id);
  const g = gameOf(id);
  let ok = false; try{ ok = !!(win().__grugAddPts && win().__grugAddPts(n)); }catch(e){}
  if(!ok) return toast('This one doesn’t use points.');
  const s = storeId(); reloadPage(s ? '#' + s + '/rewards' : '');
  toast('+' + n + ' demo points at ' + g.partner + '.');
}
function demoOpen(id, tab){
  ensureApp(id);
  const s = storeId();
  if(tab && s) reloadPage('#' + s + '/' + tab);
}

/* ---------- sections ---------- */
const TABS = [
  ['overview', 'Overview', 'house'], ['how', 'How it works', 'sparkle'], ['places', 'Restaurants', 'storefront'],
  ['avatar', 'Avatar', 't-shirt'], ['pearls', 'Pearls', 'pearl'], ['owners', 'For owners', 'hand-waving']];
let tab = 'overview', place = 'yoshi';
const live = GAMES.filter(g => g.status === 'live');
const visitPts = id => (FACTS[id] && FACTS[id].points && FACTS[id].points.checkin) || null;

const R = {
  overview(){
    const pts = live.map(g => visitPts(g.id)).filter(Boolean);
    return '<p class="eyebrow">' + ic('sparkle') + 'Katy, Texas</p>' +
      '<h1 class="h1">Games made for <em>Katy restaurants.</em></h1>' +
      '<p class="lead"><b>This walk-through is a demonstration.</b> The businesses shown have not approved or endorsed it, nothing in it is saved, and no rewards are offered or redeemable. The idea: every restaurant gets its own rewards app and a game built from its menu. Guests tap a tag at the counter, earn points, and spend them on power-ups in the restaurant’s game. One avatar and one wallet work across every game.</p>' +
      '<div class="grid stats4 mt2">' +
        stat(GAMES.length, 'demo games') + stat(Math.min.apply(null, pts) + '–' + Math.max.apply(null, pts), 'points per visit') + stat('1 tap', 'to check in, no account') + stat('1', 'avatar in every game') +
      '</div>' +
      '<div class="row mt2"><button class="btn primary" data-go="how">' + ic('play') + 'See how it works</button><button class="btn" data-go="places">' + ic('storefront') + 'Open a restaurant’s app</button></div>' +
      '<h2 class="h2">The demonstrations</h2><div class="grid g2">' + GAMES.filter(g => g.status !== 'legacy').map(g =>
        '<button class="card place-mini btn" style="border-radius:18px;justify-content:flex-start;padding:10px;gap:12px;text-align:left" data-place="' + g.id + '"><img src="' + META.thumbs[g.id] + '" alt="" style="width:56px;height:56px;border-radius:12px;object-fit:cover">' +
        '<span><b style="display:block;font-size:15.5px">' + esc(g.partner) + '</b><span class="note">' + esc(g.title) + ' · ' + esc(g.kind) + '</span></span></button>').join('') + '</div>' +
      '<p class="note mt">The phone shows the real Grug site. Tap around: every link works inside the showcase.</p>';
  },
  how(){
    const step = (n, icn, h, p, btn) => '<div class="step"><div class="n">' + ic(icn) + '</div><div><h3>' + n + '. ' + h + '</h3><p>' + p + '</p>' + (btn || '') + '</div></div>';
    const tea = gameOf('teahouse');

    const ring = new T.Mesh(new T.RingGeometry(70, 74, 64), new T.MeshBasicMaterial({color: 0x9be338})); ring.rotation.x = -Math.PI / 2; ring.position.y = 0.2; scene.add(ring);

  $('#content').innerHTML = R[t]();
  if(t === 'avatar'){ stageMode(ED.mode); if(ED.mode === '3d') startEditor(); }
  else { $('#v3d').hidden = true; if(frame) frame.style.visibility = ''; }
  if(!quiet && t !== 'avatar'){ const k = TAB_PAGE[t] || 'app-' + place; if(cur.key !== k) loadPage(k); else $('#addrTxt').textContent = SITE + PACK.pages[cur.key].path + cur.search + cur.hash; }
  if(location.hash !== '#' + t) history.replaceState(null, '', '#' + t);
  window.scrollTo({top: 0});
}
$('#content').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  const d = b.dataset;
  if(d.tap || d.pts || d.app || d.page) showNext = true;
  if(d.go) return setTab(d.go);
  if(d.place){ place = d.place; setTab('places', true); demoOpen(d.place); setTimeout(() => { const c = document.querySelector('[data-placecard="' + d.place + '"]'); c && c.scrollIntoView({block: 'start', behavior: 'smooth'}); }, 50); return; }
  if(d.tap){ place = d.tap; markPlace(); return demoTap(d.tap); }
  if(d.pts){ place = d.pts; markPlace(); return demoPoints(d.pts, 50); }
  if(d.app){ place = d.app; markPlace(); return demoOpen(d.app, d.tab); }
  if(d.page) return loadPage(d.page);
});
function markPlace(){ for(const c of document.querySelectorAll('[data-placecard]')) c.setAttribute('aria-current', String(c.dataset.placecard === place)); }

/* ---------- phone size, back, full screen ---------- */
function fit(){
  const dev = $('#device'), wrap = $('#devwrap');
  if(innerWidth <= 960 || $('#stage').classList.contains('full')){ dev.style.transform = ''; wrap.style.height = ''; wrap.style.width = ''; return; }
  const s = Math.min(1, (innerHeight - 64 - 18 - 70) / 864);
  dev.style.transform = 'scale(' + s + ')'; wrap.style.height = (864 * s) + 'px'; wrap.style.width = (410 * s) + 'px';
}
addEventListener('resize', fit);
$('#back').addEventListener('click', () => { const h = hist.pop(); if(h) loadPage(h.key, h.search, h.hash, {noHist: true}); $('#back').disabled = !hist.length; });
$('#full').addEventListener('click', () => { const s = $('#stage'); s.classList.toggle('full'); $('#full').innerHTML = ic(s.classList.contains('full') ? 'arrows-in' : 'arrows-out'); $('#full').setAttribute('aria-label', s.classList.contains('full') ? 'Exit full screen' : 'Full screen'); fit(); });
addEventListener('keydown', e => { if(e.key === 'Escape' && $('#stage').classList.contains('full')) $('#full').click(); });
$('#reset').addEventListener('click', () => {
  if(confirm('Reset the demo? This clears all demo points, Pearls and looks. Nothing is ever saved on this device.')) location.reload();
});
let tT = 0;
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tT); tT = setTimeout(() => t.classList.remove('on'), 3200); }

/* ---------- go ---------- */
(async function boot(){
  $('#bootLogo').innerHTML = META.logo; $('#logo').innerHTML = META.logo;
  $('#icReset').innerHTML = ic('arrow-counter-clockwise'); $('#back').innerHTML = ic('arrow-left'); $('#full').innerHTML = ic('arrows-out'); $('#addrIc').innerHTML = ic('lock-simple');
  $('#tabs').innerHTML = TABS.map(t => '<button type="button" role="tab" data-tab="' + t[0] + '" aria-selected="false">' + ic(t[2]) + t[1] + '</button>').join('');
  $('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if(b) setTab(b.dataset.tab); });
  $('#brand').addEventListener('click', e => { e.preventDefault(); setTab('overview'); });
  try{ PACK = await unpack(); }
  catch(e){ $('#boot').classList.add('err'); $('#bootMsg').textContent = e.message || 'The showcase couldn’t open.'; return; }
  if(!storageOK()){ $('#boot').classList.add('err'); $('#bootMsg').textContent = 'This browser is blocking storage (private mode?). Open the showcase in a normal window.'; return; }
  window.__GRUG_ASSETS = PACK.assets;
  if(!localStorage.getItem('grug.sandy.v1')) wearLook('classic', true);   // a look with pictures, so pages never wait on the 3D engine
  const t = location.hash.slice(1); setTab(R[t] ? t : 'overview');
  addEventListener('hashchange', () => { const h = location.hash.slice(1); if(R[h] && h !== tab) setTab(h); });
  fit(); $('#boot').hidden = true;
})();
</script>
