<script>
/* grugdigital.com/tizzy: GrugPearls.CFG.promos.tizzy (600) bonus Pearls, on top of a new player's starting 80.
   Someone who already plays gets the 600 added to their wallet. Once per wallet (GrugPearls.start handles both). */
(function () {
  const $ = s => document.querySelector(s), P = window.GrugPearls;
  P.start('tizzy').then(r => {
    $('#n').textContent = P.balance().toLocaleString(); $('#big').hidden = false;
    if (r.promo && r.bonus) {
      $('#tag').textContent = 'Welcome back'; $('#title').textContent = 'You got ' + r.bonus + ' bonus Pearls';
      $('#text').textContent = 'Thanks for coming back! ' + r.bonus + ' Pearls were added to your wallet' + (r.daily ? ' (plus ' + r.daily + ' for today)' : '') + '. Spend them to export characters from the Avatar Studio.';
    } else if (r.promo) {
      $('#text').textContent = 'You start with ' + r.welcome + ' Pearls, including a 600 Pearl bonus. Make your own Roblox character for free, and spend Pearls to export it as an R6 file for your game.';
    } else {
      $('#tag').textContent = 'Welcome back'; $('#title').textContent = 'You’re already a Grug player';
      $('#text').textContent = 'You already got this bonus, so your Pearls stay as they are' + (r.daily ? ' (plus ' + r.daily + ' for today)' : '') + '. You still get free Pearls every day you visit.';
    }
  });
})();
</script>
