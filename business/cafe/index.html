/* ==========================================================================
   Shop dashboards · app.css
   The Grug Digital look (same as the restaurant dashboard): Fredoka everywhere, flat accents with a darker
   "lip" shadow, off-black ink on anything filled with an accent, light warm surfaces, no gradients.
   Each business type sets --mode / --lo / --bg / --accent-2 in its own config.
   ========================================================================== */
:root{
  --ui:1;font-size:calc(17px * var(--ui));
  --bg:#F6F4EF;--panel:#FFFFFF;--field:#F1EEE7;--field-hi:#E9E5DC;--line:#E2DDD3;--line-2:#D3CCBF;
  --text:#1E1B16;--text-2:#4A453D;--muted:#6B655B;--faint:#8F887C;--ink:#1E1B16;
  --ok:#3DDC84;--ok-bg:#DDF7E8;--ok-ink:#11663A;--warn:#FFBE1A;--warn-bg:#FFF2CC;--warn-ink:#7A5600;--bad:#FF5A5A;--bad-bg:#FFE4E1;--bad-ink:#9E1B14;
  --mode:#9BE338;--lo:#6FB31C;--accent-2:#FFBE1A;--accent-2-lo:#D99A00;
  --ease:cubic-bezier(.2,.8,.2,1);
  --sh-float:0 .25rem .9rem rgba(30,27,22,.07),inset 0 0 0 1px rgba(30,27,22,.07);
  --sh-lift:0 .5rem 1.4rem rgba(30,27,22,.11),inset 0 0 0 1px rgba(30,27,22,.07);
  --sh-pop:0 1rem 2.6rem rgba(30,27,22,.22),inset 0 0 0 1px rgba(30,27,22,.07);
  --tint:color-mix(in srgb,var(--mode) 14%,#fff);--tint-2:color-mix(in srgb,var(--mode) 30%,#fff);
  --side:15.5rem;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.5 'Fredoka',"Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent;cursor:pointer}
h1,h2,h3,p{margin:0}
svg.i{width:1.25em;height:1.25em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:.18rem solid var(--ink);outline-offset:.15rem;border-radius:.3rem}
[hidden]{display:none!important}
.mute{color:var(--muted)}.small{font-size:.86rem}.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}

/* ---------- shell: one column, a top bar with Home, who's using it, and help ---------- */
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.mainc{min-width:0;display:flex;flex-direction:column;flex:1}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.6rem;min-height:4rem;padding:.45rem 1.2rem;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--line)}
.top h1{font-size:1.2rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top .sp{flex:1}
.homebtn{display:inline-flex;align-items:center;gap:.4rem;min-height:2.9rem;padding:0 1.1rem 0 .8rem;border:0;border-radius:.6rem;background:var(--mode);color:var(--ink);font-weight:700;font-size:1rem;box-shadow:0 .18rem 0 var(--lo);flex:none}
.homebtn:active{transform:translateY(.1rem)}
.brandtop{display:flex;align-items:center;gap:.6rem;min-width:0}
.brandtop b{font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;align-items:center;gap:.65rem;border:0;background:none;text-align:left;color:var(--ink)}
.logo{width:2.6rem;height:2.6rem;border-radius:.7rem;background:var(--mode);box-shadow:0 .2rem 0 var(--lo);display:grid;place-items:center;flex:none}
.logo svg{width:1.6rem;height:1.6rem}
.brand b{display:block;font-size:1.08rem;line-height:1.15}
.brand small{display:block;font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:.4rem;min-height:2.6rem;padding:0 .9rem;border:0;border-radius:2rem;background:var(--field);color:var(--ink);font-weight:600;font-size:.9rem;white-space:nowrap}
.chip.warn{background:var(--warn-bg);box-shadow:inset 0 0 0 1.5px #F5D27A}
.chip.bad{background:var(--bad);color:#fff;animation:pulse 1.2s ease-in-out infinite}
.chip.who{padding-left:.3rem;background:var(--panel);box-shadow:var(--sh-float)}
.chip.who .av{width:2rem;height:2rem;font-size:.75rem}
.helpbtn{width:2.9rem;height:2.9rem;border-radius:50%;background:var(--panel);box-shadow:var(--sh-float);color:var(--ink)}
.helpbtn .i{width:1.5rem;height:1.5rem}
.clock{font-weight:600;color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap}
main#view{width:100%;max-width:70rem;margin:0 auto;padding:1.3rem 1.3rem 2.5rem;flex:1}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1.2rem;justify-content:space-between;max-width:70rem;width:100%;margin:0 auto;padding:1rem 1.3rem 1.6rem;color:var(--muted);font-size:.82rem}
.foot a{color:var(--text-2)}
.playlink{display:inline-flex;align-items:center;gap:.5rem;padding:.35rem .8rem .35rem .4rem;border-radius:2rem;background:var(--panel);box-shadow:var(--sh-float);color:var(--ink)!important;text-decoration:none;font-weight:600}
.playlink .dot{width:1.6rem;height:1.6rem;border-radius:50%;background:var(--accent-2);display:grid;place-items:center}
.playlink .dot .i{width:.95rem;height:.95rem}
.tabbar{display:none}

/* ---------- Today ---------- */
.hello{display:flex;align-items:flex-end;gap:1rem;margin-bottom:1rem}
.hello h2{font-size:2rem;line-height:1.1}
.hello p{color:var(--text-2);font-size:1.05rem}
.whobar{display:flex;align-items:center;gap:.9rem;width:100%;text-align:left;border:0;border-radius:.9rem;padding:.9rem 1.1rem;margin-bottom:1rem;background:var(--panel);box-shadow:inset 0 0 0 2px var(--mode),var(--sh-float);color:var(--ink)}
.whobar>.i:first-child{width:2rem;height:2rem;color:var(--lo)}
.whobar b{display:block;font-size:1.08rem}.whobar small{color:var(--text-2)}
.todolist{list-style:none;margin:0 0 .6rem;padding:0;display:grid;gap:.6rem;counter-reset:td}
.todo{display:flex;align-items:center;gap:.9rem;padding:.85rem .9rem .85rem 1rem;border-radius:1rem;background:var(--panel);box-shadow:var(--sh-float);counter-increment:td}
.todo .tic{width:2.9rem;height:2.9rem;border-radius:.8rem;display:grid;place-items:center;flex:none;background:var(--tint);color:var(--lo);position:relative}
.todo .tic::after{content:counter(td);position:absolute;top:-.4rem;left:-.4rem;width:1.35rem;height:1.35rem;border-radius:50%;background:var(--ink);color:#fff;font-size:.72rem;font-weight:700;display:grid;place-items:center}
.todo .tic .i{width:1.6rem;height:1.6rem}
.todo b{display:block;font-size:1.1rem;line-height:1.25}
.todo small{display:block;color:var(--text-2);font-size:.92rem;line-height:1.35;margin-top:.15rem}
.todo .btn{flex:none}
.todo .grow,.whobar .grow,.caught>div{flex:1;min-width:0}
.todo.warn{background:var(--warn-bg);box-shadow:inset 0 0 0 2px #F5D27A}
.todo.warn .tic{background:var(--warn);color:var(--ink)}
.todo.bad{background:var(--bad);color:#fff;box-shadow:0 .3rem 0 #C0302B;animation:shake 2.4s ease-in-out infinite}
.todo.bad small{color:#fff}.todo.bad .tic{background:#fff;color:var(--bad-ink)}
.todo.bad .btn.dark{background:#fff;color:var(--bad-ink);box-shadow:0 .2rem 0 #8E1A15}
.caught{display:flex;align-items:center;gap:1rem;padding:1.1rem 1.2rem;border-radius:1rem;background:var(--ok-bg);box-shadow:inset 0 0 0 2px #A6E9C3;margin-bottom:.8rem}
.caught>.i{width:2.4rem;height:2.4rem;color:var(--ok-ink)}
.caught b{display:block;font-size:1.15rem}.caught small{color:var(--text-2)}
.donecount{display:flex;gap:.4rem;align-items:flex-start;color:var(--ok-ink);font-weight:600;font-size:.92rem;margin:.2rem 0 1.4rem}
.donecount .i{flex:none;margin-top:.1rem}
.tiles{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,13.5rem),1fr))}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;text-align:left;border:0;border-radius:1rem;padding:1rem 1rem .95rem;background:var(--panel);box-shadow:var(--sh-float);color:var(--ink);min-height:8.2rem;transition:transform .12s,box-shadow .12s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--sh-lift)}.tile:active{transform:scale(.97)}
.tile .ti{width:2.8rem;height:2.8rem;border-radius:.75rem;display:grid;place-items:center;background:var(--tint);color:var(--lo);margin-bottom:.2rem}
.tile .ti .i{width:1.6rem;height:1.6rem}
.tile b{font-size:1.05rem;line-height:1.2}
.tile small{color:var(--text-2);font-size:.88rem;line-height:1.3}
.tile.warn{box-shadow:inset 0 0 0 2px #F5D27A,var(--sh-float)}.tile.warn small{color:var(--warn-ink);font-weight:600}
.tile.bad{background:var(--bad-bg);box-shadow:inset 0 0 0 2px #F6B3AC}.tile.bad small{color:var(--bad-ink);font-weight:700}

/* ---------- help ---------- */
.howto{border-radius:1rem;padding:1rem 1.15rem;margin:0 0 1.1rem;background:var(--tint);box-shadow:inset 0 0 0 2px var(--tint-2)}
.howto .hh{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem}
.howto .hh .i{color:var(--lo)}.howto .hh b{font-size:1.05rem}.howto .hh .sp{flex:1}
ol.steps{margin:.3rem 0 .6rem;padding:0;list-style:none;counter-reset:st;display:grid;gap:.55rem}
ol.steps li{position:relative;padding-left:2.3rem;line-height:1.45}
ol.steps li::before{counter-increment:st;content:counter(st);position:absolute;left:0;top:-.05rem;width:1.65rem;height:1.65rem;border-radius:50%;background:var(--mode);box-shadow:0 .12rem 0 var(--lo);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.menu{display:grid;gap:.2rem}
.menu .row{min-height:3.6rem;border-radius:.7rem}
.menu .row:hover{background:var(--tint)}
.menu .row .i{color:var(--lo)}
details.past{margin:1.4rem 0 0;border-radius:.9rem;background:var(--panel);box-shadow:var(--sh-float)}
details.past>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:.6rem;min-height:3.3rem;padding:.4rem 1.1rem;font-weight:700}
details.past>summary::-webkit-details-marker{display:none}
details.past>summary::after{content:"";margin-left:auto;width:.55rem;height:.55rem;border-right:.17rem solid currentColor;border-bottom:.17rem solid currentColor;transform:rotate(45deg) translateY(-.15rem);transition:transform .2s}
details.past[open]>summary::after{transform:rotate(-135deg)}
details.past>div{padding:0 .8rem .9rem}
details.past .list,details.past .tbl-wrap,details.past .card{box-shadow:none;background:var(--bg)}
details.how{margin:0 0 .4rem 3.3rem}
details.how>summary{display:inline-flex;cursor:pointer;font-size:.86rem;font-weight:700;color:var(--lo);text-decoration:underline;text-underline-offset:3px;padding:.1rem 0}
details.how>summary::-webkit-details-marker{display:none}
details.how p{font-size:.92rem;color:var(--text-2);background:var(--tint);padding:.5rem .7rem;border-radius:.5rem;margin-top:.25rem}
.legal{display:flex;gap:.5rem;align-items:flex-start;font-size:.84rem;color:var(--muted);margin:1.4rem 0 0}
.legal .i{flex:none;width:1.1rem;height:1.1rem;margin-top:.1rem}
.legal b{color:var(--text-2)}
.bar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:.9rem}

/* ---------- wizards ---------- */
.dlg.wiz{width:min(34rem,100%);padding:1.3rem 1.4rem 1.1rem}
.wizh{display:flex;align-items:center;gap:.6rem;font-weight:700;color:var(--text-2)}
.wizh .sp{flex:1}
.dots{display:flex;gap:.35rem;margin:.6rem 0 1rem}
.dots i{flex:1;height:.4rem;border-radius:1rem;background:var(--field-hi)}.dots i.on{background:var(--mode)}
h2.q{font-size:1.6rem;line-height:1.2;margin:.2rem 0 .5rem}
p.hint{color:var(--text-2);font-size:1.02rem;margin:0 0 1rem}
.wizin{display:flex;align-items:center;gap:.6rem;margin:.4rem 0 .8rem}
.wizin input{font-size:2rem;font-weight:700;min-height:4rem;text-align:center;font-variant-numeric:tabular-nums}
.wizin b{font-size:1.4rem;color:var(--text-2)}
.bigicon{width:4.5rem;height:4.5rem;border-radius:1.2rem;background:var(--mode);display:grid;place-items:center;box-shadow:0 .25rem 0 var(--lo);margin-bottom:.8rem}
.bigicon .i{width:2.6rem;height:2.6rem}
.pick{display:grid;gap:.5rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,16rem),1fr))}
.pk{display:flex;align-items:center;gap:.7rem;padding:.6rem .8rem;border-radius:.8rem;background:var(--field);cursor:pointer;opacity:.6;transition:opacity .15s,background .15s}
.pk.on{opacity:1;background:var(--tint);box-shadow:inset 0 0 0 2px var(--tint-2)}
.pk input{width:1.3rem;height:1.3rem;accent-color:var(--lo);flex:none}
.pk .ti{width:2.2rem;height:2.2rem;border-radius:.6rem;background:#fff;display:grid;place-items:center;color:var(--lo);flex:none}
.pk b{display:block;font-size:.95rem}.pk small{display:block;font-size:.8rem;color:var(--text-2);line-height:1.3}
.verdict{display:flex;gap:.8rem;align-items:flex-start;padding:.9rem 1rem;border-radius:.9rem;margin:.4rem 0 .9rem;background:var(--ok-bg);box-shadow:inset 0 0 0 2px #A6E9C3}
.verdict>.i{width:1.8rem;height:1.8rem;flex:none}
.verdict b{display:block;font-size:1.15rem}.verdict small{display:block;color:var(--text-2);margin-top:.2rem;font-size:.95rem}
.verdict.warn{background:var(--warn-bg);box-shadow:inset 0 0 0 2px #F5D27A}
.verdict.bad{background:var(--bad-bg);box-shadow:inset 0 0 0 2px #F6B3AC}
.whogrid{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fill,minmax(6.5rem,1fr))}
.whopick{display:flex;flex-direction:column;align-items:center;gap:.4rem;padding:.9rem .4rem;border:0;border-radius:1rem;background:var(--field);color:var(--ink);font-size:1rem}
.whopick:hover{background:var(--tint)}.whopick:active{transform:scale(.95)}
.av.lg{width:3.2rem;height:3.2rem;font-size:1.05rem}
.av.xl{width:5rem;height:5rem;font-size:1.6rem;margin:0 auto .6rem}
.hello-big{text-align:center;padding:.8rem 0 .2rem}
.hello-big h2{font-size:2.2rem;justify-content:center}
.hello-big p{font-size:1.1rem;margin-top:.4rem}
.savebar{position:sticky;bottom:0;display:flex;justify-content:flex-end;padding:.8rem 0;background:linear-gradient(transparent,var(--bg) 35%)}
.cardacts{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.8rem}
.backupcard{box-shadow:inset 0 0 0 2px var(--tint-2),var(--sh-float)}
.backupcard.due{background:var(--warn-bg);box-shadow:inset 0 0 0 2px #F5D27A}
.backupcard p{margin-bottom:.5rem}
.fridge .done{margin:.5rem 0;display:flex;align-items:center;gap:.4rem}
.fridge.okd{box-shadow:inset 0 0 0 2px #A6E9C3}.fridge.okd .done .i{color:var(--ok-ink)}
.fridge.badd{background:var(--bad-bg);box-shadow:inset 0 0 0 2px #F6B3AC}
.tform{display:flex;gap:.5rem;align-items:center;margin-top:.6rem}
.tform input{font-size:1.4rem;font-weight:700;text-align:center;min-height:3.2rem}
.tform .unit{font-weight:700;color:var(--text-2)}
.notecard .nh{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.notecard .nt{white-space:pre-wrap;margin-top:.4rem;font-size:1.05rem}
.notecard.dim{opacity:.55}
.tile2{display:flex;flex-direction:column;gap:.2rem;text-align:left;border:0;width:100%;color:var(--ink)}
.tile2 .cat{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--lo)}
.tile2 b{font-size:1.15rem}.tile2 small{color:var(--muted)}
.tile2:hover{box-shadow:var(--sh-lift)}
.listcard{padding:.6rem .6rem .8rem}
.listcard .lh{display:flex;align-items:center;gap:.8rem;padding:.3rem .5rem .7rem}
.link.plain{text-decoration:none;text-align:left;background:none;border:0;color:inherit;padding:0;font:inherit}
.cellin{width:5.5rem;margin-left:auto;text-align:right;min-height:2.8rem!important;font-size:1.1rem!important;font-weight:700}
.rowacts{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.addhint{color:var(--line-2);font-size:1.4rem;font-weight:300;margin:auto}
.cell:hover .addhint{color:var(--lo)}
.chips.big button,.seg.big button{min-height:3rem;padding:0 1.1rem;font-size:1rem}
.step.big button{width:3rem;height:3rem;font-size:1.5rem}
.step.big input{width:4.6rem;min-height:3rem;font-size:1.25rem}
.step .unit{margin-left:.3rem;color:var(--text-2)}
.milkrow{flex-wrap:wrap}
.milkrow .grow{min-width:12rem}

/* ---------- page header ---------- */
.ph{display:flex;align-items:flex-end;flex-wrap:wrap;gap:.8rem 1rem;margin:0 0 1.1rem}
.ph .t{flex:1;min-width:14rem}
.ph h2{font-size:1.75rem;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.ph p{color:var(--text-2);margin-top:.25rem;max-width:44rem}
.ph .acts{display:flex;flex-wrap:wrap;gap:.5rem}
h3.sec{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-2);margin:1.6rem 0 .6rem;display:flex;align-items:center;gap:.6rem}
h3.sec .sp{flex:1}
h3.sec:first-child{margin-top:0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:3rem;padding:0 1.15rem;border:0;border-radius:.55rem;background:var(--panel);color:var(--ink);font-weight:700;font-size:.97rem;box-shadow:inset 0 0 0 1.5px var(--line-2),0 .18rem 0 var(--line-2);transition:transform .1s,box-shadow .1s,filter .12s;white-space:nowrap;text-decoration:none}
.btn:active{transform:translateY(.12rem) scale(.97);box-shadow:inset 0 0 0 1.5px var(--line-2),0 .04rem 0 var(--line-2)}
.btn.pri{background:var(--mode);box-shadow:0 .22rem 0 var(--lo)}.btn.pri:active{box-shadow:0 .05rem 0 var(--lo)}
.btn.alt{background:var(--accent-2);box-shadow:0 .22rem 0 var(--accent-2-lo)}
.btn.dark{background:var(--ink);color:#fff;box-shadow:0 .22rem 0 #000}
.btn.danger{color:var(--bad-ink);box-shadow:inset 0 0 0 1.5px #F2B8B2,0 .18rem 0 #F2B8B2}
.btn.ghost{background:none;box-shadow:none;color:var(--text-2)}.btn.ghost:hover{background:var(--field)}
.btn.sm{min-height:2.4rem;padding:0 .85rem;font-size:.88rem}
.btn.lg{min-height:3.6rem;padding:0 1.6rem;font-size:1.1rem}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ib{flex:none;width:2.5rem;height:2.5rem;border:0;border-radius:.5rem;background:none;color:var(--muted);display:inline-grid;place-items:center;transition:background .12s,transform .1s}
.ib:hover{background:var(--field);color:var(--ink)}.ib:active{transform:scale(.9)}
.ib.del:hover{background:var(--bad-bg);color:var(--bad-ink)}
.link{border:0;background:none;padding:0;color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--lo);text-decoration-thickness:2px;text-underline-offset:3px}

/* ---------- cards, grids ---------- */
.card{background:var(--panel);border-radius:.8rem;padding:1rem 1.1rem;box-shadow:var(--sh-float);min-width:0}
.card>h3{font-size:1rem;font-weight:700;margin:0 0 .5rem;display:flex;align-items:center;gap:.5rem}
.card>h3 .sp{flex:1}
.card>h3 .i{color:var(--lo)}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,19rem),1fr))}
.grid.g2{grid-template-columns:repeat(auto-fill,minmax(min(100%,24rem),1fr))}
.stack>*+*{margin-top:1rem}
.tile{display:flex;flex-direction:column;gap:.15rem;text-align:left;border:0;width:100%;cursor:pointer;transition:transform .12s,box-shadow .12s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--sh-lift)}
.big{font-size:2rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:1rem;padding:.35rem 0;box-shadow:0 1px 0 var(--line)}
.kv:last-child{box-shadow:none}
.kv b{font-variant-numeric:tabular-nums}

/* ---------- list rows ---------- */
.list{list-style:none;margin:0;padding:.2rem;background:var(--panel);border-radius:.8rem;box-shadow:var(--sh-float)}
.list>li+li{box-shadow:0 -1px 0 var(--line)}
.row{display:flex;align-items:center;gap:.8rem;width:100%;min-height:3.3rem;padding:.55rem .75rem;border:0;border-radius:.55rem;background:none;text-align:left;color:inherit}
button.row:hover{background:var(--tint)}
.row .grow{flex:1;min-width:0}
.row small{display:block;color:var(--muted);font-size:.84rem;line-height:1.35}
.row b{font-weight:600}
.row.low{background:var(--warn-bg)}.row.crit{background:var(--bad-bg)}
.swatch{width:.8rem;height:2rem;border-radius:.3rem;flex:none}
.av{width:2.3rem;height:2.3rem;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--ink);flex:none}
.tag{display:inline-flex;align-items:center;gap:.25rem;white-space:nowrap;padding:.15rem .55rem;border-radius:2rem;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--field);color:var(--text-2)}
.tag.ok{background:var(--ok-bg);color:var(--ok-ink)}.tag.warn{background:var(--warn-bg);color:var(--warn-ink)}.tag.bad{background:var(--bad);color:#fff}.tag.mode{background:var(--mode);color:var(--ink)}
.empty{text-align:center;padding:1.6rem 1rem;border-radius:.8rem;background:var(--tint);color:var(--text-2)}
.empty p{margin-bottom:.8rem}

/* ---------- tables ---------- */
.tbl-wrap{overflow:auto;background:var(--panel);border-radius:.8rem;box-shadow:var(--sh-float)}
table.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{position:sticky;top:0;background:var(--panel);text-align:left;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:.65rem .7rem;box-shadow:0 1px 0 var(--line);white-space:nowrap}
.tbl td{padding:.55rem .7rem;box-shadow:0 1px 0 var(--line);vertical-align:top}
.tbl tr:last-child td{box-shadow:none}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.bad td{background:var(--bad-bg)}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--tint)}

/* ---------- notes / banners ---------- */
.note{display:flex;gap:.7rem;align-items:flex-start;border-radius:.7rem;padding:.75rem .95rem;margin:0 0 1rem;background:var(--panel);box-shadow:var(--sh-float)}
.note>.i{margin-top:.1rem}
.note .grow{flex:1;min-width:0}
.note b{display:block}
.note.soft{background:var(--tint);box-shadow:none}
.note.warn{background:var(--warn-bg);box-shadow:inset 0 0 0 1.5px #F5D27A}
.note.bad{background:var(--bad-bg);box-shadow:inset 0 0 0 1.5px #F6B3AC}
.note.ok{background:var(--ok-bg);box-shadow:inset 0 0 0 1.5px #A6E9C3}
.note .acts{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}
.legal{font-size:.86rem;color:var(--text-2)}

/* ---------- forms ---------- */
.f{display:block;margin:0 0 .9rem;min-width:0}
.f>span{display:block;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2);margin-bottom:.35rem}
.f>span em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=datetime-local],input[type=tel],input[type=password],input[type=url],select,textarea{display:block;width:100%;min-height:2.9rem;padding:.45rem .8rem;border:0;border-radius:.5rem;background:var(--field);color:var(--ink);font-size:1rem}
textarea{min-height:5.5rem;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:0;background:#fff;box-shadow:inset 0 0 0 .14rem var(--lo)}
input::placeholder,textarea::placeholder{color:var(--faint)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,10rem),1fr));gap:0 .8rem}
.fgrid .full{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chips button,.seg button{min-height:2.4rem;padding:0 .85rem;border:0;border-radius:2rem;background:var(--field);font-weight:600;font-size:.9rem}
.chips button.on{background:var(--ink);color:#fff}
.seg{display:inline-flex;background:var(--field);border-radius:.6rem;padding:.2rem;gap:.2rem;flex-wrap:wrap}
.seg button{border-radius:.45rem;background:none}
.seg button.on{background:var(--panel);box-shadow:var(--sh-float)}
.ckrow{display:flex;align-items:center;gap:.6rem;min-height:2.6rem;font-weight:600}
.ckrow input{width:1.25rem;height:1.25rem;accent-color:var(--lo)}
.ferr{color:var(--bad-ink);font-weight:600;margin:.2rem 0 .7rem}
.ferr:empty{display:none}

/* checklist items */
.check{display:flex;align-items:center;gap:.8rem;width:100%;min-height:3.2rem;padding:.5rem .75rem;border:0;border-radius:.55rem;background:none;text-align:left;transition:background .12s}
.check:hover{background:var(--tint)}
.check .box{width:1.7rem;height:1.7rem;border-radius:.45rem;flex:none;display:grid;place-items:center;background:#fff;box-shadow:inset 0 0 0 2px var(--line-2);color:transparent;transition:background .15s,transform .2s cubic-bezier(.3,1.6,.5,1)}
.check.on .box{background:var(--mode);box-shadow:0 .14rem 0 var(--lo);color:var(--ink);transform:scale(1.05)}
.check .box .i{width:1.1rem;height:1.1rem;stroke-width:3}
.check.on .lbl{color:var(--muted)}
.check small{display:block;color:var(--muted);font-size:.8rem;text-decoration:none}
.prog{height:.55rem;border-radius:1rem;background:var(--field);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--mode);border-radius:1rem;transition:width .4s var(--ease)}

/* steppers for counting */
.step{display:inline-flex;align-items:center;gap:.25rem;flex:none}
.step button{width:2.4rem;height:2.4rem;border:0;border-radius:.5rem;background:var(--field);font-size:1.25rem;font-weight:700;line-height:1}
.step button:active{transform:scale(.9)}
.step input{width:4.2rem;min-height:2.4rem;text-align:center;padding:.2rem;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(30,27,22,.45);display:grid;place-items:center;padding:1rem;animation:fade .15s both}
.dlg{width:min(36rem,100%);max-height:calc(100dvh - 2rem);overflow:auto;background:var(--panel);border-radius:1rem;box-shadow:var(--sh-pop);padding:1.2rem 1.25rem 1rem;animation:rise .22s var(--ease) both}
.dlg.wide{width:min(52rem,100%)}
.dlg h2{font-size:1.35rem;line-height:1.15;margin:0 0 .3rem;display:flex;align-items:center;gap:.6rem}
.dlg h2 .sp{flex:1}
.dlg>p{color:var(--text-2);margin:0 0 1rem}
.dlg .acts{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:.6rem;position:sticky;bottom:-1rem;background:var(--panel);padding:.6rem 0 .6rem}
.dlg .acts .sp{flex:1}
#toast{position:fixed;left:50%;bottom:1.3rem;transform:translateX(-50%);z-index:70;display:none;align-items:center;gap:.8rem;max-width:92vw;padding:.6rem .6rem .6rem 1.1rem;border-radius:.7rem;background:#1F1F24;color:#fff;box-shadow:0 1rem 2.4rem rgba(0,0,0,.25);font-weight:500}
#toast.on{display:flex;animation:rise .25s var(--ease) both}
#toast button{min-height:2.3rem;padding:0 .9rem;border:0;border-radius:.45rem;background:var(--mode);color:var(--ink);font-weight:700}

/* ---------- timers (shared look; the pearl hero builds on it) ---------- */
.timers{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,17rem),1fr))}
.tmr{position:relative;display:flex;gap:1rem;align-items:center;padding:1rem 1.1rem;border-radius:1rem;background:var(--panel);box-shadow:var(--sh-float);min-width:0}
.tmr .ring{width:5.4rem;height:5.4rem;flex:none;position:relative}
.tmr .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tmr .ring circle{fill:none;stroke-width:9}
.tmr .ring .bgc{stroke:var(--field)}
.tmr .ring .fg{stroke:var(--mode);stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s}
.tmr .ring .mid{position:absolute;inset:0;display:grid;place-items:center}
.tmr .ring .mid svg{width:2rem;height:2rem;transform:none}
.tmr .info{flex:1;min-width:0}
.tmr .name{font-weight:700;font-size:1.02rem;line-height:1.2}
.tmr .cd{font-size:2.1rem;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tmr .by{font-size:.86rem;color:var(--text-2)}
.tmr .acts{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.45rem}
.tmr.cooking .fg{stroke:var(--accent-2)}
.tmr.soon{background:var(--warn-bg);box-shadow:inset 0 0 0 2px #F5D27A}
.tmr.soon .fg{stroke:var(--warn)}
.tmr.expired{background:var(--bad);color:#fff;box-shadow:0 .3rem 0 #C0302B;animation:shake 2.4s ease-in-out infinite}
.tmr.expired .by{color:#fff}
.tmr.expired .bgc{stroke:rgba(255,255,255,.3)}.tmr.expired .fg{stroke:#fff}
.tmr.expired .btn{box-shadow:none}

/* ---------- schedule ---------- */
.wk{display:grid;grid-template-columns:9.5rem repeat(7,minmax(6.6rem,1fr));min-width:56rem}
.wk>div{padding:.45rem .5rem;box-shadow:inset -1px -1px 0 var(--line);min-height:3.4rem}
.wk .hd{font-size:.78rem;font-weight:700;color:var(--text-2);position:sticky;top:0;background:var(--panel);z-index:1;min-height:0}
.wk .hd.today{background:var(--tint)}
.wk .emp{display:flex;align-items:center;gap:.5rem;font-weight:600;font-size:.92rem;position:sticky;left:0;background:var(--panel);z-index:1}
.wk .cell{display:flex;flex-direction:column;gap:.25rem;cursor:pointer}
.wk .cell:hover{background:var(--tint)}
.wk .cell.today{background:color-mix(in srgb,var(--mode) 7%,#fff)}
.sh{display:block;width:100%;padding:.25rem .45rem;border:0;border-radius:.4rem;font-size:.8rem;font-weight:700;text-align:left;color:var(--ink);line-height:1.25}
.sh small{display:block;font-weight:500;opacity:.8}
.sh .pk{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:var(--ink);margin-left:.25rem;vertical-align:middle}
.cov{display:flex;flex-direction:column;gap:.2rem;font-size:.72rem}
.cov span{display:flex;justify-content:space-between;gap:.3rem;padding:.12rem .4rem;border-radius:.35rem;font-weight:700}
.cov .ok{background:var(--ok-bg);color:var(--ok-ink)}.cov .low{background:var(--bad-bg);color:var(--bad-ink)}
.tl{position:relative;background:var(--panel);border-radius:.8rem;box-shadow:var(--sh-float);padding:.6rem .8rem 1rem;overflow:auto}
.tl-in{position:relative;min-width:40rem}
.tl-axis{position:relative;height:1.6rem;margin-left:8rem;font-size:.72rem;color:var(--muted)}
.tl-axis span{position:absolute;transform:translateX(-50%)}
.tl-row{display:flex;align-items:center;height:2.6rem}
.tl-row>b{width:8rem;flex:none;font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-track{position:relative;flex:1;height:2rem}
.tl-bar{position:absolute;top:.2rem;bottom:.2rem;border-radius:.4rem;font-size:.75rem;font-weight:700;padding:0 .4rem;display:flex;align-items:center;white-space:nowrap;overflow:hidden;border:0;color:var(--ink)}
.tl-peak{position:absolute;top:1.6rem;bottom:0;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--accent-2) 22%,transparent) 0 8px,color-mix(in srgb,var(--accent-2) 10%,transparent) 8px 16px);border-left:2px dashed var(--accent-2-lo);border-right:2px dashed var(--accent-2-lo);pointer-events:none}
.tl-peak b{position:absolute;top:-1.55rem;left:.3rem;font-size:.68rem;background:var(--accent-2);color:var(--ink);padding:.05rem .4rem;border-radius:.3rem;white-space:nowrap}
.tl-now{position:absolute;top:1.6rem;bottom:0;width:2px;background:var(--bad);pointer-events:none}

/* ---------- time clock ---------- */
.punchgrid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,13rem),1fr))}
.punch{display:flex;align-items:center;gap:.8rem;padding:.9rem 1rem;border:0;border-radius:.9rem;background:var(--panel);box-shadow:var(--sh-float);text-align:left;transition:transform .12s}
.punch:active{transform:scale(.97)}
.punch.in{background:var(--ok-bg);box-shadow:inset 0 0 0 2px #A6E9C3}
.punch b{display:block;font-size:1.05rem}
.punch small{color:var(--text-2)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;max-width:18rem;margin:.6rem auto}
.pinpad button{min-height:3.4rem;border:0;border-radius:.6rem;background:var(--field);font-size:1.4rem;font-weight:700}
.pindots{display:flex;justify-content:center;gap:.6rem;margin:.6rem 0}
.pindots i{width:.9rem;height:.9rem;border-radius:50%;background:var(--field-hi)}.pindots i.on{background:var(--ink)}

/* ---------- recipe cards ---------- */
.rc{display:flex;flex-direction:column;gap:.5rem}
.rc .cat{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--lo)}
.rc h4{margin:0;font-size:1.2rem}
.rc ol,.rc ul{margin:0;padding-left:1.2rem}
.rc li{margin:.15rem 0}
.flash{min-height:16rem;display:grid;place-items:center;text-align:center;cursor:pointer;font-size:1.05rem}
.flash h4{font-size:1.8rem}

/* ---------- customer screen ---------- */
.cust{position:fixed;inset:0;z-index:80;background:var(--mode);color:var(--ink);display:grid;place-items:center;padding:2rem;text-align:center;overflow:auto}
.cust .in{display:flex;flex-direction:column;align-items:center;gap:1.2rem;max-width:40rem}
.cust h1{font-size:clamp(2rem,6vw,4rem);line-height:1.05}
.cust p{font-size:clamp(1.05rem,2.4vw,1.5rem);font-weight:500}
.cust .qr{background:#fff;padding:1rem;border-radius:1.2rem;box-shadow:0 .4rem 0 var(--lo)}
.cust .qr svg,.cust .qr img{display:block;width:min(60vw,17rem);height:auto}
.cust .url{font-weight:700;font-size:1.1rem;background:rgba(255,255,255,.55);padding:.3rem .9rem;border-radius:2rem}
.cust .x{position:fixed;top:1rem;right:1rem}

/* ---------- motion ---------- */
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(.6rem)}}
@keyframes pulse{50%{opacity:.6}}
@keyframes shake{0%,86%,100%{transform:none}88%{transform:translateX(-4px)}90%{transform:translateX(4px)}92%{transform:translateX(-3px)}94%{transform:translateX(3px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- responsive ---------- */
/* phone: bottom tab bar, tighter header */
@media(max-width:699px){
  :root{font-size:calc(16.5px * var(--ui))}
  .top{padding:.35rem .7rem;min-height:3.6rem}
  .top .clock,.top h1{display:none}
  .chip.who>span:not(.av){display:none}.chip.who{padding:0 .3rem}
  main#view{padding:1rem .85rem calc(5.8rem + env(safe-area-inset-bottom))}
  .foot{padding-bottom:calc(5.8rem + env(safe-area-inset-bottom))}
  .ph h2{font-size:1.5rem}.hello h2{font-size:1.6rem}
  .ph .acts{width:100%}.ph .acts .btn.lg{flex:1}
  .todo{flex-wrap:wrap}.todo .btn{width:100%}
  .tiles{grid-template-columns:1fr 1fr;gap:.6rem}.tile{min-height:7.4rem;padding:.85rem}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);box-shadow:0 -1px 0 var(--line),0 -6px 20px rgba(30,27,22,.06);padding:.35rem .4rem calc(.35rem + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:.1rem;min-height:3.5rem;border:0;background:none;border-radius:.7rem;font-size:.74rem;font-weight:700;color:var(--muted);position:relative}
  .tabbar button .i{width:1.55rem;height:1.55rem}
  .tabbar button[aria-current=page]{color:var(--ink);background:var(--tint)}
  .tabbar button[aria-current=page] .i{color:var(--lo)}
  .tabbar .cnt{position:absolute;top:.2rem;right:calc(50% - 1.4rem);min-width:1.1rem;height:1.1rem;border-radius:1rem;background:var(--bad);color:#fff;font-size:.62rem;display:grid;place-items:center;padding:0 .25rem}
  #toast{bottom:calc(5.2rem + env(safe-area-inset-bottom))}
  .tmr .cd{font-size:1.8rem}
  .scrim{align-items:end;padding:0}
  .dlg,.dlg.wiz{border-radius:1.1rem 1.1rem 0 0;max-height:94dvh;padding:1.1rem 1rem .9rem}
  h2.q{font-size:1.35rem}
  .scrim.setup{padding:0;align-items:stretch}.scrim.setup .dlg{border-radius:0;max-height:none;min-height:100dvh;padding-top:1.4rem}
  .homebtn span{display:inline}
}
@media print{.top,.tabbar,.foot,.noprint,#toast{display:none!important}main#view{max-width:none;padding:0}}

/* Café: the "bar check" hero on Today, and the pastry sparklines. */
.barhero{background:var(--panel);border-radius:1.2rem;box-shadow:0 .35rem 0 var(--lo),var(--sh-lift);overflow:hidden;margin-bottom:.4rem}
.bh{display:flex;align-items:center;flex-wrap:wrap;gap:.8rem;padding:1.1rem 1.3rem;background:var(--mode);color:var(--ink)}
.bh small{font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.bh h3{font-size:1.7rem;line-height:1.1;margin:.1rem 0 0}
.bh .sp{flex:1}
.bh .btn.dark{box-shadow:0 .25rem 0 #000}
.bgrid{display:grid;gap:1rem;padding:1.1rem 1.2rem 1.2rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,16rem),1fr))}
.shot{padding:1rem 1.1rem;border-radius:1rem;background:color-mix(in srgb,var(--mode) 12%,#fff);box-shadow:inset 0 0 0 2px var(--tint-2);display:flex;flex-direction:column;gap:.35rem;align-items:flex-start}
.shot.stale{background:var(--warn-bg);box-shadow:inset 0 0 0 2px #F5D27A}
.shot small{font-weight:700;font-size:.9rem;color:var(--text-2)}
.shot .rec{font-size:2.5rem;font-weight:700;line-height:1;letter-spacing:-.02em}
.shot .rec i{font-style:normal;font-size:1.2rem;color:var(--text-2);margin-left:.05rem}
.shot .meta{display:flex;flex-wrap:wrap;gap:.3rem}
.side2{display:flex;flex-direction:column;gap:.7rem}
.mini{display:flex;gap:.8rem;align-items:flex-start;text-align:left;width:100%;border:0;border-radius:1rem;padding:.9rem 1rem;background:var(--ok-bg);color:var(--ink);box-shadow:inset 0 0 0 2px #A6E9C3;transition:transform .12s}
.mini:hover{transform:translateY(-2px)}
.mini .i{width:1.6rem;height:1.6rem;margin-top:.1rem}
.mini b{display:block}.mini small{display:block;color:var(--text-2);line-height:1.4;margin-top:.15rem}
.mini.warn{background:var(--warn-bg);box-shadow:inset 0 0 0 2px #F5D27A}
.mini.bad{background:var(--bad-bg);box-shadow:inset 0 0 0 2px #F6B3AC}
.spark{display:inline-flex;align-items:flex-end;gap:2px;height:26px}
.spark i{display:block;width:6px;border-radius:2px;background:var(--lo)}
@media(max-width:699px){.bh h3{font-size:1.4rem}.bgrid{padding:.8rem}.shot .rec{font-size:2.1rem}}
</style>
</head>

<script>
/* ==========================================================================
   Shop dashboards · core.js
   Pure logic shared by every business type (Tea & Boba, Café, …).
   No DOM here, so it can be unit-tested in Node:  node test/core.test.js
   ========================================================================== */
const Core = (() => {
  'use strict';

  /* ---------- schema ----------
     Bump SCHEMA when the saved shape changes and add a step to MIGRATIONS
     (MIGRATIONS[n] upgrades a version-n data object to version n+1). */
  const SCHEMA = 1;
  const APP_ID = 'grug-shop-dashboard';

  /* collections every business type has */
  const BASE_COLLS = ['employees', 'shifts', 'punches', 'checklists', 'checkRuns', 'handoffs', 'cashouts',
    'items', 'suppliers', 'orders', 'waste', 'cleanTasks', 'cleanLogs', 'tempUnits', 'tempLogs', 'recipes'];

  /* ---------- small helpers ---------- */
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const parseYmd = s => { const [a, b, c] = String(s).split('-').map(Number); return new Date(a, b - 1, c); };
  const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
  const dow = s => parseYmd(s).getDay();
  const weekStart = (s, ws) => addDays(s, -((dow(s) - (ws || 0) + 7) % 7));
  const weekDates = st => Array.from({ length: 7 }, (_, i) => addDays(st, i));
  const toMin = t => { const [h, m] = String(t || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
  const fromMin = m => { m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
  const DN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const DNL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const fmtT = t => { let [h, m] = String(t).split(':').map(Number); const ap = h < 12 ? 'a' : 'p'; h = h % 12 || 12; return h + (m ? ':' + pad(m) : '') + ap; };
  const fmtDay = s => { const x = parseYmd(s); return DN[x.getDay()] + ' ' + MON[x.getMonth()] + ' ' + x.getDate(); };
  const fmtClock = ms => { const d = new Date(ms); let h = d.getHours(); const ap = h < 12 ? 'AM' : 'PM'; h = h % 12 || 12; return h + ':' + pad(d.getMinutes()) + ' ' + ap; };
  const fmtWhen = (iso, today) => { const d = new Date(iso); const day = ymd(d); return (day === today ? 'Today' : fmtDay(day)) + ' ' + fmtClock(d.getTime()); };
  const r2 = n => Math.round((+n || 0) * 100) / 100;
  const money = n => (n < 0 ? '−$' : '$') + Math.abs(r2(n)).toFixed(2);
  const uid = () => (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  const clone = o => JSON.parse(JSON.stringify(o));

  /* durations: "1:05:09", "12:04", or "2h 5m" for long ones */
  function fmtDur(ms, long) {
    const neg = ms < 0; ms = Math.abs(ms);
    const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    if (long) return (neg ? '−' : '') + (h ? h + 'h ' : '') + m + 'm';
    return (neg ? '−' : '') + (h ? h + ':' + pad(m) : m) + ':' + pad(sec);
  }

  /* ---------- shifts ---------- */
  const span = sh => { const s = toMin(sh.start); let e = toMin(sh.end); if (e <= s) e += 1440; return [s, e]; };
  const shiftHours = sh => { const [s, e] = span(sh); return Math.max(0, (e - s - (+sh.breakMin || 0)) / 60); };

  /* How many people are on during a rush window on one date.
     Returns the lowest head-count at any 15-minute step inside the window. */
  function peakCoverage(shifts, date, peak) {
    const ps = toMin(peak.start); let pe = toMin(peak.end); if (pe <= ps) pe += 1440;
    const day = shifts.filter(s => s.date === date);
    let min = Infinity;
    for (let t = ps; t < pe; t += 15) {
      const n = day.filter(s => { const [a, b] = span(s); return a <= t && b > t; }).length;
      if (n < min) min = n;
    }
    return min === Infinity ? 0 : min;
  }
  const peakOnDay = (peak, date) => !peak.days || !peak.days.length || peak.days.includes(dow(date));
  const shiftHitsPeak = (sh, peak) => { const [a, b] = span(sh); const ps = toMin(peak.start); let pe = toMin(peak.end); if (pe <= ps) pe += 1440; return a < pe && b > ps; };

  /* ---------- punches / hours ---------- */
  const punchHours = (p, now) => { const a = Date.parse(p.in), b = p.out ? Date.parse(p.out) : (now || Date.now()); return Math.max(0, (b - a) / 36e5); };

  /* one row per employee: hours worked on each day of the week (by clock-in date) */
  function weekHours(D, dates) {
    const set = new Set(dates);
    return D.employees.map(e => {
      const per = dates.map(() => 0);
      for (const p of D.punches) {
        if (p.empId !== e.id || !p.out) continue;
        const d = ymd(new Date(p.in)); if (!set.has(d)) continue;
        per[dates.indexOf(d)] += punchHours(p);
      }
      return { emp: e, per: per.map(r2), total: r2(per.reduce((a, b) => a + b, 0)) };
    });
  }
  function hoursCsvRows(D, dates) {
    const rows = [['Employee', 'Role', ...dates.map(d => fmtDay(d)), 'Total hours']];
    for (const r of weekHours(D, dates)) if (r.total > 0) rows.push([r.emp.name, r.emp.role || '', ...r.per, r.total]);
    return rows;
  }
  function punchCsvRows(D, dates) {
    const set = new Set(dates), rows = [['Employee', 'Date', 'Clock in', 'Clock out', 'Hours', 'Note']];
    const name = id => (D.employees.find(e => e.id === id) || {}).name || '(removed)';
    D.punches.filter(p => set.has(ymd(new Date(p.in)))).sort((a, b) => a.in < b.in ? -1 : 1)
      .forEach(p => rows.push([name(p.empId), ymd(new Date(p.in)), fmtClock(Date.parse(p.in)), p.out ? fmtClock(Date.parse(p.out)) : '(still in)', p.out ? r2(punchHours(p)) : '', p.note || '']));
    return rows;
  }

  /* ---------- tips: split a pool by hours ---------- */
  function splitTips(total, people) {
    const H = people.reduce((a, p) => a + (+p.hours || 0), 0);
    if (!people.length) return [];
    let out = people.map(p => ({ ...p, amount: H > 0 ? Math.floor((total * (+p.hours || 0) / H) * 100) / 100 : Math.floor(total / people.length * 100) / 100 }));
    /* hand out leftover cents so the split adds up exactly */
    let left = Math.round((total - out.reduce((a, p) => a + p.amount, 0)) * 100);
    for (let i = 0; left > 0 && out.length; i = (i + 1) % out.length, left--) out[i].amount = r2(out[i].amount + 0.01);
    return out;
  }
  function cashSummary(c) {
    const expected = (+c.float || 0) + (+c.cashSales || 0);

      case 'hidden': return `<input type="hidden" name="${f.k}" value="${esc(val)}">`;
      case 'textarea': return `<label class="${cls}">${lab}<textarea ${common}>${esc(val)}</textarea></label>`;
      case 'select': return `<label class="${cls}">${lab}<select ${common}>${f.blank !== false ? `<option value="">${esc(f.blank || 'Choose…')}</option>` : ''}${optsOf(f).map(([a, b]) => `<option value="${esc(a)}" ${String(a) === String(val) ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select></label>`;
      case 'chips': return `<div class="${cls}">${lab}<input type="hidden" name="${f.k}" value="${esc(val)}"><div class="chips big" data-chips="${f.k}">${optsOf(f).map(([a, b]) => `<button type="button" data-v="${esc(a)}" class="${String(a) === String(val) ? 'on' : ''}">${esc(b)}</button>`).join('')}</div></div>`;
      case 'days': { const on = new Set(val || []); return `<div class="${cls}">${lab}<div class="chips big" data-days="${f.k}">${C.DN.map((d, i) => `<button type="button" data-v="${i}" class="${on.has(i) ? 'on' : ''}">${d}</button>`).join('')}</div></div>`; }
      case 'color': return `<div class="${cls}">${lab}<input type="hidden" name="${f.k}" value="${esc(val || COLORS[0])}"><div class="chips" data-chips="${f.k}">${COLORS.map(c => `<button type="button" data-v="${c}" class="${c === (val || COLORS[0]) ? 'on' : ''}" style="background:${c};width:2.6rem;padding:0" aria-label="colour ${c}">${c === (val || COLORS[0]) ? ic('check') : ''}</button>`).join('')}</div></div>`;
      case 'check': return `<label class="ckrow ${cls}"><input type="checkbox" name="${f.k}" ${val ? 'checked' : ''}> ${esc(f.label)}</label>`;
      case 'datetime': return `<label class="${cls}">${lab}<input type="datetime-local" ${common} value="${esc(toLocalDT(val))}"></label>`;
      case 'stepper': return `<div class="${cls}">${lab}<div class="step big"><button type="button" data-stp="${f.k}" data-d="-${f.step || 1}" aria-label="Less">−</button><input type="number" inputmode="decimal" step="any" ${f.min != null ? `min="${f.min}"` : ''} ${common} value="${esc(val)}"><button type="button" data-stp="${f.k}" data-d="${f.step || 1}" aria-label="More">+</button>${f.unit ? `<b class="unit">${esc(f.unit)}</b>` : ''}</div></div>`;
      case 'number': return `<label class="${cls}">${lab}<input type="number" inputmode="decimal" step="${f.step || 'any'}" ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} ${common} value="${esc(val)}"></label>`;
      default: return `<label class="${cls}">${lab}<input type="${f.type || 'text'}" ${common} value="${esc(val)}" ${f.list ? `list="${id}-l"` : ''} autocomplete="off">${f.list ? `<datalist id="${id}-l">${(typeof f.list === 'function' ? f.list() : f.list).map(x => `<option value="${esc(x)}">`).join('')}</datalist>` : ''}</label>`;
    }
  }
  function formHtml(fields, vals) { return `<div class="fgrid">${fields.map(f => fieldHtml(f, vals[f.k])).join('')}</div>`; }
  function wireForm(root) {
    $$('[data-chips]', root).forEach(g => g.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return; const inp = root.querySelector(`input[name="${g.dataset.chips}"]`);
      const isColor = !!b.style.background;
      $$('button', g).forEach(x => { x.classList.toggle('on', x === b); if (isColor) x.innerHTML = x === b ? ic('check') : ''; });
      inp.value = b.dataset.v; inp.dispatchEvent(new Event('input', { bubbles: true }));
    }));
    $$('[data-days]', root).forEach(g => g.addEventListener('click', e => { const b = e.target.closest('button'); if (b) b.classList.toggle('on'); }));
    $$('[data-stp]', root).forEach(b => b.addEventListener('click', () => { const inp = root.querySelector(`input[name="${b.dataset.stp}"]`); const v = Math.max(+inp.min || 0, C.r2((+inp.value || 0) + +b.dataset.d)); inp.value = v; inp.dispatchEvent(new Event('input', { bubbles: true })); }));
  }
  function readForm(root, fields) {
    const out = {};
    for (const f of fields) {
      if (f.type === 'days') { out[f.k] = $$(`[data-days="${f.k}"] button.on`, root).map(b => +b.dataset.v); continue; }
      const el = root.querySelector(`[name="${f.k}"]`); if (!el) continue;
      if (f.type === 'check') out[f.k] = el.checked;
      else if (f.type === 'number' || f.type === 'stepper') out[f.k] = el.value === '' ? '' : +el.value;
      else if (f.type === 'datetime') out[f.k] = fromLocalDT(el.value);

    return out;
  }
  /* sanity checks shared by every form: required, number limits, no future log times */
  function checkFields(fields, v) {
    for (const f of fields) {
      const x = v[f.k];
      if (f.req && (x === '' || x == null || (Array.isArray(x) && !x.length))) return (f.label || f.k) + ': this one is needed.';
      if ((f.type === 'number' || f.type === 'stepper') && x !== '' && x != null) {
        if (isNaN(x)) return (f.label || f.k) + ': type a number.';
        if (f.min != null && x < f.min) return (f.label || f.k) + ' can\'t be less than ' + f.min + '.';
        if (f.max != null && x > f.max) return (f.label || f.k) + ' looks too big. Check the number.';
      }
      if (f.type === 'datetime' && f.past && x && Date.parse(x) > Date.now() + 5 * 6e4) return (f.label || f.k) + ' is in the future. Check the time.';
    }
    return '';
  }
  /* openForm: a dialog with fields; onSave(values) may return a message to keep it open.
     del: {coll, id, label} gives a Delete button with Undo. */
  function openForm({ title, intro, fields, values, onSave, onDelete, del, saveLabel, cls, extra, onInput }) {
    const vals = values || {};
    const d = modal(`<h2>${esc(title)}<span class="sp"></span>${xBtn}</h2>${intro ? `<p>${intro}</p>` : ''}<form novalidate>${formHtml(fields, vals)}${extra || ''}<p class="ferr" data-err role="alert"></p>
      <div class="acts">${onDelete || del ? `<button type="button" class="btn danger sm" data-del>${ic('trash')} Delete</button>` : ''}<span class="sp"></span><button type="submit" class="btn pri lg">${ic('check')} ${esc(saveLabel || 'Save')}</button></div></form>`, { cls });
    const form = d.querySelector('form'); wireForm(form);
    if (onInput) { form.addEventListener('input', () => onInput(readForm(form, fields), form)); onInput(readForm(form, fields), form); }
    d.querySelector('[data-x]').onclick = () => closeModal();
    if (del) d.querySelector('[data-del]').onclick = () => { closeModal(); removeUndo(del.coll, del.id, del.label); };
    else if (onDelete) d.querySelector('[data-del]').onclick = async () => { if (await confirmBox({ title: 'Delete this?', body: 'It will be gone for good.', ok: 'Delete', danger: true })) { closeModal(); onDelete(); render(); } };
    form.onsubmit = e => {
      e.preventDefault(); const v = readForm(form, fields);
      const err = checkFields(fields, v) || onSave(v, form);
      if (err) { const el = d.querySelector('[data-err]'); el.textContent = err; el.scrollIntoView({ block: 'nearest' }); return; }
      closeModal(); render();
    };
    return d;
  }

  /* ---------- wizard: one question per screen, big input, Back / Next ----------
     steps: [{k, q, hint, type: money|number|text|chips|time|date, opts, def, optional, min, max, unit, skipIf(vals)}]
     onDone(vals) may return HTML for a final "here's the result" screen. */
  function wizard({ title, steps, onDone, doneLabel, values }) {
    const vals = { ...(values || {}) }; let i = 0;
    for (const s of steps) if (vals[s.k] === undefined && s.def !== undefined) vals[s.k] = typeof s.def === 'function' ? s.def(vals) : s.def;
    const d = modal('', { cls: 'wiz', sticky: true });
    const live = () => steps.filter(s => !s.skipIf || !s.skipIf(vals));
    const draw = () => {
      const L = live(), s = L[i], n = L.length;
      const inp = s.type === 'chips' ? `<input type="hidden" name="v" value="${esc(vals[s.k] ?? '')}"><div class="chips big" data-chips="v">${optsOf(s).map(([a, b]) => `<button type="button" data-v="${esc(a)}" class="${String(a) === String(vals[s.k]) ? 'on' : ''}">${esc(b)}</button>`).join('')}</div>`
        : `<div class="wizin">${s.type === 'money' ? '<b>$</b>' : ''}<input name="v" type="${s.type === 'text' ? 'text' : s.type === 'time' ? 'time' : s.type === 'date' ? 'date' : 'number'}" ${s.type === 'money' || s.type === 'number' ? 'inputmode="decimal" step="any" min="0"' : ''} value="${esc(vals[s.k] ?? '')}" placeholder="${esc(s.ph || (s.type === 'money' ? '0.00' : ''))}" autofocus>${s.unit ? `<b>${esc(s.unit)}</b>` : ''}</div>`;
      d.innerHTML = `<div class="wizh"><span>${esc(title)}</span><span class="sp"></span><span class="mute small">Step ${i + 1} of ${n}</span>${xBtn}</div>
        <div class="dots">${L.map((_, j) => `<i class="${j <= i ? 'on' : ''}"></i>`).join('')}</div>
        <form novalidate><h2 class="q">${esc(s.q)}</h2>${s.hint ? `<p class="hint">${s.hint}</p>` : ''}${inp}<p class="ferr" data-err role="alert"></p>
        <div class="acts">${i ? `<button type="button" class="btn lg" data-back>${ic('left')} Back</button>` : ''}<span class="sp"></span>${s.optional ? `<button type="button" class="btn ghost" data-skip>Skip</button>` : ''}<button class="btn pri lg">${i === n - 1 ? ic('check') + ' ' + esc(doneLabel || 'Finish') : 'Next ' + ic('right')}</button></div></form>`;
      const f = d.querySelector('form'); wireForm(f);
      if (s.type === 'chips') f.querySelector('[data-chips]').addEventListener('click', () => setTimeout(() => f.requestSubmit(), 180));
      d.querySelector('[data-x]').onclick = () => closeModal();
      const b = d.querySelector('[data-back]'); if (b) b.onclick = () => { i--; draw(); };
      const sk = d.querySelector('[data-skip]'); if (sk) sk.onclick = () => { vals[s.k] = ''; next(); };
      f.onsubmit = e => {
        e.preventDefault(); let v = f.v.value.trim();
        if (s.type === 'money' || s.type === 'number') { if (v === '') { if (!s.optional) return err('Type a number (0 is fine).'); } else { v = +v; if (isNaN(v) || v < 0) return err('That doesn\'t look like a number.'); if (s.max != null && v > s.max) return err('That looks too big. Check it again.'); if (s.positive && v <= 0) return err('It has to be more than 0.'); } }
        else if (!v && !s.optional) return err(s.type === 'chips' ? 'Tap one.' : 'This one is needed.');
        vals[s.k] = v; next();
      };
      setTimeout(() => { const x = d.querySelector('input[name=v]:not([type=hidden])'); if (x) x.focus(); }, 30);
    };
    const err = m => { d.querySelector('[data-err]').textContent = m; };
    const next = () => {
      const L = live(); if (i < L.length - 1) { i++; draw(); return; }
      const res = onDone(vals);
      if (res) { d.innerHTML = `<div class="wizh"><span>${esc(title)}</span><span class="sp"></span>${xBtn}</div>${res}<div class="acts"><span class="sp"></span><button class="btn pri lg" data-x2>${ic('check')} Done</button></div>`; d.querySelector('[data-x]').onclick = d.querySelector('[data-x2]').onclick = () => { closeModal(); render(); }; }
      else { closeModal(); render(); }
    };
    draw();
  }

  /* ---------- who's using this device ---------- */
  function whoPicker(then) {
    const ss = staff();
    const d = modal(`<h2>Who's using this?<span class="sp"></span>${xBtn}</h2><p>Tap your name. Anything you check off or write down today will say it was you.</p>
      <div class="whogrid">${ss.map(e => { const f = e.name.split(' ')[0], dup = ss.filter(x => x.name.split(' ')[0] === f).length > 1; return `<button class="whopick" data-n="${esc(e.name)}">${avatar(e, 'lg')}<b>${esc(dup ? e.name : f)}</b></button>`; }).join('')}</div>
      <form data-other style="display:flex;gap:.5rem;margin-top:.8rem"><input type="text" name="n" placeholder="${ss.length ? 'Not on the list? Type your name' : 'Type your name'}"><button class="btn pri">OK</button></form>`);

    d.querySelector('[data-x]').onclick = () => closeModal();

  }
  act('who', () => whoPicker());

  /* ---------- sound: a short chime made with Web Audio (no files) ---------- */
  const Sound = {
    ctx: null, unlocked: false,
    unlock() { try { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); this.unlocked = this.ctx.state === 'running'; } catch (e) { } },
    play(kind) {
      if (!D || !D.settings.sound) return; this.unlock(); const ctx = this.ctx; if (!ctx || ctx.state !== 'running') return;
      const notes = kind === 'alarm' ? [880, 660, 880, 660, 880] : [660, 880];
      notes.forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain(), t0 = ctx.currentTime + i * 0.22;
        o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(kind === 'alarm' ? 0.5 : 0.25, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
        o.connect(g).connect(ctx.destination); o.start(t0); o.stop(t0 + 0.22);
      });
      if (kind === 'alarm' && navigator.vibrate) navigator.vibrate([300, 120, 300]);
    }
  };
  ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => { if (!Sound.unlocked) { Sound.unlock(); if (Sound.unlocked && D) refreshChrome(); } }, { passive: true }));

  /* ---------- timers: a once-a-second redraw that reads stored timestamps ----------
     Modules give App.register({timers: () => [{coll, b, label, icon}]}). Nothing is counted down in memory:
     every tick recomputes from startedAt/cookMin/holdMin, so reloads, closed tabs and sleeping tablets stay right. */
  let lastAlarm = 0;
  function activeTimers() { const out = []; for (const f of TIMERS) out.push(...f()); return out; }
  function ringSvg(pct) { const r = 40, c = 2 * Math.PI * r; return `<svg viewBox="0 0 100 100"><circle class="bgc" cx="50" cy="50" r="${r}"/><circle class="fg" cx="50" cy="50" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - Math.max(0, Math.min(1, pct)))).toFixed(1)}"/></svg>`; }
  function timerText(st) {
    if (st.phase === 'cooking') return { cd: C.fmtDur(st.left), sub: 'Still cooking. Ready at ' + C.fmtClock(st.cookEnd) + '.' };
    if (st.phase === 'expired') return { cd: 'THROW OUT', sub: 'It was good until ' + C.fmtClock(st.discardAt) + ' (' + C.fmtDur(st.over, true) + ' ago).' };
    return { cd: C.fmtDur(st.left), sub: 'Good until ' + C.fmtClock(st.discardAt) + '. Then throw it out.' };
  }
  function tick() {
    if (!D || !D.settings.shopName) return;
    const now = Date.now(), warn = +D.settings.warnMin || 0;
    let expired = [], rerender = false;
    for (const t of activeTimers()) {
      const st = C.batchState(t.b, now, warn);
      if (st.phase === 'expired' && !t.b.silenced) expired.push(t);
      if (st.phase === 'soon' && !t.b.warned) { t.b.warned = nowISO(); upsert(t.coll, t.b); Sound.play('soft'); toast(t.label + ': only ' + C.fmtDur(st.left, true) + ' left. Then throw it out.', 6000); }
      for (const el of $$(`[data-tmr="${t.coll}:${t.b.id}"]`)) {
        if (el.dataset.phase !== st.phase) { rerender = true; continue; }
        const tx = timerText(st); const cd = el.querySelector('.cd'), sub = el.querySelector('.by');
        if (cd) cd.textContent = tx.cd; if (sub) sub.textContent = tx.sub;
        const nw = el.querySelector('[data-now]'); if (nw) nw.style.left = (Math.max(0, Math.min(1, (now - st.start) / Math.max(1, st.discardAt - st.start))) * 100).toFixed(2) + '%';
        const fg = el.querySelector('.fg'); if (fg) { const c = 2 * Math.PI * 40; fg.setAttribute('stroke-dashoffset', (c * (1 - Math.max(0, Math.min(1, st.phase === 'cooking' ? st.pct : 1 - st.pct)))).toFixed(1)); }
      }
    }
    if (expired.length && now - lastAlarm > 12000) { lastAlarm = now; Sound.play('alarm'); }
    document.title = expired.length ? '⚠ THROW OUT: ' + expired.map(t => t.label).join(', ') : (D.settings.shopName || T.name) + ' · ' + T.name;
    const ck = $('#clock'); if (ck) ck.textContent = C.fmtClock(now);
    const al = $('#alarmchip'); if (al) { al.hidden = !expired.length; al.innerHTML = expired.length ? `${ic('alert')} Throw out ${expired.length === 1 ? expired[0].label.split('·')[0].trim() : expired.length + ' batches'}` : ''; }

    if (rerender && !modalStack.length) render();

    if (route === 'home' && ui.homeMin !== nowMin() && nowMin() % 5 === 0 && !modalStack.length) { ui.homeMin = nowMin(); render(); } /* to-dos follow the clock */
  }
  function timerCard(t, opts) {
    const st = C.batchState(t.b, Date.now(), +D.settings.warnMin || 0), tx = timerText(st);
    const pct = st.phase === 'cooking' ? st.pct : 1 - st.pct;

      <div class="ring">${ringSvg(pct)}<div class="mid">${ic(st.phase === 'cooking' ? 'flame' : (t.icon || 'timer'))}</div></div>
      <div class="info"><div class="name">${esc(t.label)}</div><div class="cd">${esc(tx.cd)}</div><div class="by">${esc(tx.sub)}</div>
      <div class="acts">${(opts && opts.actions ? opts.actions(st) : '')}</div></div></div>`;
  }

  /* ---------- CSV / download ---------- */
  function download(name, text, mime) {

  }

  const inRange = (iso, days) => days === 'all' || !iso || Date.parse(iso) >= Date.now() - days * 864e5 || C.ymd(new Date(iso)) === today();

  /* ---------- backup ---------- */
  function backupDue() {

    return `<div class="ph"><div class="t"><h2>${esc(title)}</h2>${what ? `<p>${what}</p>` : ''}</div>${primary || more ? `<div class="acts noprint">${primary || ''}${more && more.length ? `<button class="btn ghost" data-act="moreMenu">${ic('more')} More</button>` : ''}</div>` : ''}</div>${how}${body || ''}`;

  function helpSheet() {

    modal(`<h2>${ic(m.icon)} ${esc(m.title)}<span class="sp"></span>${xBtn}</h2>${h.what ? `<p>${h.what}</p>` : ''}${h.steps ? `<ol class="steps">${h.steps.map(s => `<li>${s}</li>`).join('')}</ol>` : ''}${h.tip ? `<div class="note soft small">${ic('star')}<div>${h.tip}</div></div>` : ''}
      <div class="acts"><span class="sp"></span><button class="btn pri lg" data-ok>Got it</button></div>`).querySelector('[data-ok]').onclick = () => closeModal();
    $('.dlg [data-x]').onclick = () => closeModal();
