<style id="app-css">
/* pages on the Grug site cross-fade into each other; the dashboard joins in so the switch from the site is smooth */
@view-transition{navigation:auto}
/* The Grug dock (the restaurant account's Dashboard · Website · Rewards card, assets/grug.js BIZ_TABS), drawn here so it
   stays on screen on every dashboard page. It matches the site's dock: same sizes, colours and order. */
.gdock{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);transform:translateX(-50%);z-index:50;display:flex;gap:4px;
  padding:9px 14px 12px;border-radius:26px;background:#fff;border:1px solid rgba(30,27,22,.1);box-shadow:0 14px 36px rgba(30,27,22,.16);view-transition-name:g-tabs}
.gdock a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:84px;height:62px;border-radius:16px;
  font:700 11px/1 'Fredoka',system-ui,sans-serif;color:#6B655B;text-decoration:none;transition:transform .2s cubic-bezier(.3,1.5,.5,1),background .2s}
.gdock a svg{width:38px;height:38px;color:var(--tab);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.gdock a[aria-current=page]{color:#1E1B16;background:var(--tab);transform:translateY(-3px);box-shadow:0 3px 0 var(--tab-lo)}
.gdock a[aria-current=page] svg{color:#1E1B16;transform:scale(1.04)}
.gdock a:not([aria-current]):hover{background:var(--field)}
.gdock a:active svg{transform:scale(.9)}
.gdock a:focus-visible{outline:3px solid #1E1B16;outline-offset:2px}
html.gd-docked .page{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
html.gd-docked #toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
html.gd-docked .setupwrap .skip{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
@media(max-width:719px){.gdock{width:min(calc(100% - 24px),380px);gap:2px;padding:8px 10px 10px}.gdock a{flex:1;width:auto;height:58px}.gdock a svg{width:34px;height:34px}}
/* short landscape phones: a rail on the left, like the site */
@media(orientation:landscape) and (max-height:540px){
  .gdock{left:calc(10px + env(safe-area-inset-left,0px));top:50%;bottom:auto;transform:translateY(-50%);flex-direction:column;width:auto;padding:14px 7px}
  .gdock a{flex:none;width:62px;height:52px}.gdock a span{display:none}.gdock a[aria-current=page]{transform:translateX(3px)}
  html.gd-docked .page{padding-bottom:0;padding-left:calc(90px + env(safe-area-inset-left,0px))}
  html.gd-docked #toast,html.gd-docked .setupwrap .skip{bottom:1.4rem}}
/* a locked time clock is a staff kiosk: no way out to the website or the card */
html.gd-locked .gdock{display:none}html.gd-locked.gd-docked .page{padding-bottom:0;padding-left:0}
@media print{.gdock{display:none}}
[hidden]{display:none!important}
/* ==========================================================================
   Daypart on the Grug Digital kit, light edition.
   Kit rules kept: Fredoka everywhere, uppercase letter-spaced labels, one accent per app,
   off-black ink on every coloured surface, no gradients, hidden scrollbars, themed tooltips,
   static pixel-pattern backgrounds, quick soft motion. Kit rule changed on request: light surfaces.
   ========================================================================== */
:root{
  --ui-scale:1;font-size:calc(18px * var(--ui-scale));
  --bg:#F6F4EF;--panel:#FFFFFF;--field:#F1EEE7;--field-hi:#E9E5DC;--line:#E2DDD3;--line-2:#D3CCBF;
  --text:#1E1B16;--text-2:#4A453D;--muted:#6B655B;--faint:#8F887C;--ink:#1E1B16;
  --ok:#3DDC84;--ok-bg:#DDF7E8;--warn:#FFBE1A;--warn-bg:#FFF2CC;--bad:#FF5A5A;--bad-bg:#FFE4E1;--bad-ink:#9E1B14;
  --ease:cubic-bezier(.2,.8,.2,1);
  --sh-float:0 .25rem .9rem rgba(30,27,22,.07),inset 0 0 0 1px rgba(30,27,22,.07);
  --sh-lift:0 .5rem 1.4rem rgba(30,27,22,.11),inset 0 0 0 1px rgba(30,27,22,.07);
  --sh-pop:0 1rem 2.6rem rgba(30,27,22,.2),inset 0 0 0 1px rgba(30,27,22,.07);
  --mode:#9BE338;--lo:#6FB31C;
}
.b-daypart{--mode:#9BE338;--lo:#6FB31C}
.b-henge{--mode:#FF4D4D;--lo:#D42F3A}
.b-hearth{--mode:#FF7A6B;--lo:#DE5545}
.b-notch{--mode:#7EE081;--lo:#45B04A}
.b-mammoth{--mode:#4FD8C4;--lo:#25A893}
.b-conch{--mode:#C59BFF;--lo:#9A6FE0}
.b-stomp{--mode:#FFBE1A;--lo:#D99A00}
.b-clan{--mode:#FF8FC2;--lo:#E0669E}
.b-fossil{--mode:#8AA8FF;--lo:#5E7FE0}
.page{--tint:color-mix(in srgb,var(--mode) 16%,#fff);--tint-2:color-mix(in srgb,var(--mode) 30%,#fff)}

/* ---------- base ---------- */
*{box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
html,body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.55 'Fredoka',"Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none}
input,textarea,.msg,[contenteditable]{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
svg.i{width:1.25em;height:1.25em;flex:none}
h1,h2,h3,p{margin:0}
h2{font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-2);margin:1.8rem 0 .7rem}
.mute{color:var(--muted)}.center{text-align:center}
:focus-visible{outline:.18rem solid var(--ink);outline-offset:.15rem;border-radius:0.28rem}
::selection{background:var(--tint-2,#E5F7CC)}
textarea{resize:none}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.bgl{position:absolute;inset:-96px;opacity:0;transition:opacity .6s ease;background-size:96px 96px;image-rendering:pixelated;image-rendering:crisp-edges}
.bgl.on{opacity:1}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
#app{position:relative;z-index:1}

/* ---------- page frame ---------- */
.page{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.page>main{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:44rem;margin:0 auto;padding:1.4rem 1.1rem 3rem}
.page>main.wide{max-width:68rem}
.page>main .mi{width:100%}
main.homey{max-width:46rem}

/* ---------- top bar (same on every screen) ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.6rem;min-height:3.9rem;padding:.4rem 1rem;background:rgba(246,244,239,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--line)}
.top .sp{flex:1}
.logo{display:flex;align-items:center;gap:.55rem;min-height:2.8rem;padding:0 .7rem 0 .45rem;border:0;border-radius:0.56rem;background:none;cursor:pointer;color:var(--ink);font-weight:700;font-size:1.02rem;min-width:0;transition:background .15s,transform .12s}
.logo:hover{background:rgba(30,27,22,.05)}.logo:active{transform:scale(.95)}
.brandmark{width:1.35rem;height:1.7rem;flex:none;background:var(--ink);-webkit-mask:var(--brand-mark) center/contain no-repeat;mask:var(--brand-mark) center/contain no-repeat;transition:background-color .5s,transform .3s var(--ease)}
.logo:hover .brandmark{background:var(--lo);transform:rotate(-8deg)}
.logo .rn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.crumb{display:inline-flex;align-items:center;gap:.4rem;height:2.3rem;padding:0 .85rem 0 .5rem;border-radius:0.52rem;background:var(--mode);color:var(--ink);font-weight:700;font-size:.9rem;white-space:nowrap;box-shadow:0 .16rem 0 var(--lo);animation:pop .35s var(--ease) both}
.crumb .mk{width:1.3rem;height:1.3rem;color:var(--ink);--m2:var(--mode);--m3:var(--mode)}
.b-henge .crumb .mk,.b-mammoth .crumb .mk{--m2:#fff}.b-fossil .crumb .mk{color:var(--mode);--m2:var(--ink)}
.me{position:relative;display:grid;place-items:center;width:3rem;height:3rem;border:0;background:none;border-radius:50%;cursor:pointer;padding:0;transition:transform .12s}
.me:active{transform:scale(.92)}
.av{width:2.45rem;height:2.45rem;border-radius:50%;display:grid;place-items:center;object-fit:cover;background:var(--mode);color:var(--ink);font-weight:700;font-size:.85rem;box-shadow:0 0 0 .16rem #fff,0 0 0 .3rem var(--line)}
.me[aria-expanded=true] .av{box-shadow:0 0 0 .16rem #fff,0 0 0 .3rem var(--ink)}
.av .i{width:58%;height:58%}
.badge{position:absolute;top:-.05rem;left:-.15rem;min-width:1.3rem;height:1.3rem;padding:0 .35rem;border-radius:0.7rem;background:#E5242B;color:#fff;font-weight:700;font-size:.72rem;line-height:1.3rem;text-align:center;box-shadow:0 0 0 .14rem var(--bg);animation:badge .5s cubic-bezier(.3,1.6,.5,1) both}
.lockbtn{display:inline-flex;align-items:center;gap:.45rem;height:2.6rem;padding:0 1rem;border:0;border-radius:0.56rem;background:var(--ink);color:var(--mode);font-weight:700;cursor:pointer;transition:transform .12s}
.lockbtn:active{transform:scale(.92)}
@media(max-width:600px){.top .rn{max-width:30vw}.page:not(.b-daypart) .top .rn{display:none}}

/* ---------- app header: a bold accent toolbox ---------- */
.hero{position:relative;max-width:44rem;width:calc(100% - 2.2rem);margin:1.1rem auto 0;border-radius:0.91rem;background-color:var(--mode);color:var(--ink);box-shadow:0 .3rem 0 var(--lo),0 .8rem 1.8rem rgba(30,27,22,.1);padding:1.3rem 1.4rem}
.hero .in{display:flex;gap:1.1rem;align-items:center}
.hero .ht{min-width:0;flex:1}
.hero h1{font-size:2.05rem;line-height:1.08;font-weight:700;letter-spacing:-.01em}
.hero .kicker{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.72;margin-bottom:.1rem}
.hero .tagline{font-size:1.08rem;font-weight:600;margin:.15rem 0 .3rem}
.hero .lead{font-size:.98rem;opacity:.85}
.hero .backlink{color:var(--ink);margin:-.4rem 0 .1rem -.3rem}
.appic{display:grid;place-items:center;flex:none;width:3.3rem;height:3.3rem;border-radius:0.63rem}
.appic .mk{width:62%;height:62%}
.appic.blob{width:4.4rem;height:4.4rem;border-radius:0.77rem;box-shadow:0 .25rem 0 rgba(0,0,0,.25)}
.appic.sm{width:2.5rem;height:2.5rem;border-radius:0.49rem}
.appic.xs{width:2.1rem;height:2.1rem;border-radius:0.42rem;margin-top:.1rem}
.mk{display:inline-block;flex:none}
@media(max-width:600px){.hero{padding:1.1rem;border-radius:0.77rem}.hero h1{font-size:1.6rem}.appic.blob{width:3.4rem;height:3.4rem;border-radius:0.63rem}.hero .tagline{font-size:1rem}}

/* ---------- typography inside pages ---------- */
main>.mi>h1,.setup h1{font-size:2.1rem;font-weight:700;line-height:1.1;letter-spacing:-.01em;margin:0 0 .3rem}
main>.mi>.lead{color:var(--text-2);margin:0 0 1.2rem}
.backlink{display:inline-flex;align-items:center;min-height:2.6rem;border:0;background:none;color:var(--ink);font-weight:700;font-size:.95rem;cursor:pointer;padding:0 .3rem;border-radius:0.42rem}
.backlink:hover{background:rgba(30,27,22,.07)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3.1rem;padding:0 1.3rem;border:0;border-radius:0.52rem;background:var(--panel);color:var(--ink);font-weight:700;font-size:1rem;cursor:pointer;text-decoration:none;box-shadow:inset 0 0 0 1.5px var(--line-2),0 .18rem 0 var(--line-2);transition:transform .12s var(--ease),box-shadow .12s,background .15s,filter .15s}
.btn:hover{background:#FBFAF7}
.btn:active{transform:translateY(.12rem) scale(.96);box-shadow:inset 0 0 0 1.5px var(--line-2),0 .04rem 0 var(--line-2)}
.btn.pri{background:var(--mode);box-shadow:0 .22rem 0 var(--lo)}
.btn.pri:hover{filter:brightness(1.04)}
.btn.pri:active{box-shadow:0 .05rem 0 var(--lo)}
.btn.danger{color:var(--bad-ink);box-shadow:inset 0 0 0 1.5px #F2B8B2,0 .18rem 0 #F2B8B2}
.btn.ghost{background:none;box-shadow:none;color:var(--muted);margin-top:.5rem}
.btn.ghost:hover{background:rgba(30,27,22,.05)}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:2.6rem;padding:0 1rem;font-size:.92rem}
.btn .i{width:1.2em;height:1.2em}
.quiet{display:inline-flex;align-items:center;gap:.35rem;min-height:2.6rem;padding:0 .2rem;border:0;background:none;color:var(--ink);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-color:var(--lo);text-decoration-thickness:.14em;text-underline-offset:.22em;transition:color .15s}
.quiet:hover{text-decoration-color:var(--ink)}
.quiet.sm{font-size:.9rem}
.quiets{display:flex;flex-wrap:wrap;gap:.2rem 1.4rem;margin:1.3rem 0}
.actions{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;margin-top:.4rem}
.iconbtn{flex:none;width:2.6rem;height:2.6rem;border:0;border-radius:0.49rem;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:background .12s,color .12s,transform .1s}
.iconbtn:hover{background:var(--bad-bg);color:var(--bad-ink)}.iconbtn:active{transform:scale(.88)}

/* ---------- lists and cards ---------- */
.list{list-style:none;margin:0 0 1.3rem;padding:.25rem;background:var(--panel);border-radius:0.73rem;box-shadow:var(--sh-float)}
.list>li+li{box-shadow:0 -1px 0 var(--line)}
.row{display:flex;align-items:center;gap:.9rem;width:100%;min-height:3.7rem;padding:.65rem .85rem;border:0;border-radius:0.56rem;background:none;text-align:left;cursor:pointer;color:inherit;font:inherit;transition:background .15s,transform .12s var(--ease)}
button.row:hover{background:var(--tint)}
button.row:active{transform:scale(.985)}
.row.static{cursor:default}
.row:disabled{cursor:default;color:inherit}
.row .grow{flex:1;min-width:0}
.row small{display:block;color:var(--muted);font-size:.86rem;line-height:1.35;margin-top:.1rem}
.row .chev{color:var(--faint);font-size:1.3rem;font-weight:300}
.card{background:var(--panel);border-radius:0.73rem;padding:1.1rem 1.2rem .5rem;margin-bottom:1rem;box-shadow:var(--sh-float)}
.card h2{margin:0 0 .2rem;font-size:1.05rem;letter-spacing:0;text-transform:none;color:var(--ink)}
pre.msg{white-space:pre-wrap;font:inherit;font-size:.92rem;background:var(--field);border-radius:0.49rem;padding:.8rem 1rem;margin:.5rem 0 .9rem}
.tag{display:inline-flex;align-items:center;gap:.3rem;white-space:nowrap;padding:.22rem .6rem;border-radius:2rem;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--field);color:var(--ink)}
.tag.ok{background:var(--ok)}.tag.warn{background:var(--warn)}.tag.bad{background:var(--bad)}
.note{border-radius:0.63rem;padding:.85rem 1rem;margin:0 0 .9rem;background:var(--panel);box-shadow:var(--sh-float);color:var(--ink)}
.note b{display:block;font-weight:700}
.note.soft{background:var(--tint);box-shadow:none}
.note.warn{background:var(--warn-bg);box-shadow:inset 0 0 0 1.5px #F5D27A}
.note.bad{background:var(--bad-bg);box-shadow:inset 0 0 0 1.5px #F6B3AC}
.note.ok{background:var(--ok-bg);box-shadow:inset 0 0 0 1.5px #A6E9C3}
.empty{text-align:center;padding:2.2rem 1.2rem;border-radius:0.84rem;background:var(--tint);box-shadow:inset 0 0 0 .14rem var(--tint-2);margin-bottom:1.3rem}
.empty p{color:var(--text-2);max-width:24rem;margin:0 auto 1.2rem}
.ferr{color:var(--bad-ink);font-weight:600;margin:0 0 .8rem}
.ferr:empty{display:none}
.printonly{display:none}
.hint{display:none}

/* ---------- fields ---------- */
label.f,div.f{display:block;margin:0 0 1.15rem}
label.f,.f>.fl{font-size:.74rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2)}
.f>.fl{display:flex;align-items:center;gap:.35rem;margin-bottom:.4rem}
label.f>input,label.f>textarea,label.f>select{margin-top:.4rem}
input[type=text],input[type=tel],input[type=email],input[type=password],textarea{display:block;width:100%;min-height:3.2rem;padding:.55rem .9rem;border:0;border-radius:0.52rem;background:var(--field);color:var(--ink);font-size:1rem;font-weight:500;letter-spacing:0;text-transform:none;box-shadow:inset 0 0 0 1.5px var(--line);transition:box-shadow .15s,background .15s}
textarea{min-height:6rem}
input:hover,textarea:hover{background:var(--field-hi)}
input:focus,textarea:focus{outline:0;background:#fff;box-shadow:inset 0 0 0 .14rem var(--lo)}
input::placeholder,textarea::placeholder{color:var(--faint);font-weight:500}
.tipi{display:inline-grid;place-items:center;width:1.25rem;height:1.25rem;border-radius:50%;background:var(--field-hi);color:var(--text-2);cursor:help;vertical-align:middle;margin-left:.2rem}
.tipi .i{width:.85rem;height:.85rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
.two.tight{gap:.6rem}
details{margin:0 0 1.2rem}
details>summary{list-style:none;display:inline-flex;align-items:center;gap:.45rem;min-height:2.6rem;font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);cursor:pointer;padding:0 .3rem;border-radius:0.35rem}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"";width:.5rem;height:.5rem;border-right:.15rem solid currentColor;border-bottom:.15rem solid currentColor;transform:translateY(-.12rem) rotate(45deg);transition:transform .2s var(--ease)}
details[open]>summary::after{transform:translateY(.1rem) rotate(-135deg)}
details[open]>summary{margin-bottom:.6rem}
details[open]>*:not(summary){animation:rise .3s var(--ease) both}
.bignum{font-size:1.6rem!important;font-weight:700!important}

/* custom pickers */
.pk{position:relative}
.pkb{display:flex;align-items:center;gap:.6rem;width:100%;min-height:3.2rem;padding:.45rem .9rem;border:0;border-radius:0.52rem;background:var(--field);color:var(--ink);font-size:1rem;font-weight:500;letter-spacing:0;text-transform:none;text-align:left;cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--line);transition:box-shadow .15s,background .15s,transform .1s}
.pkb:hover{background:var(--field-hi)}
.pkb:active{transform:scale(.985)}
.pkb[aria-expanded=true]{background:#fff;box-shadow:inset 0 0 0 .14rem var(--lo)}
.pkb>.i{color:var(--lo)}
.pkv{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pkv small{color:var(--muted)}
.ph{color:var(--faint)}
.pkc{display:grid;place-items:center;color:var(--muted);transition:transform .25s var(--ease)}
.pkb[aria-expanded=true] .pkc{transform:rotate(180deg)}
.pk.flash .pkb{animation:flash .45s ease-out}
.pk-combo input{padding-right:3.2rem}
.pkx{position:absolute;right:.3rem;top:50%;margin-top:-1.3rem;width:2.6rem;height:2.6rem;border:0;border-radius:0.42rem;background:none;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.pk-pay{display:flex;flex-direction:column}
.centsbtn{align-self:flex-end}
.cks{display:flex;flex-wrap:wrap;gap:.4rem}
.ck{display:inline-flex;align-items:center;gap:.45rem;min-height:2.7rem;padding:0 .9rem 0 .55rem;border:0;border-radius:0.45rem;background:var(--field);color:var(--ink);font-weight:600;font-size:.92rem;letter-spacing:0;text-transform:none;cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--line);transition:background .15s,color .15s,transform .1s}
.ck:active{transform:scale(.92)}
.ckb{width:1.3rem;height:1.3rem;border-radius:0.28rem;display:grid;place-items:center;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line-2);color:transparent;transition:background .15s}
.ckb .i{width:.85rem;height:.85rem;transform:scale(.3);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.ck.on{background:var(--ink);color:var(--mode);box-shadow:none}
.ck.on .ckb{background:var(--mode);color:var(--ink);box-shadow:none}.ck.on .ckb .i{transform:none}

/* ---------- popovers, sheets, menu ---------- */
.pop{position:fixed;z-index:60;background:var(--panel);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;border-radius:0.7rem;box-shadow:var(--sh-pop);padding:.4rem;overflow:auto;overscroll-behavior:contain;transform-origin:top center;animation:popin .2s var(--ease) both;max-width:calc(100vw - 16px)}
.pop.up{transform-origin:bottom center}
.pop.out{animation:popout .13s ease-in both}
.pop.list{max-height:min(24rem,70vh)}
.pop.menu{width:min(23rem,calc(100vw - 16px));padding:.5rem}
.pop.menu>.pop-in>*{animation:rise .32s var(--ease) both}
.pop.sheet{left:0;right:0;bottom:0;top:auto!important;max-width:none;width:100%;border-radius:0.98rem 1.4rem 0 0;max-height:80vh;padding:.3rem .8rem calc(1rem + env(safe-area-inset-bottom));animation:sheetin .3s var(--ease) both}
.pop.sheet.out{animation:sheetout .18s ease-in both}
.pop.sheet::before{content:"";display:block;width:2.6rem;height:.3rem;border-radius:0.7rem;background:var(--line-2);margin:.35rem auto .3rem}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:.2rem .3rem .5rem}
.sheet-h b{font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.sheet-x{width:2.6rem;height:2.6rem;border:0;border-radius:50%;background:var(--field);display:grid;place-items:center;cursor:pointer}
.scrim{position:fixed;inset:0;z-index:55;background:rgba(30,27,22,.35);animation:fade .2s both}.scrim.out{animation:fadeout .15s both}
.opt{display:flex;align-items:center;justify-content:space-between;gap:.7rem;width:100%;min-height:2.9rem;padding:.45rem .75rem;border:0;border-radius:0.45rem;background:none;text-align:left;cursor:pointer;color:inherit;font-weight:500;transition:background .12s,transform .1s}
.opt:hover,.opt:focus-visible{background:var(--tint);outline:0}
.opt:active{transform:scale(.97)}
.opt small{display:block;font-size:.8rem;color:var(--muted);line-height:1.3}
.opt.on{background:var(--mode);color:var(--ink);font-weight:700}
.opt.on small{color:var(--ink);opacity:.75}
.grp{margin:.55rem .75rem .3rem;font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.paygrid,.tgrid,.mgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.25rem;padding:.2rem}
.paygrid{grid-template-columns:repeat(7,minmax(0,1fr))}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.2rem;padding:.2rem}
.cell{justify-content:center;min-height:2.6rem;padding:0;font-weight:600;font-variant-numeric:tabular-nums;border-radius:0.42rem}
.cell.on{box-shadow:0 .16rem 0 var(--lo)}
.cell.today:not(.on){box-shadow:inset 0 0 0 .12rem var(--lo)}
.dow{display:grid;place-items:center;height:1.8rem;font-size:.68rem;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.calh{display:flex;align-items:center;justify-content:space-between;padding:.2rem .2rem .4rem}
.calh b{font-weight:700}
.calnav{width:2.6rem;height:2.6rem;border:0;border-radius:0.45rem;background:var(--field);display:grid;place-items:center;cursor:pointer;transition:transform .1s}
.calnav:active{transform:scale(.9)}
.popfoot{display:flex;justify-content:flex-end;padding:.2rem .3rem 0}
.free{display:flex;gap:.5rem;padding:.5rem .3rem .2rem;box-shadow:0 -1px 0 var(--line);margin-top:.3rem}
.free input{flex:1;margin:0}
.mh{display:flex;align-items:center;gap:.8rem;padding:.4rem .5rem .8rem;box-shadow:0 1px 0 var(--line);margin-bottom:.3rem}
.mh b{display:block;font-weight:700}.mh small{color:var(--muted)}
.mh>div{flex:1;min-width:0}
.mav .av{width:3rem;height:3rem}
.mbrand{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.4rem .5rem .6rem}
.mbrand img{height:1.6rem;width:auto;display:block}
.mbrand span{font-size:.66rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mi-row{align-items:flex-start;justify-content:flex-start}
.mi-row>span:not(.appic){flex:1}
.mi-row>.appic{flex:none}
.mi-row .tag{font-size:.62rem;padding:.08rem .45rem;margin-right:.2rem}
.mfoot{box-shadow:0 -1px 0 var(--line);margin-top:.3rem;padding-top:.3rem}
.mfoot .opt{justify-content:flex-start}
.mfoot .opt .i{color:var(--lo)}
.msw{background:var(--field);margin:.1rem 0 .4rem;min-height:3.4rem}.msw .i{color:var(--ink)}

/* ---------- toast and tooltip ---------- */
#toast{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);z-index:65;display:none;align-items:center;gap:.8rem;width:max-content;max-width:92vw;padding:.55rem .55rem .55rem 1.1rem;border-radius:0.63rem;background:var(--ink);color:#F6F4EF;font-weight:600;box-shadow:0 .8rem 2rem rgba(30,27,22,.3)}
#toast.on{display:flex;animation:toastin .28s var(--ease) both}
#toast span{padding:.25rem 0}
#toast button{min-height:2.4rem;padding:0 1rem;border:0;border-radius:0.42rem;background:#9BE338;color:var(--ink);font-weight:700;cursor:pointer;box-shadow:0 .14rem 0 #6FB31C}
#tip{position:fixed;z-index:75;pointer-events:none;max-width:22rem;display:flex;flex-direction:column;gap:.35rem;padding:.75rem 1rem .8rem;border-radius:0.7rem;background:#1F1F24;color:#F0F0F3;box-shadow:0 1rem 2.4rem rgba(0,0,0,.3);opacity:0;transform:translateY(.4rem) scale(.96);transition:opacity .14s,transform .2s var(--ease)}
#tip.on{opacity:1;transform:none}
#tip[data-pos=top]{transform-origin:var(--ax) bottom}#tip[data-pos=bottom]{transform-origin:var(--ax) top}
#tip b{font-size:1rem;font-weight:600}
#tip span{font-size:.9rem;color:#B8B8C0;line-height:1.35}
#tip em{font-style:normal;display:flex;align-items:center;flex-wrap:wrap;gap:.35rem}
#tip kbd{font:inherit;font-size:.82rem;font-weight:700;min-width:1.8rem;text-align:center;padding:.1rem .5rem;border-radius:0.35rem;background:#9BE338;color:var(--ink);box-shadow:0 .15rem 0 #6FB31C}
#tip i{font-style:normal;font-size:.8rem;color:#8A8A94;font-weight:700}
#tip::after{content:"";position:absolute;width:.9rem;height:.9rem;background:#1F1F24;transform:rotate(45deg)}
#tip[data-pos=bottom]::after{top:-.4rem;left:calc(var(--ax) - .45rem)}
#tip[data-pos=top]::after{bottom:-.4rem;left:calc(var(--ax) - .45rem)}
#tip[data-pos=right]::after{left:-.4rem;top:calc(var(--ay) - .45rem)}
#tip[data-pos=left]::after{right:-.4rem;top:calc(var(--ay) - .45rem)}

/* ---------- home ---------- */
main.homey>.mi>h1{font-size:2.4rem}
.needs{display:flex;align-items:center;gap:.7rem;width:100%;min-height:3.4rem;padding:.5rem 1rem .5rem .6rem;margin:0 0 1.3rem;border:0;border-radius:0.7rem;background:var(--panel);color:var(--ink);font-weight:600;cursor:pointer;text-align:left;box-shadow:var(--sh-float),inset 0 0 0 1.5px #F6C0BB;transition:transform .15s var(--ease),box-shadow .15s}
.needs:hover{transform:translateY(-.1rem);box-shadow:var(--sh-lift),inset 0 0 0 1.5px #F6C0BB}.needs:active{transform:scale(.98)}
.needs .dot{display:grid;place-items:center;min-width:1.8rem;height:1.8rem;padding:0 .4rem;border-radius:0.7rem;background:#E5242B;color:#fff;font-weight:700;font-size:.85rem}
.needs .go{margin-left:auto;font-size:.86rem;color:var(--muted)}
.allgood{display:flex;align-items:center;gap:.45rem;font-weight:600;margin:0 0 1.3rem}
.allgood .i{color:#fff;background:var(--ok);border-radius:50%;padding:.15rem;width:1.4rem;height:1.4rem}
.apps{list-style:none;margin:0;padding:0;display:grid;gap:.6rem}
.agrp+.agrp{margin-top:.6rem}
.agrp>summary{list-style:none;display:flex;align-items:center;gap:1rem;min-height:0;font-size:1rem;letter-spacing:0;text-transform:none;padding:.8rem 1.1rem .8rem 1rem;border-radius:.77rem;background:var(--panel);box-shadow:var(--sh-float);cursor:pointer;user-select:none;transition:transform .15s}
.agrp>summary::-webkit-details-marker{display:none}
.agrp>summary:hover{transform:translateY(-1px)}.agrp>summary:active{transform:translateY(1px)}
.agrp>summary:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.agrp .gic{display:grid;place-items:center;width:3rem;height:3rem;border-radius:.66rem;background:var(--ink);color:#fff;flex:none}
.agrp .gic svg{width:1.6rem;height:1.6rem}
.agrp summary b{display:block;font-size:1.25rem;font-weight:700;line-height:1.15}
.agrp summary small{display:block;font-size:.9rem;color:var(--muted);margin-top:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agrp .minis{display:flex}.agrp .minis .appic{width:1.9rem;height:1.9rem;margin:0 0 0 -.45rem;box-shadow:0 0 0 .16rem var(--panel)}
.agrp .grow{flex:1;min-width:0}
.agrp>summary::after{flex:none;margin:0 .2rem 0 .3rem;color:var(--faint)}
details.agrp[open]>summary{margin-bottom:0}
.agrp[open] .minis{display:none}
.agrp>.apps{padding:.6rem 0 .4rem 1.1rem;border-left:.2rem solid var(--line);margin:.5rem 0 0 1.6rem}
.agrp[open]>.apps{animation:grpin .18s ease-out both}
@keyframes grpin{from{opacity:0;transform:translateY(-.3rem)}to{opacity:1;transform:none}}
@media(max-width:600px){.agrp>summary{padding:.75rem .8rem;gap:.8rem}.agrp .gic{width:2.6rem;height:2.6rem}.agrp .minis{display:none}.agrp>.apps{margin-left:.4rem;padding-left:.6rem}}
.arow{display:flex;align-items:center;gap:1rem;width:100%;padding:.8rem 1rem;border:0;border-radius:0.77rem;background:var(--panel);text-align:left;cursor:pointer;color:inherit;box-shadow:var(--sh-float);transition:transform .18s var(--ease),box-shadow .18s}
.arow:hover{transform:translateY(-.12rem);box-shadow:var(--sh-lift),inset 0 0 0 .14rem var(--c)}
.arow:active{transform:scale(.98)}
.arow .appic{width:3.4rem;height:3.4rem;border-radius:0.66rem;box-shadow:0 .2rem 0 var(--clo)}
.arow .grow{flex:1;min-width:0}
.arow b{display:block;font-size:1.2rem;font-weight:700;line-height:1.15}
.arow em{display:block;font-style:normal;font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:.15rem 0 .1rem}
.arow small{display:block;font-size:.9rem;line-height:1.4;color:var(--text-2)}
.arow .count,.agrp .count{display:grid;place-items:center;min-width:1.6rem;height:1.6rem;padding:0 .4rem;border-radius:0.7rem;background:#E5242B;color:#fff;font-weight:700;font-size:.78rem}
.arow .chev{color:var(--faint);font-size:1.4rem;font-weight:300}
@media(max-width:600px){.arow{padding:.75rem .8rem;gap:.8rem}.arow .appic{width:2.9rem;height:2.9rem;border-radius:0.56rem}.arow small{font-size:.86rem}.needs .go{display:none}main.homey>.mi>h1{font-size:1.9rem}}

/* ---------- start screen (setup) ---------- */
main.setup{max-width:30rem}
.setup .mi{background:var(--panel);border-radius:0.98rem;padding:1.6rem 1.5rem 1.4rem;box-shadow:var(--sh-lift)}
.start-logo{display:block;height:2.4rem;width:auto;margin:0 auto 1rem}
.setup h1,.setup .lead{text-align:center}
.setup h1{font-size:1.8rem}
.setup .lead{color:var(--text-2);margin:0 auto 1.3rem;max-width:24rem}
.steps{display:flex;justify-content:center;gap:.35rem;margin:0 0 1rem}
.steps i{width:1.6rem;height:.35rem;border-radius:0.7rem;background:var(--line);transition:background .3s,width .3s var(--ease)}
.steps i.on{background:var(--mode);box-shadow:0 .1rem 0 var(--lo)}
.avpick{position:relative;display:block;margin:0 auto 1.3rem;width:6.4rem;height:6.4rem;border:0;padding:0;border-radius:50%;background:none;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.avpick:hover{transform:scale(1.05) rotate(-3deg)}.avpick:active{transform:scale(.92)}
.avpick .av{width:6.4rem;height:6.4rem;font-size:2.1rem;background:var(--field);color:var(--muted);box-shadow:inset 0 0 0 .14rem var(--line)}
.avpick img.av{box-shadow:0 0 0 .2rem #fff,0 0 0 .34rem var(--line)}
.avpick .cam{position:absolute;right:-.1rem;bottom:.15rem;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--mode);color:var(--ink);display:grid;place-items:center;box-shadow:0 0 0 .2rem #fff,0 .18rem 0 .2rem var(--lo)}
.avpick .cam .i{width:1.1rem;height:1.1rem}
.skip{position:absolute;right:1rem;bottom:1rem;z-index:5;min-height:2.4rem;padding:0 .8rem;border:0;border-radius:0.42rem;background:transparent;color:var(--muted);font-weight:500;font-size:.85rem;text-decoration:underline;text-underline-offset:.2em;cursor:pointer}
.skip:hover{color:var(--ink);background:rgba(30,27,22,.05)}
.setupwrap{position:relative}
.setupwrap>main{padding-bottom:4.5rem}
.setup form .btn.block{margin-top:.3rem}
.setup .list{text-align:left;box-shadow:inset 0 0 0 1.5px var(--line)}

/* ---------- Henge: the week ---------- */
.weeknav{display:flex;align-items:center;gap:.6rem;margin:0 0 1.1rem}
.weeknav strong{flex:1;text-align:center;font-weight:700}
.weeknav .btn{min-width:3.1rem;padding:0 .8rem}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.3rem;align-items:end;margin:0 0 1.3rem}
.days button{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border:0;border-radius:0.42rem .6rem .25rem .25rem;background:var(--panel);box-shadow:var(--sh-float);padding:0 0 .35rem;font-weight:700;font-size:.85rem;color:var(--ink);cursor:pointer;transition:transform .15s var(--ease)}
.days button:active{transform:scale(.94)}
.days button small{font-weight:500;font-size:.72rem;color:var(--muted)}
.days .on{background:var(--mode);box-shadow:0 .2rem 0 var(--lo)}.days .on small{color:var(--ink)}
.day{margin:0 0 1.3rem}
.day h2{margin:0 0 .5rem}
.chip{display:block;width:100%;text-align:left;border:0;border-radius:0.49rem;background:var(--tint);padding:.45rem .6rem .45rem .75rem;margin-bottom:.35rem;cursor:pointer;font-size:.86rem;line-height:1.3;box-shadow:inset .3rem 0 0 var(--mode);transition:transform .12s var(--ease)}
.chip:active{transform:scale(.97)}
.chip b{display:block;font-weight:700;font-variant-numeric:tabular-nums;font-size:.95rem}
.chip.flag{background:var(--warn-bg);box-shadow:inset .3rem 0 0 var(--warn)}
.chip.stop{background:var(--bad-bg);box-shadow:inset .3rem 0 0 var(--bad)}
.chip em{font-style:normal;font-weight:700;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}
.scroll{overflow-x:auto;margin-bottom:1.3rem;border-radius:0.73rem;background:var(--panel);box-shadow:var(--sh-float)}
table.grid{border-collapse:collapse;width:100%;min-width:56rem;table-layout:fixed}
.grid th,.grid td{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:.4rem;vertical-align:top;text-align:left}
.grid tr:last-child td,.grid tr:last-child th{border-bottom:0}
.grid th:first-child{border-left:0;width:9.5rem}
.grid thead th{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:.65rem .5rem}
.grid thead th.today{color:var(--ink);background:var(--tint)}
.grid tbody th{font-weight:700}
.grid tbody th small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.grid td{height:4.4rem;cursor:pointer;transition:background .15s}
.grid td:hover{background:#FBFAF7}
.grid td.over{background:var(--tint)}
.grid td.off{background:repeating-linear-gradient(135deg,transparent 0 .4rem,var(--line) .4rem calc(.4rem + 1px))}
table.plain{border-collapse:collapse;width:100%;min-width:36rem;font-size:.9rem}
.plain th,.plain td{text-align:left;padding:.55rem .7rem;border-bottom:1px solid var(--line);vertical-align:top}
.plain th{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* ---------- Hearth ---------- */
.price{font-size:3.4rem;font-weight:700;line-height:1;letter-spacing:-.02em;margin:0}
.psub{color:var(--text-2);margin:.35rem 0 .9rem}
.costhead{margin-bottom:.5rem}
.dbl{height:.3rem;border-radius:0.7rem;background:var(--mode);box-shadow:0 .12rem 0 var(--lo);margin:0 0 1rem}
.ledger{list-style:none;margin:0 0 1.3rem;padding:.3rem 1rem;background:var(--panel);border-radius:0.73rem;box-shadow:var(--sh-float)}
.ln{display:flex;align-items:baseline;gap:.5rem;padding:.45rem 0;font-size:1rem}
.ln>span small{display:block;font-size:.8rem;color:var(--muted)}
.ln i{flex:1;border-bottom:.14rem dotted var(--line-2);transform:translateY(-.35rem);min-width:1rem}
.ln b{font-weight:600;font-variant-numeric:tabular-nums}
.ln .quiet{min-height:2.4rem;font-size:.82rem;align-self:center}

/* ---------- Notch ---------- */
.lh{display:flex;justify-content:space-between;align-items:baseline;font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.prog{display:flex;gap:.25rem;margin:.55rem 0 1.1rem}
.prog i{flex:1;height:.6rem;border-radius:0.7rem;background:var(--field-hi);transition:background .25s}
.prog i.f{background:var(--mode);box-shadow:0 .1rem 0 var(--lo)}
.box{flex:none;width:1.8rem;height:1.8rem;border-radius:0.35rem;display:grid;place-items:center;background:var(--field);box-shadow:inset 0 0 0 1.5px var(--line-2);color:var(--ink)}
.box.on{background:var(--mode);box-shadow:0 .14rem 0 var(--lo)}
.box svg{stroke:var(--ink);width:1.1rem;height:1.1rem}
.row small.nt{color:var(--text-2)}
.stamp{display:inline-block;transform:rotate(-6deg);border:.2rem solid #D42F3A;color:#B3242C;border-radius:0.42rem;padding:.4rem 1rem;margin:.2rem 0 1.3rem;font-size:1.2rem;font-weight:700;letter-spacing:.14em;text-align:center;background:rgba(255,255,255,.7);animation:stampdown .4s cubic-bezier(.3,1.4,.5,1) both}
.stamp small{display:block;font-size:.68rem;font-weight:600;letter-spacing:.1em}
.steps-ed{list-style:none;margin:0 0 .7rem;padding:0;display:grid;gap:.5rem}
.stepcard{display:flex;align-items:flex-start;gap:.25rem;padding:.4rem .35rem .4rem .15rem;background:var(--panel);border-radius:0.66rem;box-shadow:var(--sh-float);position:relative;transition:box-shadow .15s}
.stepcard.dragging{z-index:5;box-shadow:var(--sh-pop),inset 0 0 0 .14rem var(--mode);transition:none}
.sorting .stepcard:not(.dragging){transition:transform .15s}
.stepcard.bump{animation:bump .2s ease-out}
.stepcard.new{animation:rise .3s var(--ease) both}
.stepcard.gone{animation:gone .16s ease-in both}
.grab{flex:none;width:2.2rem;min-height:3.1rem;border:0;background:none;color:var(--faint);display:grid;place-items:center;touch-action:none;border-radius:0.42rem}
.grab:hover{background:var(--field);color:var(--ink)}
.stepin{flex:1;min-width:0}
.steptop{display:flex;align-items:center;gap:.5rem}
.stepn{flex:none;display:grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:0.32rem;background:var(--mode);color:var(--ink);font-weight:700;font-size:.8rem;box-shadow:0 .1rem 0 var(--lo)}
.stepin input,.stepin textarea{background:transparent!important;box-shadow:none!important;min-height:0!important;padding:.3rem .25rem!important;border-radius:0.28rem!important}
.stepin input{font-weight:600;font-size:1.02rem}
.stepin input:focus,.stepin textarea:focus{background:var(--field)!important}
.stepin textarea{display:block;font-size:.88rem;color:var(--text-2);min-height:1.8rem!important;overflow:hidden;margin-left:2.1rem;width:calc(100% - 2.1rem)}
.addstep{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;min-height:3rem;border:0;border-radius:0.66rem;background:var(--tint);color:var(--ink);font-weight:700;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;box-shadow:inset 0 0 0 .14rem var(--tint-2);transition:background .15s,transform .1s}
.addstep:hover{background:var(--tint-2)}.addstep:active{transform:scale(.98)}

/* ---------- Mammoth ---------- */
.reading{background:var(--panel);border-radius:0.73rem;padding:1.1rem 1.2rem;margin-bottom:1.2rem;box-shadow:var(--sh-float)}
.tlab{font-size:.74rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2);margin:0}
.read{font-size:5rem;font-weight:700;line-height:.95;letter-spacing:-.02em;margin:.4rem 0 .7rem}
.read sup{font-size:1.8rem;vertical-align:top;position:relative;top:.5rem;margin-left:.1rem}
.read.bad{color:#C7262E}
.gauge{position:relative;height:.75rem;border-radius:0.7rem;background:var(--field-hi);margin:.3rem 0 .45rem}
.gauge .rng{position:absolute;top:0;bottom:0;background:var(--mode);border-radius:0.7rem}
.gauge .nd{position:absolute;top:-.4rem;width:.25rem;height:1.55rem;margin-left:-.12rem;background:var(--ink);border-radius:0.7rem}
.ticks{display:flex;justify-content:space-between;font-size:.74rem;font-weight:600;color:var(--muted);margin-bottom:.7rem}
.row b.rd{font-size:1.35rem;font-weight:700}

/* ---------- Conch ---------- */
.row .dn{display:block;font-weight:700}
.row.s-ok{box-shadow:inset .3rem 0 0 var(--ok)}.row.s-warn{box-shadow:inset .3rem 0 0 var(--warn)}.row.s-bad{box-shadow:inset .3rem 0 0 var(--bad);background:var(--bad-bg)}

/* ---------- Stomp ---------- */
.offchip{border-radius:2rem;padding:.22rem .6rem;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;box-shadow:inset 0 0 0 1.5px var(--ink);white-space:nowrap}
.bigstat{font-size:1.9rem;font-weight:700;line-height:1.05;text-transform:uppercase;margin:.2rem 0 0}
.bigbtn{width:100%;min-height:9.5rem;border:0;border-radius:0.98rem;background:var(--mode);color:var(--ink);font-size:2.4rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;cursor:pointer;margin:1rem 0 1.3rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;box-shadow:0 .45rem 0 var(--lo),0 1rem 2rem rgba(30,27,22,.12);transition:transform .1s var(--ease),box-shadow .1s}
.bigbtn:active{transform:translateY(.35rem) scale(.98);box-shadow:0 .1rem 0 var(--lo)}
.bigbtn.out{background:var(--panel);box-shadow:inset 0 0 0 .2rem var(--mode),0 .45rem 0 var(--lo)}
.bigbtn .mk{width:2.8rem;height:2.8rem;color:var(--ink)}
.lockit{margin-top:1.3rem}

/* ---------- Clan ---------- */
.pav{flex:none;width:2.8rem;height:2.8rem;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.95rem;color:var(--ink);box-shadow:0 .16rem 0 rgba(30,27,22,.15)}
.crewhead{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin:0 0 1rem}
.crewhead b{font-size:1.25rem;font-weight:700}
.stack{display:flex}
.stack i{width:2.5rem;height:2.5rem;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:.82rem;color:var(--ink);box-shadow:0 0 0 .18rem var(--bg);margin-left:-.6rem}
.stack i:first-child{margin-left:0}

/* ---------- Fossil ---------- */
.stonebox{display:flex;gap:1.1rem;align-items:center;margin:0 0 1.3rem;padding:1rem 1.1rem;background:var(--panel);border-radius:0.73rem;box-shadow:var(--sh-float)}
.stone{width:4.6rem;height:4.6rem;flex:none;color:var(--mode);--m2:var(--ink);animation:pop .4s var(--ease) both}
.stone.dim{opacity:.45}
.stonebox b{display:block;font-size:1.6rem;font-weight:700;line-height:1.1}
.stonebox p{margin:.15rem 0 .45rem;color:var(--text-2)}

/* ---------- motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(.7rem)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.97);opacity:.6}100%{transform:none;opacity:1}}
@keyframes heroin{from{opacity:0;transform:translateY(-.6rem) scale(.985)}to{opacity:1;transform:none}}
@keyframes popicon{0%{transform:scale(.6) rotate(-8deg);opacity:0}70%{transform:scale(1.08) rotate(2deg);opacity:1}100%{transform:none}}
@keyframes popin{from{opacity:0;transform:translateY(-.4rem) scale(.96)}to{opacity:1;transform:none}}
@keyframes popout{to{opacity:0;transform:translateY(-.25rem) scale(.97)}}
@keyframes sheetin{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetout{to{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}@keyframes fadeout{to{opacity:0}}
@keyframes tickpop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes badge{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-.35rem)}40%{transform:translateX(.35rem)}60%{transform:translateX(-.2rem)}80%{transform:translateX(.15rem)}}
@keyframes flash{0%{box-shadow:inset 0 0 0 .14rem var(--lo),0 0 0 0 color-mix(in srgb,var(--mode) 55%,transparent)}100%{box-shadow:inset 0 0 0 1.5px var(--line),0 0 0 .6rem transparent}}
@keyframes bump{50%{transform:scale(.985)}}
@keyframes gone{to{opacity:0;transform:scale(.95)}}
@keyframes stampdown{0%{opacity:0;transform:rotate(-6deg) scale(1.8)}60%{opacity:1;transform:rotate(-6deg) scale(.94)}100%{transform:rotate(-6deg) scale(1)}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,1rem) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes needle{from{transform:translateX(-2rem);opacity:0}}
@keyframes grow{from{transform:scaleX(0)}}
.page.enter .hero{animation:heroin .4s var(--ease) both}
.page.enter .hero .appic.blob{animation:popicon .5s .06s var(--ease) both}
.page.enter .mi>*{animation:rise .4s var(--ease) both}
.page.enter .mi>*:nth-child(2){animation-delay:.035s}.page.enter .mi>*:nth-child(3){animation-delay:.07s}.page.enter .mi>*:nth-child(4){animation-delay:.105s}.page.enter .mi>*:nth-child(5){animation-delay:.14s}.page.enter .mi>*:nth-child(6){animation-delay:.175s}.page.enter .mi>*:nth-child(7){animation-delay:.21s}.page.enter .mi>*:nth-child(n+8){animation-delay:.245s}
.page.enter .apps>li,.page.enter .list>li{animation:rise .4s var(--ease) both}
.page.enter .apps>li:nth-child(1),.page.enter .list>li:nth-child(1){animation-delay:.07s}
.page.enter .apps>li:nth-child(2),.page.enter .list>li:nth-child(2){animation-delay:.105s}
.page.enter .apps>li:nth-child(3),.page.enter .list>li:nth-child(3){animation-delay:.14s}
.page.enter .apps>li:nth-child(4),.page.enter .list>li:nth-child(4){animation-delay:.175s}
.page.enter .apps>li:nth-child(5),.page.enter .list>li:nth-child(5){animation-delay:.21s}
.page.enter .apps>li:nth-child(6),.page.enter .list>li:nth-child(6){animation-delay:.245s}
.page.enter .apps>li:nth-child(7),.page.enter .list>li:nth-child(7){animation-delay:.28s}
.page.enter .apps>li:nth-child(n+8),.page.enter .list>li:nth-child(n+8){animation-delay:.315s}
.page.enter .gauge .nd{animation:needle .6s .15s cubic-bezier(.3,1.4,.5,1) both}
.page.enter .prog i.f{transform-origin:left;animation:grow .45s var(--ease) both}
.row.pop .box{animation:tickpop .3s cubic-bezier(.3,1.6,.5,1)}
.ck.pop .ckb{animation:tickpop .3s cubic-bezier(.3,1.6,.5,1)}
.shake{animation:shake .38s ease-in-out}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

/* ---------- print ---------- */
@media print{
 .noprint,.top,#toast,#tip,#fx,#bg,.quiets,.btn,.quiet,.backlink,.skip{display:none!important}
 .printonly{display:block}
 html,body{background:#fff;font-size:12px}
 .page>main,.page>main.wide{max-width:none;padding:0}
 .scroll{overflow:visible;box-shadow:none}
 table.grid,table.plain{min-width:0}
 .grid td{height:auto}
 .hero{box-shadow:none}
}

.seg{display:flex;background:var(--field);border-radius:0.52rem;padding:.25rem;gap:.25rem;box-shadow:inset 0 0 0 1.5px var(--line)}.seg button{flex:1;min-height:2.6rem;border:0;border-radius:0.39rem;background:none;font-weight:600;cursor:pointer;color:var(--ink);transition:background .15s,color .15s}.seg button.on{background:var(--ink);color:var(--mode)}.seg button:active{transform:scale(.95)}

.hero{max-width:41.8rem}
/* Henge: shift blocks without the coloured side line */
.chip,.chip.flag,.chip.stop{box-shadow:none;padding-left:.6rem}
/* pills stay round */
.badge,.needs .dot,.arow .count,.gauge,.gauge .rng,.gauge .nd,.prog i,.steps i,.offchip{border-radius:999px}
/* every page's content in its own box */
.panelbox{background:var(--panel);border-radius:.7rem;padding:1.1rem 1.1rem .4rem;box-shadow:var(--sh-float);margin-bottom:1rem}
.panelbox>:last-child{margin-bottom:.7rem}
.panelbox .list,.panelbox .card,.panelbox .ledger,.panelbox .reading,.panelbox .stonebox,.panelbox .scroll,.panelbox .stepcard,.panelbox .arow,.panelbox .note:not(.soft):not(.warn):not(.bad):not(.ok){box-shadow:inset 0 0 0 1.5px var(--line)}
.panelbox .arow:hover{box-shadow:inset 0 0 0 .14rem var(--c);transform:translateY(-.08rem)}
.panelbox .stepcard.dragging{box-shadow:var(--sh-pop),inset 0 0 0 .14rem var(--mode)}
.panelbox .empty{margin-bottom:.7rem}
.page.enter .panelbox{animation:rise .4s var(--ease) both}
@media(max-width:600px){.panelbox{padding:.8rem .75rem .3rem}}
/* add-cents box */
.pop.dlg{inset:0;margin:auto;width:min(21rem,calc(100vw - 2rem));height:fit-content;padding:1.1rem 1.2rem 1rem;border-radius:.8rem;transform-origin:center}
.dh{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-2);margin:0 0 .7rem}
.centsrow{display:flex;align-items:center;justify-content:center;gap:.15rem;padding:.6rem 0 1rem}
.dol{font-size:2.6rem;font-weight:700;line-height:1}
.centsin{width:4.6rem!important;min-height:3.6rem!important;font-size:2.4rem!important;font-weight:700!important;text-align:center;padding:.1rem .3rem!important}
.per{margin-left:.5rem;color:var(--muted);font-weight:500}
.dlgbtns{display:flex;gap:.6rem}.dlgbtns .btn{flex:1}
.stone{display:grid;place-items:center;width:4.4rem;height:4.4rem;flex:none;border-radius:.7rem;background:var(--mode);color:var(--ink);box-shadow:0 .2rem 0 var(--lo)}
.stone .mk{width:2.4rem;height:2.4rem}
.stone.dim{background:var(--field-hi);box-shadow:none;opacity:1}
</style>

<script id="gd-kit-js">/* ==========================================================================
   Grug Digital UI kit · kit.js  (vanilla, no dependencies)
   Needs window.GD_DATA = { icons:{name:[svgInner, keywords]}, cursors:{name:[dataURI,hx,hy]},
                            patterns:{name:dataURI(32×32 white-on-transparent)}, brand:{wordmark,icon,mark} }
   Usage:  GD.init({ accent:'yellow', pattern:'mosaic' })
   ========================================================================== */
(function () {
  const D = () => window.GD_DATA || {};
  const $ = (s, r) => (r || document).querySelector(s);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const DPR = () => Math.min(2, window.devicePixelRatio || 1);
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const GD = {
    /* accent hex values, used for particles, canvas drawing, etc. */
    ACCENTS: { yellow: ['#FFBE1A', '#D99A00'], teal: ['#4FD8C4', '#25A893'], blue: ['#8AA8FF', '#5E7FE0'], red: ['#FF4D4D', '#D42F3A'], purple: ['#C59BFF', '#9A6FE0'], pink: ['#FF8FC2', '#E0669E'], grug: ['#9BE338', '#6FB31C'] },
    esc, clamp,

    /* ---------- icons: 16×16 one-colour SVGs that take currentColor ---------- */
    icon(name, cls) {
      const ic = (D().icons || {})[name];
      if (!ic) return '';
      return `<svg class="${cls || 'ico'}" viewBox="0 0 16 16" fill="none" aria-hidden="true">${ic[0]}</svg>`;
    },
    /* fill every <i data-icon="name"></i> in a root */
    hydrateIcons(root) { (root || document).querySelectorAll('[data-icon]').forEach(el => { if (!el.dataset.done) { el.innerHTML = GD.icon(el.dataset.icon, el.dataset.iconClass); el.dataset.done = 1; } }); },

    /* ---------- cursors: contextual SVG cursors from the Kenney Cursor Pack (outline) ---------- */
    cur(name, fallback) { const c = (D().cursors || {})[name]; return c ? `url("${c[0]}") ${c[1]} ${c[2]}, ${fallback || 'auto'}` : (fallback || 'auto'); },
    CURSOR_RULES: [
      ['html, body, .sidebar, .panel, .menu, .dlg, .pop', ['pointer_c', 'default']],
      ['button, a, .toggle, .tab, .tile, .sw, .rowbtn, .mi, [data-act], select, label, summary', ['hand_point', 'pointer']],
      ['button:disabled, [disabled], .tb[disabled]', ['cursor_disabled', 'not-allowed']],
      ['input[type=range]', ['resize_a_horizontal', 'ew-resize']],
      ['input[type=text], input[type=number], input[type=search], textarea, .field, .xin', [null, 'text']],
      ['.grab', ['hand_open', 'grab']], ['.grab:active, .grabbing', ['hand_closed', 'grabbing']],
      ['.cur-rotate-l', ['rotate_ccw', 'pointer']], ['.cur-rotate-r', ['rotate_cw', 'pointer']],
      ['.cur-wrench', ['tool_wrench', 'pointer']], ['.cur-zoom-in', ['zoom_in', 'zoom-in']], ['.cur-zoom-out', ['zoom_out', 'zoom-out']],
      ['.cur-ns', ['resize_a_vertical', 'ns-resize']], ['.cur-ew', ['resize_a_horizontal', 'ew-resize']], ['.cur-move', ['resize_a_cross', 'move']],
      ['.cur-cross', ['cross_small', 'crosshair']], ['.cur-target', ['target_a', 'crosshair']],
      ['.cur-pencil', ['drawing_pencil', 'crosshair']], ['.cur-brush', ['drawing_brush', 'crosshair']], ['.cur-bucket', ['drawing_bucket', 'crosshair']],
      ['.cur-picker', ['drawing_picker', 'crosshair']], ['.cur-eraser', ['drawing_eraser', 'crosshair']], ['.cur-line', ['line_cross', 'crosshair']],
      ['body.busy, body.busy *', ['busy_circle', 'progress', true]]
    ],
    installCursors(extra) {
      const rules = GD.CURSOR_RULES.concat(extra || []);
      const st = document.createElement('style'); st.id = 'gd-cursors';
      st.textContent = rules.map(([sel, [n, fb, imp]]) => `${sel}{cursor:${n ? GD.cur(n, fb) : fb}${imp ? ' !important' : ''}}`).join('\n');
      document.head.appendChild(st);
    },

    /* ---------- pixel-pattern backgrounds: white tile → accent colour at ~8.5% alpha, 96px, static ---------- */
    _pat: {},
    pattern(name, color, alpha) {
      const key = name + color + alpha; if (GD._pat[key]) return Promise.resolve(GD._pat[key]);
      const src = (D().patterns || {})[name]; if (!src) return Promise.resolve('');
      return new Promise(res => {
        const img = new Image(); img.onload = () => {
          const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
          const g = c.getContext('2d'); g.drawImage(img, 0, 0);
          g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.globalAlpha = alpha == null ? 0.085 : alpha; g.fillRect(0, 0, c.width, c.height);
          res(GD._pat[key] = c.toDataURL());
        }; img.src = src;
      });
    },
    /* switch accent: recolours sidebars/buttons via CSS vars and crossfades the background pattern */
    async setAccent(accent, pattern, target) {
      const el = target || document.body; el.dataset.accent = accent;
      if (pattern === undefined) return;
      const bg = $('#bg') || document.body.insertAdjacentElement('afterbegin', Object.assign(document.createElement('div'), { id: 'bg' }));
      const url = pattern ? await GD.pattern(pattern, GD.ACCENTS[accent] ? GD.ACCENTS[accent][0] : accent) : '';
      const old = bg.querySelector('.bgl.on'), l = document.createElement('div'); l.className = 'bgl';
      if (url) l.style.backgroundImage = `url("${url}")`;
      bg.appendChild(l); void l.offsetWidth; l.classList.add('on');
      if (old) { old.classList.remove('on'); setTimeout(() => old.remove(), 700); }
    },

    /* ---------- toast ---------- */
    toast(msg, ms) {
      let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
      t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), ms || 1800);
    },

    /* ---------- scrim + dialog + menu + popover (never use alert/confirm/prompt) ---------- */
    _scrim() { let s = $('#scrim'); if (!s) { s = document.createElement('div'); s.id = 'scrim'; document.body.appendChild(s); s.addEventListener('pointerdown', () => GD.closeAll()); } return s; },
    dialog(opts) {
      GD.closeAll(); const s = GD._scrim();
      const d = document.createElement('div'); d.className = 'dlg' + (opts.wide ? ' wide' : '');
      d.innerHTML = (opts.title ? `<h3>${esc(opts.title)}</h3>` : '') + (opts.html || '') +
        (opts.buttons ? `<div class="btns">${opts.buttons.map((b, i) => `<button class="btn${b.primary ? ' pri' : ''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div>` : '');
      document.body.appendChild(d); GD.hydrateIcons(d);
      d.addEventListener('click', e => { const b = e.target.closest('.btns [data-i]'); if (!b) return; const fn = opts.buttons[+b.dataset.i].onClick; if (!fn || fn(d) !== false) GD.closeAll(); });
      requestAnimationFrame(() => { s.classList.add('on'); d.classList.add('on'); });
      GD._open = d; return d;
    },
    menu(el) { GD.closeAll(); GD._scrim().classList.add('on'); el.classList.add('on'); GD._open = el; },
    popover(el, anchor) {

<script id="core">
/* ---------- Core: pure logic, no browser APIs. Unit-tested in Node. ---------- */
const Core=(()=>{
const SCHEMA=3, COLLS=['roles','employees','shifts','timeOff','ingredients','recipes','checklists','checkRuns','tempSpots','tempLogs','expirations','punches'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};

const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DNL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtT=t=>{let[h,m]=t.split(':').map(Number);const ap=h<12?'am':'pm';h=h%12||12;return h+(m?':'+pad(m):'')+ap};
const fmtDay=d=>{const x=parseYmd(d);return DN[x.getDay()]+' '+MON[x.getMonth()]+' '+x.getDate()};
const fmtH=n=>String(Math.round(n*100)/100);
const r2=n=>Math.round(n*100)/100;
const uid=()=>(typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);

/* Overtime split. items: one person's shifts in one work week, in time order.

function splitOT(items,R){
  let weekReg=0;const dayH={};
  return items.map(it=>{
    const used=dayH[it.date]||0;
    const dayRem=R.otDaily>0?Math.max(0,R.otDaily-used):Infinity;
    const weekRem=R.otWeekly>0?Math.max(0,R.otWeekly-weekReg):Infinity;
    const reg=Math.min(it.hours,dayRem,weekRem),ot=it.hours-reg;
    dayH[it.date]=used+it.hours;weekReg+=reg;
    return{...it,reg,ot};

}
const byStart=(a,b)=>absSpan(a)[0]-absSpan(b)[0];

/* Staff cost for one full work week. */
function labor(D,dates){
  const R=D.settings,set=new Set(dates),byEmp={};let hours=0,ot=0,cost=0;
  for(const e of D.employees){
    const items=D.shifts.filter(s=>s.empId===e.id&&set.has(s.date)).sort(byStart).map(s=>({date:s.date,hours:shiftHours(s)}));
    if(!items.length)continue;
    let H=0,O=0;for(const it of splitOT(items,R)){H+=it.hours;O+=it.ot}

}

/* Problems in one week, in plain words, each with a suggested fix. */
function issues(D,dates){
  const R=D.settings,out=[],inWk=new Set(dates),lo=addDays(dates[0],-1),hi=addDays(dates[dates.length-1],1);
  const lab=s=>DN[dow(s.date)]+' '+fmtT(s.start)+'–'+fmtT(s.end);
  for(const e of D.employees){
    const near=D.shifts.filter(s=>s.empId===e.id&&s.date>=lo&&s.date<=hi).sort(byStart);
    const wk=near.filter(s=>inWk.has(s.date));if(!wk.length)continue;
    const push=(level,kind,ids,msg,fix)=>out.push({level,kind,empId:e.id,ids,shiftId:ids[ids.length-1],msg,fix});
    for(let i=0;i<near.length;i++)for(let j=i+1;j<near.length;j++){
      const a=near[i],b=near[j];if(!inWk.has(a.date)&&!inWk.has(b.date))continue;
      if(absSpan(b)[0]<absSpan(a)[1])push('stop','double',[a.id,b.id],`${e.name} is booked twice: ${lab(a)} and ${lab(b)}.`,'Choose another time or another person.');
    }
    if(R.minRest>0)for(let i=1;i<near.length;i++){
      const a=near[i-1],b=near[i];if(!inWk.has(a.date)&&!inWk.has(b.date))continue;
      const gap=absSpan(b)[0]-absSpan(a)[1];
      if(a.date!==b.date&&gap>=0&&gap<R.minRest*60)push('check','rest',[a.id,b.id],`${e.name} finishes ${DN[dow(a.date)]} at ${fmtT(a.end)} and starts ${DN[dow(b.date)]} at ${fmtT(b.start)}. That is only ${fmtH(gap/60)} hours off.`,'Move one of the two shifts.');
    }

    for(const s of wk){
      const h=shiftHours(s);dayH[s.date]=(dayH[s.date]||0)+h;weekH+=h;
      if((e.offDays||[]).includes(dow(s.date)))push('check','offday',[s.id],`${e.name} doesn't work ${DNL[dow(s.date)]}s, but has a shift ${lab(s)}.`,'Pick another day or another person.');
      for(const t of D.timeOff)if(t.empId===e.id&&s.date>=t.from&&s.date<=t.to)push('stop','timeoff',[s.id],`${e.name} has time off on ${fmtDay(s.date)}, but has a shift ${lab(s)}.`,'Pick another person.');
    }

    if(R.otWeekly>0&&weekH>R.otWeekly)push('check','overtime',[wk[wk.length-1].id],`${e.name} is scheduled ${fmtH(weekH)} hours this week. ${fmtH(weekH-R.otWeekly)} of those are overtime.`,'Give a shift to someone else to avoid overtime pay.');

}
/* Problems a shift would cause if saved (used live in the shift form). */
function shiftProblems(D,cand){
  const c={...cand,id:cand.id||'__new'};
  const tmp={...D,shifts:D.shifts.filter(s=>s.id!==c.id).concat(c)};
  const ds=weekDates(weekStart(c.date,D.settings.weekStart));
  return issues(tmp,ds).filter(i=>i.ids.includes(c.id)||(i.kind==='overtime'&&i.empId===c.empId&&c.empId));
}

function payrollRows(D,dates){
  const L=labor(D,dates),rows=[['Employee','Job','Regular hours','Overtime hours','Total hours','Hourly pay','Estimated pay']];
  for(const e of D.employees){const x=L.byEmp[e.id];if(!x)continue;
    const role=D.roles.find(r=>r.id===e.roleId);
    rows.push([e.name,role?role.name:'',r2(x.reg),r2(x.ot),r2(x.hours),r2(+e.wage||0),r2(x.cost)])}
  return rows;
}
function csv(rows){
  const cell=v=>{if(typeof v==='number')return String(v);let s=String(v==null?'':v);if(/^[=+\-@]/.test(s))s="'"+s;return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  return rows.map(r=>r.map(cell).join(',')).join('\r\n')+'\r\n';
}

/* The draft text message for one person. */
function scheduleText(D,e,dates){
  const first=e.name.trim().split(/\s+/)[0],biz=D.settings.name||'work';
  const mine=D.shifts.filter(s=>s.empId===e.id&&dates.includes(s.date)).sort(byStart);
  const wk=MON[parseYmd(dates[0]).getMonth()]+' '+parseYmd(dates[0]).getDate();
  if(!mine.length)return`Hi ${first}, you're not on the schedule at ${biz} for the week of ${wk}.`;
  const lines=mine.map(s=>{const r=D.roles.find(x=>x.id===s.roleId);return`${fmtDay(s.date)}: ${fmtT(s.start)}–${fmtT(s.end)}${r?' ('+r.name+')':''}${s.note?' – '+s.note:''}`});
  const hrs=mine.reduce((a,s)=>a+shiftHours(s),0);
  return`Hi ${first}, here is your schedule at ${biz} for the week of ${wk}:\n${lines.join('\n')}\nTotal: ${fmtH(hrs)} hours. Reply if anything doesn't work.`;
}
const cleanPhone=p=>String(p||'').replace(/[^\d+]/g,'').replace(/(?!^)\+/g,'');
const smsHref=(phone,body)=>'sms:'+cleanPhone(phone)+'?&body='+encodeURIComponent(body);

/* ---- Schema, migrations, backup, merge ---- */
const MIGRATIONS={0:d=>{for(const c of COLLS)if(!Array.isArray(d[c]))d[c]=[];d.settings={...blank().settings,...(d.settings||{})};return d},
  1:d=>{for(const c of COLLS)if(!Array.isArray(d[c]))d[c]=[];const b=blank().settings;d.settings={...b,...(d.settings||{})};d.settings.tools={...b.tools,...(d.settings.tools||{})};return d},
  2:d=>{for(const l of d.checklists||[]){if(!(l.items||[]).some(x=>typeof x==='string'))continue;const map={};
      l.items=l.items.map((t,i)=>{if(typeof t!=='string')return t;const id=l.id+'-'+i;map[t]=id;return{id,title:t,note:''}});
      for(const r of d.checkRuns||[])if(r.listId===l.id&&r.done){const nd={};for(const k in r.done)nd[map[k]||k]=r.done[k];r.done=nd}}
    d.settings={...blank().settings,...(d.settings||{})};d.settings.tools={...blank().settings.tools};return d}};
function migrate(data,steps=MIGRATIONS,target=SCHEMA){
  let d=JSON.parse(JSON.stringify(data)),v=+d.schemaVersion||0;
  if(v>target)throw new Error('This file was made by a newer version of the app.');
  while(v<target){const f=steps[v];if(!f)throw new Error('No upgrade step from version '+v+'.');d=f(d);v++;d.schemaVersion=v}
  return d;
}
function makeBackup(D,deviceId,now){
  const data={settings:D.settings};for(const c of COLLS)data[c]=D[c];
  return{app:'daypart-backup',schemaVersion:D.schemaVersion,exportedAt:now,deviceId,data};
}
function readBackup(obj){
  try{
    if(!obj||typeof obj!=='object'||obj.app!=='daypart-backup'||!obj.data||typeof obj.data!=='object')return{error:"This isn't a Daypart backup file. Choose a file saved from Fossil."};
    const raw={...obj.data,schemaVersion:obj.schemaVersion};
    for(const c of COLLS){if(raw[c]===undefined)continue;
      if(!Array.isArray(raw[c])||raw[c].some(r=>!r||typeof r!=='object'||typeof r.id!=='string'))return{error:'This backup file is damaged ('+c+' could not be read).'}}
    if(raw.settings!==undefined&&(typeof raw.settings!=='object'||Array.isArray(raw.settings)))return{error:'This backup file is damaged (settings could not be read).'};
    return{data:migrate(raw),exportedAt:obj.exportedAt||null,deviceId:obj.deviceId||null};
  }catch(e){return{error:e.message||'This file could not be read.'}}
}
function previewImport(cur,inc){
  const out={};
  for(const c of COLLS){const m=new Map(cur[c].map(r=>[r.id,r]));let added=0,newer=0,older=0,same=0;const seen=new Set();
    for(const r of inc[c]){seen.add(r.id);const x=m.get(r.id);
      if(!x)added++;else if((r.updatedAt||'')>(x.updatedAt||''))newer++;else if((r.updatedAt||'')<(x.updatedAt||''))older++;else same++}

/* Merge: keep everything here, add what's new in the file, and where both have the same record keep the newer one. */
function mergeData(cur,inc){
  const out={schemaVersion:cur.schemaVersion,settings:(inc.settings.updatedAt||'')>(cur.settings.updatedAt||'')?inc.settings:cur.settings};
  for(const c of COLLS){const m=new Map(cur[c].map(r=>[r.id,r]));
    for(const r of inc[c]){const x=m.get(r.id);if(!x||(r.updatedAt||'')>(x.updatedAt||''))m.set(r.id,r)}

}
function stamp(rec,deviceId,now){if(!rec.createdAt)rec.createdAt=now;rec.updatedAt=now;rec.updatedBy=deviceId;return rec}
function stampAll(D,deviceId,now){stamp(D.settings,deviceId,now);for(const c of COLLS)D[c].forEach(r=>stamp(r,deviceId,now));return D}

/* ---- Recipes ---- */
const num=v=>v===''||v==null||isNaN(+v)?null:+v;
const unitCost=g=>{const w=Math.min(95,Math.max(0,+g.wastePct||0));return(+g.packPrice||0)/(+g.packSize||1)/(1-w/100)};
function recipeCost(D,r,bump,seen){seen=new Set(seen||[]);if(seen.has(r.id))return 0;seen.add(r.id);let t=0;
  for(const it of r.items||[]){const q=+it.qty||0;
    if(it.ingId){const g=D.ingredients.find(x=>x.id===it.ingId);if(g)t+=unitCost(g)*q*(bump&&bump.ingId===g.id?1+bump.pct/100:1)}
    else if(it.recipeId){const s=D.recipes.find(x=>x.id===it.recipeId);if(s)t+=recipeCost(D,s,bump,seen)*q}}
  return t/Math.max(1,+r.servings||1)}
function usesRecipe(D,r,id,seen){seen=seen||new Set();if(r.id===id)return true;if(seen.has(r.id))return false;seen.add(r.id);
  return(r.items||[]).some(it=>{const s=it.recipeId&&D.recipes.find(x=>x.id===it.recipeId);return!!s&&usesRecipe(D,s,id,seen)})}
function usesIng(D,r,ingId,seen){seen=seen||new Set();if(seen.has(r.id))return false;seen.add(r.id);
  return(r.items||[]).some(it=>{if(it.ingId===ingId)return true;const s=it.recipeId&&D.recipes.find(x=>x.id===it.recipeId);return!!s&&usesIng(D,s,ingId,seen)})}
const foodPct=(cost,price)=>+price>0?cost/price*100:null;
const suggestPrice=(cost,pct)=>Math.ceil(cost/(pct/100)*4-1e-9)/4;
function simulate(D,ingId,pct){const T=+D.settings.foodCostPct||30;
  return D.recipes.filter(r=>usesIng(D,r,ingId)).map(r=>{const before=recipeCost(D,r),after=recipeCost(D,r,{ingId,pct}),pb=foodPct(before,r.price),pa=foodPct(after,r.price);
    return{id:r.id,name:r.name,price:+r.price||0,before,after,pctBefore:pb,pctAfter:pa,suggested:pa!=null&&pa>T?suggestPrice(after,T):null}}).sort((a,b)=>(b.after-b.before)-(a.after-a.before))}
function priceChange(g){const h=g.history;if(!h||!h.length)return null;const last=h[h.length-1],cur=(+g.packPrice||0)/(+g.packSize||1);
  if(!(last.unit>0))return null;const pct=(cur-last.unit)/last.unit*100;return Math.abs(pct)<0.5?null:{pct,date:last.date}}
function parsePriceCsv(text){const out=[];for(const line of String(text).split(/\r?\n/)){if(!line.trim())continue;
  const cells=(line.match(/("([^"]|"")*"|[^,]*)(,|$)/g)||[]).map(c=>c.replace(/,$/,'').trim().replace(/^"|"$/g,'').replace(/""/g,'"'));
  const name=cells[0],p=cells.slice(1).map(c=>c.replace(/[$\s]/g,'')).find(c=>c!==''&&!isNaN(+c));

function tempStatus(spot,t){const lo=num(spot.min),hi=num(spot.max);return lo!=null&&t<lo?'cold':hi!=null&&t>hi?'warm':'ok'}

/* Home: everything that needs attention, most important first. The dashboard shows the first five. */
function attention(D,today,info){
  const T=D.settings.tools||{},on=k=>T[k]!==false,bad=[],warn=[],inf=[];
  const one=(list,many)=>list.length===1?list[0]:many.replace('#',list.length);
  if(!D.employees.length&&!D.recipes.length&&!D.checklists.length&&!D.tempSpots.length&&!D.expirations.length)return[{level:'info',text:'Add the people who work here to get started.',page:'team'}];
  const ws=weekStart(today,D.settings.weekStart),ds=weekDates(ws);
  if(D.employees.length){
    const is=issues(D,ds),stops=is.filter(i=>i.level==='stop').map(i=>i.msg);
    if(stops.length)bad.push({text:one(stops,'# scheduling conflicts this week.'),page:'schedule'});
    const open=D.shifts.filter(s=>!s.empId&&s.date>=today&&s.date<=ds[6]).length;
    if(open)warn.push({text:open===1?'1 shift this week still needs someone.':open+' shifts this week still need someone.',page:'schedule'});
    var later=[];const ot=is.filter(i=>i.kind==='overtime').map(i=>i.msg);
    if(ot.length)later.push({text:one(ot,'# people are scheduled for overtime this week.'),page:'schedule'});
    const other=is.filter(i=>i.level==='check'&&i.kind!=='overtime').map(i=>i.msg);
    if(other.length)later.push({text:one(other,'# shifts to double-check this week.'),page:'schedule'});
  }
  if(on('temps')&&D.tempSpots.length){const out=[],miss=[];
    for(const s of D.tempSpots){const l=lastLog(D,s.id);if(!l||l.at.slice(0,10)!==today){miss.push(s.name+' has no temperature logged today.');continue}
      const st=tempStatus(s,+l.temp);if(st!=='ok')out.push(`${s.name} was ${l.temp}°F today. That is too ${st}.`)}
    if(out.length)bad.push({text:one(out,'# places are at the wrong temperature.'),page:'temps'});
    if(miss.length)warn.push({text:one(miss,'# places have no temperature logged today.'),page:'temps'})}
  if(on('expirations')){const ex=[],soon=[];
    for(const x of D.expirations){const n=daysLeft(x.due,today),e=x.empId&&D.employees.find(p=>p.id===x.empId),lab=(e?e.name+"'s ":'')+x.name;
      if(n<0)ex.push(`${lab} expired ${-n} ${n===-1?'day':'days'} ago.`);else if(n<=30)soon.push(n===0?`${lab} expires today.`:`${lab} expires in ${n} ${n===1?'day':'days'}.`)}
    if(ex.length)bad.push({text:one(ex,'# things have expired.'),page:'expirations'});
    if(soon.length)warn.push({text:one(soon,'# things expire in the next 30 days.'),page:'expirations'})}
  if(later)warn.push(...later);
  if(info&&info.backupAge!=null&&info.backupAge>=info.backupDays)warn.push({text:info.backupAge>=9999?'You have never saved a backup file.':`Your last backup was ${info.backupAge} days ago. Save a new one.`,page:'backup'});
  if(on('checklists')){const open=D.checklists.filter(l=>{const r=runFor(D,l.id,today);return!(r&&r.signedAt)}).map(l=>`The ${l.name} checklist is not finished today.`);
    if(open.length)inf.push({text:one(open,'# checklists are not finished today.'),page:'checklists'})}
  if(on('recipes')){const up=D.ingredients.filter(g=>{const c=priceChange(g);return c&&c.pct>=5&&daysLeft(today,c.date)>=-14}).map(g=>`${g.name} price went up ${Math.round(priceChange(g).pct)}%. See what it does to your menu.`);
    if(up.length)inf.push({text:one(up,'# ingredient prices went up.'),page:'recipes'})}
  if(D.employees.length){const nw=addDays(ws,7),nwe=addDays(ws,13);
    if(!D.shifts.some(s=>s.date>=nw&&s.date<=nwe))inf.push({text:'Next week has no schedule yet.',page:'schedule',week:nw});
    const np=D.employees.filter(e=>!cleanPhone(e.phone)).length;
    if(np)inf.push({text:np===1?"1 person has no phone number, so you can't text them.":np+" people have no phone number, so you can't text them.",page:'team'})}
  return[...bad.map(x=>({level:'bad',...x})),...warn.map(x=>({level:'warn',...x})),...inf.map(x=>({level:'info',...x}))];
}

const tLabel=(v,h24)=>v?(h24?v:C.fmtT(v)):'';
function pkLabel(o,v){
  if((o.type==='sel'||o.type==='combo')){const x=(o.opts||[]).find(x=>String(x.v)===String(v??''));if(x)return esc(x.l)}
  if(v===''||v==null)return'';

  if(o.type==='time')return tLabel(v,o.h24);
  if(o.type==='pay')return'$'+(+v).toFixed(2)+' <small>an hour</small>';

}
function pkShell(type,name,value,o,lead){

}

      h+=`<button type="button" class="opt ${String(x.v)===String(v)?'on':''}" data-act="pkPick" data-v="${esc(x.v)}"><span>${esc(x.l)}${x.sub?`<small>${esc(x.sub)}</small>`:''}</span>${String(x.v)===String(v)?icon('checkmark'):''}</button>`}

    for(let d=1;d<=days;d++){const ds=y+'-'+C.pad(mo)+'-'+C.pad(d);h+=`<button type="button" class="opt cell ${ds===v?'on':''} ${ds===t?'today':''}" data-act="pkPick" data-v="${ds}">${d}</button>`}

/* ---------- The Grug side: the restaurant account (assets/business.js keeps 'grug.business.v1'; this app only reads it,
   and sets which account is in use) ---------- */
const GRUG={
  read(){try{const v=JSON.parse(localStorage.getItem('grug.business.v1')||'null');return v&&typeof v==='object'&&v.shops&&typeof v.shops==='object'?v:null}catch(e){return null}},
  write(v){try{localStorage.setItem('grug.business.v1',JSON.stringify(v))}catch(e){}},
  // the shop in use: its card's name, colour and icon, read from the card text ('2~name~type~RRGGBB~icon~…', base64url)
  shop(){const s=GRUG.read();if(!s)return null;const ids=Object.keys(s.shops).filter(id=>s.shops[id]&&typeof s.shops[id].c==='string');if(!ids.length)return null;
    const id=ids.includes(s.active)?s.active:ids.sort((a,b)=>(+s.shops[b].updated||0)-(+s.shops[a].updated||0))[0],x=s.shops[id],c=x.c;
    try{const p=decodeURIComponent(escape(atob(c.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((c.length+3)%4)))).split('~');
      return{id,c,n:p[1]||'',color:'#'+(p[3]||'FF9F5A'),site:x.site||{}}}catch(e){return null}},
  player(){try{return(JSON.parse(localStorage.getItem('grug.profile.v1')||'null')||{}).name||'your player account'}catch(e){return'your player account'}},
  // opening the dashboard means using the restaurant account
  claim(){const s=GRUG.read();if(s&&GRUG.shop()&&s.mode!=='business'){s.mode='business';GRUG.write(s)}},
  toPlayer(){const s=GRUG.read();if(s){s.mode='player';GRUG.write(s)}location.href='../'}

  return s;
}
V.schedule=()=>{

  else if(wide()){

    const row=(e)=>`<tr><th scope="row">${e?esc(e.name):'Open shifts'}<small>${e?esc(roleName(e.roleId))+(L.byEmp[e.id]?' · '+C.fmtH(L.byEmp[e.id].hours)+' h':''):'Still need someone'}</small></th>${ds.map(d=>`<td class="${e&&offDay(e,d)?'off':''}" data-act="addShift" title="Add a shift" data-emp="${e?e.id:''}" data-date="${d}"${e&&offDay(e,d)?' title="Not available"':''}>${wk.filter(s=>s.date===d&&(s.empId||'')===(e?e.id:'')).sort((a,b)=>C.toMin(a.start)-C.toMin(b.start)).map(s=>chip(s,false)).join('')}</td>`).join('')}</tr>`;
    body=`<button class="btn pri noprint" data-act="addShift" style="margin-bottom:1.5rem">Add shift</button><!--box-->
      <div class="scroll"><table class="grid"><thead><tr><th scope="col">Person</th>${ds.map(d=>`<th scope="col" class="${d===t?'today':''}">${C.fmtDay(d)}${d===t?' · today':''}</th>`).join('')}</tr></thead>
      <tbody>${wk.some(s=>!s.empId)?row(null):''}${D.employees.map(row).join('')}</tbody></table></div>
`;
  }else{
    body=`<button class="btn pri block noprint" data-act="addShift" style="margin-bottom:1.4rem">Add shift</button><!--box--><div class="days noprint">${ds.map(d=>{const n=wk.filter(s=>s.date===d).length;return`<button data-act="jumpDay" data-d="${d}" class="${d===t?'on':''}" style="height:${44+Math.min(n,6)*3+(d===t?8:0)}px" aria-label="${C.fmtDay(d)}, ${n} ${n===1?'shift':'shifts'}">${C.DN[C.dow(d)][0]}<small>${C.parseYmd(d).getDate()}</small></button>`}).join('')}</div>`+ds.map(d=>{const list=wk.filter(s=>s.date===d).sort((a,b)=>C.toMin(a.start)-C.toMin(b.start));

  ${cs?`<p class="noprint" style="margin-top:2rem">${cs} <button class="quiet" ${goAttr('schedule',{type:'goal'})}>${D.settings.salesGoal>0?'Change goal':'Set a sales goal'}</button></p>`:''}

};

function fallbackCopy(t,done){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){toast("Couldn't copy. Open the message and copy it by hand.")}a.remove()}

SUB.emp=s=>{
  const ex=s.id?emp(s.id):null;if(s.id&&!ex)return`${back('team')}<p>That person is gone.</p>`;
  const e=ex||{name:'',roleId:(D.roles[0]||{}).id,wage:12,phone:'',email:'',offDays:[],notes:''};
  ui.form={input:f=>{const w=$('#newJob');if(w)w.hidden=f.roleId.value!=='__new'},save:d=>{
    const name=d.name.trim();if(!name)return'Type a name.';
    if(D.employees.some(o=>o!==ex&&o.name.trim().toLowerCase()===name.toLowerCase()))return`There is already someone called ${name}. Add a last name or initial to tell them apart.`;
    let roleId=d.roleId;const nj=(d.newJob||'').trim();
    if(roleId==='__new'&&!nj)return'Type a name for the new job.';
    if(!(+d.wage>0))return'Choose an hourly pay.';
    if(d.phone&&C.cleanPhone(d.phone).replace('+','').length<7)return'That phone number looks too short. Check it, or leave it empty.';
    const pin=(d.pin||'').trim();if(pin&&!/^\d{4,6}$/.test(pin))return'A PIN is 4 to 6 numbers. Fix it, or leave it empty.';
    const offDays=[0,1,2,3,4,5,6].filter(i=>d['off'+i]);ui.sub=null;ui.anim=true;
    change(()=>{if(roleId==='__new'){const r=D.roles.find(r=>r.name.toLowerCase()===nj.toLowerCase())||touch({id:C.uid(),name:nj});if(!D.roles.includes(r))D.roles.push(r);roleId=r.id}
      const v={name,roleId,wage:Math.max(0,+d.wage||0),phone:d.phone.trim(),email:d.email.trim(),offDays,notes:d.notes.trim(),pin};
      if(ex)touch(Object.assign(ex,v));else D.employees.push(touch({id:C.uid(),...v}))},ex?name+' saved.':firstName(name)+' is on the crew!');
  }};
  const more=e.email||e.notes||e.pin||(e.offDays||[]).length;
  return`${back('team')}<h1>${ex?esc(ex.name):'Add someone'}</h1><p class="lead">${ex?'Change their details, then save.':'Just the basics. You can add more later.'}</p>
  <form data-form><label class="f">Name<input type="text" name="name" required maxlength="60" autocomplete="off" value="${esc(e.name)}"></label>
  <div class="f"><span class="fl">Job</span>${sel('roleId',[...D.roles.map(r=>({v:r.id,l:r.name})),{v:'__new',l:'Add a new job…'}],e.roleId,{title:'Job'})}</div>
  <label class="f" id="newJob" hidden>Name of the new job<input type="text" name="newJob" maxlength="40"></label>
  <div class="f"><span class="fl">Hourly pay</span>${payp('wage',e.wage)}</div>
  <label class="f">Mobile phone<input type="tel" name="phone" maxlength="24" autocomplete="off" value="${esc(e.phone)}"><small>Used to text them their schedule.</small></label>
  <details${more?' open':''}><summary>Add more details</summary>
   <label class="f">Email<input type="email" name="email" maxlength="80" autocomplete="off" value="${esc(e.email)}"></label>
   <div class="f"><span class="fl">Days they can't work</span><div class="cks">${C.DNL.map((n,i)=>chk('off'+i,(e.offDays||[]).includes(i),n.slice(0,3))).join('')}</div></div>
   <label class="f">Time clock PIN<input type="text" name="pin" inputmode="numeric" maxlength="6" autocomplete="off" value="${esc(e.pin||'')}"><small>Optional. 4 to 6 numbers they type to clock in.</small></label>
   <label class="f">Note<textarea name="notes" maxlength="300">${esc(e.notes)}</textarea></label></details>
  <p class="ferr" id="ferr" role="alert"></p>
  <div class="actions"><button class="btn pri">Save</button>${ex?`<button type="button" class="btn danger" data-act="delEmp" data-id="${ex.id}">Remove ${esc(firstName(ex.name))}</button>`:''}</div></form>`;
};
A.delEmp=el=>{const e=emp(el.dataset.id);if(!e)return;const t=TODAY();ui.sub=null;
