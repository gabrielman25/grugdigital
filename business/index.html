/* ---------- Backup ---------- */
V.backup=()=>{
  const age=backupAge(),last=meta.lastBackupAt?new Date(meta.lastBackupAt):null;
  const where=Store.mode==='memory'?'<div class="note bad"><b>This browser is not letting the app save.</b>Anything you enter will be lost when you close this page. Save a backup file before you leave, or open the app in a normal (not private) window.</div>'
    :ui.persisted?'<p>Your browser has agreed to keep this data safe on this device.</p>'
    :'<p>Some browsers (Safari especially) clear saved data if you don\'t open the app for a while. A backup file protects you from that.</p>';
  const ok=last&&age<meta.backupDays;
  return`<h1>${sec('backup').name}</h1><p class="lead">Save everything to one file, or bring a file back in.</p>
  <div class="stonebox"><span class="stone ${ok?'':'dim'}">${mark('floppy_disk')}</span><div><b>${ok?'All saved':last?'Time for a backup':'Not backed up yet'}</b><p>${last?'Last backup: '+(age?age+' '+(age===1?'day':'days')+' ago':'today')+', on this device.':'Save one file and you can restore everything anywhere.'}</p><span class="tag ${ok?'ok':'warn'}">${ok?'OK':'Check'}</span></div></div>
  <button class="btn pri block" data-act="exportAll">Save backup file</button>
  <div class="quiets"><button class="quiet" data-act="pickImport">Restore from a file</button>${meta.preImport?'<button class="quiet" data-act="undoImport">Undo the last restore</button>':''}</div>
  <input type="file" id="imp" accept=".json,application/json" hidden>
  <div class="f"><span class="fl">Remind me to back up</span>${sel('backupDays',[3,7,14,30].map(n=>({v:n,l:'Every '+n+' days'})),meta.backupDays,{meta:'backupDays',title:'Remind me to back up'})}</div>
  <p class="mute">Everything you enter lives only in this browser, on this device. Nothing is sent anywhere. A backup file is how you keep it safe and how you move it to another device.</p>${where}`;
};
A.exportAll=()=>{const now=nowISO();download('daypart-backup-'+TODAY()+'.json',JSON.stringify(C.makeBackup(D,meta.deviceId,now),null,1),'application/json');meta.lastBackupAt=now;saveMeta();render();toast('Backup saved. Keep it somewhere safe, like email or a cloud folder.')};
A.pickImport=()=>$('#imp').click();
function readImport(file){const r=new FileReader();r.onload=()=>{let obj;try{obj=JSON.parse(r.result)}catch(e){return toast("That file can't be read. Choose a backup file saved from this app.")}
  const res=C.readBackup(obj);if(res.error)return toast(res.error);ui.incoming=res;go('backup',{type:'import'})};r.onerror=()=>toast("That file can't be read.");r.readAsText(file)}
SUB.import=()=>{
  const inc=ui.incoming;if(!inc)return`${back('backup','Backup')}<p>Choose the backup file again.</p>`;
  const p=C.previewImport(D,inc.data),names={roles:'Jobs',employees:'People',shifts:'Shifts',timeOff:'Time off',ingredients:'Ingredients',recipes:'Recipes',checklists:'Checklists',checkRuns:'Checklist records',tempSpots:'Temperature places',tempLogs:'Temperature readings',expirations:'Permits and certificates',punches:'Clock-ins'};
  const line=x=>[x.added&&x.added+' new',x.newer&&x.newer+' newer in the file',x.older&&x.older+' newer on this device',x.same&&x.same+' the same',x.onlyHere&&x.onlyHere+' only on this device'].filter(Boolean).join(', ')||'nothing';
  return`${back('backup','Backup')}<h1>Restore from a file</h1><p class="lead">This file was saved ${inc.exportedAt?'on '+C.fmtDay(C.ymd(new Date(inc.exportedAt))):'at an unknown time'}${inc.deviceId&&inc.deviceId!==meta.deviceId?' on another device':''}. Here is what's in it.</p>
  <ul class="list">${C.COLLS.filter(c=>p[c].inFile||p[c].onlyHere).map(c=>`<li><div class="row static"><span class="grow">${names[c]}: ${p[c].inFile} in the file<small>${line(p[c])}</small></span></div></li>`).join('')}</ul>
  <button class="btn pri block" data-act="doImport" data-how="merge">Merge with what's here</button><p class="mute" style="margin:.5rem 0 1.4rem;font-size:.9rem">Keeps everything on this device, adds what's new in the file, and uses the newer copy when both have the same item.</p>
  <button class="btn danger block" data-act="doImport" data-how="replace">Replace everything here</button><p class="mute" style="margin:.5rem 0 0;font-size:.9rem">Makes this device match the file exactly. Anything only on this device is removed. You can undo this here in Fossil.</p>`;
};
A.doImport=el=>{const inc=ui.incoming;if(!inc)return;meta.preImport=dataKeys();saveMeta();ui.sub=null;ui.incoming=null;
  change(()=>{const n=el.dataset.how==='merge'?C.mergeData(D,inc.data):inc.data;D=JSON.parse(JSON.stringify(n));D.settings.setupDone=true;ui.week=C.weekStart(TODAY(),D.settings.weekStart)},el.dataset.how==='merge'?'File merged in.':'Everything replaced from the file.')};
A.undoImport=()=>{if(!meta.preImport)return;const prev=meta.preImport;meta.preImport=null;saveMeta();change(()=>{D=C.migrate(prev)},'Back to how things were before the restore.')};

   <label class="f">Food should cost no more than this % of the menu price${N('foodCostPct',S.foodCostPct||30)}<small>${sec('recipes').name} uses this. Many restaurants aim for 28 to 35%.</small></label>

  <h2>Jobs</h2><ul class="list">${D.roles.map(r=>`<li><button class="row" ${goAttr('settings',{type:'job',id:r.id})}><span class="grow">${esc(r.name)}</span><span class="chev" aria-hidden="true">›</span></button></li>`).join('')}</ul>
  <div class="quiets"><button class="quiet" ${goAttr('home',{type:'profile'})}>Your profile</button><button class="quiet" ${goAttr('settings',{type:'job'})}>Add a job</button><button class="quiet" ${goAttr('settings',{type:'erase'})}>Start over</button></div>`;

function setPrice(g,price){const old=g.packPrice/(g.packSize||1),nw=price/(g.packSize||1);if(Math.abs(old-nw)>1e-9)(g.history=g.history||[]).push({date:TODAY(),unit:old});g.packPrice=price;touch(g)}
function readPrices(file){const r=new FileReader();r.onload=()=>{const rows=C.parsePriceCsv(r.result);let hit=0,miss=0;
  change(()=>{for(const x of rows){const g=D.ingredients.find(i=>i.name.trim().toLowerCase()===x.name.trim().toLowerCase());if(g&&x.price>0){if(g.packPrice!==x.price)setPrice(g,x.price);hit++}else miss++}},null);
  toast(hit?`Updated ${hit} ${hit===1?'price':'prices'}.${miss?' '+miss+(miss===1?' line':' lines')+' did not match an ingredient name.':''}`:'No ingredient names in that file matched yours.',!!hit)};r.readAsText(file)}
const UNITS=['lb','oz','kg','g','gal','qt','pt','cup','fl oz','L','each','dozen','head','bunch','case'];
SUB.ing=s=>{
  const ex=s.id?ingOf(s.id):null,g=ex||{name:'',unit:'lb',packPrice:'',packSize:'',wastePct:0};
  ui.form={save:d=>{const name=d.name.trim();if(!name)return'Type a name.';
    if(D.ingredients.some(o=>o!==ex&&o.name.trim().toLowerCase()===name.toLowerCase()))return`You already have ${name}. Open it to change the price.`;
    if(!(+d.packPrice>0))return'Type the price you pay.';if(!(+d.packSize>0))return'Type how much you get for that price.';
    ui.sub={type:'ings'};change(()=>{const v={name,unit:d.unit,packSize:+d.packSize,wastePct:Math.min(95,Math.max(0,+d.wastePct||0))};
      if(ex){const oldSize=ex.packSize;if(oldSize!==v.packSize||ex.packPrice!==+d.packPrice){const old=ex.packPrice/(oldSize||1),nw=+d.packPrice/v.packSize;if(Math.abs(old-nw)>1e-9)(ex.history=ex.history||[]).push({date:TODAY(),unit:old})}
        touch(Object.assign(ex,v,{packPrice:+d.packPrice}))}
      else D.ingredients.push(touch({id:C.uid(),...v,packPrice:+d.packPrice,history:[]}))},name+' saved.')}};
  const ch=ex&&C.priceChange(ex);
  return`${back('recipes')}<h1>${ex?esc(ex.name):'Add ingredient'}</h1><p class="lead">What you pay, and how much you get for it.</p>
  ${ch?`<div class="note ${ch.pct>0?'warn':'ok'}"><b>Price went ${ch.pct>0?'up':'down'} ${Math.abs(ch.pct).toFixed(0)}% on ${C.fmtDay(ch.date)}.</b>${ch.pct>0?'Check "What if a price goes up?" to see which dishes it touches.':''}</div>`:''}
  <form data-form><label class="f">Name<input type="text" name="name" required maxlength="60" value="${esc(g.name)}"></label>
  <label class="f">Price you pay ($)<small>Example: a 20 lb case of chicken for $64 is price 64, you get 20, measured in lb. Recipes then use lb.</small><input type="text" name="packPrice" min="0" step="0.01" inputmode="decimal" required value="${esc(g.packPrice)}"></label>
  <div class="two"><label class="f">For that you get<input type="text" name="packSize" min="0" step="any" inputmode="decimal" required value="${esc(g.packSize)}"></label>
  <div class="f"><span class="fl">Measured in</span>${sel('unit',UNITS.map(u=>({v:u,l:u})),g.unit,{title:'Measured in'})}</div></div>
  <details${g.wastePct?' open':''}><summary>More options</summary><label class="f">How much gets thrown away? (%)<input type="text" name="wastePct" min="0" max="95" step="1" inputmode="numeric" value="${g.wastePct||0}"><small>Trim, peel, bones. Lettuce might lose 20%.</small></label></details>
  <p class="ferr" id="ferr" role="alert"></p><div class="actions"><button class="btn pri">Save</button>${ex?`<button type="button" class="btn danger" data-act="delIng" data-id="${ex.id}">Remove</button>`:''}</div></form>`;

A.delIng=el=>{ui.sub={type:'ings'};change(()=>{D.ingredients=D.ingredients.filter(g=>g.id!==el.dataset.id);D.recipes.forEach(r=>{r.items=(r.items||[]).filter(it=>it.ingId!==el.dataset.id)})},'Ingredient removed from the list and from recipes.')};
function simHtml(id,pct){

const whoNow=()=>{const el=$('input[name=by]');return el?el.value:meta.lastWho||'Manager'};

 <textarea data-f="note" rows="1" placeholder="Add a note (optional)" maxlength="240" aria-label="Note for step ${i+1}">${esc(x.note)}</textarea></div>
 <button type="button" class="iconbtn" data-act="stepDel" data-id="${x.id}" aria-label="Remove step ${i+1}">${icon('trash_can')}</button></li>`;
SUB.list=s=>{
  const ex=s.id?listOf(s.id):null,key=s.id||'new';
  if(!ui.edit||ui.edit.key!==key)ui.edit={key,name:ex?ex.name:'',roleId:ex?ex.roleId||'':'',items:ex?ex.items.map(x=>({...x})):[newStep()]};
  const E=ui.edit;
  ui.form={save:d=>{const items=readSteps().map(x=>({id:x.id,title:x.title.trim(),note:x.note.trim()})).filter(x=>x.title);const name=d.name.trim();
    if(!name)return'Type a name, like Opening.';if(!items.length)return'Add at least one thing to do.';
    ui.sub=null;ui.edit=null;ui.anim=true;change(()=>{const v={name,items,roleId:d.roleId||''};if(ex)touch(Object.assign(ex,v));else D.checklists.push(touch({id:C.uid(),...v}))},name+' saved.')}};

/* ================= Mammoth: temperature log ================= */
const spotOf=id=>D.tempSpots.find(s=>s.id===id);
const ST={ok:['ok','OK'],warm:['bad','Too warm'],cold:['bad','Too cold']};
const rangeText=s=>{const lo=s.min==null||s.min===''?null:+s.min,hi=s.max==null||s.max===''?null:+s.max;return lo!=null&&hi!=null?`${lo} to ${hi}°F`:hi!=null?`${hi}°F or colder`:lo!=null?`${lo}°F or hotter`:'any temperature'};
function readingCard(s,l){
  const n=v=>v==null||v===''?null:+v,lo=n(s.min),hi=n(s.max),v=+l.temp;let a,b;
  if(lo!=null&&hi!=null){const w=Math.max(4,hi-lo);a=lo-w;b=hi+w}else if(hi!=null){a=hi-20;b=hi+20}else if(lo!=null){a=lo-20;b=lo+20}else{a=v-20;b=v+20}
  a=Math.min(a,v-2);b=Math.max(b,v+2);const pos=x=>Math.max(0,Math.min(100,(x-a)/(b-a)*100));
  const L=lo!=null?pos(lo):0,R=hi!=null?pos(hi):100,st=C.tempStatus(s,v);
  return`<div class="reading"><p class="tlab">${esc(s.name)}</p><p class="read ${st==='ok'?'':'bad'}">${l.temp}<sup>°F</sup></p>
  <div class="gauge" aria-hidden="true"><span class="rng" style="left:${L}%;width:${R-L}%"></span><span class="nd" style="left:${pos(v)}%"></span></div>
  <div class="ticks" aria-hidden="true">${[0,1,2,3].map(i=>`<span>${Math.round(a+(b-a)*i/3)}</span>`).join('')}</div>
  <p>Range ${rangeText(s)} · ${esc(l.by)}, ${fmtAt(l.at)}</p><p style="margin:0"><span class="tag ${st==='ok'?'ok':'bad'}">${st==='ok'?'In range':'Too '+st}</span></p></div>`}
V.temps=()=>{const t=TODAY();
  const withLog=D.tempSpots.map(s=>({s,l:C.lastLog(D,s.id)})).filter(x=>x.l);
  const off=withLog.find(x=>x.l.at.slice(0,10)===t&&C.tempStatus(x.s,+x.l.temp)!=='ok'),feat=off||withLog.sort((p,q)=>p.l.at<q.l.at?1:-1)[0];
  return`<h1>${sec('temps').name}</h1><p class="lead">Write down cooler, freezer and hot food temperatures. It warns you when one is off.</p>
  ${D.tempSpots.length?`<button class="btn pri block" ${goAttr('temps',{type:'temp'})} style="margin-bottom:1.5rem">Log a temperature</button><!--box-->${feat?readingCard(feat.s,feat.l):''}
  <ul class="list">${D.tempSpots.map(s=>{const l=C.lastLog(D,s.id),today=l&&l.at.slice(0,10)===t,st=l?ST[C.tempStatus(s,+l.temp)]:null;
    return`<li><button class="row" ${goAttr('temps',{type:'temp',spotId:s.id})}><span class="grow">${esc(s.name)}<small>${l?`${fmtAt(l.at)} · ${esc(l.by)}`:'Nothing logged yet'} · should be ${rangeText(s)}</small></span>${l?`<b class="rd">${l.temp}°F</b>`:''}${!today?'<span class="tag warn">Not checked today</span>':`<span class="tag ${st[0]}">${st[1]}</span>`}<span class="chev" aria-hidden="true">›</span></button></li>`}).join('')}</ul>
  <div class="quiets"><button class="quiet" ${goAttr('temps',{type:'tempLog'})}>See the full log</button><button class="quiet" ${goAttr('temps',{type:'spot'})}>Add a place</button></div>`
  :emptyBox('Add the places you check, like the walk-in cooler. Then log a temperature in two taps.',`<button class="btn pri" ${goAttr('temps',{type:'spot'})}>Add a place</button>`,'temps')}`;
};
SUB.temp=s=>{
  const live=f=>{const sp=spotOf(f.spotId.value),v=f.temp.value,box=$('#live'),nt=$('#fix');if(!sp||v===''||isNaN(+v)){box.innerHTML=sp?`<p class="mute">Should be ${rangeText(sp)}.</p>`:'';nt.hidden=true;return}
    const st=C.tempStatus(sp,+v);nt.hidden=st==='ok';
    box.innerHTML=st==='ok'?`<div class="note ok"><b>${v}°F is OK.</b>${esc(sp.name)} should be ${rangeText(sp)}.</div>`:`<div class="note bad"><b>${v}°F is too ${st}.</b>${esc(sp.name)} should be ${rangeText(sp)}. Fix it, then write down what you did.</div>`};
  ui.form={input:live,save:d=>{const sp=spotOf(d.spotId);if(!sp)return'Choose a place.';if(d.temp===''||isNaN(+d.temp))return'Type the temperature.';
    const st=C.tempStatus(sp,+d.temp);if(st!=='ok'&&!d.note.trim())return'Write down what you did about it.';
    ui.sub=null;ui.anim=true;change(()=>{D.tempLogs.push(touch({id:C.uid(),spotId:sp.id,temp:+d.temp,at:stampNow(),by:d.by,note:d.note.trim()}))},`${sp.name}: ${d.temp}°F logged.`)}};

  return`${back('temps')}<h1>Log a temperature</h1><p class="lead">Read the thermometer and type the number.</p>
  <form data-form><div class="f"><span class="fl">Place</span>${sel('spotId',D.tempSpots.map(p=>({v:p.id,l:p.name,sub:'Should be '+rangeText(p)})),s.spotId||(D.tempSpots[0]||{}).id,{title:'Place'})}</div>

};

  <div class="quiets">${Object.keys(W).length?'<button class="quiet" data-act="exportWorked">Save hours worked for payroll</button>':''}<button class="quiet" ${goAttr('clock',{type:'punchEdit'})}>Add a missed clock-in</button></div>`;
};
A.exportWorked=()=>{const ds=C.weekDates(ui.week);download('hours-worked-week-of-'+ds[0]+'.csv',C.csv(C.workedRows(D,ds)),'text/csv');toast('Saved.')};
SUB.punchEdit=s=>{
  const ex=s.id?D.punches.find(p=>p.id===s.id):null,p=ex||{empId:'',in:TODAY()+'T09:00',out:TODAY()+'T17:00',edits:[]};
  ui.form={save:d=>{if(!ex&&!d.empId)return'Choose a person.';if(!d.inD||!d.inT)return'Choose when they clocked in.';
    const IN=d.inD+'T'+d.inT,OUT=d.stillIn?null:(d.outD&&d.outT?d.outD+'T'+d.outT:null);
    if(!d.stillIn&&!OUT)return'Choose when they clocked out, or turn on "Still working".';if(OUT&&OUT<=IN)return'Clock-out is before clock-in. Check the times.';
    if(!d.why.trim())return'Write a short reason for the change.';
    const ed={at:stampNow(),by:D.settings.profileName||'Manager',was:ex?C.fmtT(ex.in.slice(11,16))+'–'+(ex.out?C.fmtT(ex.out.slice(11,16)):'still in'):'added by hand',why:d.why.trim()};
    ui.sub={type:'hours'};ui.anim=true;change(()=>{if(ex){ex.in=IN;ex.out=OUT;(ex.edits=ex.edits||[]).push(ed);touch(ex)}else D.punches.push(touch({id:C.uid(),empId:d.empId,in:IN,out:OUT,edits:[ed]}))},'Saved.')}};
  const o=p.out||(p.in.slice(0,10)+'T17:00');
  return`${back('clock')}<h1>${ex?'Fix a clock-in':'Add a missed clock-in'}</h1><p class="lead">Every change is kept on record with your name and reason.</p>
  <form data-form>${ex?`<p><strong>${esc((emp(ex.empId)||{}).name||'Someone')}</strong></p>`:`<div class="f"><span class="fl">Who</span>${sel('empId',D.employees.map(e=>({v:e.id,l:e.name})),'',{ph:'Choose a person',title:'Who'})}</div>`}
  <div class="f"><span class="fl">Clocked in</span><div class="two tight">${datep('inD',p.in.slice(0,10),{title:'Clocked in on'})}${timep('inT',p.in.slice(11,16),{title:'Clocked in at'})}</div></div>
  <div class="f"><span class="fl">Clocked out</span><div class="two tight">${datep('outD',o.slice(0,10),{title:'Clocked out on'})}${timep('outT',o.slice(11,16),{title:'Clocked out at'})}</div><div class="cks" style="margin-top:.6rem">${chk('stillIn',ex&&!ex.out,'Still working')}</div></div>
  <label class="f">Why the change<input type="text" name="why" maxlength="120" placeholder="Forgot to clock out"></label>
  ${(p.edits||[]).length?`<div class="note soft"><b>Earlier changes</b>${p.edits.map(e=>`${fmtAt(e.at)} by ${esc(e.by)}: was ${esc(e.was)}. ${esc(e.why)}`).join('<br>')}</div>`:''}
  <p class="ferr" id="ferr" role="alert"></p><div class="actions"><button class="btn pri">Save</button>${ex?`<button type="button" class="btn danger" data-act="delPunch" data-id="${ex.id}">Remove</button>`:''}</div></form>`;
};
A.delPunch=el=>{ui.sub={type:'hours'};change(()=>{D.punches=D.punches.filter(p=>p.id!==el.dataset.id)},'Removed.')};

/* ---------- Events ---------- */
A.nav=el=>{if(el.dataset.page==='schedule'&&ui.page==='schedule'&&!ui.sub)ui.week=C.weekStart(TODAY(),D.settings.weekStart);go(el.dataset.page)};
A.go=el=>go(el.dataset.page,el.dataset.sub?JSON.parse(el.dataset.sub):null);
A.undo=()=>{const s=undoStack.pop();if(!s)return;const o=JSON.parse(s);D=o;save();ui.sub=null;render();toast('Undone.')};
document.addEventListener('click',e=>{
  if(POP&&!POP.box.contains(e.target)&&!(POP.pk&&POP.pk.contains(e.target)))closePop();
  const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f)f(el,e)});
document.addEventListener('keydown',e=>{
  if(POP){if(e.key==='Escape'){const b=POP.pk.querySelector('.pkb,.me,[data-combo]');closePop();if(b)b.focus();e.preventDefault();return}
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){const os=[...POP.box.querySelectorAll('.opt')];if(os.length){const i=os.indexOf(document.activeElement);const n=e.key==='ArrowDown'?(i+1)%os.length:(i<=0?os.length-1:i-1);os[n].focus();e.preventDefault();return}}
    if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('centsin')){e.preventDefault();A.centsUse();return}
    if(e.key==='Enter'&&e.target.closest&&e.target.closest('.free')){e.preventDefault();A.pkFree(e.target.closest('.free').querySelector('button'));return}}
  const g=e.target.closest&&e.target.closest('[data-grab]');if(g&&(e.key==='ArrowUp'||e.key==='ArrowDown')){const li=g.closest('li');const to=e.key==='ArrowUp'?li.previousElementSibling:li.nextElementSibling;if(to){e.key==='ArrowUp'?to.before(li):to.after(li);g.focus();sorted(li.parentNode)}e.preventDefault();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button]')){e.preventDefault();e.target.click()}});
document.addEventListener('submit',e=>{const f=e.target;if(!f.matches('[data-form]'))return;e.preventDefault();
  const d=Object.fromEntries(new FormData(f));const fn=!D.settings.setupDone?setupSave:ui.form&&ui.form.save;if(!fn)return;
  const err=fn(d,f);const box=$('#ferr');if(err&&box){box.textContent=err;box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');box.scrollIntoView&&box.scrollIntoView({block:'center',behavior:'smooth'})}});
document.addEventListener('focusin',e=>{const c=e.target.closest&&e.target.closest('[data-combo]');if(c&&!(POP&&POP.pk===c.closest('.pk')))A.pkOpen(c)});
document.addEventListener('input',e=>{const t=e.target;
  if(t.classList&&t.classList.contains('centsin')){t.value=t.value.replace(/\D/g,'').slice(0,2);const p=POP&&POP.box.querySelector('.cprev');if(p)p.textContent=p.textContent.split('.')[0]+'.'+(t.value?t.value.padStart(2,'0'):'00')}
  if(t.dataset&&t.dataset.combo){if(POP&&POP.pk===t.closest('.pk'))refreshPop();else A.pkOpen(t)}
  if(t.tagName==='TEXTAREA'&&t.dataset.f==='note'){t.style.height='auto';t.style.height=t.scrollHeight+'px'}
  if(ui.form&&ui.form.input&&t.form)ui.form.input(t.form)});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='imp'&&t.files&&t.files[0]){readImport(t.files[0]);t.value=''}
  if(t.id==='pic'&&t.files&&t.files[0]){readPic(t.files[0]);t.value=''}
  if(t.id==='priceFile'&&t.files&&t.files[0]){readPrices(t.files[0]);t.value=''}
  if(t.name==='by'){meta.lastWho=t.value;saveMeta()}
  if(t.name==='tpl'&&t.value!=='')applyTpl(t.value);
  if(t.dataset&&t.dataset.meta){meta[t.dataset.meta]=+t.value;saveMeta();toast('Saved.')}});
addEventListener('resize',()=>{if(POP&&!POP.box.classList.contains('sheet'))closePop()});
addEventListener('scroll',()=>{if(POP&&!POP.box.classList.contains('sheet')&&!(POP.pk.querySelector('[data-combo]')===document.activeElement))placePop()},{passive:true});
/* Drag to reorder (checklist steps): works with mouse, pen and touch. */
let DRAG=null;
const natTop=li=>li.getBoundingClientRect().top-(DRAG&&DRAG.li===li?DRAG.dy:0);
function sorted(list){if(list.classList.contains('steps-ed')){renumberSteps();if(ui.edit)ui.edit.items=readSteps()}}
document.addEventListener('pointerdown',e=>{const g=e.target.closest&&e.target.closest('[data-grab]');if(!g)return;const li=g.closest('li');e.preventDefault();
  try{g.setPointerCapture(e.pointerId)}catch(x){}li.classList.remove('new','bump');li.style.animation='none';DRAG={li,g,y0:e.clientY,dy:0};li.classList.add('dragging');li.parentNode.classList.add('sorting')});
function dragMove(e){if(!DRAG)return;const li=DRAG.li;DRAG.cy=e.clientY;DRAG.dy=e.clientY-DRAG.y0;li.style.transform=`translateY(${DRAG.dy}px)`;
  const mid=li.getBoundingClientRect().top+li.offsetHeight/2,prev=li.previousElementSibling,next=li.nextElementSibling;
  const move=(fn,ref)=>{const before=natTop(li);fn();const after=li.getBoundingClientRect().top-DRAG.dy;DRAG.y0+=after-before;DRAG.dy=e.clientY-DRAG.y0;li.style.transform=`translateY(${DRAG.dy}px)`;ref.classList.remove('bump');void ref.offsetWidth;ref.classList.add('bump')};
  if(next&&mid>next.getBoundingClientRect().top+next.offsetHeight/2)move(()=>next.after(li),next);
  else if(prev&&mid<prev.getBoundingClientRect().top+prev.offsetHeight/2)move(()=>prev.before(li),prev)}
document.addEventListener('pointermove',dragMove);
/* Scroll the page while dragging near the top or bottom edge. */
setInterval(()=>{if(!DRAG||DRAG.cy==null||Math.abs(DRAG.dy)<12)return;const y=DRAG.cy,edge=90;let d=0;if(y<edge)d=-Math.ceil((edge-y)/6);else if(y>innerHeight-edge)d=Math.ceil((y-innerHeight+edge)/6);
  if(d){const before=scrollY;scrollBy(0,d);const moved=scrollY-before;if(moved){DRAG.y0-=moved;dragMove({clientY:y})}}},16);
const endDrag=()=>{if(!DRAG)return;const li=DRAG.li;li.style.transform='';li.style.animation='';li.classList.remove('dragging');li.parentNode.classList.remove('sorting');sorted(li.parentNode);DRAG=null};
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
/* Drag a shift to another box on the week grid. */
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.chip');if(c&&e.dataTransfer){e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const td=e.target.closest&&e.target.closest('.grid td');if(td){e.preventDefault();document.querySelectorAll('td.over').forEach(x=>x.classList.remove('over'));td.classList.add('over')}});
document.addEventListener('drop',e=>{const td=e.target.closest&&e.target.closest('.grid td');if(!td)return;e.preventDefault();
  const s=D.shifts.find(x=>x.id===e.dataTransfer.getData('text/plain'));if(!s)return;
  const to={...s,empId:td.dataset.emp||null,date:td.dataset.date};if(to.empId===s.empId&&to.date===s.date)return render();
  const dbl=C.shiftProblems(D,to).find(i=>i.kind==='double');if(dbl){render();return toast(dbl.msg+' '+dbl.fix)}
  change(()=>{const was=emp(s.empId),now=emp(to.empId);if(now&&(!was||s.roleId===was.roleId))s.roleId=now.roleId;s.empId=to.empId;s.date=to.date;touch(s)},'Shift moved.')});
if(window.matchMedia){const mq=matchMedia('(min-width:900px)');const h=()=>{if(D&&ui.page==='schedule'&&!ui.sub&&D.settings.setupDone)render()};mq.addEventListener?mq.addEventListener('change',h):mq.addListener&&mq.addListener(h)}

/* ---------- Start ---------- */
(async()=>{
  await Store.init();
  let got={};try{got=await Store.getAll(['meta','schemaVersion','settings',...C.COLLS])}catch(e){}
  meta=Object.assign({deviceId:C.uid(),firstUseAt:nowISO(),lastBackupAt:null,backupDays:7,preImport:null},got.meta||{});
  if(got.settings){try{D=C.migrate({schemaVersion:got.schemaVersion,settings:got.settings,...Object.fromEntries(C.COLLS.map(c=>[c,got[c]||[]]))})}catch(e){D=null;window.__loadError=e.message}}
  if(!D){D=C.stampAll(C.blank(),meta.deviceId,nowISO())}
  D.settings.tools={recipes:true,checklists:true,temps:true,expirations:true,clock:true};
  GRUG.claim();gdock();{const sh=GRUG.shop();if(sh&&sh.n&&D.settings.name!==sh.n){D.settings.name=sh.n;touch(D.settings);save()}}
  if(got.settings&&(+got.schemaVersion||0)<C.SCHEMA)save();
  if(!got.meta)saveMeta();
  ui.week=C.weekStart(TODAY(),D.settings.weekStart);
  GD.init({accent:'#6FB31C',pattern:undefined,cursors:true,tips:true,fx:true,noContextMenu:true,brand:true});GD.setUISize(meta.uiSize||'normal');curBrand='daypart';
  try{history.replaceState({page:'home',sub:null},'')}catch(e){}
  render();
  if(window.__loadError)toast('Saved data could not be opened: '+window.__loadError);
  if(Store.mode==='memory')toast("This browser isn't letting the app save. Open Fossil to save a backup file.");
  try{if(navigator.storage&&navigator.storage.persist){ui.persisted=await navigator.storage.persisted()||await navigator.storage.persist()}}catch(e){}
  window.__ready=true;
})();
})();
</script>
