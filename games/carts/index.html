:root{
  --stage:#0E0E11; --panel:#17171A; --glass:rgba(23,23,26,.72); --glass2:rgba(255,255,255,.14);
  --ink:#1E1B16; --ink2:#46434B; --mut:#75727C; --white:#FFFFFF; --bg:#FFFFFF; --card:#EBEDF2; --card2:#DCDEE5;
  --games:#7EE081; --coin:#FACC15; --coin-lo:#CA8A04; --pearl:#7c3aed; --pearl-lo:#5b21b6; --heart:#f43f5e;
  --font:Fredoka, ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--stage);color:var(--white);font:500 16px/1.35 var(--font);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--games);outline-offset:2px}
svg{display:block}

#feed{position:fixed;inset:0;overflow:hidden;background:var(--panel)}
.slide{position:absolute;inset:0;will-change:transform}
.slide .poster{position:absolute;inset:0;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;font-size:34px;font-weight:600;color:var(--ink)}
.slide .poster i{width:34px;height:34px;border-radius:50%;border:4px solid rgba(30,27,22,.18);border-top-color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.slide .poster i{animation:spin .8s linear infinite}}
@keyframes spin{to{transform:rotate(360deg)}}
.slide iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;opacity:0;transition:opacity .15s;pointer-events:none}
.slide.ready iframe{opacity:1}
#feed.base .slide.cur iframe{pointer-events:auto}
#touch{position:absolute;inset:0;z-index:2;touch-action:none;cursor:pointer}
#feed.base #touch{pointer-events:none}

/* the system UI: always on screen */
.round{width:50px;height:50px;border-radius:50%;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;flex:none}
.round svg{width:24px;height:24px}
.lbl{font-size:13px;font-weight:600;background:var(--glass);border-radius:999px;padding:2px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}

.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);pointer-events:auto}
.tabs a,.tabs span{min-height:40px;padding:0 17px;border-radius:999px;display:flex;align-items:center;font-size:16px;font-weight:600;color:#C9C9CF;text-decoration:none}
.tabs span{background:var(--games);color:var(--ink)}
#allBtn{position:absolute;right:calc(var(--sr) + 12px);top:calc(var(--st) + 8px);pointer-events:auto;width:46px;height:46px}
.rail{position:absolute;z-index:3;display:flex;flex-direction:column;align-items:center;gap:12px;bottom:calc(var(--sb) + var(--railB,156px))}
#rail{right:calc(var(--sr) + 10px)}
#left{left:calc(var(--sl) + 10px)}
.rail .item{display:flex;flex-direction:column;align-items:center;gap:4px}

#favBtn.pop{animation:pop .35s ease-out}

/* the shop and its button: chunky sticker style (vector icon pack), everything else keeps the Grug look */
:root{--rb-ink:#17191F;--rb-blue:#3FA9FF;--rb-blue2:#1B6FE0;--rb-green:#5BE36A;--rb-green2:#22B238;--rb-purple:#C27BFF;--rb-purple2:#8034E8;--rb-orange:#FFB23F;--rb-orange2:#F07A12}
.rb-s{color:#fff;-webkit-text-stroke:5px var(--rb-ink);paint-order:stroke fill;font-weight:700;letter-spacing:.01em}
#shopBtn{position:relative;width:74px;height:78px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;background:none;padding:0;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.28));animation:rbIdle 5s ease-in-out infinite;transform-origin:50% 80%}
#shopBtn img{width:64px;height:64px;display:block;pointer-events:none}
#shopBtn .rb-s{margin-top:-14px;font-size:19px;line-height:1}
#shopBtn:active{transform:scale(.9)}
@keyframes rbIdle{0%,84%,100%{transform:none}88%{transform:rotate(-9deg) scale(1.08)}92%{transform:rotate(8deg) scale(1.08)}96%{transform:rotate(-4deg)}}
.rb-coins{display:flex;align-items:center;gap:4px;min-height:26px;padding:0 9px 0 4px;border-radius:999px;background:#fff;border:3px solid var(--rb-ink);font-size:15px;font-weight:700;color:var(--rb-ink);font-variant-numeric:tabular-nums}
.rb-coins img{width:22px;height:22px;margin:-4px 0}
#coinLbl.bump{animation:pop .35s ease-out}
.rb-shop{position:relative;width:calc(100% - 20px);max-width:620px;max-height:88%;display:flex;flex-direction:column;margin-bottom:10px;
  background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.35);animation:rbIn .28s cubic-bezier(.2,1.4,.4,1);color:#1f1f24}
@keyframes rbIn{0%{transform:scale(.8) translateY(30px);opacity:0}100%{transform:none;opacity:1}}
@media (orientation:landscape){.rb-shop{max-height:94%;margin-bottom:0}}
/* a solid red bar on top, like a game shop */
.rb-top{display:flex;align-items:center;gap:10px;padding:14px 12px 14px 22px;background:#EE2A2A}
.rb-title{flex:1;min-width:0;display:flex;flex-direction:column}
.rb-title .rb-h{font-size:26px;font-weight:700;color:#fff;letter-spacing:.02em;text-transform:uppercase;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-title small{font-size:14px;font-weight:600;color:#ffe0e0}
.rb-x{width:46px;height:46px;border-radius:12px;background:none;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.rb-x svg{width:24px;height:24px}
.rb-x:active{transform:scale(.9)}
.rb-tabs{display:flex;gap:6px;padding:0 12px 12px;background:#EE2A2A}
.rb-tabs button{flex:1;min-height:42px;border-radius:999px;background:rgba(0,0,0,.2);color:#fff;font:700 16px Fredoka,system-ui,sans-serif;letter-spacing:.02em}
.rb-tabs button[aria-selected=true]{background:#141416;color:#FFC93C}
.rb-tabs button:active{transform:scale(.97)}
.rb-tabs b{display:inline-block;min-width:22px;margin-left:6px;padding:0 6px;border-radius:999px;background:#FFC93C;color:#141416;font-size:13px;line-height:20px}
.rb-card.none{--k1:#B9BCC8;--k2:#8A8E9C}
.rb-inv-go{align-self:center}
.rb-body{overflow:auto;padding:14px 14px 16px;display:flex;flex-direction:column;gap:12px;touch-action:pan-y;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#cfcfd6 transparent}
.rb-wallet{display:flex;gap:8px;flex-wrap:wrap}
.rb-pill{display:flex;align-items:center;gap:6px;min-height:42px;padding:0 14px 0 6px;border-radius:999px;background:#F1F1F4;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.rb-pill img{width:30px;height:30px}
.rb-pill small{font-size:12px;font-weight:700;color:#7a7a86;text-transform:uppercase;letter-spacing:.04em}
/* the black pill button with gold writing */
.rb-btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;background:#141416;color:#FFC93C;
  font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 rgba(0,0,0,.25);text-decoration:none;white-space:nowrap}
.rb-btn:active{transform:translateY(2px);box-shadow:none}
.rb-btn img{width:24px;height:24px}
.rb-btn.off{opacity:.55}
.rb-btn.confirm{background:#FFC93C;color:#141416;animation:rbPulse .6s ease-in-out infinite alternate}
@keyframes rbPulse{to{transform:scale(1.05)}}
.rb-btn.done{background:rgba(0,0,0,.28);color:#fff}
.rb-btn.eqd{background:#141416;color:#4ADE80}
.rb-home{min-height:58px;border-radius:18px;font-size:20px;background:#141416;color:#FFC93C;justify-content:flex-start;padding:0 18px}
.rb-home img{width:40px;height:40px}
.rb-sec{font-size:15px;font-weight:700;color:#55555f;text-transform:uppercase;letter-spacing:.06em;margin:4px 2px -4px}
.rb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px}
/* cards: a strong colour, a soft pattern behind, the item big in the middle, the price pill at the bottom */
.rb-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 10px 12px;border-radius:18px;overflow:hidden;
  background-color:var(--k1);background-image:var(--pat),linear-gradient(160deg,var(--k1),var(--k2));background-size:72px 72px,100% 100%;background-blend-mode:normal;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),0 2px 0 rgba(0,0,0,.06);color:#fff}
.rb-card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.35),transparent 62%);pointer-events:none}
.rb-card.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:12px;padding:14px}
.rb-card.wide .rb-art{width:96px;height:88px;flex:none}
.rb-card.wide .rb-info{align-items:flex-start;text-align:left}
.rb-card.own{cursor:pointer}
.rb-card.eq{box-shadow:inset 0 0 0 4px #4ADE80,inset 0 -4px 0 rgba(0,0,0,.12)}
.rb-art{position:relative;width:100%;height:80px;display:flex;align-items:center;justify-content:center}
.rb-art > img{width:56px;height:56px;filter:drop-shadow(0 5px 3px rgba(0,0,0,.25))}
.rb-tag{position:absolute;left:8px;top:8px;z-index:1;padding:2px 9px;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;font-size:12px;font-weight:700}
.rb-new{position:absolute;right:8px;top:8px;z-index:1;padding:2px 8px;border-radius:999px;background:#EE2A2A;color:#fff;font-size:12px;font-weight:700}
.rb-info{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.rb-info b{font-size:16px;font-weight:700;line-height:1.1;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.rb-info span{font-size:12px;font-weight:500;line-height:1.25;opacity:.92;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.rb-card.wide .rb-info b{font-size:22px}
.rb-card.wide .rb-info span{font-size:14px}
.rb-info .rb-btn{width:100%;margin-top:auto}
.rb-card.wide .rb-info .rb-btn{width:auto;margin-top:4px}
.rb-sw{position:absolute;width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.9);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.rb-art .rb-sw + img{width:32px;height:32px;margin:26px 0 0 26px}
/* opening a crate */
.rb-open{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(10,10,14,.78)}
.rb-open[hidden]{display:none}
.rb-open .rb-h{font-size:24px;font-weight:700;color:#fff}
.rb-reel{position:relative;width:min(330px,88%);height:110px;overflow:hidden;border-radius:16px;background:#fff}
.rb-reel::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:#EE2A2A;box-shadow:0 0 8px #EE2A2A}
.rb-strip{position:absolute;left:0;top:6px;display:flex;gap:8px;will-change:transform}
.rb-cell{width:90px;height:90px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;position:relative;background:var(--k,#e5e7eb)}
.rb-cell img{width:46px;height:46px;position:relative}
.rb-cell i{position:absolute;width:54px;height:54px;border-radius:50%;border:3px solid #fff}
.rb-got{display:flex;flex-direction:column;align-items:center;gap:8px;animation:rbIn .3s cubic-bezier(.2,1.5,.4,1)}
.rb-got .rb-h{font-size:26px}
.rb-got small{font-size:15px;font-weight:700;color:#FFC93C}
.rb-3d{position:relative;width:72px;height:72px;background-size:864px 72px;background-repeat:no-repeat;animation:rbSpin3d 2s steps(12) infinite,rbFloat 2.6s ease-in-out infinite;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
.rb-card.wide .rb-3d{width:88px;height:88px;background-size:1056px 88px;animation-name:rbSpin3dW,rbFloat}
@keyframes rbSpin3d{from{background-position-x:0}to{background-position-x:-864px}}
@keyframes rbSpin3dW{from{background-position-x:0}to{background-position-x:-1056px}}
@keyframes rbFloat{50%{transform:translateY(-6px)}}
.rb-note{font-size:13px;font-weight:600;color:#7a7a86;text-align:center;padding:2px 8px}
.rb-empty{padding:22px 10px;text-align:center;color:#7a7a86;font-size:16px;font-weight:600}
@media (prefers-reduced-motion:reduce){#shopBtn,.rb-btn.confirm,.rb-shop,.rb-3d{animation:none}}
#coinLbl.bump{animation:pop .35s ease-out}

#cap{position:absolute;z-index:3;left:calc(var(--sl) + 10px);right:calc(var(--sr) + 72px);bottom:calc(var(--sb) + 12px);max-width:460px;padding:14px 16px 15px;border-radius:22px;
  background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);pointer-events:none;display:flex;flex-direction:column;gap:6px;
  transition:opacity .25s, transform .25s}
#feed.touched #cap,#feed.base #cap{opacity:0;transform:translateY(16px)}
/* in a home base the game's panel fills the bottom: the rails move up beside the 3D view */
@media (orientation:portrait){#feed.base .rail{bottom:auto;top:calc(var(--st) + 70px)}}
#feed.base .round,#feed.base .lbl,#feed.base .tabs{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(23,23,26,.82)}
#cap .chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 11px;border-radius:999px;font-size:14px;font-weight:600;color:var(--white);background:var(--c,#555)}
.chip.dim{background:var(--glass2);color:#E6E6EA}
.chip svg{width:16px;height:16px}
#cap h1{margin:0;font-size:26px;font-weight:600;line-height:1.08}
#cap p{margin:0;font-size:16px;color:#D9D9DE}
#cap .by{font-size:14px;color:#A4A4AD}
#cap .keys{display:none;font-size:14px;color:#A4A4AD}
@media (hover:hover) and (pointer:fine){#cap .keys{display:block}}

/* landscape and desktop: the game fills the screen; rails sit at the middle of each side */
@media (orientation:landscape){
  .rail{bottom:auto;top:50%;transform:translateY(-50%)}
  #cap{left:calc(var(--sl) + 82px);right:auto;width:min(420px,calc(100% - 180px))}
}
@media (orientation:landscape) and (max-height:480px){
  .rail{gap:8px} .round{width:44px;height:44px} #shopBtn{transform:scale(.86)}
  #cap{padding:10px 14px} #cap h1{font-size:21px} #cap p{font-size:14px}
  .tabs a,.tabs span{min-height:34px}
}

/* idle nudge */
#nudge{position:absolute;z-index:4;inset:0;pointer-events:none;opacity:0}
#nudge .finger{position:absolute;left:50%;width:46px;height:46px;margin-left:-23px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 0 0 8px rgba(255,255,255,.28)}
#nudge .say{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:var(--glass);font-size:17px;font-weight:600}
#nudge .say svg{width:20px;height:20px}

/* sheets: white panels, off-white cards, the game blurred behind */
.veil{position:absolute;inset:0;z-index:6;background:rgba(14,14,17,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;
  padding:12px calc(var(--sr) + 12px) calc(var(--sb) + 12px) calc(var(--sl) + 12px)}
.veil[hidden]{display:none}
/* the shop: everything behind it blurred (filter on the layers themselves, so it works over the game canvas too), and the shop in the middle */
#feed.shopping > :not(#shopVeil){filter:blur(12px) brightness(.92);transition:filter .2s}
#shopVeil{align-items:center;background:rgba(14,14,17,.3)}
#shopVeil .rb-shop{margin-bottom:0}
.sheet{width:100%;max-width:560px;max-height:86%;overflow:auto;scrollbar-width:none;background:var(--bg);color:var(--ink);border-radius:28px;padding:20px 16px 18px;display:flex;flex-direction:column;gap:12px;touch-action:pan-y;overscroll-behavior:contain}
.sheet::-webkit-scrollbar{display:none}
@media (orientation:landscape){.veil{align-items:center}.sheet{max-height:94%}}
.head{display:flex;align-items:center;gap:12px;padding:0 4px}
.head h2{margin:0;font-size:28px;font-weight:600;flex:1;min-width:0}
.head small{display:block;font-size:15px;font-weight:500;color:var(--mut)}

.pill{display:flex;align-items:center;gap:7px;min-height:44px;padding:0 14px;border-radius:999px;background:var(--card);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.pill i.p{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f5f3ff,#c4b5fd 45%,#7c3aed);flex:none}
.pill small{font-size:13px;font-weight:600;color:var(--mut)}
.pill.get{background:var(--pearl);color:#fff;box-shadow:0 4px 0 var(--pearl-lo);text-decoration:none}
.home{display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;border-radius:999px;background:var(--c);color:#fff;font-size:20px;font-weight:600;box-shadow:0 5px 0 var(--lo)}
.home svg{width:24px;height:24px}
.sec{font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:6px 6px 0}
.item-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:20px;background:var(--card)}
.item-card .tile{width:50px;height:50px;border-radius:15px}
.item-card .txt{flex:1;min-width:0}
.item-card b{display:block;font-size:19px;font-weight:600;line-height:1.15}
.item-card span{display:block;font-size:14px;color:var(--ink2);line-height:1.25}
.item-card .lv{font-size:13px;color:var(--mut);margin-top:2px}
.buy{min-width:92px;min-height:46px;padding:0 12px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:17px;font-weight:600;flex:none;font-variant-numeric:tabular-nums}
.buy.coins{background:var(--coin);color:var(--ink);box-shadow:0 4px 0 var(--coin-lo)}
.buy.pearls{background:var(--pearl);color:#fff;box-shadow:0 4px 0 var(--pearl-lo)}
.buy.confirm{background:#16a34a;color:#fff;box-shadow:0 4px 0 #15803d}
.buy.off{background:var(--card2);color:var(--mut);box-shadow:none}
.buy.done{background:transparent;color:var(--mut)}
.buy i{width:14px;height:14px;border-radius:50%;flex:none}
.buy svg{width:18px;height:18px;flex:none}
.buy.coins i{background:#fff6c2;box-shadow:inset 0 -2px 0 var(--coin-lo)}
.buy.pearls i{background:radial-gradient(circle at 35% 35%,#fff,#ddd6fe)}
.note{font-size:14px;color:var(--mut);text-align:center;padding:4px 10px 0}
.filters{display:flex;gap:8px;padding:0 2px}
.filters button{min-height:42px;padding:0 16px;border-radius:999px;background:var(--card);font-size:16px;font-weight:600;color:var(--ink2)}
.filters button.on{background:var(--ink);color:#fff}
.row{display:flex;align-items:center;gap:14px;padding:12px;border-radius:20px;background:var(--card);text-align:left;width:100%}
.row .t{font-size:19px;font-weight:600;display:block}
.row .s{font-size:14px;color:#5A5763;display:block}
.row .end{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:#5A5763;white-space:nowrap}
.row .end svg{width:18px;height:18px;color:var(--heart)}
.row.cur{outline:3px solid var(--c);outline-offset:-3px}
.row .wait{display:flex;align-items:center;gap:5px;color:#a16207;background:#FEF3C7;border-radius:999px;padding:3px 9px}
.row .wait svg{width:14px;height:14px;color:var(--coin-lo)}
.empty{padding:22px 10px;text-align:center;color:var(--mut);font-size:16px}

#toast{position:absolute;z-index:7;left:50%;top:calc(var(--st) + 66px);transform:translateX(-50%);padding:9px 16px;border-radius:999px;background:var(--white);color:var(--ink);font-weight:600;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
</style>

  <div id="nudge" aria-hidden="true"><div class="finger"></div><div class="say"><span data-i="up"></span>Swipe up for the next game</div></div>
  <div class="veil" id="allVeil" hidden>
    <div class="sheet" role="dialog" aria-label="All carts">
      <div class="head"><h2>Carts</h2><button class="x" id="allClose" aria-label="Close" data-i="x"></button></div>
      <div class="filters"><button id="fAll" class="on">All</button><button id="fFav">Favourites</button></div>
      <div id="allList" style="display:flex;flex-direction:column;gap:10px"></div>
    </div>
  </div>
  <div class="veil" id="shopVeil" hidden>
    <div class="rb-shop" role="dialog" aria-label="Shop">

const KCOL = { pass: ['#FFA41B', '#FF6A00'], skip: ['#A66BFF', '#6B3BE0'], upgrade: ['#3FB2FF', '#1C6FE8'], boost: ['#FFC530', '#FF8A00'],

const KPAT = { pass: 'star', skip: 'spiral', upgrade: 'hexagone', boost: 'spark', skin: 'diamond', pet: 'circle', box: 'diamond' };
function shade(hex, k) { const n = parseInt(hex.slice(1), 16), f = c => Math.max(0, Math.min(255, Math.round(c * k))); return '#' + [n >> 16, n >> 8 & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join(''); }
function renderShop() {
  const s = cur(), g = G(pos); if (!s) return;
  $('shopFor').textContent = g.title;
  $('wallet').innerHTML = `<div class="rb-pill">${rb('coin')}${fmt(Wallet.coins())}<small>Coins</small></div>` +
    `<div class="rb-pill">${rb('pearl')}${fmt(Wallet.pearls())}<small>${LIVE ? 'Pearls' : 'Demo Pearls'}</small></div>` +
    (LIVE ? `<a class="rb-btn" href="${PEARLS_URL}"${ON_SITE ? '' : ' target="_blank" rel="noopener"'}>${rb('plus')}Get Pearls</a>` : `<button class="rb-btn" id="demoTop">${rb('plus')}200 Pearls</button>`);
  const own = ownedOf(g.id), eq = equipOf(g.id), items = s.shop || [], pvs = PREV[g.id] || {};
  const nOwn = items.filter(i => own[i.id] && i.kind !== 'box' && i.kind !== 'skip').length;
  document.querySelectorAll('#shopTabs button').forEach(b => { b.setAttribute('aria-selected', String(b.dataset.st === shopTab)); if (b.dataset.st === 'inv') b.innerHTML = 'Inventory' + (nOwn ? `<b>${nOwn}</b>` : ''); });
  if (shopTab === 'inv') { $('shopBody').innerHTML = renderInv(g, s, own, eq, items, pvs); return; }
  let h = '';
  if (s.base) h += `<button class="rb-btn rb-home" id="goHome">${rb('home')}${s.baseName || 'Go to home base'}</button>`;
  if (!items.length) h += `<div class="rb-empty">${s.ready ? 'Nothing for sale in this game yet.' : 'Loading the shop…'}</div>`;
  let first = true;
  for (const k of Object.keys(KIND)) {
    const list = items.filter(i => i.kind === k); if (!list.length) continue;
    h += `<div class="rb-sec">${KIND[k][0]}</div><div class="rb-grid">`;
    list.forEach((it, idx) => {
      const have = own[it.id] || 0, cost = price(it, have), cur$ = it.pearls ? 'pearls' : 'coins';
      const bal = cur$ === 'pearls' ? Wallet.pearls() : Wallet.coins();
      const owns = (it.kind === 'skin' || it.kind === 'pet') && have, on = owns && eq[it.group || it.kind] === it.id;
      let btn, tag = '';
      if (owns) btn = on ? `<button class="rb-btn eqd" tabindex="-1">${rb('check')}Equipped</button>` : `<button class="rb-btn" data-equip="${it.id}">Equip</button>`;
      else if (it.kind === 'pass' && have) btn = `<button class="rb-btn done" disabled>${rb('check')}Owned</button>`;
      else if (it.kind === 'upgrade' && have >= (it.max || 1)) btn = `<button class="rb-btn done" disabled>Max</button>`;
      else if (confirmId === it.id) btn = `<button class="rb-btn confirm" data-buy="${it.id}">Confirm?</button>`;
      else btn = `<button class="rb-btn ${bal >= cost ? '' : 'off'}" data-buy="${it.id}">${rb(cur$ === 'coins' ? 'coin' : 'pearl')}${fmt(cost)}</button>`;
      if (it.kind === 'upgrade') tag = `Lv ${have}/${it.max || 1}`;
      else if (it.kind === 'boost' && have) tag = `x${have}`;
      if (it.kind === 'box') tag = (it.pool || []).filter(id => !own[id]).length + ' to find';
      // colour: the item's own colour when it has one, otherwise its kind's
      const c = it.color && it.kind !== 'pass' ? [shade(it.color, 1.12), shade(it.color, .78)] : KCOL[k] || KCOL.skin;
      const pat = PAT[KPAT[k] || 'diamond'] || '', wide = first && k === 'pass';
      const art = pvs[it.id] ? pvHTML(pvs[it.id], it.id) : `<span data-pv="${it.id}" style="display:contents">${it.color ? `<i class="rb-sw" style="background:${it.color}"></i>` : ''}${rb(it.icon && RB[it.icon] ? it.icon : KIND[k][1])}</span>`;
      h += `<div class="rb-card${wide ? ' wide' : ''}${owns ? ' own' : ''}${on ? ' eq' : ''}"${owns && !on ? ` data-equip="${it.id}"` : ''} style="--k1:${c[0]};--k2:${c[1]};--pat:url(${pat})">` +
        `${tag ? `<span class="rb-tag">${tag}</span>` : ''}${!have && it.kind !== 'boost' && it.kind !== 'upgrade' && idx === list.length - 1 && k !== 'pass' ? '<span class="rb-new">NEW</span>' : ''}` +
        `<div class="rb-art">${art}</div><div class="rb-info"><b>${it.name}</b><span>${it.desc}</span>${btn}</div></div>`;
      if (wide) first = false;
    });
    h += `</div>`;
  }
  h += `<div class="rb-note">${LIVE ? 'Pearls are bought on the Pearls page. Everything here is a sure thing: you get exactly what it says.' : 'Preview: Pearls here are pretend. On the Grug site the shop uses your real Pearls.'}</div>`;
  $('shopBody').innerHTML = h;
}
// the inventory: everything you own in this game; skins and pets are equipped here (one per group), "Default" takes it off
let shopTab = 'shop';
function artOf(it, k, pvs) { return pvs[it.id] ? pvHTML(pvs[it.id], it.id) : `<span data-pv="${it.id}" style="display:contents">${it.color ? `<i class="rb-sw" style="background:${it.color}"></i>` : ''}${rb(it.icon && RB[it.icon] ? it.icon : KIND[k][1])}</span>`; }
function invCard(it, k, pvs, btn, extra) {
  const c = it.color && it.kind !== 'pass' ? [shade(it.color, 1.12), shade(it.color, .78)] : KCOL[k] || KCOL.skin, pat = PAT[KPAT[k] || 'diamond'] || '';
  return `<div class="rb-card${extra || ''}" style="--k1:${c[0]};--k2:${c[1]};--pat:url(${pat})"><div class="rb-art">${artOf(it, k, pvs)}</div><div class="rb-info"><b>${it.name}</b><span>${it.desc}</span>${btn}</div></div>`;
}
function renderInv(g, s, own, eq, items, pvs) {
  let h = '';
  if (!items.length) return `<div class="rb-empty">${s.ready ? 'Nothing to own in this game yet.' : 'Loading…'}</div>`;
  const wear = items.filter(i => i.kind === 'skin' || i.kind === 'pet'), grps = [...new Set(wear.map(i => i.group || i.kind))];
  for (const grp of grps) {
    const list = wear.filter(i => (i.group || i.kind) === grp), mine = list.filter(i => own[i.id]), k = list[0].kind, cur0 = eq[grp];
    h += `<div class="rb-sec">${KIND[k][0]} · ${mine.length} of ${list.length}</div><div class="rb-grid">`;
    const pat = PAT[KPAT[k] || 'diamond'] || '';
    h += `<div class="rb-card none${cur0 ? '' : ' eq'}"${cur0 ? ` data-unequip="${grp}"` : ''} style="--pat:url(${pat})"><div class="rb-art">${rb(KIND[k][1])}</div><div class="rb-info"><b>${k === 'pet' ? 'No pet' : 'Default'}</b><span>${k === 'pet' ? 'Play without one' : 'The game’s normal look'}</span>` +
      (cur0 ? `<button class="rb-btn" data-unequip="${grp}">Equip</button>` : `<button class="rb-btn eqd" tabindex="-1">${rb('check')}Equipped</button>`) + `</div></div>`;
    for (const it of mine) { const on = cur0 === it.id;
      h += invCard(it, k, pvs, on ? `<button class="rb-btn eqd" tabindex="-1">${rb('check')}Equipped</button>` : `<button class="rb-btn" data-equip="${it.id}">Equip</button>`, ' own' + (on ? ' eq' : '')).replace('<div class="rb-card own', on ? '<div class="rb-card own' : `<div data-equip="${it.id}" class="rb-card own`); }
    h += `</div>`;
    if (!mine.length) h += `<div class="rb-note">None yet. Get them in the Shop, or try a crate.</div>`;
  }
  const other = items.filter(i => own[i.id] && (i.kind === 'pass' || i.kind === 'upgrade' || i.kind === 'boost'));
  if (other.length) {
    h += `<div class="rb-sec">Power-ups</div><div class="rb-grid">`;
    for (const it of other) { const n = own[it.id];
      const tag = it.kind === 'pass' ? 'Active for good' : it.kind === 'upgrade' ? `Level ${n} of ${it.max || 1}` : `${n} ready · used on your next run`;
      h += invCard(it, it.kind, pvs, `<button class="rb-btn done" tabindex="-1">${it.kind === 'pass' ? rb('check') : ''}${tag}</button>`); }
    h += `</div>`;
  }
  if (!grps.length && !other.length) h += `<div class="rb-empty">Nothing here yet.</div>`;
  if (!wear.some(i => own[i.id]) && !other.length) h += `<button class="rb-btn rb-inv-go" data-st="shop">${rb('shop')}Go to the Shop</button>`;
  return h;
}
$('shopTabs').addEventListener('click', e => { const b = e.target.closest('[data-st]'); if (!b) return; shopTab = b.dataset.st; confirmId = null; renderShop(); $('shopBody').parentElement.scrollTop = 0; });
// a 3D preview: a strip of 12 frames played as a slow spin, floating
const pvHTML = (img, id) => `<div class="rb-3d" data-pv3="${id}" style="background-image:url(${img})"></div>`;
// ---------- crates: coins only (earned by playing), a random skin from the list; a duplicate pays some coins back ----------
function openBox(s, g, it) {
  const items = s.shop || [], pool = (it.pool || []).map(id => items.find(i => i.id === id)).filter(Boolean);
  if (!pool.length) return;
  const weight = i => i.pearls ? 1 : 4, tot = pool.reduce((a, i) => a + weight(i), 0);
  let r = Math.random() * tot, win = pool[0]; for (const i of pool) { if ((r -= weight(i)) <= 0) { win = i; break; } }
  const had = (ownedOf(g.id)[win.id] || 0) > 0, back = it.dup || Math.round(it.coins * .5);
  if (!had) store.edit(st => {
    ((st.owned = st.owned || {})[g.id] = st.owned[g.id] || {})[win.id] = 1;
    ((st.equip = st.equip || {})[g.id] = st.equip[g.id] || {})[win.group || win.kind] = win.id;
  }); else Wallet.addCoins(back);
  sendOwned(s);
  // the reel: random cells sliding past, slowing down on the prize
  const pvs = PREV[g.id] || {};
  const cell = i => `<div class="rb-cell" style="--k:${i.color ? i.color : (KCOL[i.kind] || KCOL.skin)[0]}">${pvs[i.id] ? `<div class="rb-3d" style="background-image:url(${pvs[i.id]});width:80px;height:80px;background-size:960px 80px;animation:none"></div>` : (i.color ? `<i style="background:${i.color}"></i>` : '') + rb(i.icon && RB[i.icon] ? i.icon : (KIND[i.kind] || KIND.skin)[1])}</div>`;
  const cells = Array.from({ length: 30 }, (_, k) => k === 26 ? win : pool[Math.floor(Math.random() * pool.length)]);
  const o = $('rbOpen'); o.hidden = false;
  o.innerHTML = `<span class="rb-h">Opening ${it.name}…</span><div class="rb-reel"><div class="rb-strip">${cells.map(cell).join('')}</div></div>`;
  const strip = o.querySelector('.rb-strip'), w = o.querySelector('.rb-reel').clientWidth, x = -(26 * 98 + 45 - w / 2) + (Math.random() * 40 - 20);
  strip.animate([{ transform: 'translateX(0)' }, { transform: `translateX(${x}px)` }], { duration: 2100, easing: 'cubic-bezier(.12,.75,.18,1)', fill: 'forwards' }).onfinish = () => {
    o.insertAdjacentHTML('beforeend', `<div class="rb-got">${cell(win)}<span class="rb-h">${win.name}</span><small>${had ? 'Already yours: +' + back + ' coins back' : 'New! Equipped'}</small>` +
      `<button class="rb-btn" id="rbOk">${had ? 'OK' : 'Nice!'}</button></div>`);
    $('rbOk').onclick = () => { o.hidden = true; o.innerHTML = ''; renderShop(); };
  };
  renderShop();
}
function buy(id, confirmed) {
  const s = cur(), g = G(pos), it = (s.shop || []).find(i => i.id === id); if (!it) return;
  const have = ownedOf(g.id)[id] || 0, cost = price(it, have);
  if (it.kind === 'box' && it.pearls) return;   // crates are coins only: no paid random rewards
  if (it.pearls) {
    if (Wallet.pearls() < cost) { if (LIVE) { if (ON_SITE) location.href = PEARLS_URL; else window.open(PEARLS_URL, '_blank', 'noopener'); } else toast('Not enough demo Pearls: tap +200'); return; }
    // Pearls are real money: a second tap confirms
    if (!confirmed && confirmId !== id) { confirmId = id; clearTimeout(confirmT); confirmT = setTimeout(() => { confirmId = null; renderShop(); }, 3000); renderShop(); return; }
    confirmId = null; if (!Wallet.spendPearls(cost)) return;
  } else if (!Wallet.spendCoins(cost)) { toast('Play a few more runs to earn ' + fmt(cost - Wallet.coins()) + ' more coins'); return; }
  if (it.kind === 'box') { openBox(s, g, it); return; }
  store.edit(st => {
    const o = ((st.owned = st.owned || {})[g.id] = st.owned[g.id] || {}); o[id] = (o[id] || 0) + 1;
    if (it.kind === 'skin' || it.kind === 'pet') ((st.equip = st.equip || {})[g.id] = st.equip[g.id] || {})[it.group || it.kind] = id;
  });
  toast(it.kind === 'boost' ? it.name + ': ready for your next run' : it.kind === 'skin' || it.kind === 'pet' ? it.name + ': yours and equipped (see Inventory)' : it.name + ': yours');
  sendOwned(s); renderShop();
}
$('shopBody').addEventListener('click', e => {
  const st = e.target.closest('[data-st]'); if (st) { shopTab = st.dataset.st; renderShop(); return; }
  const un = e.target.closest('[data-unequip]');
  if (un) { const g = G(pos); store.edit(st2 => { const e2 = ((st2.equip = st2.equip || {})[g.id] = st2.equip[g.id] || {}); delete e2[un.dataset.unequip]; }); toast('Back to the default look'); sendOwned(cur()); renderShop(); return; }
  const b = e.target.closest('[data-buy],[data-equip],#goHome'); if (!b) return;
  if (b.id === 'goHome') { closeSheets(true); feed.classList.add('base'); post(cur(), { t: 'base', on: true }); return; }
  if (b.dataset.equip) {
    const g = G(pos), it = (cur().shop || []).find(i => i.id === b.dataset.equip); if (!it) return;
    store.edit(st => { const e = ((st.equip = st.equip || {})[g.id] = st.equip[g.id] || {}); e[it.group || it.kind] = it.id; });
    toast(it.name + ' equipped'); sendOwned(cur()); renderShop(); return;
  }
  buy(b.dataset.buy);
});
$('wallet').addEventListener('click', e => { if (e.target.closest('#demoTop')) Wallet.demoTopUp(); });
const PREV = {};   // game id -> { item id: sprite strip }
function openShop(tab) { if (!cur()) return; confirmId = null; shopTab = tab === 'inv' ? 'inv' : 'shop'; $('rbOpen').hidden = true; const g0 = G(pos); if (!PREV[g0.id]) { PREV[g0.id] = {}; post(cur(), { t: 'previews' }); } renderShop(); openSheet('shopVeil'); }
$('shopBtn').addEventListener('click', e => { e.currentTarget.blur(); openShop(); });
$('shopClose').addEventListener('click', () => closeSheets());
$('shopVeil').addEventListener('click', e => { if (e.target.id === 'shopVeil') closeSheets(); });

/* ---------- favourites and the list of every game ---------- */
const favs = () => store.get().fav || [];
const isFav = id => favs().includes(id);
$('favBtn').addEventListener('click', e => {
  const id = G(pos).id, on = !isFav(id);
  store.edit(s => { s.fav = (s.fav || []).filter(x => x !== id); if (on) s.fav.push(id); });
  caption(G(pos)); const b = e.currentTarget; b.blur(); b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
  toast(on ? 'Added to favourites' : 'Removed from favourites');
});
let onlyFav = false;
function renderAll() {
  const list = GAMES.map((g, i) => [g, i]).filter(([g]) => !onlyFav || isFav(g.id));
  $('fAll').classList.toggle('on', !onlyFav); $('fFav').classList.toggle('on', onlyFav);
  $('allList').innerHTML = list.length ? list.map(([g, i]) => `<button class="row${i === mod(pos) ? ' cur' : ''}" style="--c:${g.color}" data-g="${i}"><span class="tile">${svg(g.controls)}</span><span><span class="t">${g.title}</span><span class="s">${CTRL[g.controls]} · ${g.len}</span></span><span class="end">${waiting(g.id) ? `<span class="wait">${svg('coin')}+${fmt(waiting(g.id))}</span>` : bestOf(g.id) ? 'Best ' + fmt(bestOf(g.id)) : ''}${isFav(g.id) ? svg('heart') : ''}</span></button>`).join('')
    : `<div class="empty">Tap the heart on a game to keep it here.</div>`;
}
function openAll() { renderAll(); openSheet('allVeil'); }
$('allBtn').addEventListener('click', e => { e.currentTarget.blur(); openAll(); });
$('fAll').addEventListener('click', () => { onlyFav = false; renderAll(); });
$('fFav').addEventListener('click', () => { onlyFav = true; renderAll(); });
$('allList').addEventListener('click', e => { const b = e.target.closest('[data-g]'); if (!b) return; $('allVeil').hidden = true; jump(+b.dataset.g); });
$('allClose').addEventListener('click', () => closeSheets());
$('allVeil').addEventListener('click', e => { if (e.target.id === 'allVeil') closeSheets(); });

function openSheet(id) { $(id).hidden = false; feed.classList.toggle('shopping', id === 'shopVeil'); const s = cur(); post(s, { t: 'cancel' }); setActive(s, false); }
function closeSheets(quiet) { $('allVeil').hidden = true; $('shopVeil').hidden = true; feed.classList.remove('shopping'); if (!quiet) setActive(cur(), !document.hidden, true); else setActive(cur(), !document.hidden, true); }

/* ---------- rail buttons ---------- */
$('restartBtn').addEventListener('click', e => { e.currentTarget.blur(); feed.classList.remove('base'); post(cur(), { t: 'restart' }); });
$('shareBtn').addEventListener('click', e => {
  e.currentTarget.blur();
  const url = location.href.split('#')[0] + '#' + G(pos).id;
  if (navigator.share) navigator.share({ title: G(pos).title, url }).catch(() => { });
  else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('Link copied'), () => toast(url));
  else toast(url);
});
let toastT = 0;
function toast(s) { const t = $('toast'); t.textContent = s; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }

addEventListener('hashchange', () => { const i = GAMES.findIndex(g => '#' + g.id === location.hash); if (i >= 0 && i !== mod(pos)) jump(i); });
document.addEventListener('visibilitychange', () => setActive(cur(), !document.hidden && !sheetOpen(), true));
let rzT = 0;
addEventListener('resize', () => { layout(); clearTimeout(rzT); rzT = setTimeout(() => { caption(G(pos)); for (const s of live.values()) if (s.ready) hello(s); }, 150); });
addEventListener('storage', e => { if (e.key === KEY || e.key === 'grug.pearls.v1') paint(); });

/* ---------- start on the game named in the link, else the first ---------- */
const start = GAMES.findIndex(g => '#' + g.id === location.hash);
pos = start < 0 ? 0 : start;
caption(G(pos)); paint();
const first = [0, 1, -1].map(d => fetchSrc(G(pos + d).id));
Promise.race([Promise.all(first), new Promise(r => setTimeout(r, 2500))]).then(() => { sync(); activate(); fetchAround(); });
requestAnimationFrame(tick);
})();
</script>
</body></html>
