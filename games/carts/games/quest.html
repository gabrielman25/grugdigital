<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Block Quest</title>
<style>
/* windows in the old 8-bit style: black boxes, a double white rule, capitals in a typewriter face */
:root{--wb:#000;--wl:#fff;--wh:#facc15}
.win{position:fixed;z-index:3;background:var(--wb);color:#fff;border:3px solid var(--wl);border-radius:8px;box-shadow:0 0 0 3px var(--wb),inset 0 0 0 3px var(--wb),inset 0 0 0 5px var(--wl);
  font:700 16px "Courier New",ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;padding:12px 14px;pointer-events:none}
#stat{left:calc(var(--mk-l,0px) + 10px);top:calc(var(--mk-t,16px) + 70px);min-width:140px;line-height:1.35;font-size:14px;padding:9px 11px}
#stat b{color:var(--wh)}
#stat .bar{height:6px;background:#333;margin:2px 0 4px}#stat .bar i{display:block;height:100%;background:#4ade80}#stat .bar.mp i{background:#60a5fa}
#msg{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 104px);width:min(420px,calc(100% - 28px));min-height:56px;line-height:1.5;box-sizing:border-box}
#cmd{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:min(420px,calc(100% - 28px));display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;box-sizing:border-box;font-size:20px}
#cmd span{position:relative;padding-left:24px}
#cmd span.on::before{content:"\25B6";position:absolute;left:0;color:var(--wh);animation:blink .5s steps(2) infinite}
#cmd span.dim{opacity:.4}
#cmd[hidden],#msg[hidden]{display:none}
@keyframes blink{50%{opacity:.2}}
#ring{position:fixed;z-index:3;width:160px;height:160px;margin:-80px 0 0 -80px;pointer-events:none}
#ring[hidden]{display:none}
#ring .t{position:absolute;inset:50px;border-radius:50%;border:6px solid #facc15;box-shadow:0 0 12px #facc15}
#ring .s{position:absolute;inset:0;border-radius:50%;border:6px solid #fff}
#mash{position:fixed;z-index:3;left:50%;top:42%;transform:translateX(-50%);width:220px;pointer-events:none;text-align:center}
#mash[hidden]{display:none}
#mash .bar{height:18px;border:3px solid #fff;background:#000;margin-top:6px}#mash .bar i{display:block;height:100%;background:linear-gradient(90deg,#f97316,#facc15)}
#guard{position:fixed;z-index:3;font:700 46px "Courier New",monospace;color:#facc15;text-shadow:0 0 0 #000,3px 3px 0 #000;pointer-events:none;margin:-30px 0 0 -14px}
#guard[hidden]{display:none}
</style></head><body>
<div class="win" id="stat"></div><div class="win" id="msg"></div>
<div class="win" id="cmd" hidden><span data-c="0">Fight</span><span data-c="1">Fire</span><span data-c="2">Heal</span><span data-c="3">Guard</span></div>

     simple stand-in figures, so the game always plays.
   - a renderer on a full-screen canvas, scene, lights, a frame loop that only runs while the game is on screen.
   - input: one thing only, a press anywhere on the screen (tap or hold). MK.held says if it's down; down() and up()

     itself after a moment (or on a tap).
   - a HUD (score, lives, time bar, hints), pop-up text, praise, confetti on a new best.

@font-face{font-family:'Fredoka';src:url(${FONT}) format('woff2');font-weight:300 700;font-display:block}
html,body{margin:0;height:100%;overflow:hidden;background:var(--mk-bg,#17171A);touch-action:none;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:Fredoka,ui-rounded,system-ui,sans-serif}
#mk{position:fixed;inset:0;width:100%;height:100%;display:block}
#mk-hud{position:fixed;left:0;right:0;top:var(--mk-t,16px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;transition:opacity .25s}
#mk-score{font-size:58px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 3px 0 var(--mk-lo)}
#mk-score.bump{animation:mkb .22s ease-out}
@keyframes mkb{40%{transform:scale(1.22)}}
#mk-lives{display:flex;gap:7px}
#mk-lives i{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 2px 0 var(--mk-lo)}
#mk-lives i.off{background:rgba(255,255,255,.3);box-shadow:none}
#mk-bar{width:min(200px,50vw);height:10px;border-radius:6px;background:rgba(255,255,255,.35);overflow:hidden}
#mk-bar b{display:block;height:100%;width:100%;background:#fff;border-radius:6px;transform-origin:left;transition:background .2s}
#mk-bar.warn b{background:#f43f5e}
#mk-hint{position:fixed;left:0;right:0;bottom:calc(var(--mk-b,16px) + 6px);text-align:center;font-size:18px;font-weight:600;color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.3);pointer-events:none;transition:opacity .4s;opacity:0}
.mk-pop{position:fixed;transform:translate(-50%,-50%);font-weight:600;font-size:26px;color:#fff;pointer-events:none;white-space:nowrap;
  text-shadow:0 3px 0 rgba(0,0,0,.25);animation:mkpop .75s ease-out forwards}
@keyframes mkpop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
#mk-praise{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:46px;font-weight:600;color:#fff;pointer-events:none;
  text-shadow:0 4px 0 var(--mk-lo);opacity:0}
#mk-praise.on{animation:mkpr .9s ease-out forwards}
@keyframes mkpr{0%{opacity:0;transform:scale(.4)}18%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
#mk-over{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;

  };

<script>
/* Block Quest · Grug micro game (3D voxel, with your avatar) · a turn-based RPG played with one tap.

   - Fire (4 MP): tap as fast as you can for two seconds; the more taps, the bigger the blast. Hits every monster.
   - Heal: drink a potion (half your HP back). - Guard: take half damage next turn and recover 2 MP.
   On their turn each monster winds up and lunges: tap just as the "!" flashes to block (most of the damage, and you
   hit back). Tap too early and you can't block that one. Win battles for XP and level up; every fifth battle is a
   boss. Your HP carries over between battles. Monsters are Kenney Cube Pets (CC0) in their wild colours.
   Shop: Sharper Sword, Thicker Armour (upgrades), extra Potions and Ether (boosts), Double XP (pass), window colours. */
/* MODELS: b_stone, b_gravel, b_bricks_A, b_bricks_B, b_stone_dark, candle_stick_A, b_chest, pet_hog, pet_crab, pet_bee, pet_fox, pet_penguin, pet_cat, pet_panda, pet_beaver, pet_lion, pet_elephant, pet_tiger */

    ['Ghost Cat', 'cat', '#e9d5ff'], ['Stone Panda', 'panda', '#9ca3af'], ['Mud Beaver', 'beaver', '#78350f']];
  const BOSS = [['King Lion', 'lion', '#fbbf24'], ['Elder Elephant', 'elephant', '#a1a1aa'], ['Shadow Tiger', 'tiger', '#4c1d95']];
  const THEMES = { win_red: ['#3b0a0a', '#fca5a5'], win_green: ['#052e16', '#86efac'], win_gold: ['#1c1405', '#fde047'], win_pink: ['#3b0a2a', '#f9a8d4'], win_purple: ['#1e0b3b', '#c4b5fd'], win_blue: ['#0b1d4d', '#ffffff'] };
  const CMDS = ['Fight', 'Fire', 'Heal', 'Guard'];
  const HOME = new Float32Array([-40, 0, 260]);
  let T, S, me, foes = [], hero, wave, won, st, stT, cur, cmdT, act, idleT = 0, el = {}, queue = [], typing = null, guardOn = false;

  // ---------- windows ----------
  function say(text, after) {
    el.msg.hidden = false; typing = { text: text.toUpperCase(), n: 0, t: 0, after, hold: 0 }; el.msg.textContent = '';
  }
  function stat() {
    const h = hero;
    el.stat.innerHTML = `<b>Grug</b> lv ${h.lv}<br>HP ${Math.max(0, Math.ceil(h.hp))}/${h.max}<div class="bar"><i style="width:${Math.max(0, h.hp / h.max) * 100}%"></i></div>` +
      `MP ${h.mp}/${h.mpMax}<div class="bar mp"><i style="width:${h.mp / h.mpMax * 100}%"></i></div>POT ${h.pot} · G ${h.g}`;
  }
  function theme() { const t = THEMES[MK.equipped('win')] || ['#000000', '#ffffff']; document.documentElement.style.setProperty('--wb', t[0]); document.documentElement.style.setProperty('--wl', t[1]); }

  // ---------- the arena ----------
  async function setup(T_, scene) {
    T = T_; S = scene;
    el = { stat: document.getElementById('stat'), msg: document.getElementById('msg'), cmd: document.getElementById('cmd'), items: [...document.querySelectorAll('#cmd span')],
      ring: document.getElementById('ring'), rs: document.querySelector('#ring .s'), mash: document.getElementById('mash'), mbar: document.querySelector('#mash i'), guard: document.getElementById('guard') };

    const fl = [], fl2 = [], wall = [];
    for (let x = -800; x <= 800; x += 100) for (let z = -700; z <= 600; z += 100) ((Math.abs(x / 100) + Math.abs(z / 100)) % 4 === 0 ? fl2 : fl).push([x, -50, z]);
    for (let x = -850; x <= 850; x += 100) for (let y = 50; y <= 350; y += 100) wall.push([x, y, -750]);
    scene.add(MK.instances('b_stone', fl, 50), MK.instances('b_gravel', fl2, 50), MK.instances('b_bricks_B', wall, 50));
    const pil = []; for (const x of [-600, -300, 300, 600]) for (let y = 50; y <= 350; y += 100) pil.push([x, y, -650]);
    scene.add(MK.instances('b_stone_dark', pil, 50));
    for (const x of [-600, -300, 300, 600]) { const c = MK.model('candle_stick_A', null, { scale: 60 }); c.position.set(x, 400, -650); scene.add(c); }
    const ch = MK.model('b_chest', 110); ch.position.set(-560, 55, -420); ch.rotation.y = .5; scene.add(ch);
    me = await MK.avatar('player'); me.object3d.position.set(HOME[0], 0, HOME[2]); me.object3d.rotation.y = Math.PI; scene.add(me.object3d);

  }
  function damage(f, n, crit) {
    n = Math.max(1, Math.round(n)); f.hp -= n;

    MK.popAt(at.clone().setY(f.size + 40), String(n), crit ? '#fde047' : '#fff', crit ? 40 : 30);

  }

  }
  function victory() {
    st = 'wait'; won++; MK.hud.score(won);
    const xp = foes.reduce((a, f) => a + (f.boss ? 40 : 10) + wave * 2, 0) * (MK.owned('xp2') ? 2 : 1), g = foes.length * 4 + wave;
    hero.xp += xp; hero.g += g; MK.earn(Math.max(1, Math.round(g / 3)));
    MK.toScore(new T.Vector3(150, 120, 0), 5); me.play('dance');
    let text = 'Victory! +' + xp + ' XP, +' + g + ' G.';
    while (hero.xp >= hero.next) {

      text += ' Level up! LV ' + hero.lv + '.'; MK.praise('Level ' + hero.lv + '!'); MK.sparkle(new T.Vector3(HOME[0], 150, HOME[2]), { n: 30, speed: 320 });

      { id: 'armor', name: 'Thicker Armour', desc: '+8 max HP per level', kind: 'upgrade', coins: 40, grow: 1.7, max: 6 },
      { id: 'potions', name: 'Potion Pack', desc: '+2 potions for one quest', kind: 'boost', coins: 20 },

      { id: 'win_blue', name: 'Royal Blue Windows', desc: 'The classic blue menus', kind: 'skin', group: 'win', color: '#1d4ed8', coins: 30 },
      { id: 'win_red', name: 'Ruby Windows', desc: 'Menus in deep red', kind: 'skin', group: 'win', color: '#991b1b', coins: 30 },
      { id: 'win_green', name: 'Forest Windows', desc: 'Menus in deep green', kind: 'skin', group: 'win', color: '#166534', coins: 30 },
      { id: 'win_pink', name: 'Candy Windows', desc: 'Menus in berry pink', kind: 'skin', group: 'win', color: '#be185d', coins: 50 },
      { id: 'win_purple', name: 'Night Windows', desc: 'Menus in midnight purple', kind: 'skin', group: 'win', color: '#6d28d9', coins: 50 },
      { id: 'win_gold', name: 'Gold Windows', desc: 'Menus fit for a king', kind: 'skin', group: 'win', color: '#ca8a04', pearls: 30 },
      { id: 'box_win', name: 'Window Crate', desc: 'A random window colour. Already have it? Half your coins back', kind: 'box', coins: 20, pool: ['win_blue', 'win_red', 'win_green', 'win_pink', 'win_purple', 'win_gold'] }
    ],
    // shop previews: a little menu window in its colours
    preview(it) {
      const t = THEMES[it.id]; if (!t) return null;
      const g = new T.Group(); g.add(MK.mesh(new T.BoxGeometry(120, 80, 6), MK.mat(t[1]), 0, 0, 0), MK.mesh(new T.BoxGeometry(108, 68, 8), MK.mat(t[0]), 0, 0, 0));
      g.add(MK.mesh(new T.ConeGeometry(7, 12, 3), MK.mat('#facc15'), -38, 14, 6)); for (let i = 0; i < 2; i++) g.add(MK.mesh(new T.BoxGeometry(56, 6, 2), MK.mat(t[1]), 6, 14 - i * 24, 6));
      return g;
    },
    setup, reset, update, down, onOwned: theme,
    start() { MK.hud.hint('The arrow moves by itself: tap to choose'); setTimeout(() => MK.hud.hint(null, false), 4000); },
    idle(dt) { idleT += dt; me.update(dt); for (const f of foes) f.a.update(dt); place(dt); },
    resize() { MK.fit(MK.camera, MK.W > MK.H ? 1000 : 620, 620, 860); place(0); }
  });
})();
</script>
