/* MicroKit v4 · the shared layer every Grug micro game carries (3D).
   Source: micro/src/microkit.js. build.py copies it (with Fredoka inlined) between the MICROKIT markers of every game,
   so each game stays one self-contained HTML file. Edit this file, then run build.py: never edit the copies.

   What it gives a game:
   - three.js + SandyKit. Inside the feed they are borrowed from the feed (loaded once for every game). On its own, the
     game loads the site's runtime itself. If the avatar runtime can't load, plain three.js is used and avatars become
     simple stand-in figures, so the game always plays.
   - a renderer on a full-screen canvas, scene, lights, a frame loop that only runs while the game is on screen.
   - input: one thing only, a press anywhere on the screen (tap or hold). MK.held says if it's down; down() and up()
     fire as it goes down and comes back up. Where the finger is doesn't matter.
   - no start screen: a run starts the moment the game is on screen. Game over shows the score and starts again by
     itself after a moment (or on a tap).
   - a HUD (score, lives, time bar, hints), pop-up text, praise, confetti on a new best.
   - juice: voxel particle bursts, sparkles, shock rings, sparks that fly to the score, screen flash, hit-stop.
   - models from the CC0 packs, Cube Pets with animations, the shop / home base / away-earnings plumbing. */

@font-face{font-family:'Fredoka';src:url(${FONT}) format('woff2');font-weight:300 700;font-display:block}
html,body{margin:0;height:100%;overflow:hidden;background:var(--mk-bg,#17171A);touch-action:none;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:Fredoka,ui-rounded,system-ui,sans-serif}
#mk{position:fixed;inset:0;width:100%;height:100%;display:block}
#mk-hud{position:fixed;left:0;right:0;top:var(--mk-t,16px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;transition:opacity .25s}
#mk-score{font-size:58px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 3px 0 var(--mk-lo)}
#mk-score.bump{animation:mkb .22s ease-out}
@keyframes mkb{40%{transform:scale(1.22)}}
#mk-lives{display:flex;gap:7px}
#mk-lives i{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 2px 0 var(--mk-lo)}
#mk-lives i.off{background:rgba(255,255,255,.3);box-shadow:none}
#mk-bar{width:min(200px,50vw);height:10px;border-radius:6px;background:rgba(255,255,255,.35);overflow:hidden}
#mk-bar b{display:block;height:100%;width:100%;background:#fff;border-radius:6px;transform-origin:left;transition:background .2s}
#mk-bar.warn b{background:#f43f5e}
#mk-hint{position:fixed;left:0;right:0;bottom:calc(var(--mk-b,16px) + 6px);text-align:center;font-size:18px;font-weight:600;color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.3);pointer-events:none;transition:opacity .4s;opacity:0}
.mk-pop{position:fixed;transform:translate(-50%,-50%);font-weight:600;font-size:26px;color:#fff;pointer-events:none;white-space:nowrap;
  text-shadow:0 3px 0 rgba(0,0,0,.25);animation:mkpop .75s ease-out forwards}
@keyframes mkpop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
#mk-praise{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:46px;font-weight:600;color:#fff;pointer-events:none;
  text-shadow:0 4px 0 var(--mk-lo);opacity:0}
#mk-praise.on{animation:mkpr .9s ease-out forwards}
@keyframes mkpr{0%{opacity:0;transform:scale(.4)}18%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
#mk-over{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;

    }
  });

  MK.init = function (c) {
    cfg = c;
    document.title = c.title;
    const r = document.documentElement.style;
    r.setProperty('--mk-c', c.color); r.setProperty('--mk-lo', c.lo || c.color); r.setProperty('--mk-bg', c.bg || '#17171A');
    cv = document.createElement('canvas'); cv.id = 'mk'; document.body.appendChild(cv);
    document.body.insertAdjacentHTML('beforeend',
      `<div id="mk-hud"><div id="mk-score">0</div><div id="mk-lives" hidden></div><div id="mk-bar" hidden><b></b></div></div>` +
      `<div id="mk-hint"></div><div id="mk-praise"></div><div id="mk-flash"></div><div id="mk-over" hidden></div>` +
      (inFrame ? '' : `<div id="mk-load">Loading ${c.title}</div>`));
    hud = { wrap: $('mk-hud'), score: $('mk-score'), lives: $('mk-lives'), bar: $('mk-bar'), hint: $('mk-hint'), praise: $('mk-praise'), over: $('mk-over'), flash: $('mk-flash') };
    hud.wrap.style.opacity = 0;
    MK.best = ((store.get().best || {})[c.id]) || 0;
    applySafe();
    addEventListener('resize', resize);
    if (!inFrame) {
      addEventListener('pointerdown', e => press('p' + e.pointerId, e.clientX, e.clientY));
      addEventListener('pointermove', e => move('p' + e.pointerId, e.clientX, e.clientY));
      addEventListener('pointerup', e => release('p' + e.pointerId));
      addEventListener('pointercancel', e => release('p' + e.pointerId));
      addEventListener('contextmenu', e => e.preventDefault());
      addEventListener('keydown', e => { if (!e.repeat && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); press('k', MK.W / 2, MK.H / 2); } });
      addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter') release('k'); });
      document.addEventListener('visibilitychange', () => setActive(!document.hidden));
    }
    loadOwned();
    send({ t: 'ready', phase: 'loading', shop: cfg.shop || [], base: !!cfg.base, baseName: cfg.baseName || '', title: cfg.title });
    runtime().then(async ({ T, K, doc }) => {
      MK.T = T; MK.Sandy = K; doc3 = doc;
      const R = MK.renderer = new T.WebGLRenderer({ canvas: cv, antialias: !touchDev, powerPreference: 'high-performance' });
      if (!K && T.ColorManagement) { T.ColorManagement.enabled = false; if ('outputColorSpace' in R) R.outputColorSpace = 'srgb'; }
      else R.outputEncoding = T.sRGBEncoding;
      R.shadowMap.enabled = true; R.shadowMap.type = T.PCFSoftShadowMap;
      const scene = MK.scene = new T.Scene();
      scene.add(MK.hemi = new T.HemisphereLight(0xfff4e0, 0x5a6a50, .85));
      const sun = MK.sun = new T.DirectionalLight(0xfff0dc, .95);
      sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.bias = -.0006;
      scene.add(sun, sun.target);
      MK.camera = new T.PerspectiveCamera(40, MK.W / MK.H, 10, 30000);
      await cfg.setup(T, scene);
      booted = true;
      if (cfg.onOwned) cfg.onOwned();
      cfg.reset();      // state first, then size the view around it
      resize();
      const ld = $('mk-load'); if (ld) ld.remove();
      MK.phase = 'ready'; send({ t: 'phase', phase: 'ready' });
      hud.wrap.style.opacity = 1;
      render();
      if (active) { awayCheck(); start(); }
      if (pvWanted) { pvWanted = false; setTimeout(sendPreviews, 300); }
    }).catch(err => { const ld = $('mk-load'); if (ld) ld.textContent = 'This game could not load'; console.error(err); });
  };
})();

/* MICROKIT END */
</script>
<script>
/* Catch That Rocket! · Grug micro game (3D, with your avatar) · control: hold anywhere to run, let go to wait.
   The boarding call is on and the clock is running. Run down the spaceport to the rocket before it launches:
   - sliding doors open and close: run into a closed one and you bounce off, so let go and wait for it.
   - luggage carts roll across: wait for them to pass.
   - moving walkways speed you up.
   Make it aboard and the rocket blasts off to a random planet that changes you for the next trip: Giant (barges
   through carts), Tiny (slips under doors), Zoomy (runs faster), Ghostly (walks through carts) or Golden (double
   coins). Rare planets are rarer. Every rocket you catch is +1 and the next terminal is longer and busier.
   Miss one and it's over. Shop: Rocket Boots, Extra Minutes, Fast Pass (boost), VIP Walkways (pass), space suits. */
/* MODELS: b_metal, b_stone, b_glass, b_striped_block_yellow, b_decorative_block_blue, b_crate, b_barrel, b_metalframe */
(() => {
  const PLANETS = [
    { k: 'giant', n: 'Planet Bigsby', d: 'You grow huge: carts bounce off you', c: '#f97316', w: 30 },
    { k: 'tiny', n: 'Planet Teeny', d: 'You shrink: slip right under closed doors', c: '#38bdf8', w: 30 },
    { k: 'zoom', n: 'Planet Zoomer', d: 'You run 35% faster', c: '#22c55e', w: 25 },
    { k: 'ghost', n: 'Planet Spookle', d: 'You turn ghostly: walk through carts and doors', c: '#c4b5fd', w: 10 },
    { k: 'gold', n: 'Planet Goldrush', d: 'You turn golden: double coins', c: '#facc15', w: 5 }
  ];
  const SUITS = { suit_white: '#f8fafc', suit_orange: '#f97316', suit_blue: '#3b82f6', suit_red: '#ef4444', suit_black: '#111827', suit_gold: '#facc15' };
  const SKEY = 'grug.micro.rocket.v1';
  const seen = (() => { try { return JSON.parse(localStorage.getItem(SKEY)) || {}; } catch (e) { return {}; } })();
  let LAMP, T, S, me, world, rocket, flame, z, len, clock, phase, pt, caught, form, bump, doors = [], carts = [], walks = [], el = {}, idleT = 0, mats = [], fast = false;

  function suit() { const id = MK.equipped('suit'); if (!me || !me.apply || !me.getConfig) return; try { const c = me.getConfig(); if (!me._own) me._own = { top: c.top, shirt: c.outfit.shirt }; if (id && SUITS[id]) me.apply({ top: null, outfit: Object.assign({}, c.outfit, { shirt: SUITS[id] }) }); else me.apply({ top: me._own.top, outfit: Object.assign({}, c.outfit, { shirt: me._own.shirt }) }); } catch (e) { } }
  function rocketMesh() {
    const g = new T.Group(), w = MK.mat('#f1f5f9', { roughness: .35, metalness: .2 }), r = MK.mat('#ef4444', { roughness: .4 });
    g.add(MK.mesh(new T.CylinderGeometry(150, 170, 900, 24), w, 0, 650, 0), MK.mesh(new T.ConeGeometry(150, 380, 24), r, 0, 1290, 0));
    for (let i = 0; i < 4; i++) { const f = MK.mesh(new T.BoxGeometry(20, 300, 160), r, Math.cos(i * Math.PI / 2) * 170, 290, Math.sin(i * Math.PI / 2) * 170); f.rotation.y = -i * Math.PI / 2; g.add(f); }
    g.add(MK.mesh(new T.CylinderGeometry(52, 52, 12, 20), MK.mat('#38bdf8', { emissive: '#0ea5e9', emissiveIntensity: .4 }), 0, 900, 152));
    g.door = MK.mesh(new T.BoxGeometry(110, 180, 10), MK.mat('#facc15', { emissive: '#a16207', emissiveIntensity: .3 }), 0, 300, 170); g.add(g.door);
    g.add(MK.mesh(new T.CylinderGeometry(120, 160, 140, 20), MK.mat('#64748b'), 0, 70, 0));
    const fl = MK.mesh(new T.ConeGeometry(120, 420, 16), new T.MeshBasicMaterial({ color: MK.color('#fb923c'), transparent: true, opacity: .9, toneMapped: false }), 0, -120, 0, false);
    fl.rotation.x = Math.PI; fl.visible = false; g.add(fl); g.flame = fl;
    return g;
  }
  // ---------- one terminal: a corridor with doors, carts and walkways, the rocket at the end ----------
  function build() {
    if (world) { S.remove(world); world.traverse(o => { if (o.isInstancedMesh) o.dispose(); }); }
    world = new T.Group(); S.add(world);
    len = 2200 + caught * 350;
    doors = []; carts = []; walks = [];
    const fl = [], fl2 = [], glass = [], frame = [];
    for (let zz = 300; zz >= -len - 900; zz -= 100) for (let x = -400; x <= 400; x += 100) ((Math.abs(x / 100) + Math.abs(zz / 100)) % 2 ? fl2 : fl).push([x, -50, zz]);
    for (let zz = 300; zz >= -len; zz -= 100) for (const x of [-450, 450]) { glass.push([x, 50, zz]); glass.push([x, 150, zz]); if (zz % 400 === 0) { frame.push([x, 250, zz]); } }
    world.add(MK.instances('b_stone', fl, 50), MK.instances('b_metal', fl2, 50), MK.instances('b_glass', glass, 50), MK.instances('b_metalframe', frame, 50));
    // obstacles, spaced out down the corridor
    let at = -450;
    while (at > -len + 300) {
      const r = Math.random(), lvl = Math.min(1, caught * .15);
      if (r < .42) {
        const g = new T.Group(); g.position.z = at; world.add(g);
        g.add(MK.mesh(new T.BoxGeometry(900, 40, 60), MK.mat('#334155'), 0, 280, 0));
        const L = MK.mesh(new T.BoxGeometry(220, 260, 30), MK.mat('#94a3b8', { metalness: .4, roughness: .3 }), -110, 130, 0), R = MK.mesh(new T.BoxGeometry(220, 260, 30), MK.mat('#94a3b8', { metalness: .4, roughness: .3 }), 110, 130, 0);
        const lamp = MK.mesh(new T.BoxGeometry(60, 20, 20), MK.mat('#22c55e', { emissive: '#22c55e', emissiveIntensity: 1 }), 0, 310, 20, false);
        g.add(L, R, lamp);
        doors.push({ z: at, g, L, R, lamp, cyc: MK.rand(2.2, 3) - lvl * .5, open: MK.rand(1.1, 1.4) - lvl * .25, ph: Math.random() * 3, o: 0 });
        at -= MK.rand(380, 520);
      } else if (r < .8) {
        const g = new T.Group(); g.position.z = at; world.add(g);
        const c = MK.model('b_crate', 80); c.position.y = 70; g.add(c);
        const b = MK.model('b_barrel', 60); b.position.set(0, 140, 0); g.add(b);
        g.add(MK.mesh(new T.BoxGeometry(110, 20, 110), MK.mat('#475569'), 0, 20, 0));
        carts.push({ z: at, g, x: -500, v: MK.rand(260, 380) * (1 + lvl * .4) * (Math.random() < .5 ? 1 : -1), hit: 0 });
        at -= MK.rand(330, 450);
      } else {
        const L2 = 300, m = MK.mesh(new T.BoxGeometry(180, 6, L2), MK.mat('#facc15', { roughness: .4 }), 0, 3, at - L2 / 2, false); world.add(m);
        walks.push({ z0: at, z1: at - L2, m });
        at -= L2 + 200;
      }
    }
    if (MK.owned('vip')) for (let zz = -350; zz > -len + 300; zz -= 900) { const m = MK.mesh(new T.BoxGeometry(180, 6, 250), MK.mat('#a78bfa', { roughness: .4 }), 0, 3, zz - 125, false); world.add(m); walks.push({ z0: zz, z1: zz - 250, m }); }
    rocket = rocketMesh(); flame = rocket.flame; rocket.position.set(0, 0, -len - 420); world.add(rocket);
    world.add(MK.mesh(new T.BoxGeometry(260, 10, 300), MK.mat('#facc15'), 0, 0, -len - 120, false));
    for (let k = -1; k <= 1; k += 2) world.add(MK.instances('b_striped_block_yellow', [[k * 350, 50, -len], [k * 350, 150, -len]], 50));
  }
  async function setup(T_, scene) {
    T = T_; S = scene;
    el = { clock: document.getElementById('clock'), form: document.getElementById('form'), planet: document.getElementById('planet') };
    scene.background = MK.color('#0b1026'); scene.fog = new T.Fog(MK.color('#0b1026'), 2400, 5200);
    // stars
    const g = new T.BufferGeometry(), p = [];
    for (let i = 0; i < 700; i++) p.push(MK.rand(-4000, 4000), MK.rand(200, 4000), MK.rand(-9000, 1000));
    g.setAttribute('position', new T.Float32BufferAttribute(p, 3));
    scene.add(new T.Points(g, new T.PointsMaterial({ color: 0xffffff, size: 14, sizeAttenuation: true })));
    me = await MK.avatar('player'); scene.add(me.object3d);
    MK.hemi.intensity = 1;
    LAMP = { g: MK.mat('#22c55e', { emissive: '#22c55e', emissiveIntensity: 1 }), r: MK.mat('#ef4444', { emissive: '#ef4444', emissiveIntensity: 1 }) };
  }
  function applyForm() {
    const o = me.object3d, s = form === 'giant' ? 1.7 : form === 'tiny' ? .55 : 1;
    o.scale.setScalar(s);
    // ghostly: see-through (the avatar's own materials, cloned once so nothing else changes)
    o.traverse(m => { if (!m.isMesh || !m.material || Array.isArray(m.material)) return; if (!m.material.userData.own) { m.material = m.material.clone(); m.material.userData.own = 1; } m.material.transparent = form === 'ghost'; m.material.opacity = form === 'ghost' ? .45 : 1; });
    const P = PLANETS.find(p => p.k === form);
    el.form.textContent = P ? P.n.replace('Planet ', '') + ' power: ' + P.d.split(':').pop().trim() : '';
  }
  function reset() {
    caught = 0; form = null; fast = MK.starting && MK.use('fastpass');
    newRound(); applyForm();
    MK.hud.score(0);
  }
  function newRound() {
    build();
    z = 150; clock = 30 + caught * 2 + MK.owned('ticket') * 3; phase = 'run'; pt = 0; bump = 0;
    el.planet.hidden = true; rocket.door.visible = true;
    me.object3d.visible = true; me.object3d.position.set(0, 0, z); me.object3d.rotation.set(0, Math.PI, 0); me.play('idle'); me.setExpression('happy');
    place(0);
  }
  function start() { MK.hud.hint(fast ? 'Fast Pass: the first doors stay open · hold to run' : 'Hold to run · let go to wait for doors and carts'); }
  const runV = () => 380 * (1 + .06 * MK.owned('boots')) * (form === 'zoom' ? 1.35 : 1) * (form === 'giant' ? .92 : 1);
  function update(dt) {
    idleT += dt; pt += dt; me.update(dt * (MK.held && phase === 'run' ? 1.7 : 1));
    // doors and carts
    for (const d of doors) {
      const t = (MK.t + d.ph) % d.cyc, want = (fast && d.z > -1200) || t < d.open ? 1 : 0;
      d.o += (want - d.o) * Math.min(1, dt * 9);
      d.L.position.x = -110 - d.o * 200; d.R.position.x = 110 + d.o * 200;
      d.lamp.material = d.o > .6 ? LAMP.g : LAMP.r;
    }
    for (const c of carts) {
      c.x += c.v * dt; if (c.x > 520) c.x = -520; if (c.x < -520) c.x = 520;
      if (c.hit > 0) { c.hit -= dt; c.g.position.y = Math.sin(c.hit * 20) * 10; } else c.g.position.y = 0;
      c.g.position.x = c.x; c.g.rotation.y = c.v > 0 ? 0 : Math.PI;
    }
    if (phase === 'run') {
      clock -= dt;
      el.clock.textContent = 'T-' + Math.max(0, Math.ceil(clock)); el.clock.classList.toggle('ok', clock > 8);
      if (clock <= 0) { missed(); return; }
      if (bump > 0) { bump -= dt; z = Math.min(200, z + 300 * dt); }
      else if (MK.held) {
        const onWalk = walks.some(w => z <= w.z0 && z >= w.z1);
        let nz = z - runV() * (onWalk ? 1.6 : 1) * dt;
        // a closed door
        for (const d of doors) if (z > d.z + 20 && nz <= d.z + 20 && d.o < .55 && form !== 'tiny' && form !== 'ghost') { nz = d.z + 60; bonk('Door shut!'); break; }
        z = nz;
        if (onWalk && Math.random() < dt * 10) MK.burst(new T.Vector3(MK.rand(-60, 60), 10, z + 40), { n: 1, color: '#fde047', speed: 60, size: 6, gravity: 0, life: .4 });
      }
      // a cart rolling into you
      for (const c of carts) if (Math.abs(c.z - z) < 70 && Math.abs(c.x) < 80 && bump <= 0 && c.hit <= 0) {
        if (form === 'ghost') continue;
        if (form === 'giant') { c.v = -c.v * 1.2; c.hit = .4; MK.burst(new T.Vector3(c.x, 80, c.z), { n: 10, colors: ['#a16207', '#fde68a'], speed: 300, size: 8 }); MK.popAt(new T.Vector3(c.x, 220, c.z), 'Boom!', '#fde68a', 26); continue; }
        c.hit = .5; bonk('Cart!');
      }
      if (z <= -len - 60) board();
      me.play(MK.held && bump <= 0 ? 'walk' : 'idle');
    } else if (phase === 'launch') {
      // the rocket goes up, the camera watches
      const k = pt; flame.visible = true; flame.scale.setScalar(1 + Math.sin(pt * 40) * .1);
      rocket.position.y = k < .8 ? Math.sin(pt * 60) * 4 : Math.pow(k - .8, 2) * 1600;
      if (Math.random() < dt * 40) MK.burst(new T.Vector3(MK.rand(-150, 150), rocket.position.y + 20, rocket.position.z + MK.rand(-150, 150)), { n: 3, colors: ['#e5e7eb', '#9ca3af', '#fb923c'], speed: 300, size: 30, gravity: -50, life: 1.2 });
      if (pt > 2.6) land();
    } else if (phase === 'landed') {
      if (pt > 2.6) { el.planet.hidden = true; newRound(); applyForm(); MK.hud.hint('Next rocket! Hold to run', true); setTimeout(() => MK.hud.hint(null, false), 1800); }
    } else if (phase === 'missed') {
      flame.visible = true; rocket.position.y = Math.pow(pt, 2) * 900;
      if (Math.random() < dt * 30) MK.burst(new T.Vector3(MK.rand(-150, 150), rocket.position.y, rocket.position.z), { n: 3, colors: ['#e5e7eb', '#fb923c'], speed: 300, size: 30, gravity: -50, life: 1.2 });
      if (pt > 2.2 && MK.phase === 'play') MK.over(caught);
    }
    if (form === 'gold' && Math.random() < dt * 6) MK.sparkle(new T.Vector3(MK.rand(-40, 40), MK.rand(40, 170), z), { n: 1, color: '#fde047', speed: 40 });
    if (MK.t > 4) MK.hud.hint(null, false);
    place(dt);
  }
  function bonk(why) {
    bump = .35; MK.shake(8); MK.haptic(50); me.setExpression('dizzy'); setTimeout(() => me.setExpression('happy'), 500);
    MK.popAt(new T.Vector3(0, 230, z), why, '#fecaca', 26); MK.burst(new T.Vector3(0, 120, z - 30), { n: 10, color: '#ffffff', speed: 240, size: 8 });
  }
  function board() {
    phase = 'launch'; pt = 0; rocket.door.visible = false; me.object3d.visible = false;
    caught++; MK.hud.score(caught); MK.haptic([20, 40, 20]);
    const at = new T.Vector3(0, 300, -len - 250);
    MK.burst(at, { n: 30, colors: ['#f59e0b', '#10b981', '#0ea5e9', '#f43f5e', '#ffffff'], speed: 520, size: 12, up: 1.3 }); MK.toScore(at, 5);
    MK.praise(clock > 10 ? 'Made it with time to spare!' : 'Just made it!');
    MK.earn(Math.round((3 + caught) * (form === 'gold' ? 2 : 1)));
  }
  function land() {
    // a random planet: rarer ones show up less (it's a free ride, earned by catching the rocket)
    const tot = PLANETS.reduce((a, p) => a + p.w, 0); let r = Math.random() * tot, P = PLANETS[0];
    for (const p of PLANETS) { if ((r -= p.w) <= 0) { P = p; break; } }
    form = P.k; const fresh = !seen[P.k]; seen[P.k] = 1; try { localStorage.setItem(SKEY, JSON.stringify(seen)); } catch (e) { }
    phase = 'landed'; pt = 0;
    const box = el.planet.firstChild; box.querySelector('i').style.background = P.c; box.querySelector('b').textContent = P.n; box.querySelector('span').textContent = P.d; box.querySelector('em').hidden = !fresh;
    el.planet.hidden = false; MK.flash(P.c, .35); MK.haptic([20, 40, 20]);
    rocket.position.y = 0; flame.visible = false;
  }
  function missed() {
    phase = 'missed'; pt = 0; rocket.door.visible = false; el.clock.textContent = 'T-0';
    MK.popAt(new T.Vector3(0, 260, z), 'You missed the rocket!', '#fecaca', 30); me.setExpression('scared'); MK.shake(10);
  }
  function place(dt) {
    me.object3d.position.set(0, 0, z);
    const C = MK.camera;
    if (phase === 'launch' || phase === 'missed' || phase === 'landed') { const rz = rocket.position.z; C.position.set(900, 500, rz + 1500); C.lookAt(0, Math.min(2500, rocket.position.y + 600), rz); }
    else { C.position.set(0, 330, z + 560); C.lookAt(0, 140, z - 700); }
    MK.sunAt(0, 0, z - 400, 1000);
  }
  MK.init({
    id: 'rocket', title: 'Catch That Rocket!', controls: 'hold', color: '#ef4444', lo: '#991b1b', bg: '#0b1026', scoreName: 'Rockets caught', coinRate: 0,
    shop: [
      { id: 'vip', name: 'VIP Walkways', desc: 'Extra moving walkways in every terminal, for good', kind: 'pass', pearls: 120 },
      { id: 'boots', name: 'Rocket Boots', desc: 'Run 6% faster per level', kind: 'upgrade', coins: 40, grow: 1.7, max: 6 },
      { id: 'ticket', name: 'Early Check-in', desc: '+3 seconds on every countdown', kind: 'upgrade', coins: 50, grow: 1.8, max: 5 },
      { id: 'fastpass', name: 'Fast Pass', desc: 'The first doors stay open for one run', kind: 'boost', coins: 25 },
      { id: 'suit_white', name: 'Astronaut Suit', desc: 'Classic white', kind: 'skin', group: 'suit', color: '#f8fafc', coins: 40 },
      { id: 'suit_orange', name: 'Launch Suit', desc: 'Bright flight orange', kind: 'skin', group: 'suit', color: '#f97316', coins: 40 },
      { id: 'suit_blue', name: 'Pilot Suit', desc: 'Deep space blue', kind: 'skin', group: 'suit', color: '#3b82f6', coins: 50 },
      { id: 'suit_red', name: 'Mars Suit', desc: 'Red planet red', kind: 'skin', group: 'suit', color: '#ef4444', coins: 50 },
      { id: 'suit_black', name: 'Stealth Suit', desc: 'Black as the void', kind: 'skin', group: 'suit', color: '#111827', coins: 90 },
      { id: 'suit_gold', name: 'Gold Suit', desc: 'For star captains', kind: 'skin', group: 'suit', color: '#facc15', pearls: 30 },
      { id: 'box_suit', name: 'Suit Crate', desc: 'A random space suit. Already have it? Half your coins back', kind: 'box', coins: 25, pool: ['suit_white', 'suit_orange', 'suit_blue', 'suit_red', 'suit_black', 'suit_gold'] }
    ],
    preview(it) {
      if (SUITS[it.id]) return MK.prev.shirt(SUITS[it.id]);
      if (it.id === 'vip' || it.id === 'boots' || it.id === 'ticket') return rocketMesh();
      return null;
    },
    setup, reset, start, update, onOwned: suit,
    idle(dt) { idleT += dt; me.update(dt); place(dt); },
    resize() { MK.fit(MK.camera, 1000, 700, 700); place(0); }
  });
})();
