@font-face{font-family:'Fredoka';src:url(${FONT}) format('woff2');font-weight:300 700;font-display:block}
html,body{margin:0;height:100%;overflow:hidden;background:var(--mk-bg,#17171A);touch-action:none;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:Fredoka,ui-rounded,system-ui,sans-serif}
#mk{position:fixed;inset:0;width:100%;height:100%;display:block}
#mk-hud{position:fixed;left:0;right:0;top:var(--mk-t,16px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;transition:opacity .25s}
#mk-score{font-size:58px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 3px 0 var(--mk-lo)}
#mk-score.bump{animation:mkb .22s ease-out}
@keyframes mkb{40%{transform:scale(1.22)}}
#mk-lives{display:flex;gap:7px}
#mk-lives i{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 2px 0 var(--mk-lo)}
#mk-lives i.off{background:rgba(255,255,255,.3);box-shadow:none}
#mk-bar{width:min(200px,50vw);height:10px;border-radius:6px;background:rgba(255,255,255,.35);overflow:hidden}
#mk-bar b{display:block;height:100%;width:100%;background:#fff;border-radius:6px;transform-origin:left;transition:background .2s}
#mk-bar.warn b{background:#f43f5e}
#mk-hint{position:fixed;left:0;right:0;bottom:calc(var(--mk-b,16px) + 6px);text-align:center;font-size:18px;font-weight:600;color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.3);pointer-events:none;transition:opacity .4s;opacity:0}
.mk-pop{position:fixed;transform:translate(-50%,-50%);font-weight:600;font-size:26px;color:#fff;pointer-events:none;white-space:nowrap;
  text-shadow:0 3px 0 rgba(0,0,0,.25);animation:mkpop .75s ease-out forwards}
@keyframes mkpop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
#mk-praise{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:46px;font-weight:600;color:#fff;pointer-events:none;
  text-shadow:0 4px 0 var(--mk-lo);opacity:0}
#mk-praise.on{animation:mkpr .9s ease-out forwards}
@keyframes mkpr{0%{opacity:0;transform:scale(.4)}18%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
#mk-over{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;

    }
  });

  MK.init = function (c) {
    cfg = c;
    document.title = c.title;
    const r = document.documentElement.style;
    r.setProperty('--mk-c', c.color); r.setProperty('--mk-lo', c.lo || c.color); r.setProperty('--mk-bg', c.bg || '#17171A');
    cv = document.createElement('canvas'); cv.id = 'mk'; document.body.appendChild(cv);
    document.body.insertAdjacentHTML('beforeend',
      `<div id="mk-hud"><div id="mk-score">0</div><div id="mk-lives" hidden></div><div id="mk-bar" hidden><b></b></div></div>` +
      `<div id="mk-hint"></div><div id="mk-praise"></div><div id="mk-flash"></div><div id="mk-over" hidden></div>` +
      (inFrame ? '' : `<div id="mk-load">Loading ${c.title}</div>`));
    hud = { wrap: $('mk-hud'), score: $('mk-score'), lives: $('mk-lives'), bar: $('mk-bar'), hint: $('mk-hint'), praise: $('mk-praise'), over: $('mk-over'), flash: $('mk-flash') };
    hud.wrap.style.opacity = 0;
    MK.best = ((store.get().best || {})[c.id]) || 0;
    applySafe();
    addEventListener('resize', resize);
    if (!inFrame) {
      addEventListener('pointerdown', e => press('p' + e.pointerId, e.clientX, e.clientY));
      addEventListener('pointermove', e => move('p' + e.pointerId, e.clientX, e.clientY));
      addEventListener('pointerup', e => release('p' + e.pointerId));
      addEventListener('pointercancel', e => release('p' + e.pointerId));
      addEventListener('contextmenu', e => e.preventDefault());
      addEventListener('keydown', e => { if (!e.repeat && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); press('k', MK.W / 2, MK.H / 2); } });
      addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter') release('k'); });
      document.addEventListener('visibilitychange', () => setActive(!document.hidden));
    }
    loadOwned();
    send({ t: 'ready', phase: 'loading', shop: cfg.shop || [], base: !!cfg.base, baseName: cfg.baseName || '', title: cfg.title });
    runtime().then(async ({ T, K, doc }) => {
      MK.T = T; MK.Sandy = K; doc3 = doc;
      const R = MK.renderer = new T.WebGLRenderer({ canvas: cv, antialias: !touchDev, powerPreference: 'high-performance' });
      if (!K && T.ColorManagement) { T.ColorManagement.enabled = false; if ('outputColorSpace' in R) R.outputColorSpace = 'srgb'; }
      else R.outputEncoding = T.sRGBEncoding;
      R.shadowMap.enabled = true; R.shadowMap.type = T.PCFSoftShadowMap;
      const scene = MK.scene = new T.Scene();
      scene.add(MK.hemi = new T.HemisphereLight(0xfff4e0, 0x5a6a50, .85));
      const sun = MK.sun = new T.DirectionalLight(0xfff0dc, .95);
      sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.bias = -.0006;
      scene.add(sun, sun.target);
      MK.camera = new T.PerspectiveCamera(40, MK.W / MK.H, 10, 30000);
      await cfg.setup(T, scene);
      booted = true;
      if (cfg.onOwned) cfg.onOwned();
      cfg.reset();      // state first, then size the view around it
      resize();
      const ld = $('mk-load'); if (ld) ld.remove();
      MK.phase = 'ready'; send({ t: 'phase', phase: 'ready' });
      hud.wrap.style.opacity = 1;
      render();
      if (active) { awayCheck(); start(); }
      if (pvWanted) { pvWanted = false; setTimeout(sendPreviews, 300); }
    }).catch(err => { const ld = $('mk-load'); if (ld) ld.textContent = 'This game could not load'; console.error(err); });
  };
})();

/* MICROKIT END */
</script>
<script>
/* Parry Ball · Grug micro game (3D voxel, with your avatar and three bots).
   Control: tap anywhere.
   A glowing ball chases one player at a time; whoever it's after has a red ring under their feet. When it's coming
   for you, tap as it gets close to knock it away (+1). Every parry makes it faster. Tap too early and your swing
   misses (a short cooldown). The bots parry too, and sometimes miss: knock them all out to win the round (+10).
   If the ball reaches you, you're out. Shop: swords (skins), a Shield boost that saves you once. */
/* MODELS: b_stone, b_stone_dark, b_bricks_A, b_metal, b_decorative_block_blue, b_colored_block_red */
(() => {
  const RAD = 330, HIT = 34;
  let T, S, players, ball, ballM, trail = [], ringM, swordM, sword, score, rounds, cd, swingT, shield, idleT = 0;
  const SWORDS = { sword_wood: '#B07A45', sword_ice: '#93C5FD', sword_gold: '#FACC15', sword_galaxy: '#7C3AED', sword_ruby: '#ef4444', sword_emerald: '#10b981', sword_candy: '#f472b6', sword_shadow: '#1f2937', sword_sun: '#fb923c' };

  async function setup(T_, scene) {
    T = T_; S = scene;
    scene.background = MK.color('#2A2E45');
    scene.fog = new T.Fog(MK.color('#2A2E45'), 1600, 3200);
    MK.hemi.intensity = .9;
    // a round voxel arena with a blue glowing rim
    const tiles = [], rim = [], under = [];
    for (let x = -600; x <= 600; x += 100) for (let z = -600; z <= 600; z += 100) {
      const d = Math.hypot(x, z);
      if (d < 560) tiles.push([x, -50, z]); else if (d < 680) rim.push([x, -30, z]);
      if (d < 560 && d > 440) under.push([x, -150, z]);
    }
    scene.add(MK.instances('b_stone', tiles.filter((t, i) => (t[0] / 100 + t[2] / 100) % 2), 50), MK.instances('b_stone_dark', tiles.filter((t, i) => !((t[0] / 100 + t[2] / 100) % 2)), 50));
    scene.add(MK.instances('b_decorative_block_blue', rim, 50), MK.instances('b_bricks_A', under, 50));
    ringM = MK.mesh(new T.TorusGeometry(52, 5, 8, 36), MK.mat('#ef4444', { emissive: '#ef4444', emissiveIntensity: 1 }), 0, 3, 0, false); ringM.rotation.x = Math.PI / 2; scene.add(ringM);
    ballM = MK.mesh(new T.SphereGeometry(20, 20, 14), MK.mat('#fecaca', { emissive: '#ef4444', emissiveIntensity: 1.2 }), 0, 110, 0, false); scene.add(ballM);
    const tm = new T.SphereGeometry(14, 10, 8);
    for (let i = 0; i < 10; i++) { const m = MK.mesh(tm, MK.mat('#ef4444', { transparent: true, opacity: .5, emissive: '#ef4444', emissiveIntensity: .8 }).clone(), 0, -999, 0, false); scene.add(m); trail.push(m); }
    sword = new T.Group();
    swordM = MK.mesh(new T.BoxGeometry(6, 80, 12), MK.mat('#B07A45', { roughness: .3, metalness: .3 }), 0, 46, 0); sword.add(swordM);
    sword.add(MK.mesh(new T.BoxGeometry(30, 6, 14), MK.mat('#3F3F46'), 0, 6, 0), MK.mesh(new T.BoxGeometry(8, 20, 8), MK.mat('#3F3F46'), 0, -6, 0));
    // you (front) and three bots
    players = [];
    const me = await MK.avatar('player'); players.push({ a: me, ang: Math.PI / 2, you: true });
    for (let i = 0; i < 3; i++) { const b = await MK.avatar('bot', 'micro-parry-' + i); players.push({ a: b, ang: Math.PI / 2 + (i + 1) * Math.PI / 2, you: false }); }
    for (const p of players) { scene.add(p.a.object3d); p.a.play('idle'); }
    const hand = me.object3d.getObjectByName('arm_R_wrist_jnt');
    if (hand) { hand.add(sword); sword.rotation.set(0, 0, -Math.PI / 2); sword.scale.setScalar(.9); } else { me.object3d.add(sword); sword.position.set(32, 95, 18); }
    const C = MK.camera; C.position.set(0, 820, 1100); C.lookAt(0, 40, 60);
    MK.sunAt(0, 0, 0, 700);
  }
  const pos = p => new T.Vector3(Math.cos(p.ang) * RAD, 0, Math.sin(p.ang) * RAD);
  function pick(not) {
    const alive = players.filter(p => p.alive && p !== not);
    // the ball goes after you a bit more often than chance, so you get to play
    const you = alive.find(p => p.you);
    if (you && Math.random() < .45) return you;
    return alive[Math.floor(Math.random() * alive.length)];
  }
  function reset() {
    for (const p of players) { p.alive = true; p.out = 0; p.a.object3d.visible = true; p.a.object3d.scale.setScalar(1); p.a.setExpression('happy'); p.a.play('idle'); }
    ball = { p: new T.Vector3(0, 110, 0), v: 520, tgt: null, curve: Math.random() * 6 };
    ball.tgt = players[1 + Math.floor(Math.random() * 3)];
    score = 0; rounds = 0; cd = 0; swingT = 0; shield = MK.starting && MK.use('shield') ? 1 : 0;
    MK.hud.score(0); MK.hud.lives(shield ? 2 : 1, shield ? 2 : 1);
    place(0);
  }
  function start() { MK.hud.hint('Tap when the ball gets close to you'); }
  function hitBy(p) {
    // somebody parried: off it goes to someone else, faster
    ball.tgt = pick(p); ball.v = Math.min(2600, ball.v * 1.09 + 30); ball.curve = Math.random() * 6;
    const at = pos(p); ball.p.set(at.x * .85, 110, at.z * .85);
  }
  function knockOut(p) {
    p.alive = false; p.out = .6; p.a.setExpression('dizzy');
    const at = pos(p).setY(110); MK.burst(at, { n: 24, colors: ['#ef4444', '#fde047', '#ffffff'], speed: 520, size: 12, up: 1 }); MK.ring(at.clone().setY(2), { color: '#fde047', radius: 200 });
    MK.popAt(pos(p).setY(200), p.you ? 'Out!' : 'Knocked out!', '#fecaca', 28);
  }
  function update(dt) {
    idleT += dt; cd = Math.max(0, cd - dt); swingT = Math.max(0, swingT - dt);
    for (const p of players) {
      p.a.update(dt);
      if (!p.alive && p.out > 0) { p.out -= dt; const o = p.a.object3d; o.rotation.y += dt * 18; o.position.y += 500 * dt; o.scale.setScalar(Math.max(.01, p.out / .6)); if (p.out <= 0) o.visible = false; }
    }
    if (!players[0].alive) { place(dt); return; }   // you're out: the game over card is on its way
    const t = ball.tgt, tp = pos(t).setY(105);
    // the ball curves in toward its target
    const dir = tp.clone().sub(ball.p), d = dir.length();
    dir.normalize();
    const side = new T.Vector3(-dir.z, 0, dir.x).multiplyScalar(Math.sin(idleT * 3 + ball.curve) * Math.min(1, d / 400) * .5);
    ball.p.addScaledVector(dir.add(side).normalize(), ball.v * dt);
    if (t.you) {
      const reach = 90 + ball.v * .09;
      ringM.material.emissiveIntensity = d < reach ? 2 : 1;
    }
    if (d < HIT) {
      if (t.you) {
        if (shield) { shield = 0; MK.hud.lives(1, 1); MK.popAt(tp.clone().setY(220), 'Shield!', '#bfdbfe', 30); MK.shake(10); hitBy(t); }
        else { knockOut(t); MK.shake(22); MK.haptic(100); ball.v = 0; setTimeout(() => MK.over(score), 650); ball.tgt = t; }
      } else {
        // bots parry well at first, worse as the ball speeds up
        const chance = MK.clamp(1.05 - ball.v / 3000, .55, .97);
        if (Math.random() < chance) { MK.burst(ball.p, { n: 8, colors: ['#ffffff', '#fde047'], speed: 300, size: 7, glow: true, gravity: 500 }); t.a.play('jump'); setTimeout(() => t.a.play('idle'), 500); hitBy(t); }
        else {
          knockOut(t);
          if (!players.some(p => p.alive && !p.you)) {
            rounds++; score += 10; MK.hud.score(score); MK.praise('Round won! +10'); MK.haptic([20, 40, 20]);
            MK.burst(new T.Vector3(0, 120, 0), { n: 34, colors: ['#f59e0b', '#10b981', '#0ea5e9', '#f43f5e', '#ffffff'], speed: 600, size: 12, up: 1.4 }); MK.toScore(pos(players[0]).setY(150), 6);
            setTimeout(() => { for (const p of players) if (!p.you) { p.alive = true; p.out = 0; const o = p.a.object3d; o.visible = true; o.scale.setScalar(1); o.position.y = 0; p.a.setExpression('happy'); } }, 700);
            ball.tgt = players[0]; ball.v = Math.max(520, ball.v * .75); ball.p.set(0, 110, 0);
          } else hitBy(t);
        }
      }
    }
    if (MK.t > 3.5) MK.hud.hint(null, false);
    place(dt);
  }
  function place(dt) {
    for (const p of players) { if (p.alive) { const q = pos(p); p.a.object3d.position.set(q.x, 0, q.z); p.a.object3d.rotation.y = Math.atan2(-q.x, -q.z); } }
    ballM.position.copy(ball.p);
    const s = 1 + Math.sin(idleT * 20) * .08; ballM.scale.setScalar(s);
    trail.forEach((m, i) => { m.position.lerp(i ? trail[i - 1].position : ballM.position, dt ? Math.min(1, dt * 25) : 1); m.scale.setScalar(1 - i * .08); });
    if (ball.tgt) { const q = pos(ball.tgt); ringM.position.set(q.x, 3, q.z); ringM.visible = ball.tgt.alive; }
    swordM.material = MK.mat(SWORDS[MK.equipped('sword')] || '#B07A45', { roughness: .3, metalness: .3, emissive: MK.equipped('sword') === 'sword_galaxy' ? '#4c1d95' : '#000000', emissiveIntensity: .6 });
    sword.rotation.x = swingT > 0 ? -2.2 * (swingT / .25) : 0;
  }
  function tap() {
    const you = players[0]; if (!you.alive || cd > 0) return;
    swingT = .25; you.a.play('jump'); setTimeout(() => you.alive && you.a.play('idle'), 400);
    const d = ball.p.distanceTo(pos(you).setY(105)), reach = 90 + ball.v * .09;
    if (ball.tgt === you && d < reach) {
      score++; MK.hud.score(score); MK.haptic(14);
      const perfect = d < reach * .45;
      // sparks off the blade; a perfect one freezes the moment
      MK.burst(ballM.position, { n: perfect ? 22 : 12, colors: ['#fde047', '#ffffff', '#f97316'], speed: perfect ? 520 : 380, size: 8, glow: true, gravity: 500 });
      if (perfect) { score++; MK.hud.score(score); MK.praise('Perfect parry!'); MK.hitstop(.07); MK.ring(ballM.position.clone().setY(4), { color: '#fde047', radius: 170 }); MK.toScore(ballM.position, 3, '#fde047'); }
      else MK.popAt(ballM.position, '+1', '#fff', 30);
      if (score % 10 === 0 && !perfect) MK.praise('Speed ' + Math.round(ball.v / 100));
      hitBy(you);
    } else { cd = .5; MK.popAt(pos(you).setY(230), 'Too early', '#e5e7eb', 24); }
  }
  MK.init({
    id: 'parry', title: 'Parry Ball', controls: 'tap', color: '#ef4444', lo: '#b91c1c', bg: '#2A2E45', coinRate: 1,
    shop: [
      { id: 'shield', name: 'Shield', desc: 'The ball bounces off you once', kind: 'boost', coins: 25 },
      { id: 'sword_ice', name: 'Ice Sword', desc: 'A frosty blade', kind: 'skin', group: 'sword', color: '#93C5FD', coins: 60 },
      { id: 'sword_gold', name: 'Gold Sword', desc: 'Shiny and proud', kind: 'skin', group: 'sword', color: '#FACC15', coins: 200 },
      { id: 'sword_galaxy', name: 'Galaxy Sword', desc: 'Glows like the night sky', kind: 'skin', group: 'sword', color: '#7C3AED', pearls: 50 },
      { id: 'sword_ruby', name: 'Ruby Sword', desc: 'Red-hot edge', kind: 'skin', group: 'sword', color: '#ef4444', coins: 60 },
      { id: 'sword_emerald', name: 'Emerald Sword', desc: 'Forest green steel', kind: 'skin', group: 'sword', color: '#10b981', coins: 60 },
      { id: 'sword_candy', name: 'Candy Sword', desc: 'Sweet but sharp', kind: 'skin', group: 'sword', color: '#f472b6', coins: 80 },
      { id: 'sword_sun', name: 'Sunset Sword', desc: 'Warm orange glow', kind: 'skin', group: 'sword', color: '#fb923c', coins: 80 },
      { id: 'sword_shadow', name: 'Shadow Sword', desc: 'Dark as night', kind: 'skin', group: 'sword', color: '#1f2937', coins: 120 },
      { id: 'box_sword', name: 'Sword Crate', desc: 'A random one of 8. Already have it? Half your coins back', kind: 'box', coins: 35, pool: ['sword_ice', 'sword_gold', 'sword_galaxy', 'sword_ruby', 'sword_emerald', 'sword_candy', 'sword_sun', 'sword_shadow'] }
    ],
    // shop previews: the sword in its colour
    preview(it) {
      const c = SWORDS[it.id]; if (!c) return null;
      const g = new T.Group();
      g.add(MK.mesh(new T.BoxGeometry(8, 90, 14), MK.mat(c, { roughness: .3, metalness: .3, emissive: it.id === 'sword_galaxy' ? '#4c1d95' : '#000000', emissiveIntensity: .6 }), 0, 50, 0));
      g.add(MK.mesh(new T.ConeGeometry(7, 14, 4), MK.mat(c, { roughness: .3, metalness: .3 }), 0, 102, 0));
      g.add(MK.mesh(new T.BoxGeometry(34, 7, 16), MK.mat('#3F3F46'), 0, 4, 0), MK.mesh(new T.BoxGeometry(9, 24, 9), MK.mat('#3F3F46'), 0, -12, 0));
      g.rotation.z = .5; return g;
    },
    setup, reset, start, update, down: tap,
    idle(dt) { idleT += dt; for (const p of players) p.a.update(dt); place(dt); },
    resize() { MK.fit(MK.camera, 1180, 820, 1400); place(0); }
  });
})();
</script>
