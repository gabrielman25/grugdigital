@font-face{font-family:'Fredoka';src:url(${FONT}) format('woff2');font-weight:300 700;font-display:block}
html,body{margin:0;height:100%;overflow:hidden;background:var(--mk-bg,#17171A);touch-action:none;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:Fredoka,ui-rounded,system-ui,sans-serif}
#mk{position:fixed;inset:0;width:100%;height:100%;display:block}
#mk-hud{position:fixed;left:0;right:0;top:var(--mk-t,16px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;transition:opacity .25s}
#mk-score{font-size:58px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 3px 0 var(--mk-lo)}
#mk-score.bump{animation:mkb .22s ease-out}
@keyframes mkb{40%{transform:scale(1.22)}}
#mk-lives{display:flex;gap:7px}
#mk-lives i{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 2px 0 var(--mk-lo)}
#mk-lives i.off{background:rgba(255,255,255,.3);box-shadow:none}
#mk-bar{width:min(200px,50vw);height:10px;border-radius:6px;background:rgba(255,255,255,.35);overflow:hidden}
#mk-bar b{display:block;height:100%;width:100%;background:#fff;border-radius:6px;transform-origin:left;transition:background .2s}
#mk-bar.warn b{background:#f43f5e}
#mk-hint{position:fixed;left:0;right:0;bottom:calc(var(--mk-b,16px) + 6px);text-align:center;font-size:18px;font-weight:600;color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.3);pointer-events:none;transition:opacity .4s;opacity:0}
.mk-pop{position:fixed;transform:translate(-50%,-50%);font-weight:600;font-size:26px;color:#fff;pointer-events:none;white-space:nowrap;
  text-shadow:0 3px 0 rgba(0,0,0,.25);animation:mkpop .75s ease-out forwards}
@keyframes mkpop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
#mk-praise{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:46px;font-weight:600;color:#fff;pointer-events:none;
  text-shadow:0 4px 0 var(--mk-lo);opacity:0}
#mk-praise.on{animation:mkpr .9s ease-out forwards}
@keyframes mkpr{0%{opacity:0;transform:scale(.4)}18%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
#mk-over{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;

    }
  });

  MK.init = function (c) {
    cfg = c;
    document.title = c.title;
    const r = document.documentElement.style;
    r.setProperty('--mk-c', c.color); r.setProperty('--mk-lo', c.lo || c.color); r.setProperty('--mk-bg', c.bg || '#17171A');
    cv = document.createElement('canvas'); cv.id = 'mk'; document.body.appendChild(cv);
    document.body.insertAdjacentHTML('beforeend',
      `<div id="mk-hud"><div id="mk-score">0</div><div id="mk-lives" hidden></div><div id="mk-bar" hidden><b></b></div></div>` +
      `<div id="mk-hint"></div><div id="mk-praise"></div><div id="mk-flash"></div><div id="mk-over" hidden></div>` +
      (inFrame ? '' : `<div id="mk-load">Loading ${c.title}</div>`));
    hud = { wrap: $('mk-hud'), score: $('mk-score'), lives: $('mk-lives'), bar: $('mk-bar'), hint: $('mk-hint'), praise: $('mk-praise'), over: $('mk-over'), flash: $('mk-flash') };
    hud.wrap.style.opacity = 0;
    MK.best = ((store.get().best || {})[c.id]) || 0;
    applySafe();
    addEventListener('resize', resize);
    if (!inFrame) {
      addEventListener('pointerdown', e => press('p' + e.pointerId, e.clientX, e.clientY));
      addEventListener('pointermove', e => move('p' + e.pointerId, e.clientX, e.clientY));
      addEventListener('pointerup', e => release('p' + e.pointerId));
      addEventListener('pointercancel', e => release('p' + e.pointerId));
      addEventListener('contextmenu', e => e.preventDefault());
      addEventListener('keydown', e => { if (!e.repeat && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); press('k', MK.W / 2, MK.H / 2); } });
      addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter') release('k'); });
      document.addEventListener('visibilitychange', () => setActive(!document.hidden));
    }
    loadOwned();
    send({ t: 'ready', phase: 'loading', shop: cfg.shop || [], base: !!cfg.base, baseName: cfg.baseName || '', title: cfg.title });
    runtime().then(async ({ T, K, doc }) => {
      MK.T = T; MK.Sandy = K; doc3 = doc;
      const R = MK.renderer = new T.WebGLRenderer({ canvas: cv, antialias: !touchDev, powerPreference: 'high-performance' });
      if (!K && T.ColorManagement) { T.ColorManagement.enabled = false; if ('outputColorSpace' in R) R.outputColorSpace = 'srgb'; }
      else R.outputEncoding = T.sRGBEncoding;
      R.shadowMap.enabled = true; R.shadowMap.type = T.PCFSoftShadowMap;
      const scene = MK.scene = new T.Scene();
      scene.add(MK.hemi = new T.HemisphereLight(0xfff4e0, 0x5a6a50, .85));
      const sun = MK.sun = new T.DirectionalLight(0xfff0dc, .95);
      sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.bias = -.0006;
      scene.add(sun, sun.target);
      MK.camera = new T.PerspectiveCamera(40, MK.W / MK.H, 10, 30000);
      await cfg.setup(T, scene);
      booted = true;
      if (cfg.onOwned) cfg.onOwned();
      cfg.reset();      // state first, then size the view around it
      resize();
      const ld = $('mk-load'); if (ld) ld.remove();
      MK.phase = 'ready'; send({ t: 'phase', phase: 'ready' });
      hud.wrap.style.opacity = 1;
      render();
      if (active) { awayCheck(); start(); }
      if (pvWanted) { pvWanted = false; setTimeout(sendPreviews, 300); }
    }).catch(err => { const ld = $('mk-load'); if (ld) ld.textContent = 'This game could not load'; console.error(err); });
  };
})();

/* MICROKIT END */
</script>
<script>
/* Pizza Rush · Grug micro game (3D, with your avatar).
   Control: tap anywhere.
   Pizzas ride a belt under the topping dropper. Each pizza has an order ticket (say, 3 toppings). Tap to drop a
   topping; it has to land on the pizza. Fill the order before the pizza leaves the counter: +1 per topping, +5 for a
   finished pizza (+3 more if every topping landed near the middle). A pizza that leaves unfinished costs a heart
   (three hearts). The belt speeds up. Shop: Bigger Pizzas, Slow Belt (a run), Kitchen Cat (pet: +10% coins). */
/* MODELS: countertop_straight_A, stove, fridge, table_A, pot, kettle, plate, b_crate, pet_cat, pet_dog, pet_bunny, pet_chick, pet_pig, pet_parrot */
(() => {
  // kitchen pets: coin bonus
  const KPETS = { cat: [.1], dog: [.1], bunny: [.12], chick: [.12], pig: [.15], parrot: [.2] };
  function showPet() { const k = MK.equipped('pet'); for (const n in kpets) kpets[n].object3d.visible = n === k; if (kpets[k]) { catA = kpets[k]; cat = catA.object3d; } }
  const BELT_Y = 100, DROP_Y = 420, X_DROP = 0;
  const TOPS = { pep: '#dc2626', mush: '#f5f0e6', olive: '#1f2937', basil: '#16a34a' };
  let T, S, me, kpets = {}, cat, catA, belt, beltTex, dropper, loaded, pizzas = [], falling = [], splats = [], score, lives, spawnT, v, kinds, idleT = 0;

  function pizzaMesh() {
    const g = new T.Group(), r = 140 * (1 + .1 * MK.owned('big'));   // big pies: easy to hit, satisfying to fill
    g.add(MK.mesh(new T.CylinderGeometry(r, r, 12, 36), MK.mat('#e2b26b', { roughness: .8 }), 0, 6, 0));
    g.add(MK.mesh(new T.CylinderGeometry(r - 12, r - 12, 13, 36), MK.mat('#dc4a26', { roughness: .6 }), 0, 6, 0, false));
    g.add(MK.mesh(new T.CylinderGeometry(r - 22, r - 22, 14, 36), MK.mat('#fde68a', { roughness: .5 }), 0, 7, 0, false));
    g.r = r; return g;
  }
  function topping(k) { const m = topping0(k); m.scale.multiplyScalar(1.5); m.userData.k = k; return m; }
  function topping0(k) {
    if (k === 'mush') { const m = MK.mesh(new T.SphereGeometry(13, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), MK.mat(TOPS.mush)); return m; }
    if (k === 'olive') { const m = MK.mesh(new T.TorusGeometry(8, 4, 6, 14), MK.mat(TOPS.olive)); m.rotation.x = Math.PI / 2; return m; }
    if (k === 'basil') { const m = MK.mesh(new T.SphereGeometry(13, 10, 6), MK.mat(TOPS.basil)); m.scale.set(1.3, .3, .8); return m; }
    return MK.mesh(new T.CylinderGeometry(14, 14, 4, 16), MK.mat(TOPS.pep, { roughness: .5 }));
  }
  async function setup(T_, scene) {
    T = T_; S = scene;
    scene.background = MK.color('#FFE9D2');
    // the kitchen: Tiny Treats counters, stove and fridge along the back
    scene.add(MK.mesh(new T.BoxGeometry(3000, 40, 1600), MK.mat('#e9d5b7', { roughness: .9 }), 0, -20, 0));
    scene.add(MK.mesh(new T.BoxGeometry(3000, 1200, 20), MK.mat('#fde4cc', { roughness: 1 }), 0, 600, -420, false));
    const back = [['countertop_straight_A', -520], ['stove', -260], ['countertop_straight_A', 0], ['countertop_straight_A', 260], ['fridge', 540]];
    for (const [n, x] of back) { const m = MK.model(n, null, { scale: 130 }); m.position.set(x, 0, -330); scene.add(m); }
    const pot = MK.model('pot', null, { scale: 110 }); pot.position.set(-260, 170, -320); scene.add(pot);
    const kettle = MK.model('kettle', null, { scale: 110 }); kettle.position.set(260, 130, -330); scene.add(kettle);
    // the belt (front) with scrolling stripes
    const c = MK.canvas(64, 64), g = c.getContext('2d'); g.fillStyle = '#3f3f46'; g.fillRect(0, 0, 64, 64); g.fillStyle = '#52525b'; g.fillRect(0, 0, 10, 64);
    beltTex = new T.CanvasTexture(c); beltTex.wrapS = beltTex.wrapT = T.RepeatWrapping; beltTex.repeat.set(30, 1); beltTex.encoding = T.sRGBEncoding;
    belt = MK.mesh(new T.BoxGeometry(2400, 16, 330), new T.MeshStandardMaterial({ map: beltTex, roughness: .7 }), 0, BELT_Y - 8, 60); scene.add(belt);
    scene.add(MK.mesh(new T.BoxGeometry(2400, BELT_Y - 16, 310), MK.mat('#a1a1aa', { roughness: .5, metalness: .3 }), 0, (BELT_Y - 16) / 2, 60));
    // the dropper: a red hopper that holds the next topping
    dropper = new T.Group(); dropper.position.set(X_DROP, DROP_Y, 60); scene.add(dropper);
    dropper.add(MK.mesh(new T.CylinderGeometry(46, 24, 70, 18), MK.mat('#ef4444', { roughness: .4 }), 0, 30, 0));
    dropper.add(MK.mesh(new T.BoxGeometry(16, 400, 16), MK.mat('#a1a1aa', { metalness: .4, roughness: .3 }), 0, 260, -40));
    me = await MK.avatar('player');
    me.object3d.position.set(-400, 0, -150); me.object3d.rotation.y = .35; scene.add(me.object3d);
    // kitchen pets (Kenney Cube Pets, CC0): the one you equip sits on the back counter
    for (const k of Object.keys(KPETS)) { const a = MK.pet('pet_' + k, 90); a.object3d.position.set(70, 130, -320); a.object3d.visible = false; scene.add(a.object3d); kpets[k] = a; }
    catA = kpets.cat; cat = catA.object3d;
    const C = MK.camera; C.position.set(0, 560, 940); C.lookAt(0, 190, 40);
    MK.sunAt(0, 0, 0, 800);
  }
  function load() { loaded = topping(kinds[Math.floor(Math.random() * kinds.length)]); loaded.userData.k = loaded.userData.k || 'x'; dropper.add(loaded); loaded.position.set(0, -14, 0); }
  function newPizza() {
    const need = Math.min(5, 2 + Math.floor(score / 25) + (Math.random() < .4 ? 1 : 0));
    const m = pizzaMesh(); m.position.set(-1100, BELT_Y, 60); S.add(m);
    pizzas.push({ m, x: -1100, need, got: 0, tops: [], off: 0 });
  }
  function reset() {
    for (const p of pizzas) S.remove(p.m); for (const f of falling) S.remove(f.m); for (const s of splats) S.remove(s);
    pizzas = []; falling = []; splats = []; score = 0; lives = 3; spawnT = 0; kinds = ['pep', 'mush', 'olive', 'basil'];
    v = 230 * (MK.starting && MK.use('slow') ? .8 : 1);
    if (loaded) dropper.remove(loaded); load();
    showPet();
    newPizza(); pizzas[0].x = -500;
    me.play('idle'); me.setExpression('happy');
    MK.hud.score(0); MK.hud.lives(3, 3);
    sync(0);
  }
  function start() { MK.hud.hint('Tap to drop the topping on the pizza'); }
  function update(dt) {
    idleT += dt; me.update(dt);
    v = Math.min(520, v + dt * 2.2);
    beltTex.offset.x -= v * dt / 2400 * 30;
    spawnT -= dt;
    const last = pizzas[pizzas.length - 1];
    if (!last || last.x > -1100 + 620) newPizza();
    for (const p of pizzas) p.x += v * dt;
    // toppings fall straight down
    for (const f of falling) {
      f.vy -= 2400 * dt; f.y += f.vy * dt; f.m.position.set(X_DROP, f.y, 60); f.m.rotation.y += dt * 6;
      if (!f.done && f.y <= BELT_Y + 18) {
        f.done = true;
        const p = pizzas.find(p => Math.abs(p.x - X_DROP) < p.m.r - 6 && p.got < p.need);
        if (p) {
          const off = X_DROP - p.x; p.got++; p.off = Math.max(p.off, Math.abs(off));
          f.m.position.set(off, 16, MK.rand(-p.m.r * .4, p.m.r * .4)); p.m.add(f.m); f.stuck = true;
          const hit = new T.Vector3(X_DROP, BELT_Y + 20, 60); MK.burst(hit, { n: 8, color: TOPS[f.m.userData.k] || '#fff', speed: 200, size: 9 }); MK.ring(hit, { color: '#fff7ed', radius: 70, life: .3 });
          score++; MK.hud.score(score); MK.haptic(10);
          if (p.got === p.need) {
            const neat = p.off < p.m.r * .45; score += 5 + (neat ? 3 : 0); MK.hud.score(score);
            const at = new T.Vector3(p.x, BELT_Y + 40, 60);
            MK.sparkle(at, { n: neat ? 22 : 12, speed: 300 }); MK.burst(at, { n: 14, colors: ['#fde68a', '#dc4a26', '#16a34a', '#fff'], speed: 380, size: 10, up: 1 }); MK.toScore(at, neat ? 6 : 3);
            if (neat) { MK.praise('Perfect pizza! +8'); MK.hitstop(.07); } else MK.popAt(new T.Vector3(p.x, 260, 60), 'Order up! +5', '#fff', 30);
            me.setExpression('laugh'); setTimeout(() => me.setExpression('happy'), 700); MK.haptic([15, 30, 15]);
          }
        } else { MK.popAt(new T.Vector3(X_DROP, 200, 60), 'Splat', '#fecaca', 24); MK.haptic(25); MK.burst(new T.Vector3(X_DROP, BELT_Y + 10, 60), { n: 12, color: TOPS[f.m.userData.k] || '#dc2626', speed: 260, size: 8, up: .4 }); f.m.scale.set(1.6, .4, 1.6); splats.push(f.m); f.stuck = true; f.m.position.y = BELT_Y + 2; f.splat = X_DROP; }
      }
    }
    falling = falling.filter(f => !f.stuck);
    for (const s of splats) s.position.x += v * dt;
    while (splats.length && splats[0].position.x > 1200) S.remove(splats.shift());
    // a pizza leaving the counter unfinished costs a heart
    for (const p of pizzas) if (!p.gone && p.x > 820) {
      p.gone = true;
      if (p.got < p.need) {
        lives--; MK.hud.lives(lives, 3); MK.shake(12); MK.haptic(70); me.setExpression('pout'); setTimeout(() => me.setExpression('happy'), 800);
        MK.popAt(new T.Vector3(700, 260, 60), 'Order wrong!', '#fecaca', 28); MK.burst(new T.Vector3(760, BELT_Y + 30, 60), { n: 14, colors: ['#9ca3af', '#d1d5db'], speed: 160, size: 16, gravity: -150, life: 1 }); MK.flash('#ef4444', .2);
        if (lives <= 0) { MK.over(score); return; }
      }
    }
    pizzas = pizzas.filter(p => { if (p.x > 1250) { S.remove(p.m); return false; } return true; });
    if (MK.t > 3) MK.hud.hint(null, false);
    sync(dt);
  }
  // order tickets float over each pizza
  const tickets = [];
  function sync(dt) {
    for (const p of pizzas) p.m.position.x = p.x;
    if (loaded) loaded.position.y = -14 + Math.sin(idleT * 6) * 2;
    let i = 0;
    for (const p of pizzas) {
      if (p.x < -900 || p.x > 900) continue;
      let t = tickets[i]; if (!t) { t = document.createElement('div'); t.style.cssText = 'position:fixed;transform:translate(-50%,-100%);background:#fff;color:#1E1B16;border-radius:12px;padding:3px 9px;font:600 16px Fredoka,system-ui,sans-serif;pointer-events:none;white-space:nowrap'; document.body.appendChild(t); tickets[i] = t; }
      const s = MK.project(new T.Vector3(p.x, BELT_Y + 90, 60));
      t.style.left = s.x + 'px'; t.style.top = s.y + 'px'; t.style.display = '';
      t.textContent = p.got >= p.need ? 'Done' : p.got + ' / ' + p.need; t.style.background = p.got >= p.need ? '#bbf7d0' : '#fff';
      i++;
    }
    for (; i < tickets.length; i++) tickets[i].style.display = 'none';
    if (cat && cat.visible) { catA.update(dt || 0); cat.rotation.y = Math.sin(idleT * .6) * .35; }
  }
  MK.init({
    id: 'pizza', title: 'Pizza Rush', controls: 'tap', color: '#f97316', lo: '#c2410c', bg: '#FFE9D2', coinRate: .6,
    coinBonus: () => (KPETS[MK.equipped('pet')] || [0])[0],
    offline: { rate: () => 25 * MK.owned('bike'), cap: () => 6, note: 'deliveries made while you were away' },
    shop: [
      { id: 'big', name: 'Bigger Pizzas', desc: 'Pizzas 10% wider per level', kind: 'upgrade', coins: 50, grow: 1.8, max: 4 },
      { id: 'bike', name: 'Delivery Bike', desc: 'Earn 25 coins an hour while you\u2019re away (6 hours max)', kind: 'upgrade', coins: 70, grow: 1.9, max: 5 },
      { id: 'slow', name: 'Slow Belt', desc: 'The belt starts 20% slower for one run', kind: 'boost', coins: 20 },
      { id: 'cat', name: 'Kitchen Cat', desc: 'Sits by the belt · +10% coins', kind: 'pet', group: 'pet', color: '#9ca3af', coins: 120 },
      { id: 'dog', name: 'Kitchen Dog', desc: 'Loyal helper · +10% coins', kind: 'pet', group: 'pet', color: '#d6a46a', coins: 120 },
      { id: 'bunny', name: 'Kitchen Bunny', desc: 'Hops for joy · +12% coins', kind: 'pet', group: 'pet', color: '#f5f5f4', coins: 160 },
      { id: 'chick', name: 'Kitchen Chick', desc: 'Tiny and proud · +12% coins', kind: 'pet', group: 'pet', color: '#fde047', coins: 160 },
      { id: 'pig', name: 'Kitchen Pig', desc: 'Loves leftovers · +15% coins', kind: 'pet', group: 'pet', color: '#f9a8d4', coins: 220 },
      { id: 'parrot', name: 'Kitchen Parrot', desc: 'Shouts the orders · +20% coins', kind: 'pet', group: 'pet', color: '#22c55e', pearls: 40 },
      { id: 'box_pet', name: 'Pet Crate', desc: 'A random kitchen pet. Already have it? Half your coins back', kind: 'box', coins: 60, pool: ['cat', 'dog', 'bunny', 'chick', 'pig', 'parrot'] }
    ],
    // shop previews: the kitchen pet itself, and a pizza for Bigger Pizzas
    preview(it) {
      if (KPETS[it.id]) return MK.pet('pet_' + it.id, 100).object3d;
      if (it.id === 'big') { const g = new T.Group(); g.add(MK.mesh(new T.CylinderGeometry(50, 50, 8, 32), MK.mat('#e2b26b')), MK.mesh(new T.CylinderGeometry(44, 44, 9, 32), MK.mat('#dc4a26'), 0, 1, 0), MK.mesh(new T.CylinderGeometry(38, 38, 10, 32), MK.mat('#fde68a'), 0, 2, 0)); for (let i = 0; i < 6; i++) g.add(MK.mesh(new T.CylinderGeometry(7, 7, 3, 12), MK.mat('#dc2626'), Math.cos(i) * 24, 8, Math.sin(i) * 24)); g.rotation.x = .5; return g; }
      return null;
    },
    setup, reset, start, update,
    // every tap drops a topping at once: the next one is loaded the same instant (no cooldown)
    down() { if (!loaded) load(); const m = loaded; dropper.remove(m); S.add(m); falling.push({ m, y: DROP_Y - 14, vy: -420 }); loaded = null; MK.haptic(5); load(); dropper.scale.set(1.15, .85, 1.15); setTimeout(() => dropper.scale.set(1, 1, 1), 70); },
    onOwned() { if (cat) showPet(); },
    idle(dt) { idleT += dt; me.update(dt); sync(dt); },
    resize() { MK.fit(MK.camera, 1000, 700, 1000); sync(0); }
  });
})();
