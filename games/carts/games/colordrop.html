/* MicroKit v4 · the shared layer every Grug micro game carries (3D).

   What it gives a game:
   - three.js + SandyKit. Inside the feed they are borrowed from the feed (loaded once for every game). On its own, the
     game loads the site's runtime itself. If the avatar runtime can't load, plain three.js is used and avatars become
     simple stand-in figures, so the game always plays.
   - a renderer on a full-screen canvas, scene, lights, a frame loop that only runs while the game is on screen.
   - input: one thing only, a press anywhere on the screen (tap or hold). MK.held says if it's down; down() and up()
     fire as it goes down and comes back up. Where the finger is doesn't matter.
   - no start screen: a run starts the moment the game is on screen. Game over shows the score and starts again by
     itself after a moment (or on a tap).
   - a HUD (score, lives, time bar, hints), pop-up text, praise, confetti on a new best.
   - juice: voxel particle bursts, sparkles, shock rings, sparks that fly to the score, screen flash, hit-stop.

@font-face{font-family:'Fredoka';src:url(${FONT}) format('woff2');font-weight:300 700;font-display:block}
html,body{margin:0;height:100%;overflow:hidden;background:var(--mk-bg,#17171A);touch-action:none;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:Fredoka,ui-rounded,system-ui,sans-serif}
#mk{position:fixed;inset:0;width:100%;height:100%;display:block}
#mk-hud{position:fixed;left:0;right:0;top:var(--mk-t,16px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;transition:opacity .25s}
#mk-score{font-size:58px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 3px 0 var(--mk-lo)}
#mk-score.bump{animation:mkb .22s ease-out}
@keyframes mkb{40%{transform:scale(1.22)}}
#mk-lives{display:flex;gap:7px}
#mk-lives i{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 2px 0 var(--mk-lo)}
#mk-lives i.off{background:rgba(255,255,255,.3);box-shadow:none}
#mk-bar{width:min(200px,50vw);height:10px;border-radius:6px;background:rgba(255,255,255,.35);overflow:hidden}
#mk-bar b{display:block;height:100%;width:100%;background:#fff;border-radius:6px;transform-origin:left;transition:background .2s}
#mk-bar.warn b{background:#f43f5e}
#mk-hint{position:fixed;left:0;right:0;bottom:calc(var(--mk-b,16px) + 6px);text-align:center;font-size:18px;font-weight:600;color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.3);pointer-events:none;transition:opacity .4s;opacity:0}
.mk-pop{position:fixed;transform:translate(-50%,-50%);font-weight:600;font-size:26px;color:#fff;pointer-events:none;white-space:nowrap;
  text-shadow:0 3px 0 rgba(0,0,0,.25);animation:mkpop .75s ease-out forwards}
@keyframes mkpop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
#mk-praise{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:46px;font-weight:600;color:#fff;pointer-events:none;
  text-shadow:0 4px 0 var(--mk-lo);opacity:0}
#mk-praise.on{animation:mkpr .9s ease-out forwards}
@keyframes mkpr{0%{opacity:0;transform:scale(.4)}18%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
#mk-over{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;

    }
  });

  MK.init = function (c) {
    cfg = c;
    document.title = c.title;
    const r = document.documentElement.style;
    r.setProperty('--mk-c', c.color); r.setProperty('--mk-lo', c.lo || c.color); r.setProperty('--mk-bg', c.bg || '#17171A');
    cv = document.createElement('canvas'); cv.id = 'mk'; document.body.appendChild(cv);
    document.body.insertAdjacentHTML('beforeend',
      `<div id="mk-hud"><div id="mk-score">0</div><div id="mk-lives" hidden></div><div id="mk-bar" hidden><b></b></div></div>` +
      `<div id="mk-hint"></div><div id="mk-praise"></div><div id="mk-flash"></div><div id="mk-over" hidden></div>` +
      (inFrame ? '' : `<div id="mk-load">Loading ${c.title}</div>`));
    hud = { wrap: $('mk-hud'), score: $('mk-score'), lives: $('mk-lives'), bar: $('mk-bar'), hint: $('mk-hint'), praise: $('mk-praise'), over: $('mk-over'), flash: $('mk-flash') };
    hud.wrap.style.opacity = 0;
    MK.best = ((store.get().best || {})[c.id]) || 0;
    applySafe();
    addEventListener('resize', resize);
    if (!inFrame) {
      addEventListener('pointerdown', e => press('p' + e.pointerId, e.clientX, e.clientY));
      addEventListener('pointermove', e => move('p' + e.pointerId, e.clientX, e.clientY));
      addEventListener('pointerup', e => release('p' + e.pointerId));
      addEventListener('pointercancel', e => release('p' + e.pointerId));
      addEventListener('contextmenu', e => e.preventDefault());
      addEventListener('keydown', e => { if (!e.repeat && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); press('k', MK.W / 2, MK.H / 2); } });
      addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter') release('k'); });
      document.addEventListener('visibilitychange', () => setActive(!document.hidden));
    }
    loadOwned();
    send({ t: 'ready', phase: 'loading', shop: cfg.shop || [], base: !!cfg.base, baseName: cfg.baseName || '', title: cfg.title });
    runtime().then(async ({ T, K, doc }) => {
      MK.T = T; MK.Sandy = K; doc3 = doc;
      const R = MK.renderer = new T.WebGLRenderer({ canvas: cv, antialias: !touchDev, powerPreference: 'high-performance' });
      if (!K && T.ColorManagement) { T.ColorManagement.enabled = false; if ('outputColorSpace' in R) R.outputColorSpace = 'srgb'; }
      else R.outputEncoding = T.sRGBEncoding;
      R.shadowMap.enabled = true; R.shadowMap.type = T.PCFSoftShadowMap;
      const scene = MK.scene = new T.Scene();
      scene.add(MK.hemi = new T.HemisphereLight(0xfff4e0, 0x5a6a50, .85));
      const sun = MK.sun = new T.DirectionalLight(0xfff0dc, .95);
      sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.bias = -.0006;
      scene.add(sun, sun.target);
      MK.camera = new T.PerspectiveCamera(40, MK.W / MK.H, 10, 30000);
      await cfg.setup(T, scene);
      booted = true;
      if (cfg.onOwned) cfg.onOwned();
      cfg.reset();      // state first, then size the view around it
      resize();
      const ld = $('mk-load'); if (ld) ld.remove();
      MK.phase = 'ready'; send({ t: 'phase', phase: 'ready' });
      hud.wrap.style.opacity = 1;
      render();
      if (active) { awayCheck(); start(); }
      if (pvWanted) { pvWanted = false; setTimeout(sendPreviews, 300); }
    }).catch(err => { const ld = $('mk-load'); if (ld) ld.textContent = 'This game could not load'; console.error(err); });
  };
})();

/* MICROKIT END */
</script>
<script>
/* Color Drop · Grug micro game (3D voxel, with your avatar and four pets) · control: hold anywhere to walk, let go to stop.
   You walk round a ring painted over a floor of coloured blocks; every press starts with a hop, which carries you over a
   gap for a moment. A colour is called and a timer runs: stop on a block
   of that colour before it ends. Every other block drops away, and so does anyone standing on one. Then the floor comes
   back in new colours and it goes again, a little faster. Survive a round for +1; every pet that falls while you're
   still standing is +2. Three lives. The pets pick their own blocks, and don't always get it right.
   Blocks: KayKit Block Bits (CC0). Pets: Kenney Cube Pets (CC0). */
/* MODELS: b_colored_block_red, b_colored_block_blue, b_colored_block_green, b_colored_block_yellow, b_stone, pet_bunny, pet_pig, pet_chick, pet_penguin */
(() => {
  const N = 8, TILE = 100, HALF = (N - 1) * TILE / 2, RING = 240;
  const COLS = [{ k: 'red', n: 'RED', m: 'b_colored_block_red', c: '#ef4444' }, { k: 'blue', n: 'BLUE', m: 'b_colored_block_blue', c: '#3b82f6' },
    { k: 'green', n: 'GREEN', m: 'b_colored_block_green', c: '#22c55e' }, { k: 'yellow', n: 'YELLOW', m: 'b_colored_block_yellow', c: '#facc15' }];
  const PETS = ['bunny', 'pig', 'chick', 'penguin'];
  const SHIRTS = { shirt_red: '#ef4444', shirt_blue: '#3b82f6', shirt_green: '#22c55e', shirt_yellow: '#facc15', shirt_purple: '#8b5cf6', shirt_rainbow: '#ec4899' };
  function shirt() { const id = MK.equipped('shirt'); if (!me || !me.apply || !me.getConfig) return; try { const c = me.getConfig(); if (!me._own) me._own = { top: c.top, shirt: c.outfit.shirt }; if (id && SHIRTS[id]) me.apply({ top: null, outfit: Object.assign({}, c.outfit, { shirt: SHIRTS[id] }) }); else me.apply({ top: me._own.top, outfit: Object.assign({}, c.outfit, { shirt: me._own.shirt }) }); } catch (e) { } }
  let dead = false, T, S, me, tiles = [], geos = [], ringM, arrows, bots = [], th, py, vy, fallT, lives, score, round, phase, pt, called, balloon, idleT = 0, el = {};

  const cellOf = (x, z) => { const i = Math.round((x + HALF) / TILE), j = Math.round((z + HALF) / TILE); return i >= 0 && i < N && j >= 0 && j < N ? tiles[j * N + i] : null; };
  const ringPos = a => new T.Vector3(Math.sin(a) * RING, 0, Math.cos(a) * RING);

  async function setup(T_, scene) {
    T = T_; S = scene;
    scene.background = MK.color('#9ED8FF'); scene.fog = new T.Fog(MK.color('#9ED8FF'), 2400, 5200);
    el = { call: document.getElementById('call'), sw: document.querySelector('#call i'), word: document.querySelector('#call b'), bar: document.querySelector('#call u') };
    // one mesh per block; recolouring a block just swaps its geometry (same texture, different colour square)
    for (const c of COLS) geos.push(MK.model(c.m, null, { scale: 50 }).geometry);
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const m = MK.model(COLS[0].m, null, { scale: 50 }); const x = -HALF + i * TILE, z = -HALF + j * TILE;
      m.position.set(x, -50, z); scene.add(m); tiles.push({ m, x, z, c: 0, y: 0, vy: 0, gone: false });
    }
    // a stone rim far below hints at the drop; the walking ring is painted on top
    const rim = []; for (let k = 0; k < 40; k++) { const a = k / 40 * Math.PI * 2; rim.push([Math.sin(a) * 900, -650, Math.cos(a) * 900, a, 1.5]); }
    scene.add(MK.instances('b_stone', rim, 50));
    ringM = new T.Mesh(new T.RingGeometry(RING - 14, RING + 14, 64), new T.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .55, depthWrite: false }));
    ringM.rotation.x = -Math.PI / 2; ringM.position.y = 2; scene.add(ringM);
    arrows = new T.Group(); scene.add(arrows);
    for (let k = 0; k < 8; k++) { const a = MK.mesh(new T.ConeGeometry(12, 26, 3), new T.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .8 }), 0, 4, 0, false); a.userData.a = k / 8 * Math.PI * 2; arrows.add(a); }
    me = await MK.avatar('player'); scene.add(me.object3d);
    PETS.forEach((k, i) => { const a = MK.pet('pet_' + k, 70, { anim: 'idle' }); scene.add(a.object3d); bots.push({ a, k }); });
  }
  function paint() {
    // new colours; then make sure the called colour turns up all round the ring
    for (const t of tiles) { t.c = Math.floor(Math.random() * COLS.length); t.m.geometry = geos[t.c]; }
    called = Math.floor(Math.random() * COLS.length);
    let since = 0;
    for (let k = 0; k < 64; k++) {
      const q = ringPos(k / 64 * Math.PI * 2), t = cellOf(q.x, q.z);
      if (!t) continue;
      if (t.c === called) since = 0; else if (++since > 9) { t.c = called; t.m.geometry = geos[called]; since = 0; }
    }
  }
  function newRound() {
    round++; phase = 'call'; pt = 0;
    if (dead) { dead = false; py = 0; me.object3d.visible = true; me.setExpression('happy'); const q = ringPos(th); MK.sparkle(q.clone().setY(80), { n: 14 }); MK.ring(q, { color: '#ffffff', radius: 90 }); }
    paint();
    const C = COLS[called]; el.sw.style.background = C.c; el.word.textContent = C.n; el.call.hidden = false;
    el.call.classList.remove('pop'); void el.call.offsetWidth; el.call.classList.add('pop'); MK.haptic(10);
    // the pets choose a block of the colour (after a moment, and not always the right one)
    for (const b of bots) {
      if (b.out > 0) { b.out--; if (b.out === 0) { b.in = true; b.y = 500; b.vy = 0; const t = tiles[Math.floor(Math.random() * tiles.length)]; b.x = t.x; b.z = t.z; } continue; }
      const good = tiles.filter(t => t.c === called), wrong = Math.random() < .12 + round * .01;
      const pool = wrong ? tiles.filter(t => t.c !== called) : good;
      pool.sort((p, q) => Math.hypot(p.x - b.x, p.z - b.z) - Math.hypot(q.x - b.x, q.z - b.z));
      b.goal = pool[Math.floor(Math.random() * Math.min(3, pool.length))]; b.wait = MK.rand(.2, .9);
    }
  }
  const limit = () => Math.max(1.35, 3.3 - round * .12) + (MK.owned('slowmo') ? .6 : 0);
  function reset() {
    lives = 3; score = 0; round = 0; th = 0; py = 0; vy = 0; fallT = 0;
    balloon = MK.starting && MK.use('balloon');
    for (const t of tiles) { t.gone = false; t.y = 0; t.vy = 0; t.m.visible = true; t.m.position.y = -50; t.m.rotation.set(0, 0, 0); }
    dead = false; me.object3d.visible = true;
    bots.forEach((b, i) => { const t = tiles[[9, 14, 49, 54][i]]; b.x = t.x; b.z = t.z; b.y = 0; b.vy = 0; b.out = 0; b.in = false; b.fall = 0; b.a.object3d.visible = true; });
    MK.hud.score(0); MK.hud.lives(3, 3);
    newRound(); place(0);
  }
  function start() { MK.hud.hint(balloon ? 'Balloon ready · hold to walk, stop on the colour' : 'Hold to walk · stop on the colour'); }
  const speed = () => 280 * (1 + .08 * MK.owned('shoes')) * (1 + Math.min(.4, round * .02));
  function drop() {
    phase = 'drop'; pt = 0; el.call.hidden = true;
    for (const t of tiles) if (t.c !== called) { t.gone = true; t.vy = MK.rand(0, 120); }
    MK.shake(6); MK.haptic(30);
    // did you make it?
    const p = ringPos(th), mine = cellOf(p.x, p.z);
    if (dead || py > 0) { }   // mid-hop: you're judged when you land
    else if (!mine || mine.gone) {
      if (balloon) { balloon = false; MK.popAt(p.clone().setY(220), 'Balloon!', '#e0f2fe', 30); MK.sparkle(p.clone().setY(150), { n: 16 }); py = .01; vy = 0; fallT = -1; }
      else { fallT = .01; vy = 0; MK.flash('#ef4444', .25); me.setExpression('scared'); MK.popAt(p.clone().setY(220), 'Wrong colour!', '#fecaca', 28); }
    } else {
      score++; MK.hud.score(score); MK.sparkle(p.clone().setY(60), { n: 10, color: COLS[called].c }); MK.toScore(p.clone().setY(120), 2, COLS[called].c);
      if (round % 5 === 0) MK.praise('Round ' + round + '!');
    }
    for (const b of bots) {
      if (b.out || b.fall) continue;
      const t = cellOf(b.x, b.z);
      if (!t || t.gone) { b.fall = .01; b.vy = 0; if (!dead && (!fallT || fallT < 0)) { score += 2; MK.hud.score(score); MK.popAt(new T.Vector3(b.x, 140, b.z), '+2', '#fde68a', 24); } }
    }
  }
  function update(dt) {
    idleT += dt; pt += dt; me.update(dt * (MK.held && phase !== 'drop' ? 1.7 : 1));
    // you: hold to walk round the ring (not while you're falling)
    if (fallT > 0) {
      fallT += dt; vy -= 2600 * dt; py += vy * dt;
      if (fallT > .9) {
        // out until the next round starts
        lives--; MK.hud.lives(lives, 3); fallT = 0; vy = 0; dead = true; me.object3d.visible = false;
        if (lives <= 0) { MK.over(score); return; }
      }
    } else if (fallT < 0) { fallT = 0; }
    else if (dead) { }
    else {
      // a hop (from the press) carries you over the gaps for a moment
      if (py > 0 || vy > 0) { vy -= 2000 * dt; py += vy * dt; if (py <= 0) { py = 0; vy = 0; MK.burst(ringPos(th).setY(4), { n: 5, color: '#ffffff', speed: 120, size: 6, up: .2 }); } }
    }
    if (dead || fallT) { }
    else if (MK.held) { th += speed() / RING * dt; me.play('walk'); }
    else me.play('idle');
    // walking onto a hole after the drop is a fall too
    if (!fallT && !dead && py <= 0 && (phase === 'drop' || phase === 'rise')) { const q = ringPos(th), t = cellOf(q.x, q.z); if (!t || t.gone || t.y < -60) { fallT = .01; vy = 0; me.setExpression('scared'); MK.flash('#ef4444', .2); } }
    if (phase === 'call') {
      const L = limit(); el.bar.style.transform = `scaleX(${Math.max(0, 1 - pt / L)})`;
      if (pt >= L) drop();
    } else if (phase === 'drop') {
      for (const t of tiles) if (t.gone) { t.vy += 1600 * dt; t.y -= t.vy * dt; t.m.position.y = -50 + t.y; t.m.rotation.x = t.y * .0015; }
      if (pt > 1.3) {
        phase = 'rise'; pt = 0;
        for (const t of tiles) if (t.gone) { t.gone = false; t.y = -700; t.m.rotation.set(0, 0, 0); }
        for (const b of bots) if (b.fall) { b.fall = 0; b.out = 2; b.a.object3d.visible = false; }
      }
    } else if (phase === 'rise') {
      for (const t of tiles) if (t.y < 0) { t.y = Math.min(0, t.y + 1800 * dt); t.m.position.y = -50 + t.y; if (t.y === 0) MK.burst(new T.Vector3(t.x, 2, t.z), { n: 2, color: '#ffffff', speed: 80, size: 6, up: .2 }); }
      if (pt > .5) newRound();
    }
    // pets
    for (const b of bots) {
      b.a.update(dt);
      const o = b.a.object3d;
      if (b.out > 0 && !b.in) continue;
      if (b.in) { b.vy -= 2000 * dt; b.y = Math.max(0, b.y + b.vy * dt); if (b.y === 0) { b.in = false; o.visible = true; MK.burst(new T.Vector3(b.x, 4, b.z), { n: 6, color: '#ffffff', speed: 140, size: 7 }); } o.visible = true; }
      else if (b.fall) { b.fall += dt; b.vy -= 2600 * dt; b.y += b.vy * dt; o.rotation.z += dt * 6; }
      else if (phase === 'call' && b.goal) {
        if ((b.wait -= dt) <= 0) { const dx = b.goal.x - b.x, dz = b.goal.z - b.z, d = Math.hypot(dx, dz); if (d > 4) { const s = Math.min(d, 300 * dt); b.x += dx / d * s; b.z += dz / d * s; o.rotation.y = Math.atan2(dx, dz); b.a.play('run'); } else b.a.play('idle'); }
      } else b.a.play('idle');
      o.position.set(b.x, b.y, b.z); if (!b.fall) o.rotation.z = 0;
    }
    if (MK.t > 4) MK.hud.hint(null, false);
    place(dt);
  }
  function place(dt) {
    const p = ringPos(th);
    me.object3d.position.set(p.x, py, p.z); me.object3d.rotation.y = Math.atan2(Math.cos(th), -Math.sin(th));
    // little arrows drift round the ring, pointing the way you walk
    arrows.children.forEach(a => { const b = a.userData.a + idleT * .4, q = ringPos(b); a.position.set(q.x, 4, q.z); a.rotation.set(Math.PI / 2, Math.atan2(Math.cos(b), -Math.sin(b)), 0, 'YXZ'); });
    const C = MK.camera; C.position.set(0, 980, 760); C.lookAt(0, -40, -20);
    MK.sunAt(0, 0, 0, 700);
  }
  MK.init({
    id: 'colordrop', title: 'Color Drop', controls: 'hold', color: '#3b82f6', lo: '#1d4ed8', bg: '#9ED8FF', scoreName: 'Points', coinRate: .8,
    shop: [
      { id: 'slowmo', name: 'Slow Clock', desc: '+0.6 s to find your colour, every round, for good', kind: 'pass', pearls: 80 },
      { id: 'shoes', name: 'Speedy Shoes', desc: 'Walk 8% faster per level', kind: 'upgrade', coins: 40, grow: 1.7, max: 5 },
      { id: 'balloon', name: 'Balloon', desc: 'Float over one wrong block, for one run', kind: 'boost', coins: 25 },
      { id: 'shirt_red', name: 'Red Tee', desc: 'Match the red blocks', kind: 'skin', group: 'shirt', color: '#ef4444', coins: 40 },
      { id: 'shirt_blue', name: 'Blue Tee', desc: 'Match the blue blocks', kind: 'skin', group: 'shirt', color: '#3b82f6', coins: 40 },
      { id: 'shirt_green', name: 'Green Tee', desc: 'Match the green blocks', kind: 'skin', group: 'shirt', color: '#22c55e', coins: 40 },
      { id: 'shirt_yellow', name: 'Yellow Tee', desc: 'Match the yellow blocks', kind: 'skin', group: 'shirt', color: '#facc15', coins: 40 },
      { id: 'shirt_purple', name: 'Purple Tee', desc: 'A colour that never drops', kind: 'skin', group: 'shirt', color: '#8b5cf6', coins: 80 },
      { id: 'shirt_rainbow', name: 'Party Tee', desc: 'Every round is a party', kind: 'skin', group: 'shirt', color: '#ec4899', pearls: 30 },
      { id: 'box_shirt', name: 'Tee Crate', desc: 'A random tee. Already have it? Half your coins back', kind: 'box', coins: 25, pool: ['shirt_red', 'shirt_blue', 'shirt_green', 'shirt_yellow', 'shirt_purple', 'shirt_rainbow'] }
    ],
    // shop previews: the tee
    preview(it) { return SHIRTS[it.id] ? MK.prev.shirt(SHIRTS[it.id]) : null; },
    setup, reset, start, update, onOwned: shirt,
    // every press starts with a little hop: use it to clear a gap while you get to your colour
    down() { if (dead || fallT || py > 0) return; vy = 560; py = .01; MK.haptic(6); MK.burst(ringPos(th).setY(4), { n: 6, color: '#ffffff', speed: 140, size: 6, up: .2 }); },
    idle(dt) { idleT += dt; me.update(dt); for (const b of bots) b.a.update(dt); place(dt); },
    resize() { MK.fit(MK.camera, 950, 950, 1250); place(0); }
  });
})();
