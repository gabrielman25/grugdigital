/* MicroKit v4 · the shared layer every Grug micro game carries (3D).
   Source: micro/src/microkit.js. build.py copies it (with Fredoka inlined) between the MICROKIT markers of every game,
   so each game stays one self-contained HTML file. Edit this file, then run build.py: never edit the copies.

   What it gives a game:
   - three.js + SandyKit. Inside the feed they are borrowed from the feed (loaded once for every game). On its own, the
     game loads the site's runtime itself. If the avatar runtime can't load, plain three.js is used and avatars become
     simple stand-in figures, so the game always plays.
   - a renderer on a full-screen canvas, scene, lights, a frame loop that only runs while the game is on screen.
   - input: one thing only, a press anywhere on the screen (tap or hold). MK.held says if it's down; down() and up()
     fire as it goes down and comes back up. Where the finger is doesn't matter.
   - no start screen: a run starts the moment the game is on screen. Game over shows the score and starts again by
     itself after a moment (or on a tap).
   - a HUD (score, lives, time bar, hints), pop-up text, praise, confetti on a new best.
   - juice: voxel particle bursts, sparkles, shock rings, sparks that fly to the score, screen flash, hit-stop.
   - models from the CC0 packs, Cube Pets with animations, the shop / home base / away-earnings plumbing. */

@font-face{font-family:'Fredoka';src:url(${FONT}) format('woff2');font-weight:300 700;font-display:block}
html,body{margin:0;height:100%;overflow:hidden;background:var(--mk-bg,#17171A);touch-action:none;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:Fredoka,ui-rounded,system-ui,sans-serif}
#mk{position:fixed;inset:0;width:100%;height:100%;display:block}
#mk-hud{position:fixed;left:0;right:0;top:var(--mk-t,16px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;transition:opacity .25s}
#mk-score{font-size:58px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 3px 0 var(--mk-lo)}
#mk-score.bump{animation:mkb .22s ease-out}
@keyframes mkb{40%{transform:scale(1.22)}}
#mk-lives{display:flex;gap:7px}
#mk-lives i{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 2px 0 var(--mk-lo)}
#mk-lives i.off{background:rgba(255,255,255,.3);box-shadow:none}
#mk-bar{width:min(200px,50vw);height:10px;border-radius:6px;background:rgba(255,255,255,.35);overflow:hidden}
#mk-bar b{display:block;height:100%;width:100%;background:#fff;border-radius:6px;transform-origin:left;transition:background .2s}
#mk-bar.warn b{background:#f43f5e}
#mk-hint{position:fixed;left:0;right:0;bottom:calc(var(--mk-b,16px) + 6px);text-align:center;font-size:18px;font-weight:600;color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.3);pointer-events:none;transition:opacity .4s;opacity:0}
.mk-pop{position:fixed;transform:translate(-50%,-50%);font-weight:600;font-size:26px;color:#fff;pointer-events:none;white-space:nowrap;
  text-shadow:0 3px 0 rgba(0,0,0,.25);animation:mkpop .75s ease-out forwards}
@keyframes mkpop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
#mk-praise{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:46px;font-weight:600;color:#fff;pointer-events:none;
  text-shadow:0 4px 0 var(--mk-lo);opacity:0}
#mk-praise.on{animation:mkpr .9s ease-out forwards}
@keyframes mkpr{0%{opacity:0;transform:scale(.4)}18%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
#mk-over{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;

    }
  });

  MK.init = function (c) {
    cfg = c;
    document.title = c.title;
    const r = document.documentElement.style;
    r.setProperty('--mk-c', c.color); r.setProperty('--mk-lo', c.lo || c.color); r.setProperty('--mk-bg', c.bg || '#17171A');
    cv = document.createElement('canvas'); cv.id = 'mk'; document.body.appendChild(cv);
    document.body.insertAdjacentHTML('beforeend',
      `<div id="mk-hud"><div id="mk-score">0</div><div id="mk-lives" hidden></div><div id="mk-bar" hidden><b></b></div></div>` +
      `<div id="mk-hint"></div><div id="mk-praise"></div><div id="mk-flash"></div><div id="mk-over" hidden></div>` +
      (inFrame ? '' : `<div id="mk-load">Loading ${c.title}</div>`));
    hud = { wrap: $('mk-hud'), score: $('mk-score'), lives: $('mk-lives'), bar: $('mk-bar'), hint: $('mk-hint'), praise: $('mk-praise'), over: $('mk-over'), flash: $('mk-flash') };
    hud.wrap.style.opacity = 0;
    MK.best = ((store.get().best || {})[c.id]) || 0;
    applySafe();
    addEventListener('resize', resize);
    if (!inFrame) {
      addEventListener('pointerdown', e => press('p' + e.pointerId, e.clientX, e.clientY));
      addEventListener('pointermove', e => move('p' + e.pointerId, e.clientX, e.clientY));
      addEventListener('pointerup', e => release('p' + e.pointerId));
      addEventListener('pointercancel', e => release('p' + e.pointerId));
      addEventListener('contextmenu', e => e.preventDefault());
      addEventListener('keydown', e => { if (!e.repeat && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); press('k', MK.W / 2, MK.H / 2); } });
      addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter') release('k'); });
      document.addEventListener('visibilitychange', () => setActive(!document.hidden));
    }
    loadOwned();
    send({ t: 'ready', phase: 'loading', shop: cfg.shop || [], base: !!cfg.base, baseName: cfg.baseName || '', title: cfg.title });
    runtime().then(async ({ T, K, doc }) => {
      MK.T = T; MK.Sandy = K; doc3 = doc;
      const R = MK.renderer = new T.WebGLRenderer({ canvas: cv, antialias: !touchDev, powerPreference: 'high-performance' });
      if (!K && T.ColorManagement) { T.ColorManagement.enabled = false; if ('outputColorSpace' in R) R.outputColorSpace = 'srgb'; }
      else R.outputEncoding = T.sRGBEncoding;
      R.shadowMap.enabled = true; R.shadowMap.type = T.PCFSoftShadowMap;
      const scene = MK.scene = new T.Scene();
      scene.add(MK.hemi = new T.HemisphereLight(0xfff4e0, 0x5a6a50, .85));
      const sun = MK.sun = new T.DirectionalLight(0xfff0dc, .95);
      sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.bias = -.0006;
      scene.add(sun, sun.target);
      MK.camera = new T.PerspectiveCamera(40, MK.W / MK.H, 10, 30000);
      await cfg.setup(T, scene);
      booted = true;
      if (cfg.onOwned) cfg.onOwned();
      cfg.reset();      // state first, then size the view around it
      resize();
      const ld = $('mk-load'); if (ld) ld.remove();
      MK.phase = 'ready'; send({ t: 'phase', phase: 'ready' });
      hud.wrap.style.opacity = 1;
      render();
      if (active) { awayCheck(); start(); }
      if (pvWanted) { pvWanted = false; setTimeout(sendPreviews, 300); }
    }).catch(err => { const ld = $('mk-load'); if (ld) ld.textContent = 'This game could not load'; console.error(err); });
  };
})();

/* MICROKIT END */
</script>
<script>
/* Dive Exam! · Grug micro game (3D, with your avatar) · control: hold anywhere to dive, let go to float up.
   You're taking your diving exams. You swim forward by yourself; hold to dive, let go and you float back up. Your air
   runs down under water and fills up again at the surface (bubble clouds top it up too). Each exam asks you to swim
   through a number of rings and to reach a target depth; pass it and you earn the next license, from Junior Diver to
   Master Diver, and the next exam goes deeper. Jellyfish sting (they cost air). Shells are +1, rings +5, a license +50.
   Run out of air and the exam's over. Fish and crabs: Kenney Cube Pets (CC0); sea floor: KayKit Block Bits (CC0). */
/* MODELS: b_sand_A, b_sand_with_grass, b_stone, b_stone_dark, b_chest, b_colored_block_red, b_colored_block_yellow, b_decorative_block_blue, pet_fish, pet_crab */
(() => {
  const EXAMS = [
    { n: 'Junior Diver', depth: 6, rings: 3 }, { n: 'Open Water Diver', depth: 12, rings: 4 }, { n: 'Advanced Diver', depth: 18, rings: 5 },
    { n: 'Rescue Diver', depth: 24, rings: 5 }, { n: 'Deep Diver', depth: 30, rings: 6 }, { n: 'Master Diver', depth: 36, rings: 6 }];
  const FLOOR = -4200;
  const SUITS = { wet_blue: '#0ea5e9', wet_black: '#111827', wet_orange: '#f97316', wet_pink: '#ec4899', wet_green: '#10b981', wet_gold: '#facc15' };
  let T, S, me, diver, water, line, x, y, vy, air, score, lvl, got, deep, items = [], madeTo, fish = [], el = {}, idleT = 0, stung = 0, licT = 0, surfaceG;

  function suit() { const id = MK.equipped('wet'); if (!me || !me.apply || !me.getConfig) return; try { const c = me.getConfig(); if (!me._own) me._own = { top: c.top, shirt: c.outfit.shirt }; if (id && SUITS[id]) me.apply({ top: null, outfit: Object.assign({}, c.outfit, { shirt: SUITS[id] }) }); else me.apply({ top: me._own.top, outfit: Object.assign({}, c.outfit, { shirt: me._own.shirt }) }); } catch (e) { } }
  const exam = () => EXAMS[Math.min(lvl, EXAMS.length - 1)];
  const target = () => (exam().depth + Math.max(0, lvl - EXAMS.length + 1) * 6) * 100;
  // ---------- the sea, built a stretch at a time as you swim ----------
  function chunk(x0) {
    const sand = [], rock = [], coral = [];
    for (let xx = x0; xx < x0 + 800; xx += 100) {
      const top = FLOOR + Math.round(Math.sin(xx * .0013) * 3 + Math.sin(xx * .0041) * 2) * 100;
      for (let zz = -400; zz <= 300; zz += 100) sand.push([xx, top - 50, zz]);
      if (Math.random() < .12) rock.push([xx, top + 50, MK.rand(-300, -100)]);
      if (Math.random() < .1) coral.push([xx, top + 50, MK.rand(-300, 0)]);
    }
    const g = new T.Group();
    const a = MK.instances('b_sand_A', sand, 50); a.castShadow = false; g.add(a);
    if (rock.length) g.add(MK.instances('b_stone', rock, 50));
    if (coral.length) g.add(MK.instances(Math.random() < .5 ? 'b_colored_block_red' : 'b_colored_block_yellow', coral, 50));
    g.userData.x0 = x0; S.add(g); items.push({ k: 'floor', g, x: x0 + 800 });
    // rings, shells, jellyfish and bubble clouds in the water above
    for (let xx = x0 + 150; xx < x0 + 800; xx += 220) {
      const r = Math.random(), yy = -MK.rand(150, Math.min(-FLOOR - 400, target() * 1.15));
      if (r < .2) addRing(xx, yy);
      else if (r < .55) addShell(xx, yy);
      else if (r < .72 && lvl > 0) addJelly(xx, yy);
      else if (r < .82) addBubbles(xx, yy);
    }
    if (Math.random() < .25) { const c = MK.model('b_chest', 90); c.position.set(x0 + 400, FLOOR + 160, -60); c.rotation.y = .4; S.add(c); items.push({ k: 'chest', g: c, x: x0 + 400, y: FLOOR + 160 }); }
    if (Math.random() < .4) { const c = MK.pet('pet_crab', 90, { anim: 'walk' }); c.object3d.position.set(x0 + MK.rand(100, 700), FLOOR + 110, -40); S.add(c.object3d); items.push({ k: 'crab', g: c.object3d, a: c, x: c.object3d.position.x }); }
  }
  function addRing(xx, yy) { const m = MK.mesh(new T.TorusGeometry(110, 16, 10, 32), MK.mat('#facc15', { emissive: '#f59e0b', emissiveIntensity: .5 }), xx, yy, 0); m.rotation.y = Math.PI / 2; S.add(m); items.push({ k: 'ring', g: m, x: xx, y: yy }); }
  function addShell(xx, yy) { const m = MK.mesh(new T.SphereGeometry(18, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), MK.mat('#fbcfe8', { roughness: .3 }), xx, yy, 0); m.scale.set(1.2, .6, 1); S.add(m); items.push({ k: 'shell', g: m, x: xx, y: yy }); }
  function addJelly(xx, yy) {
    const g = new T.Group(), m = MK.mat('#f472b6', { emissive: '#db2777', emissiveIntensity: .4, transparent: true, opacity: .8 });
    g.add(MK.mesh(new T.SphereGeometry(55, 16, 10, 0, Math.PI * 2, 0, Math.PI / 2), m));
    for (let i = 0; i < 5; i++) g.add(MK.mesh(new T.CylinderGeometry(3, 3, 110, 4), m, Math.cos(i * 1.3) * 30, -55, Math.sin(i * 1.3) * 30));
    g.position.set(xx, yy, 0); S.add(g); items.push({ k: 'jelly', g, x: xx, y: yy, ph: Math.random() * 6 });
  }
  function addBubbles(xx, yy) { const g = new T.Group(); for (let i = 0; i < 7; i++) g.add(MK.mesh(new T.SphereGeometry(MK.rand(8, 20), 10, 8), MK.mat('#e0f2fe', { transparent: true, opacity: .6, roughness: .1 }), MK.rand(-40, 40), MK.rand(-40, 40), MK.rand(-20, 20), false)); g.position.set(xx, yy, 0); S.add(g); items.push({ k: 'air', g, x: xx, y: yy }); }
  function ensure() { while (madeTo < x + 3200) { chunk(madeTo); madeTo += 800; } }
  async function setup(T_, scene) {
    T = T_; S = scene;
    el = { task: document.getElementById('task'), depth: document.getElementById('depth'), lic: document.getElementById('lic') };
    scene.background = MK.color('#38bdf8'); scene.fog = new T.Fog(MK.color('#1e6fa8'), 900, 3600);
    // the water's surface seen from below, and the sky above it
    surfaceG = new T.Group(); scene.add(surfaceG);
    const surf = MK.mesh(new T.PlaneGeometry(9000, 3000, 1, 1), new T.MeshBasicMaterial({ color: MK.color('#bae6fd'), transparent: true, opacity: .55, side: T.DoubleSide }), 0, 0, -400, false);
    surf.rotation.x = Math.PI / 2; surfaceG.add(surf);
    // the exam's target depth: a dashed red line
    line = new T.Group(); for (let i = 0; i < 40; i++) line.add(MK.mesh(new T.BoxGeometry(60, 6, 6), MK.mat('#ef4444', { emissive: '#ef4444', emissiveIntensity: .8 }), -1200 + i * 120, 0, 60, false)); scene.add(line);
    me = await MK.avatar('player');
    diver = new T.Group(); diver.add(me.object3d); scene.add(diver);
    // the air tank on her back
    me.object3d.add(MK.mesh(new T.CylinderGeometry(14, 14, 60, 12), MK.mat('#facc15', { metalness: .3, roughness: .3 }), 0, 125, -22));
    for (let i = 0; i < 6; i++) { const f = MK.pet('pet_fish', MK.rand(40, 70), { anim: 'run', tint: ['#fb923c', '#38bdf8', '#facc15', '#f472b6'][i % 4] }); scene.add(f.object3d); fish.push({ a: f, x: 0, y: 0, v: MK.rand(80, 160), ph: Math.random() * 6 }); }
    MK.hemi.intensity = 1.05;
  }
  function clear() { for (const it of items) S.remove(it.g); items = []; }
  function reset() {
    clear(); x = 0; y = -60; vy = 0; air = 1; score = 0; lvl = 0; got = 0; deep = false; stung = 0; madeTo = -800;
    ensure(); for (const f of fish) { f.x = x + MK.rand(-400, 1500); f.y = -MK.rand(300, 2500); }
    el.lic.hidden = true;
    MK.hud.score(0); MK.hud.bar(1); task(); me.play('walk'); place(0);
  }
  function start() { MK.hud.hint('Hold to dive · let go to float up for air'); }
  function task() {
    const E = exam();
    el.task.innerHTML = `Exam: <b>${E.n}</b><br><span class="${deep ? 'ok' : ''}">Reach ${target() / 100} m ${deep ? '✓' : ''}</span> · <span class="${got >= E.rings ? 'ok' : ''}">Rings ${Math.min(got, E.rings)}/${E.rings}</span>`;
  }
  function pass() {
    const E = exam(); score += 50; MK.hud.score(score); MK.earn(5 + lvl * 2);
    el.lic.querySelector('b').textContent = E.n; el.lic.querySelector('span').textContent = 'Passed at ' + target() / 100 + ' m with ' + got + ' rings';
    el.lic.hidden = false; licT = 2.4; MK.praise('License earned!'); MK.haptic([20, 40, 20]);
    MK.burst(new T.Vector3(x, y + 80, 40), { n: 30, colors: ['#facc15', '#38bdf8', '#ffffff', '#f472b6'], speed: 480, size: 12, up: 1.2, gravity: 300 }); MK.toScore(new T.Vector3(x, y, 0), 6);
    lvl++; got = 0; deep = false; air = 1; task();
  }
  function update(dt) {
    idleT += dt; me.update(dt * 1.4);
    if (licT > 0 && (licT -= dt) <= 0) el.lic.hidden = true;
    // swim: forward by yourself, hold to dive, let go to float up
    const fwd = 230 * (1 + .1 * MK.owned('fins'));
    x += fwd * dt;
    const want = MK.held ? -330 * (1 + .1 * MK.owned('fins')) : 220;
    vy += (want - vy) * Math.min(1, dt * 3); y += vy * dt;
    if (y > -40) { y = -40; vy = Math.min(0, vy); }
    if (y < FLOOR + 130) { y = FLOOR + 130; vy = Math.max(0, vy); }
    // air: drains under water, fills at the surface
    const under = y < -80;
    if (under) air -= dt / (28 * (1 + .15 * MK.owned('tank'))) * (MK.owned('gills') ? .6 : 1);
    else air = Math.min(1, air + dt * .6);
    MK.hud.bar(air, air < .25);
    if (air < .25 && Math.random() < dt * 2) MK.haptic(10);
    if (air <= 0) { if (MK.use('spare')) { air = .5; MK.praise('Spare tank!'); } else { MK.popAt(new T.Vector3(x, y + 120, 0), 'Out of air!', '#fecaca', 30); MK.over(score); return; } }
    if (Math.random() < dt * 3) MK.burst(new T.Vector3(x + 40, y + 30, 20), { n: 1, color: '#e0f2fe', speed: 40, size: 7, gravity: -260, life: 1.2, glow: true });
    // the exam
    if (!deep && -y >= target()) { deep = true; MK.popAt(new T.Vector3(x, y + 120, 0), target() / 100 + ' m!', '#86efac', 30); MK.ring(new T.Vector3(x, y, 0), { color: '#86efac', radius: 160, face: true }); task(); MK.haptic(15); }
    if (deep && got >= exam().rings) pass();
    // things in the water
    for (const it of items) {
      if (it.done) continue;
      const dx = it.x - x, dy = (it.y || 0) - y;
      if (it.k === 'jelly') { it.g.position.y = it.y + Math.sin(idleT * 1.4 + it.ph) * 60; it.g.scale.y = 1 + Math.sin(idleT * 5 + it.ph) * .1; }
      if (it.k === 'crab') { it.a.update(dt); it.g.position.x = it.x + Math.sin(idleT * .8 + it.x) * 80; }
      if (it.k === 'ring') it.g.rotation.x = Math.sin(idleT * 2) * .2;
      const d = Math.hypot(dx, it.k === 'jelly' ? it.g.position.y - y : dy);
      if (it.k === 'ring' && Math.abs(dx) < 40 && Math.abs(dy) < 100) { it.done = true; S.remove(it.g); got++; score += 5; MK.hud.score(score); task(); MK.sparkle(new T.Vector3(x, y, 0), { n: 14, color: '#fde047' }); MK.toScore(new T.Vector3(x, y, 0), 2, '#fde047'); MK.haptic(12); }
      else if (it.k === 'shell' && d < 70) { it.done = true; S.remove(it.g); score++; MK.hud.score(score); MK.burst(new T.Vector3(it.x, it.y, 0), { n: 6, color: '#fbcfe8', speed: 140, size: 6, gravity: 0 }); }
      else if (it.k === 'air' && d < 90) { it.done = true; S.remove(it.g); air = Math.min(1, air + .3); MK.popAt(new T.Vector3(x, y + 100, 0), '+Air', '#e0f2fe', 24); MK.burst(new T.Vector3(it.x, it.y, 0), { n: 12, color: '#e0f2fe', speed: 160, size: 9, gravity: -300, glow: true }); }
      else if (it.k === 'jelly' && d < 85 && stung <= 0) { stung = 1; air -= .18; vy = 260; MK.shake(8); MK.flash('#f472b6', .25); MK.haptic(60); MK.popAt(new T.Vector3(x, y + 110, 0), 'Sting!', '#fbcfe8', 28); }
      else if (it.k === 'chest' && Math.abs(dx) < 90 && dy > -140) { it.done = true; score += 10; MK.hud.score(score); MK.praise('Treasure! +10'); MK.burst(new T.Vector3(it.x, it.y + 40, 0), { n: 20, colors: ['#facc15', '#fde047'], speed: 300, size: 9, up: 1.2 }); }
    }
    if (stung > 0) stung -= dt;
    items = items.filter(it => { if (it.x < x - 1400) { S.remove(it.g); return false; } return true; });
    ensure();
    // fish swim past
    for (const f of fish) { f.x += f.v * dt; f.a.update(dt); if (f.x > x + 1800) { f.x = x - 1200; f.y = -MK.rand(200, Math.min(3800, target() * 1.3)); } f.a.object3d.position.set(f.x, f.y + Math.sin(idleT + f.ph) * 30, -200 + Math.sin(f.ph) * 150); f.a.object3d.rotation.y = Math.PI / 2; }
    el.depth.textContent = Math.max(0, Math.round(-y / 100)) + ' m';
    // deeper is darker
    const k = Math.min(1, -y / 4000); S.background.copy(MK.color('#38bdf8')).lerp(MK.color('#062a43'), k); S.fog.color.copy(S.background);
    if (MK.t > 4) MK.hud.hint(null, false);
    place(dt);
  }
  function place(dt) {
    diver.position.set(x, y, 0);
    me.object3d.rotation.set(0, 0, -Math.PI / 2 + MK.clamp(vy / 900, -.45, .45));
    me.object3d.position.y = 0;
    line.position.set(x, -target(), 0);
    surfaceG.position.x = x;
    const C = MK.camera; C.position.set(x + 200, y + 40, 760); C.lookAt(x + 200, y - 20, 0);
    MK.sunAt(x, y, 0, 900);
  }
  MK.init({
    id: 'dive', title: 'Dive Exam!', controls: 'hold', color: '#0284c7', lo: '#075985', bg: '#38bdf8', scoreName: 'Points', coinRate: .3,
    shop: [
      { id: 'gills', name: 'Rebreather', desc: 'Your air lasts 40% longer, for good', kind: 'pass', pearls: 120 },
      { id: 'tank', name: 'Bigger Tank', desc: '+15% air per level', kind: 'upgrade', coins: 40, grow: 1.7, max: 6 },
      { id: 'fins', name: 'Pro Fins', desc: 'Swim 10% faster per level', kind: 'upgrade', coins: 50, grow: 1.8, max: 5 },
      { id: 'spare', name: 'Spare Tank', desc: 'Half a tank of air when you run out, once', kind: 'boost', coins: 25 },
      { id: 'wet_blue', name: 'Ocean Wetsuit', desc: 'Classic diver blue', kind: 'skin', group: 'wet', color: '#0ea5e9', coins: 40 },
      { id: 'wet_black', name: 'Pro Wetsuit', desc: 'Sleek black', kind: 'skin', group: 'wet', color: '#111827', coins: 40 },
      { id: 'wet_orange', name: 'Rescue Wetsuit', desc: 'Easy to spot', kind: 'skin', group: 'wet', color: '#f97316', coins: 50 },
      { id: 'wet_pink', name: 'Coral Wetsuit', desc: 'Reef pink', kind: 'skin', group: 'wet', color: '#ec4899', coins: 50 },
      { id: 'wet_green', name: 'Kelp Wetsuit', desc: 'Hide in the kelp', kind: 'skin', group: 'wet', color: '#10b981', coins: 90 },
      { id: 'wet_gold', name: 'Treasure Wetsuit', desc: 'Shine in the deep', kind: 'skin', group: 'wet', color: '#facc15', pearls: 30 },
      { id: 'box_wet', name: 'Wetsuit Crate', desc: 'A random wetsuit. Already have it? Half your coins back', kind: 'box', coins: 25, pool: ['wet_blue', 'wet_black', 'wet_orange', 'wet_pink', 'wet_green', 'wet_gold'] }
    ],
    preview(it) {
      if (SUITS[it.id]) return MK.prev.shirt(SUITS[it.id]);
      if (it.id === 'tank' || it.id === 'gills' || it.id === 'spare') { const g = new T.Group(); g.add(MK.mesh(new T.CylinderGeometry(.3, .3, 1.4, 16), MK.mat('#facc15', { metalness: .3, roughness: .3 })), MK.mesh(new T.CylinderGeometry(.12, .12, .25, 10), MK.mat('#334155'), 0, .8, 0)); return g; }
      if (it.id === 'fins') return MK.pet('pet_fish', 100, { anim: 'idle' }).object3d;
      return null;
    },
    setup, reset, start, update, onOwned: suit,
    idle(dt) { idleT += dt; me.update(dt); place(dt); },
    resize() { MK.fit(MK.camera, 900, 820, 760); place(0); }
  });
})();
</script>
