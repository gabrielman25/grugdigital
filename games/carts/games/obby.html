@font-face{font-family:'Fredoka';src:url(${FONT}) format('woff2');font-weight:300 700;font-display:block}
html,body{margin:0;height:100%;overflow:hidden;background:var(--mk-bg,#17171A);touch-action:none;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:Fredoka,ui-rounded,system-ui,sans-serif}
#mk{position:fixed;inset:0;width:100%;height:100%;display:block}
#mk-hud{position:fixed;left:0;right:0;top:var(--mk-t,16px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;transition:opacity .25s}
#mk-score{font-size:58px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 3px 0 var(--mk-lo)}
#mk-score.bump{animation:mkb .22s ease-out}
@keyframes mkb{40%{transform:scale(1.22)}}
#mk-lives{display:flex;gap:7px}
#mk-lives i{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 2px 0 var(--mk-lo)}
#mk-lives i.off{background:rgba(255,255,255,.3);box-shadow:none}
#mk-bar{width:min(200px,50vw);height:10px;border-radius:6px;background:rgba(255,255,255,.35);overflow:hidden}
#mk-bar b{display:block;height:100%;width:100%;background:#fff;border-radius:6px;transform-origin:left;transition:background .2s}
#mk-bar.warn b{background:#f43f5e}
#mk-hint{position:fixed;left:0;right:0;bottom:calc(var(--mk-b,16px) + 6px);text-align:center;font-size:18px;font-weight:600;color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.3);pointer-events:none;transition:opacity .4s;opacity:0}
.mk-pop{position:fixed;transform:translate(-50%,-50%);font-weight:600;font-size:26px;color:#fff;pointer-events:none;white-space:nowrap;
  text-shadow:0 3px 0 rgba(0,0,0,.25);animation:mkpop .75s ease-out forwards}
@keyframes mkpop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
#mk-praise{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:46px;font-weight:600;color:#fff;pointer-events:none;
  text-shadow:0 4px 0 var(--mk-lo);opacity:0}
#mk-praise.on{animation:mkpr .9s ease-out forwards}
@keyframes mkpr{0%{opacity:0;transform:scale(.4)}18%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
#mk-over{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;

    }
  });

  MK.init = function (c) {
    cfg = c;
    document.title = c.title;
    const r = document.documentElement.style;
    r.setProperty('--mk-c', c.color); r.setProperty('--mk-lo', c.lo || c.color); r.setProperty('--mk-bg', c.bg || '#17171A');
    cv = document.createElement('canvas'); cv.id = 'mk'; document.body.appendChild(cv);
    document.body.insertAdjacentHTML('beforeend',
      `<div id="mk-hud"><div id="mk-score">0</div><div id="mk-lives" hidden></div><div id="mk-bar" hidden><b></b></div></div>` +
      `<div id="mk-hint"></div><div id="mk-praise"></div><div id="mk-flash"></div><div id="mk-over" hidden></div>` +
      (inFrame ? '' : `<div id="mk-load">Loading ${c.title}</div>`));
    hud = { wrap: $('mk-hud'), score: $('mk-score'), lives: $('mk-lives'), bar: $('mk-bar'), hint: $('mk-hint'), praise: $('mk-praise'), over: $('mk-over'), flash: $('mk-flash') };
    hud.wrap.style.opacity = 0;
    MK.best = ((store.get().best || {})[c.id]) || 0;
    applySafe();
    addEventListener('resize', resize);
    if (!inFrame) {
      addEventListener('pointerdown', e => press('p' + e.pointerId, e.clientX, e.clientY));
      addEventListener('pointermove', e => move('p' + e.pointerId, e.clientX, e.clientY));
      addEventListener('pointerup', e => release('p' + e.pointerId));
      addEventListener('pointercancel', e => release('p' + e.pointerId));
      addEventListener('contextmenu', e => e.preventDefault());
      addEventListener('keydown', e => { if (!e.repeat && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); press('k', MK.W / 2, MK.H / 2); } });
      addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter') release('k'); });
      document.addEventListener('visibilitychange', () => setActive(!document.hidden));
    }
    loadOwned();
    send({ t: 'ready', phase: 'loading', shop: cfg.shop || [], base: !!cfg.base, baseName: cfg.baseName || '', title: cfg.title });
    runtime().then(async ({ T, K, doc }) => {
      MK.T = T; MK.Sandy = K; doc3 = doc;
      const R = MK.renderer = new T.WebGLRenderer({ canvas: cv, antialias: !touchDev, powerPreference: 'high-performance' });
      if (!K && T.ColorManagement) { T.ColorManagement.enabled = false; if ('outputColorSpace' in R) R.outputColorSpace = 'srgb'; }
      else R.outputEncoding = T.sRGBEncoding;
      R.shadowMap.enabled = true; R.shadowMap.type = T.PCFSoftShadowMap;
      const scene = MK.scene = new T.Scene();
      scene.add(MK.hemi = new T.HemisphereLight(0xfff4e0, 0x5a6a50, .85));
      const sun = MK.sun = new T.DirectionalLight(0xfff0dc, .95);
      sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.bias = -.0006;
      scene.add(sun, sun.target);
      MK.camera = new T.PerspectiveCamera(40, MK.W / MK.H, 10, 30000);
      await cfg.setup(T, scene);
      booted = true;
      if (cfg.onOwned) cfg.onOwned();
      cfg.reset();      // state first, then size the view around it
      resize();
      const ld = $('mk-load'); if (ld) ld.remove();
      MK.phase = 'ready'; send({ t: 'phase', phase: 'ready' });
      hud.wrap.style.opacity = 1;
      render();
      if (active) { awayCheck(); start(); }
      if (pvWanted) { pvWanted = false; setTimeout(sendPreviews, 300); }
    }).catch(err => { const ld = $('mk-load'); if (ld) ld.textContent = 'This game could not load'; console.error(err); });
  };
})();

/* MICROKIT END */
</script>
<script>
/* Obby Dash · Grug micro game (3D voxel, with your avatar).
   Control: tap anywhere to jump.
   Your avatar runs along a floating block course by herself. Tap to jump gaps, the glowing red kill bricks and
   the steps up (she stops at a wall until you jump it). Bobbing platforms need good timing. Fall off or touch red
   and you go back to the last checkpoint flag (three lives). Every block is +1, every flag +5. It speeds up.
   Shop: Feather (double jump for a run), Wings (double jump for good, Pearls), trail colours. */
/* MODELS: b_colored_block_blue, b_colored_block_green, b_colored_block_yellow, b_striped_block_yellow, b_decorative_block_blue, b_grass, b_dirt */
(() => {
  const B = 100, JUMP = 760, G = 2300;
  const TRAILS = { trail_pink: '#F472B6', trail_star: '#FACC15', trail_blue: '#60A5FA', trail_mint: '#34D399', trail_fire: '#F97316', trail_violet: '#A78BFA', trail_snow: '#FFFFFF' };
  const KINDS = ['b_colored_block_blue', 'b_colored_block_green', 'b_colored_block_yellow'];
  let T, S, me, cols, pool = {}, killMat, flagM, x, y, vy, air, jumps, lives, score, best, cp, speed, gen, puffs = [], idleT = 0;

  function setup(T_, scene) {
    T = T_; S = scene;
    scene.background = MK.color('#AEE2FF');
    scene.fog = new T.Fog(MK.color('#AEE2FF'), 2200, 4600);
    killMat = MK.mat('#ff3b3b', { emissive: '#ff1f1f', emissiveIntensity: .9, roughness: .3 });
    // far-off floating islands
    const isl = [];
    for (let i = 0; i < 10; i++) isl.push([i * 900 - 2000, MK.rand(-300, 500), -1600 - (i % 3) * 400, i, MK.rand(1.5, 3)]);
    const far = MK.instances('b_grass', isl, 50); far.castShadow = false; scene.add(far);
    flagM = new T.Group();
    flagM.add(MK.mesh(new T.CylinderGeometry(4, 4, 220, 8), MK.mat('#e5e7eb'), 0, 110, 0));
    const cloth = MK.mesh(new T.BoxGeometry(80, 50, 4), MK.mat('#22c55e'), 40, 190, 0); flagM.add(cloth);
    const pm = new T.SphereGeometry(10, 8, 6);
    for (let i = 0; i < 18; i++) { const m = MK.mesh(pm, MK.mat('#ffffff', { transparent: true, opacity: .7 }).clone(), 0, -999, 0, false); scene.add(m); puffs.push({ m, t: 1 }); }
    return MK.avatar('player').then(a => { me = a; me.object3d.rotation.y = Math.PI / 2; scene.add(me.object3d); });
  }
  function block(kind) {
    const list = pool[kind] = pool[kind] || [];
    let m = list.pop();
    if (!m) m = kind === 'kill' ? MK.mesh(new T.BoxGeometry(B, B, B), killMat) : MK.model(kind, null, { scale: 50 });
    m.userData.kind = kind; S.add(m); return m;
  }
  function free(m) { S.remove(m); pool[m.userData.kind].push(m); }
  // ---------- the course: one column per block width ----------
  function addCol(c) {
    c.meshes = [];
    if (c.h != null) {
      const top = c.kill ? 'kill' : c.flag ? 'b_striped_block_yellow' : c.kind;
      for (let k = 0; k < (c.bob ? 1 : 3); k++) { const m = block(k === 0 ? top : c.kind); m.position.set(c.i * B, (c.h - k) * B - B / 2, 0); c.meshes.push(m); }
      if (c.flag) { c.flagM = flagM; flagM.position.set(c.i * B, c.h * B, -30); S.add(flagM); }
    }
    cols.set(c.i, c);
  }
  function generate(upTo) {
    while (gen.i < upTo) {
      const kind = KINDS[Math.floor(gen.i / 12) % 3], d = Math.min(1, gen.i / 300);
      const flat = n => { for (let k = 0; k < n; k++) addCol({ i: gen.i++, h: gen.h, kind, flag: gen.i % 30 === 0 }); };
      flat(2 + Math.floor(Math.random() * (4 - d * 2)));
      const r = Math.random();
      if (r < .3) { const n = 1 + (Math.random() < .3 + d * .4 ? 1 : 0); for (let k = 0; k < n; k++) addCol({ i: gen.i++, h: null }); }
      else if (r < .52) { const n = 1 + (Math.random() < d * .5 ? 1 : 0); for (let k = 0; k < n; k++) addCol({ i: gen.i++, h: gen.h, kind, kill: true }); }
      else if (r < .7 && gen.h < 3) { gen.h++; }
      else if (r < .82 && gen.h > -1) { addCol({ i: gen.i++, h: null }); gen.h--; }
      else if (d > .15) { addCol({ i: gen.i++, h: null }); addCol({ i: gen.i++, h: gen.h, kind, bob: true, ph: Math.random() * 6 }); addCol({ i: gen.i++, h: null }); }
    }
  }
  function clear() { if (cols) for (const c of cols.values()) { for (const m of c.meshes) free(m); if (c.flagM) S.remove(flagM); } cols = new Map(); }
  function colAt(px) { return cols.get(Math.round(px / B)); }
  function topAt(c, t) { return c && c.h != null ? c.h * B + (c.bob ? Math.sin(t * 2.2 + c.ph) * 90 : 0) : null; }
  function reset() {
    clear();
    gen = { i: -4, h: 0 };
    for (let k = 0; k < 8; k++) addCol({ i: gen.i++, h: 0, kind: KINDS[0] });
    generate(40);
    x = 0; y = 0; vy = 0; air = false; jumps = 0; lives = 3; score = 0; best = 0; cp = 0; speed = 430;
    me.play('walk'); me.setExpression('happy');
    MK.hud.score(0); MK.hud.lives(3, 3);
    place(0);
  }
  function start() { MK.hud.hint('Tap to jump'); }
  function die(why) {
    lives--; MK.hud.lives(lives, 3); MK.shake(14); MK.haptic(90); MK.flash('#ef4444', .2);
    MK.burst(new T.Vector3(x, Math.max(y, 0) + 80, 0), { n: 18, colors: why.includes('Red') ? ['#ff3b3b', '#fecaca', '#ffffff'] : ['#ffffff', '#cbd5e1'], speed: 380, size: 12 });
    MK.popAt(new T.Vector3(x, Math.max(y, 0) + 220, 0), why, '#fecaca', 30);
    if (lives <= 0) { MK.over(score); return; }
    x = cp * B; y = (topAt(colAt(x), MK.t) || 0) + 1; vy = 0; air = false; me.setExpression('dizzy'); setTimeout(() => me.setExpression('happy'), 800);
  }
  const maxJumps = () => (MK.owned('wings') || feather) ? 2 : 1;
  let feather = false;
  function update(dt) {
    idleT += dt;
    speed = Math.min(640, 430 + score * .5);
    // run forward unless a wall is in the way
    const nx = x + speed * dt, ahead = colAt(nx + 25), aTop = topAt(ahead, MK.t);
    if (!(aTop != null && aTop > y + 12)) x = nx;
    vy -= G * dt; y += vy * dt;
    const c = colAt(x), top = topAt(c, MK.t);
    if (top != null && y <= top && y > top - 60 && vy <= 0) {
      y = top; if (air && vy < -500) MK.burst(new T.Vector3(x, top + 4, 0), { n: 6, color: '#e5e7eb', speed: 140, size: 7, up: .2 }); vy = 0; if (air) { air = false; jumps = 0; }
      if (c.kill) { die('Oof! Red block'); return; }
    } else if (top == null || y > top + 1) air = true;
    if (c && c.bob && !air) y = top;
    if (y < -500) { die('Fell off!'); return; }
    // progress
    const i = Math.round(x / B);
    if (i > best) { score += i - best; best = i; MK.hud.score(score); }
    if (c && c.flag && i > cp) { cp = i; score += 5; MK.hud.score(score); MK.praise('Checkpoint! +5'); MK.haptic([15, 30, 15]);
      const at = new T.Vector3(x, y + 120, 0); MK.burst(at, { n: 24, colors: ['#22c55e', '#facc15', '#ffffff', '#0ea5e9'], speed: 460, size: 10, up: 1.3 }); MK.toScore(at, 4); }
    // keep the course a step ahead, drop what's behind
    generate(i + 26);
    for (const [k, cc] of cols) if (k < i - 8) { for (const m of cc.meshes) free(m); if (cc.flagM && cc.flagM.position.x === cc.i * B) S.remove(flagM); cols.delete(k); }
    for (const cc of cols.values()) if (cc.bob) cc.meshes[0].position.y = topAt(cc, MK.t) - B / 2;
    if (MK.t > 3) MK.hud.hint(null, false);
    me.play(air ? 'idle' : 'walk'); me.update(dt * (air ? .5 : speed / 260));
    place(dt);
  }
  function place(dt) {
    me.object3d.position.set(x, y, 0);
    me.object3d.rotation.z = air ? MK.clamp(-vy / 2400, -.25, .25) : 0;
    const tr = MK.equipped('trail');
    if (tr && dt) { const p = puffs.find(p => p.t >= 1); if (p) { p.t = 0; p.x = x - 30; p.y = y + 40; p.m.material.color = MK.color(TRAILS[tr] || '#F472B6'); } }
    for (const p of puffs) if (p.t < 1) { p.t += (dt || 0) * 1.8; p.m.position.set(p.x, p.y + p.t * 20, -10); p.m.scale.setScalar(1 - p.t * .7); p.m.material.opacity = .7 * (1 - p.t); }
    const C = MK.camera; C.position.set(x + 260, Math.max(0, y) * .6 + 380, 920); C.lookAt(x + 260, Math.max(0, y) * .6 + 110, 0);
    MK.sunAt(x + 200, 0, 0, 900);
  }
  MK.init({
    id: 'obby', title: 'Obby Dash', controls: 'tap', color: '#f43f5e', lo: '#be123c', bg: '#AEE2FF', scoreName: 'Blocks', coinRate: .5,
    shop: [
      { id: 'wings', name: 'Wings', desc: 'Double jump, for good', kind: 'pass', pearls: 120 },
      { id: 'feather', name: 'Feather', desc: 'Double jump for one run', kind: 'boost', coins: 30 },
      { id: 'trail_pink', name: 'Bubble Trail', desc: 'Pink puffs behind you', kind: 'skin', group: 'trail', color: '#F472B6', coins: 50 },
      { id: 'trail_star', name: 'Star Trail', desc: 'Gold sparkles behind you', kind: 'skin', group: 'trail', color: '#FACC15', coins: 150 },
      { id: 'trail_blue', name: 'Sky Trail', desc: 'Blue puffs', kind: 'skin', group: 'trail', color: '#60A5FA', coins: 50 },
      { id: 'trail_mint', name: 'Mint Trail', desc: 'Fresh green puffs', kind: 'skin', group: 'trail', color: '#34D399', coins: 50 },
      { id: 'trail_snow', name: 'Cloud Trail', desc: 'Soft white clouds', kind: 'skin', group: 'trail', color: '#FFFFFF', coins: 70 },
      { id: 'trail_fire', name: 'Fire Trail', desc: 'Hot orange puffs', kind: 'skin', group: 'trail', color: '#F97316', coins: 90 },
      { id: 'trail_violet', name: 'Magic Trail', desc: 'Violet sparkles', kind: 'skin', group: 'trail', color: '#A78BFA', pearls: 40 },
      { id: 'box_trail', name: 'Trail Crate', desc: 'A random one of 7. Already have it? Half your coins back', kind: 'box', coins: 30, pool: ['trail_pink', 'trail_star', 'trail_blue', 'trail_mint', 'trail_snow', 'trail_fire', 'trail_violet'] }
    ],
    // shop previews: the trail puffs
    preview(it) { return TRAILS[it.id] ? MK.prev.puffs(TRAILS[it.id]) : null; },
    setup, reset, update,
    start() { feather = MK.starting && MK.use('feather'); start(); if (feather) MK.popAt(new T.Vector3(0, 260, 0), 'Feather: double jump!', '#fff', 26); },
    down() { if (jumps < maxJumps()) { vy = JUMP * (jumps ? .85 : 1); jumps++; air = true; MK.haptic(6); MK.burst(new T.Vector3(x, y + 5, 0), { n: jumps > 1 ? 10 : 6, color: jumps > 1 ? '#bae6fd' : '#ffffff', speed: 160, size: 8, up: .2 }); if (jumps > 1) MK.ring(new T.Vector3(x, y + 10, 0), { color: '#bae6fd', radius: 70, life: .3 }); } },
    idle(dt) { idleT += dt; me.update(dt); place(dt); },
    resize() { MK.fit(MK.camera, 1150, 760, 940); place(0); }
  });
})();
</script>
