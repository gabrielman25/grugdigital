@font-face{font-family:'Fredoka';src:url(${FONT}) format('woff2');font-weight:300 700;font-display:block}
html,body{margin:0;height:100%;overflow:hidden;background:var(--mk-bg,#17171A);touch-action:none;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:Fredoka,ui-rounded,system-ui,sans-serif}
#mk{position:fixed;inset:0;width:100%;height:100%;display:block}
#mk-hud{position:fixed;left:0;right:0;top:var(--mk-t,16px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;transition:opacity .25s}
#mk-score{font-size:58px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 3px 0 var(--mk-lo)}
#mk-score.bump{animation:mkb .22s ease-out}
@keyframes mkb{40%{transform:scale(1.22)}}
#mk-lives{display:flex;gap:7px}
#mk-lives i{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 2px 0 var(--mk-lo)}
#mk-lives i.off{background:rgba(255,255,255,.3);box-shadow:none}
#mk-bar{width:min(200px,50vw);height:10px;border-radius:6px;background:rgba(255,255,255,.35);overflow:hidden}
#mk-bar b{display:block;height:100%;width:100%;background:#fff;border-radius:6px;transform-origin:left;transition:background .2s}
#mk-bar.warn b{background:#f43f5e}
#mk-hint{position:fixed;left:0;right:0;bottom:calc(var(--mk-b,16px) + 6px);text-align:center;font-size:18px;font-weight:600;color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.3);pointer-events:none;transition:opacity .4s;opacity:0}
.mk-pop{position:fixed;transform:translate(-50%,-50%);font-weight:600;font-size:26px;color:#fff;pointer-events:none;white-space:nowrap;
  text-shadow:0 3px 0 rgba(0,0,0,.25);animation:mkpop .75s ease-out forwards}
@keyframes mkpop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
#mk-praise{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:46px;font-weight:600;color:#fff;pointer-events:none;
  text-shadow:0 4px 0 var(--mk-lo);opacity:0}
#mk-praise.on{animation:mkpr .9s ease-out forwards}
@keyframes mkpr{0%{opacity:0;transform:scale(.4)}18%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
#mk-over{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;

    }
  });

  MK.init = function (c) {
    cfg = c;
    document.title = c.title;
    const r = document.documentElement.style;
    r.setProperty('--mk-c', c.color); r.setProperty('--mk-lo', c.lo || c.color); r.setProperty('--mk-bg', c.bg || '#17171A');
    cv = document.createElement('canvas'); cv.id = 'mk'; document.body.appendChild(cv);
    document.body.insertAdjacentHTML('beforeend',
      `<div id="mk-hud"><div id="mk-score">0</div><div id="mk-lives" hidden></div><div id="mk-bar" hidden><b></b></div></div>` +
      `<div id="mk-hint"></div><div id="mk-praise"></div><div id="mk-flash"></div><div id="mk-over" hidden></div>` +
      (inFrame ? '' : `<div id="mk-load">Loading ${c.title}</div>`));
    hud = { wrap: $('mk-hud'), score: $('mk-score'), lives: $('mk-lives'), bar: $('mk-bar'), hint: $('mk-hint'), praise: $('mk-praise'), over: $('mk-over'), flash: $('mk-flash') };
    hud.wrap.style.opacity = 0;
    MK.best = ((store.get().best || {})[c.id]) || 0;
    applySafe();
    addEventListener('resize', resize);
    if (!inFrame) {
      addEventListener('pointerdown', e => press('p' + e.pointerId, e.clientX, e.clientY));
      addEventListener('pointermove', e => move('p' + e.pointerId, e.clientX, e.clientY));
      addEventListener('pointerup', e => release('p' + e.pointerId));
      addEventListener('pointercancel', e => release('p' + e.pointerId));
      addEventListener('contextmenu', e => e.preventDefault());
      addEventListener('keydown', e => { if (!e.repeat && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); press('k', MK.W / 2, MK.H / 2); } });
      addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter') release('k'); });
      document.addEventListener('visibilitychange', () => setActive(!document.hidden));
    }
    loadOwned();
    send({ t: 'ready', phase: 'loading', shop: cfg.shop || [], base: !!cfg.base, baseName: cfg.baseName || '', title: cfg.title });
    runtime().then(async ({ T, K, doc }) => {
      MK.T = T; MK.Sandy = K; doc3 = doc;
      const R = MK.renderer = new T.WebGLRenderer({ canvas: cv, antialias: !touchDev, powerPreference: 'high-performance' });
      if (!K && T.ColorManagement) { T.ColorManagement.enabled = false; if ('outputColorSpace' in R) R.outputColorSpace = 'srgb'; }
      else R.outputEncoding = T.sRGBEncoding;
      R.shadowMap.enabled = true; R.shadowMap.type = T.PCFSoftShadowMap;
      const scene = MK.scene = new T.Scene();
      scene.add(MK.hemi = new T.HemisphereLight(0xfff4e0, 0x5a6a50, .85));
      const sun = MK.sun = new T.DirectionalLight(0xfff0dc, .95);
      sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.bias = -.0006;
      scene.add(sun, sun.target);
      MK.camera = new T.PerspectiveCamera(40, MK.W / MK.H, 10, 30000);
      await cfg.setup(T, scene);
      booted = true;
      if (cfg.onOwned) cfg.onOwned();
      cfg.reset();      // state first, then size the view around it
      resize();
      const ld = $('mk-load'); if (ld) ld.remove();
      MK.phase = 'ready'; send({ t: 'phase', phase: 'ready' });
      hud.wrap.style.opacity = 1;
      render();
      if (active) { awayCheck(); start(); }
      if (pvWanted) { pvWanted = false; setTimeout(sendPreviews, 300); }
    }).catch(err => { const ld = $('mk-load'); if (ld) ld.textContent = 'This game could not load'; console.error(err); });
  };
})();

/* MICROKIT END */
</script>
<script>
/* MODELS: b_grass, b_dirt, b_sand_with_grass, b_grass_with_snow, b_stone, b_stone_dark, b_water, b_tree */
/* Bao Bounce · Grug micro game (3D voxel, with your avatar) · control: hold anywhere, let go to jump.
   Your avatar stands on a bao bun on top of a tower of blocks. Hold to power up (the bar fills), let go to jump.
   Land on the next bun (+1); land dead centre for a Perfect (+2, and she flips). Fall short or too far and you drop
   into the broth. The buns get smaller and further apart as you go. */
(() => {
  const TOP = 300, MIN = 120, SPAN = 560, FLIGHT = .6;
  let splashed = false, guide, guided = false, T, S, me, pillars, poolP = [], ahead = [], made = 0, lastX = 0, cur, nxt, charge, state, jT, from, to, arcH, flip, sx, camX, combo, score, idleT = 0;

  // a tower of voxel blocks (KayKit Block Bits): grass on top, dirt below, a bao bun to land on
  const TOPS = ['b_grass', 'b_sand_with_grass', 'b_grass_with_snow', 'b_stone'];
  function pillar(r) {
    const g = new T.Group(); g.blocks = [];
    const bun = MK.mesh(new T.SphereGeometry(1, 24, 14), MK.mat('#FFF6E8', { roughness: .7 })); g.add(bun); g.bun = bun;
    const dot = MK.mesh(new T.CircleGeometry(1, 16), MK.mat('#f43f5e', { roughness: .6 })); dot.rotation.x = -Math.PI / 2; g.add(dot); g.dot = dot;
    g.size = (rr, n) => {
      for (const b of g.blocks) g.remove(b);
      g.blocks = [];
      const w = rr * 2, count = Math.ceil((TOP - 30) / w), top = TOPS[Math.floor((n || 0) / 12) % TOPS.length];
      for (let i = 0; i < count; i++) {
        const b = MK.model(i === 0 ? top : top === 'b_stone' ? 'b_stone_dark' : 'b_dirt', null, { scale: w / 2 });
        b.position.y = TOP - 30 - w / 2 - i * w; g.add(b); g.blocks.push(b);
      }
      bun.scale.set(rr * .8, 30, rr * .8); bun.position.y = TOP - 30;
      bun.material = MK.mat(BUNS[MK.equipped('bun')] || '#FFF6E8', { roughness: .7 });
      dot.scale.setScalar(Math.max(8, rr * .14)); dot.position.y = TOP - 1;
    };
    g.size(r); return g;
  }
  const BUNS = { bun_pink: '#F9A8D4', bun_choc: '#A16207', bun_gold: '#FACC15', bun_matcha: '#A3D977', bun_blue: '#93C5FD', bun_taro: '#C4B5FD', bun_lemon: '#FDE68A', bun_char: '#4B5563' };
  async function setup(T_, scene) {
    T = T_; S = scene;
    scene.background = MK.color('#CFF1FF');
    scene.fog = new T.Fog(MK.color('#CFF1FF'), 1800, 4200);
    // a voxel sea far below, with a few islands
    const sea = []; for (let x = -1600; x <= 9000; x += 200) for (let z = -1200; z <= 400; z += 200) sea.push([x, -120, z, 0, 2]);
    const w = MK.instances('b_water', sea, 50); w.castShadow = false; scene.add(w);
    const isl = []; for (let i = 0; i < 9; i++) isl.push([i * 1100 - 600, -40, -900 - (i % 3) * 200, i, 1.6]);
    scene.add(MK.instances('b_grass', isl, 50), MK.instances('b_tree', isl.map(p => [p[0], 110, p[2], p[3], 1]), 50));
    guide = MK.mesh(new T.CylinderGeometry(16, 16, 3, 20), MK.mat('#22c55e', { emissive: '#22c55e', emissiveIntensity: .8, transparent: true, opacity: .8 }), 0, TOP + 2, 0, false); guide.visible = false; scene.add(guide);
    me = await MK.avatar('player');
    scene.add(me.object3d);
    pillars = [];
  }
  // the next tower: smaller and further out the further you go
  function makeNext() {
    made++;
    const n = made - 1, r = n === 0 ? 66 : Math.max(30, 66 - n * 1.4), gap = n === 0 ? 300 : MK.rand(Math.max(MIN + 20, 200), Math.min(MIN + SPAN - 30, 330 + n * 8));
    lastX += gap; ahead.push(addPillar(lastX, r, n));
  }
  function addPillar(x, r, n) {
    const g = poolP.pop() || pillar(r); g.size(r, n || 0); g.position.set(x, 0, 0); S.add(g);
    const p = { x, r, g }; pillars.push(p); return p;
  }
  function reset() {
    for (const p of pillars) { S.remove(p.g); poolP.push(p.g); }
    pillars = []; ahead = []; score = 0; combo = 0; charge = 0; state = 'ready'; flip = 0; made = 0;
    // the whole stretch ahead is built at once (six towers), so it reads as one level scrolling by
    cur = addPillar(0, 70); lastX = 0;
    for (let k = 0; k < 7; k++) makeNext();
    nxt = ahead.shift();
    sx = 0; camX = 150;
    me.object3d.position.set(0, TOP, 0); me.object3d.rotation.set(0, Math.PI / 2, 0); me.object3d.scale.set(1, 1, 1);
    me.play('idle'); me.setExpression('happy');
    MK.hud.score(0); MK.hud.bar(0);
    place(0);
  }
  function start() { guided = MK.starting && MK.use('guide'); MK.hud.hint(guided ? 'Landing Guide on: let go when the dot hits the bun' : 'Hold to power up, let go to jump'); }
  function place(dt) {
    if (!cur) return;
    camX += (Math.max(sx, cur.x) + 170 - camX) * (dt ? Math.min(1, dt * 5) : 1);
    const C = MK.camera; C.position.set(camX, 380, 1000); C.lookAt(camX, 210, 0);
    MK.sunAt(camX, 0, 0, 700);
  }
  function update(dt) {
    idleT += dt; me.update(dt);
    if (state === 'charging') {
      charge = Math.min(1, charge + dt / 1.05);
      me.object3d.scale.set(1 + charge * .08, 1 - charge * .16, 1 + charge * .08);
      MK.hud.bar(charge, charge >= 1);
      if (charge >= 1 && Math.random() < dt * 12) MK.sparkle(new T.Vector3(cur.x + MK.rand(-30, 30), TOP + MK.rand(40, 150), 20), { n: 1, speed: 60 });
      if (guided) { guide.visible = true; guide.position.x = cur.x + MIN + charge * SPAN; }
    } else if (state === 'flying') {
      jT += dt; const k = Math.min(1, jT / FLIGHT);
      sx = from + (to - from) * k;
      const yy = TOP + 4 * arcH * k * (1 - k);
      me.object3d.position.set(sx, yy, 0);
      if (flip) me.object3d.rotation.z = -k * Math.PI * 2;
      if (k >= 1) land();
    } else if (state === 'falling') {
      jT += dt; sx += 120 * dt; const yy = me.object3d.position.y - (300 + jT * 1800) * dt;
      me.object3d.position.set(sx, yy, 0); me.object3d.rotation.z += dt * 2;
      if (!splashed && yy < -60) { splashed = true; const w = new T.Vector3(sx, -60, 0); MK.burst(w, { n: 24, colors: ['#7dd3fc', '#e0f2fe', '#38bdf8'], speed: 420, size: 12, up: 1.2 }); MK.ring(w, { color: '#e0f2fe', radius: 220 }); }
      if (jT > .7) { MK.over(score); return; }
    }
    if (MK.t > 3 && score > 0) MK.hud.hint(null, false);
    place(dt);
  }
  function land() {
    me.object3d.rotation.z = 0;
    const off = Math.abs(to - nxt.x);
    if (off <= nxt.r) {
      const perfect = off < Math.max(10, nxt.r * .2);
      combo = perfect ? combo + 1 : 0;
      score += perfect ? 2 : 1; MK.hud.score(score);
      if (perfect) { MK.praise(combo > 1 ? 'Perfect x' + combo : 'Perfect!'); MK.haptic([15, 30, 15]); me.setExpression('laugh'); }
      else { MK.popAt(new T.Vector3(to, TOP + 210, 0), '+1', '#fff', 30); MK.haptic(12); me.setExpression('happy'); }
      me.object3d.scale.set(1.1, .85, 1.1); setTimeout(() => me.object3d.scale.set(1, 1, 1), 110);
      // shrink the old one away, make the next one
      const old = cur; cur = nxt;
      setTimeout(() => { S.remove(old.g); poolP.push(old.g); pillars = pillars.filter(p => p !== old); }, 400);
      nxt = ahead.shift(); makeNext();
      // landing juice: a dust ring and crumbs, sparkles on a perfect
      const at = new T.Vector3(to, TOP, 0);
      MK.ring(at, { color: '#ffffff', radius: cur.r * 1.6 });
      MK.burst(at, { n: 10, colors: ['#FFF6E8', '#f5d0a9'], speed: 200, size: 9, up: .5 });
      if (perfect) { MK.sparkle(new T.Vector3(to, TOP + 90, 0), { n: 16, speed: 260 }); MK.toScore(new T.Vector3(to, TOP + 120, 0), 4); MK.hitstop(.05); }
      state = 'ready'; sx = to;
      me.object3d.position.set(to, TOP, 0);
    } else {
      state = 'falling'; jT = 0; MK.shake(14); MK.haptic(80); me.setExpression('scared'); splashed = false;
      MK.popAt(new T.Vector3(to, TOP + 120, 0), off > nxt.r && to < nxt.x ? 'Too short!' : 'Too far!', '#fecdd3', 32);
    }
  }
  MK.init({
    id: 'bounce', title: 'Bao Bounce', controls: 'hold', color: '#14b8a6', lo: '#0f766e', bg: '#CFF1FF', scoreName: 'Bounces', coinRate: .8,
    shop: [
      { id: 'guide', name: 'Landing Guide', desc: 'Shows where you\u2019ll land, for one run', kind: 'boost', coins: 25 },
      { id: 'bun_pink', name: 'Strawberry Buns', desc: 'Pink bao to land on', kind: 'skin', group: 'bun', color: '#F9A8D4', coins: 40 },
      { id: 'bun_choc', name: 'Chocolate Buns', desc: 'Cocoa bao', kind: 'skin', group: 'bun', color: '#A16207', coins: 40 },
      { id: 'bun_gold', name: 'Golden Buns', desc: 'Shine on every landing', kind: 'skin', group: 'bun', color: '#FACC15', pearls: 30 },
      { id: 'bun_matcha', name: 'Matcha Buns', desc: 'Green tea bao', kind: 'skin', group: 'bun', color: '#A3D977', coins: 40 },
      { id: 'bun_blue', name: 'Blueberry Buns', desc: 'Blue bao', kind: 'skin', group: 'bun', color: '#93C5FD', coins: 40 },
      { id: 'bun_lemon', name: 'Custard Buns', desc: 'Golden custard', kind: 'skin', group: 'bun', color: '#FDE68A', coins: 60 },
      { id: 'bun_taro', name: 'Taro Buns', desc: 'Purple bao', kind: 'skin', group: 'bun', color: '#C4B5FD', coins: 60 },
      { id: 'bun_char', name: 'Charcoal Buns', desc: 'Black sesame', kind: 'skin', group: 'bun', color: '#4B5563', coins: 100 },
      { id: 'box_bun', name: 'Bao Crate', desc: 'A random one of 8. Already have it? Half your coins back', kind: 'box', coins: 25, pool: ['bun_pink', 'bun_choc', 'bun_gold', 'bun_matcha', 'bun_blue', 'bun_lemon', 'bun_taro', 'bun_char'] }
    ],
    onOwned() { if (pillars) for (const p of pillars) p.g.bun.material = MK.mat(BUNS[MK.equipped('bun')] || '#FFF6E8', { roughness: .7 }); },
    // shop previews: a bun on a grass block
    preview(it) {
      if (!BUNS[it.id]) return null;
      const g = new T.Group(), b = MK.model('b_grass', null, { scale: 16 }); b.position.y = -16; g.add(b);
      const bun = MK.mesh(new T.SphereGeometry(1, 24, 14), MK.mat(BUNS[it.id], { roughness: .7 })); bun.scale.set(28, 20, 28); bun.position.y = 12; g.add(bun);
      const dot = MK.mesh(new T.CircleGeometry(5, 16), MK.mat('#f43f5e')); dot.rotation.x = -Math.PI / 2; dot.position.y = 32.5; g.add(dot); g.userData.tilt = .35; return g;
    },
    setup, reset, start, update, passStart: true,
    down() { if (state === 'ready') { state = 'charging'; charge = 0; MK.hud.hint(null, false); } },
    up() {
      if (state !== 'charging') return;
      me.object3d.scale.set(1, 1, 1);
      from = cur.x; to = cur.x + MIN + charge * SPAN; arcH = 150 + charge * 90; jT = 0;
      flip = Math.abs(to - nxt.x) < Math.max(10, nxt.r * .2) ? 1 : 0;
      state = 'flying'; MK.hud.bar(0); MK.haptic(8); guide.visible = false;
      MK.burst(new T.Vector3(from, TOP, 0), { n: 8, color: '#ffffff', speed: 160, size: 8, up: .3 });
    },
    idle(dt) { idleT += dt; me.update(dt); place(dt); },
    resize() { MK.fit(MK.camera, 820, 640, 1000); place(0); }
  });
})();
