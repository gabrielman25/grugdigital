@font-face{font-family:'Fredoka';src:url(${FONT}) format('woff2');font-weight:300 700;font-display:block}
html,body{margin:0;height:100%;overflow:hidden;background:var(--mk-bg,#17171A);touch-action:none;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:Fredoka,ui-rounded,system-ui,sans-serif}
#mk{position:fixed;inset:0;width:100%;height:100%;display:block}
#mk-hud{position:fixed;left:0;right:0;top:var(--mk-t,16px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;transition:opacity .25s}
#mk-score{font-size:58px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 3px 0 var(--mk-lo)}
#mk-score.bump{animation:mkb .22s ease-out}
@keyframes mkb{40%{transform:scale(1.22)}}
#mk-lives{display:flex;gap:7px}
#mk-lives i{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 2px 0 var(--mk-lo)}
#mk-lives i.off{background:rgba(255,255,255,.3);box-shadow:none}
#mk-bar{width:min(200px,50vw);height:10px;border-radius:6px;background:rgba(255,255,255,.35);overflow:hidden}
#mk-bar b{display:block;height:100%;width:100%;background:#fff;border-radius:6px;transform-origin:left;transition:background .2s}
#mk-bar.warn b{background:#f43f5e}
#mk-hint{position:fixed;left:0;right:0;bottom:calc(var(--mk-b,16px) + 6px);text-align:center;font-size:18px;font-weight:600;color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.3);pointer-events:none;transition:opacity .4s;opacity:0}
.mk-pop{position:fixed;transform:translate(-50%,-50%);font-weight:600;font-size:26px;color:#fff;pointer-events:none;white-space:nowrap;
  text-shadow:0 3px 0 rgba(0,0,0,.25);animation:mkpop .75s ease-out forwards}
@keyframes mkpop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
#mk-praise{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:46px;font-weight:600;color:#fff;pointer-events:none;
  text-shadow:0 4px 0 var(--mk-lo);opacity:0}
#mk-praise.on{animation:mkpr .9s ease-out forwards}
@keyframes mkpr{0%{opacity:0;transform:scale(.4)}18%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
#mk-over{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;

    }
  });

  MK.init = function (c) {
    cfg = c;
    document.title = c.title;
    const r = document.documentElement.style;
    r.setProperty('--mk-c', c.color); r.setProperty('--mk-lo', c.lo || c.color); r.setProperty('--mk-bg', c.bg || '#17171A');
    cv = document.createElement('canvas'); cv.id = 'mk'; document.body.appendChild(cv);
    document.body.insertAdjacentHTML('beforeend',
      `<div id="mk-hud"><div id="mk-score">0</div><div id="mk-lives" hidden></div><div id="mk-bar" hidden><b></b></div></div>` +
      `<div id="mk-hint"></div><div id="mk-praise"></div><div id="mk-flash"></div><div id="mk-over" hidden></div>` +
      (inFrame ? '' : `<div id="mk-load">Loading ${c.title}</div>`));
    hud = { wrap: $('mk-hud'), score: $('mk-score'), lives: $('mk-lives'), bar: $('mk-bar'), hint: $('mk-hint'), praise: $('mk-praise'), over: $('mk-over'), flash: $('mk-flash') };
    hud.wrap.style.opacity = 0;
    MK.best = ((store.get().best || {})[c.id]) || 0;
    applySafe();
    addEventListener('resize', resize);
    if (!inFrame) {
      addEventListener('pointerdown', e => press('p' + e.pointerId, e.clientX, e.clientY));
      addEventListener('pointermove', e => move('p' + e.pointerId, e.clientX, e.clientY));
      addEventListener('pointerup', e => release('p' + e.pointerId));
      addEventListener('pointercancel', e => release('p' + e.pointerId));
      addEventListener('contextmenu', e => e.preventDefault());
      addEventListener('keydown', e => { if (!e.repeat && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); press('k', MK.W / 2, MK.H / 2); } });
      addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter') release('k'); });
      document.addEventListener('visibilitychange', () => setActive(!document.hidden));
    }
    loadOwned();
    send({ t: 'ready', phase: 'loading', shop: cfg.shop || [], base: !!cfg.base, baseName: cfg.baseName || '', title: cfg.title });
    runtime().then(async ({ T, K, doc }) => {
      MK.T = T; MK.Sandy = K; doc3 = doc;
      const R = MK.renderer = new T.WebGLRenderer({ canvas: cv, antialias: !touchDev, powerPreference: 'high-performance' });
      if (!K && T.ColorManagement) { T.ColorManagement.enabled = false; if ('outputColorSpace' in R) R.outputColorSpace = 'srgb'; }
      else R.outputEncoding = T.sRGBEncoding;
      R.shadowMap.enabled = true; R.shadowMap.type = T.PCFSoftShadowMap;
      const scene = MK.scene = new T.Scene();
      scene.add(MK.hemi = new T.HemisphereLight(0xfff4e0, 0x5a6a50, .85));
      const sun = MK.sun = new T.DirectionalLight(0xfff0dc, .95);
      sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.bias = -.0006;
      scene.add(sun, sun.target);
      MK.camera = new T.PerspectiveCamera(40, MK.W / MK.H, 10, 30000);
      await cfg.setup(T, scene);
      booted = true;
      if (cfg.onOwned) cfg.onOwned();
      cfg.reset();      // state first, then size the view around it
      resize();
      const ld = $('mk-load'); if (ld) ld.remove();
      MK.phase = 'ready'; send({ t: 'phase', phase: 'ready' });
      hud.wrap.style.opacity = 1;
      render();
      if (active) { awayCheck(); start(); }
      if (pvWanted) { pvWanted = false; setTimeout(sendPreviews, 300); }
    }).catch(err => { const ld = $('mk-load'); if (ld) ld.textContent = 'This game could not load'; console.error(err); });
  };
})();

/* MICROKIT END */
</script>
<script>
/* MODELS: picnic_blanket_red, plate_A, teapot, mug, cupcake, donut_pink, waffle_stacked, apple, picnic_basket_round, flower_A, flower_B */
/* Waffle Stack · Grug micro game (3D) · control: tap anywhere.
   A waffle slides over the stack, from the left, then from the right. Tap to drop it. Whatever hangs over is sliced off
   and tumbles away, so the stack gets smaller. Land it dead on for a Perfect (+2); three Perfects in a row grow it back. */
(() => {
  const SLAB = 16, W0 = 110, CELL = 22, RANGE = 150;
  let slowK = 1, T, S, topMat, sideMat, stack, mover, debris, score, combo, overT, camY, idleT = 0;

  function waffleTex() {
    const c = MK.canvas(128, 128), g = c.getContext('2d');
    g.fillStyle = '#E8A447'; g.fillRect(0, 0, 128, 128);
    g.fillStyle = '#C47C2C'; g.fillRect(14, 14, 100, 100);
    g.fillStyle = '#F2BE6A'; g.fillRect(0, 0, 128, 12); g.fillRect(0, 0, 12, 128);
    const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; t.encoding = T.sRGBEncoding; t.anisotropy = 4;
    return t;
  }
  function slabMesh(x, z, w, d, y) {
    const geo = new T.BoxGeometry(w, SLAB, d), uv = geo.attributes.uv;
    // top face (vertices 8-11): world-aligned waffle grid, so the squares line up from layer to layer
    for (let i = 8; i < 12; i++) uv.setXY(i, (x - w / 2 + uv.getX(i) * w) / CELL, (z + d / 2 - (1 - uv.getY(i)) * d) / CELL);
    uv.needsUpdate = true;
    const m = new T.Mesh(geo, [sideMat, sideMat, topMat, sideMat, sideMat, sideMat]);
    m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; S.add(m);
    return m;
  }
  const yOf = i => 10 + SLAB / 2 + i * SLAB;

  function setup(T_, scene) {
    T = T_; S = scene;
    scene.background = MK.color('#BFE7FA');
    topMat = new T.MeshStandardMaterial({ map: waffleTex(), roughness: .7 });
    sideMat = new T.MeshStandardMaterial({ roughness: .75 }); sideMat.color = MK.color('#D58E3A');
    // a picnic on the grass: Tiny Treats blanket, plate, teapot and treats
    const grass = MK.mesh(new T.BoxGeometry(4000, 40, 4000), MK.mat('#8FD175', { roughness: 1 }), 0, -24, 0); grass.castShadow = false; scene.add(grass);
    const blanket = MK.model('picnic_blanket_red', null, { scale: 200 }); blanket.position.set(0, -2, 0); blanket.castShadow = false; scene.add(blanket);
    const plate = MK.model('plate_A', null, { scale: 360 }); plate.position.set(0, 0, 0); scene.add(plate);
    const props = [['teapot', 180, -250, -170, .6], ['mug', 150, 230, -150, -.5], ['cupcake', 170, -230, 150, 0], ['donut_pink', 190, 250, 160, .3], ['waffle_stacked', 150, 300, 20, .8], ['apple', 160, -300, 0, 0], ['picnic_basket_round', 140, -80, -330, .2]];
    for (const [n, sc, x, z, r] of props) { const m = MK.model(n, null, { scale: sc }); m.position.set(x, 0, z); m.rotation.y = r; scene.add(m); }
    for (let i = 0; i < 16; i++) { const f = MK.model(i % 2 ? 'flower_A' : 'flower_B', null, { scale: 140 }); const a = i * .4, rr = 520 + (i % 3) * 60; f.position.set(Math.cos(a) * rr, 0, Math.sin(a) * rr); scene.add(f); }
  }
  function clear() {
    for (const s of stack || []) S.remove(s.mesh);
    for (const d of debris || []) S.remove(d.mesh);
    if (mover) S.remove(mover.mesh);
  }
  function reset() {
    clear();
    const w0 = MK.starting && MK.use('wide') ? W0 * 1.25 : W0;
    slowK = MK.starting && MK.use('slow') ? .8 : 1;
    stack = [{ x: 0, z: 0, w: w0, d: w0 }]; stack[0].mesh = slabMesh(0, 0, w0, w0, yOf(0));
    debris = []; score = 0; combo = 0; overT = -1; camY = 0; mover = null;
    MK.hud.score(0);
    spawn();
  }
  function spawn() {
    const n = stack.length, top = stack[n - 1], axis = n % 2 ? 'x' : 'z', from = n % 4 < 2 ? -1 : 1;
    mover = { axis, w: top.w, d: top.d, x: top.x, z: top.z, dir: -from, v: Math.min(360, 125 + n * 7) * slowK };
    mover[axis] = from * RANGE;
    mover.mesh = slabMesh(mover.x, mover.z, mover.w, mover.d, yOf(n));
  }
  function addDebris(x, z, w, d, y, push) {
    const mesh = slabMesh(x, z, w, d, y);
    debris.push({ mesh, vy: 60, vx: push.x * 90, vz: push.z * 90, rx: push.z * 3, rz: -push.x * 3 });
  }
  function drop() {
    const n = stack.length, top = stack[n - 1], m = mover, a = m.axis, size = a === 'x' ? m.w : m.d;
    const delta = m[a] - top[a], ov = size - Math.abs(delta), y = yOf(n);
    S.remove(m.mesh); mover = null;
    if (ov <= 0) {
      addDebris(m.x, m.z, m.w, m.d, y, { x: a === 'x' ? Math.sign(delta) : 0, z: a === 'z' ? Math.sign(delta) : 0 });
      MK.shake(8); MK.haptic(70); overT = .7; MK.flash('#ef4444', .2); MK.burst(new T.Vector3(m.x, y, m.z), { n: 12, colors: ['#F3C77A', '#FFF4E2'], speed: 180, size: 5 }); return;
    }
    let slab;
    if (Math.abs(delta) < 3.5) {
      combo++;
      const grow = combo >= 3 ? 8 : 0;
      slab = { x: top.x, z: top.z, w: Math.min(W0, top.w + (a === 'x' ? grow : 0)), d: Math.min(W0, top.d + (a === 'z' ? grow : 0)) };
      score += 2; MK.praise(combo > 1 ? 'Perfect x' + combo : 'Perfect!'); MK.haptic([12, 30, 18]);
      const at = new T.Vector3(top.x, y, top.z);
      MK.ring(at, { color: '#fff7c2', radius: Math.max(top.w, top.d) * (1.1 + combo * .15), life: .4 }); MK.sparkle(at, { n: 8 + combo * 3, speed: 140, size: 5 }); MK.toScore(at, 2 + Math.min(4, combo));
      if (combo >= 3) MK.hitstop(.05);
    } else {
      combo = 0;
      const c = top[a] + delta / 2;
      slab = { x: m.x, z: m.z, w: m.w, d: m.d }; slab[a] = c;
      if (a === 'x') slab.w = ov; else slab.d = ov;
      const cut = { x: m.x, z: m.z, w: m.w, d: m.d }, s = Math.sign(delta);
      cut[a] = c + s * (ov / 2 + Math.abs(delta) / 2);
      if (a === 'x') cut.w = Math.abs(delta); else cut.d = Math.abs(delta);
      addDebris(cut.x, cut.z, cut.w, cut.d, y, { x: a === 'x' ? s : 0, z: a === 'z' ? s : 0 });
      score += 1; MK.haptic(12);
      MK.burst(new T.Vector3(cut.x, y, cut.z), { n: 8, colors: ['#F3C77A', '#E8A951', '#FFF4E2'], speed: 140, size: 4, up: .4 });
    }
    slab.mesh = slabMesh(slab.x, slab.z, slab.w, slab.d, y);
    slab.bounce = 1;
    stack.push(slab);
    MK.hud.score(score);
    spawn();
  }
  function step(dt) {
    camY += (Math.max(0, stack.length * SLAB - 60) - camY) * Math.min(1, dt * 5);
    for (const d of debris) {
      d.vy -= 1500 * dt; d.mesh.position.x += d.vx * dt; d.mesh.position.z += d.vz * dt; d.mesh.position.y += d.vy * dt;
      d.mesh.rotation.x += d.rx * dt; d.mesh.rotation.z += d.rz * dt;
    }
    debris = debris.filter(d => { if (d.mesh.position.y < camY - 500) { S.remove(d.mesh); return false; } return true; });
    for (const s of stack) if (s.bounce > 0) { s.bounce = Math.max(0, s.bounce - dt * 6); s.mesh.scale.y = 1 + Math.sin(s.bounce * Math.PI) * .35; }
    if (mover) {
      mover[mover.axis] += mover.dir * mover.v * dt;
      if (Math.abs(mover[mover.axis]) > RANGE) { mover[mover.axis] = Math.sign(mover[mover.axis]) * RANGE; mover.dir *= -1; }
      mover.mesh.position.set(mover.x, yOf(stack.length), mover.z);
    }
    place();
  }
  function place() {
    const C = MK.camera;
    C.position.set(330, 430 + camY, 330); C.lookAt(0, 40 + camY, 0);
    MK.sunAt(0, camY, 0, 320);
  }
  const FLAVOURS = { waffle_choc: ['#8B5A3C', '#6B3F26'], waffle_berry: ['#F9A8D4', '#EC7FB4'], waffle_matcha: ['#A3D977', '#7FB955'], waffle_blue: ['#93C5FD', '#60A5FA'], waffle_lemon: ['#FDE68A', '#FACC15'], waffle_taro: ['#C4B5FD', '#A78BFA'], waffle_mint: ['#A7F3D0', '#6EE7B7'], waffle_char: ['#4B5563', '#374151'] };
  function flavour() {
    const f = FLAVOURS[MK.equipped('flavour')];
    topMat.color = f ? MK.color(f[0]) : new T.Color(1, 1, 1); sideMat.color = MK.color(f ? f[1] : '#D58E3A');
  }
  MK.init({
    id: 'stack', title: 'Waffle Stack', controls: 'tap', color: '#f59e0b', lo: '#b9770a', bg: '#BFE7FA', scoreName: 'Waffles', coinRate: .8,
    shop: [
      { id: 'wide', name: 'Big Batter', desc: 'Start with a 25% wider waffle for one run', kind: 'boost', coins: 20 },
      { id: 'slow', name: 'Lazy Slider', desc: 'Waffles slide 20% slower for one run', kind: 'boost', coins: 20 },
      { id: 'waffle_choc', name: 'Chocolate Waffles', desc: 'Rich and dark', kind: 'skin', group: 'flavour', color: '#8B5A3C', coins: 50 },
      { id: 'waffle_berry', name: 'Strawberry Waffles', desc: 'Pretty in pink', kind: 'skin', group: 'flavour', color: '#F9A8D4', coins: 50 },
      { id: 'waffle_matcha', name: 'Matcha Waffles', desc: 'Green tea glow', kind: 'skin', group: 'flavour', color: '#A3D977', pearls: 30 },
      { id: 'waffle_blue', name: 'Blueberry Waffles', desc: 'Bursting with berries', kind: 'skin', group: 'flavour', color: '#93C5FD', coins: 50 },
      { id: 'waffle_lemon', name: 'Lemon Waffles', desc: 'Zesty and bright', kind: 'skin', group: 'flavour', color: '#FDE68A', coins: 50 },
      { id: 'waffle_taro', name: 'Taro Waffles', desc: 'Soft purple', kind: 'skin', group: 'flavour', color: '#C4B5FD', coins: 70 },
      { id: 'waffle_mint', name: 'Mint Waffles', desc: 'Cool and fresh', kind: 'skin', group: 'flavour', color: '#A7F3D0', coins: 70 },
      { id: 'waffle_char', name: 'Charcoal Waffles', desc: 'Bold and black', kind: 'skin', group: 'flavour', color: '#4B5563', coins: 110 },
      { id: 'box_flavour', name: 'Waffle Crate', desc: 'A random one of 8. Already have it? Half your coins back', kind: 'box', coins: 30, pool: ['waffle_choc', 'waffle_berry', 'waffle_matcha', 'waffle_blue', 'waffle_lemon', 'waffle_taro', 'waffle_mint', 'waffle_char'] }
    ],
    onOwned: flavour,
    // shop previews: a little stack of three waffles
    preview(it) {
      const f = FLAVOURS[it.id]; if (!f) return null;
      const g = new T.Group();
      for (let i = 0; i < 3; i++) { const m = MK.mesh(new T.BoxGeometry(60 - i * 6, 12, 60 - i * 6), MK.mat(f[i % 2], { roughness: .7 }), (i - 1) * 4, i * 13, (1 - i) * 3); g.add(m); }
      for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) g.add(MK.mesh(new T.BoxGeometry(12, 3, 12), MK.mat(f[1]), -16 + i * 16 + 4, 34, -16 + j * 16 - 3));
      return g;
    },
    setup, reset,
    resize() { MK.fit(MK.camera, 320, 380, 560); place(); },
    down() { if (mover) drop(); },
    update(dt) { step(dt); if (overT > 0 && (overT -= dt) <= 0) MK.over(score); },
    idle(dt) { step(dt); }
  });
})();
