@font-face{font-family:'Fredoka';src:url(${FONT}) format('woff2');font-weight:300 700;font-display:block}
html,body{margin:0;height:100%;overflow:hidden;background:var(--mk-bg,#17171A);touch-action:none;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:Fredoka,ui-rounded,system-ui,sans-serif}
#mk{position:fixed;inset:0;width:100%;height:100%;display:block}
#mk-hud{position:fixed;left:0;right:0;top:var(--mk-t,16px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;transition:opacity .25s}
#mk-score{font-size:58px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 3px 0 var(--mk-lo)}
#mk-score.bump{animation:mkb .22s ease-out}
@keyframes mkb{40%{transform:scale(1.22)}}
#mk-lives{display:flex;gap:7px}
#mk-lives i{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 2px 0 var(--mk-lo)}
#mk-lives i.off{background:rgba(255,255,255,.3);box-shadow:none}
#mk-bar{width:min(200px,50vw);height:10px;border-radius:6px;background:rgba(255,255,255,.35);overflow:hidden}
#mk-bar b{display:block;height:100%;width:100%;background:#fff;border-radius:6px;transform-origin:left;transition:background .2s}
#mk-bar.warn b{background:#f43f5e}
#mk-hint{position:fixed;left:0;right:0;bottom:calc(var(--mk-b,16px) + 6px);text-align:center;font-size:18px;font-weight:600;color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.3);pointer-events:none;transition:opacity .4s;opacity:0}
.mk-pop{position:fixed;transform:translate(-50%,-50%);font-weight:600;font-size:26px;color:#fff;pointer-events:none;white-space:nowrap;
  text-shadow:0 3px 0 rgba(0,0,0,.25);animation:mkpop .75s ease-out forwards}
@keyframes mkpop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
#mk-praise{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:46px;font-weight:600;color:#fff;pointer-events:none;
  text-shadow:0 4px 0 var(--mk-lo);opacity:0}
#mk-praise.on{animation:mkpr .9s ease-out forwards}
@keyframes mkpr{0%{opacity:0;transform:scale(.4)}18%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
#mk-over{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;

    }
  });

  MK.init = function (c) {
    cfg = c;
    document.title = c.title;
    const r = document.documentElement.style;
    r.setProperty('--mk-c', c.color); r.setProperty('--mk-lo', c.lo || c.color); r.setProperty('--mk-bg', c.bg || '#17171A');
    cv = document.createElement('canvas'); cv.id = 'mk'; document.body.appendChild(cv);
    document.body.insertAdjacentHTML('beforeend',
      `<div id="mk-hud"><div id="mk-score">0</div><div id="mk-lives" hidden></div><div id="mk-bar" hidden><b></b></div></div>` +
      `<div id="mk-hint"></div><div id="mk-praise"></div><div id="mk-flash"></div><div id="mk-over" hidden></div>` +
      (inFrame ? '' : `<div id="mk-load">Loading ${c.title}</div>`));
    hud = { wrap: $('mk-hud'), score: $('mk-score'), lives: $('mk-lives'), bar: $('mk-bar'), hint: $('mk-hint'), praise: $('mk-praise'), over: $('mk-over'), flash: $('mk-flash') };
    hud.wrap.style.opacity = 0;
    MK.best = ((store.get().best || {})[c.id]) || 0;
    applySafe();
    addEventListener('resize', resize);
    if (!inFrame) {
      addEventListener('pointerdown', e => press('p' + e.pointerId, e.clientX, e.clientY));
      addEventListener('pointermove', e => move('p' + e.pointerId, e.clientX, e.clientY));
      addEventListener('pointerup', e => release('p' + e.pointerId));
      addEventListener('pointercancel', e => release('p' + e.pointerId));
      addEventListener('contextmenu', e => e.preventDefault());
      addEventListener('keydown', e => { if (!e.repeat && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); press('k', MK.W / 2, MK.H / 2); } });
      addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter') release('k'); });
      document.addEventListener('visibilitychange', () => setActive(!document.hidden));
    }
    loadOwned();
    send({ t: 'ready', phase: 'loading', shop: cfg.shop || [], base: !!cfg.base, baseName: cfg.baseName || '', title: cfg.title });
    runtime().then(async ({ T, K, doc }) => {
      MK.T = T; MK.Sandy = K; doc3 = doc;
      const R = MK.renderer = new T.WebGLRenderer({ canvas: cv, antialias: !touchDev, powerPreference: 'high-performance' });
      if (!K && T.ColorManagement) { T.ColorManagement.enabled = false; if ('outputColorSpace' in R) R.outputColorSpace = 'srgb'; }
      else R.outputEncoding = T.sRGBEncoding;
      R.shadowMap.enabled = true; R.shadowMap.type = T.PCFSoftShadowMap;
      const scene = MK.scene = new T.Scene();
      scene.add(MK.hemi = new T.HemisphereLight(0xfff4e0, 0x5a6a50, .85));
      const sun = MK.sun = new T.DirectionalLight(0xfff0dc, .95);
      sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.bias = -.0006;
      scene.add(sun, sun.target);
      MK.camera = new T.PerspectiveCamera(40, MK.W / MK.H, 10, 30000);
      await cfg.setup(T, scene);
      booted = true;
      if (cfg.onOwned) cfg.onOwned();
      cfg.reset();      // state first, then size the view around it
      resize();
      const ld = $('mk-load'); if (ld) ld.remove();
      MK.phase = 'ready'; send({ t: 'phase', phase: 'ready' });
      hud.wrap.style.opacity = 1;
      render();
      if (active) { awayCheck(); start(); }
      if (pvWanted) { pvWanted = false; setTimeout(sendPreviews, 300); }
    }).catch(err => { const ld = $('mk-load'); if (ld) ld.textContent = 'This game could not load'; console.error(err); });
  };
})();

/* MICROKIT END */
</script>
<script>
/* MODELS: b_grass, b_sand_with_grass, b_grass_with_snow, b_stone */
/* Matcha Zigzag · Grug micro game (3D) · control: tap anywhere.
   A boba pearl rolls along a zigzag path of matcha tiles. Tap to turn (it swaps between the two directions). Stay on
   the path: roll off the edge and it's over. Each new tile is +1, tea leaves on the path are +3. The tiles behind you
   drop away and the pearl speeds up. */
(() => {
  const TILE = 90, BR = 20;
  let pools = {}, shield = 0, seq = 0, T, S, geo, matA, matB, leafM, tiles, map, pool = [], leafPool = [], cur, runDir, runLeft, ball, bx, bz, by, vy, dir, best, score, falling, fallT, camP, idleT = 0;
  const key = (i, j) => i + ',' + j;

  function setup(T_, scene) {
    T = T_; S = scene;
    scene.background = MK.color('#E3F3D8');
    scene.fog = new T.Fog(MK.color('#E3F3D8'), 1600, 2900);
    geo = new T.BoxGeometry(TILE, 60, TILE);
    matA = MK.mat('#9BCB6B', { roughness: .7 }); matB = MK.mat('#86B85A', { roughness: .7 });
    leafM = MK.mat('#2F855A', { roughness: .5, emissive: '#14532d', emissiveIntensity: .3 });
    ball = MK.mesh(new T.SphereGeometry(BR, 24, 18), MK.mat('#3B2416', { roughness: .22 }));
    ball.add(MK.mesh(new T.SphereGeometry(BR * .28, 10, 8), MK.mat('#A07050', { roughness: .2 }), -BR * .35, BR * .55, BR * .4, false));
    scene.add(ball);
    tiles = []; map = new Map();
    camP = new T.Vector3();
  }
  function addTile(i, j, leaf, idx) {
    // voxel tiles that change with distance: grass, sand, snow, stone
    const kind = ['b_grass', 'b_sand_with_grass', 'b_grass_with_snow', 'b_stone'][Math.floor(idx / 60) % 4];
    const list = pools[kind] = pools[kind] || [];
    const m = list.pop() || MK.model(kind, null, { scale: TILE / 2 }); m.userData.kind = kind;
    m.position.set(i * TILE, -420, -j * TILE); S.add(m);
    const t = { i, j, m, y: -420, idx, fall: 0 };
    if (leaf) { t.leaf = leafPool.pop() || (() => { const l = MK.mesh(new T.SphereGeometry(18, 14, 10), leafM); l.scale.set(1.6, .45, .9); return l; })(); S.add(t.leaf); }
    tiles.push(t); map.set(key(i, j), t);
    return t;
  }
  function extend() {
    if (runLeft <= 0) { runDir = runDir === 'x' ? 'z' : 'x'; runLeft = 1 + Math.floor(Math.random() * (Math.random() < .5 ? 3 : 5)); }
    if (runDir === 'x') cur.i++; else cur.j++;
    runLeft--;
    if (!map.has(key(cur.i, cur.j))) { seq++; addTile(cur.i, cur.j, seq > 4 && Math.random() < .14, seq); }
  }
  function clear() {
    for (const t of tiles) { S.remove(t.m); pools[t.m.userData.kind].push(t.m); if (t.leaf) { S.remove(t.leaf); leafPool.push(t.leaf); } }
    tiles = []; map.clear();
  }
  function reset() {
    clear();
    // a small square to start on, then a straight run
    seq = 0;
    for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) addTile(i, j, false, 0);
    for (const t of tiles) t.y = 0;
    cur = { i: 1, j: 0 }; runDir = 'x'; runLeft = 4;
    for (let k = 0; k < 44; k++) extend();
    bx = 0; bz = 0; by = 0; vy = 0; dir = 'x'; best = 0; score = 0; falling = false; fallT = 0;
    MK.hud.score(0);
    sync(0, true);
  }
  const BALLS = { ball_matcha: '#65a30d', ball_berry: '#ec4899', ball_gold: '#facc15', ball_blue: '#3b82f6', ball_orange: '#f97316', ball_white: '#f8fafc', ball_purple: '#8b5cf6', ball_red: '#ef4444' };
  function start() { shield = MK.starting && MK.use('net') ? 1 : 0; MK.hud.hint(shield ? 'Safety Net on · tap to turn' : 'Tap to turn'); }
  function sync(dt, snap) {
    for (const t of tiles) {
      if (t.fall) { t.fall += dt; t.y -= (200 + t.fall * 1400) * dt; }
      else t.y += (0 - t.y) * (snap ? 1 : Math.min(1, dt * 7));
      t.m.position.y = t.y - TILE / 2;
      if (t.leaf) { t.leaf.position.set(t.i * TILE, t.y + 34 + Math.sin(idleT * 3 + t.idx) * 5, -t.j * TILE); t.leaf.rotation.y = idleT * 2 + t.idx; }
    }
    ball.position.set(bx, by + BR, bz);
    const target = new T.Vector3(bx, 0, bz);
    if (snap) camP.copy(target); else camP.lerp(target, Math.min(1, dt * 4));
    const C = MK.camera; C.position.set(camP.x - 520, 760, camP.z + 520); C.lookAt(camP.x + 110, 0, camP.z - 110);
    MK.sunAt(camP.x, 0, camP.z, 700);
  }
  function update(dt) {
    idleT += dt;
    const v = Math.min(560, 270 + score * 2.2);
    if (!falling) {
      if (dir === 'x') { bx += v * dt; ball.rotation.z -= v * dt / BR; } else { bz -= v * dt; ball.rotation.x -= v * dt / BR; }
      const t = map.get(key(Math.round(bx / TILE), Math.round(-bz / TILE)));
      if ((!t || t.fall) && shield) {
        // Safety Net: hop back onto the last tile, facing the way the path goes
        shield = 0; const back = tiles.filter(o => !o.fall && o.idx === best)[0] || tiles.find(o => !o.fall && o.idx > 0);
        if (back) { bx = back.i * TILE; bz = -back.j * TILE; const nx = map.get(key(back.i + 1, back.j)); dir = nx ? 'x' : 'z'; }
        MK.popAt(new T.Vector3(bx, 80, bz), 'Safety net!', '#fff', 28); MK.haptic(30);
      } else if (!t || t.fall) { falling = true; vy = 0; MK.shake(10); MK.haptic(80); MK.burst(new T.Vector3(bx, 10, bz), { n: 12, colors: ['#9BCB6B', '#ffffff'], speed: 220, size: 8 }); }
      else {
        if (t.idx > best) { score += t.idx - best; best = t.idx; MK.hud.score(score); if (score % 25 === 0) { MK.praise(['Smooth!', 'Matcha master!', 'Zig! Zag!'][(score / 25 - 1) % 3]); MK.sparkle(new T.Vector3(bx, 60, bz), { n: 16, speed: 220 }); } }
        if (t.leaf) { S.remove(t.leaf); leafPool.push(t.leaf); t.leaf = null; score += 3; MK.hud.score(score); MK.haptic([10, 25, 10]); MK.popAt(new T.Vector3(bx, 60, bz), '+3', '#14532d', 32); const at = new T.Vector3(bx, 40, bz); MK.burst(at, { n: 12, colors: ['#2F855A', '#86efac', '#ffffff'], speed: 240, size: 7, glow: true, gravity: 300 }); MK.toScore(at, 3, '#86efac'); }
        // drop the tiles well behind, build more ahead
        for (const o of tiles) if (!o.fall && o.idx < best - 7) { o.fall = 1e-4; map.delete(key(o.i, o.j)); }
        while (seq - best < 44) extend();
      }
    } else {
      fallT += dt; vy -= 2400 * dt; by += vy * dt;
      if (dir === 'x') bx += 120 * dt; else bz -= 120 * dt;
      if (fallT > .75) { MK.over(score); return; }
    }
    tiles = tiles.filter(t => { if (t.fall && t.y < -900) { S.remove(t.m); pools[t.m.userData.kind].push(t.m); if (t.leaf) { S.remove(t.leaf); leafPool.push(t.leaf); } return false; } return true; });
    if (MK.t > 2.5) MK.hud.hint(null, false);
    sync(dt);
  }
  MK.init({
    id: 'zigzag', title: 'Matcha Zigzag', controls: 'tap', color: '#4d9e3f', lo: '#2f6e26', bg: '#E3F3D8', scoreName: 'Tiles', coinRate: .3,
    shop: [
      { id: 'net', name: 'Safety Net', desc: 'Saves you from one fall, for one run', kind: 'boost', coins: 25 },
      { id: 'ball_matcha', name: 'Matcha Pearl', desc: 'A green tea pearl', kind: 'skin', group: 'ball', color: '#65a30d', coins: 40 },
      { id: 'ball_berry', name: 'Strawberry Pearl', desc: 'A pink pearl', kind: 'skin', group: 'ball', color: '#ec4899', coins: 40 },
      { id: 'ball_gold', name: 'Golden Pearl', desc: 'Rolls in style', kind: 'skin', group: 'ball', color: '#facc15', pearls: 30 },
      { id: 'ball_blue', name: 'Blue Pearl', desc: 'Ocean blue', kind: 'skin', group: 'ball', color: '#3b82f6', coins: 40 },
      { id: 'ball_orange', name: 'Mango Pearl', desc: 'Juicy orange', kind: 'skin', group: 'ball', color: '#f97316', coins: 40 },
      { id: 'ball_white', name: 'Milk Pearl', desc: 'Creamy white', kind: 'skin', group: 'ball', color: '#f8fafc', coins: 60 },
      { id: 'ball_purple', name: 'Taro Pearl', desc: 'Purple and proud', kind: 'skin', group: 'ball', color: '#8b5cf6', coins: 60 },
      { id: 'ball_red', name: 'Cherry Pearl', desc: 'Bright red', kind: 'skin', group: 'ball', color: '#ef4444', coins: 90 },
      { id: 'box_ball', name: 'Pearl Crate', desc: 'A random one of 8. Already have it? Half your coins back', kind: 'box', coins: 25, pool: ['ball_matcha', 'ball_berry', 'ball_gold', 'ball_blue', 'ball_orange', 'ball_white', 'ball_purple', 'ball_red'] }
    ],
    onOwned() { if (ball) ball.material = MK.mat(BALLS[MK.equipped('ball')] || '#3B2416', { roughness: .22, metalness: MK.equipped('ball') === 'ball_gold' ? .4 : 0 }); },
    // shop previews: the pearl
    preview(it) {
      const c = BALLS[it.id]; if (!c) return null;
      const g = new T.Group(), b = MK.mesh(new T.SphereGeometry(30, 28, 20), MK.mat(c, { roughness: .2, metalness: it.id === 'ball_gold' ? .4 : 0 }));
      g.add(b, MK.mesh(new T.SphereGeometry(8, 12, 8), MK.mat('#ffffff', { roughness: .1 }), -10, 16, 18)); return g;
    },
    setup, reset, start, update,
    down() { if (!falling) { dir = dir === 'x' ? 'z' : 'x'; MK.haptic(6); MK.burst(new T.Vector3(bx, 6, bz), { n: 5, color: '#E3F3D8', speed: 120, size: 6, up: .2 }); } },
    idle(dt) { idleT += dt; sync(dt); },
    resize() { MK.fit(MK.camera, 900, 1100, 1100); sync(0, true); }
  });
})();
</script>
