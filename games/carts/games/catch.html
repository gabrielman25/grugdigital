@font-face{font-family:'Fredoka';src:url(${FONT}) format('woff2');font-weight:300 700;font-display:block}
html,body{margin:0;height:100%;overflow:hidden;background:var(--mk-bg,#17171A);touch-action:none;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:Fredoka,ui-rounded,system-ui,sans-serif}
#mk{position:fixed;inset:0;width:100%;height:100%;display:block}
#mk-hud{position:fixed;left:0;right:0;top:var(--mk-t,16px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;transition:opacity .25s}
#mk-score{font-size:58px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 3px 0 var(--mk-lo)}
#mk-score.bump{animation:mkb .22s ease-out}
@keyframes mkb{40%{transform:scale(1.22)}}
#mk-lives{display:flex;gap:7px}
#mk-lives i{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 2px 0 var(--mk-lo)}
#mk-lives i.off{background:rgba(255,255,255,.3);box-shadow:none}
#mk-bar{width:min(200px,50vw);height:10px;border-radius:6px;background:rgba(255,255,255,.35);overflow:hidden}
#mk-bar b{display:block;height:100%;width:100%;background:#fff;border-radius:6px;transform-origin:left;transition:background .2s}
#mk-bar.warn b{background:#f43f5e}
#mk-hint{position:fixed;left:0;right:0;bottom:calc(var(--mk-b,16px) + 6px);text-align:center;font-size:18px;font-weight:600;color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.3);pointer-events:none;transition:opacity .4s;opacity:0}
.mk-pop{position:fixed;transform:translate(-50%,-50%);font-weight:600;font-size:26px;color:#fff;pointer-events:none;white-space:nowrap;
  text-shadow:0 3px 0 rgba(0,0,0,.25);animation:mkpop .75s ease-out forwards}
@keyframes mkpop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
#mk-praise{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:46px;font-weight:600;color:#fff;pointer-events:none;
  text-shadow:0 4px 0 var(--mk-lo);opacity:0}
#mk-praise.on{animation:mkpr .9s ease-out forwards}
@keyframes mkpr{0%{opacity:0;transform:scale(.4)}18%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
#mk-over{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;

    }
  });

  MK.init = function (c) {
    cfg = c;
    document.title = c.title;
    const r = document.documentElement.style;
    r.setProperty('--mk-c', c.color); r.setProperty('--mk-lo', c.lo || c.color); r.setProperty('--mk-bg', c.bg || '#17171A');
    cv = document.createElement('canvas'); cv.id = 'mk'; document.body.appendChild(cv);
    document.body.insertAdjacentHTML('beforeend',
      `<div id="mk-hud"><div id="mk-score">0</div><div id="mk-lives" hidden></div><div id="mk-bar" hidden><b></b></div></div>` +
      `<div id="mk-hint"></div><div id="mk-praise"></div><div id="mk-flash"></div><div id="mk-over" hidden></div>` +
      (inFrame ? '' : `<div id="mk-load">Loading ${c.title}</div>`));
    hud = { wrap: $('mk-hud'), score: $('mk-score'), lives: $('mk-lives'), bar: $('mk-bar'), hint: $('mk-hint'), praise: $('mk-praise'), over: $('mk-over'), flash: $('mk-flash') };
    hud.wrap.style.opacity = 0;
    MK.best = ((store.get().best || {})[c.id]) || 0;
    applySafe();
    addEventListener('resize', resize);
    if (!inFrame) {
      addEventListener('pointerdown', e => press('p' + e.pointerId, e.clientX, e.clientY));
      addEventListener('pointermove', e => move('p' + e.pointerId, e.clientX, e.clientY));
      addEventListener('pointerup', e => release('p' + e.pointerId));
      addEventListener('pointercancel', e => release('p' + e.pointerId));
      addEventListener('contextmenu', e => e.preventDefault());
      addEventListener('keydown', e => { if (!e.repeat && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); press('k', MK.W / 2, MK.H / 2); } });
      addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter') release('k'); });
      document.addEventListener('visibilitychange', () => setActive(!document.hidden));
    }
    loadOwned();
    send({ t: 'ready', phase: 'loading', shop: cfg.shop || [], base: !!cfg.base, baseName: cfg.baseName || '', title: cfg.title });
    runtime().then(async ({ T, K, doc }) => {
      MK.T = T; MK.Sandy = K; doc3 = doc;
      const R = MK.renderer = new T.WebGLRenderer({ canvas: cv, antialias: !touchDev, powerPreference: 'high-performance' });
      if (!K && T.ColorManagement) { T.ColorManagement.enabled = false; if ('outputColorSpace' in R) R.outputColorSpace = 'srgb'; }
      else R.outputEncoding = T.sRGBEncoding;
      R.shadowMap.enabled = true; R.shadowMap.type = T.PCFSoftShadowMap;
      const scene = MK.scene = new T.Scene();
      scene.add(MK.hemi = new T.HemisphereLight(0xfff4e0, 0x5a6a50, .85));
      const sun = MK.sun = new T.DirectionalLight(0xfff0dc, .95);
      sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.bias = -.0006;
      scene.add(sun, sun.target);
      MK.camera = new T.PerspectiveCamera(40, MK.W / MK.H, 10, 30000);
      await cfg.setup(T, scene);
      booted = true;
      if (cfg.onOwned) cfg.onOwned();
      cfg.reset();      // state first, then size the view around it
      resize();
      const ld = $('mk-load'); if (ld) ld.remove();
      MK.phase = 'ready'; send({ t: 'phase', phase: 'ready' });
      hud.wrap.style.opacity = 1;
      render();
      if (active) { awayCheck(); start(); }
      if (pvWanted) { pvWanted = false; setTimeout(sendPreviews, 300); }
    }).catch(err => { const ld = $('mk-load'); if (ld) ld.textContent = 'This game could not load'; console.error(err); });
  };
})();

/* MICROKIT END */
</script>
<script>
/* MODELS: bowl, kettle, toaster, utensils_cup, dishrack_plates, succulent_plant_pot_small, papertowel_holder, mug_A_blue, wall_cabinet_straight, wall_tiles_kitchen_straight, wall_tiles_kitchen_window_large, wall_knife_rack, cuttingboard */
/* Chopstick Catch · Grug micro game (3D) · control: tap anywhere.
   Dumplings drop from a steamer, straight down past a pair of chopsticks. Tap to snap the chopsticks shut as one
   passes between them (+1; dead centre is a Perfect, +2; golden ones fall fast, +3). Caught dumplings fly into the
   bowl. Let a dumpling fall past, or catch a chili, and you lose a life (three lives). Snapping at nothing just wastes
   the snap. They fall faster as you go. */
(() => {
  const SNAP_Y = 380, TOPY = 860, JAW = 34;
  // the catch happens in its own units (a dumpling is 60 across); the play group shrinks it to real size (6.6 cm)
  // on a real kitchen counter (92 cm high), so the kitchen around it is life-size
  const K = .11, TOP_Y = 92;
  let play;
  const W = (x, y, z) => play.localToWorld(new T.Vector3(x, y, z));
  let maxL = 3, wideK = 1;
  const STICKS = { sticks_jade: ['#10b981', '#065f46'], sticks_gold: ['#facc15', '#a16207'], sticks_red: ['#ef4444', '#7f1d1d'], sticks_blue: ['#60a5fa', '#1e3a8a'], sticks_pink: ['#f9a8d4', '#9d174d'], sticks_black: ['#374151', '#111827'], sticks_white: ['#f8fafc', '#94a3b8'] };
  let T, S, top, bot, bowl, bowlFill, items, pool = { dump: [], gold: [], chili: [] }, snapT, spawnT, lives, score, combo, caught, idleT = 0;

  function dumpling(gold) {
    const g = new T.Group(), m = MK.mat(gold ? '#FFD34D' : '#FFF4E2', { roughness: gold ? .3 : .7, emissive: gold ? '#6b4e00' : '#000000', emissiveIntensity: gold ? .35 : 0 });
    const body = MK.mesh(new T.SphereGeometry(30, 20, 14), m); body.scale.y = .75; g.add(body);
    g.add(MK.mesh(new T.ConeGeometry(11, 18, 10), m, 0, 26, 0));
    for (const s of [-1, 1]) g.add(MK.mesh(new T.SphereGeometry(3, 8, 6), MK.mat('#3B2416'), s * 9, 4, 27, false));
    return g;
  }
  function chili() {
    const g = new T.Group();
    const b = MK.mesh(new T.CapsuleGeometry(12, 46, 6, 12), MK.mat('#E53935', { roughness: .3 })); b.rotation.z = .4; g.add(b);
    const st = MK.mesh(new T.CylinderGeometry(4, 6, 14, 8), MK.mat('#2E7D32'), 14, 32, 0); st.rotation.z = .4; g.add(st);
    return g;
  }
  function stick() {
    const g = new T.Group();
    const s = MK.mesh(new T.CylinderGeometry(4, 7, 320, 10), MK.mat('#8B5A2B', { roughness: .5 }), 0, 0, 0); s.rotation.z = Math.PI / 2; g.add(s);
    const tip = MK.mesh(new T.CylinderGeometry(7.5, 7.5, 50, 10), MK.mat('#e11d48', { roughness: .4 }), 135, 0, 0); tip.rotation.z = Math.PI / 2; g.add(tip);
    return g;
  }
  function setup(T_, scene) {
    T = T_; S = scene;
    scene.background = MK.color('#FFE4E6');
    // ---- a real-size kitchen (cm): counter, tiled wall with a window, wall cabinets, the usual clutter ----
    const tile = MK.canvas(64, 64), g = tile.getContext('2d');
    g.fillStyle = '#FBE3E6'; g.fillRect(0, 0, 64, 64); g.fillStyle = '#F2C9CF'; g.fillRect(0, 0, 64, 3); g.fillRect(0, 0, 3, 64);
    const tt = new T.CanvasTexture(tile); tt.wrapS = tt.wrapT = T.RepeatWrapping; tt.repeat.set(90, 40); tt.encoding = T.sRGBEncoding;
    scene.add(MK.mesh(new T.BoxGeometry(900, 400, 4), new T.MeshStandardMaterial({ map: tt, roughness: .6 }), 0, 200, -62, false));
    // the counter top (marble) and the cupboard fronts below it
    scene.add(MK.mesh(new T.BoxGeometry(900, 4, 120), MK.mat('#F6F1EA', { roughness: .35 }), 0, TOP_Y - 2, -2));
    scene.add(MK.mesh(new T.BoxGeometry(900, TOP_Y - 4, 112), MK.mat('#E9B8A4', { roughness: .8 }), 0, (TOP_Y - 4) / 2, -4, false));
    for (let x = -400; x <= 400; x += 60) scene.add(MK.mesh(new T.BoxGeometry(2, TOP_Y - 14, 2), MK.mat('#D79C86'), x, (TOP_Y - 4) / 2, 53, false));
    // a window behind the sink side, wall cabinets above, a knife rack
    const win = MK.model('wall_tiles_kitchen_window_large', null, { scale: 45 }); win.position.set(-75, TOP_Y - 2, -60); scene.add(win);
    for (const x of [10, 100]) { const m = MK.model('wall_cabinet_straight', null, { scale: 45 }); m.position.set(x, 196, -60); scene.add(m); }
    const knives = MK.model('wall_knife_rack', null, { scale: 30 }); knives.position.set(70, 150, -60); scene.add(knives);
    // things on the counter, at their real sizes
    for (const [n, x, z, sc, ry] of [['toaster', 42, -42, 30, -.25], ['utensils_cup', 66, -30, 26, 0], ['kettle', -46, -38, 34, .5], ['dishrack_plates', -92, -34, 40, .3],
      ['succulent_plant_pot_small', -50, 16, 18, 0], ['papertowel_holder', 92, -40, 36, 0], ['mug_A_blue', 40, 22, 16, -.6], ['cuttingboard', 46, 14, 24, .15]]) {
      const m = MK.model(n, null, { scale: sc }); m.position.set(x, TOP_Y, z); m.rotation.y = ry; scene.add(m);
    }
    // ---- the catch, shrunk onto the counter ----
    play = new T.Group(); play.position.set(0, TOP_Y, 6); play.scale.setScalar(K); scene.add(play);
    // the steamer basket the dumplings drop from, hanging under the wall cabinet
    play.add(MK.mesh(new T.CylinderGeometry(90, 90, 70, 28), MK.mat('#E8C27A', { roughness: .8 }), 0, TOPY + 40, 0, false));
    play.add(MK.mesh(new T.CylinderGeometry(70, 94, 30, 28), MK.mat('#EFCF8C', { roughness: .8 }), 0, TOPY + 90, 0, false));
    play.add(MK.mesh(new T.CylinderGeometry(3, 3, 400, 6), MK.mat('#a3a3a3'), 0, TOPY + 300, 0, false));
    // the chopsticks reach in from the right; their tips meet under the steamer
    top = stick(); bot = stick(); play.add(top, bot);
    // the bowl the catches go into
    bowl = new T.Group(); bowl.position.set(-170, 0, -40); bowl.scale.setScalar(.8); play.add(bowl);
    const bm = MK.model('bowl', null, { scale: 520 }); bowl.add(bm);
    bowlFill = MK.mesh(new T.CylinderGeometry(88, 50, 1, 32), MK.mat('#FFF4E2', { roughness: .7 }), 0, 30, 0, false); bowl.add(bowlFill);
    items = [];
    play.updateMatrixWorld(true);
    const C = MK.camera; C.position.copy(W(0, 820, 1150)); C.lookAt(W(0, 400, -60));
    MK.sunAt(0, TOP_Y + 40, 0, 140);
  }
  function get(kind) { const m = pool[kind].pop() || (kind === 'chili' ? chili() : dumpling(kind === 'gold')); m.rotation.set(0, 0, 0); m.scale.setScalar(1); play.add(m); return m; }
  function put(it) { play.remove(it.m); pool[it.kind].push(it.m); }
  function reset() {
    for (const it of items) put(it);
    items = []; snapT = -1; spawnT = .5; score = 0; combo = 0; caught = 0;
    const extra = MK.starting && MK.use('life') ? 1 : 0; lives = 3 + extra; maxL = lives;
    wideK = MK.starting && MK.use('wide') ? 1.4 : 1;
    MK.hud.score(0); MK.hud.lives(lives, maxL);
    sync(0);
  }
  function start() { MK.hud.hint('Tap as one passes the chopsticks'); }
  function gap() {
    // open 34 cm each side; snapping shuts in .06 s, holds, and opens again
    if (snapT < 0) return JAW;
    if (snapT < .06) return JAW * (1 - snapT / .06);
    if (snapT < .2) return 0;
    return JAW * Math.min(1, (snapT - .2) / .12);
  }
  function sync(dt) {
    const g = gap() + 8;
    top.position.set(150, SNAP_Y + g, 30); top.rotation.z = -.04;
    bot.position.set(150, SNAP_Y - g, 30); bot.rotation.z = .04;
    for (const it of items) { if (!it.fly) it.m.position.set(0, it.y, 30); it.m.rotation.y += dt * 2; }
    bowlFill.position.y = 30 + Math.min(70, caught * 3); bowlFill.visible = caught > 0;
  }
  function spawn() {
    const t = MK.t, r = Math.random(), pc = Math.min(.26, .1 + t * .004);
    const kind = r < pc ? 'chili' : r < pc + .09 ? 'gold' : 'dump';
    const v = Math.min(820, 300 + t * 7) * (kind === 'gold' ? 1.45 : MK.rand(.85, 1.1));
    items.push({ kind, y: TOPY, v, m: get(kind) });
  }
  function update(dt) {
    idleT += dt;
    if (snapT >= 0) { snapT += dt; if (snapT > .32) snapT = -1; }
    // the next drop waits until the last one is well clear, so only one is ever near the chopsticks
    spawnT -= dt;
    const lowest = items.filter(i => !i.fly).reduce((m, i) => Math.min(m, i.y), 1e9);
    if (spawnT <= 0 && lowest > TOPY - 260) { spawn(); spawnT = Math.max(.45, 1.15 - MK.t * .012) * MK.rand(.8, 1.3); }
    for (const it of items) {
      if (it.fly) {
        it.fly += dt; const k = Math.min(1, it.fly / .45), b = bowl.position;
        it.m.position.set(MK.lerp(0, b.x, k), MK.lerp(SNAP_Y, b.y + 120, k) + Math.sin(k * Math.PI) * 160, MK.lerp(30, b.z, k));
        it.m.scale.setScalar(1 - k * .3);
        if (k >= 1) { it.done = true; caught++; MK.burst(W(b.x, b.y + 60, b.z), { n: 5, color: '#FFF4E2', speed: 25, size: .9, gravity: 120 }); }
        continue;
      }
      it.y -= it.v * dt;
      if (!it.done && it.y < SNAP_Y - 70) {
        it.done = true;
        if (it.kind !== 'chili') {
          lives--; combo = 0; MK.hud.lives(lives, maxL); MK.shake(10); MK.haptic(60); MK.popAt(W(0, SNAP_Y - 120, 30), 'Missed', '#fecdd3', 30); MK.burst(W(0, SNAP_Y - 90, 30), { n: 8, colors: ['#FFF4E2', '#e5e7eb'], speed: 30, size: 1.4, gravity: 160 });
          if (lives <= 0) { MK.over(score); return; }
        }
      }
    }
    items = items.filter(it => { if ((it.fly && it.fly >= .45) || it.y < -100) { put(it); return false; } return true; });
    if (MK.t > 3) MK.hud.hint(null, false);
    sync(dt);
  }
  function snap() {
    if (snapT >= 0) return;
    snapT = 0; MK.haptic(8);
    const it = items.find(i => !i.fly && !i.done && Math.abs(i.y - SNAP_Y) < (JAW + 6) * wideK);
    const at = W(0, SNAP_Y + 90, 30), hit = W(0, SNAP_Y, 30);
    if (!it) { combo = 0; MK.popAt(at, 'Snap!', 'rgba(255,255,255,.75)', 22); return; }
    if (it.kind === 'chili') {
      it.done = true; lives--; combo = 0; MK.hud.lives(lives, maxL); MK.shake(16); MK.haptic(80); MK.popAt(at, 'Spicy!', '#fecaca', 34);
      MK.burst(hit, { n: 18, colors: ['#ef4444', '#f97316', '#fde047'], speed: 60, size: 1.6, gravity: -20, life: .8 }); MK.flash('#ef4444', .25);
      if (lives <= 0) MK.over(score);
      return;
    }
    const perfect = Math.abs(it.y - SNAP_Y) < 10;
    const pts = it.kind === 'gold' ? 3 : perfect ? 2 : 1;
    score += pts; combo++; MK.hud.score(score);
    it.fly = 1e-4; it.done = true;
    MK.burst(hit, { n: 10, colors: ['#ffffff', '#FFF4E2'], speed: 45, size: 1.1, gravity: 60 }); MK.ring(hit, { color: '#ffffff', radius: 14, life: .3, face: true });
    if (perfect || it.kind === 'gold') { MK.sparkle(hit, { n: 14, speed: 40, size: .9, color: it.kind === 'gold' ? '#fde047' : '#fff7c2' }); MK.toScore(hit, it.kind === 'gold' ? 5 : 3, it.kind === 'gold' ? '#fde047' : '#fff7c2'); }
    if (perfect) MK.hitstop(.05);
    if (perfect) MK.praise(combo > 2 ? 'Perfect x' + combo : 'Perfect!'); else MK.popAt(at, '+' + pts, it.kind === 'gold' ? '#fde68a' : '#fff', it.kind === 'gold' ? 36 : 30);
    MK.haptic(perfect || it.kind === 'gold' ? [12, 30, 12] : 12);
  }
  MK.init({
    id: 'catch', title: 'Chopstick Catch', controls: 'tap', color: '#e11d48', lo: '#9f1239', bg: '#FFE4E6', scoreName: 'Dumplings', coinRate: .8,
    shop: [
      { id: 'wide', name: 'Grippy Tips', desc: 'A 40% bigger catch window for one run', kind: 'boost', coins: 20 },
      { id: 'life', name: 'Spare Bowl', desc: 'One extra life for one run', kind: 'boost', coins: 25 },
      { id: 'sticks_jade', name: 'Jade Chopsticks', desc: 'Cool green sticks', kind: 'skin', group: 'sticks', color: '#10b981', coins: 50 },
      { id: 'sticks_gold', name: 'Gold Chopsticks', desc: 'For a dumpling master', kind: 'skin', group: 'sticks', color: '#facc15', pearls: 30 },
      { id: 'sticks_red', name: 'Lacquer Chopsticks', desc: 'Glossy red', kind: 'skin', group: 'sticks', color: '#ef4444', coins: 50 },
      { id: 'sticks_blue', name: 'Porcelain Chopsticks', desc: 'Blue and white', kind: 'skin', group: 'sticks', color: '#60a5fa', coins: 50 },
      { id: 'sticks_pink', name: 'Sakura Chopsticks', desc: 'Cherry blossom pink', kind: 'skin', group: 'sticks', color: '#f9a8d4', coins: 70 },
      { id: 'sticks_white', name: 'Pearl Chopsticks', desc: 'Smooth and pale', kind: 'skin', group: 'sticks', color: '#f8fafc', coins: 70 },
      { id: 'sticks_black', name: 'Ebony Chopsticks', desc: 'Dark wood', kind: 'skin', group: 'sticks', color: '#374151', coins: 110 },
      { id: 'box_sticks', name: 'Chopstick Crate', desc: 'A random one of 7. Already have it? Half your coins back', kind: 'box', coins: 30, pool: ['sticks_jade', 'sticks_gold', 'sticks_red', 'sticks_blue', 'sticks_pink', 'sticks_white', 'sticks_black'] }
    ],
    onOwned() {
      const k = STICKS[MK.equipped('sticks')];
      for (const st of [top, bot]) if (st) { st.children[0].material = MK.mat(k ? k[1] : '#8B5A2B', { roughness: .5 }); st.children[1].material = MK.mat(k ? k[0] : '#e11d48', { roughness: .4 }); }
    },
    // shop previews: the pair of chopsticks, crossed
    preview(it) {
      const k = STICKS[it.id]; if (!k) return null;
      const g = new T.Group();
      // lying on a little rest, seen from above so they read as a pair
      [-.12, .12].forEach((r, i) => { const s = stick(); s.children[0].material = MK.mat(k[1], { roughness: .5 }); s.children[1].material = MK.mat(k[0], { roughness: .4 }); s.rotation.y = r; s.position.set(0, 10, (i - .5) * 34); g.add(s); });
      g.add(MK.mesh(new T.BoxGeometry(30, 10, 90), MK.mat('#f8fafc', { roughness: .4 }), -100, 2, 0));
      g.userData.tilt = .75; return g;
    },
    setup, reset, start, update, down: snap,
    idle(dt) { idleT += dt; sync(dt); },
    resize() { MK.fit(MK.camera, 820 * K, 1200 * K, 1200 * K); sync(0); }
  });
})();
</script>
