@font-face{font-family:'Fredoka';src:url(${FONT}) format('woff2');font-weight:300 700;font-display:block}
html,body{margin:0;height:100%;overflow:hidden;background:var(--mk-bg,#17171A);touch-action:none;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:Fredoka,ui-rounded,system-ui,sans-serif}
#mk{position:fixed;inset:0;width:100%;height:100%;display:block}
#mk-hud{position:fixed;left:0;right:0;top:var(--mk-t,16px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;transition:opacity .25s}
#mk-score{font-size:58px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 3px 0 var(--mk-lo)}
#mk-score.bump{animation:mkb .22s ease-out}
@keyframes mkb{40%{transform:scale(1.22)}}
#mk-lives{display:flex;gap:7px}
#mk-lives i{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 2px 0 var(--mk-lo)}
#mk-lives i.off{background:rgba(255,255,255,.3);box-shadow:none}
#mk-bar{width:min(200px,50vw);height:10px;border-radius:6px;background:rgba(255,255,255,.35);overflow:hidden}
#mk-bar b{display:block;height:100%;width:100%;background:#fff;border-radius:6px;transform-origin:left;transition:background .2s}
#mk-bar.warn b{background:#f43f5e}
#mk-hint{position:fixed;left:0;right:0;bottom:calc(var(--mk-b,16px) + 6px);text-align:center;font-size:18px;font-weight:600;color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.3);pointer-events:none;transition:opacity .4s;opacity:0}
.mk-pop{position:fixed;transform:translate(-50%,-50%);font-weight:600;font-size:26px;color:#fff;pointer-events:none;white-space:nowrap;
  text-shadow:0 3px 0 rgba(0,0,0,.25);animation:mkpop .75s ease-out forwards}
@keyframes mkpop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
#mk-praise{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:46px;font-weight:600;color:#fff;pointer-events:none;
  text-shadow:0 4px 0 var(--mk-lo);opacity:0}
#mk-praise.on{animation:mkpr .9s ease-out forwards}
@keyframes mkpr{0%{opacity:0;transform:scale(.4)}18%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
#mk-over{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;

    }
  });

  MK.init = function (c) {
    cfg = c;
    document.title = c.title;
    const r = document.documentElement.style;
    r.setProperty('--mk-c', c.color); r.setProperty('--mk-lo', c.lo || c.color); r.setProperty('--mk-bg', c.bg || '#17171A');
    cv = document.createElement('canvas'); cv.id = 'mk'; document.body.appendChild(cv);
    document.body.insertAdjacentHTML('beforeend',
      `<div id="mk-hud"><div id="mk-score">0</div><div id="mk-lives" hidden></div><div id="mk-bar" hidden><b></b></div></div>` +
      `<div id="mk-hint"></div><div id="mk-praise"></div><div id="mk-flash"></div><div id="mk-over" hidden></div>` +
      (inFrame ? '' : `<div id="mk-load">Loading ${c.title}</div>`));
    hud = { wrap: $('mk-hud'), score: $('mk-score'), lives: $('mk-lives'), bar: $('mk-bar'), hint: $('mk-hint'), praise: $('mk-praise'), over: $('mk-over'), flash: $('mk-flash') };
    hud.wrap.style.opacity = 0;
    MK.best = ((store.get().best || {})[c.id]) || 0;
    applySafe();
    addEventListener('resize', resize);
    if (!inFrame) {
      addEventListener('pointerdown', e => press('p' + e.pointerId, e.clientX, e.clientY));
      addEventListener('pointermove', e => move('p' + e.pointerId, e.clientX, e.clientY));
      addEventListener('pointerup', e => release('p' + e.pointerId));
      addEventListener('pointercancel', e => release('p' + e.pointerId));
      addEventListener('contextmenu', e => e.preventDefault());
      addEventListener('keydown', e => { if (!e.repeat && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); press('k', MK.W / 2, MK.H / 2); } });
      addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter') release('k'); });
      document.addEventListener('visibilitychange', () => setActive(!document.hidden));
    }
    loadOwned();
    send({ t: 'ready', phase: 'loading', shop: cfg.shop || [], base: !!cfg.base, baseName: cfg.baseName || '', title: cfg.title });
    runtime().then(async ({ T, K, doc }) => {
      MK.T = T; MK.Sandy = K; doc3 = doc;
      const R = MK.renderer = new T.WebGLRenderer({ canvas: cv, antialias: !touchDev, powerPreference: 'high-performance' });
      if (!K && T.ColorManagement) { T.ColorManagement.enabled = false; if ('outputColorSpace' in R) R.outputColorSpace = 'srgb'; }
      else R.outputEncoding = T.sRGBEncoding;
      R.shadowMap.enabled = true; R.shadowMap.type = T.PCFSoftShadowMap;
      const scene = MK.scene = new T.Scene();
      scene.add(MK.hemi = new T.HemisphereLight(0xfff4e0, 0x5a6a50, .85));
      const sun = MK.sun = new T.DirectionalLight(0xfff0dc, .95);
      sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.bias = -.0006;
      scene.add(sun, sun.target);
      MK.camera = new T.PerspectiveCamera(40, MK.W / MK.H, 10, 30000);
      await cfg.setup(T, scene);
      booted = true;
      if (cfg.onOwned) cfg.onOwned();
      cfg.reset();      // state first, then size the view around it
      resize();
      const ld = $('mk-load'); if (ld) ld.remove();
      MK.phase = 'ready'; send({ t: 'phase', phase: 'ready' });
      hud.wrap.style.opacity = 1;
      render();
      if (active) { awayCheck(); start(); }
      if (pvWanted) { pvWanted = false; setTimeout(sendPreviews, 300); }
    }).catch(err => { const ld = $('mk-load'); if (ld) ld.textContent = 'This game could not load'; console.error(err); });
  };
})();

/* MICROKIT END */
</script>
<script>
/* Go Giant! · Grug micro game (3D voxel, with your avatar) · control: tap anywhere to smash.
   You stomp down the main street of a block city by yourself. Tap to smash the buildings around you: every block
   you knock down makes you bigger, and bigger means you reach further and can flatten taller buildings. Too tall?
   It just shakes: grow some more and come back. The city gets taller the further you go. A rampage lasts 60 s;
   your score is blocks smashed. Shop: Mighty Fists (reach), Head Start (start bigger), Rage (boost), Mega Growth
   (pass), and giant colours. Blocks: KayKit Block Bits (CC0). */
/* MODELS: b_bricks_A, b_bricks_B, b_glass, b_wood, b_metal, b_stone, b_colored_block_red, b_colored_block_blue, b_colored_block_yellow, b_colored_block_green, b_grass, b_gravel, b_stone_dark, b_tree, b_striped_block_yellow */
(() => {
  const RUN = 60, ST = 220;   // street half-width
  const KINDS = [['b_wood', '#c08457'], ['b_bricks_A', '#c2410c'], ['b_bricks_B', '#9ca3af'], ['b_colored_block_red', '#ef4444'], ['b_colored_block_blue', '#3b82f6'],
    ['b_colored_block_yellow', '#facc15'], ['b_colored_block_green', '#22c55e'], ['b_glass', '#bae6fd'], ['b_metal', '#94a3b8']];
  const SKINS = { giant_green: '#22c55e', giant_purple: '#8b5cf6', giant_red: '#ef4444', giant_blue: '#3b82f6', giant_stone: '#78716c', giant_gold: '#facc15' };
  let ground;
  let T, S, me, blds = [], debris = [], madeTo, z, blocks, timeLeft, size, rage, idleT = 0, cityG, el = {}, swing = 0;

  function skin() { const id = MK.equipped('giant'); if (!me || !me.apply || !me.getConfig) return; try { const c = me.getConfig(); if (!me._own) me._own = { top: c.top, shirt: c.outfit.shirt }; if (id && SKINS[id]) me.apply({ top: null, outfit: Object.assign({}, c.outfit, { shirt: SKINS[id] }) }); else me.apply({ top: me._own.top, outfit: Object.assign({}, c.outfit, { shirt: me._own.shirt }) }); } catch (e) { } }
  const grow = () => 1 + Math.sqrt(blocks) * .075 * (MK.owned('mega') ? 1.5 : 1) + MK.owned('start') * .25;
  const capFloors = () => Math.floor(1.6 + size * 1.7);
  const reach = () => (230 + size * 150) * (1 + .1 * MK.owned('fists')) * (rage > 0 ? 1.6 : 1);

  // ---------- the city: buildings of blocks on both sides of the street, taller the further you go ----------
  function addBlock(z0) {
    const d = Math.min(1, -z0 / 9000);
    for (const side of [-1, 1]) for (let row = 0; row < 2; row++) {
      if (Math.random() < .15) continue;
      const w = 2 + Math.floor(Math.random() * 2), dd = 2, h = Math.max(1, Math.round(MK.rand(1, 3 + d * 12) * (row ? 1.3 : 1)));
      const kind = KINDS[Math.floor(Math.random() * KINDS.length)];
      const x = side * (ST + 60 + row * 360 + w * 50), list = [];
      for (let i = 0; i < w; i++) for (let j = 0; j < dd; j++) for (let k = 0; k < h; k++) list.push([x - w * 50 + 50 + i * 100, 50 + k * 100, z0 - j * 100, 0, 1]);
      const m = MK.instances(kind[0], list, 50); cityG.add(m);
      blds.push({ x, z: z0 - 50, w: w * 100, h, kind, m, n: list.length, alive: true, shake: 0 });
    }
    // street, pavement, trees
    const road = [], walk = [];
    for (let x = -ST + 50; x <= ST - 50; x += 100) for (let j = 0; j < 3; j++) road.push([x, -50, z0 - j * 100]);
    for (const s of [-1, 1]) for (let j = 0; j < 3; j++) for (let x = ST + 50; x <= ST + 1400; x += 100) walk.push([s * x, -50, z0 - j * 100]);
    const r = MK.instances('b_stone_dark', road, 50), w2 = MK.instances('b_gravel', walk, 50); r.castShadow = w2.castShadow = false; cityG.add(r, w2);
    if (Math.random() < .5) cityG.add(MK.instances('b_tree', [[(Math.random() < .5 ? -1 : 1) * (ST + 20), 50, z0 - 100, 0, .8]], 50));
  }
  function ensureCity() { while (madeTo > z - 4500) { addBlock(madeTo); madeTo -= 300; } }
  async function setup(T_, scene) {
    T = T_; S = scene;
    el = { size: document.querySelector('#size b'), cap: document.getElementById('cap') };
    scene.background = MK.color('#9fd5ff'); scene.fog = new T.Fog(MK.color('#9fd5ff'), 2600, 6200);
    me = await MK.avatar('player'); scene.add(me.object3d);
    const pm = new T.BoxGeometry(1, 1, 1);
    for (let i = 0; i < 40; i++) { const m = MK.mesh(pm, MK.mat('#ffffff'), 0, -999, 0); m.visible = false; scene.add(m); debris.push({ m, t: 1 }); }
    ground = MK.mesh(new T.PlaneGeometry(9000, 9000), MK.mat('#7cc36a'), 0, -101, 0, false); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
    MK.hemi.intensity = 1;
  }
  function reset() {
    if (cityG) { S.remove(cityG); cityG.traverse(o => { if (o.isInstancedMesh) o.dispose(); }); }
    cityG = new T.Group(); S.add(cityG); blds = []; madeTo = 1500;
    z = 0; blocks = 0; timeLeft = RUN; size = grow(); rage = MK.starting && MK.use('rage') ? 10 : 0;
    ensureCity(); MK.hud.score(0); MK.hud.bar(1); show();
    me.play('walk'); me.setExpression('happy'); place(0);
  }
  function start() { MK.hud.hint(rage ? 'Rage! Extra reach for 10 s · tap to smash' : 'Tap to smash the buildings around you'); }
  function show() { el.size.textContent = size.toFixed(1) + 'x'; el.cap.textContent = capFloors(); }
  function smash() {
    swing = .25; MK.haptic(10);
    const R = reach(), cap = capFloors(); let hitAny = false, tooBig = null;
    for (const b of blds) {
      if (!b.alive) continue;
      const dx = Math.max(0, Math.abs(b.x) - b.w / 2 - 0) - 0, dz = Math.abs(b.z - z), d = Math.hypot(Math.max(0, Math.abs(b.x) - b.w / 2), dz);
      if (d > R) continue;
      if (b.h > cap) { tooBig = b; b.shake = .35; continue; }
      b.alive = false; cityG.remove(b.m); b.m.dispose(); hitAny = true;
      blocks += b.n; MK.hud.score(blocks);
      // the building comes apart: chunks and dust in its colour, a few big blocks tumbling
      const at = new T.Vector3(b.x, b.h * 50, b.z);
      MK.burst(at, { n: Math.min(40, 10 + b.n), colors: [b.kind[1], '#ffffff', '#d6d3d1'], speed: 420 + b.h * 30, size: 18 + b.h * 2, up: 1.1, gravity: 1400 });
      MK.ring(new T.Vector3(b.x, 4, b.z), { color: '#e7e5e4', radius: b.w * 1.2 });
      for (let i = 0; i < Math.min(5, b.h + 1); i++) { const p = debris.find(p => p.t >= 1); if (!p) break; p.t = 0; p.m.visible = true; p.m.material = MK.mat(b.kind[1]); p.m.scale.setScalar(70); p.m.position.set(b.x + MK.rand(-60, 60), MK.rand(50, b.h * 100), b.z + MK.rand(-60, 60)); p.v = new T.Vector3(MK.rand(-300, 300), MK.rand(300, 700), MK.rand(-300, 300)); p.s = new T.Vector3(MK.rand(-6, 6), MK.rand(-6, 6), 0); }
      MK.toScore(at, 2, b.kind[1]);
    }
    if (hitAny) { MK.shake(6 + size * 2); const was = size; size = grow(); show(); if (Math.floor(was * 2) < Math.floor(size * 2)) { MK.praise('Bigger! ' + size.toFixed(1) + 'x'); MK.sparkle(new T.Vector3(0, 170 * size, z), { n: 18, speed: 300 }); } MK.hitstop(.04); }
    else if (tooBig) { MK.popAt(new T.Vector3(tooBig.x, tooBig.h * 100 + 40, tooBig.z), 'Too big! Grow first', '#fecaca', 24); }
    else MK.burst(new T.Vector3(0, 10, z - 60), { n: 8, color: '#d6d3d1', speed: 220, size: 14, up: .3 });
  }
  function update(dt) {
    idleT += dt; timeLeft -= dt; MK.hud.bar(timeLeft / RUN, timeLeft < 10);
    if (timeLeft <= 0) { MK.over(blocks); return; }
    if (rage > 0) { rage -= dt; if (rage <= 0) MK.hud.hint(null, false); }
    // you stomp down the street by yourself; bigger strides as you grow
    z -= (150 + size * 70) * dt; ensureCity();
    if (Math.random() < dt * 2) { MK.shake(1 + size * .6); }
    for (const b of blds) if (b.shake > 0) { b.shake -= dt; b.m.position.x = Math.sin(b.shake * 60) * 8; if (b.shake <= 0) b.m.position.x = 0; }
    for (const p of debris) if (p.t < 1) {
      p.t += dt * .8; p.v.y -= 2200 * dt; p.m.position.addScaledVector(p.v, dt); p.m.rotation.x += p.s.x * dt; p.m.rotation.y += p.s.y * dt;
      if (p.m.position.y < 35) { p.m.position.y = 35; p.v.multiplyScalar(.4); p.v.y = Math.abs(p.v.y) * .3; }
      if (p.t >= 1) p.m.visible = false;
    }
    // tidy: drop city behind you
    blds = blds.filter(b => { if (b.z > z + 900) { if (b.alive) { cityG.remove(b.m); b.m.dispose(); } return false; } return true; });
    if (MK.t > 4 && rage <= 0) MK.hud.hint(null, false);
    place(dt);
  }
  function place(dt) {
    const o = me.object3d; o.scale.setScalar(size); o.position.set(0, 0, z); o.rotation.y = Math.PI + (swing > 0 ? Math.sin(swing / .25 * Math.PI * 2) * .5 : 0);
    if (swing > 0) swing -= dt || 0;
    me.update((dt || 0) * 1.3);
    const C = MK.camera, k = 1 + (size - 1) * .55; C.position.set(0, 380 * k + 160, z + 700 * k + 200); C.lookAt(0, 120 * k, z - 600 * k);
    MK.sunAt(0, 0, z - 400, 1200 * k); if (ground) ground.position.z = z - 2000;
  }
  MK.init({
    id: 'giant', title: 'Go Giant!', controls: 'tap', color: '#16a34a', lo: '#14532d', bg: '#9fd5ff', scoreName: 'Blocks smashed', coinRate: .05,
    shop: [
      { id: 'mega', name: 'Mega Growth', desc: 'Grow 50% faster, for good', kind: 'pass', pearls: 120 },
      { id: 'fists', name: 'Mighty Fists', desc: '+10% reach per level', kind: 'upgrade', coins: 40, grow: 1.7, max: 6 },
      { id: 'start', name: 'Head Start', desc: 'Start every rampage a bit bigger', kind: 'upgrade', coins: 60, grow: 1.9, max: 4 },
      { id: 'rage', name: 'Rage', desc: 'Huge reach for the first 10 s of a run', kind: 'boost', coins: 25 },
      { id: 'giant_green', name: 'Gamma Green', desc: 'The classic big green look', kind: 'skin', group: 'giant', color: '#22c55e', coins: 40 },
      { id: 'giant_purple', name: 'Royal Purple', desc: 'Smash in style', kind: 'skin', group: 'giant', color: '#8b5cf6', coins: 40 },
      { id: 'giant_red', name: 'Furious Red', desc: 'Angry and proud', kind: 'skin', group: 'giant', color: '#ef4444', coins: 50 },
      { id: 'giant_blue', name: 'Storm Blue', desc: 'Calm before the smash', kind: 'skin', group: 'giant', color: '#3b82f6', coins: 50 },
      { id: 'giant_stone', name: 'Stone Skin', desc: 'Rock solid', kind: 'skin', group: 'giant', color: '#78716c', coins: 90 },
      { id: 'giant_gold', name: 'Golden Titan', desc: 'Shine as you flatten', kind: 'skin', group: 'giant', color: '#facc15', pearls: 30 },
      { id: 'box_giant', name: 'Titan Crate', desc: 'A random giant colour. Already have it? Half your coins back', kind: 'box', coins: 25, pool: ['giant_green', 'giant_purple', 'giant_red', 'giant_blue', 'giant_stone', 'giant_gold'] }
    ],
    preview(it) {
      if (SKINS[it.id]) return MK.prev.shirt(SKINS[it.id]);
      if (it.id === 'mega' || it.id === 'start' || it.id === 'fists') { const g = new T.Group(); [3, 5, 2].forEach((h, i) => { for (let k = 0; k < h; k++) g.add(MK.mesh(new T.BoxGeometry(.9, .9, .9), MK.mat(KINDS[i + 1][1]), (i - 1) * 1, k + .45, 0)); }); return g; }
      return null;
    },
    setup, reset, start, update, down: smash, onOwned: skin,
    idle(dt) { idleT += dt; me.update(dt); place(dt); },
    resize() { MK.fit(MK.camera, 1300, 800, 900); place(0); }
  });
})();
</script>
