<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Games · Grug</title>
<meta name="description" content="Every Grug game: Katy restaurant games and Grug originals.">
<meta name="theme-color" content="#eaf6ee">
<link rel="icon" href="../favicon.png">
<link rel="stylesheet" href="../assets/grug.css">
<script src="../assets/theme.js"></script>
<style>
.gl-head{padding:18px 0 4px;display:flex;flex-direction:column;gap:6px}
.gl-head p{color:var(--ink2);max-width:56ch}
.gl{display:grid;gap:14px;grid-template-columns:1fr;padding-top:14px}
.gl .g-tile{flex-direction:row;align-items:stretch}
.gl .g-tile .pic{aspect-ratio:auto;width:38%;min-width:130px;flex:none}
.gl .g-tile .body{flex:1;justify-content:center;gap:6px;padding:14px 16px}
.gl .g-tile .blurb{color:var(--ink2);font-size:14.5px;font-weight:500}
.gl .g-tile .acts{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
#legacyH{padding-top:30px}
.badge.legacy{background:#6b7280;color:#fff}
@media (min-width:760px){.gl{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main class="wrap">
  <div class="gl-head"><h1>Games</h1><p>Most are built with a Katy restaurant, and they all run right here in your browser. Points you earn at a restaurant buy its power-ups and closet clothes; Grug originals use Pearls.</p></div>
  <div class="gl" id="list"></div>
  <div class="gl-head" id="legacyH" hidden><h2>Legacy games</h2><p>Earlier games from our partners, kept so you can still play them.</p></div>
  <div class="gl" id="legacy"></div>
</main>
<script src="../assets/catalog.js"></script>
<script src="../assets/icons.js"></script>
<script src="../assets/games.js"></script>
<script src="../assets/grug.js"></script>
<script>
(function(){
  const G = Grug; G.ui.chrome('games');
  const pts = {}; G.points().forEach(p => { pts[p.game.id] = p; });
  const badge = g => g.status === 'live' ? '<span class="badge live">Live</span>' : g.status === 'legacy' ? '<span class="badge legacy">Legacy</span>' : '<span class="badge soon">Preview</span>';
  const card = g => {
    const p = pts[g.id], live = g.status === 'live' || g.status === 'legacy';
    return '<div class="g-tile"><a class="pic" href="' + g.id + '/" style="background-image:url(' + G.url(g.thumb) + ')" aria-label="' + G.esc(g.title) + '">' + badge(g) + '</a>' +
      '<div class="body"><div class="title">' + G.esc(g.title) + '</div><div class="meta">' + G.icon(g.standalone ? 'sparkle' : 'storefront') + G.esc(g.partner) + '<span>·</span>' + G.esc(g.kind) + '</div><div class="blurb">' + G.esc(g.blurb) + '</div>' +
      (p && (p.points || p.best) ? '<div class="meta">' + G.icon('coins') + G.fmt(p.points) + ' points' + (p.best ? '<span>·</span>' + G.icon('trophy') + 'best ' + G.fmt(p.best) : '') + '</div>' : '') +
      '<div class="acts"><a class="g-btn primary sm" href="' + G.url(g.game || g.play) + '">' + G.icon('play') + (live ? 'Play' : 'Demo') + '</a><a class="g-btn sm" href="' + g.id + '/">Details</a></div></div></div>';
  };
  const shown = G.GAMES.filter(g => g.listed !== false), now = shown.filter(g => g.status !== 'legacy'), old = shown.filter(g => g.status === 'legacy');
  document.getElementById('list').innerHTML = now.map(card).join('');
  if (old.length) { document.getElementById('legacyH').hidden = false; document.getElementById('legacy').innerHTML = old.map(card).join(''); }
})();
</script>
</body>
</html>
