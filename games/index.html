<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Games · Grug</title>

<style>
/* The Games page is the store, laid out like a big PC game store: a featured carousel, rows of capsules, categories
   (the games' tags), the Discovery Queue and a tabbed list with a preview beside it. "Browse all" (#search?…) is the
   search page: sort, tag include / exclude with counts, made-for, status and your-library filters, all kept in the URL.
   The heart adds a game to Favorites (Grug.favs), which games/favorites/ shows as the FOSSIL32 rack.
   It wears the site's look (Model Kit theme, the Games accent, Fredoka, flat accents with a darker lip): no gradients,
   and only real numbers (your plays and best scores), never made-up ratings or player counts. */
.st{padding-top:6px}
.st .gi{width:18px;height:18px}

/* ---------- the store's own bar: its pages and the search box ---------- */
.st-nav{display:flex;align-items:center;gap:4px;margin:10px 0 0;padding:6px;border-radius:16px;background:var(--card-solid);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;z-index:6}
.st-nav>a,.st-nav>button{display:inline-flex;align-items:center;gap:0;min-height:42px;padding:0 14px;border-radius:11px;font-weight:600;font-size:15.5px;color:var(--ink2);white-space:nowrap}
.st-nav>a:hover,.st-nav>button:hover{background:var(--card2);color:var(--ink)}
.st-nav>a[aria-current=page]{background:var(--mode);color:var(--on-sel);box-shadow:0 3px 0 var(--mode-lo)}
.st-nav>a b{margin-left:7px;min-width:22px;height:22px;border-radius:11px;background:var(--card2);display:inline-grid;place-items:center;font-size:12.5px;padding:0 6px}
.st-nav>a[aria-current=page] b{background:rgba(0,0,0,.14)}
.st-search{position:relative;flex:1;min-width:180px;margin-left:auto;max-width:380px}
.st-search>.gi{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none;width:17px;height:17px}
.st-search input{width:100%;height:42px;border-radius:11px;border:1px solid var(--line2);background:var(--card2);color:var(--ink);padding:0 12px 0 38px;font:600 15px/1 var(--font);outline:none}
.st-search input:focus{border-color:var(--mode);background:var(--card-solid);box-shadow:0 0 0 3px color-mix(in srgb,var(--mode) 25%,transparent)}
.st-search input::placeholder{color:var(--mut)}
.st-search input::-webkit-search-cancel-button{-webkit-appearance:none}
.st-sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card-solid);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:none}
.st-sugg.on{display:block}
.st-sugg a{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px}
.st-sugg a:hover,.st-sugg a[aria-selected=true]{background:var(--card2)}
.st-sugg img{width:70px;aspect-ratio:16/9;object-fit:cover;border-radius:7px;flex:none;background:var(--tile-bg)}
.st-sugg b{display:block;font-weight:600;font-size:15px;line-height:1.2}
.st-sugg small{color:var(--mut);font-weight:600;font-size:12.5px}
.st-sugg .all{justify-content:center;font-weight:700;color:var(--mode-text,var(--mode));border-top:1px solid var(--line);border-radius:0 0 9px 9px;margin-top:4px;padding:10px}
/* the Rewards apps button and its picker */
.st-nav>.st-apps{gap:7px;background:var(--mode);color:var(--on-sel);box-shadow:0 3px 0 var(--mode-lo);margin-left:4px}
.st-nav>.st-apps:hover{background:var(--mode);color:var(--on-sel);filter:brightness(1.05)}
.st-apps .gi{width:17px;height:17px}
.st-applist{display:flex;flex-direction:column;gap:8px;margin:2px 0 4px}
.st-app{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--card2);border:1px solid var(--line);color:var(--ink)}
.st-app:hover{border-color:var(--mode)}
.st-app .lg{flex:none;width:112px;height:48px;border-radius:12px;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.st-app .lg img{max-width:100%;max-height:40px;object-fit:contain}
.st-app .lg b{font:700 15px/1 var(--display);color:#1E1B16;padding:0 8px;text-align:center}
.st-app .tx{flex:1;min-width:0}
.st-app .tx b{display:block;font-weight:600;font-size:16px;line-height:1.2}
.st-app .tx small{display:block;color:var(--mut);font-weight:600;font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-app .go{flex:none;color:var(--mut)}
.st-app .go .gi{width:18px;height:18px}
.st-apps-note{color:var(--mut);font-size:13.5px;margin:0 2px 10px}
@media (max-width:760px){.st-nav>.st-apps{order:-1;flex:0 0 auto;margin:0 0 4px 6px;padding:0 14px}.st-nav>.st-apps:not([hidden])~.st-search{flex-basis:calc(100% - 132px)}}
@media (max-width:760px){.st-nav{flex-wrap:wrap}.st-search{order:-1;flex:1 1 100%;max-width:none;margin:0 0 4px}.st-nav>a,.st-nav>button{flex:1;justify-content:center;padding:0 8px;font-size:14.5px}.st-nav .lbl-long{display:none}.st-nav .lbl-short{display:inline}.st-nav>a,.st-nav>button{padding:0 6px;font-size:14px}.st-nav>a b{margin-left:5px}}
.lbl-short{display:none}

/* ---------- shared bits ---------- */
.st-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 2px 12px}
.st-h h2{font-size:23px}
.st-h a{font-weight:700;font-size:14.5px;color:var(--mode-text,var(--mode))}
.st-h a:hover{text-decoration:underline;text-underline-offset:3px}
.st-tags{display:flex;flex-wrap:wrap;gap:6px}
.st-tag{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:8px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink2)}
a.st-tag:hover{background:var(--mode);border-color:transparent;color:var(--on-sel)}
.st-made{display:flex;align-items:center;gap:6px;color:var(--mut);font-weight:600;font-size:14px}
.st-made .gi{width:16px;height:16px;flex:none}
.st-made .g-rated{margin-left:4px;height:20px;min-width:30px;font-size:11.5px}
.st-badge{display:inline-flex;align-items:center;min-height:24px;padding:0 9px;border-radius:7px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--mode);color:var(--on-sel)}
.st-badge.demo{background:var(--gold);color:#1E1B16}
.st-badge.legacy{background:#6b7280;color:#fff}
.st-you{display:flex;gap:12px;flex-wrap:wrap;color:var(--ink2);font-weight:600;font-size:13.5px}
.st-you span{display:inline-flex;align-items:center;gap:5px}
.st-you .gi{width:15px;height:15px;color:var(--gold)}
.st-new{color:var(--mut)}
.st-play{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:0 22px;border-radius:13px;font:600 17px/1 var(--display);letter-spacing:.03em;
  background:var(--mode);color:var(--on-sel);box-shadow:0 4px 0 var(--mode-lo);transition:transform .1s,box-shadow .1s}
.st-play:hover{filter:brightness(1.05)}
.st-play:active{transform:translateY(3px);box-shadow:0 1px 0 var(--mode-lo)}
.st-play .gi{width:16px;height:16px}
.st-heart{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:13px;border:1px solid var(--line2);background:var(--card2);color:var(--ink2);flex:none;transition:transform .2s var(--spring)}
.st-heart:hover{color:var(--ink)}
.st-heart:active{transform:scale(.88)}
.st-heart[aria-pressed=true]{color:#FF8FC2;border-color:color-mix(in srgb,#FF8FC2 55%,transparent)}
.st-heart .gi{width:20px;height:20px}
.st-heart.sm{width:36px;height:36px;border-radius:10px}
.st-heart.sm .gi{width:17px;height:17px}
.st-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card-solid);border:1px solid var(--line2);box-shadow:var(--shadow);color:var(--ink)}
.st-arrow:hover{background:var(--mode);color:var(--on-sel);border-color:transparent}
.st-arrow.l{left:-14px}.st-arrow.r{right:-14px}
@media (max-width:760px){.st-arrow{display:none}}
.st-pic{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--tile-bg)}

/* ---------- featured & recommended ---------- */
.st-feat{position:relative}
.st-fc{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);border-radius:var(--r);overflow:hidden;background:var(--card-solid);border:1px solid var(--line);box-shadow:var(--shadow)}
.st-fc-main{position:relative;display:block;background:var(--tile-bg)}
.st-fc-main img{width:100%;height:100%;aspect-ratio:16/9;object-fit:cover;transition:opacity .18s}
.st-fc-info{padding:18px;display:flex;flex-direction:column;gap:11px;min-width:0}
.st-fc-info h3{font-size:27px}
.st-fc-info h3 a:hover{color:var(--mode-text,var(--mode))}
.st-fc-sub{color:var(--ink2);font:600 16px/1.25 var(--display);margin-top:-6px}
.st-fc-shots{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.st-fc-shots img{border-radius:8px;cursor:pointer;opacity:.82;transition:opacity .15s,outline-color .15s;outline:2px solid transparent;outline-offset:-2px}
.st-fc-shots img:hover,.st-fc-shots img.on{opacity:1;outline-color:var(--mode)}
.st-fc-why{font-size:14px;color:var(--ink2)}
.st-fc-why b{color:var(--ink);font-weight:700}
.st-fc-foot{display:flex;gap:8px;align-items:center;margin-top:auto;padding-top:4px}
.st-dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.st-dots button{width:16px;height:8px;border-radius:4px;background:var(--line2);padding:0;transition:width .25s var(--spring),background .2s}
.st-dots button.on{width:30px;background:var(--mode)}
@media (max-width:860px){.st-fc{grid-template-columns:1fr}.st-fc-shots{display:none}.st-fc-info h3{font-size:24px}}

/* ---------- capsule rows ---------- */
.st-strip{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 3 * 14px) / 4);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth;padding:2px 2px 6px}
.st-strip::-webkit-scrollbar{display:none}
@media (max-width:1000px){.st-strip{grid-auto-columns:calc((100% - 2 * 14px) / 3)}}
@media (max-width:700px){.st-strip{grid-auto-columns:72%}}
.st-scroller{position:relative}
.st-cap{scroll-snap-align:start;position:relative;display:flex;flex-direction:column;border-radius:var(--r-s);overflow:hidden;background:var(--card-solid);border:1px solid var(--line);transition:transform .2s var(--spring),border-color .2s}
.st-cap:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--mode) 60%,transparent)}
.st-cap .st-pic{transition:transform .3s var(--spring)}
.st-cap-b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.st-cap-b b{font-weight:600;font-size:16.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-cap-b .st-made{font-size:13px}
.st-cap .st-heart{position:absolute;right:8px;top:8px;background:var(--card-solid)}
.st-cap .st-badge{position:absolute;left:8px;top:8px}
.st-cap .ribbon{position:absolute;left:8px;top:8px;display:inline-flex;align-items:center;gap:5px;min-height:26px;padding:0 9px;border-radius:7px;background:var(--chip-bg);color:var(--chip-fg);font-size:12px;font-weight:700}
.st-cap .ribbon .gi{width:13px;height:13px}

/* ---------- categories ---------- */
.st-cat{scroll-snap-align:start;position:relative;display:block;aspect-ratio:16/9;border-radius:var(--r-s);overflow:hidden;background:var(--tile-bg);border:1px solid var(--line)}
.st-cat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .3s var(--spring)}
.st-cat:hover img{transform:scale(1.05)}
.st-cat span{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;background:var(--card-solid);color:var(--ink);font:600 17px/1.1 var(--display)}
.st-cat span small{font:700 12.5px/1 var(--font);color:var(--mut)}
.st-cat:hover span{background:var(--mode);color:var(--on-sel)}
.st-cat:hover span small{color:var(--on-sel)}

/* ---------- Discovery Queue banner ---------- */
.st-qb{display:flex;align-items:center;gap:20px;margin-top:30px;padding:20px 22px;border-radius:var(--r);background:var(--mode);color:var(--on-sel);box-shadow:0 5px 0 var(--mode-lo);overflow:hidden}
.st-qb h2{font-size:24px}
.st-qb p{margin:4px 0 12px;max-width:52ch;font-weight:500}
.st-qb .st-play{background:var(--card-solid);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.st-qb-stack{display:flex;margin-left:auto;padding-right:6px}
.st-qb-stack img{width:150px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;border:3px solid var(--card-solid);margin-left:-82px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.st-qb-stack img:first-child{margin-left:0}
@media (max-width:760px){.st-qb-stack{display:none}}

/* ---------- tabbed list + preview ---------- */
.st-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line2);margin-bottom:12px}
.st-tabs::-webkit-scrollbar{display:none}
.st-tabs button{flex:none;padding:10px 14px;font-weight:600;font-size:15px;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-1px}
.st-tabs button:hover{color:var(--ink)}
.st-tabs button[aria-selected=true]{color:var(--ink);border-color:var(--mode)}
.st-tabwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.st-trow{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:14px;align-items:center;padding:7px;margin-bottom:7px;border-radius:var(--r-s);background:var(--card-solid);border:1px solid var(--line);cursor:pointer;transition:border-color .15s,background .15s}
.st-trow:hover,.st-trow.hl{border-color:var(--mode);background:color-mix(in srgb,var(--mode) 8%,var(--card-solid))}
.st-trow img{border-radius:9px}
.st-trow b{display:block;font-weight:600;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-trow .st-made{margin-top:2px;font-size:13.5px}
.st-trow .tl{margin-top:3px;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-trow .tr{display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding-right:6px}
.st-prev{position:sticky;top:calc(var(--top) + var(--sat) + 16px);display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--r);background:var(--card-solid);border:1px solid var(--line);box-shadow:var(--shadow)}
.st-prev h3{font-size:20px}
.st-prev img{border-radius:9px}
.st-prev p{margin:0;color:var(--ink2);font-size:14px}
@media (max-width:980px){.st-tabwrap{grid-template-columns:1fr}.st-prev{display:none}}
@media (max-width:560px){.st-trow{grid-template-columns:110px minmax(0,1fr)}.st-trow .tr{display:none}}

/* ---------- search page ---------- */
.st-crumbs{margin:18px 2px 10px;font-size:14px;font-weight:600;color:var(--mut)}
.st-crumbs a:hover{color:var(--ink)}
.st-sp{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px;align-items:start}
.st-sbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px;border-radius:var(--r-s);background:var(--card-solid);border:1px solid var(--line);margin-bottom:10px}
.st-sbar .inp{position:relative;flex:1;min-width:200px}
.st-sbar .inp .gi{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mut);width:17px;height:17px;pointer-events:none}
.st-sbar input{width:100%;height:44px;border-radius:11px;border:1px solid var(--line2);background:var(--card2);color:var(--ink);padding:0 12px 0 38px;font:600 15.5px/1 var(--font);outline:none}
.st-sbar input:focus{border-color:var(--mode)}
.st-sbar label{font-weight:600;font-size:14px;color:var(--mut)}
.st-sort{height:44px;border-radius:11px;border:1px solid var(--line2);background:var(--card2);color:var(--ink);font:600 15px/1 var(--font);padding:0 34px 0 12px;appearance:none;-webkit-appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 19px) 20px,calc(100% - 14px) 20px;background-size:5px 5px;background-repeat:no-repeat}
.st-ftoggle{display:none}
.st-count{margin:2px 2px 8px;color:var(--ink2);font-weight:600;font-size:14.5px}
.st-count span{color:var(--mut);font-weight:500}
.st-active{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.st-active button{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 6px 0 12px;border-radius:999px;background:var(--card-solid);border:1px solid var(--line2);font-weight:600;font-size:13.5px}
.st-active button i{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--card2);font-style:normal}
.st-active button i .gi{width:12px;height:12px}
.st-active button:hover i{background:var(--mode);color:var(--on-sel)}
.st-active button.ex{border-color:color-mix(in srgb,var(--danger) 55%,transparent);color:var(--danger)}
.st-active button.clr{border:0;background:none;color:var(--mode-text,var(--mode));font-weight:700;padding:0 8px}
.st-srow{display:grid;grid-template-columns:150px minmax(0,1fr) 90px 150px auto;gap:14px;align-items:center;padding:7px;margin-bottom:7px;border-radius:var(--r-s);background:var(--card-solid);border:1px solid var(--line);cursor:pointer;transition:border-color .15s,background .15s}
.st-srow:hover{border-color:var(--mode);background:color-mix(in srgb,var(--mode) 8%,var(--card-solid))}
.st-srow.ign{opacity:.55}
.st-srow img{border-radius:9px}
.st-srow b{display:block;font-weight:600;font-size:16.5px;line-height:1.2}
.st-srow b a:hover{color:var(--mode-text,var(--mode))}
.st-srow .st-made{margin:3px 0 6px;font-size:13.5px}
.st-srow .st-tags{gap:4px}
.st-srow .st-tag{min-height:24px;font-size:12px;padding:0 8px}
.st-srow .acts{display:flex;gap:6px;align-items:center;padding-right:4px}
.st-srow .acts .st-play{min-height:36px;padding:0 14px;font-size:15px;border-radius:10px}
.st-empty{padding:40px 16px;text-align:center;color:var(--ink2);border-radius:var(--r-s);background:var(--card-solid);border:1px solid var(--line)}
.st-empty b{display:block;font-size:20px;color:var(--ink);margin-bottom:6px}
@media (max-width:1000px){.st-srow{grid-template-columns:130px minmax(0,1fr) auto}.st-srow .c-status,.st-srow .c-you{display:none}}
@media (max-width:560px){.st-srow{grid-template-columns:110px minmax(0,1fr);row-gap:8px}.st-srow .acts{grid-column:2;padding:0}.st-srow .st-made{margin-bottom:0}.st-srow .st-tags{display:none}.st-sbar label{display:none}.st-sort,.st-ftoggle{flex:1}}

/* filters (Steam puts them on the right) */
.st-filters{display:flex;flex-direction:column;gap:10px;position:sticky;top:calc(var(--top) + var(--sat) + 16px)}
.st-fbox{border-radius:var(--r-s);background:var(--card-solid);border:1px solid var(--line);overflow:hidden}
.st-fbox>button{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;font-weight:700;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.st-fbox>button .gi{width:14px;height:14px;transform:rotate(90deg);transition:transform .2s}
.st-fbox.shut>button .gi{transform:rotate(0)}
.st-fbox.shut .fb{display:none}
.st-fbox .fb{padding:0 8px 10px}
.st-fbox .fb input{width:100%;height:36px;border-radius:9px;border:1px solid var(--line2);background:var(--card2);color:var(--ink);padding:0 10px;font:600 14px/1 var(--font);outline:none;margin-bottom:6px}
.st-fbox .fb input:focus{border-color:var(--mode)}
.st-opt{display:flex;align-items:center;gap:9px;width:100%;padding:6px 7px;border-radius:9px;font-weight:600;font-size:14.5px;color:var(--ink2);text-align:left;cursor:pointer;user-select:none}
.st-opt:hover{background:var(--card2);color:var(--ink)}
.st-opt .cb{display:grid;place-items:center;width:20px;height:20px;border-radius:6px;border:2px solid var(--line2);flex:none;color:var(--on-sel)}
.st-opt .cb .gi{width:12px;height:12px;display:none}
.st-opt.inc .cb{background:var(--mode);border-color:var(--mode)}
.st-opt.inc .cb .ck{display:block}
.st-opt.exc .cb{background:var(--danger);border-color:var(--danger);color:#fff}
.st-opt.exc .cb .xx{display:block}
.st-opt.exc .lbl{text-decoration:line-through;color:var(--mut)}
.st-opt .lbl{flex:1;min-width:0}
.st-opt small{font-weight:700;font-size:12px;color:var(--mut)}
.st-opt .ex{opacity:0;min-width:56px;text-align:right;font-weight:700;font-size:12px;color:var(--mut);padding:2px 4px;border-radius:6px}
.st-opt:hover .ex{opacity:1}
.st-opt .ex:hover{color:var(--danger)}
@media (hover:none){.st-opt .ex{opacity:1}}
.st-fnote{font-size:12px;color:var(--mut);padding:4px 7px 0}
.st-more{font-weight:700;font-size:13.5px;color:var(--mode-text,var(--mode));padding:6px 7px}
@media (max-width:900px){.st-sp{grid-template-columns:1fr}.st-filters{display:none;position:static}.st-filters.open{display:flex}.st-ftoggle{display:inline-flex}}

/* ---------- hover card (pointer devices only) ---------- */
.st-hc{position:fixed;z-index:60;width:300px;padding:12px;border-radius:var(--r-s);background:var(--card-solid);border:1px solid var(--line2);box-shadow:var(--shadow);pointer-events:none;display:flex;flex-direction:column;gap:9px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.st-hc.on{opacity:1;transform:none}
.st-hc h4{font-size:18px}
.st-hc .sh{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.st-hc .sh img{border-radius:6px}
.st-hc p{margin:0;font-size:13.5px;color:var(--ink2)}
.st-hc .k{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}

/* ---------- Discovery Queue ---------- */
.st-q{width:min(980px,calc(100vw - 24px));max-width:none;max-height:calc(100dvh - 24px);padding:0;border:1px solid var(--line2);border-radius:var(--r);background:var(--card-solid);color:var(--ink);box-shadow:var(--shadow)}
.st-q::backdrop{background:rgba(10,10,14,.6)}
.st-q-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.st-q-h h2{font-size:20px}
.st-q-prog{display:flex;gap:4px;margin-top:7px}
.st-q-prog i{width:24px;height:5px;border-radius:3px;background:var(--line2)}
.st-q-prog i.on{background:var(--mode)}
.st-q-x{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink2)}
.st-q-x:hover{background:var(--card2);color:var(--ink)}
.st-q-b{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;padding:16px}
.st-q-b .big{border-radius:12px}
.st-q-sh{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.st-q-sh img{border-radius:7px;cursor:pointer;opacity:.82}
.st-q-sh img:hover{opacity:1}
.st-q-i{display:flex;flex-direction:column;gap:10px;min-width:0}
.st-q-i h3{font-size:27px}
.st-q-i p{margin:0;color:var(--ink2);font-size:15px}
.st-q-a{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:0 16px 16px}
.st-q-a .nx{margin-left:auto}
.st-q-a .g-btn{min-height:46px;font-size:15.5px}
.st-q-a .g-btn[aria-pressed=true]{background:var(--mode);color:var(--on-sel);border-color:transparent}
.st-q-a .g-btn .gi{width:18px;height:18px}
.st-q-end{padding:38px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.st-q-end h3{font-size:26px}
.st-q-end p{margin:0;color:var(--ink2);max-width:46ch}
.st-q-end .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
@media (max-width:760px){.st-q-b{grid-template-columns:1fr}.st-q-sh{display:none}.st-q-a .nx{margin-left:0;flex:1 1 100%}}
</style>
</head>
<body>
<main class="wrap st">
  <h1 class="vh">Games</h1>
  <nav class="st-nav" aria-label="Store">
    <a href="#" data-nav="home"><span class="lbl-long">Your&nbsp;store</span><span class="lbl-short">Store</span></a>
    <a href="#search" data-nav="search">Browse<span class="lbl-long">&nbsp;all</span></a>
    <button type="button" data-queue><span class="lbl-long">Discovery&nbsp;</span>Queue</button>
    <a href="favorites/" data-nav="favs">Favorites <b id="favN">0</b></a>
    <a href="carts/" data-nav="carts">Carts</a>
    <!-- every venue's rewards app, one tap away (hidden in partner mode: a wrapped site never leads to another venue's app) -->
    <button type="button" class="st-apps" id="appsBtn" data-apps hidden><span id="appsIc"></span>Rewards<span class="lbl-long">&nbsp;apps</span></button>
    <div class="st-search" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-owns="sugg">
      <span id="qIc"></span>
      <input id="q" type="search" placeholder="Search games or tags" autocomplete="off" spellcheck="false" aria-label="Search the games" aria-controls="sugg">
      <div class="st-sugg" id="sugg" role="listbox"></div>
    </div>
  </nav>
  <div id="view"></div>
</main>
<div class="st-hc" id="hc" aria-hidden="true"></div>
<script src="../assets/catalog.js"></script>
<script src="../assets/icons.js"></script>
<script src="../assets/games.js"></script>
<script src="../assets/carts.js"></script>
<script src="../assets/grug.js"></script>
<script src="../create/market-icons.js"></script>
<script>
(function(){
  const G = Grug, esc = G.esc, $ = s => document.querySelector(s), $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  if (G.onboard.away) return;   // first visit: off to the games onboarding (games/welcome/), which comes back here
  G.ui.chrome('games');
  // the @icons set: the site's (Grug.icon) plus search / sliders / tag, which only the Create library's set has
  const MK = window.MK_ICONS || {};
  const ic = n => MK[n] && !(window.GRUG_ICONS_SIMPLE || {})[n] ? '<svg class="gi gi-s" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false">' + MK[n] + '</svg>' : G.icon(n);
  const CHECK = '<svg class="gi ck" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5l2.5 2.5L10 3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const CROSS = '<svg class="gi xx" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';

  /* ---------- the games and what this player has done with them (only real numbers) ---------- */
  const pm = (window.GrugTheme && GrugTheme.partner && GrugTheme.partner()) || null;
  const ALL = G.GAMES.filter(g => g.listed !== false && G.partnerAllows(g));   // partner mode: every standalone game, the partner's own first
  // the Carts (assets/carts.js): quick one-tap games in the swipe feed (carts/). They show up in search, the search box
  // and their own row on the store; tapping one opens the feed on it. Ids get a 'cart-' prefix so they never meet a game's.
  // (a cart can carry rating: 'mature' too: Grug.age decides, the same as for games)
  const CARTS = (window.GRUG_CARTS || []).filter(c => G.age.canSee(c)).map(c => Object.assign({}, c, { id: 'cart-' + c.id, cid: c.id, cart: true, original: true, status: 'live', kind: 'Cart',
    partner: 'Grug', place: '', app: 'cart-' + c.id, thumb: 'assets/carts/' + c.id + '.jpg' }));
  const EVERY = ALL.concat(CARTS);   // what search looks through
  const microBest = (() => { try { return (JSON.parse(localStorage.getItem('grug.micro.v1') || '{}').best) || {}; } catch (e) { return {}; } })();
  const byId = id => EVERY.find(g => g.id === id);
  const st = G.profile.stats, pts = {};
  try { G.points().forEach(p => { pts[p.game.id] = p; }); } catch (e) {}
  const artOf = g => (g.box && g.box.art) || g.thumb;
  const pic = g => G.url(artOf(g));
  const shots = g => [artOf(g)].concat((g.box && g.box.shots) || []).map(s => G.url(s));
  const tagsOf = g => g.tags || [];
  const plays = g => g.cart ? 0 : +(st.plays[g.app] || 0) || (pts[g.id] ? pts[g.id].runs : 0);
  const best = g => g.cart ? +(microBest[g.cid] || 0) : Math.max(+(st.best[g.app] || 0), pts[g.id] ? pts[g.id].best : 0);
  const lastId = (ALL.find(g => g.app === st.lastGame && g.status !== 'legacy') || {}).id || '';
  const status = g => g.cart ? ['live', 'Cart'] : g.status === 'legacy' ? ['legacy', 'Classic'] : g.status === 'live' ? ['live', 'Live'] : ['demo', 'Demo'];
  const madeFor = g => g.cart ? '<span class="st-made">' + G.icon('device-mobile') + 'Cart · ' + (g.controls === 'hold' ? 'Hold' : 'Tap') + ' · ' + esc(g.len) + '</span>'
    : '<span class="st-made">' + G.icon(g.original ? 'sparkle' : 'storefront') + esc(g.original ? 'Grug original' : g.partner) + G.age.tag(g, 'st-rated') + '</span>';   // a mature game's 18+ tag rides on this line everywhere
  const badge = g => { const s = status(g); return '<span class="st-badge ' + s[0] + '">' + s[1] + '</span>'; };
  const you = g => { const p = plays(g), b = best(g);
    return p || b ? '<div class="st-you">' + (p ? '<span>' + G.icon('game-controller') + G.fmt(p) + (p === 1 ? ' run' : ' runs') + '</span>' : '') + (b ? '<span>' + G.icon('trophy') + 'best ' + G.fmt(b) + '</span>' : '') + '</div>'
      : '<div class="st-you st-new">New to you</div>'; };
  const tagLinks = (g, n) => '<div class="st-tags">' + tagsOf(g).slice(0, n || 9).map(t => '<a class="st-tag" href="' + searchHref({ inc: [t] }) + '">' + esc(t) + '</a>').join('') + '</div>';
  const heart = (g, sm) => { if (g.cart) return ''; const on = G.favs.has(g.id);   // carts are hearted in their own feed
    return '<button type="button" class="st-heart' + (sm ? ' sm' : '') + '" data-fav="' + g.id + '" aria-pressed="' + on + '" aria-label="' + (on ? 'Remove ' : 'Add ') + esc(g.title) + (on ? ' from' : ' to') + ' Favorites" title="' + (on ? 'In your Favorites' : 'Add to Favorites') + '">' + G.icon('heart') + '</button>'; };
  const playBtn = g => '<button type="button" class="st-play" data-play="' + g.id + '">' + G.icon('play') + (g.status === 'preview' ? 'Try the demo' : 'Play') + '</button>';
  const gameHref = g => G.url(g.cart ? 'games/carts/#' + g.cid : 'games/' + g.id + '/');
  const visible = () => ALL.filter(g => !G.favs.isIgnored(g.id));

  // what the player likes: the tags of their favourites and the games they've played
  function tagWeights(){
    const w = {}, add = (g, k) => tagsOf(g).forEach(t => { w[t] = (w[t] || 0) + k; });
    G.favs.list().forEach(id => { const g = byId(id); if (g) add(g, 3); });
    ALL.forEach(g => { if (plays(g)) add(g, 2); });
    return w;
  }
  const affinity = (g, w) => tagsOf(g).reduce((s, t) => s + (w[t] || 0), 0);
  const shared = (a, b) => tagsOf(a).filter(t => tagsOf(b).includes(t)).length;
  // one honest line on why a game is on the shelf
  function why(g){
    if (pm && g.id === pm.game) return '<b>' + esc(g.partner) + '</b>’s own game';
    if (g.id === lastId) return '<b>Pick up where you left off</b> · you played it last';
    const likes = G.favs.list().map(byId).concat(ALL.filter(x => plays(x))).filter(x => x && x.id !== g.id);
    const near = likes.map(x => [x, shared(x, g)]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1])[0];
    if (near) return 'Because you like <b>' + esc(near[0].title) + '</b>';
    if (plays(g)) return 'You’ve played it ' + G.fmt(plays(g)) + (plays(g) === 1 ? ' time' : ' times');
    return g.original ? '<b>Free</b> · plays in your browser, nothing to download' : 'Made with <b>' + esc(g.partner) + '</b> in ' + esc(g.place);
  }

  /* ---------- Play: the cartridge goes into the FOSSIL32 console, then the game opens (plain link without 3D) ---------- */
  function play(g){
    G.ui.buzz([8, 30, 12]);
    if (g.cart) { location.href = gameHref(g); return; }
    if (window.Fossil32 && Fossil32.ok) Fossil32.boot(g.id); else location.href = G.url(g.game || g.play);
  }
  function setFav(id, on){
    const g = byId(id); if (!g) return;
    on = on == null ? G.favs.toggle(id) : G.favs.set(id, on);
    G.ui.buzz(); G.ui.toast(on ? 'Added ' + g.title + ' to Favorites' : 'Removed ' + g.title + ' from Favorites', { icon: 'heart' });
    $$('[data-fav="' + id + '"]').forEach(b => { const n = document.createElement('div'); n.innerHTML = heart(g, b.classList.contains('sm')); b.replaceWith(n.firstChild); });
    counts();
  }
  function counts(){ $('#favN').textContent = G.favs.list().filter(byId).length; }

  /* ---------- Rewards apps: every venue's own app (menu, Season Pass, coins), from the top of the store ---------- */
  // the venues with an app on the site (PARTNERS in theme.js), then the older apps that still carry their own game
  function appList(){
    const P = (window.GrugTheme && GrugTheme.PARTNERS) || {}, out = [];
    Object.keys(P).forEach(id => { const v = P[id], g = G.GAMES.find(x => x.venue === id && x.status !== 'legacy') || {}, w = v.wallet;
      let coins = 0; try { const s = w && JSON.parse(localStorage.getItem(w.key) || 'null'); coins = Math.max(0, Math.floor(+(s && s[w.field]) || 0)); } catch (e) {}
      out.push({ href: G.url(v.app), logo: G.url(v.barLogo || v.logo), name: v.n, sub: (g.place ? g.place + ' · ' : '') + (coins ? G.fmt(coins) + ' ' + w.label : w ? w.label : 'Rewards app') }); });
    G.GAMES.filter(g => !g.venue && g.storageKey && g.play && !g.original).forEach(g => {
      const pts = (G.points().find(x => x.game.id === g.id) || {}).points || 0;
      out.push({ href: G.url(g.play), name: g.partner, sub: g.place + ' · ' + (pts ? G.fmt(pts) + ' points' : 'Rewards app') }); });
    return out;
  }
  function rewardApps(){
    const list = appList();
    G.ui.dialog({ title: 'Rewards apps', html: '<p class="st-apps-note">Menus, Season Passes and coins from the places behind the games. Every app opens the whole site in its own colours.</p>' +
      '<div class="st-applist">' + list.map(a => '<a class="st-app" href="' + a.href + '"><span class="lg">' + (a.logo ? '<img src="' + a.logo + '" alt="">' : '<b>' + esc(a.name) + '</b>') + '</span>' +
        '<span class="tx"><b>' + esc(a.name) + '</b><small>' + esc(a.sub) + '</small></span><span class="go">' + G.icon('caret-right') + '</span></a>').join('') + '</div>',
      actions: [{ label: 'Close', kind: 'quiet', value: null }] });
  }
  // The Rewards apps button stays hidden: every venue app is a frozen demonstration (assets/demo.js), reached from
  // the For restaurants page (partners/), not from the store.

  /* ---------- the store's address: '' = the store, #search?… = Browse all, #queue = open the Discovery Queue ---------- */
  function searchHref(o){
    const u = new URLSearchParams();
    if (o.q) u.set('q', o.q);
    const tags = (o.inc || []).concat((o.exc || []).map(t => '-' + t)); if (tags.length) u.set('tags', tags.join(','));
    ['made', 'status', 'mine', 'type'].forEach(k => { if (o[k] && o[k].length) u.set(k, o[k].join(',')); });
    if (o.sort && o.sort !== 'relevance') u.set('sort', o.sort);
    if (o.hidefav) u.set('hidefav', '1'); if (o.showign) u.set('showign', '1');
    const s = u.toString(); return '#search' + (s ? '?' + s : '');
  }
  const view = $('#view');
  let featTimer = 0;
  function route(){
    clearInterval(featTimer); hideHc();
    const h = location.hash.slice(1);
    const old = /^g\/([\w-]+)/.exec(h);   // the old Games page's #g/<id>: that game's page
    if (old && byId(old[1])) { location.replace(gameHref(byId(old[1]))); return; }
    if (h === 'queue') { history.replaceState(null, '', location.pathname + location.search); home(); startQueue(); return; }
    if (/^search(\?|$)/.test(h)) search(new URLSearchParams(h.split('?')[1] || ''));
    else home();
    $$('.st-nav [data-nav]').forEach(a => a.toggleAttribute('aria-current', a.dataset.nav === (/^search/.test(h) ? 'search' : 'home')));
    $$('.st-nav [data-nav]').forEach(a => { if (a.hasAttribute('aria-current')) a.setAttribute('aria-current', 'page'); });
  }
  addEventListener('hashchange', () => { route(); scrollTo(0, 0); });

  /* ================= the store ================= */
  let feat = [], fi = 0;
  function featCard(g){
    return '<article class="st-fc"><a class="st-fc-main" href="' + gameHref(g) + '"><img id="fImg" src="' + pic(g) + '" alt="" decoding="async"></a>' +
      '<div class="st-fc-info"><h3><a href="' + gameHref(g) + '">' + esc(g.title) + '</a></h3>' + (g.subtitle ? '<div class="st-fc-sub">' + esc(g.subtitle) + '</div>' : '') +
      madeFor(g) +
      '<div class="st-fc-shots">' + (shots(g).length > 1 ? shots(g).slice(0, 4).map((s, k) => '<img src="' + s + '" data-shot="' + s + '" alt="" loading="lazy" decoding="async" class="st-pic' + (k ? '' : ' on') + '">').join('') : '') + '</div>' +
      '<div class="st-fc-why">' + why(g) + '</div>' + tagLinks(g, 4) +
      '<div class="st-fc-foot">' + playBtn(g) + heart(g) + '</div></div></article>';
  }
  function setFeat(i){
    if (!feat.length) return;
    fi = (i + feat.length) % feat.length;
    $('#featHost').innerHTML = featCard(feat[fi]);
    $$('#featDots button').forEach((b, k) => b.classList.toggle('on', k === fi));
  }
  const calm = () => (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  function featAuto(){ clearInterval(featTimer); if (calm() || feat.length < 2) return; featTimer = setInterval(() => { if (!document.hidden && !$('#featHost:hover')) setFeat(fi + 1); }, 8000); }

  function capsule(g, ribbon){
    return '<div class="st-cap" data-go="' + g.id + '" data-hc="' + g.id + '"><a href="' + gameHref(g) + '" tabindex="-1" aria-hidden="true"><img class="st-pic" src="' + pic(g) + '" alt="" loading="lazy" decoding="async"></a>' +
      (ribbon ? '<span class="ribbon">' + G.icon('arrow-counter-clockwise') + esc(ribbon) + '</span>' : g.status !== 'live' || g.cart ? badge(g) : '') + heart(g, true) +
      '<div class="st-cap-b"><b><a href="' + gameHref(g) + '">' + esc(g.title) + '</a></b>' + madeFor(g) + you(g) + '</div></div>';
  }
  const row = (title, list, more, cls) => !list.length ? '' :
    '<section><div class="st-h"><h2>' + esc(title) + '</h2>' + (more ? '<a href="' + more + '">See all</a>' : '') + '</div>' +
    '<div class="st-scroller"><button type="button" class="st-arrow l" data-scroll="-1" aria-label="Scroll left">' + G.icon('caret-left') + '</button>' +
    '<div class="st-strip' + (cls ? ' ' + cls : '') + '">' + list.join('') + '</div>' +
    '<button type="button" class="st-arrow r" data-scroll="1" aria-label="Scroll right">' + G.icon('caret-right') + '</button></div></section>';

  const TABS = [
    ['all', 'All games', () => visible().filter(g => g.status !== 'legacy')],
    ['originals', 'Grug originals', () => visible().filter(g => g.original)],
    ['restaurants', 'Restaurant games', () => visible().filter(g => !g.original && g.status !== 'legacy')],
    ['yours', 'Your games', () => visible().filter(g => plays(g) || G.favs.has(g.id))],
    ['classics', 'Classics', () => visible().filter(g => g.status === 'legacy')]
  ];
  let tab = 'all';
  function trow(g, on){
    return '<div class="st-trow' + (on ? ' hl' : '') + '" data-go="' + g.id + '" data-prev="' + g.id + '"><img class="st-pic" src="' + pic(g) + '" alt="" loading="lazy" decoding="async">' +
      '<div style="min-width:0"><b><a href="' + gameHref(g) + '">' + esc(g.title) + '</a></b>' + madeFor(g) + '<div class="tl">' + esc(tagsOf(g).join(' · ') || g.kind) + '</div></div>' +
      '<div class="tr">' + badge(g) + you(g) + '</div></div>';
  }
  function preview(g){
    return '<h3>' + esc(g.title) + '</h3>' + madeFor(g) + '<p>' + esc(g.blurb || '') + '</p>' + tagLinks(g) +
      shots(g).slice(0, 4).map(s => '<img class="st-pic" src="' + s + '" alt="" loading="lazy" decoding="async">').join('');
  }
  function setTab(id){
    const t = TABS.find(x => x[0] === id) || TABS[0], list = t[2]().sort(sorter('relevance'));
    tab = t[0];
    $$('#tabs [data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
    $('#tabRows').innerHTML = list.length ? list.map((g, k) => trow(g, !k)).join('') : '<div class="st-empty"><b>Nothing here yet</b>Play a game or tap a heart and it shows up here.</div>';
    $('#tabPrev').innerHTML = list[0] ? preview(list[0]) : '';
  }

  function home(){
    const vis = visible(), w = tagWeights();
    feat = vis.filter(g => g.status !== 'legacy').map((g, k) => [g, (pm && g.id === pm.game ? 1e6 : 0) + (g.id === lastId ? 1e5 : 0) + affinity(g, w) * 10 - k]).sort((a, b) => b[1] - a[1]).map(x => x[0]);
    const originals = vis.filter(g => g.original).sort(sorter('relevance'));
    const venues = vis.filter(g => !g.original && g.status !== 'legacy').sort(sorter('relevance'));

        '<div class="st-q-i"><h3>' + esc(g.title) + '</h3>' + madeFor(g) + '<div class="st-fc-why">' + why(g) + '</div><p>' + esc(g.blurb || '') + '</p>' + tagLinks(g) +
        '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' + badge(g) + you(g) + '</div></div></div>' +
      '<div class="st-q-a"><button type="button" class="g-btn" data-qa="fav" aria-pressed="' + fav + '">' + G.icon('heart') + (fav ? 'In Favorites' : 'Add to Favorites') + '</button>' +
        '<button type="button" class="g-btn" data-qa="ign" aria-pressed="' + ign + '">' + G.icon('eye') + (ign ? 'Ignored' : 'Ignore') + '</button>' +
        '<a class="g-btn" href="' + gameHref(g) + '">Game page</a><button type="button" class="g-btn" data-qa="play">' + G.icon('play') + 'Play</button>' +
        '<button type="button" class="st-play nx" data-qa="next">' + (qi + 1 < Q.length ? 'Next in queue' : 'Finish') + G.icon('caret-right') + '</button></div>';
  }

  /* ================= the search box in the store bar ================= */
  const q = $('#q'), sugg = $('#sugg'); let sel = -1;
  $('#qIc').outerHTML = ic('search');
  function suggest(){
    const v = q.value.trim(); sel = -1;
    if (!v) { sugg.classList.remove('on'); sugg.parentElement.setAttribute('aria-expanded', 'false'); return; }
    const hits = EVERY.map(g => [g, score(g, v)]).filter(x => x[1] >= 4).sort((a, b) => b[1] - a[1]).slice(0, 5).map(x => x[0]);
    sugg.innerHTML = hits.map(g => '<a role="option" href="' + gameHref(g) + '"><img src="' + pic(g) + '" alt=""><span><b>' + esc(g.title) + G.age.tag(g) + '</b><small>' + esc(g.cart ? 'Cart' : g.original ? 'Grug original' : g.partner) + ' · ' + esc(tagsOf(g).slice(0, 2).join(', ')) + '</small></span></a>').join('') +
      '<a role="option" class="all" href="' + searchHref({ q: v }) + '">' + (hits.length ? 'See every result for “' + esc(v) + '”' : 'No games match “' + esc(v) + '” · browse all') + '</a>';
    sugg.classList.add('on'); sugg.parentElement.setAttribute('aria-expanded', 'true');
  }
  q.addEventListener('input', suggest); q.addEventListener('focus', suggest);
  q.addEventListener('keydown', e => {
    const it = $$('a', sugg);
    if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && it.length) { e.preventDefault(); sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + it.length) % it.length; it.forEach((a, k) => a.setAttribute('aria-selected', String(k === sel))); }
    else if (e.key === 'Enter') { e.preventDefault(); const go = sel >= 0 && it[sel] ? it[sel].getAttribute('href') : searchHref({ q: q.value.trim() }); sugg.classList.remove('on'); q.blur(); q.value = '';
      if (go[0] === '#') location.hash = go; else location.href = go; }
    else if (e.key === 'Escape') { sugg.classList.remove('on'); q.blur(); }
  });
  document.addEventListener('click', e => { if (!e.target.closest('.st-search')) sugg.classList.remove('on'); });

  /* ================= clicks everywhere: hearts, Play, the queue, rows, strip arrows ================= */
  document.addEventListener('click', e => {
    if (e.target.closest('dialog')) return;
    const f = e.target.closest('[data-fav]'); if (f) { e.preventDefault(); e.stopPropagation(); setFav(f.dataset.fav); if (S && /^#search/.test(location.hash)) results(); return; }
    const p = e.target.closest('[data-play]'); if (p) { e.preventDefault(); const g = byId(p.dataset.play); if (g) play(g); return; }
    if (e.target.closest('[data-queue]')) { e.preventDefault(); startQueue(); return; }
    if (e.target.closest('[data-apps]')) { e.preventDefault(); rewardApps(); return; }
    const s = e.target.closest('[data-scroll]'); if (s) { const strip = s.parentElement.querySelector('.st-strip'); strip.scrollBy({ left: +s.dataset.scroll * strip.clientWidth * .85 }); return; }
    if (e.target.closest('a,button,input,select,.st-opt')) return;
    const r = e.target.closest('[data-go]'); if (r) location.href = gameHref(byId(r.dataset.go));
  });

  /* ================= hover card: a closer look before clicking (mouse only) ================= */
  const hc = $('#hc'); let hcT = 0;
  function hideHc(){ clearTimeout(hcT); hc.classList.remove('on'); }
  function showHc(el){
    const g = byId(el.dataset.hc); if (!g) return;
    hc.innerHTML = '<h4>' + esc(g.title) + '</h4>' + madeFor(g) + '<div class="sh">' + shots(g).slice(0, 4).map(s => '<img class="st-pic" src="' + s + '" alt="">').join('') + '</div>' +
      '<p>' + esc(g.blurb || '') + '</p><div><div class="k">Tags</div>' + '<div class="st-tags" style="margin-top:5px">' + tagsOf(g).map(t => '<span class="st-tag">' + esc(t) + '</span>').join('') + '</div></div>' +
      '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' + badge(g) + you(g) + '</div>';
    const b = el.getBoundingClientRect(); let x = b.right + 12; if (x + 310 > innerWidth) x = b.left - 312;
    if (x < 8) { hideHc(); return; }
    hc.style.left = x + 'px'; hc.style.top = Math.max(calc(), Math.min(b.top, innerHeight - hc.offsetHeight - 12)) + 'px'; hc.classList.add('on');
  }
  const calc = () => (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--top')) || 64) + 12;
  if (window.matchMedia && matchMedia('(hover:hover) and (pointer:fine)').matches) {
    document.addEventListener('mouseover', e => { const el = e.target.closest('[data-hc]'); clearTimeout(hcT); if (!el) { hc.classList.remove('on'); return; } hcT = setTimeout(() => showHc(el), 380); });
    addEventListener('scroll', hideHc, { passive: true });
  }

  counts(); route();
})();
</script>
