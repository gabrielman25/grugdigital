const walkSpeed = () => 2.2 * (1 + 0.25 * S.up.boots);
const workMult = () => 1 + 0.25 * S.up.gloves;
const growMult = () => 1 + 0.1 * S.up.compost;

function rateOf(c) {                                         // $ a second for one plot, with today's upgrades
  const handle = 2 / walkSpeed() + (WORK.plant + WORK.harvest) / workMult(), sm = sellMult(), gm = growMult();
  if (c.regrow) return c.sell * sm / (c.regrow / gm + WORK.harvest / workMult() + 1.5 / walkSpeed());
  if (c.timber) return (c.sell * sm - c.seed) / (c.grow / gm + handle + WORK.chop / workMult());
  return (c.sell * sm - c.seed) / (c.grow / gm + handle);
}

  let best = null, br = -1;
  for (const id of S.unlocked) { const c = CROP[id]; if (c.seed > maxSeed) continue; const r = rateOf(c); if (r > br) { br = r; best = c; } }
  return best;
}

function planFor(i, forPlanting) {
  const p = S.plots[i];
  if (p.plan !== 'auto' && isUnlocked(p.plan)) {
    const c = CROP[p.plan];
    if (!forPlanting || S.money >= c.seed || anyGrowing()) return c;   // she waits for the money, unless nothing at all is growing
  }
  return bestCrop(forPlanting ? S.money : Infinity) || CROP.carrot;
}
function wantsClear(i) {                                      // a perennial tree whose plot is meant to grow something else now
  const p = S.plots[i], c = CROP[p.crop];

  if (p.plan === 'auto') { const b = bestCrop(Infinity); return b && b.id !== c.id && rateOf(b) > rateOf(c) * 1.15 && S.money >= b.seed; }
  return p.plan !== c.id && isUnlocked(p.plan);
}
function pickTask() {
  let best = null, bs = Infinity;

    let pri = -1, kind = '';

    else if (!p.crop) { const c = planFor(i, true); if (c && S.money >= c.seed) { pri = 1; kind = 'plant'; } }
    else if (wantsClear(i)) { pri = 2; kind = 'clear'; }

  if (t.kind === 'clear') return !!p.crop;

}

/* buying: her orders. She buys the cheapest thing she's allowed to, unless you've told her to save up for one first. */
function nextBuy(k) {
  if (k === 'plots') { const i = S.plots.findIndex(p => !p.owned); return i < 0 ? null : { cost: PLOT_COST[i], buy: () => buyPlot(i, true) }; }
  if (k === 'seeds') { const c = CROPS.find(c => !isUnlocked(c.id)); return c ? { cost: c.unlock, buy: () => unlockCrop(c.id, true) } : null; }
  if (k === 'upgrades') { let b = null; for (const u of UPS) { const l = S.up[u.id]; if (l >= u.max) continue; const cost = upCost(u, l); if (!b || cost < b.cost) b = { cost, buy: () => buyUp(u.id, true) }; } return b; }
  if (k === 'wish') { const w = S.wish.map(id => WI[id]).filter(w => w && !S.owned.includes(w.id)).sort((a, b) => a.price - b.price)[0]; return w ? { cost: w.price, buy: () => buyWear(w.id, true) } : null; }

}
function autobuy() {

    const r = S.rules.find(r => r.k === S.goal), n = r && r.on && nextBuy(S.goal);
    if (n) { if (S.money - n.cost >= S.reserve) n.buy(); return; }
  }
  let pick = null;                                         // otherwise: the cheapest of everything she's allowed to buy
  for (const r of S.rules) { if (!r.on) continue; const n = nextBuy(r.k); if (n && (!pick || n.cost < pick.cost)) pick = n; }

/* stage: 0 seed, 1 sprout, 2 growing, 3 ready; 4 = a grown tree waiting for its next fruit (f = how far along) */

    case 'root':

      S_(c.leaf === 'stalk' ? TPL.rootBulb : c.leaf === 'bush' ? TPL.rootSpud : TPL.rootBody); return;
    case 'head': S_(young ? TPL.headYoung : TPL.head); return;

    case 'pineapple': if (young) S_(TPL.lowYoung); else S_(TPL.pineapple); return;
    case 'bush': S_(young ? TPL.bushYoung : TPL.bush); return;
    case 'banana': if (young) S_(TPL.palmYoung); else S_(TPL.banana); return;
    case 'mushroom': S_(young ? TPL.mushYoung : TPL.mushroom); return;

      if (c.syrup && stage === 3) { tp.g = '#ff9a4f'; tp.G = '#e0602a'; }

function plotStage(p) {
  if (!p.crop) return { stage: -1, f: 0 };
  const f = Math.min(1, p.t / need(p));
  if (p.phase === 'regrow') return { stage: f >= 1 ? 3 : 4, f };
  return { stage: f >= 1 ? 3 : f < 0.12 ? 0 : f < 0.4 ? 1 : 2, f };

/* the farmer: 16x16, front-on, with her look. pose: idle, walk, work, carry */

/* ================= the tab ================= */
const ICON = T.canvas(16, 16);
let frameN = 0;
function farmerPose() {
  if (F.carryT > 0 && F.carry) return 'carry';
  if (F.task && F.act > 0) return 'work';
  if (F.task) return 'walk';
  return 'idle';
}
function stripCtx(scr) { return scr.ctx; }
function drawTab(scr) {
  frameN++;
  const pose = S.set.anim ? farmerPose() : 'idle', fr = S.set.anim ? frameN : 0;
  const sprite = farmerSprite(S.look, pose, fr, F.carry, pose === 'walk' ? F.dir : 1);
  ICON.ctx.clearRect(0, 0, 16, 16); ICON.ctx.drawImage(sprite, 0, 0);
  T.favicon(ICON.cv);
  // the title: one emoji per plot, then the money
  const em = S.plots.filter(p => p.owned).map(p => {
    if (!p.crop) return '🟫';
    const c = CROP[p.crop], { stage } = plotStage(p);
    if (stage === 3) return c.emoji;
    if (stage === 4) return c.kind === 'palm' ? '🌴' : '🌳';
    if (c.cat === 'tree' && stage === 2) return '🌱';
    return stage <= 1 ? '🌱' : '🌿';
  }).join('');
  T.title(em + (S.set.moneyTitle ? ' · $' + fmt(S.money) : '') + ' · ' + GAME);
  if (!scr) return;
  const ctx = stripCtx(scr);
  ctx.clearRect(0, 0, 16 * 9, 16);
  ctx.drawImage(ICON.cv, 0, 0);
  S.plots.forEach((p, i) => {
    const ox = 16 * (i + 1);
    if (!p.owned) { drawLocked(ctx, ox, 0); return; }
    if (!p.crop) { drawSoil(ctx, ox, 0, false); return; }
    const { stage, f } = plotStage(p); drawPlant(ctx, ox, 0, CROP[p.crop], stage, f);
  });
  // where she is: a little marker over the plot she's at or walking past
  const at = Math.round(F.x);
  if (at >= 1 && at <= 8) { const ox = 16 * at; ctx.fillStyle = INK; ctx.fillRect(ox + 6, 0, 3, 1); ctx.fillRect(ox + 7, 1, 1, 1); }
  scr.setTitle(`${S.name}'s farm · $${fmt(S.money)}`);
}

/* ================= the shop under the tab ================= */
const ui = { tab: 'garden', dirty: true, dirtyPlots: false, filter: 'all', slot: 'hat', tryOn: null, note: null };
let scr = null, pane = null;
const statusText = () => {
  const t = F.task;
  if (!t) return S.plots.some(p => p.owned && p.crop) ? `${S.name} is resting while everything grows.` : `${S.name} is saving up for seeds.`;
  const p = S.plots[t.plot], c = CROP[p.crop] || planFor(t.plot, true), verb = { harvest: 'picking', plant: 'planting', clear: 'clearing' }[t.kind];
  return `${S.name} is ${F.act > 0 ? '' : 'on her way to '}${verb} ${c ? c.name.toLowerCase() : ''} at plot ${t.plot + 1}.`;
};
const cropOptions = sel => `<option value="auto"${sel === 'auto' ? ' selected' : ''}>✨ Best pick (auto)</option>` +
  S.unlocked.map(id => CROP[id]).sort((a, b) => a.tier - b.tier).map(c => `<option value="${c.id}"${sel === c.id ? ' selected' : ''}>${c.emoji} ${esc(c.name)}</option>`).join('');
function plotCard(p, i) {
  if (!p.owned) return `<div class="card plot locked"><b>Plot ${i + 1}</b><span class="muted">For sale</span><button class="b g sm" data-buyplot="${i}" data-cost="${PLOT_COST[i]}">Buy · $${fmt(PLOT_COST[i])}</button></div>`;
  return `<div class="card plot"><div class="row"><b>Plot ${i + 1}</b><span class="spacer"></span><span class="muted" data-live="pst${i}"></span></div>
    <div class="nm" data-live="pnm${i}"></div><div class="bar" data-live="pbar${i}"><i></i></div>
    <select data-plan="${i}" aria-label="What to grow on plot ${i + 1}">${cropOptions(p.plan)}</select></div>`;
}
const PANES = {
  garden() {
    return `${ui.note ? `<div class="note"><p>${ui.note}</p><button class="b w sm" data-dismiss>OK</button></div>` : ''}
      <div class="row"><div><div class="money" data-live="money"></div><div class="muted" data-live="rate"></div></div><span class="spacer"></span>
        <div class="muted" style="text-align:right" data-live="status"></div></div>
      <div class="plots">${S.plots.map(plotCard).join('')}</div>
      <p class="muted" style="margin-top:10px">${esc(S.name)} looks after everything on her own, even while this tab is in the background or closed. Pick what each plot grows, or leave it on ✨ Best pick.</p>`;
  },
  orders() {
    const keep = [0, 100, 1000, 10000, 100000, 1e6, 1e7, 1e8];
    return `<h3>${esc(S.name)}'s orders</h3>
      <p class="muted">She follows these on her own. Change them whenever you like.</p>
      <div class="card" style="margin-bottom:10px"><b>When there's enough money, buy:</b>
        <p class="muted" style="margin:4px 0 8px">She buys the cheapest of these first.</p>
        <div class="rules">${S.rules.map((r, i) => `<div class="rule"><label><input type="checkbox" data-rule="${i}"${r.on ? ' checked' : ''}>${RULES[r.k]}</label></div>`).join('')}</div>
        <div class="row" style="margin-top:10px"><span>Save up first for</span><select data-goal><option value="">nothing in particular</option>${S.rules.map(r => `<option value="${r.k}"${S.goal === r.k ? ' selected' : ''}>${RULES[r.k]}</option>`).join('')}</select></div>
        <div class="row" style="margin-top:10px"><span>Always keep at least</span><select data-reserve>${keep.map(k => `<option value="${k}"${S.reserve === k ? ' selected' : ''}>$${fmt(k)}</option>`).join('')}</select></div>
      </div>
      <div class="card"><b>What to grow on each plot</b>
        <div class="orders" style="margin-top:8px">${S.plots.map((p, i) => p.owned ? `<span>Plot ${i + 1}</span><select data-plan="${i}">${cropOptions(p.plan)}</select>` : `<span class="muted">Plot ${i + 1}</span><span class="muted">Not yours yet</span>`).join('')}</div>
        <div class="row" style="margin-top:8px"><span class="muted">All plots:</span><select data-planall><option value="">Choose…</option>${cropOptions('')}</select></div>
      </div>`;
  },
  seeds() {
    const L = CROPS.filter(c => ui.filter === 'all' || c.cat === ui.filter);
    return `<div class="chips">${[['all', 'All'], ...Object.entries(CAT)].map(([k, t]) => `<button data-filter="${k}" class="${ui.filter === k ? 'on' : ''}">${t}</button>`).join('')}</div>
      <div class="list">${L.map(c => {
        const own = isUnlocked(c.id), time = c.regrow ? `${T.dur(c.grow)} to grow, then fruit every ${T.dur(c.regrow)}` : `${T.dur(c.grow)} to grow${c.timber ? ', then she cuts it for wood' : ''}`;
        return `<div class="card item${own ? '' : ' locked'}"><span class="em">${c.emoji}</span><div class="txt"><b>${esc(c.name)}</b>
          <span class="muted">${CAT[c.cat].replace(/s$/, '')} · ${time} · sells for $${fmt(c.sell)}${c.seed ? ` · ${c.regrow || c.timber ? 'sapling' : 'seeds'} $${fmt(c.seed)}` : ' · free seeds'}</span></div>
          ${own ? `<span class="ok">Yours ✓</span>` : `<button class="b g" data-unlock="${c.id}" data-cost="${c.unlock}">Get · $${fmt(c.unlock)}</button>`}</div>`;
      }).join('')}</div>`;
  },
  upgrades() {
    return `<div class="list">${UPS.map(u => {
      const l = S.up[u.id], max = l >= u.max, c = upCost(u, l);
      return `<div class="card item"><span class="em">${u.em}</span><div class="txt"><b>${u.name} <span class="muted">level ${l} of ${u.max}</span></b><span class="muted">Each level: ${u.what}.</span></div>
        ${max ? '<span class="ok">All done ✓</span>' : `<button class="b g" data-upg="${u.id}" data-cost="${c}">Buy · $${fmt(c)}</button>`}</div>`;
    }).join('')}</div>`;
  },
  wardrobe() {
    const items = WEAR.filter(w => w.slot === ui.slot), t = ui.tryOn && WI[ui.tryOn];
    let act = '';
    if (t) {
      const own = S.owned.includes(t.id), worn = S.look[t.slot] === t.id, wish = S.wish.includes(t.id);
      act = `<div class="try"><b>${esc(t.name)}</b><span class="spacer"></span>${worn ? '<span class="ok">Wearing it ✓</span>' : own ? `<button class="b g" data-wear="${t.id}">Wear it</button>`
        : `<button class="b g" data-buywear="${t.id}" data-cost="${t.price}">Buy & wear · $${fmt(t.price)}</button><button class="b w" data-wish="${t.id}">${wish ? '♥ On her wish list' : '♡ Wish list'}</button>`}</div>`;
    }
    return `<div class="ward"><div class="me"><canvas id="mePrev" width="16" height="16" aria-label="Your farmer"></canvas>
        <div><input type="text" maxlength="14" value="${esc(S.name)}" data-name aria-label="Your farmer's name"><div class="muted" style="font-size:.9em;margin-top:4px;text-align:center">${t ? 'Trying on: ' + esc(t.name) : 'This is your tab icon'}</div></div></div>
      <div class="shelf"><div class="chips">${SLOTS.map(([k, n]) => `<button data-slot="${k}" class="${ui.slot === k ? 'on' : ''}">${n}</button>`).join('')}</div>
        <div class="grid">${items.map(w => { const own = S.owned.includes(w.id), worn = S.look[w.slot] === w.id;
          return `<button type="button" class="wi${own ? ' own' : ''}${worn ? ' worn' : ''}${ui.tryOn === w.id ? ' sel' : ''}" data-try="${w.id}"><canvas width="16" height="16" data-thumb="${w.id}"></canvas>${esc(w.name)}<span class="pr">${worn ? 'Wearing' : own ? 'Yours' : '$' + fmt(w.price)}</span>${S.wish.includes(w.id) ? '<span class="wish">♥</span>' : ''}</button>`; }).join('')}</div>
        ${act}<p class="muted" style="margin-top:8px">Tap something to try it on. Put things on her wish list and she'll buy them herself when there's money (see Orders).</p></div></div>`;
  },
  notes() {
    const st = S.stats, top = Object.entries(st.by).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([id, n]) => `${CROP[id].emoji} ${n.toLocaleString()}`).join(' · ');
    return `<div class="card" style="margin-bottom:10px"><b>${esc(S.name)}'s farm so far</b><p class="muted" style="margin:4px 0 0">${st.harvests.toLocaleString()} harvests · $${fmt(st.earned)} earned · ${T.dur(st.time)} of farming${top ? ' · most picked: ' + top : ''}</p></div>
      <h3>What happened</h3><div class="log">${S.log.length ? S.log.map(l => `<div><i>${new Date(l.at).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</i>${esc(l.text)}</div>`).join('') : '<div class="muted">Nothing yet. Check back any time.</div>'}</div>`;
  },
};
const TABS = [['garden', '🌱 Garden'], ['orders', '📋 Orders'], ['seeds', '🌻 Seeds'], ['upgrades', '🧺 Upgrades'], ['wardrobe', '👒 Wardrobe'], ['notes', '📖 Notes']];

function buildShop() {
  scr.body.innerHTML = `<div class="tf"><div class="tf-tabs" role="tablist">${TABS.map(([k, t]) => `<button role="tab" data-tab="${k}">${t}</button>`).join('')}</div><div class="tf-pane" id="pane"></div></div>`;
  pane = scr.body.querySelector('#pane');
  const root = scr.body;
  root.addEventListener('click', e => {
    const d = e.target.closest('button'); if (!d) return; const s = d.dataset;
    if (s.tab) { ui.tab = s.tab; ui.tryOn = null; ui.dirty = true; }
    else if (s.buyplot != null) buyPlot(+s.buyplot);
    else if (s.unlock) unlockCrop(s.unlock);
    else if (s.upg) buyUp(s.upg);
    else if (s.filter) { ui.filter = s.filter; ui.dirty = true; }
    else if (s.slot) { ui.slot = s.slot; ui.tryOn = null; ui.dirty = true; }
    else if (s.try) { ui.tryOn = ui.tryOn === s.try ? null : s.try; if (ui.tryOn && S.owned.includes(ui.tryOn)) S.look[WI[ui.tryOn].slot] = ui.tryOn; ui.dirty = true; }
    else if (s.wear) { S.look[WI[s.wear].slot] = s.wear; ui.dirty = true; }
    else if (s.buywear) buyWear(s.buywear);
    else if (s.wish) { S.wish = S.wish.includes(s.wish) ? S.wish.filter(x => x !== s.wish) : S.wish.concat(s.wish); ui.dirty = true; }
    else if (s.dismiss != null) { ui.note = null; ui.dirty = true; }
    run && run.save();
  });
  root.addEventListener('change', e => {
    const s = e.target.dataset;
    if (s.plan != null) { S.plots[+s.plan].plan = e.target.value; ui.dirty = true; if (F.task && F.task.plot === +s.plan) F.task = null; }
    else if (s.planall != null && e.target.value) { S.plots.forEach(p => { if (p.owned) p.plan = e.target.value; }); F.task = null; ui.dirty = true; }
    else if (s.rule != null) { S.rules[+s.rule].on = e.target.checked; }
    else if (s.reserve != null) { S.reserve = +e.target.value; }
    else if (s.goal != null) { S.goal = e.target.value; }
    run && run.save();
  });
  root.addEventListener('input', e => { if (e.target.dataset.name != null) { S.name = (e.target.value.trim() || 'Poppy').slice(0, 14); } });
  root.addEventListener('focusout', e => { if (e.target.dataset.name != null) { e.target.value = S.name; ui.dirty = true; run && run.save(); } });
}
function renderShop() {
  if (ui.dirty) {
    const hadFocus = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.name != null;
    if (hadFocus) return liveUpdate();      // don't rebuild while she's being renamed
    ui.dirty = false;
    scr.body.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === ui.tab));
    const st = pane.scrollTop; pane.innerHTML = PANES[ui.tab](); pane.scrollTop = st;
    pane.querySelectorAll('canvas[data-thumb]').forEach(cv => {
      const w = WI[cv.dataset.thumb], look = Object.assign({}, S.look, { [w.slot]: w.id }), ctx = cv.getContext('2d');
      ctx.drawImage(farmerSprite(look, 'idle', 0, null, 1), 0, 0);
    });
  }
  liveUpdate();
}
function liveUpdate() {
  const set = (k, v) => { const el = pane.querySelector(`[data-live="${k}"]`); if (el && el.textContent !== v) el.textContent = v; };
  set('money', '$' + fmt(S.money));
  set('rate', S.rate > 0.01 ? `about $${fmt(S.rate * 60)} a minute` : 'just getting started');
  set('status', statusText());
  S.plots.forEach((p, i) => {
    if (!p.owned) return;
    const c = p.crop && CROP[p.crop], { stage, f } = plotStage(p);
    set('pnm' + i, c ? `${c.emoji} ${c.name}` : 'Empty soil');
    set('pst' + i, !c ? 'waiting' : stage === 3 ? 'ready!' : T.dur((1 - f) * need(p) / growMult()));
    const bar = pane.querySelector(`[data-live="pbar${i}"]`); if (bar) { bar.firstChild.style.width = (c ? f * 100 : 0) + '%'; bar.classList.toggle('ripe', stage === 3); }
  });
  pane.querySelectorAll('[data-cost]').forEach(b => { const off = S.money < +b.dataset.cost; if (b.disabled !== off) b.disabled = off; });
  const me = pane.querySelector('#mePrev');
  if (me) { const ctx = me.getContext('2d'); ctx.clearRect(0, 0, 16, 16); const t = ui.tryOn && WI[ui.tryOn]; const look = t ? Object.assign({}, S.look, { [t.slot]: t.id }) : S.look; ctx.drawImage(farmerSprite(look, 'idle', frameN, null, 1), 0, 0); }
}

/* ================= saving, loading, the away note ================= */
function load(d) {
  const f = fresh();
  S = Object.assign(f, d);
  S.plots = f.plots.map((p, i) => Object.assign(p, (d.plots || [])[i] || {}));
  S.plots.forEach(p => { if (p.crop && !CROP[p.crop]) p.crop = null; if (p.plan !== 'auto' && !CROP[p.plan]) p.plan = 'auto'; });
  S.unlocked = (d.unlocked || ['carrot']).filter(id => CROP[id]); if (!S.unlocked.includes('carrot')) S.unlocked.unshift('carrot');
  S.up = Object.assign(f.up, d.up || {});
  S.rules = Array.isArray(d.rules) && d.rules.length === f.rules.length ? d.rules : f.rules;
  S.owned = Array.from(new Set(f.owned.concat((d.owned || []).filter(id => WI[id]))));
  S.wish = (d.wish || []).filter(id => WI[id]);
  S.look = Object.assign({}, DEFAULT_LOOK, d.look || {}); for (const k in S.look) if (!WI[S.look[k]] || !S.owned.includes(S.look[k])) S.look[k] = DEFAULT_LOOK[k];
  S.stats = Object.assign(f.stats, d.stats || {}); S.set = Object.assign(f.set, d.set || {});
  if (typeof d.fx === 'number') F.x = d.fx;
}
const save = () => Object.assign({}, S, { fx: F.x });
const snapshot = () => ({ h: S.stats.harvests, e: S.stats.earned, u: S.unlocked.length, o: S.owned.length });
function away(b, a, secs) {
  if (!b) return;
  const h = a.h - b.h, e = a.e - b.e; if (h <= 0) return;
  const extra = [a.u > b.u ? `got ${a.u - b.u} new seed${a.u - b.u > 1 ? 's' : ''}` : '', a.o > b.o ? `bought ${a.o - b.o} new outfit piece${a.o - b.o > 1 ? 's' : ''}` : ''].filter(Boolean).join(' and ');
  const text = `While you were away (${T.dur(secs)}), ${S.name} picked ${h.toLocaleString()} crops and earned $${fmt(e)}${extra ? ', and ' + extra : ''}. 🌷`;
  ui.note = esc(text); log(text); ui.dirty = true;
}

/* ================= the cover picture (?cover) ================= */
function cover() {
  document.body.className = 'cover';
  const c = T.canvas(320, 180), ctx = c.ctx;
  c.cv.style.width = '960px'; c.cv.style.height = '540px'; document.body.innerHTML = ''; document.body.appendChild(c.cv);
  ctx.fillStyle = '#cfe9ff'; ctx.fillRect(0, 0, 320, 180);
  ctx.fillStyle = '#f2d3e0'; ctx.fillRect(0, 0, 320, 30);
  ctx.fillStyle = '#fff9f4'; ctx.fillRect(56, 6, 200, 24); ctx.fillRect(0, 30, 320, 2);
  const look = { hat: 'hat-sun', hair: 'hair-braids', face: 'face-blush', top: 'top-gingham', bottom: 'bot-overalls', shoes: 'shoe-wellies' };
  const tab = ['strawberry', 'sunflower', 'tomato', 'apple', 'tulip', 'carrot', 'watermelon', 'sakura'];
  ctx.drawImage(farmerSprite(look, 'idle', 0, null, 1), 62, 10);
  tab.forEach((id, i) => drawPlant(ctx, 80 + i * 16, 10, CROP[id], 3, 1));
  ctx.fillStyle = INK; ctx.font = 'bold 9px Arial'; ctx.fillText('$12.3K', 214, 22);
  ctx.fillStyle = '#b9e3a5'; ctx.fillRect(0, 120, 320, 60);
  const field = ['sunflower', 'rose', 'strawberry', 'lavender', 'peach', 'tulip', 'pumpkin', 'daisy', 'cherry', 'hibiscus', 'corn', 'lotus'];
  const big = T.canvas(16, 16);
  field.forEach((id, i) => { big.ctx.clearRect(0, 0, 16, 16); drawPlant(big.ctx, 0, 0, CROP[id], 3, 1); ctx.drawImage(big.cv, 0, 0, 16, 16, 8 + i * 26, 92 + (i % 2) * 18, 32, 32); });
  const me = farmerSprite({ hat: 'hat-flowers', hair: 'hair-long-brown', face: 'face-blush', top: 'top-floral', bottom: 'bot-skirt', shoes: 'shoe-maryjane' }, 'idle', 0, null, 1);
  ctx.drawImage(me, 0, 0, 16, 16, 128, 100, 64, 64);
  ctx.fillStyle = 'rgba(74,58,79,.85)'; ctx.font = 'bold 22px Arial'; ctx.textAlign = 'center'; ctx.fillText('Tiny Tab Farm', 160, 64);
  ctx.font = 'bold 10px Arial'; ctx.fillText('a cozy farm that lives in your browser tab', 160, 80);
}

/* ================= start ================= */
let run = null;
if (/[?&]cover\b/.test(location.search)) { cover(); return; }
scr = T.screen(document.getElementById('game'), { tiles: 9, label: GAME, url: location.host ? location.host + location.pathname : 'grugdigital.com/arcade/tiny-tab-farm/' });
buildShop();
T.menu({
  screen: scr,
  help: `<p><b>Your farmer is the little icon on this tab</b>, and the tab's title shows her plots and your money. Leave the tab open (in the background is fine) and she keeps farming; she even keeps going for up to a day while it's closed.</p>
    <p><b>Garden:</b> what's growing. <b>Orders:</b> what she buys on her own and what each plot grows. <b>Seeds:</b> new vegetables, fruits, flowers and trees. <b>Upgrades:</b> make her faster. <b>Wardrobe:</b> dress her up; it shows on the tab.</p>
    <p>Trees take longer, but fruit trees keep giving fruit without replanting. Nothing can go wrong: there's no way to lose.</p>`,
  settings: [
    { label: 'Animate my farmer on the tab', get: () => S.set.anim, set: v => { S.set.anim = v; } },
    { label: 'Show my money in the tab title', get: () => S.set.moneyTitle, set: v => { S.set.moneyTitle = v; } },
  ],
  reset() { run.wipe(); S = fresh(); Object.assign(F, { x: 1, dir: 1, task: null, act: 0, carry: null, carryT: 0 }); ui.note = null; ui.tab = 'garden'; ui.dirty = true; run.save(); },
});
run = T.run({
  key: KEY, step, save, load, snapshot, away, stepSize: 0.5, tick: 250, maxOffline: 86400,
  render(visible) { drawTab(visible ? scr : null); if (visible) renderShop(); },
});
// daily Pearls on grugdigital.com (shown once; never on the tab)
if (window.GrugPearls) GrugPearls.start().then(r => {
  if (!window.GrugPearlPopup) return;
  if (r.welcome) GrugPearlPopup.show(r.welcome, { title: 'Welcome to Grug!' });
  else if (r.daily) GrugPearlPopup.show(r.daily, { title: 'Daily Pearls' });
}).catch(() => {});
window.TinyTabFarm = { get state() { return S; }, farmer: F, CROPS, WEAR, step, run: () => run, drawPlant, farmerSprite };
})();
</script>
