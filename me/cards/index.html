<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stamp cards · Grug</title>
<meta name="description" content="Your stamp cards from every shop you've tapped in at, and your Pearls.">
<meta name="theme-color" content="#F3F3F5">
<link rel="icon" href="../../favicon.png">
<link rel="stylesheet" href="../../assets/grug.css">
<script src="../../assets/theme.js"></script>
<link rel="stylesheet" href="../../assets/rewards.css">
<style>
.mc-h{display:flex;flex-direction:column;gap:6px;padding:22px 0 4px}
.mc-h h1{font-size:clamp(28px,5vw,40px)}
.mc-h p{color:var(--ink2);font-size:16.5px;max-width:52ch}
.g-section-h .n{color:var(--mut);font-weight:600;font-size:15px}
.mc-own{margin-top:26px;color:var(--mut);font-size:14.5px}
.mc-own a{color:var(--ink2);font-weight:700}
</style>
</head>
<body>
<!-- Me → Stamp cards: the guest's side of rewards (the stamp cards they've collected at shops, and their Pearls).
     The owner's side, making a card for your own shop, is rewards/. -->
<main class="wrap">
  <header class="mc-h">
    <h1>Your stamp cards</h1>
    <p>Every shop you've tapped in at, with your stamps. They're saved on this phone.</p>
  </header>

  <section class="g-section">
    <div class="g-section-h"><h2>Cards</h2><span class="n" id="cardsN"></span></div>
    <div class="rw-tiles" id="cardList"></div>
  </section>

  <section class="g-section">
    <div class="rw-pearls" id="pearls"></div>
  </section>

  <p class="mc-own" data-hide-brand>Run a shop? <a href="../../restaurant/">Make a free stamp card for it</a>.</p>
</main>
<script src="../../assets/catalog.js"></script>
<script src="../../assets/icons.js"></script>
<script src="../../assets/games.js"></script>
<script src="../../assets/grug.js"></script>
<script src="../../assets/rewards.js"></script>
<script>
(function(){
  const G = Grug, RW = GrugRewards, esc = G.esc, $ = s => document.querySelector(s);
  G.ui.chrome('cards', { title: 'Stamp cards' });

  function when(t) {
    if (!t) return '';
    const day = RW.dayKey(t), today = RW.dayKey(Date.now()), y = RW.dayKey(Date.now() - 864e5);
    if (day === today) return 'today'; if (day === y) return 'yesterday';
    const d = new Date(t); return Date.now() - t < 6 * 864e5 ? d.toLocaleDateString([], { weekday: 'long' }) : d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  }
  const dots = (have, n) => '<div class="rw-dots" aria-label="' + have + ' of ' + n + ' stamps">' + Array.from({ length: n }, (_, i) => '<i class="' + (i < have ? 'on' : '') + '"></i>').join('') + '</div>';
  const tileVars = color => 'style="--a:' + color + ';--a-lo:' + RW.lo(color) + ';--a-ink:' + RW.inkOn(color) + '"';
  const band = (color, icon, name, sub) => '<div class="band" style="' + RW.bandStyle(color) + '"><span class="rw-ic">' + icon + '</span><div><b>' + esc(name) + '</b><small>' + esc(sub) + '</small></div></div>';

  function paintPearls() {
    $('#pearls').innerHTML = '<span class="pi">' + G.icon('pearl') + '</span><div><div class="num">' + G.fmt(RW.balance()) + '<small>Pearls</small></div></div>' +
      '<p class="txt"><b>+' + RW.TAP_PEARLS + ' Pearls every time you tap in</b> at a shop (once a day at each). Spend them in any game on Grug.</p>' +
      '<div class="row"><a class="g-btn primary" href="' + G.url('games/') + '">' + G.icon('game-controller') + 'Play a game</a><a class="g-btn" href="' + G.pearlsUrl() + '">Get more</a></div>';
  }

  function paint() {
    paintPearls();
    /* stamp cards saved on this phone + venue apps they've used */
    const stamp = RW.cards().map(x => {
      const have = Math.min(x.st.stamps, x.cfg.s), full = have >= x.cfg.s;
      return { at: x.st.seen || 0, html: '<a class="rw-tile" ' + tileVars(x.cfg.color) + ' href="../../rewards/card/#c=' + x.st.c + '">' + band(x.cfg.color, RW.iconSvg(x.cfg.i), x.cfg.n, 'Stamp card') +
        '<div class="body">' + dots(have, x.cfg.s) +
        '<div class="line"><span>' + (full ? '<b>Reward ready</b>' : '<b>' + have + ' of ' + x.cfg.s + '</b> stamps') + '</span><span>' + esc(RW.rewardText(x.cfg.r)) + '</span></div>' +
        '<div class="line"><span>Last visit ' + esc(when(x.st.seen)) + '</span><span>' + G.fmt(x.st.pearls || 0) + ' Pearls earned</span></div></div></a>' };
    });
    const pts = G.points().filter(p => !p.game.original && p.game.status !== 'legacy');
    const visited = pts.filter(p => p.has && (p.points > 0 || p.visits > 0 || p.runs > 0));
    const venue = visited.map(p => {
      const g = p.game, s = G.appState(g) || {}, last = Array.isArray(s.history) && s.history[0] ? +s.history[0].at || 0 : 0;
      return { at: last, html: '<a class="rw-tile" href="' + G.rewardsUrl(g) + '">' + band(g.color, G.icon('storefront'), g.partner, 'Demonstration · ' + g.place) +
        '<div class="body"><div class="line"><span><b>' + G.fmt(p.points) + '</b> ' + esc(p.coin) + '</span><span>' + G.fmt(p.visits) + ' visit' + (p.visits === 1 ? '' : 's') + '</span></div>' +
        '<div class="line"><span>' + esc(g.earn || 'Earn points every visit') + '</span></div>' +
        '<div class="line"><span>' + (last ? 'Last visit ' + esc(when(last)) : 'Open the app') + '</span><span>' + esc(g.title) + '</span></div></div></a>' };
    });
    const all = stamp.concat(venue).sort((a, b) => b.at - a.at);
    $('#cardsN').textContent = all.length ? all.length + ' card' + (all.length > 1 ? 's' : '') : '';
    $('#cardList').innerHTML = all.length ? all.map(x => x.html).join('') :
      '<div class="rw-empty"><b>No cards yet</b><span>When a shop has a Grug stamp card, scan its QR or tap its tag. The card shows up here with your stamps.</span></div>';
  }

  paint();
  addEventListener('storage', e => { if (!e.key || e.key === RW.KEY || e.key === 'grug.pearls.v1') paint(); });
  addEventListener('pageshow', paint);
})();
</script>
</body>
</html>
