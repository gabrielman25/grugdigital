<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pet Mountain Rescue · Grug</title>
<meta name="description" content="Climb an endless block mountain with a climbing partner, rescue stranded pets and watch them earn gems at your Pet Haven. A Grug original.">

<!--
  STANDALONE GAME · play/petmountainrescue/
  A Grug original: no venue behind it, so its Store is paid in Pearls only.
  assets/gamehost.js does everything else: the bar (Back, name, Pearls), the game frame (game.html) and the game kit's
  messages. Change the game's Store, save key or venue below; the protocol is documented at the top of gamehost.js.
-->
</head>
<body>
<script src="../../assets/catalog.js"></script>
<script src="../../assets/icons.js"></script>
<script src="../../assets/games.js"></script>
<script src="../../assets/grug.js"></script>
<script src="../../assets/grug-app.js"></script>
<script src="../../assets/gamehost.js"></script>
<script>
'use strict';
GrugGameHost({
  id: 'petmountainrescue', app: 'petmountainrescue', bg: '#0b0e14', title: 'Pet Mountain Rescue', src: 'game.html', collectible: 'metres', runSeconds: 300, storageKey: 'grug-petmountainrescue-v1',
  // Pearls only. effect / amount are what game.html does with each one: pass* = forever passes (x2 gems, settle speed,
  // auto collect, Big Boost, faster climbs, Summit Club), double / lift / speed / quick = boosts for 5 minutes of climbing,
  // settleall / skip = right away, gems = that many minutes of your Haven's gems, outfit = the golden outfit.
  // The climb itself (gems, best height, camps, Haven pets, partners) saves inside game.html ('pet-mountain-rescue.v1');
  // this key only holds owned items, best height and plays.
  shop: [
    { id: 'pass_gems', name: 'x2 Gems', desc: 'Pets and the trail give double gems, forever', cost: 50, effect: 'passgems', amount: 2, icon: 'coins' },
    { id: 'pass_settle', name: 'x2 Settle Speed', desc: 'New pets settle in twice as fast, forever', cost: 40, effect: 'passsettle', amount: 2, icon: 'timer' },
    { id: 'pass_collect', name: 'Auto Collect', desc: 'Haven gems come to you wherever you are', cost: 35, effect: 'passcollect', amount: 1, icon: 'shopping-bag' },
    { id: 'pass_lift', name: 'Big Boost', desc: 'Your partner lifts you 3 blocks high, forever', cost: 40, effect: 'passlift', amount: 3, icon: 'rocket' },
    { id: 'pass_quick', name: 'Speedy Climbs', desc: 'Climbs and pull-ups twice as fast, forever', cost: 30, effect: 'passquick', amount: 2, icon: 'lightning' },
    { id: 'pass_club', name: 'Summit Club', desc: 'Triple daily gift, +4 Haven pads, a gold hat for your partner', cost: 45, effect: 'passclub', amount: 3, icon: 'crown-simple' },
    { id: 'gemrush', name: 'Gem Rush', desc: 'Double gems from pets and the trail', cost: 6, effect: 'double', amount: 2, icon: 'coins' },
    { id: 'superlift', name: 'Super Lift', desc: 'Your partner boosts you 3 blocks high', cost: 5, effect: 'lift', amount: 3, icon: 'rocket' },
    { id: 'snack', name: 'Trail Snack', desc: 'Walk 30% faster', cost: 4, effect: 'speed', amount: 1.3, icon: 'sneaker' },
    { id: 'peptalk', name: 'Pep Talk', desc: 'Climbs and pull-ups 60% faster', cost: 4, effect: 'quick', amount: 1.6, icon: 'lightning' },
    { id: 'settleall', name: 'Settle All', desc: 'Every pet at your Haven settles in right now', cost: 6, effect: 'settleall', amount: 1, icon: 'heart' },
    { id: 'skip', name: 'Skip to Next Camp', desc: 'Warp up to the next camp together', cost: 8, effect: 'skip', amount: 1, icon: 'flag' },
    { id: 'gems1', name: 'Gem Pouch', desc: '15 minutes of your Haven’s gems', cost: 5, effect: 'gems', amount: 15, icon: 'gift' },
    { id: 'gems2', name: 'Gem Sack', desc: '45 minutes of your Haven’s gems', cost: 10, effect: 'gems', amount: 45, icon: 'gift' },
    { id: 'gems3', name: 'Gem Chest', desc: '2 hours of your Haven’s gems', cost: 20, effect: 'gems', amount: 120, icon: 'gift' },
    { id: 'golden', name: 'Golden Outfit', desc: 'A shining gold outfit for your partner', cost: 25, effect: 'outfit', amount: 'golden', icon: 't-shirt' }
  ]
});
</script>
</body>
