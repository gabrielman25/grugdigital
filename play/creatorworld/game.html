<!--
  CREATOR WORLD · play/creatorworld/ (built from the Grug kit's top-down starter, template/game-topdown.html)
  The world a creator's link opens straight into: links/page/#c=<setup> hosts this file (it is not listed in the Games
  library). The setup rides in this page's address too (game.html#c=<setup>, see CREATOR below):
    - a lobby with the creator's name over a billboard, and one room per social (X, Instagram, YouTube, TikTok, Twitch,
      Discord, a website), each with a glowing pad under an arch in that social's colour. Step on a pad: a card asks
      before opening the social in a new tab. Links (top right) lists them all, with "Take me there".
    - world style c / a / b: Cozy Cabin, Neon Arcade, Sunny Boardwalk (blocks, floors and props per room).
    - mode h = just the hub; mode p = the hub with a coin rush attached (the clock starts when you first move, power-ups
      are bought with Pearls through the host, the score goes out with Bridge.score()).
    - the player is their own Grug avatar; three fans (female avatars) wander; a few real members of the Grug Discord
      sit and wander as block figures (GK.npcs, assets/gamekit.js).
  Kit sections, top to bottom: 1 SETTINGS (+ CREATOR), 2 BRIDGE, 3 AVATARS (as in the kit), 4 WORLD + INPUT (the kit's,
  plus the creator world builder and world tags), 5 GAME, 6 SCREENS.
  Art: kit block atlas and stud normal maps, Fredoka (OFL), @icons by Valentin Fossati (MIT).

:root{--ink:#111827;--mut:#6b7280;--bg:#ffffff;--card:#ebedf2;--card2:#dde0e8;
  --green:#10b981;--sky:#0ea5e9;--violet:#7c3aed;--amber:#f59e0b;--rose:#f43f5e;--orange:#f97316;--indigo:#6366f1;--teal:#14b8a6;
  --font:"Fredoka","Arial Rounded MT Bold",system-ui,-apple-system,"Segoe UI",sans-serif;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--sal:env(safe-area-inset-left);--sar:env(safe-area-inset-right)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0e14;color:var(--ink);font:600 16px/1.35 var(--font);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none}
canvas#view{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;pointer-events:none}
.ui>*{pointer-events:auto}
.vi{display:inline-block;vertical-align:middle;flex:none}
[hidden]{display:none!important}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
.tl{position:absolute;top:calc(var(--sat) + 12px);left:calc(var(--sal) + 12px);display:flex;flex-direction:column;gap:8px;align-items:flex-start;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;background:#fff;font-weight:700;font-size:19px;color:var(--ink);line-height:1;white-space:nowrap}
.pill .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff}.pill .ic .vi{width:18px;height:18px}
.pill small{font-weight:600;color:var(--mut);font-size:14px}
.pill .bar{display:inline-block;width:70px;height:8px;border-radius:9px;background:var(--card2);overflow:hidden}.pill .bar i{display:block;height:100%;background:var(--violet)}
.tc{position:absolute;top:calc(var(--sat) + 12px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.clock{padding:8px 18px;border-radius:999px;background:#fff;font-size:24px;font-weight:700;display:flex;align-items:center;gap:10px;white-space:nowrap}
.clock small{font-size:15px;color:var(--mut)}
.chip{padding:5px 14px;border-radius:999px;color:#fff;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.chip .vi{width:15px;height:15px}
.room{font-size:14px;color:#fff;background:rgba(17,24,39,.55);padding:3px 10px;border-radius:999px}
.tr{position:absolute;top:calc(var(--sat) + 12px);right:calc(var(--sar) + 12px);display:grid;grid-template-columns:repeat(2,58px);gap:8px;pointer-events:auto}
.hb{position:relative;width:58px;height:58px;border-radius:18px;padding:0;min-height:0;background:#fff;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700}
.hb .t{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff}.hb .t .vi{width:17px;height:17px}
.hb em{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--rose);color:#fff;font:700 13px/22px var(--font);font-style:normal}
.feed{position:absolute;left:calc(var(--sal) + 12px);top:calc(var(--sat) + 130px);display:flex;flex-direction:column;gap:6px;max-width:min(320px,60vw);pointer-events:none}
.fd{padding:7px 12px;border-radius:14px;background:#fff;font-size:14px;transition:opacity .6s}.fd.out{opacity:0}.fd.bad{background:#ffe4e6}.fd.good{background:#d1fae5}.fd.hero{background:#e0f2fe}
/* action buttons */
.acts{position:fixed;right:calc(var(--sar) + 16px);bottom:calc(var(--sab) + 18px);display:flex;flex-direction:column;align-items:flex-end;gap:12px;pointer-events:none}
.acts .row{display:flex;gap:12px;align-items:flex-end}
.ab{pointer-events:auto;width:74px;height:74px;border-radius:50%;padding:0;min-height:0;background:#fff;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;font-weight:700;position:relative;overflow:hidden}
.ab .vi{width:28px;height:28px}
.ab.big{width:92px;height:92px}.ab.big .vi{width:36px;height:36px}
.ab.on{color:#fff}
.ab .cd{position:absolute;inset:0;background:conic-gradient(rgba(17,24,39,.55) var(--p,0%),transparent 0);pointer-events:none}
.ab kbd{position:absolute;top:8px;font:700 11px var(--font);color:var(--mut)}
body.touch .ab kbd{display:none}
.prompt{position:fixed;left:50%;bottom:calc(var(--sab) + 120px);transform:translateX(-50%);padding:10px 18px;border-radius:16px;background:#fff;font-weight:700;font-size:18px;white-space:nowrap;display:none;align-items:center;gap:10px;cursor:pointer}
.prompt.on{display:flex}
.prompt .pbar{display:block;width:180px;height:10px;border-radius:9px;background:var(--card2);overflow:hidden;margin-top:6px;font-style:normal}.prompt .pbar b{display:block;height:100%;background:var(--green)}
.prompt kbd{display:inline-block;min-width:26px;padding:2px 7px;border-radius:8px;background:var(--ink);color:#fff;font:700 15px var(--font);text-align:center}
body.touch .prompt kbd{display:none}
.stick{position:fixed;width:124px;height:124px;border-radius:50%;border:3px solid #ffffffaa;background:#ffffff33;transform:translate(-50%,-50%);pointer-events:none;display:none}
.stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#fff}
.hint{position:fixed;left:50%;bottom:calc(var(--sab) + 16px);transform:translateX(-50%);font-size:14px;color:#fff;background:rgba(17,24,39,.55);padding:4px 12px;border-radius:999px;pointer-events:none;white-space:nowrap}
body.touch .hint{display:none}
/* world tags */
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;will-change:transform;pointer-events:none;display:flex;flex-direction:column;align-items:center;transform-origin:50% 100%}
.tag .nm{padding:3px 10px;border-radius:999px;background:#fff;font-size:14px;font-weight:700;white-space:nowrap}
.tag .nm.gold{background:#fde68a}
.tag .big{padding:6px 14px;border-radius:14px;background:#fff;font-size:16px;font-weight:700;white-space:nowrap;text-align:center;line-height:1.15}.tag .big small{display:block;font-size:13px;color:var(--mut);font-weight:600}
.tag .shopTag{display:flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border-radius:999px;background:#fff;white-space:nowrap;line-height:1.1}.tag .shopTag .t{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff}.tag .shopTag .t .vi{width:22px;height:22px}
.tag .shopTag b{display:block;font-size:18px}.tag .shopTag small{display:block;font-size:13px;color:var(--mut);font-weight:600}.tag .shopTag.near{outline:4px solid #10b981}
.tag .mk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff}.tag .mk .vi{width:18px;height:18px}
/* banners, toasts, role card */
.banner{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%);padding:16px 28px;border-radius:24px;background:#fff;font-size:32px;font-weight:700;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap}
.banner small{display:block;font-size:17px;color:var(--mut);font-weight:600}
.banner.on{opacity:1}.banner.good{color:#047857}.banner.bad{color:#be123c}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 120px);transform:translateX(-50%);padding:12px 18px;border-radius:16px;background:var(--ink);color:#fff;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;z-index:9}
body.menu-open .toast{top:auto;bottom:calc(var(--sab) + 18px)}
.toast.on{opacity:1}.toast.good{background:var(--green)}.toast.bad{background:var(--rose)}
.rolecard{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);width:min(440px,calc(100% - 32px));padding:28px 24px;border-radius:28px;background:#fff;text-align:center;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
.rolecard.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.rolecard .tile{margin:0 auto 10px}
.rolecard h2{margin:0;font-size:40px;line-height:1.1}.rolecard p{margin:10px 0 0;font-size:18px;color:#374151}.rolecard small{display:block;margin-top:12px;color:var(--mut);font-size:15px}
.cross{position:fixed;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;pointer-events:none;display:none}
/* menus: white panel, off-white cards, game blurred behind */
#veil{position:fixed;inset:0;display:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);background:rgba(10,12,20,.35);pointer-events:none}
body.menu-open #veil{display:block}
.sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(600px,calc(100% - 32px));max-height:calc(100% - 32px - var(--sat) - var(--sab));overflow:auto;padding:0 0 24px;border-radius:28px;background:var(--bg);touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet.wide{width:min(820px,calc(100% - 32px))}
.top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:14px;padding:20px 22px;background:#fff;border-bottom:2px solid #f1f2f6}
.top h1{margin:0;font-size:32px;line-height:1.05}.top small{display:block;font-size:15px;color:var(--mut)}
.body{padding:4px 22px 0}
.lead{font-size:18px;color:#374151;margin:18px 0 4px}
.tile{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;flex:none;color:#fff}.tile .vi{width:28px;height:28px}
.tile.big{width:64px;height:64px;border-radius:18px}.tile.big .vi{width:34px;height:34px}
.h{margin:28px 0 14px;font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}.h small{letter-spacing:0;text-transform:none;font-size:14px;color:#9ca3af;margin-left:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px;margin:20px 0 0}
.stat{background:var(--card);border-radius:20px;padding:16px;text-align:center}.stat b{display:block;font-size:26px;line-height:1.1}.stat small{display:block;font-size:14px;color:var(--mut);margin-top:3px}
.items{display:grid;gap:14px}
.item{display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;background:var(--card);border:2px solid var(--card)}
.item.on{border-color:var(--green)}
.item .txt{flex:1;min-width:0}.item b{display:block;font-size:19px}.item small{display:block;font-size:14px;color:var(--mut);margin-top:3px}
.btns{display:flex;gap:8px;flex:none;flex-wrap:wrap;justify-content:flex-end}

<!-- Grug site-wide layer: UI size, centred hints, tutorials, the ambient Discord NPCs (assets/gamekit.js) -->
<script src="../../assets/gamekit.js"></script>
<script>
'use strict';
/* =====================================================================================
   1. SETTINGS
   ===================================================================================== */
const SETTINGS = {
  title: 'Creator World',
  version: 'v1',
  tagline: 'Walk into a room to visit each of your favourite creator’s socials.',
  runSeconds: 90,                      // one coin rush (the app's runSeconds overrides this)
  collectible: 'coins',
  botSeed: 'creator',                  // set from the creator's name below, so each world has its own fans
  bots: 3,                             // fans wandering the rooms (all female avatars)
  // The Store (hub + game only). The host page (links/page/) sends its own shop, paid with Pearls. Effects (one run each):
  //   speed (move x amount) · double (coins x amount) · time (+amount seconds) · magnet (coins fly to you)
  demoShop: [
    { id: 'speed', name: 'Sprint Shoes', desc: 'Run 35% faster', cost: 5, effect: 'speed', amount: 1.35, icon: 'boots' },
    { id: 'double', name: 'Double Coins', desc: 'Every coin counts twice', cost: 8, effect: 'double', amount: 2, icon: 'coins' },
    { id: 'time', name: 'Extra Time', desc: '+15 seconds', cost: 4, effect: 'time', amount: 15, icon: 'stopwatch' },
    { id: 'magnet', name: 'Coin Magnet', desc: 'Coins fly to you', cost: 6, effect: 'magnet', amount: 1, icon: 'magnet' }
  ],
  demoPoints: 30,
  runtime: ['../../assets/sandy-runtime.js', '../vendor/sandy-runtime.js', 'https://gabrielman25.github.io/grugdigital/assets/sandy-runtime.js']
};

/* ---- the creator: their setup rides in this page's address, game.html#c=<setup>[&preview=1]
   Same format as the follower link (links/page/#c=…, assets/links.js on the site):
     setup = base64url(UTF-8 of '1~<name>~<RRGGBB>~<mode>~<world>~<p:handle>|<p:handle>…')
       mode   h = just the hub · p = the hub with a coin rush attached (old links: g / l = the hub)
       world  c Cozy Cabin · a Neon Arcade · b Sunny Boardwalk
   Only handles are stored, and every link is rebuilt here from a cleaned handle, so a button always goes where its label says.
   With no setup (opened on its own) the world shows a sample creator. ---- */
const CREATOR = (() => {
  const P = {
    x: { label: 'X', badge: 'X', color: '#2B2B33', ink: '#FFFFFF', url: h => 'https://x.com/' + h, show: h => '@' + h },
    ig: { label: 'Instagram', badge: 'IG', color: '#E1306C', ink: '#FFFFFF', url: h => 'https://www.instagram.com/' + h, show: h => '@' + h },
    yt: { label: 'YouTube', badge: 'YT', color: '#FF3B3B', ink: '#FFFFFF', url: h => 'https://www.youtube.com/@' + h, show: h => '@' + h },
    tt: { label: 'TikTok', badge: 'TT', color: '#25F4EE', ink: '#1E1B16', url: h => 'https://www.tiktok.com/@' + h, show: h => '@' + h },
    tw: { label: 'Twitch', badge: 'TV', color: '#9146FF', ink: '#FFFFFF', url: h => 'https://www.twitch.tv/' + h, show: h => h },
    dc: { label: 'Discord', badge: 'DC', color: '#5865F2', ink: '#FFFFFF', url: h => 'https://discord.gg/' + h, show: h => 'discord.gg/' + h },
    web: { label: 'Website', badge: 'WWW', color: '#4FD8C4', ink: '#1E1B16', url: h => 'https://' + h, show: h => h.replace(/\/$/, '') }
  };
  const b64d = s => decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4))));
  function clean(p, h) {
    h = String(h || '').trim();
    if (p === 'web') { h = h.replace(/^https?:\/\//i, '').replace(/[~|\s<>"'`\\]/g, '').slice(0, 80); return /^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+(\/.*)?$/.test(h) ? h : ''; }
    return h.replace(/^https?:\/\/[^/]+\//i, '').replace(/^@/, '').replace(/[/?#].*$/, '').replace(/[^A-Za-z0-9._-]/g, '').slice(0, 40);
  }
  function decode(c) {
    try {
      const p = b64d(String(c || '')).split('~'); if (p[0] !== '1' || p.length < 6) return null;
      const seen = new Set(), links = p.slice(5).join('~').split('|').filter(Boolean).map(x => { const i = x.indexOf(':'); return { p: x.slice(0, i), h: clean(x.slice(0, i), x.slice(i + 1)) }; })
        .filter(l => P[l.p] && l.h && !seen.has(l.p) && seen.add(l.p)).slice(0, 7);
      if (!links.length) return null;
      const col = String(p[2] || '');
      return { n: String(p[1] || '').replace(/[~|\s]+/g, ' ').trim().slice(0, 28) || 'My links', color: /^[0-9a-f]{6}$/i.test(col) ? '#' + col.toUpperCase() : '#5AB0FF',
        mode: p[3] === 'p' ? 'p' : 'h', world: /^[cab]$/.test(p[4]) ? p[4] : 'c', links };
    } catch (e) { return null; }
  }
  const q = new URLSearchParams(location.hash.slice(1));
  let cfg = decode(q.get('c')); const sample = !cfg;
  if (!cfg) cfg = { n: '@grugdigital', color: '#5AB0FF', mode: 'p', world: 'c', links: [{ p: 'ig', h: 'grugdigital' }, { p: 'yt', h: 'grugdigital' }, { p: 'tt', h: 'grugdigital' }] };
  const lum = hex => { const v = parseInt(hex.slice(1), 16), c = [v >> 16 & 255, v >> 8 & 255, v & 255].map(x => { x /= 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; };
  const host = u => { try { return new URL(u).host.replace(/^www\./, ''); } catch (e) { return u; } };
  const links = cfg.links.map(l => { const D = P[l.p], url = D.url(l.h); return { p: l.p, label: D.label, badge: D.badge, color: D.color, ink: D.ink, handle: D.show(l.h), url, host: host(url) }; });
  return Object.assign(cfg, { links, sample, preview: q.get('preview') === '1', game: cfg.mode === 'p', ink: lum(cfg.color) > 0.45 ? '#1E1B16' : '#FFFFFF', initial: (cfg.n.replace(/^@/, '').charAt(0) || '?').toUpperCase() });
})();
SETTINGS.title = CREATOR.n + '’s world';
SETTINGS.botSeed = 'cw-' + CREATOR.n.toLowerCase();


/* =====================================================================================
   2. BRIDGE · the rewards app protocol (window.postMessage, every message carries rw:1)
     game → app  {t:'hello'}                ← {t:'state', points, pearls?, pearlName?, inv, best, runs, shop, title, collectible, runSeconds, brand, store, avatar?, player?}
                 {t:'buy', id, req}         ← {t:'reply', req, ok, reason?, state}   app takes points/Pearls, adds 1 to inv[id]
                 {t:'use', ids:[…], req}    ← {t:'reply', req, ok, reason?, state}   removes 1 of each (the run has started)
                 {t:'score', score, beans, level?}   the app keeps the best score and counts the run
                 {t:'needPearls', id}       the app offers to sell Pearls and returns the player to the game
     app → game  {t:'pause'} when the player leaves the Game tab; a fresh {t:'state'} whenever points change.
   On its own (no app answers within 1.5 s) the game runs in demo mode with pretend points saved on this device.
   ===================================================================================== */
const Bridge = (() => {
  const embedded = window.parent && window.parent !== window;
  const DEMO_KEY = 'grug-starter-demo:' + SETTINGS.title;
  let state = null, mode = 'pending', reqN = 0; const waiting = new Map(), listeners = [];
  const post = m => { try { window.parent.postMessage(Object.assign({ rw: 1 }, m), '*'); } catch (e) {} };
  const demoLoad = () => { let d = null; try { d = JSON.parse(localStorage.getItem(DEMO_KEY) || 'null'); } catch (e) {}
    return Object.assign({ points: SETTINGS.demoPoints, inv: {}, best: 0, runs: 0 }, d || {}); };
  const demoSave = () => { try { localStorage.setItem(DEMO_KEY, JSON.stringify({ points: state.points, inv: state.inv, best: state.best, runs: state.runs })); } catch (e) {} };
  function setState(s) { state = Object.assign({ points: 0, pearls: 0, inv: {}, best: 0, runs: 0, shop: SETTINGS.demoShop }, s || {}); if (!Array.isArray(state.shop) || !state.shop.length) state.shop = SETTINGS.demoShop; listeners.forEach(f => f(state)); }
  addEventListener('message', e => {
    const d = e.data; if (!d || d.rw !== 1 || e.source !== window.parent) return;
    if (d.t === 'state') { mode = 'live'; const { t, rw, ...s } = d; setState(s); }
    else if (d.t === 'reply') { if (d.state) setState(d.state); const w = waiting.get(String(d.req)); if (w) { waiting.delete(String(d.req)); w(d); } }
    else if (d.t === 'pause') { listeners.forEach(f => f(state, 'pause')); }
  });
  function ask(m) { const req = String(++reqN); return new Promise((ok, no) => { waiting.set(req, ok); post(Object.assign({ req }, m)); setTimeout(() => { if (waiting.delete(req)) no(new Error('no answer')); }, 6000); }); }
  function start() {
    if (embedded) post({ t: 'hello' });
    setTimeout(() => { if (mode === 'pending') { mode = 'demo'; setState(Object.assign({ demo: true }, demoLoad())); } }, embedded ? 1500 : 0);
  }
  const wallet = () => (state ? (+state.points || 0) + (+state.pearls || 0) : 0);
  async function buy(id) {
    const it = (state.shop || []).find(x => x.id === id); if (!it) return { ok: false, reason: 'Not in the shop.' };
    if (wallet() < it.cost) {
      if (mode === 'live' && state.pearlName) { post({ t: 'needPearls', id }); return { ok: false, reason: '', asked: true }; }
      return { ok: false, reason: 'You need ' + (it.cost - wallet()) + ' more points for ' + it.name + '.' };
    }
    if (mode === 'demo') { state.points -= it.cost; state.inv[id] = (state.inv[id] || 0) + 1; demoSave(); setState(state); return { ok: true }; }
    return ask({ t: 'buy', id });
  }
  async function use(ids) {
    if (!ids.length) return { ok: true };
    if (mode === 'demo') { for (const id of ids) { if (!(state.inv[id] > 0)) return { ok: false, reason: 'Out of that power-up.' }; } ids.forEach(id => { state.inv[id]--; if (!state.inv[id]) delete state.inv[id]; }); demoSave(); setState(state); return { ok: true }; }
    return ask({ t: 'use', ids });
  }
  function score(score, beans, level) {
    if (mode === 'demo') { state.runs++; state.best = Math.max(state.best, score); demoSave(); setState(state); return; }
    post({ t: 'score', score: Math.floor(score), beans: Math.floor(beans || 0), level: level || 0 });
  }
  return { start, buy, use, score, on: f => listeners.push(f), get state() { return state; }, get mode() { return mode; }, wallet };
})();

/* =====================================================================================
   3. AVATARS · the site's 3D avatar runtime (three.js r149 + SandyKit, ~15 MB, cached by the browser)
   - The player wears the look saved by the Grug avatar editor on this phone (localStorage 'grug.sandy.v1').
   - Every bot is a female Sandy: SandyKit.randomConfig(seed, {body:'female'}).
   - Keep the scene in her own units: 1 unit = 1 cm (she is ~170 cm tall). Her hair breaks at tiny scales, so
     never shrink her to fit a world in metres; size the world in cm instead.
   ===================================================================================== */
const Avatars = (() => {
  let K = null;
  function loadOne(src) { return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = () => window.SandyKit ? ok(window.SandyKit) : no(new Error('no SandyKit')); s.onerror = () => { s.remove(); no(new Error('failed ' + src)); }; document.head.appendChild(s); }); }
  async function load() {
    if (window.SandyKit) return (K = window.SandyKit);
    for (const src of SETTINGS.runtime) { try { return (K = await loadOne(src)); } catch (e) {} }
    throw new Error('Avatar runtime not found');
  }
  function playerConfig() { let c = null; try { c = JSON.parse(localStorage.getItem('grug.sandy.v1') || 'null'); } catch (e) {} return K.merge(K.DEFAULT, c && typeof c === 'object' ? c : {}); }
  function botConfig(i, shirt) { const c = K.randomConfig(SETTINGS.botSeed + '-' + i, { body: 'female' }); c.weapon = null; if (shirt) { c.top = null; c.legs = null; c.outfit = Object.assign({}, c.outfit, { shirt, shorts: '#24262b' }); } return c; }
  return { load, playerConfig, botConfig, get K() { return K; } };
})();

   not two prop parts, not a prop and a block. Shapes may touch (share a face plane facing opposite ways), never

/* ---------------- maps ----------------
   Every round map is a grid of rooms with knee-high walls (1 block). Each room is joined to at least 2 others by wide
   doorways, so there are loops everywhere and no dead ends. Rooms are furnished by type; a prop only goes in if every
   doorway of its room can still reach every other one. */
const W2R = { n: 0, s: 2, w: 3, e: 1 };   // turn a prop so its back (local -z) is against that wall
function roomGrid(L, o) {
  const rng = o.rng, ri = (a, b) => a + Math.floor(rng() * (b - a + 1));
  const { gw, gh, cell } = o, NX = L.NX;
  // floor and walls
  for (let z = 0; z < L.NZ; z++) for (let x = 0; x < L.NX; x++) {
    const onWall = x % cell === 0 || z % cell === 0;
    L.set(x, 0, z, o.floorOut(x, z));
    if (onWall) L.set(x, 1, z, o.wall(x, z));
  }
  const rooms = [];
  for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++) rooms.push({ i, j, x0: i * cell + 1, z0: j * cell + 1, x1: i * cell + cell - 1, z1: j * cell + cell - 1, doors: [], adj: [] });
  // every grid link, then cut some while every room keeps 2+ doors and the map stays in one piece
  let edges = []; const id = (i, j) => j * gw + i;
  for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++) { if (i < gw - 1) edges.push([id(i, j), id(i + 1, j)]); if (j < gh - 1) edges.push([id(i, j), id(i, j + 1)]); }
  const deg = a => edges.filter(e => e[0] === a || e[1] === a).length;
  const connected = es => { const seen = new Set([0]), st = [0]; while (st.length) { const a = st.pop(); for (const [p, q] of es) { const b = p === a ? q : q === a ? p : -1; if (b >= 0 && !seen.has(b)) { seen.add(b); st.push(b); } } } return seen.size === rooms.length; };
  for (let t = 0, cut = 0; t < 200 && cut < (o.cut || 3); t++) {
    const e = edges[ri(0, edges.length - 1)]; if (deg(e[0]) <= 2 || deg(e[1]) <= 2) continue;
    const rest = edges.filter(x => x !== e); if (!connected(rest)) continue; edges = rest; cut++;
  }
  // doorways: 3 wide (sometimes 5), never near a corner
  for (const [a, b] of edges) {
    const A = rooms[a], Bm = rooms[b], horiz = Bm.i !== A.i, w = rng() < 0.3 ? 5 : 3, span = cell - 1, off = ri(2, span - w - 1);
    const cells = [];
    for (let k = 0; k < w; k++) {
      const x = horiz ? A.x1 + 1 : A.x0 + off + k, z = horiz ? A.z0 + off + k : A.z1 + 1;
      L.set(x, 1, z, 0); L.set(x, 0, z, o.doorFloor(x, z)); cells.push([x, z]);
    }
    const D = { a, b, cells, horiz, cx: (cells[0][0] + cells[w - 1][0] + 1) / 2 * BS, cz: (cells[0][1] + cells[w - 1][1] + 1) / 2 * BS };
    L.doors.push(D); A.doors.push(D); Bm.doors.push(D); A.adj.push(b); Bm.adj.push(a);
    if (o.doorPost) for (const [x, z] of [horiz ? [cells[0][0], cells[0][1] - 1] : [cells[0][0] - 1, cells[0][1]], horiz ? [cells[w - 1][0], cells[w - 1][1] + 1] : [cells[w - 1][0] + 1, cells[w - 1][1]]]) o.doorPost(x, z);
  }
  rooms.forEach((R, i) => { for (let z = R.z0; z <= R.z1; z++) for (let x = R.x0; x <= R.x1; x++) L.roomOf[z * NX + x] = i; });
  L.rooms = rooms;
  // vents: little crawl holes in the walls between neighbouring rooms (only someone knocked down fits through)
  const nearDoor = (x, z) => L.doors.some(D => D.cells.some(([a, b]) => Math.abs(a - x) + Math.abs(b - z) <= 2));
  const pairs = []; for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++) { if (i < gw - 1) pairs.push([id(i, j), id(i + 1, j), true]); if (j < gh - 1) pairs.push([id(i, j), id(i, j + 1), false]); }
  let vn = 0; for (const [a, b, horiz] of shuffle(rng, pairs)) {
    if (vn >= (o.vents || 7)) break; const A = rooms[a];
    for (let t = 0; t < 6; t++) {
      const k = ri(2, cell - 3), x = horiz ? A.x1 + 1 : A.x0 + k, z = horiz ? A.z0 + k : A.z1 + 1;
      if (nearDoor(x, z) || L.ventSet.has(z * NX + x) || [[x + 1, z], [x - 1, z], [x, z + 1], [x, z - 1]].some(([q, w]) => L.ventSet.has(w * NX + q))) continue;
      L.set(x, 1, z, 0); L.set(x, 0, z, 'ironTile'); L.ventSet.add(z * NX + x); L.vents = L.vents || []; L.vents.push({ x, z, a, b });
      L.prop(PROPS.vent(), x, z, horiz ? 1 : 0, { walk: true, name: 'vent' }); vn++; break;
    }
  }
  return rooms;
}

/* a room furnisher: keeps track of what's taken and refuses anything that would cut the room's doorways apart */
function furnisher(L, R, rng) {
  const W = R.x1 - R.x0 + 1, H = R.z1 - R.z0 + 1, occ = new Uint8Array(W * H), at = (x, z) => (z - R.z0) * W + (x - R.x0);
  const inR = (x, z) => x >= R.x0 && x <= R.x1 && z >= R.z0 && z <= R.z1;
  // keep the squares in front of every doorway clear, two deep
  const entries = [];
  for (const D of R.doors) for (const [x, z] of D.cells) for (let k = 1; k <= 2; k++) for (const s of [-1, 1]) {
    const xx = D.horiz ? x + s * k : x, zz = D.horiz ? z : z + s * k; if (inR(xx, zz)) { occ[at(xx, zz)] = 2; if (k === 1) entries.push([xx, zz]); }
  }
  const ok = () => {   // all entries reach each other over free cells
    if (entries.length < 2) return true;
    const seen = new Uint8Array(W * H), st = [entries[0]]; seen[at(...entries[0])] = 1;
    while (st.length) { const [x, z] = st.pop(); for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const xx = x + dx, zz = z + dz; if (!inR(xx, zz)) continue; const k = at(xx, zz); if (seen[k] || occ[k] === 1) continue; seen[k] = 1; st.push([xx, zz]); } }
    return entries.every(e => seen[at(...e)]);
  };
  const footprint = (parts, cx, cz, r, ox, oz) => {
    const tr = (x, z) => r === 0 ? [x, z] : r === 1 ? [-z, x] : r === 2 ? [-x, -z] : [z, -x];
    let X0 = 1e9, X1 = -1e9, Z0 = 1e9, Z1 = -1e9;
    for (const p of parts) { const a = tr(p.x0, p.z0), b = tr(p.x1, p.z1); X0 = Math.min(X0, a[0], b[0]); X1 = Math.max(X1, a[0], b[0]); Z0 = Math.min(Z0, a[1], b[1]); Z1 = Math.max(Z1, a[1], b[1]); }
    const wx = (cx + 0.5) * BS + (ox || 0), wz = (cz + 0.5) * BS + (oz || 0), cells = [];
    for (let z = Math.floor((wz + Z0 + 1) / BS); z <= Math.floor((wz + Z1 - 1) / BS); z++) for (let x = Math.floor((wx + X0 + 1) / BS); x <= Math.floor((wx + X1 - 1) / BS); x++) cells.push([x, z]);
    return cells;
  };
  const F = {
    R, rng, W, H,
    free(x, z) { return inR(x, z) && occ[at(x, z)] === 0; },
    // a prop; o.walk props (rugs) don't block, o.ox/oz shift it (cm)
    put(parts, cx, cz, r, o) {
      o = o || {}; r = r || 0; const cells = footprint(parts, cx, cz, r, o.ox, o.oz);
      if (!cells.every(([x, z]) => inR(x, z) && occ[at(x, z)] === 0)) return false;
      if (!o.walk) { cells.forEach(([x, z]) => occ[at(x, z)] = 1); if (!ok()) { cells.forEach(([x, z]) => occ[at(x, z)] = 0); return false; } }
      else cells.forEach(([x, z]) => occ[at(x, z)] = 3);
      L.prop(parts, cx, cz, r, Object.assign({ at: (o.ox || o.oz) ? [(cx + 0.5) * BS + (o.ox || 0), (cz + 0.5) * BS + (o.oz || 0)] : null }, o));
      return true;
    },
    // a column of blocks
    col(x, z, list) { if (!F.free(x, z)) return false; occ[at(x, z)] = 1; if (!ok()) { occ[at(x, z)] = 0; return false; } list.forEach((b, i) => L.set(x, i + 1, z, b)); return true; },
    // a prop with its back to a wall: side n/s/w/e, t = 0..1 along the wall
    wall(side, t, parts, o) {
      const x = side === 'w' ? R.x0 : side === 'e' ? R.x1 : Math.round(R.x0 + t * (W - 1)), z = side === 'n' ? R.z0 : side === 's' ? R.z1 : Math.round(R.z0 + t * (H - 1));
      return F.put(parts, x, z, W2R[side], o);
    },
    // try a few random free spots
    scatter(n, partsFn, o) { let k = 0; for (let t = 0; t < n * 12 && k < n; t++) { const x = R.x0 + 1 + Math.floor(rng() * (W - 2)), z = R.z0 + 1 + Math.floor(rng() * (H - 2)); if (F.put(partsFn(), x, z, Math.floor(rng() * 4), o)) k++; } return k; },
    mid: () => [Math.floor((R.x0 + R.x1) / 2), Math.floor((R.z0 + R.z1) / 2)],
    floor(fn) { for (let z = R.z0; z <= R.z1; z++) for (let x = R.x0; x <= R.x1; x++) { const b = fn(x, z); if (b) L.set(x, 0, z, b); } },
    tree(x, z, kind) {   // a voxel tree: trunk 3 high, leaves on top (the canopy is above head height)
      if (!F.col(x, z, [kind === 'pine' ? 'spruceLog' : kind === 'birch' ? 'birchLog' : 'oakLog', kind === 'pine' ? 'spruceLog' : kind === 'birch' ? 'birchLog' : 'oakLog', kind === 'pine' ? 'spruceLog' : kind === 'birch' ? 'birchLog' : 'oakLog'])) return false;
      const lf = kind === 'pine' ? 'pineLeaves' : 'oakLeaves';
      for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) { const xx = x + dx, zz = z + dz; if (!(dx || dz)) { L.set(xx, 4, zz, lf); continue; } if (inR(xx, zz)) { L.set(xx, 3, zz, lf); if (!(dx && dz)) L.set(xx, 4, zz, lf); } }
      return true;
    }
  };

    else if (d.open) open(d.open);
    else if (d.again !== undefined) { close(); Game.newRun(); }
    else if (d.lobby !== undefined) { close(); Game.toLobby(false); }
    else if (d.goto) { close(); Game.goTo(+d.goto); }
    else if (d.gfx) { View.set('quality', d.gfx); render(); }
    else if (d.sharp) { View.set('sharp', +d.sharp); render(); }
    else if (d.sel) { if (Game.G.running) { b.disabled = true; await Game.useNow(d.sel); } else Game.G.sel[d.sel] = !Game.G.sel[d.sel]; render(); }
    else if (d.buy) {
      b.disabled = true; const r = await Bridge.buy(d.buy);
      if (r.ok) { Sfx.play('buy'); if (Game.G.running) await Game.useNow(d.buy); else { Game.G.sel[d.buy] = true; toast('Added! It’s used when your next rush starts.', 'good'); } }
      else if (r.reason) toast(r.reason, 'bad');
      render();
    }
    else if (d.hb === 'pause') Game.togglePause(true);
    else if (d.hb === 'links') open('links');
    else if (d.hb === 'shop') open('shop');
  });
  Bridge.on(() => { if (sheet === 'shop' || sheet === 'results') render(); });
  function frame(dt) {
    if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').classList.remove('on'); }
    if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('banner').classList.remove('on'); }
    const G = Game.G, P = Game.player; if (!P || !G.L) return;
    const room = G.L.roomAt(P.x, P.z), roomTxt = room ? '<span class="room">' + esc(room.name) + '</span>' : '';
    const me = '<span class="me"><i style="background:' + CREATOR.color + ';color:' + CREATOR.ink + '">' + esc(CREATOR.initial) + '</i><span>' + esc(CREATOR.n) + '</span></span>';
    const links = hb('links', 'link', CREATOR.color, 'Links', CREATOR.ink), menu = hb('pause', 'pause', '#64748b', 'Menu');
    if (CREATOR.game) {
      const rush = G.running || G.waiting;
      set('hudTL', me + (rush ? '<span class="pill"><span class="ic" style="background:#eab308">' + vi('coins') + '</span>' + G.score + '</span>' : ''));
      set('hudTC', (rush ? '<div class="clock">' + vi('stopwatch', 22) + clockTxt(G.left) + (G.waiting ? '<small>Move to start</small>' : '') + '</div>' : '') + roomTxt);
      set('hudTR', hb('shop', 'shopping_bag', C.amber, 'Shop') + links + menu);
    } else { set('hudTL', me); set('hudTC', roomTxt); set('hudTR', links + menu); }
  }
  return { get sheet() { return sheet; }, closable, open, close, toast, banner, hud, paused, visit, frame, render };
})();


/* ---------- boot ---------- */
(async function boot() {
  const txt = t => { const el = document.getElementById('loadTxt'); if (el) el.textContent = t; };
  document.body.classList.toggle('touch', TOUCH); document.body.classList.toggle('preview', CREATOR.preview);   // the builder's small preview: just the world
  document.title = SETTINGS.title;
  const logo = document.getElementById('logo'); logo.style.background = CREATOR.color; logo.style.color = CREATOR.ink; logo.textContent = CREATOR.initial;
  document.getElementById('loadName').textContent = SETTINGS.title;
  try { await Avatars.load(); } catch (e) { console.warn('Avatars off:', e.message); }
  if (!window.THREE) { txt('This world needs the Grug avatar runtime (sandy-runtime.js).'); return; }
  makeRenderer(); bindInput();
  const img = new Image(); img.src = 'data:image/png;base64,' + ATLAS_B64; await img.decode(); prepAtlas(img); await loadNormals(); initMats();
  FX.init();
  await Game.setup(txt);
  Bridge.start();
  document.getElementById('loading').classList.add('done');
  UI.hud(true); Game.begin();
  window.READY = true;
  const tick = () => { const raw = clock.getDelta(), dt = Math.min(0.05, raw); Game.step(dt); UI.frame(dt); renderer.render(scene, camera); if (!Game.G.paused) View.tick(raw, clock.elapsedTime); requestAnimationFrame(tick); };
  tick();
})();
</script>
