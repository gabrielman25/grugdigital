<title>Chest Quest · Grug game</title>
<!--
  CHEST QUEST: a dungeon delve built on the Grug starter game.
  Go down floor after floor of a blocky dungeon. Pick the lock on every treasure chest on the floor, then run back to
  the stairs. Monsters can't be beaten: they chase you when they see you and give up about 2 seconds after you break
  line of sight. Sprint (1.5x, always faster than any monster) costs stamina; carry up to 3 items to help.
  Sections, top to bottom:
    1. SETTINGS         names, speeds, power-ups (the partner's app overrides the shop when embedded)
    2. BRIDGE           talks to the partner's rewards app (points, Pearls, power-ups, score). Unchanged from the kit.
    3. AVATARS          loads the site's 3D avatar runtime; the player wears their own look, the merchant is female. Unchanged.
    4. WORLD + INPUT    voxel dungeon (Take a Tea block textures, Minecraft-style block light), camera, keyboard / touch / gamepad
    5. GAME             floors, chests and lock checks, monsters, stamina, items, the merchant
    6. SCREENS          lobby (power-ups), HUD, merchant shop, floor cleared, results, pause (kit UI style)
  Runs on its own too (demo mode with pretend points).
-->

:root{--ink:#111827;--mut:#6b7280;--bg:#ffffff;--card:#ebedf2;--card2:#dde0e8;
  --green:#10b981;--sky:#0ea5e9;--violet:#7c3aed;--amber:#f59e0b;--rose:#f43f5e;--orange:#f97316;--indigo:#6366f1;--teal:#14b8a6;
  --font:"Fredoka","Arial Rounded MT Bold",system-ui,-apple-system,"Segoe UI",sans-serif;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--sal:env(safe-area-inset-left);--sar:env(safe-area-inset-right)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0e14;color:var(--ink);font:600 16px/1.35 var(--font);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none}
canvas#view{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;pointer-events:none}
.ui>*{pointer-events:auto}
.vi{display:inline-block;vertical-align:middle;flex:none}
/* HUD: white pills */
.hud{position:fixed;top:calc(var(--sat) + 12px);left:calc(var(--sal) + 12px);display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none;max-width:calc(100% - 200px)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;background:#fff;font-weight:700;font-size:20px;color:var(--ink);line-height:1}
.pill .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff}.pill .ic .vi{width:19px;height:19px}
.pill small{font-weight:600;color:var(--mut);font-size:14px}
.hearts{display:inline-flex;gap:3px;padding:7px 12px;color:var(--rose)}.hearts .vi{width:22px;height:22px}.hearts .vi.off{color:#d4d7df}
.hearts.hit{animation:hit .5s}
@keyframes hit{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#mapWrap{position:fixed;top:calc(var(--sat) + 12px);right:calc(var(--sar) + 12px);width:150px;height:150px;border-radius:22px;background:#fff;padding:6px;cursor:pointer}
#mapWrap.big{width:min(420px,calc(100vw - 24px),calc(100vh - 140px));height:min(420px,calc(100vw - 24px),calc(100vh - 140px))}
#map{width:100%;height:100%;border-radius:16px;display:block;background:#1a1d26}
.pause{position:fixed;top:calc(var(--sat) + 172px);right:calc(var(--sar) + 12px);width:52px;height:52px;border-radius:50%;border:0;background:#fff;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;min-height:0}
.pause .vi{width:22px;height:22px}
body.bigmap .pause{display:none}
/* bottom bar: stamina + item slots */
.bar{position:fixed;left:50%;bottom:calc(var(--sab) + 14px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.stam{width:min(330px,62vw);height:22px;border-radius:999px;background:#fff;padding:4px;position:relative}
.stam i{display:block;height:100%;border-radius:999px;background:var(--green);width:100%}
.stam i.boost{background:var(--sky)}.stam i.low{background:var(--amber)}.stam i.out{background:var(--rose)}
.stam b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:var(--ink);letter-spacing:.04em}
.slots{display:flex;gap:10px;pointer-events:auto}
.slot{width:64px;height:64px;border-radius:18px;background:#ffffffd9;border:0;padding:0;min-height:0;position:relative;display:grid;place-items:center;color:#fff}
.slot .tile{width:48px;height:48px;border-radius:14px}
.slot .tile .vi{width:26px;height:26px}
.slot kbd{position:absolute;left:5px;top:3px;font:700 12px var(--font);color:var(--mut)}
.slot.empty{background:#ffffff66}
.itip{position:fixed;left:0;top:0;display:none;max-width:240px;padding:10px 14px;border-radius:16px;background:#fff;color:var(--ink);pointer-events:none;z-index:4}
.itip b{display:block;font-size:17px}.itip span{display:block;font-size:14px;color:#374151;margin-top:2px}.itip small{display:block;font-size:13px;color:var(--mut);margin-top:4px}
.timers{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tmr{display:inline-flex;align-items:center;gap:5px;padding:4px 10px 4px 4px;border-radius:999px;background:#fff;font-size:14px;font-weight:700}
.tmr span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff}.tmr .vi{width:13px;height:13px}
/* action buttons (touch) */
.acts{position:fixed;right:calc(var(--sar) + 16px);bottom:calc(var(--sab) + 20px);display:none;flex-direction:column;align-items:flex-end;gap:12px;pointer-events:none}
body.touch.playing .acts{display:flex}
.ab{pointer-events:auto;width:84px;height:84px;border-radius:50%;padding:0;min-height:0;background:#fff;color:var(--ink);display:grid;place-items:center}
.ab .vi{width:34px;height:34px}
.ab.run{width:68px;height:68px}.ab.run .vi{width:28px;height:28px}
.ab.run.on{background:var(--green);color:#fff}
.ab.hot{background:var(--amber);color:#fff}
.prompt{position:fixed;left:50%;bottom:calc(var(--sab) + 140px);transform:translateX(-50%);padding:10px 18px;border-radius:16px;background:#fff;font-weight:700;font-size:18px;white-space:nowrap;pointer-events:none;display:none}
.prompt kbd{display:inline-block;min-width:26px;padding:2px 7px;margin-right:8px;border-radius:8px;background:var(--ink);color:#fff;font:700 15px var(--font);text-align:center}
body.touch .prompt kbd{display:none}
/* lock picking */
.pick{position:fixed;left:50%;bottom:calc(var(--sab) + 118px);transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.pick .pbar{width:220px;height:18px;border-radius:999px;background:#fff;padding:4px}
.pick .pbar i{display:block;height:100%;border-radius:999px;background:var(--amber);width:0}
.pick .lbl{padding:6px 14px;border-radius:999px;background:#fff;font-weight:700;font-size:16px}
#ring{width:150px;height:150px;pointer-events:auto;cursor:pointer;display:none}
.vign{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;box-shadow:inset 0 0 120px 40px rgba(244,63,94,.55)}
.vign.on{opacity:1}
.flash{position:fixed;inset:0;pointer-events:none;background:#f43f5e;opacity:0;transition:opacity .4s}
.banner{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);padding:14px 26px;border-radius:22px;background:#fff;font-size:28px;font-weight:700;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap}
.banner small{display:block;font-size:16px;color:var(--mut);font-weight:600}
.banner.on{opacity:1}
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;will-change:transform;pointer-events:none;display:flex;flex-direction:column;align-items:center}
.tag .bub{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:24px;line-height:1}
.tag .bub .vi{width:20px;height:20px}
.tag .nm{margin-top:4px;padding:3px 10px;border-radius:999px;background:#fff;font-size:14px;font-weight:700;white-space:nowrap}
.floater{position:fixed;left:0;top:0;pointer-events:none;font-weight:700;font-size:22px;color:#fde68a;white-space:nowrap;will-change:transform}
/* menus: white panel, off-white cards, game blurred behind */
#veil{position:fixed;inset:0;display:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);background:rgba(10,12,20,.35);pointer-events:none}
body.menu-open #veil{display:block}
.sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100% - 32px - var(--sat) - var(--sab));overflow:auto;padding:0 0 24px;border-radius:28px;background:var(--bg);touch-action:pan-y}
.top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:14px;padding:20px 22px;background:#fff;border-bottom:2px solid #f1f2f6}
.top h1{margin:0;font-size:32px;line-height:1.05}.top small{display:block;font-size:15px;color:var(--mut)}
.body{padding:4px 22px 0}
.lead{font-size:18px;color:#374151;margin:18px 0 4px}
.tile{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;flex:none;color:#fff}.tile .vi{width:28px;height:28px}
.tile.big{width:64px;height:64px;border-radius:18px}.tile.big .vi{width:34px;height:34px}
.h{margin:28px 0 14px;font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}.h small{letter-spacing:0;text-transform:none;font-size:14px;color:#9ca3af;margin-left:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px;margin:20px 0 0}
.stat{background:var(--card);border-radius:20px;padding:16px;text-align:center}.stat b{display:block;font-size:28px;line-height:1.1}.stat small{display:block;font-size:14px;color:var(--mut);margin-top:3px}
.items{display:grid;gap:14px}
.item{display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;background:var(--card);border:2px solid var(--card)}
.item.on{border-color:var(--green)}
.item .txt{flex:1;min-width:0}.item b{display:block;font-size:19px}.item small{display:block;font-size:14px;color:var(--mut);margin-top:3px}
.btns{display:flex;gap:8px;flex:none}
button{appearance:none;border:0;font:700 18px/1 var(--font);cursor:pointer;color:#fff;border-radius:14px;min-height:50px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--green)}
button .vi{width:20px;height:20px}
button:disabled{opacity:.5;cursor:default}button:active{transform:scale(.97)}
button.ghost{background:var(--card2);color:var(--ink)}button.dim{background:var(--card2);color:#9ca3af}
button.go{width:100%;min-height:68px;font-size:26px;border-radius:18px;margin-top:24px}button.go .vi{width:24px;height:24px}
button.go.ghost{min-height:56px;font-size:20px;margin-top:12px}
.x{width:50px;height:50px;min-height:0;padding:0;border-radius:50%;background:var(--card2);color:var(--ink);margin-left:auto}
.note{font-size:14px;color:#9ca3af;text-align:center;margin:18px 0 0}
.howto{display:grid;gap:10px;margin:16px 0 0}
.howto div{display:flex;gap:12px;align-items:center;font-size:16px;color:#374151}
.howto .tile{width:40px;height:40px;border-radius:12px}.howto .tile .vi{width:22px;height:22px}
.item.set{flex-wrap:wrap}.item.set .txt{min-width:170px}.seg{display:flex;gap:8px;flex-wrap:wrap}
.pillb{min-height:46px;min-width:64px;padding:0 16px;border-radius:999px;background:var(--card2);color:#374151;font-size:16px}.pillb.on{color:#fff}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 70px);transform:translateX(-50%);padding:12px 18px;border-radius:16px;background:var(--ink);color:#fff;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;z-index:5}
body.menu-open .toast{top:auto;bottom:calc(var(--sab) + 18px)}
.toast.on{opacity:1}.toast.good{background:var(--green)}.toast.bad{background:var(--rose)}
.stick{position:fixed;width:124px;height:124px;border-radius:50%;border:3px solid #ffffffaa;background:#ffffff33;transform:translate(-50%,-50%);pointer-events:none;display:none}
.stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#fff}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:#fff;color:var(--ink);font-size:22px;font-weight:700;transition:opacity .4s}
.loading.done{opacity:0;pointer-events:none}
[hidden]{display:none!important}

/* =====================================================================================
   2. BRIDGE · the rewards app protocol (window.postMessage, every message carries rw:1)
     game → app  {t:'hello'}                ← {t:'state', points, pearls?, pearlName?, inv, best, runs, shop, title, collectible, runSeconds, brand, store, avatar?, player?}
                 {t:'buy', id, req}         ← {t:'reply', req, ok, reason?, state}   app takes points/Pearls, adds 1 to inv[id]
                 {t:'use', ids:[…], req}    ← {t:'reply', req, ok, reason?, state}   removes 1 of each (the run has started)
                 {t:'score', score, beans, level?}   the app keeps the best score and counts the run
                 {t:'needPearls', id}       the app offers to sell Pearls and returns the player to the game
     app → game  {t:'pause'} when the player leaves the Game tab; a fresh {t:'state'} whenever points change.
   On its own (no app answers within 1.5 s) the game runs in demo mode with pretend points saved on this device.
   ===================================================================================== */
const Bridge = (() => {
  const embedded = window.parent && window.parent !== window;
  const DEMO_KEY = 'grug-starter-demo:' + SETTINGS.title;
  let state = null, mode = 'pending', reqN = 0; const waiting = new Map(), listeners = [];
  const post = m => { try { window.parent.postMessage(Object.assign({ rw: 1 }, m), '*'); } catch (e) {} };
  const demoLoad = () => { let d = null; try { d = JSON.parse(localStorage.getItem(DEMO_KEY) || 'null'); } catch (e) {}
    return Object.assign({ points: SETTINGS.demoPoints, inv: {}, best: 0, runs: 0 }, d || {}); };
  const demoSave = () => { try { localStorage.setItem(DEMO_KEY, JSON.stringify({ points: state.points, inv: state.inv, best: state.best, runs: state.runs })); } catch (e) {} };
  function setState(s) { state = Object.assign({ points: 0, pearls: 0, inv: {}, best: 0, runs: 0, shop: SETTINGS.demoShop }, s || {}); if (!Array.isArray(state.shop) || !state.shop.length) state.shop = SETTINGS.demoShop; listeners.forEach(f => f(state)); }
  addEventListener('message', e => {
    const d = e.data; if (!d || d.rw !== 1 || e.source !== window.parent) return;
    if (d.t === 'state') { mode = 'live'; const { t, rw, ...s } = d; setState(s); }
    else if (d.t === 'reply') { if (d.state) setState(d.state); const w = waiting.get(String(d.req)); if (w) { waiting.delete(String(d.req)); w(d); } }
    else if (d.t === 'pause') { listeners.forEach(f => f(state, 'pause')); }
  });
  function ask(m) { const req = String(++reqN); return new Promise((ok, no) => { waiting.set(req, ok); post(Object.assign({ req }, m)); setTimeout(() => { if (waiting.delete(req)) no(new Error('no answer')); }, 6000); }); }
  function start() {
    if (embedded) post({ t: 'hello' });
    setTimeout(() => { if (mode === 'pending') { mode = 'demo'; setState(Object.assign({ demo: true }, demoLoad())); } }, embedded ? 1500 : 0);
  }
  const wallet = () => (state ? (+state.points || 0) + (+state.pearls || 0) : 0);
  async function buy(id) {
    const it = (state.shop || []).find(x => x.id === id); if (!it) return { ok: false, reason: 'Not in the shop.' };
    if (wallet() < it.cost) {
      if (mode === 'live' && state.pearlName) { post({ t: 'needPearls', id }); return { ok: false, reason: '', asked: true }; }
      return { ok: false, reason: 'You need ' + (it.cost - wallet()) + ' more points for ' + it.name + '.' };
    }
    if (mode === 'demo') { state.points -= it.cost; state.inv[id] = (state.inv[id] || 0) + 1; demoSave(); setState(state); return { ok: true }; }
    return ask({ t: 'buy', id });
  }
  async function use(ids) {
    if (!ids.length) return { ok: true };
    if (mode === 'demo') { for (const id of ids) { if (!(state.inv[id] > 0)) return { ok: false, reason: 'Out of that power-up.' }; } ids.forEach(id => { state.inv[id]--; if (!state.inv[id]) delete state.inv[id]; }); demoSave(); setState(state); return { ok: true }; }
    return ask({ t: 'use', ids });
  }
  function score(score, beans, level) {
    if (mode === 'demo') { state.runs++; state.best = Math.max(state.best, score); demoSave(); setState(state); return; }
    post({ t: 'score', score: Math.floor(score), beans: Math.floor(beans || 0), level: level || 0 });
  }
  return { start, buy, use, score, on: f => listeners.push(f), get state() { return state; }, get mode() { return mode; }, wallet };
})();

/* =====================================================================================
   3. AVATARS · the site's 3D avatar runtime (three.js r149 + SandyKit, ~15 MB, cached by the browser)
   - The player wears the look saved by the Grug avatar editor on this phone (localStorage 'grug.sandy.v1').
   - Every bot is a female Sandy: SandyKit.randomConfig(seed, {body:'female'}).
   - Keep the scene in her own units: 1 unit = 1 cm (she is ~170 cm tall). Her hair breaks at tiny scales, so
     never shrink her to fit a world in metres; size the world in cm instead.
   ===================================================================================== */
const Avatars = (() => {
  let K = null;
  function loadOne(src) { return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = () => window.SandyKit ? ok(window.SandyKit) : no(new Error('no SandyKit')); s.onerror = () => { s.remove(); no(new Error('failed ' + src)); }; document.head.appendChild(s); }); }
  async function load() {
    if (window.SandyKit) return (K = window.SandyKit);
    for (const src of SETTINGS.runtime) { try { return (K = await loadOne(src)); } catch (e) {} }
    throw new Error('Avatar runtime not found');
  }
  function playerConfig() { let c = null; try { c = JSON.parse(localStorage.getItem('grug.sandy.v1') || 'null'); } catch (e) {} return K.merge(K.DEFAULT, c && typeof c === 'object' ? c : {}); }
  function botConfig(i, shirt) { const c = K.randomConfig(SETTINGS.botSeed + '-' + i, { body: 'female' }); c.weapon = null; if (shirt) { c.top = null; c.legs = null; c.outfit = Object.assign({}, c.outfit, { shirt, shorts: '#24262b' }); } return c; }
  return { load, playerConfig, botConfig, get K() { return K; } };
})();

   bookshelves, low walls and statues.

      (own ? '<button style="background:var(--violet)" data-swuse="' + esc(sw.id) + '">Use one</button>' : '<button class="' + (can ? '' : 'dim') + '" style="' + (can ? 'background:var(--violet)' : '') + '" data-swbuy="' + esc(sw.id) + '">' + price(sw.cost) + '</button>') + '</div></div></div>' +
      '<button class="go ghost" id="endBtn">' + vi('flag_checkered') + 'End the run</button></div>');
  }
  function results(r) {

    show('results', '<div class="top">' + tile(r.cleared ? 'trophy' : 'chest', r.cleared ? 'var(--amber)' : 'var(--sky)', 1) + '<div><h1>Run over</h1><small>You reached floor ' + r.floor + (r.score >= best && r.score > 0 ? ' · new best!' : '') + '</small></div></div><div class="body">' +
      '<div class="stats"><div class="stat"><b style="color:var(--violet)">' + r.score + '</b><small>Score</small></div><div class="stat"><b style="color:var(--indigo)">' + r.floor + '</b><small>Floor</small></div><div class="stat"><b style="color:var(--amber)">' + r.chests + '</b><small>Chests</small></div><div class="stat"><b style="color:#ca8a04">' + r.gold + '</b><small>Gold</small></div></div>' +
      '<p class="note">Score: 100 a floor cleared, 25 a chest, 1 a gold coin.</p>' +
      '<button class="go" id="againBtn">' + vi('arrows_clockwise') + 'Play again</button></div>');
  }
  function paused(on) {

    else closeSheets();
  }
  // clicks

    b.blur();   // otherwise Space (or Enter) would click it again mid-run

    if (b.dataset.gfx || b.dataset.scale || b.dataset.sound) {

      if (Game.G.mode === 'play') paused(true); else lobby(); return;
    }
    if (b.dataset.pick) { picked.has(b.dataset.pick) ? picked.delete(b.dataset.pick) : picked.add(b.dataset.pick); lobby(); }
    else if (b.dataset.buy) { b.disabled = true; try { const r = await Bridge.buy(b.dataset.buy); if (r.ok) toast('Added. Tap Use to take it into the run.', 'good'); else if (r.reason) toast(r.reason, 'bad'); } catch (x) { toast('The rewards app didn’t answer. Try again.', 'bad'); } if (sheet === 'lobby') lobby(); }
    else if (b.id === 'goBtn') {
      const ids = [...picked]; b.disabled = true;
      let r; try { r = await Bridge.use(ids); } catch (x) { r = { ok: false, reason: 'The rewards app didn’t answer.' }; }
      if (!r.ok) { toast(r.reason || 'Couldn’t start.', 'bad'); lobby(); return; }
      const fx = { heart: 0, stamina: 1, unlock: 1, speed: 1, double: 1, radar: 0, revive: 0, kit: [] };
      ids.forEach(id => { const it = Bridge.state.shop.find(x => x.id === id); if (!it) return; const a = +it.amount;
        if (it.effect === 'heart') fx.heart += a || 1; else if (it.effect === 'stamina') fx.stamina *= a || 1.4; else if (it.effect === 'unlock') fx.unlock *= a || 1.3;
        else if (it.effect === 'speed') fx.speed *= a || 1.12; else if (it.effect === 'double') fx.double = Math.max(fx.double, a || 2); else if (it.effect === 'radar') fx.radar = 1;
        else if (it.effect === 'revive') fx.revive = a || 2; else if (it.effect === 'kit') fx.kit.push(...String(it.amount || '').split(',').map(x => x.trim()).filter(Boolean)); });
      picked.clear(); closeSheets(); Game.begin(fx);
    }
    else if (b.id === 'againBtn') lobby();
    else if (b.id === 'pauseBtn' || b.id === 'resumeBtn') Game.togglePause();
    else if (b.id === 'quitBtn') { closeSheets(); Game.finish(); }
    else if (b.id === 'shopClose' || b.id === 'shopBack') { closeSheets(); Game.closeShop(); }
    else if (b.dataset.mbuy) { const i = b.dataset.mbuy, s = i === 'heal' ? null : stock[+i]; if (s && s.sold) return; const msg = Game.buyFromMerchant(s ? s.kind : 'heal', s ? ITEMS[s.kind].price : 30); if (msg) toast(msg, 'bad'); else { if (s) s.sold = true; toast(s ? 'Got ' + ITEMS[s.kind].n + '.' : 'A heart mended.', 'good'); } shop(); }
    else if (b.id === 'nextBtn') { closeSheets(); Game.nextFloor(); }
    else if (b.dataset.swuse || b.dataset.swbuy) {
      const id = b.dataset.swuse || b.dataset.swbuy, it = Bridge.state.shop.find(x => x.id === id); b.disabled = true;
      try {
        if (b.dataset.swbuy) { const r = await Bridge.buy(id); if (!r.ok) { if (r.reason) toast(r.reason, 'bad'); down(it); return; } }
        const u = await Bridge.use([id]); if (!u.ok) { toast(u.reason || 'Couldn’t use it.', 'bad'); down(it); return; }
        Game.revive(+it.amount || 2);
      } catch (x) { toast('The rewards app didn’t answer. Try again.', 'bad'); down(it); }
    }
    else if (b.id === 'endBtn') { closeSheets(); Game.finish(); }
    else if (b.dataset.slot) {
      // mouse: click uses it (hover shows what it is). Touch: one tap shows what it is, a second tap right after uses it
      const i = +b.dataset.slot, now = performance.now();
      if (slotPtr === 'mouse') { Game.useItem(i); hideTip(); }
      else if (lastTap.i === i && now - lastTap.t < 450) { lastTap.i = -1; Game.useItem(i); hideTip(); }
      else { lastTap = { i, t: now }; showTip(i, true); }
    }
  });
  // touch buttons act on press, not on release
  $('actBtn').addEventListener('pointerdown', e => { e.preventDefault(); input.act = true; input.check = true; Sfx.unlock(); });
  $('runBtn').addEventListener('pointerdown', e => { e.preventDefault(); input.runToggle = !input.runToggle; });
  $('ring').addEventListener('pointerdown', e => { e.preventDefault(); input.check = true; });
  $('mapWrap').addEventListener('click', () => { input.map = true; });
  // the HUD
  const slotsEl = $('slots'); slotsEl.innerHTML = [0, 1, 2].map(i => '<button class="slot empty" data-slot="' + i + '" aria-label="Item ' + (i + 1) + '"><kbd>' + (i + 1) + '</kbd><span></span></button>').join('');
  // item tooltips: hover (mouse) or tap (touch) shows the name and what it does, just above the slot
  const tipEl = $('itip'); let tipI = -1, tipTouch = false, tipT = 0, slotPtr = 'mouse', lastTap = { i: -1, t: 0 };
  function showTip(i, touch) {
    const k = Game.P && Game.P.inv[i]; if (!k) return hideTip(); const it = ITEMS[k], r = slotsEl.children[i].getBoundingClientRect();
    tipI = i; tipTouch = touch; clearTimeout(tipT); if (touch) tipT = setTimeout(hideTip, 3500);
    tipEl.innerHTML = '<b>' + esc(it.n) + '</b><span>' + esc(it.d) + '</span><small>' + (touch ? 'Double-tap to use' : 'Click or press ' + (i + 1) + ' to use') + '</small>';
    tipEl.style.display = 'block'; const w = tipEl.offsetWidth;
    tipEl.style.left = clamp(r.left + r.width / 2 - w / 2, 8, innerWidth - w - 8) + 'px'; tipEl.style.top = (r.top - tipEl.offsetHeight - 10) + 'px';
  }
  function hideTip() { tipI = -1; clearTimeout(tipT); tipEl.style.display = 'none'; }
  slotsEl.addEventListener('pointerdown', e => { slotPtr = e.pointerType || 'mouse'; });
  slotsEl.addEventListener('pointerover', e => { const b = e.target.closest('.slot'); if (b && e.pointerType === 'mouse') showTip(+b.dataset.slot, false); });
  slotsEl.addEventListener('pointerout', e => { const b = e.target.closest('.slot'); if (b && e.pointerType === 'mouse' && !b.contains(e.relatedTarget)) hideTip(); });
  function hud(on) { hideTip(); for (const id of ['hud', 'pauseBtn', 'bar', 'mapWrap']) $(id).hidden = !on; document.body.classList.toggle('playing', on); if (!on) { $('prompt').style.display = 'none'; $('pick').style.display = 'none'; $('vign').classList.remove('on'); } }
  let last = {}, ringRes = null, ringResT = 0;
  const setIf = (k, v, f) => { if (last[k] !== v) { last[k] = v; f(v); } };
  function heartsBump() { const el = $('hudHearts'); el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); }
  function hurt() { heartsBump(); const f = $('flash'); f.style.transition = 'none'; f.style.opacity = REDUCED ? '0.2' : '0.45'; requestAnimationFrame(() => { f.style.transition = 'opacity .5s'; f.style.opacity = '0'; }); if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) {} }
  function checkResult(t, c) { ringRes = [t, c]; ringResT = 0.9; }
  const ringCtx = $('ring').getContext('2d');
  function drawRing(chk) {
    const g = ringCtx, W = 300, c = W / 2, R = 110; g.clearRect(0, 0, W, W);
    g.beginPath(); g.arc(c, c, R + 26, 0, Math.PI * 2); g.fillStyle = '#ffffff'; g.fill();
    g.lineWidth = 26; g.beginPath(); g.arc(c, c, R, 0, Math.PI * 2); g.strokeStyle = '#dde0e8'; g.stroke();
    const A = f => -Math.PI / 2 + f * Math.PI * 2;
    g.beginPath(); g.arc(c, c, R, A(chk.z0), A(chk.z0 + chk.w)); g.strokeStyle = '#f59e0b'; g.stroke();
    const mid = chk.z0 + chk.w / 2; g.beginPath(); g.arc(c, c, R, A(mid - chk.pw / 2), A(mid + chk.pw / 2)); g.strokeStyle = '#10b981'; g.stroke();
    const a = A(chk.t / chk.rev); g.lineWidth = 10; g.lineCap = 'round'; g.beginPath(); g.moveTo(c, c); g.lineTo(c + Math.cos(a) * (R + 14), c + Math.sin(a) * (R + 14)); g.strokeStyle = '#111827'; g.stroke(); g.lineCap = 'butt';
    g.beginPath(); g.arc(c, c, 52, 0, Math.PI * 2); g.fillStyle = '#111827'; g.fill();
    g.fillStyle = '#fff'; g.font = '700 ' + (TOUCH ? 34 : 24) + 'px Fredoka, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(TOUCH ? 'TAP' : 'SPACE', c, c + 2);
  }
  // the map: what you've explored, the stairs, chests you've found (all of them with the Treasure Map), monsters you can see
  const mapC = $('map'), mctx = mapC.getContext('2d'), base = document.createElement('canvas'); base.width = NX; base.height = NZ;
  const bctx = base.getContext('2d'), img = bctx.createImageData(NX, NZ); let mapT = 0, big = false;
  function drawMap(dt, G, P, chests, monsters) {
    if (input.map) { input.map = false; big = !big; $('mapWrap').classList.toggle('big', big); document.body.classList.toggle('bigmap', big); mapC.width = mapC.height = big ? 760 : 300; mapT = 0; }
    mapT -= dt; if (mapT > 0) return; mapT = 0.12;
    const d = img.data, seen = World.seen, walk = World.walk, ward = World.ward;
    for (let k = 0; k < NX * NZ; k++) { const o = k * 4; if (!seen[k]) { d[o + 3] = 0; continue; } const w = walk[k] || World.roomAt[k] >= 0 && World.get(k % NX, 1, (k / NX) | 0) && BL[World.get(k % NX, 1, (k / NX) | 0)].kind !== 'solid';
      if (ward[k]) { d[o] = 110; d[o + 1] = 200; d[o + 2] = 160; } else if (w) { d[o] = 150; d[o + 1] = 158; d[o + 2] = 178; } else { d[o] = 46; d[o + 1] = 51; d[o + 2] = 64; } d[o + 3] = 255; }
    bctx.putImageData(img, 0, 0);
    // small map: 56 cells around you; big map: the whole floor
    const W = mapC.width, span = big ? Math.max(NX, NZ) : 56, s = W / span, ox = big ? (NX - span) / 2 : clamp(P.x / BS - span / 2, 0, NX - span), oz = big ? (NZ - span) / 2 : clamp(P.z / BS - span / 2, 0, NZ - span);
    mctx.imageSmoothingEnabled = false; mctx.fillStyle = '#1a1d26'; mctx.fillRect(0, 0, W, W); mctx.drawImage(base, 0, 0, NX, NZ, -ox * s, -oz * s, NX * s, NZ * s);
    const X = x => (x / BS - ox) * s, Z = z => (z / BS - oz) * s;
    const dot = (x, z, r, col) => { mctx.fillStyle = col; mctx.beginPath(); mctx.arc(X(x), Z(z), r, 0, Math.PI * 2); mctx.fill(); };
    const k = W / 300 * (big ? 0.9 : 1.2);
    const ex = Game.exit; if (ex) { mctx.fillStyle = G.exitOpen ? '#34d399' : '#9ca3af'; const q = s * 3; mctx.fillRect(X(ex.x) - q / 2, Z(ex.z) - q / 2, q, q); }
    chests.forEach(c => { if (!(c.found || G.owlT > 0)) return; mctx.fillStyle = c.open ? '#6b7280' : '#fbbf24'; const q = (c.open ? 6 : 11) * k; mctx.fillRect(X(c.x) - q / 2, Z(c.z) - q / 2, q, q); });
    monsters.forEach(m => { if (G.owlT > 0 || G.fx.radar || (Math.hypot(m.x - P.x, m.z - P.z) < 1800 && World.los(P.x, P.z, m.x, m.z))) dot(m.x, m.z, 6 * k, '#f43f5e'); });
    // you: an arrow
    const px = X(P.x), pz = Z(P.z), fx = Math.sin(P.face), fz = Math.cos(P.face), L = 12 * k;
    mctx.fillStyle = '#ffffff'; mctx.beginPath(); mctx.moveTo(px + fx * L, pz + fz * L); mctx.lineTo(px - fx * L * 0.6 + fz * L * 0.6, pz - fz * L * 0.6 - fx * L * 0.6); mctx.lineTo(px - fx * L * 0.6 - fz * L * 0.6, pz - fz * L * 0.6 + fx * L * 0.6); mctx.closePath(); mctx.fill();
  }
  function frame(G, P, chests, monsters, live) {
    if (G.mode !== 'play' && G.mode !== 'shop' && G.mode !== 'down') return;
    const dt = 1 / 60;
    setIf('hearts', P.hearts + '/' + P.maxHearts, () => { $('hudHearts').innerHTML = Array.from({ length: P.maxHearts }, (_, i) => i < P.hearts ? vi('heart') : vi('heart').replace('class="vi"', 'class="vi off"')).join(''); });
    setIf('floor', G.floor, v => { $('hudFloor').textContent = 'Floor ' + v; });
    const open = chests.filter(c => c.open).length; setIf('chests', open + '/' + chests.length, v => { $('hudChests').textContent = v; });
    setIf('gold', G.gold, v => { $('hudGold').textContent = v; });
    setIf('score', G.floorsCleared * 100 + G.chestsOpened * 25 + G.goldTotal, v => { $('hudScore').textContent = v; $('hudTime').textContent = G.floor; });
    const mx = Game.stMax(), pct = Math.round(P.st / mx * 100);
    setIf('st', pct + (P.winded ? 'w' : '') + (P.boostT > 0 ? 'b' : ''), () => { const f = $('stamFill'); f.style.width = pct + '%'; f.className = P.winded ? 'out' : P.boostT > 0 ? 'boost' : pct < 30 ? 'low' : ''; $('stamTxt').textContent = P.winded ? 'OUT OF BREATH' : P.boostT > 0 ? 'STAMINA +' + P.boost : 'STAMINA'; });
    setIf('inv', P.inv.join(','), () => { [...slotsEl.children].forEach((el, i) => { const k = P.inv[i]; el.classList.toggle('empty', !k); el.lastChild.outerHTML = k ? '<span class="tile" style="background:' + ITEMS[k].c + '">' + vi(ITEMS[k].ic) + '</span>' : '<span></span>'; }); if (tipI >= 0) showTip(tipI, tipTouch); });
    const tm = []; if (P.boostT > 0) tm.push(['flask', 'var(--sky)', P.boostT]); if (P.bootsT > 0) tm.push(['boots', 'var(--teal)', P.bootsT]); if (G.owlT > 0) tm.push(['eye', '#ca8a04', G.owlT]); if (P.adrenT > 0) tm.push(['lightning_bolt', 'var(--rose)', P.adrenT]);

    // prompt and lock picking
    const tgt = G.target, txt = live && tgt && tgt.text ? '<kbd>E</kbd>' + esc(tgt.text) : '';
    setIf('prompt', txt, v => { const el = $('prompt'); el.innerHTML = v; el.style.display = v ? 'block' : 'none'; });
    const hot = live && (!!(tgt && tgt.text) || !!G.check); setIf('hot', hot, v => $('actBtn').classList.toggle('hot', v));
    setIf('run', input.runToggle, v => $('runBtn').classList.toggle('on', v));
    const pk = live && P.picking; setIf('pk', !!pk, v => { $('pick').style.display = v ? 'flex' : 'none'; });
    if (pk) {
      $('pickBar').style.width = Math.floor(pk.prog * 100) + '%';
      ringResT -= dt; const lbl = ringRes && ringResT > 0 ? '<span style="color:' + ringRes[1] + '">' + ringRes[0] + '</span>' : 'Picking the lock · ' + Math.floor(pk.prog * 100) + '%';
      setIf('plbl', lbl, v => { $('pickLbl').innerHTML = v; });
      setIf('ringOn', !!G.check, v => { $('ring').style.display = v ? 'block' : 'none'; });

  }
  Bridge.on(() => { if (sheet === 'lobby' || (sheet === null && Game.G.mode === 'idle')) lobby(); else if (Game.G.mode === 'offer' && sheet === 'results') { const sw = (Bridge.state.shop || []).find(x => x.effect === 'revive'); if (sw) down(sw); } });
  return { lobby, hud, frame, toast, banner, results, floorDone, shop, down, paused, closeSheets, heartsBump, hurt, checkResult, get sheet() { return sheet; } };
})();

/* ---------- boot ---------- */
(async function boot() {
  const load = document.getElementById('loading');
  try { await Avatars.load(); } catch (e) { console.warn('Avatars off:', e.message); }
  if (!window.THREE) { load.textContent = 'This game needs the Grug avatar runtime (sandy-runtime.js).'; return; }
  const atlas = new Image(); atlas.src = 'data:image/png;base64,' + ATLAS_B64; await atlas.decode();
  makeWorld(atlas); await Game.setup();
  load.classList.add('done'); Bridge.start();
  (function frame() { const raw = clock.getDelta(), dt = Math.min(0.05, raw); Game.step(dt); renderer.render(scene, camera); if (Game.running) View.tick(raw, clock.elapsedTime); requestAnimationFrame(frame); })();
})();
</script>
