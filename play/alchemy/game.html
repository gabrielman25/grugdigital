<title>Sugar Alchemist · Alchemy Bake Lab</title>
<!--
  SUGAR ALCHEMIST (Grug game, built from the kit's starter template)
  A 3D bakery time-management game in the spirit of Papa's Pizzeria, made for Alchemy Bake Lab (Katy, TX).
  Take the order, mix the batter in the flask, bake, frost, add the sparkle and serve. Every station is scored
  against the ticket, and the score sets the tip. Tips buy upgrades and decor for your lab between shifts.
  Sections, top to bottom:
    1. SETTINGS         names, shift length, demo store items
    2. BRIDGE           talks to the partner's rewards app (points, Pearls, power-ups, score). Kept from the template.
    3. AVATARS          loads the site's 3D avatar runtime; the player wears their own look, every bot is female. Kept from the template.
    4. WORLD + INPUT    the voxel bakery (Take a Tea block textures, like Steal a Sip), camera, keyboard / touch / gamepad
    5. GAME             tickets, customers, the six stations, scoring, tips, ranks, the Lab Shop and the Store
    6. SCREENS          lobby, station panels, HUD, results, pause, Lab Shop, Store
  Art: block textures from the Take a Tea / Steal a Sip block set; treats and props are drawn in code;
  font Fredoka (OFL); vector icons @icons by Valentin Fossati (MIT).
-->

:root{--ink:#F7F7F2;--mut:#B9B9B2;--bg:#0B0B0C;--card:#1E1F21;--card2:#2A2B2E;--line:#3A3B3E;--panel:rgba(11,11,12,.94);--type:"Special Elite","Courier New",Courier,monospace;
  --green:#10b981;--sky:#0ea5e9;--violet:#7c3aed;--amber:#f59e0b;--rose:#f43f5e;--orange:#f97316;--indigo:#6366f1;--teal:#14b8a6;
  --gold:#C2A26B;--holo:#8C7BFF;--lab:#0B0B0C;--bubble:#2A984C;
  --font:"Fredoka","Arial Rounded MT Bold",system-ui,-apple-system,"Segoe UI",sans-serif;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--sal:env(safe-area-inset-left);--sar:env(safe-area-inset-right);
  --cover:0px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
html,body{margin:0;height:100%;overflow:hidden;background:#0B0B0C;color:var(--ink);font:600 16px/1.35 var(--font);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none}
canvas#view{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;pointer-events:none}
.ui>*{pointer-events:auto}
.vi{display:inline-block;vertical-align:middle;flex:none}
[hidden]{display:none!important}
#tags{position:fixed;inset:0;pointer-events:none!important;overflow:hidden}
.tag{position:absolute;left:0;top:0;transform-origin:50% 100%;white-space:nowrap;font-weight:700;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;display:flex;align-items:center;gap:5px;will-change:transform}
.tag .ti{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff}.tag .ti .vi{width:13px;height:13px}
.tag.say{padding:6px 12px;font-size:16px;border-radius:16px}
.tag.say::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#0B0B0C}
.tag.vip{background:var(--gold);color:#fff}
.floaty{position:fixed;left:0;top:0;font-weight:700;font-size:26px;pointer-events:none;color:#fff;white-space:nowrap;padding:4px 14px;border-radius:999px;background:var(--green);transition:transform 1.3s ease-out,opacity 1.3s ease-in}
/* HUD: white pills */
.hud{position:fixed;top:calc(var(--sat) + 10px);left:calc(var(--sal) + 10px);right:calc(var(--sar) + 10px);display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 16px 6px 6px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:22px;color:var(--ink);line-height:1.05}
.pill .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}.pill .ic .vi{width:20px;height:20px}
.pill small{display:block;font-weight:600;color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.pill.time{margin-left:auto;margin-right:auto}
.pill.time.low .ic{background:var(--rose)!important}
.pill.time.closing{background:var(--rose);color:#fff}.pill.time.closing small{color:#ffe4e6}
.pause{width:50px;height:50px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;pointer-events:auto;min-height:0}
.pause .vi{width:22px;height:22px}
/* ticket rail */
#rail{position:fixed;top:calc(var(--sat) + 66px);left:calc(var(--sal) + 10px);right:calc(var(--sar) + 10px);display:flex;gap:8px;overflow-x:auto;pointer-events:auto;padding-bottom:4px}
.mt{flex:none;width:112px;padding:6px 8px 7px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:var(--ink);text-align:left;display:block;min-height:0;font:600 13px/1.2 var(--font);cursor:pointer}
.mt b{display:flex;align-items:center;gap:5px;font-size:14px;overflow:hidden;white-space:nowrap}.mt b .vi{width:15px;height:15px;color:var(--mut)}
.mt i{display:block;font-style:normal;margin-top:4px;padding:2px 7px;border-radius:999px;color:#fff;font-size:12px;width:max-content}
.mt.vip{background:#2b2414;border-color:var(--gold)}
.mt .bar{display:block;height:5px;border-radius:3px;background:var(--card2);margin-top:5px;overflow:hidden}.mt .bar span{display:block;height:100%;background:var(--orange)}
/* bottom: station panel + station bar */
#bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 10px);width:min(820px,calc(100% - 20px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
#bottom>*{pointer-events:auto}
#panel{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:14px;display:flex;gap:14px;align-items:stretch}
#tk{flex:none;width:200px;background:var(--card);border-radius:16px;padding:10px 12px;font-size:14px;line-height:1.25}
#tk h4{margin:0 0 6px;font-size:16px;color:var(--ink);display:flex;align-items:center;gap:6px}#tk h4 .vi{width:18px;height:18px;color:var(--mut)}#tk h4 small{margin-left:auto;color:var(--mut);font-size:13px}
#tk .r{display:flex;align-items:center;gap:6px;padding:3px 6px;margin:0 -6px;border-radius:8px;color:#d6d6d0}
#tk .r.now{background:#3b3220;color:#ffe9b0;font-weight:700}#tk .r.done{color:#7d7d77}#tk .r.done .ck{color:var(--green)}
#tk .r em{font-style:normal;color:var(--mut);width:62px;flex:none;font-size:13px}#tk .r.now em{color:var(--ink)}
.sw{width:14px;height:14px;border-radius:50%;flex:none;display:inline-block}
#tk .ck{margin-left:auto;width:16px;height:16px;flex:none}
#act{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;justify-content:center}
#act .say{font-size:18px;line-height:1.3}#act .say b{color:var(--sky)}
#act .hint{font-size:15px;color:var(--mut)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:50px;padding:0 14px 0 8px;border-radius:14px;background:var(--card);color:var(--ink);font-size:16px;gap:8px;position:relative}
.chip .blob{width:30px;height:30px;border-radius:50%;flex:none}
.chip.on{background:var(--ink);color:#0B0B0C}
.chip em{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--violet);color:#fff;font:700 13px/22px var(--font);font-style:normal;padding:0 5px}
.chip.locked{opacity:.35}
.chip kbd,.big kbd,.sb kbd{font:600 12px/1 var(--font);color:inherit;opacity:.55;margin-left:2px}
body.touch kbd{display:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.big{min-height:62px;font-size:22px;border-radius:18px;padding:0 22px;flex:1}
.big.hold{touch-action:none}
.big.wait{background:var(--card2);color:#7d7d77}
.meter{position:relative;height:30px;border-radius:15px;background:var(--card);overflow:hidden;flex:1;min-width:140px}
.meter .zone{position:absolute;top:0;bottom:0;background:#47C46E}
.meter .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ink);opacity:.14}
.meter .needle{position:absolute;top:-2px;bottom:-2px;width:6px;margin-left:-3px;border-radius:3px;background:var(--ink)}
.meter .lbl{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;color:#0B0B0C}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.slot{background:var(--card);border-radius:16px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-height:0;color:var(--ink);font-size:15px;align-items:stretch;justify-content:flex-start;text-align:left}
.slot b{display:flex;align-items:center;gap:6px;font-size:15px;white-space:nowrap;overflow:hidden}.slot b .vi{width:16px;height:16px}
.slot small{color:var(--mut);font-size:13px}
.slot.ready{background:#4a3a10;color:#ffe9b0}.slot.burn{background:#4a1818;color:#ffc9c9}
.gauge{position:relative;height:16px;border-radius:8px;overflow:hidden;display:flex}
.gauge span{height:100%}.gauge .nd{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--ink);border-radius:2px}
#bar{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:6px}
.sb{flex:1;min-width:0;min-height:58px;border-radius:16px;background:transparent;color:var(--ink);flex-direction:column;gap:2px;padding:4px 2px;font-size:13px;position:relative}
.sb .vi{width:24px;height:24px}
.sb.on{color:#fff}
.sb em{position:absolute;top:2px;right:6px;min-width:20px;height:20px;border-radius:10px;background:var(--rose);color:#fff;font:700 12px/20px var(--font);font-style:normal;padding:0 5px}
.sb.need:not(.on){animation:need 1s ease-in-out infinite}
@keyframes need{50%{background:#3b3220}}
.sb.alarm:not(.on){animation:alarm .5s steps(2) infinite}
@keyframes alarm{50%{background:#6a3410}}
/* score card */
#score{position:fixed;left:50%;top:calc(var(--sat) + 132px);transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:12px 16px;min-width:290px;opacity:0;transition:opacity .25s;pointer-events:none}
#score.on{opacity:1}
#score h4{margin:0 0 6px;font-size:18px;display:flex;align-items:center;gap:8px}#score h4 span{margin-left:auto;color:var(--green);font-size:22px}
#score .st{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;font-size:14px;align-items:center}
#score .st i{font-style:normal;color:var(--amber);letter-spacing:1px}#score .st small{color:var(--mut)}
.banner{position:fixed;left:50%;top:52%;transform:translate(-50%,-50%) scale(.8);opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;text-align:center;font:700 50px/1.1 var(--type);text-transform:uppercase;color:#fff;padding:6px 26px;border-radius:24px;background:var(--holo)}
.banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.banner.holo{animation:holo 1.2s linear infinite}
@keyframes holo{0%{background:#7DF0E1}25%{background:#8C7BFF}50%{background:#F25BD8}75%{background:#FFE66B}100%{background:#7DF0E1}}
/* menus: white panel, off-white cards, game blurred behind */
#veil{position:fixed;inset:0;display:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);background:rgba(8,6,14,.45);pointer-events:none}
body.menu-open #veil{display:block}
.sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(580px,calc(100% - 32px));max-height:calc(100% - 32px - var(--sat) - var(--sab));overflow:auto;padding:0 0 24px;border-radius:28px;background:var(--bg);border:1px solid var(--line);touch-action:pan-y}
.top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:14px;padding:18px 22px;background:var(--bg);border-bottom:1px solid var(--line)}
.top h1{margin:0;font:700 30px/1.05 var(--type);text-transform:uppercase;letter-spacing:.02em}.top small{display:block;font-size:15px;color:var(--mut)}
.body{padding:4px 22px 0}
.lead{font-size:18px;color:#d6d6d0;margin:18px 0 4px}
.tile{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;flex:none;color:#fff}.tile .vi{width:28px;height:28px}
.tile.big{width:64px;height:64px;border-radius:18px}.tile.big .vi{width:34px;height:34px}
.h{margin:28px 0 14px;font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}.h small{letter-spacing:0;text-transform:none;font-size:14px;color:#9ca3af;margin-left:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:12px;margin:18px 0 0}
.stat{background:var(--card);border-radius:20px;padding:14px 10px;text-align:center}.stat b{display:block;font-size:26px;line-height:1.1}.stat small{display:block;font-size:14px;color:var(--mut);margin-top:3px}
.items{display:grid;gap:12px}
.item{display:flex;align-items:center;gap:14px;padding:14px;border-radius:22px;background:var(--card);border:2px solid var(--card)}
.item.on{border-color:var(--green)}
.item .txt{flex:1;min-width:0}.item b{display:block;font-size:19px}.item small{display:block;font-size:14px;color:var(--mut);margin-top:3px}
.own{display:inline-flex;align-items:center;gap:5px;font-size:14px;padding:6px 12px;border-radius:999px;background:var(--green);color:#fff;white-space:nowrap}.own .vi{width:14px;height:14px}
.btns{display:flex;gap:8px;flex:none}
button{appearance:none;border:0;font:700 18px/1 var(--font);cursor:pointer;color:#fff;border-radius:14px;min-height:50px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--green)}
button .vi{width:20px;height:20px}
button:disabled{opacity:.5;cursor:default}button:active{transform:scale(.97)}
button.ghost{background:var(--card2);color:var(--ink)}button.dim{background:var(--card2);color:#7d7d77}
button.go{width:100%;min-height:68px;font-size:26px;border-radius:18px;margin-top:22px}button.go .vi{width:24px;height:24px}
button.half{flex:1;min-height:58px;font-size:20px;border-radius:16px}
button.focus{box-shadow:0 0 0 4px var(--sky)}
.x{width:50px;height:50px;min-height:0;padding:0;border-radius:50%;background:var(--card2);color:var(--ink);margin-left:auto}
.note{font-size:14px;color:#8a8a84;text-align:center;margin:16px 0 0}
.item.set{flex-wrap:wrap}.item.set .txt{min-width:170px}.seg{display:flex;gap:8px;flex-wrap:wrap}
.pillb{min-height:46px;min-width:60px;padding:0 14px;border-radius:999px;background:var(--card2);color:#d6d6d0;font-size:16px}.pillb.on{color:#fff}
.tabs{display:flex;gap:8px;margin:16px 0 0}
.rank{margin:16px 0 0;background:var(--card);border-radius:20px;padding:14px 16px}
.rank b{font-size:18px}.rank small{color:var(--mut);font-size:14px}
.prog{height:12px;border-radius:6px;background:var(--card2);margin-top:8px;overflow:hidden}.prog span{display:block;height:100%;background:var(--violet)}
.unlock{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px;border-radius:18px;background:#211a38}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 130px);transform:translateX(-50%);padding:12px 18px;border-radius:16px;background:#2A2B2E;border:1px solid var(--line);color:#fff;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;z-index:5}
.toast.on{opacity:1}.toast.good{background:var(--green)}.toast.bad{background:var(--rose)}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:#0B0B0C;color:var(--ink);font-size:22px;font-weight:700;transition:opacity .4s;text-align:center}
.loading small{display:block;font-size:15px;color:var(--mut);margin-top:6px}
.loading.done{opacity:0;pointer-events:none}
/* phones */
@media (max-width:440px){#dayPill{display:none!important}}
@media (max-width:640px){
  #panel{flex-direction:column;gap:8px;padding:10px;border-radius:20px}
  #tk{width:auto;padding:6px 10px;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center}
  #tk h4{margin:0;width:100%;font-size:15px}
  #tk .r{margin:0;padding:1px 6px;font-size:13px}#tk .r em{width:auto}#tk .r:not(.now){display:none}#tk .ck{margin-left:4px}
  .big{min-height:56px;font-size:20px}
  .chip{min-height:46px;font-size:15px;padding:0 10px 0 6px}.chip .blob{width:26px;height:26px}
  .sb{font-size:11px;min-height:54px}.sb .vi{width:22px;height:22px}
  #act .say{font-size:16px}
  .top h1{font-size:26px}.item{flex-wrap:wrap}.item .btns{flex:1 1 100%}.item .btns button{flex:1}.stat b{font-size:22px}
  .pill{font-size:19px}.pill .ic{width:32px;height:32px}
}
@media (max-height:560px) and (orientation:landscape){
  /* short landscape phones: the station panel becomes a column on the right, the 3D view stays on the left */
  #bottom{left:auto;right:calc(var(--sar) + 8px);transform:none;top:calc(var(--sat) + 8px);bottom:calc(var(--sab) + 8px);width:min(430px,50vw);justify-content:flex-end}
  #panel{flex-direction:column;padding:8px;gap:6px;border-radius:18px;overflow:auto;flex:0 1 auto;min-height:0}
  #tk{width:auto;padding:5px 10px;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center;font-size:13px}
  #tk h4{margin:0;width:100%;font-size:14px}#tk .r{margin:0;padding:1px 6px}#tk .r em{width:auto}#tk .r:not(.now){display:none}#tk .ck{margin-left:4px}
  #act{gap:6px}#act .say{font-size:15px}#act .hint{font-size:13px}
  .big{min-height:48px;font-size:18px}.chip{min-height:40px;font-size:14px;padding:0 10px 0 6px}.chip .blob{width:24px;height:24px}
  .slots{grid-template-columns:1fr 1fr}.slot{padding:6px 8px}
  #bar{padding:4px;gap:4px;border-radius:18px}.sb{min-height:46px;font-size:11px}.sb .vi{width:20px;height:20px}
  .hud{right:calc(var(--sar) + 8px + min(430px,50vw) + 8px)}#dayPill{display:none!important}.pill{font-size:18px}.pill .ic{width:30px;height:30px}
  #rail{right:auto;max-width:calc(50vw - 30px)}
  #score{left:calc((100vw - min(430px,50vw)) / 2);top:calc(var(--sat) + 66px)}.toast{left:calc((100vw - min(430px,50vw)) / 2)}
}
/* inside a partner's rewards app the app puts its own round buttons (full screen, minimize, landscape) at the top left:
   keep the HUD, ticket rail and menus clear of them */
body.embedded .hud{top:calc(var(--sat) + 64px)}
body.embedded #rail{top:calc(var(--sat) + 120px)}
body.embedded #score{top:calc(var(--sat) + 186px)}
body.embedded .toast{top:calc(var(--sat) + 184px)}
body.embedded .sheet{top:calc(50% + 28px);max-height:calc(100% - 88px - var(--sat) - var(--sab))}
@media (prefers-reduced-motion:reduce){.sb.need:not(.on),.sb.alarm:not(.on),.banner.holo{animation:none}}
</style>
</head>

/* =====================================================================================
   2. BRIDGE · the rewards app protocol (window.postMessage, every message carries rw:1)
     game → app  {t:'hello'}                ← {t:'state', points, pearls?, pearlName?, inv, best, runs, shop, title, collectible, runSeconds, brand, store, avatar?, player?}
                 {t:'buy', id, req}         ← {t:'reply', req, ok, reason?, state}   app takes points/Pearls, adds 1 to inv[id]
                 {t:'use', ids:[…], req}    ← {t:'reply', req, ok, reason?, state}   removes 1 of each (the run has started)
                 {t:'score', score, beans, level?}   the app keeps the best score and counts the run
                 {t:'needPearls', id}       the app offers to sell Pearls and returns the player to the game
     app → game  {t:'pause'} when the player leaves the Game tab; a fresh {t:'state'} whenever points change.
   On its own (no app answers within 1.5 s) the game runs in demo mode with pretend points saved on this device.
   ===================================================================================== */
const Bridge = (() => {
  const embedded = window.parent && window.parent !== window;
  const DEMO_KEY = 'grug-starter-demo:' + SETTINGS.title;
  let state = null, mode = 'pending', reqN = 0; const waiting = new Map(), listeners = [];
  const post = m => { try { window.parent.postMessage(Object.assign({ rw: 1 }, m), '*'); } catch (e) {} };
  const demoLoad = () => { let d = null; try { d = JSON.parse(localStorage.getItem(DEMO_KEY) || 'null'); } catch (e) {}
    return Object.assign({ points: SETTINGS.demoPoints, inv: {}, best: 0, runs: 0 }, d || {}); };
  const demoSave = () => { try { localStorage.setItem(DEMO_KEY, JSON.stringify({ points: state.points, inv: state.inv, best: state.best, runs: state.runs })); } catch (e) {} };
  function setState(s) { state = Object.assign({ points: 0, pearls: 0, inv: {}, best: 0, runs: 0, shop: SETTINGS.demoShop }, s || {}); if (!Array.isArray(state.shop) || !state.shop.length) state.shop = SETTINGS.demoShop; listeners.forEach(f => f(state)); }
  addEventListener('message', e => {
    const d = e.data; if (!d || d.rw !== 1 || e.source !== window.parent) return;
    if (d.t === 'state') { mode = 'live'; const { t, rw, ...s } = d; setState(s); }
    else if (d.t === 'reply') { if (d.state) setState(d.state); const w = waiting.get(String(d.req)); if (w) { waiting.delete(String(d.req)); w(d); } }
    else if (d.t === 'pause') { listeners.forEach(f => f(state, 'pause')); }
  });
  function ask(m) { const req = String(++reqN); return new Promise((ok, no) => { waiting.set(req, ok); post(Object.assign({ req }, m)); setTimeout(() => { if (waiting.delete(req)) no(new Error('no answer')); }, 6000); }); }
  function start() {
    if (embedded) post({ t: 'hello' });
    setTimeout(() => { if (mode === 'pending') { mode = 'demo'; setState(Object.assign({ demo: true }, demoLoad())); } }, embedded ? 1500 : 0);
  }
  const wallet = () => (state ? (+state.points || 0) + (+state.pearls || 0) : 0);
  async function buy(id) {
    const it = (state.shop || []).find(x => x.id === id); if (!it) return { ok: false, reason: 'Not in the shop.' };
    if (wallet() < it.cost) {
      if (mode === 'live' && state.pearlName) { post({ t: 'needPearls', id }); return { ok: false, reason: '', asked: true }; }
      return { ok: false, reason: 'You need ' + (it.cost - wallet()) + ' more points for ' + it.name + '.' };
    }
    if (mode === 'demo') { state.points -= it.cost; state.inv[id] = (state.inv[id] || 0) + 1; demoSave(); setState(state); return { ok: true }; }
    return ask({ t: 'buy', id });
  }
  async function use(ids) {
    if (!ids.length) return { ok: true };
    if (mode === 'demo') { for (const id of ids) { if (!(state.inv[id] > 0)) return { ok: false, reason: 'Out of that power-up.' }; } ids.forEach(id => { state.inv[id]--; if (!state.inv[id]) delete state.inv[id]; }); demoSave(); setState(state); return { ok: true }; }
    return ask({ t: 'use', ids });
  }
  function score(score, beans, level) {
    if (mode === 'demo') { state.runs++; state.best = Math.max(state.best, score); demoSave(); setState(state); return; }
    post({ t: 'score', score: Math.floor(score), beans: Math.floor(beans || 0), level: level || 0 });
  }
  return { start, buy, use, score, on: f => listeners.push(f), get state() { return state; }, get mode() { return mode; }, wallet };
})();

/* =====================================================================================
   3. AVATARS · the site's 3D avatar runtime (three.js r149 + SandyKit, ~15 MB, cached by the browser)
   - The player wears the look saved by the Grug avatar editor on this phone (localStorage 'grug.sandy.v1').
   - Every bot is a female Sandy: SandyKit.randomConfig(seed, {body:'female'}).
   - Keep the scene in her own units: 1 unit = 1 cm (she is ~170 cm tall). Her hair breaks at tiny scales, so
     never shrink her to fit a world in metres; size the world in cm instead.
   ===================================================================================== */
const Avatars = (() => {
  let K = null;
  function loadOne(src) { return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = () => window.SandyKit ? ok(window.SandyKit) : no(new Error('no SandyKit')); s.onerror = () => { s.remove(); no(new Error('failed ' + src)); }; document.head.appendChild(s); }); }
  async function load() {
    if (window.SandyKit) return (K = window.SandyKit);
    for (const src of SETTINGS.runtime) { try { return (K = await loadOne(src)); } catch (e) {} }
    throw new Error('Avatar runtime not found');
  }
  function playerConfig() { let c = null; try { c = JSON.parse(localStorage.getItem('grug.sandy.v1') || 'null'); } catch (e) {} return K.merge(K.DEFAULT, c && typeof c === 'object' ? c : {}); }
  function botConfig(i, shirt) { const c = K.randomConfig(SETTINGS.botSeed + '-' + i, { body: 'female' }); c.weapon = null; if (shirt) { c.top = null; c.legs = null; c.outfit = Object.assign({}, c.outfit, { shirt, shorts: '#24262b' }); } return c; }
  return { load, playerConfig, botConfig, get K() { return K; } };
})();

    else list = Game.DECOR.map(d => { const own = !!sv.decor[d.id] || (d.id === 'holo' && sv.passes.vip), can = sv.bank >= d.cost;
      return '<div class="item">' + tile(d.icon, 'var(--violet)') + '<div class="txt"><b>' + esc(d.n) + '</b><small>+3% on every tip. Shows up in your lab.</small></div><div class="btns">' + (own ? '<span class="own">' + vi('checkmark') + ' In your lab</span>' : '<button class="' + (can ? '' : 'dim') + '" data-dec="' + d.id + '">' + money(d.cost) + '</button>') + '</div></div>'; }).join('');
    show('sheet2', '<div class="top">' + tile('shop', 'var(--green)') + '<div><h1>Lab Shop</h1><small>You have ' + money(sv.bank) + ' in tips · decor bonus +' + Game.decorCount() * 3 + '%</small></div><button class="x" data-close="1">' + vi('cross') + '</button></div><div class="body">' + tabs + '<div class="items" style="margin-top:14px">' + list + '</div>' +
      '<p class="note">Tips come from serving customers. Want more? The Store has tip packs.</p></div>', 'shop');
  }
  function storeSheet() {
    const s = Bridge.state || {}, items = shopItems();
    const sec = (title, color, sub, arr, btn) => arr.length ? '<div class="h" style="color:' + color + '">' + title + '<small>' + sub + '</small></div><div class="items">' + arr.map(btn).join('') + '</div>' : '';
    const FX_VI = { time: 'stopwatch', goldoven: 'fire', steady: 'sliders', rush: 'person_run', double: 'coins', passtips: 'coins', passrack: 'fire', passhelper: 'person_run', passvip: 'gem', tips: 'coins', rankup: 'medal' };
    const icon = it => tile(FX_VI[it.effect] || (it.icon && VI[it.icon] ? it.icon : 'star'), it.effect.startsWith('pass') ? 'var(--violet)' : it.effect === 'tips' ? 'var(--green)' : it.effect === 'rankup' ? 'var(--indigo)' : 'var(--amber)');
    const card = it => { const own = Game.owned(it), inv = +(s.inv || {})[it.id] || 0, can = Bridge.wallet() >= it.cost || inv > 0;
      return '<div class="item">' + icon(it) + '<div class="txt"><b>' + esc(it.name) + '</b><small>' + esc(it.desc || '') + (Game.TIMED.includes(it.effect) && inv ? ' · you have ' + inv : '') + '</small></div><div class="btns">' +
        (own ? '<span class="own">' + vi('checkmark') + ' Yours</span>' : '<button class="' + (can ? '' : 'dim') + '" data-store="' + esc(it.id) + '">' + (!Game.TIMED.includes(it.effect) && inv ? 'Claim' : price(it)) + '</button>') + '</div></div>'; };
    show('sheet2', '<div class="top">' + tile('gem', 'var(--violet)') + '<div><h1>Store</h1><small>' + (s.points || 0) + ' points' + (s.pearlName ? ' · ' + (s.pearls || 0) + ' ' + esc(s.pearlName) : '') + '</small></div><button class="x" data-close="1">' + vi('cross') + '</button></div><div class="body">' +
      sec('Passes', 'var(--violet)', 'yours forever', items.filter(it => Game.PASS_KEY[it.effect]), card) +
      sec('Tip packs', 'var(--green)', 'for the Lab Shop', items.filter(it => it.effect === 'tips' || it.effect === 'rankup'), card) +
      sec('Boosts', 'var(--amber)', 'switch them on before a shift', items.filter(it => Game.TIMED.includes(it.effect)), card) +
      '<p class="note">Everything costs ' + esc(cur()) + ' and gives exactly what it says. No random prizes.</p></div>', 'store');
  }
  function closeSheet() { $('sheet2').hidden = true; if (back === 'pause') paused(true); else if (back === 'results' && lastResults) results(lastResults); else lobby(); menuOpen(); }
  let lastResults = null;

  /* ---------- clicks ---------- */
  document.addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    b.blur(); Sfx.unlock();
    const d = b.dataset;
    if (d.gfx || d.scale || d.sound) { if (d.gfx) View.set('quality', d.gfx); else if (d.scale) View.set('scale', +d.scale); else Sfx.on = d.sound === '1'; if (mode === 'pause') paused(true); else if (mode === 'lobby') lobby(); return; }
    if (d.go && G.on) { A.go(d.go); return; }
    if (d.take) return A.take();
    if (d.batter) return A.batter(d.batter);
    if (d.frost) return A.frosting(d.frost);
    if (d.top) return A.top(d.top);
    if (d.clear) return G.station === 'mix' ? A.emptyPans() : A.clearTops();
    if (d.done) return A.sparkleDone();
    if (d.serve) return A.serve();
    if (d.pull) return A.pull(+d.pull);
    if (d.hold) return;   // handled by pointer events
    if (d.pick) { picked.has(d.pick) ? picked.delete(d.pick) : picked.add(d.pick); Sfx.play('tap'); lobby(); return; }
    if (d.buy) { b.disabled = true; let r; try { r = await Bridge.buy(d.buy); } catch (x) { r = { ok: false, reason: 'The rewards app didn’t answer. Try again.' }; } if (r.ok) { toast('Added. Tap Use to switch it on for your shift.', 'good'); Sfx.play('buy'); } else if (r.reason) toast(r.reason, 'bad'); lobby(); return; }
    if (d.store) { b.disabled = true; await Game.storeBuy(d.store); if (mode === 'store') storeSheet(); return; }
    if (d.open) { back = mode; Sfx.play('tap'); return d.open === 'shop' ? shopSheet() : storeSheet(); }
    if (d.close) { Sfx.play('tap'); return closeSheet(); }
    if (d.tab) { shopTab = d.tab; Sfx.play('tap'); return shopSheet(); }
    if (d.upg) { Game.shopBuy('upg', d.upg); return shopSheet(); }
    if (d.dec) { Game.shopBuy('dec', d.dec); return shopSheet(); }
    if (d.daily) { const a = Game.daily(); if (a) toast('Daily tip jar: +' + money(a) + ' tips! Streak: ' + Game.S.daily.streak + ' day' + (Game.S.daily.streak > 1 ? 's' : ''), 'good'); return lobby(); }
    if (b.id === 'goBtn') {
      const ids = [...picked]; b.disabled = true;
      let r; try { r = await Bridge.use(ids); } catch (x) { r = { ok: false, reason: 'The rewards app didn’t answer.' }; }
      if (!r.ok) { toast(r.reason || 'Couldn’t start.', 'bad'); lobby(); return; }
      const fx = {}; ids.forEach(id => { const it = Bridge.state.shop.find(x => x.id === id); if (it) fx[it.effect] = it.effect === 'time' ? (fx.time || 0) + (+it.amount || 0) : (+it.amount || 1); });
      picked.clear(); hideAll(); input.keys.clear(); Game.begin(fx);
    }
    else if (b.id === 'againBtn') { lastResults = null; lobby(); }
    else if (b.id === 'resumeBtn' || b.id === 'pauseBtn') Game.togglePause();
    else if (b.id === 'endBtn') { Game.togglePause(false); Game.finish(); }
  });
  // hold buttons: pointer down / up (touch and mouse)
  document.addEventListener('pointerdown', e => { const b = e.target.closest('[data-hold]'); if (!b) return; e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (x) {} Sfx.unlock(); Game.holdStart(); });
  const up = e => { if (Game.H.on && (e.target.closest && e.target.closest('[data-hold]') || e.type === 'pointercancel' || e.type === 'pointerup')) Game.holdEnd(); };
  document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
  function holding(on) { holdingF = on; const b = document.querySelector('[data-hold]'); if (b) b.style.filter = on ? 'brightness(1.15)' : ''; if (!on) dirty(); }
  function release() { if (Game.H.on) Game.holdEnd(); }

  /* ---------- keyboard ---------- */
  const mainBtn = () => document.querySelector('#act [data-main]');
  addEventListener('keydown', e => {
    if (e.code === 'Escape' || e.code === 'KeyP') { if (mode === 'shop' || mode === 'store') closeSheet(); else if (G.on) Game.togglePause(); return; }
    if (/^(Space|ArrowUp|ArrowDown|ArrowLeft|ArrowRight|Backspace)$/.test(e.code) && !e.target.closest?.('.sheet')) e.preventDefault();
    input.keys.add(e.code);
    if (!G.on || G.paused || mode) { if ((e.code === 'Enter' || e.code === 'Space') && !e.repeat) { const g = $('goBtn') || $('againBtn') || $('resumeBtn'); if (g && !$('lobby').hidden && document.activeElement === document.body) { e.preventDefault(); g.click(); } } return; }
    if (e.repeat) return;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA' || e.code === 'KeyQ') return A.step(-1);
    if (e.code === 'ArrowRight' || e.code === 'KeyD' || e.code === 'KeyE') return A.step(1);
    if (e.code === 'Tab') { e.preventDefault(); return A.step(e.shiftKey ? -1 : 1); }
    const m = /^Digit([1-9])$/.exec(e.code) || /^Numpad([1-9])$/.exec(e.code);
    if (m) { const c = document.querySelector('#act [data-k="' + m[1] + '"]'); if (c) c.click(); return; }
    if (e.code === 'Space') { if (document.querySelector('#act [data-hold]')) Game.holdStart(); else if (G.station === 'bake') A.pull(null); else { const mb = mainBtn(); if (mb && !mb.dataset.go) mb.click(); } return; }
    if (e.code === 'Enter') { const mb = mainBtn(); if (mb && !mb.dataset.hold) mb.click(); return; }
    if (e.code === 'Backspace') { const c = document.querySelector('#act [data-clear]'); if (c) c.click(); }
  });
  addEventListener('keyup', e => { input.keys.delete(e.code); if (e.code === 'Space') Game.holdEnd(); });

  /* ---------- gamepad: LB / RB stations, d-pad moves the highlight, A presses (hold A on a hold button), B back, Start pause ---------- */
  let padPrev = [];
  function focusables() { const root = !$('sheet2').hidden ? $('sheet2') : !$('lobby').hidden ? $('lobby') : $('bottom'); return [...root.querySelectorAll('button')].filter(b => !b.disabled && b.offsetParent); }
  function setFocus(i) { const L = focusables(); document.querySelectorAll('button.focus').forEach(b => b.classList.remove('focus')); if (!L.length) return; focusI = (i + L.length) % L.length; const b = L[focusI]; b.classList.add('focus'); b.scrollIntoView && b.scrollIntoView({ block: 'nearest' }); }
  function pad() {
    const p = navigator.getGamepads ? Array.from(navigator.getGamepads()).find(Boolean) : null; if (!p) return;
    const bt = i => !!(p.buttons[i] && p.buttons[i].pressed), was = i => !!padPrev[i], hit = i => bt(i) && !was(i);
    if (hit(9)) { if (G.on) Game.togglePause(); else if ($('goBtn')) $('goBtn').click(); }
    if (G.on && !G.paused && !mode) { if (hit(4)) A.step(-1); if (hit(5)) A.step(1); }
    if (hit(14) || hit(12)) setFocus(focusI < 0 ? 0 : focusI - 1);
    if (hit(15) || hit(13)) setFocus(focusI < 0 ? 0 : focusI + 1);
    if (hit(0)) { const L = focusables(); let b = focusI >= 0 ? L[focusI] : (mode ? ($('goBtn') || $('againBtn') || $('resumeBtn')) : mainBtn()); if (b) { if (b.dataset.hold) Game.holdStart(); else b.click(); } }
    if (!bt(0) && was(0)) Game.holdEnd();
    if (hit(1)) { if (mode === 'shop' || mode === 'store') closeSheet(); else if (mode === 'pause') Game.togglePause(); }
    padPrev = p.buttons.map(q => q.pressed);
  }

  function shift(on) {
    $('hud').hidden = !on; $('rail').hidden = !on; $('bottom').hidden = !on; $('tags').style.display = on ? '' : 'none';
    if (!on) { View.setCover(0, 0); $('score').classList.remove('on'); }
    dirty();
  }
  Bridge.on(() => { if (!G.on && mode === 'lobby') lobby(); else if (!G.on && !mode && !lastResults) lobby(); else if (mode === 'store') storeSheet(); });
  return { lobby, results: r => { lastResults = r; results(r); }, paused, toast, dirty, floaty, banner, scoreCard, holding, release, shift, tick, get mode() { return mode; } };
})();

/* ---------- boot ---------- */
(async function boot() {
  const load = document.getElementById('loading');
  try { await Avatars.load(); } catch (e) { console.warn('Avatars off:', e.message); }
  if (!window.THREE) { load.innerHTML = '<div>This game needs the Grug avatar runtime (sandy-runtime.js).</div>'; return; }
  makeWorld();
  const img = new Image(); img.src = 'data:image/png;base64,' + ATLAS_B64; try { await img.decode(); } catch (e) {}
  buildWorld(img);
  await Game.setup();
  load.classList.add('done'); Bridge.start();
  let n = 0;
  (function frame() {
    const raw = clock.getDelta(), dt = Math.min(0.05, raw);
    Game.step(dt);
    if (++n % View.q.every === 0 || Game.running) renderer.render(scene, camera);
    View.tick(raw, clock.elapsedTime);
    requestAnimationFrame(frame);
  })();
})();
</script>
</body>
</html>
