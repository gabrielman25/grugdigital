<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><script>/* old address → new home */(function(){var p=location.pathname;if(location.hostname==='gabrielman25.github.io'&&p.indexOf('/grugdigital/')===0)location.replace('https://grugdigital.pages.dev/'+p.slice(13)+location.search+location.hash);})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Runway Ready · Grug</title>
<meta name="description" content="Dress to the theme in a voxel fashion house, then walk the runway. A Grug original.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="../../favicon.png">
<link rel="stylesheet" href="../../assets/grug.css">
<script src="../../assets/theme.js"></script>
<!--
  STANDALONE GAME · play/runway/
  A Grug original: no venue behind it, so its Store is paid in Pearls only.
  assets/gamehost.js does everything else: the bar (Back, name, Pearls), the game frame (game.html) and the game kit's
  messages. Change the game's Store, save key or venue below; the protocol is documented at the top of gamehost.js.
-->
</head>
<body>
<script src="../../assets/catalog.js"></script>
<script src="../../assets/icons.js"></script>
<script src="../../assets/games.js"></script>
<script src="../../assets/grug.js"></script>
<script src="../../assets/grug-app.js"></script>
<script src="../../assets/gamehost.js"></script>
<script>
'use strict';
GrugGameHost({
  id: 'runway', app: 'runway', bg: '#efe9e2', title: 'Runway Ready', src: 'game.html', collectible: 'style points', runSeconds: 120, storageKey: 'grug-runway-v1',
  // Pearls only. effect / amount are what game.html does with each one (time, hints, speed, flair).
  shop: [
    { id: 'time',  name: 'Extra Time',  desc: '+30 seconds to get dressed',              cost: 4, effect: 'time',  amount: 30 },
    { id: 'hints', name: 'Style Hints', desc: 'See which theme checks you pass, live',   cost: 5, effect: 'hints', amount: 1 },
    { id: 'speed', name: 'Fast Feet',   desc: 'Walk 35% faster',                         cost: 5, effect: 'speed', amount: 1.35 },
    { id: 'flair', name: 'Spotlight',   desc: 'The judges’ flair never goes below 15',   cost: 8, effect: 'flair', amount: 15 }
  ]
});
</script>
</body>
</html>
