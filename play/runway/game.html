<title>Runway Ready · Grug</title>
<!--
  RUNWAY READY · a dress-up runway game for Grug Digital, built from the Grug starter template.
  A theme appears (Ocean Blue, Cowgirl, Red Carpet …). Walk the voxel fashion house, put on pieces from the site's own
  avatar catalog (one room per clothing type), pick their colours, then walk the runway against four rivals.
  Score: theme checks (5 x 14 = 70, judged by piece type and colour family, so a computer can score them fairly)
  plus the judges' flair (0 to 30 at random). Every character, the player included, uses the female avatar body.
  Sections, top to bottom:
    1. SETTINGS         names, run length, default power-ups
    2. BRIDGE           talks to the partner's rewards app (points, Pearls, power-ups, score). Unchanged from the template.
    3. AVATARS          loads the site's 3D avatar runtime. Unchanged from the template.
    4. WORLD + INPUT    the voxel fashion house (Take a Tea / Steal a Sip block textures and mesher), camera, controls
    5. GAME             5a wardrobe (catalog pieces, colours, voxel display art, themes), 5b the round
    6. SCREENS          lobby, HUD, wear prompt, colour palette, runway card, results, pause
  Art: block textures from the partner's Take a Tea game; UI icons @icons (MIT) plus a few drawn for this game; font Fredoka (OFL).
-->

:root{--ink:#111827;--mut:#6b7280;--bg:#ffffff;--card:#ebedf2;--card2:#dde0e8;
  --green:#10b981;--sky:#0ea5e9;--violet:#7c3aed;--amber:#f59e0b;--rose:#f43f5e;--orange:#f97316;--indigo:#6366f1;--teal:#14b8a6;
  --font:"Fredoka","Arial Rounded MT Bold",system-ui,-apple-system,"Segoe UI",sans-serif;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe6c9;color:var(--ink);font:600 16px/1.35 var(--font);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none}
canvas#view{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;pointer-events:none}
.ui>*{pointer-events:auto}
.vi{display:inline-block;vertical-align:middle;flex:none}
/* HUD: white pills */
.hud{position:fixed;top:calc(var(--sat) + 12px);left:12px;right:12px;display:flex;gap:10px;justify-content:space-between;align-items:flex-start;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:10px;padding:8px 18px 8px 8px;border-radius:999px;background:#fff;font-weight:700;font-size:24px;color:var(--ink)}
.pill .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff}.pill .ic .vi{width:22px;height:22px}
.pill small{font-weight:600;color:var(--mut);font-size:14px;text-transform:uppercase;letter-spacing:.08em}
.pill.time.low .ic{background:var(--rose)!important}
.pause{position:fixed;top:calc(var(--sat) + 72px);right:12px;width:52px;height:52px;border-radius:50%;border:0;background:#fff;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.pause .vi{width:22px;height:22px}
/* menus: white panel, off-white cards, game blurred behind */
#veil{position:fixed;inset:0;display:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);background:rgba(20,24,34,.16);pointer-events:none}
body.menu-open #veil{display:block}
.sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100% - 32px - var(--sat) - var(--sab));overflow:auto;padding:0 0 24px;border-radius:28px;background:var(--bg);touch-action:pan-y}
.top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:14px;padding:20px 22px;background:#fff;border-bottom:2px solid #f1f2f6}
.top h1{margin:0;font-size:32px;line-height:1.05}.top small{display:block;font-size:15px;color:var(--mut)}
.body{padding:4px 22px 0}
.lead{font-size:18px;color:#374151;margin:18px 0 4px}
.tile{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;flex:none;color:#fff}.tile .vi{width:28px;height:28px}
.tile.big{width:64px;height:64px;border-radius:18px}.tile.big .vi{width:34px;height:34px}
.h{margin:28px 0 14px;font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}.h small{letter-spacing:0;text-transform:none;font-size:14px;color:#9ca3af;margin-left:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px;margin:20px 0 0}
.stat{background:var(--card);border-radius:20px;padding:16px;text-align:center}.stat b{display:block;font-size:28px;line-height:1.1}.stat small{display:block;font-size:14px;color:var(--mut);margin-top:3px}
.items{display:grid;gap:14px}
.item{display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;background:var(--card);border:2px solid var(--card)}
.item.on{border-color:var(--green)}
.item .txt{flex:1;min-width:0}.item b{display:block;font-size:19px}.item small{display:block;font-size:14px;color:var(--mut);margin-top:3px}
.btns{display:flex;gap:8px;flex:none}
button{appearance:none;border:0;font:700 18px/1 var(--font);cursor:pointer;color:#fff;border-radius:14px;min-height:50px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--green)}
button .vi{width:20px;height:20px}
button:disabled{opacity:.5;cursor:default}button:active{transform:scale(.97)}
button.ghost{background:var(--card2);color:var(--ink)}button.dim{background:var(--card2);color:#9ca3af}
button.go{width:100%;min-height:68px;font-size:26px;border-radius:18px;margin-top:24px}button.go .vi{width:24px;height:24px}
.x{width:50px;height:50px;min-height:0;padding:0;border-radius:50%;background:var(--card2);color:var(--ink);margin-left:auto}
.note{font-size:14px;color:#9ca3af;text-align:center;margin:18px 0 0}
.item.set{flex-wrap:wrap}.item.set .txt{min-width:170px}.seg{display:flex;gap:8px;flex-wrap:wrap}
.pillb{min-height:46px;min-width:64px;padding:0 16px;border-radius:999px;background:var(--card2);color:#374151;font-size:16px}.pillb.on{color:#fff}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 96px);transform:translateX(-50%);padding:12px 18px;border-radius:16px;background:var(--ink);color:#fff;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}.toast.good{background:var(--green)}.toast.bad{background:var(--rose)}
.stick{position:fixed;width:124px;height:124px;border-radius:50%;border:3px solid #ffffffaa;background:#ffffff33;transform:translate(-50%,-50%);pointer-events:none;display:none}
.stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#fff}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:#fff;color:var(--ink);font-size:22px;font-weight:700;transition:opacity .4s}
.loading.done{opacity:0;pointer-events:none}
[hidden]{display:none!important}
@media (max-width:520px){.top h1{font-size:26px}.item{flex-wrap:wrap}.item .btns{flex:1 1 100%}.item .btns button{flex:1}.stat b{font-size:22px}}
/* ---- Runway Ready additions (same style: white panels, off-white cards, solid colours) ---- */
html,body{background:#efe9e2}
.tile.sm{width:40px;height:40px;border-radius:12px}.tile.sm .vi{width:22px;height:22px}
.how{display:grid;gap:10px;margin:16px 0 0}.how div{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:10px 14px 10px 10px;font-size:16px;color:#374151}
/* theme card (top left) */
.tcard{pointer-events:auto;position:fixed;top:calc(var(--sat) + 12px);left:12px;width:min(290px,calc(100% - 150px));padding:12px 14px 12px 12px;border-radius:22px;background:#fff;cursor:pointer}
.tcard .th{display:flex;gap:10px;align-items:center}.tcard .th small{display:block;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}.tcard .th b{display:block;font-size:22px;line-height:1.05}
.tcard p{margin:8px 0 6px;font-size:14px;color:#4b5563}
.tcard ul,.sc ul,ul.checks{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.tcard li,.sc li,ul.checks li{display:flex;gap:8px;align-items:center;font-size:15px;line-height:1.15}
.tcard li i,.sc li i,ul.checks li i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--card2);color:#4b5563}
.tcard li i .vi,.sc li i .vi,ul.checks li i .vi{width:15px;height:15px}
.tcard li.ok i,.sc li.ok i,ul.checks li.ok i{background:var(--green);color:#fff}.tcard li.no i,.sc li.no i,ul.checks li.no i{background:var(--card2);color:#9ca3af}
.tcard li.tip{font-size:14px;color:#9ca3af;padding-left:2px}
.tcard.mini p,.tcard.mini ul{display:none}
ul.checks li{background:var(--card);border-radius:14px;padding:8px 12px 8px 8px;font-size:16px}ul.checks li span{flex:1}ul.checks li b{font-size:18px}ul.checks li.ok b{color:var(--green)}ul.checks li.no b{color:#9ca3af}
.hud .right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;margin-left:auto}
.ready{position:fixed;top:calc(var(--sat) + 136px);right:12px;min-height:52px;border-radius:999px;background:var(--green);font-size:18px;padding:0 18px}
/* bottom-right dock: the wear prompt and the colour palette */
.dock{position:fixed;right:12px;bottom:calc(var(--sab) + 12px);width:min(430px,calc(100% - 24px));display:flex;flex-direction:column;gap:10px;pointer-events:none}
.dock>*{pointer-events:auto}
.pcard{display:flex;align-items:center;gap:12px;padding:12px;border-radius:22px;background:#fff}
.pcard .txt{flex:1;min-width:0}.pcard b{display:block;font-size:19px;line-height:1.1}.pcard small{display:block;font-size:14px;color:var(--mut);margin-top:3px}
.pcard button{min-height:56px;font-size:20px;border-radius:16px;padding:0 20px}
.pal{padding:12px;border-radius:22px;background:#fff}
.pal .ph{display:flex;align-items:center;gap:10px;margin-bottom:10px}.pal .ph .txt{flex:1;min-width:0}.pal .ph b{display:block;font-size:17px}.pal .ph small{display:block;font-size:14px;color:var(--mut)}
.pal .dot{width:34px;height:34px;border-radius:50%;flex:none}
.pal .x{width:46px;height:46px;background:var(--green);color:#fff}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
.swb{min-height:42px;height:42px;padding:0;border-radius:12px}.swb .vi{width:18px;height:18px}
/* banners, tags, runway card */
.banner{position:fixed;left:50%;top:calc(var(--sat) + 22%);transform:translateX(-50%);text-align:center;pointer-events:none;transition:opacity .3s;width:min(560px,calc(100% - 32px))}
.banner.out{opacity:0}
.banner .bt{display:inline-block;padding:10px 26px;border-radius:22px;color:#fff;font-size:40px;line-height:1.1}
.banner small{display:block;margin:10px auto 0;padding:8px 16px;border-radius:14px;background:#fff;font-size:18px;color:#374151;width:fit-content;max-width:100%}
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;display:none;padding:4px 12px;border-radius:999px;background:#fff;color:var(--ink);font-size:15px;white-space:nowrap}
.tag.st{font-size:15px;background:#ffffffee}.tag.st b{font-weight:700}
.tag.who{background:#111827cc;color:#fff;font-size:14px}.tag.who.me{background:var(--rose)}
.sc{position:fixed;left:50%;bottom:calc(var(--sab) + 14px);transform:translateX(-50%);width:min(440px,calc(100% - 24px));padding:14px;border-radius:22px;background:#fff}
.sc .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.sc .sh b{font-size:22px}
.sc .pts{color:#fff;border-radius:999px;padding:6px 14px;font-size:18px;font-weight:700}
.skip{position:fixed;top:calc(var(--sat) + 12px);right:12px;background:#fff;color:var(--ink);border-radius:999px}
.item .score{font-size:26px;margin-left:auto}

<body>
<canvas id="view"></canvas>
<div id="tags"></div>
<div id="veil"></div>
<div class="ui">
  <div class="hud" id="hud" hidden>
    <div class="tcard nopass" id="tcard"><div class="th"><span class="tile sm" id="tIcon"></span><div><small>Theme</small><b id="tName"></b></div></div><p id="tDesc"></p><ul id="tRules"></ul></div>
    <div class="right"><span class="pill time" id="hudTimeWrap"><span class="ic" style="background:var(--sky)" id="hudClock"></span><span id="hudTime">90</span></span></div>
  </div>
  <button class="pause" id="pauseBtn" hidden aria-label="Pause"></button>
  <button class="ready" id="readyBtn" hidden aria-label="I'm ready: start the runway"></button>
  <div class="dock nopass" id="dock"><div class="pal" id="palette" hidden></div><div class="pcard" id="prompt" hidden></div></div>
  <div class="banner" id="banner" hidden></div>
  <div class="sc nopass" id="showCard" hidden></div>
  <button class="skip" id="skipBtn" hidden>Skip show</button>
  <div class="sheet" id="lobby" hidden></div>
  <div class="sheet" id="results" hidden></div>
  <div class="stick" id="stick"><i></i></div>
  <div class="toast" id="toast" role="status"></div>
</div>
<div class="loading" id="loading">Getting dressed…</div>

ll=\"currentColor\" d=\"M5 8a1 1 0 0 1 0 2H3.418a5 5 0 0 0 3.93 2.957A5 5 0 0 0 12.33 10.5a1 1 0 0 1 1.733 1 7.003 7.003 0 0 1-10.678 1.762A7 7 0 0 1 2 11.603V13a1 1 0 1 1-2 0V9a1 1 0 0 1 1-1zM4.904 1.721a7 7 0 0 1 7.711 1.016A7 7 0 0 1 14 4.397V3a1 1 0 0 1 2 0v4a1 1 0 0 1-1 1h-4a1 1 0 1 1 0-2h1.582a5 5 0 0 0-3.93-2.957A5 5 0 0 0 3.67 5.5a1 1 0 0 1-1.732-1A7 7 0 0 1 4.904 1.72\"></path>", "play": "<path fill=\"currentColor\" d=\"M3 2.803a1 1 0 0 1 1.5-.865l9 5.195a1 1 0 0 1 0 1.733l-9 5.196a1 1 0 0 1-1.5-.866z\"></path>", "pause": "<path fill=\"currentColor\" d=\"M5 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM13 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1z\"></path>", "eye": "<path fill=\"currentColor\" d=\"M8 3c3.218 0 5.788 3.235 6.67 4.501a.865.865 0 0 1 0 .998C13.789 9.765 11.219 13 8 13S2.21 9.765 1.329 8.499a.865.865 0 0 1 0-.998c.882-1.266 3.453-4.5 6.67-4.501m0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6\"></path>", "flower": "<path fill=\"currentColor\" d=\"M5 12a3 3 0 0 1 3 3H6a3 3 0 0 1-3-3zM13 12a3 3 0 0 1-3 3H8a3 3 0 0 1 3-3zM8 1a2 2 0 0 1 2 2q-.002.144-.023.283A2 2 0 0 1 12.32 6.5a2 2 0 0 1-2.343 3.216q.021.139.023.284a2 2 0 1 1-3.978-.284C5.722 9.895 5.374 10 5 10a2 2 0 0 1-1.32-3.5 2 2 0 0 1 2.343-3.217A2 2 0 0 1 8 1m0 3.5a2 2 0 1 0 0 4 2 2 0 0 0 0-4\"></path>", "sun": "<path fill=\"currentColor\" d=\"M8 4a4 4 0 1 1 0 8 4 4 0 0 1 0-8\"></path> <path fill=\"currentColor\" d=\"M10 3h3v3l2 2-2 2v3h-3l-2 2-2-2H3v-3L1 8l2-2V3h3l2-2zM8 3a5 5 0 1 0 0 10A5 5 0 0 0 8 3\"></path>", "snowflake": "<path fill=\"currentColor\" d=\"M8 1a1 1 0 0 1 1 1v1h.5a.5.5 0 0 1 0 1H9v2.233l1.93-1.158-.216-.374a.5.5 0 0 1 .866-.5l.207.36.698-.418a1 1 0 0 1 1.03 1.714l-.727.436.292.506a.5.5 0 1 1-.866.5l-.284-.491L9.943 8l1.987 1.191.284-.49a.5.5 0 0 1 .866.5l-.292.505.727.437a1 1 0 0 1-1.03 1.714l-.698-.418-.207.36a.5.5 0 1 1-.866-.5l.216-.375L9 9.766V12h.5a.5.5 0 0 1 0 1H9v1a1 1 0 1 1-2 0v-1h-.5a.5.5 0 0 1 0-1H7V9.766l-1.93 1.158.216.375a.5.5 0 0 1-.866.5l-.208-.36-.697.418a1 1 0 0 1-1.03-1.714l.726-.437-.291-.505a.5.5 0 0 1 .866-.5l.283.49L6.056 8 4.069 6.808l-.283.49a.5.5 0 0 1-.866-.5l.29-.505-.725-.436a1 1 0 0 1 1.03-1.714l.697.418.208-.36a.5.5 0 1 1 .866.5l-.217.374L7 6.233V4h-.5a.5.5 0 0 1 0-1H7V2a1 1 0 0 1 1-1\"></path>", "planet": "<path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M8 3c.9 0 1.745.239 2.474.655 2.186-.646 3.924-.574 4.454.345S14.652 6.46 13 8.03a5 5 0 0 1-7.473 4.314c-2.186.646-3.924.575-4.454-.344S1.347 9.54 3 7.969A5 5 0 0 1 8 3m4.696 1.134c-.262-.453-1.021-.561-2.053-.377.408.254.779.566 1.099.928-.008.016-.697 1.557-3.743 3.315-3.044 1.758-4.723 1.585-4.742 1.583a5 5 0 0 1-.255-1.414c-.674.801-.959 1.512-.698 1.965.553.956 3.326.389 6.195-1.268s4.749-3.776 4.197-4.732\" clip-rule=\"evenodd\"></path>", "shirt": "<path fill=\"currentColor\" d=\"M5.2 1.5 1 3.6l1.5 3.3 1.7-.8v8.4h7.6V6.1l1.7.8L15 3.6l-4.2-2.1C10.4 2.7 9.3 3.5 8 3.5S5.6 2.7 5.2 1.5Z\"></path>", "dress": "<path fill=\"currentColor\" d=\"M6 1h1l1 1.6L9 1h1l-.3 4.2 1 1.3L14 14.5H2l3.3-8 1-1.3z\"></path>", "skirt": "<path fill=\"currentColor\" d=\"M4 2h8l.8 2.2H3.2zM3 5.4h10l2 9.1H1z\"></path>", "hat": "<path fill=\"currentColor\" d=\"M5 3.2C5 2.2 6.3 1.5 8 1.5s3 .7 3 1.7V9c2.4.3 4 1 4 2 0 1.3-3.1 2.3-7 2.3S1 12.3 1 11c0-1 1.6-1.7 4-2z\"></path>", "hanger": "<path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M8 1.5a2.2 2.2 0 0 1 2.2 2.2c0 .9-.6 1.6-1.4 2l-.1.6 6.4 4.6c.9.6.4 2-.6 2H1.5c-1 0-1.5-1.4-.6-2l6.4-4.6V5.2c0-.4.3-.6.7-.7.5-.1.9-.4.9-.8a.9.9 0 0 0-1.8 0H5.8A2.2 2.2 0 0 1 8 1.5Zm0 6.4-4.4 3.2h8.8z\"></path>", "heart": "<path fill=\"currentColor\" d=\"M8 14.2 1.9 8.3A3.7 3.7 0 0 1 8 3.4a3.7 3.7 0 0 1 6.1 4.9z\"></path>"};
const vi = k => '<svg class="vi" viewBox="0 0 16 16" fill="none" aria-hidden="true">' + (VI[k] || VI.star) + '</svg>';

const SETTINGS = {
  title: 'Runway Ready',
  tagline: 'Dress to the theme before time runs out, then strut the runway.',
  runSeconds: 120,                     // dressing time; the app's CONFIG.game.runSeconds overrides this when embedded
  collectible: 'style points',
  botSeed: 'runway',                   // fixed seed so the rivals look the same every visit
  // power-ups used when the game runs on its own (demo). Embedded, the app's CONFIG.game.shop is used instead.
  // effects this game knows: time (+seconds), hints (live theme checks), speed (walk faster), flair (judges' flair floor)
  demoShop: [
    { id: 'time',  name: 'Extra Time',  desc: '+30 seconds to get dressed',              cost: 4, effect: 'time',  amount: 30 },
    { id: 'hints', name: 'Style Hints', desc: 'See which theme checks you pass, live',   cost: 5, effect: 'hints', amount: 1 },
    { id: 'speed', name: 'Fast Feet',   desc: 'Walk 35% faster',                         cost: 5, effect: 'speed', amount: 1.35 },
    { id: 'flair', name: 'Spotlight',   desc: 'The judges’ flair never goes below 15',   cost: 8, effect: 'flair', amount: 15 }
  ],
  demoPoints: 40,
  // where the avatar runtime lives (first one that loads wins): on the site, then in the dev kit
  runtime: ['../../assets/sandy-runtime.js', '../vendor/sandy-runtime.js', 'https://grugdigital.pages.dev/assets/sandy-runtime.js']
};

/* =====================================================================================
   2. BRIDGE · the rewards app protocol (window.postMessage, every message carries rw:1)
     game → app  {t:'hello'}                ← {t:'state', points, pearls?, pearlName?, inv, best, runs, shop, title, collectible, runSeconds, brand, store, avatar?, player?}
                 {t:'buy', id, req}         ← {t:'reply', req, ok, reason?, state}   app takes points/Pearls, adds 1 to inv[id]
                 {t:'use', ids:[…], req}    ← {t:'reply', req, ok, reason?, state}   removes 1 of each (the run has started)
                 {t:'score', score, beans, level?}   the app keeps the best score and counts the run
                 {t:'needPearls', id}       the app offers to sell Pearls and returns the player to the game
     app → game  {t:'pause'} when the player leaves the Game tab; a fresh {t:'state'} whenever points change.
   On its own (no app answers within 1.5 s) the game runs in demo mode with pretend points saved on this device.
   ===================================================================================== */
const Bridge = (() => {
  const embedded = window.parent && window.parent !== window;
  const DEMO_KEY = 'grug-starter-demo:' + SETTINGS.title;
  let state = null, mode = 'pending', reqN = 0; const waiting = new Map(), listeners = [];
  const post = m => { try { window.parent.postMessage(Object.assign({ rw: 1 }, m), '*'); } catch (e) {} };
  const demoLoad = () => { let d = null; try { d = JSON.parse(localStorage.getItem(DEMO_KEY) || 'null'); } catch (e) {}
    return Object.assign({ points: SETTINGS.demoPoints, inv: {}, best: 0, runs: 0 }, d || {}); };
  const demoSave = () => { try { localStorage.setItem(DEMO_KEY, JSON.stringify({ points: state.points, inv: state.inv, best: state.best, runs: state.runs })); } catch (e) {} };
  function setState(s) { state = Object.assign({ points: 0, pearls: 0, inv: {}, best: 0, runs: 0, shop: SETTINGS.demoShop }, s || {}); if (!Array.isArray(state.shop) || !state.shop.length) state.shop = SETTINGS.demoShop; listeners.forEach(f => f(state)); }
  addEventListener('message', e => {
    const d = e.data; if (!d || d.rw !== 1 || e.source !== window.parent) return;
    if (d.t === 'state') { mode = 'live'; const { t, rw, ...s } = d; setState(s); }
    else if (d.t === 'reply') { if (d.state) setState(d.state); const w = waiting.get(String(d.req)); if (w) { waiting.delete(String(d.req)); w(d); } }
    else if (d.t === 'pause') { listeners.forEach(f => f(state, 'pause')); }
  });
  function ask(m) { const req = String(++reqN); return new Promise((ok, no) => { waiting.set(req, ok); post(Object.assign({ req }, m)); setTimeout(() => { if (waiting.delete(req)) no(new Error('no answer')); }, 6000); }); }
  function start() {
    if (embedded) post({ t: 'hello' });
    setTimeout(() => { if (mode === 'pending') { mode = 'demo'; setState(Object.assign({ demo: true }, demoLoad())); } }, embedded ? 1500 : 0);
  }
  const wallet = () => (state ? (+state.points || 0) + (+state.pearls || 0) : 0);
  async function buy(id) {
    const it = (state.shop || []).find(x => x.id === id); if (!it) return { ok: false, reason: 'Not in the shop.' };
    if (wallet() < it.cost) {
      if (mode === 'live' && state.pearlName) { post({ t: 'needPearls', id }); return { ok: false, reason: '', asked: true }; }
      return { ok: false, reason: 'You need ' + (it.cost - wallet()) + ' more points for ' + it.name + '.' };
    }
    if (mode === 'demo') { state.points -= it.cost; state.inv[id] = (state.inv[id] || 0) + 1; demoSave(); setState(state); return { ok: true }; }
    return ask({ t: 'buy', id });
  }
  async function use(ids) {
    if (!ids.length) return { ok: true };
    if (mode === 'demo') { for (const id of ids) { if (!(state.inv[id] > 0)) return { ok: false, reason: 'Out of that power-up.' }; } ids.forEach(id => { state.inv[id]--; if (!state.inv[id]) delete state.inv[id]; }); demoSave(); setState(state); return { ok: true }; }
    return ask({ t: 'use', ids });
  }
  function score(score, beans, level) {
    if (mode === 'demo') { state.runs++; state.best = Math.max(state.best, score); demoSave(); setState(state); return; }
    post({ t: 'score', score: Math.floor(score), beans: Math.floor(beans || 0), level: level || 0 });
  }
  return { start, buy, use, score, on: f => listeners.push(f), get state() { return state; }, get mode() { return mode; }, wallet };
})();

/* =====================================================================================
   3. AVATARS · the site's 3D avatar runtime (three.js r149 + SandyKit, ~15 MB, cached by the browser)
   - The player wears the look saved by the Grug avatar editor on this phone (localStorage 'grug.sandy.v1').
   - Every bot is a female Sandy: SandyKit.randomConfig(seed, {body:'female'}).
   - Keep the scene in her own units: 1 unit = 1 cm (she is ~170 cm tall). Her hair breaks at tiny scales, so
     never shrink her to fit a world in metres; size the world in cm instead.
   ===================================================================================== */
const Avatars = (() => {
  let K = null;
  function loadOne(src) { return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = () => window.SandyKit ? ok(window.SandyKit) : no(new Error('no SandyKit')); s.onerror = () => { s.remove(); no(new Error('failed ' + src)); }; document.head.appendChild(s); }); }
  async function load() {
    if (window.SandyKit) return (K = window.SandyKit);
    for (const src of SETTINGS.runtime) { try { return (K = await loadOne(src)); } catch (e) {} }
    throw new Error('Avatar runtime not found');
  }
  function playerConfig() { let c = null; try { c = JSON.parse(localStorage.getItem('grug.sandy.v1') || 'null'); } catch (e) {} return K.merge(K.DEFAULT, c && typeof c === 'object' ? c : {}); }
  function botConfig(i, shirt) { const c = K.randomConfig(SETTINGS.botSeed + '-' + i, { body: 'female' }); c.weapon = null; if (shirt) { c.top = null; c.legs = null; c.outfit = Object.assign({}, c.outfit, { shirt, shorts: '#24262b' }); } return c; }
  return { load, playerConfig, botConfig, get K() { return K; } };

/* =====================================================================================

  function settings() {
    return '<div class="h" style="color:var(--sky)">Graphics<small>lower it if the game feels slow</small></div><div class="items">' +
      '<div class="item set">' + tile('gauge', 'var(--sky)') + '<div class="txt"><b>Quality</b><small>' + (View.o.quality === 'auto' ? 'Auto is using ' + View.Q[View.level].n + (View.fps ? ' · ' + View.fps + ' fps' : '') : 'Medium suits most phones.') + '</small></div>' + seg([['auto', 'Auto'], ['low', 'Low'], ['medium', 'Medium'], ['high', 'High']], View.o.quality, 'data-gfx', 'var(--sky)') + '</div>' +
      '<div class="item set">' + tile('star', 'var(--indigo)') + '<div class="txt"><b>Sharpness</b><small>Fewer pixels runs faster.</small></div>' + seg([[0.6, '60%'], [0.8, '80%'], [1, '100%']], View.o.scale, 'data-scale', 'var(--indigo)') + '</div></div>';

    ['shirt', 'var(--sky)', 'Each room has one kind of clothing. Step on a pad, or press ' + (touch ? 'Wear' : 'E') + ', to put a piece on.'],
    ['swatches', 'var(--violet)', 'Pick a colour for what you just put on' + (touch ? '' : ' (Q and R change it too)') + '.'],
    ['trophy', 'var(--amber)', 'Theme checks give up to 70 points. The judges’ flair adds up to 30 at random.']];
  function lobby() {

    $('lobby').innerHTML = '<div class="top">' + tile('hanger', 'var(--rose)') + '<div><h1>' + esc(s.title || SETTINGS.title) + '</h1><small>' + esc(s.store || (s.demo ? 'Demo mode · pretend points' : '')) + '</small></div></div><div class="body">' +
      '<p class="lead">' + esc(SETTINGS.tagline) + '</p>' +
      '<div class="how">' + HOW.map(([k, c, t]) => '<div>' + tile(k, c, 'sm') + '<span>' + esc(t) + '</span></div>').join('') + '</div>' +
      '<div class="stats">' + (solo ? '' : '<div class="stat"><b style="color:var(--violet)">' + (s.points || 0) + '</b><small>Points</small></div>') + (s.pearlName ? '<div class="stat"><b style="color:var(--sky)">' + (s.pearls || 0) + '</b><small>' + esc(s.pearlName) + '</small></div>' : '') + '<div class="stat"><b style="color:var(--amber)">' + (s.best || 0) + '</b><small>Best</small></div></div>' +

          '<button class="' + (can ? '' : 'dim') + '" style="' + (can ? 'background:' + c : '') + '" data-buy="' + esc(it.id) + '">' + it.cost + unit + '</button></div></div>'; }).join('') + '</div>' +
      '<button class="go" id="goBtn">' + vi('play') + 'Start' + (picked.size ? ' with ' + picked.size + ' power-up' + (picked.size > 1 ? 's' : '') : '') + '</button>' +

      const f = {}; ids.forEach(id => { const it = Bridge.state.shop.find(x => x.id === id); if (it) f[it.effect] = it.effect === 'time' ? (f.time || 0) + (+it.amount || 0) : (+it.amount || 1); });

  $('tcard').addEventListener('click', () => $('tcard').classList.toggle('mini'));

  /* ---------- HUD ---------- */
  function hud(on) { $('hud').hidden = !on; $('pauseBtn').hidden = !on; $('readyBtn').hidden = !on; if (!on) { prompt(null); palette(false); } }
  function tick(t) { $('hudTime').textContent = Math.ceil(t); $('hudTimeWrap').classList.toggle('low', t < 10 && Game.G.phase === 'dress'); }
  // the theme card: the five checks; with Style Hints, each shows whether you pass it right now

    $('tRules').innerHTML = th.rules.map(r => { const ok = r.ok(o);
      return '<li class="' + (live ? (ok ? 'ok' : 'no') : '') + '"><i>' + (live ? vi(ok ? 'checkmark' : 'cross') : vi(S5_ICON[r.s] || 'star')) + '</i><span>' + esc(r.t) + '</span></li>'; }).join('') +

  const tagPool = [], v3 = { x: 0, y: 0, z: 0 };

/* ---------- boot ---------- */
(async function boot() {
  const load = document.getElementById('loading');
  try { await Avatars.load(); } catch (e) { console.warn('Avatars off:', e.message); }
  if (!window.THREE) { load.textContent = 'This game needs the Grug avatar runtime (sandy-runtime.js).'; return; }

  const img = new Image(); img.src = 'data:image/png;base64,' + ATLAS_B64; await img.decode();
  buildWorld(img);
  await Game.setup();
  load.classList.add('done'); Bridge.start();
  (function frame() { const raw = clock.getDelta(), dt = Math.min(0.05, raw); Game.step(dt); renderer.render(scene, camera); if (Game.running) View.tick(raw, clock.elapsedTime); requestAnimationFrame(frame); })();
})();
