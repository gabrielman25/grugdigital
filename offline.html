<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F3F5">
<meta name="robots" content="noindex">
<title>You’re offline · Grug</title>
<link rel="icon" href="/favicon.png">
<!-- Shown by sw.js when there is no connection and the page asked for was never saved on this device. Self-contained:
     the font and the dino are the only other files, and both are kept by every app. -->
<style>
@font-face{font-family:'Fredoka';font-weight:300 700;font-display:swap;src:url(/assets/fonts/fredoka.woff2) format('woff2')}
html,body{margin:0;min-height:100%;background:#F3F3F5;color:#1E1B16;font-family:Fredoka,system-ui,sans-serif}
@media (prefers-color-scheme:dark){html,body{background:#17171A;color:#F3F3F5}.card{background:#232327!important}}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;box-sizing:border-box}
.card{background:#fff;border-radius:1.6rem;padding:2rem 1.6rem;max-width:24rem;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.08)}
.card img{width:4.5rem;height:4.5rem;border-radius:1.2rem}
h1{font-weight:600;font-size:1.5rem;margin:1rem 0 .4rem}
p{margin:.4rem 0 1.2rem;line-height:1.45;opacity:.8}
.row{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}
a,button{border:0;border-radius:999px;padding:.7rem 1.2rem;font:600 1rem Fredoka,system-ui,sans-serif;cursor:pointer;text-decoration:none;background:#9BE338;color:#1E1B16;box-shadow:0 3px 0 #6FB31C}
a.q{background:transparent;color:inherit;box-shadow:inset 0 0 0 2px rgba(127,127,127,.35)}
</style>
</head>
<body>
<main><div class="card">
  <img alt="" src="/app/icons/grug-192.png" id="ic">
  <h1>You’re offline</h1>
  <p>This page isn’t saved on this device yet. Everything you’ve already opened still works, and this page will be here once you’re back online.</p>
  <div class="row"><button type="button" onclick="location.reload()">Try again</button><a class="q" href="/" id="home">Home</a></div>
</div></main>
<script>
// on the restaurant side, point at the dashboard instead of the games
try { if (/^\/(business|restaurant)\//.test(location.pathname) || sessionStorage.getItem('grug.pwa') === 'daypart') {
  document.getElementById('home').href = '/business/'; document.getElementById('home').textContent = 'Dashboard';
  document.getElementById('ic').src = '/app/icons/daypart-192.png'; } } catch (e) {}
addEventListener('online', () => location.reload());
</script>
</body>
</html>
