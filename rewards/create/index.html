<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><script>/* old address → new home */(function(){var p=location.pathname;if(location.hostname==='gabrielman25.github.io'&&p.indexOf('/grugdigital/')===0)location.replace('https://grugdigital.pages.dev/'+p.slice(13)+location.search+location.hash);})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Make a rewards card · Grug</title>
<meta name="description" content="Make a free rewards card for your café, bar or restaurant in seven quick questions. Download it as a PDF and put it by your register.">
<meta name="theme-color" content="#17171A">
<link rel="icon" href="../../favicon.png">
<link rel="stylesheet" href="../../assets/grug.css">
<script src="../../assets/theme.js"></script>
<link rel="stylesheet" href="../../assets/rewards.css">
<style>
/* one question per slide: the answers on the left, the question (and a live preview) on the right; stacked on phones */
.wz{max-width:1040px;padding-top:10px}
.wz-top{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.wz-top a{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-weight:700;font-size:15px;flex:none}
.wz-top a .gi{width:18px;height:18px}
.wz-bar{flex:1;height:10px;border-radius:999px;background:#2C2C31;overflow:hidden}
.wz-bar i{display:block;height:100%;width:0;background:var(--mode);border-radius:999px;transition:width .35s var(--spring)}
.wz-count{flex:none;color:var(--mut);font-weight:700;font-size:14px;min-width:84px;text-align:right}
.wz-slide{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:start;min-height:440px}
.wz-slide.in{animation:wz-in .32s var(--spring)}
@keyframes wz-in{from{opacity:0;transform:translateX(18px)}}
.wz-slide.back.in{animation-name:wz-back}
@keyframes wz-back{from{opacity:0;transform:translateX(-18px)}}
.wz-q{position:sticky;top:calc(var(--top) + var(--sat) + 20px)}
.wz-q .n{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--mode);color:var(--on-sel);font-weight:700;font-size:18px;box-shadow:0 3px 0 var(--mode-lo)}
.wz-q h1{font-size:clamp(30px,4.6vw,44px);margin:14px 0 8px}
.wz-q p{color:var(--ink2);font-size:17px;max-width:34ch}
.wz-prev{margin-top:22px;max-width:340px}
.wz-prev .rw-slot.on{font-size:22px}
.wz-a{display:flex;flex-direction:column;gap:10px;max-width:520px}
.wz-opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:18px;background:#232327;border:2px solid var(--line2);color:var(--ink);font:600 18px var(--display);cursor:pointer;transition:border-color .15s,transform .15s var(--spring),background .15s}
.wz-opt:hover{border-color:#55555D;transform:translateX(3px)}
.wz-opt .ic{width:44px;height:44px;border-radius:13px;background:#2F2F35;display:grid;place-items:center;font-size:24px;flex:none;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.wz-opt .ic .gi{width:22px;height:22px}
.wz-opt .t{flex:1;min-width:0}
.wz-opt small{display:block;font:500 14px var(--font);color:var(--mut);margin-top:2px}
.wz-opt .tag{font:700 12px var(--font);padding:4px 10px;border-radius:999px;background:var(--mode);color:var(--on-sel);flex:none}
.wz-opt .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);flex:none;display:grid;place-items:center;color:var(--on-sel)}
.wz-opt .ck .gi{width:16px;height:16px;opacity:0}
.wz-opt[aria-checked=true]{border-color:var(--mode);background:#2A2520}
.wz-opt[aria-checked=true] .ck{background:var(--mode);border-color:var(--mode)}
.wz-opt[aria-checked=true] .ck .gi{opacity:1}
.wz-opt.ghost{border-style:dashed;background:none;color:var(--ink2)}
.wz-name{font:600 26px var(--display);min-height:66px;padding:12px 18px;border-radius:18px}
.wz-sw{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;max-width:420px}
.wz-sw button,.wz-sw label{aspect-ratio:1;border-radius:50%;border:0;box-shadow:inset 0 -5px 0 rgba(0,0,0,.25);cursor:pointer;position:relative}
.wz-sw [aria-checked=true]{outline:4px solid var(--ink);outline-offset:4px}
.wz-sw label{background:#303036;display:grid;place-items:center;color:var(--ink);font-size:28px;font-weight:700;overflow:hidden}
.wz-sw label input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.wz-emo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:400px}
.wz-emo button{aspect-ratio:1;border-radius:18px;border:2px solid var(--line2);background:#232327;font-size:38px;display:grid;place-items:center;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;cursor:pointer;transition:transform .15s var(--spring)}
.wz-emo button:hover{transform:scale(1.05)}
.wz-emo button[aria-checked=true]{border-color:var(--mode);background:#2A2520;box-shadow:0 4px 0 var(--mode-lo)}
.wz-pct{display:flex;flex-wrap:wrap;gap:8px;padding:6px 2px 4px}
.wz-pct button{min-width:64px;min-height:46px;border-radius:14px;border:2px solid var(--line2);background:#232327;color:var(--ink);font:700 17px var(--display);cursor:pointer}
.wz-pct button[aria-checked=true]{background:var(--mode);border-color:var(--mode);color:var(--on-sel)}
.wz-pct-l{font-weight:600;color:var(--ink2);margin:8px 2px 0}
.wz-nav{display:flex;justify-content:space-between;gap:10px;margin:28px 0 10px;max-width:520px}
.wz-nav .g-btn{min-width:130px}
/* the last slide */
.wz-done .wz-q img{display:block;width:100%;max-width:330px;border-radius:16px;margin-top:20px;box-shadow:0 0 0 1px var(--line2)}
.wz-big{min-height:66px;font-size:21px;width:100%}
.wz-acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wz-acts .g-btn{width:100%}
.wz-saved{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:15px}
.wz-saved .gi{width:20px;height:20px;color:var(--mode);flex:none}
.wz-saved a{color:var(--mode);font-weight:700}
.wz-share{border-radius:18px;background:#232327;border:1px solid var(--line);padding:4px 16px}
.wz-share h3{font-size:17px;padding:12px 0 2px}
.wz-row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.wz-row:first-of-type{border-top:0}
.wz-row .ic{width:38px;height:38px;border-radius:11px;background:#2F2F35;display:grid;place-items:center;flex:none}
.wz-row .ic .gi{width:20px;height:20px;color:var(--mode)}
.wz-row div{flex:1;min-width:0}
.wz-row b{display:block;font-size:16px}
.wz-row span{display:block;color:var(--ink2);font-size:14px;margin-top:2px}
.wz-row .g-btn{flex:none;margin-top:2px}
.wz-up{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:16px;border-radius:18px;border:2px solid var(--mode)}
.wz-up b{display:block;font-size:17px}
.wz-up span{color:var(--ink2);font-size:14px}
@media (max-width:820px){
  .wz-slide{grid-template-columns:minmax(0,1fr);gap:18px;min-height:0}
  .wz-q{position:static;order:-1}
  .wz-q h1{margin:10px 0 4px}
  .wz-prev{display:none}
  .wz-done .wz-q img{max-width:260px}
  .wz-a,.wz-nav{max-width:none}
}
@media (prefers-reduced-motion:reduce){.wz-slide.in{animation:none}}
</style>
</head>
<body>
<main class="wrap wz">
  <div class="wz-top"><a href="../" id="exit"></a><div class="wz-bar"><i id="bar"></i></div><span class="wz-count" id="count"></span></div>
  <section class="wz-slide" id="slide"></section>
  <div class="wz-nav" id="nav"><button type="button" class="g-btn" id="backBtn">Back</button><button type="button" class="g-btn primary" id="nextBtn">Next</button></div>
</main>
<script src="../../assets/catalog.js"></script>
<script src="../../assets/icons.js"></script>
<script src="../../assets/games.js"></script>
<script src="../../assets/grug.js"></script>
<script src="../../assets/qrcode.js"></script>
<script src="../../assets/rewards.js"></script>
<script>
(function(){
  const G = Grug, RW = GrugRewards, esc = G.esc, $ = s => document.querySelector(s);
  G.ui.chrome('rewards', { title: 'Make a card', noRole: true });   // someone making a card doesn't need the "who are you?" question first
  $('#exit').innerHTML = G.icon('arrow-left') + 'Rewards';

  /* the answers so far (?c= = editing a saved card: start on the last slide) */
  const editing = new URLSearchParams(location.search).get('c');
  let cfg = (editing && RW.decode(editing)) || RW.normalize({ n: '', t: 'c', j: 1 });
  let named = !!(editing && RW.decode(editing)), saved = named ? editing : null;
  const touched = new Set(named ? ['i', 's', 'r', 'color'] : []);
  let pctOpen = /^p\d+$/.test(cfg.r);

  const opt = (key, val, icon, label, sub, extra) => '<button type="button" class="wz-opt" role="radio" data-' + key + '="' + val + '" aria-checked="false">' +
    (icon ? '<span class="ic">' + icon + '</span>' : '') + '<span class="t">' + esc(label) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</span>' + (extra || '') + '<span class="ck">' + G.icon('check') + '</span></button>';

  /* the questions */
  const STEPS = [
    { id: 'name', q: 'What’s your shop called?', hint: 'It goes at the top of your card.',
      ok: () => named && cfg.n.trim().length > 0,
      html: () => '<input class="g-input wz-name" id="aName" maxlength="28" autocomplete="organization" placeholder="e.g. Pebble Coffee Bar" value="' + (named ? esc(cfg.n) : '') + '">',
      wire: () => { const i = $('#aName'); i.focus(); i.addEventListener('input', () => { named = i.value.trim().length > 0; set({ n: i.value }); paintNav(); }); } },
    { id: 'kind', q: 'What kind of place is it?', hint: 'We’ll suggest the rest from here.', auto: true,
      html: () => Object.keys(RW.KINDS).map(k => opt('k', k, RW.KINDS[k].i, RW.KINDS[k].label)).join(''),
      pick: el => el.dataset.k, sel: () => cfg.t,
      apply: k => { const d = RW.KINDS[k], p = { t: k }; ['i', 's', 'r', 'color'].forEach(f => { if (!touched.has(f)) p[f] = d[f === 'color' ? 'color' : f]; }); cfg = RW.normalize(Object.assign({}, cfg, p)); pctOpen = /^p\d+$/.test(cfg.r); } },
    { id: 'color', q: 'Choose a brand color', hint: 'Your card and its QR frame use it.',
      html: () => '<div class="wz-sw">' + RW.COLORS.map(c => '<button type="button" role="radio" data-c="' + c + '" style="background:' + c + '" aria-label="Color ' + c + '" aria-checked="false"></button>').join('') +
        '<label title="Any color" id="aCustom" role="radio" aria-checked="false">+<input type="color" aria-label="Pick any color"></label></div>',
      pick: el => el.dataset.c, sel: () => cfg.color, apply: c => set({ color: c }),
      wire: () => { const l = $('#aCustom'), inp = l.querySelector('input'); inp.value = cfg.color.toLowerCase(); inp.addEventListener('input', () => { set({ color: inp.value }); mark(); }); } },
    { id: 'icon', q: 'Choose a stamp icon', hint: 'Guests collect one of these every visit.',
      html: () => '<div class="wz-emo">' + RW.ICONS.map(i => '<button type="button" role="radio" data-i="' + i + '" aria-label="' + i + '" aria-checked="false">' + i + '</button>').join('') + '</div>',
      pick: el => el.dataset.i, sel: () => cfg.i, apply: i => set({ i }) },
    { id: 'stamps', q: 'How many stamps for a reward?', hint: 'Fewer stamps bring people back sooner.', auto: true,
      html: () => [[5, 'Quick to earn'], [6, 'Good for bars'], [8, 'Most popular', true], [10, 'For weekly regulars'], [12, 'For daily regulars']].map(([n, sub, pop]) =>
        opt('s', n, '<b style="font:700 20px var(--display)">' + n + '</b>', n + ' stamps', sub, pop ? '<span class="tag">Popular</span>' : '')).join(''),
      pick: el => +el.dataset.s, sel: () => cfg.s, apply: s => set({ s }) },
    { id: 'reward', q: 'What’s the reward?', hint: 'What guests get when the card is full.',
      ok: () => !pctOpen || /^p\d+$/.test(cfg.r),
      html: () => Object.keys(RW.REWARDS).map(k => opt('r', k, ({ d: '🥤', f: '🍽️', s: '🍰', b: '🎁' })[k], RW.REWARDS[k])).join('') +
        opt('r', 'p', '🏷️', 'A percent off an item') +
        '<div id="pctBox"' + (pctOpen ? '' : ' hidden') + '><p class="wz-pct-l">How much off?</p><div class="wz-pct">' + RW.PCTS.map(p => '<button type="button" role="radio" data-p="' + p + '" aria-checked="false">' + p + '%</button>').join('') + '</div></div>' +
        '<button type="button" class="wz-opt ghost" id="aCustomReward"><span class="ic">' + G.icon('chat-circle') + '</span><span class="t">Something else?<small>Talk to us about a custom reward</small></span></button>',
      pick: el => el.dataset.r, sel: () => pctOpen ? 'p' : cfg.r,
      apply: r => { if (r === 'p') { pctOpen = true; if (!/^p\d+$/.test(cfg.r)) set({ r: 'p10' }); return 'stay'; } pctOpen = false; set({ r }); },
      wire: () => {
        document.querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => { set({ r: 'p' + b.dataset.p }); mark(); G.ui.buzz(); setTimeout(() => go(cur + 1), 320); }));
        $('#aCustomReward').addEventListener('click', customReward);
      } },
    { id: 'welcome', q: 'Give new guests a free welcome stamp?', hint: 'A head start makes people more likely to come back.', auto: true,
      html: () => opt('j', '1', '👋', 'Yes, start them with a stamp', 'Their first scan counts twice', '<span class="tag">Recommended</span>') + opt('j', '0', '🙂', 'No, start at zero'),
      pick: el => el.dataset.j, sel: () => String(cfg.j), apply: j => set({ j: j === '1' }) },
    { id: 'done', done: true }
  ];
  const QUESTIONS = STEPS.length - 1;

  function set(patch) { Object.keys(patch).forEach(k => touched.add(k)); cfg = RW.normalize(Object.assign({}, cfg, patch)); paintPreview(); }
  async function customReward() {
    const go = await G.ui.dialog({ title: 'Want a custom reward?',
      html: '<p>A named menu item, a free class, a members’ perk or anything else is part of a Custom card we set up with you, along with your own game.</p><p style="margin-top:8px">Text us at <b>954-459-6301</b> and tell us what you’d like to give. For now, pick the closest one from the list.</p>',
      actions: [{ label: 'Not now', kind: 'quiet', value: null }, { label: 'Text us', kind: 'primary', value: 'go' }] });
    if (go === 'go') location.href = 'sms:+19544596301?&body=' + encodeURIComponent('Hi! I’m making a rewards card for ' + (named ? cfg.n : 'my shop') + ' and I’d like a custom reward: ');
  }

  /* slides */
  let cur = 0, prevIdx = -1;
  const slide = $('#slide');
  function show(i) {
    i = Math.max(0, Math.min(STEPS.length - 1, i));
    if (i > 0 && !named) i = 0;   // the name comes first
    const st = STEPS[i], back = i < prevIdx; prevIdx = cur = i;
    $('#bar').style.width = (Math.min(i, QUESTIONS) / QUESTIONS * 100) + '%';
    $('#count').textContent = st.done ? 'Done!' : 'Step ' + (i + 1) + ' of ' + QUESTIONS;
    slide.className = 'wz-slide' + (st.done ? ' wz-done' : '') + (back ? ' back' : '');
    void slide.offsetWidth; slide.classList.add('in');
    if (st.done) return showDone();
    slide.innerHTML = '<div class="wz-a" role="radiogroup" aria-labelledby="qh">' + st.html() + '</div>' +
      '<div class="wz-q"><span class="n">' + (i + 1) + '</span><h1 id="qh">' + esc(st.q) + '</h1><p>' + esc(st.hint) + '</p><div class="wz-prev" id="prev"></div></div>';
    if (st.pick) slide.querySelectorAll('[role=radio]:not([data-p]):not(#aCustom)').forEach(b => b.addEventListener('click', () => {
      const r = st.apply(st.pick(b)); mark(); G.ui.buzz();
      if (r === 'stay') { $('#pctBox').hidden = false; paintNav(); return; }
      if (st.id === 'reward') $('#pctBox').hidden = true;
      if (st.auto || st.id === 'reward') setTimeout(() => { if (cur === i) go(i + 1); }, 320);
      paintNav();
    }));
    if (st.wire) st.wire();
    mark(); paintPreview(); paintNav();
    $('#nav').hidden = false;
  }
  function mark() {
    const st = STEPS[cur]; if (!st.sel) return;
    const v = String(st.sel());
    slide.querySelectorAll('[role=radio]:not([data-p]):not(#aCustom)').forEach(b => { const k = Object.keys(b.dataset)[0]; b.setAttribute('aria-checked', String(String(b.dataset[k]).toUpperCase() === v.toUpperCase())); });
    slide.querySelectorAll('[data-p]').forEach(b => b.setAttribute('aria-checked', String('p' + b.dataset.p === cfg.r)));
    const cl = $('#aCustom'); if (cl) { const preset = RW.COLORS.some(c => c.toUpperCase() === cfg.color); cl.setAttribute('aria-checked', String(!preset)); cl.style.background = preset ? '' : cfg.color; cl.style.color = preset ? '' : RW.inkOn(cfg.color); }
  }
  function paintPreview() { const p = $('#prev'); if (p) p.innerHTML = RW.passHtml(Object.assign({}, cfg, { n: named ? cfg.n : 'Your shop' }), Math.min(3, cfg.s - 1)); }
  function paintNav() {
    const st = STEPS[cur];
    $('#backBtn').style.visibility = cur === 0 ? 'hidden' : '';
    $('#nextBtn').disabled = st.ok ? !st.ok() : false;
    $('#nextBtn').textContent = cur === QUESTIONS - 1 ? 'Finish' : 'Next';
  }
  // each slide gets its own history entry, so the phone's back button goes back a question
  function go(i) { const h = '#' + STEPS[Math.max(0, Math.min(STEPS.length - 1, i))].id; if (location.hash !== h) location.hash = h; else show(i); }
  const fromHash = () => { const k = location.hash.slice(1); if (k === 'print') return STEPS.length - 1; const i = STEPS.findIndex(s => s.id === k); return i < 0 ? 0 : i; };
  addEventListener('hashchange', () => show(fromHash()));
  $('#backBtn').addEventListener('click', () => go(cur - 1));
  $('#nextBtn').addEventListener('click', () => { if (!$('#nextBtn').disabled) go(cur + 1); });
  addEventListener('keydown', e => { if (e.key === 'Enter' && !document.querySelector('dialog[open]') && !STEPS[cur].done && !$('#nextBtn').disabled) { e.preventDefault(); go(cur + 1); } });

  /* the last slide: the card, the PDF, and what the links are for */
  function showDone() {
    $('#nav').hidden = true;
    const c = RW.encode(cfg); if (saved !== c) { RW.saveMine(c, saved); saved = c; try { history.replaceState(null, '', '?c=' + c + '#done'); } catch (e) {} }
    const L = RW.links(cfg);
    slide.innerHTML =
      '<div class="wz-a">' +
        '<button type="button" class="g-btn primary wz-big" id="pdfBtn">' + G.icon('download-simple') + 'Download your card (PDF)</button>' +
        '<div class="wz-acts"><a class="g-btn" href="' + esc(L.open) + '" target="_blank" rel="noopener">See it as a guest</a><button type="button" class="g-btn" id="redo">' + G.icon('pencil-simple') + 'Change answers</button></div>' +
        '<p class="wz-saved">' + G.icon('check-circle') + '<span>Saved to <a href="../#mine">Rewards → My creations</a> on this device.</span></p>' +
        '<div class="wz-share"><h3>Sharing it online?</h3>' +
          '<div class="wz-row"><span class="ic">' + G.icon('qr-code') + '</span><div><b>The QR on your card</b><span>Keep it in your shop. Guests scan it at the counter to collect a stamp, once a day.</span></div></div>' +
          '<div class="wz-row"><span class="ic">' + G.icon('share-network') + '</span><div><b>Invite link</b><span>Post it on Instagram or your website. People can save your card, but stamps only come from the QR in your shop.</span></div><button type="button" class="g-btn sm" data-copy="join">Copy</button></div>' +
          '<div class="wz-row"><span class="ic">' + G.icon('device-mobile') + '</span><div><b>NFC sticker</b><span>Optional. Copy the QR’s link onto an NFC sticker so guests can tap instead of scan.</span></div><button type="button" class="g-btn sm" data-copy="stamp">Copy</button></div>' +
        '</div>' +
        '<div class="wz-up"><div><b>Want your own game?</b><span>We build one starring your menu. First partners get 90 days free.</span></div><a class="g-btn sm" href="sms:+19544596301">Text us</a></div>' +
      '</div>' +
      '<div class="wz-q"><span class="n">' + G.icon('check') + '</span><h1>Your card is ready!</h1><p>Download it, print it, and put it by your register.</p><img id="cardImg" alt="Your printable rewards card"></div>';
    RW.cardCanvas(cfg, L.stamp).then(cv => { const im = $('#cardImg'); if (im) im.src = cv.toDataURL('image/png'); });
    $('#pdfBtn').addEventListener('click', async e => {
      const b = e.currentTarget; b.disabled = true;
      try { await RW.downloadPdf(cfg, L.stamp); G.ui.toast('Your card is downloading', { icon: 'download-simple' }); } catch (err) { G.ui.toast('Couldn’t make the PDF. Try again.', { icon: 'warning-circle' }); }
      b.disabled = false;
    });
    $('#redo').addEventListener('click', () => go(0));
    slide.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', async () => {
      const t = b.dataset.copy === 'join' ? L.join : L.stamp;
      try { await navigator.clipboard.writeText(t); b.textContent = 'Copied'; } catch (err) { prompt('Copy this link:', t); }
      setTimeout(() => { b.textContent = 'Copy'; }, 1500);
    }));
  }

  show(named ? (fromHash() || STEPS.length - 1) : 0);
  if (!named && location.hash) history.replaceState(null, '', location.pathname + location.search);
})();
</script>
</body>
</html>
