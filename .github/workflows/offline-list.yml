# Keeps the installed apps (Grug, Daypart) in step with the site.
# On every push, rebuild app/offline.json (python3 tools/pwa/build.py): the list of files each app keeps on the device,
# with a fingerprint per file. If it changed, commit it back to the same branch. Cloudflare Pages then deploys that
# commit, and installed apps download the new and changed files the next time they check (when they open, when the
# connection comes back, and every half hour). Pushes made with this workflow's token don't start it again.
# Sessions should still run the build themselves before committing (CLAUDE.md, "The two apps"): then this finds
# nothing to change and adds no commit.
name: Offline list

on:
  push:
    paths-ignore:
      - app/offline.json

permissions:
  contents: write

concurrency:
  group: offline-list-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild app/offline.json
        run: python3 tools/pwa/build.py
      - name: Commit it if it changed
        run: |
          if git diff --quiet -- app/offline.json; then echo "app/offline.json is up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/offline.json
          git commit -m "Rebuild the offline list (app/offline.json) for the installed apps"
          git push origin HEAD:${{ github.ref_name }}
